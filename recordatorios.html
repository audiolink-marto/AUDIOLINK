<title>Audiolink — Recordatorios</title>
<!-- AUDIOLINK · recordatorios.html · v1.10
     v1.10: se agrega el guard "if(estaModoOfflineActivo())" alrededor
     de auth.onAuthStateChanged() — mismo patrón que ya usaba index.html
     desde v2.23. Sin este cambio, en modo offline (sin señal) el login
     real nunca confirmaba sesión y esta página redirigía siempre a
     login.html, sacando al usuario del modo offline al navegar a esta
     página. No se tocó la lógica interna del guard (qué pasa si hay o
     no hay usuario), solo se envuelve.
     v1.9: se migra al patrón offline Fase 1 (mismo cambio que index.html
     v2.21, proyecto.html v5.34, logistica.html v2.72) — se agrega
     <script src="offline-mock.js"> en el <head> (antes de
     firebase-config.js) y se cambia `const db = firebase.firestore()`
     por `const db = crearDB()`. Con AUDIOLINK_MODO_OFFLINE en false
     (default), crearDB() devuelve firebase.firestore() real — cero
     cambio de comportamiento. No se tocó ninguna otra lógica.
     V1.8: monto opcional por ítem de checklist — útil para listas de
     compras en logística (ej. "Cables XLR" + $45.000), sin ensuciar
     checklists normales que no lo necesitan (campo opcional, si nadie
     lo usa no se muestra ningún total). Input de monto compacto junto
     al de texto al agregar (usa formatCOP() de utils.js, ya existente).
     Cuando al menos un ítem tiene monto, aparece un footer de totales
     dentro de la checklist expandida: "Total" (todos los ítems con
     monto) y "Pendiente" (solo los no marcados con monto) — separado
     con borde superior para distinguirlo de la lista. Ajustes mobile:
     el input de monto usa inputmode="numeric" (teclado numérico en
     mobile) y min-height:44px como el resto de controles del módulo.
     No se tocó toggleSubitem() ni borrarSubitem(), solo agregarSubitem()
     (ahora también lee el monto) y el render.
     V1.7: la sección de checklist no se distinguía bien del resto de
     la meta (chevron era texto gris chico, se perdía entre badges).
     Se le da al chevron fondo/borde propio (deja de ser texto suelto,
     ahora se ve como un botón real, con ícono ☑️) y se mueve fuera de
     la fila de .nota-meta a su propia línea. El bloque .checklist
     expandido ahora tiene borde superior + fondo propio para separarse
     visualmente del resto de la nota. No se tocó la lógica.
     V1.6: la checklist de cada nota ahora es colapsable — antes se
     mostraba siempre abierta si tenía ítems. Nuevo botón chevron junto
     al badge de visibilidad, tipo "▾ Lista (2/5)", que expande/colapsa
     (Set `checklistExpandida` en memoria, empieza colapsada). El input
     "+ agregar ítem" solo aparece cuando la checklist está expandida
     (o si la nota aún no tiene ninguna, para poder crear la primera).
     No se tocó agregarSubitem()/toggleSubitem()/borrarSubitem() ni
     nada más de la lógica.
     V1.5: mismos dos ajustes de amabilidad mobile que index.html v2.18.
     (1) Checkboxes del checklist (.checklist-item input) suben de 16px
     a 20px, con min-height:44px en la fila para mejor área táctil; el
     botón "quitar" (✕) de cada sub-ítem también sube a mínimo 44px
     (antes 24px). (2) Las notas con hora ahora muestran ⏰ antes de la
     hora en la fecha de cada nota, igual que el widget del Dashboard.
     No se tocó la lógica de datos.
     V1.4: tiempoRelativo() y estadoRecordatorio() se mudan a utils.js
     (v1.4) para que el widget del Dashboard (index.html) también las
     use — se retira la copia local de acá, mismo comportamiento. No
     cambia nada más.
     V1.3: tres mejoras a pedido del usuario. (1) Hora opcional junto a
     la fecha (campo `hora`, HH:MM) — permite un contador relativo más
     preciso ("en 3 horas" en vez de solo "hoy"). Se agrega
     tiempoRelativo(), que calcula el texto ("hace 2 días" / "hoy" /
     "en 5 horas" / "en 3 días") comparando contra la hora real del
     dispositivo — recalculado cada vez que se abre la página, no un
     timer corriendo en segundo plano (JS no corre en background sin
     Service Worker, y este ecosistema no tiene uno). (2) Badge de
     estado (Vencido/Hoy/Próximo) junto a cada nota con fecha, mismo
     criterio que esFechaVencida() de utils.js. (3) Checklist opcional
     por nota: array `subitems` [{id, texto, hecho}], con input para
     agregar y checkboxes para marcar — colapsado si la nota no tiene
     ninguno. No se tocó crearRecordatorio() más allá de sumar `hora`,
     ni limpiarCompletados(), ni la edición de texto existente.
     V1.2: tres mejoras a pedido del usuario. (1) Editar texto: lápiz en
     cada nota abre el mismo bloque en modo edición (textarea +
     guardar/cancelar), update() sobre el mismo doc — no crea uno nuevo.
     (2) Botón "Limpiar completados": borra en lote (batch) todos los
     recordatorios con completado==true, con confirmación previa —
     evita que la colección crezca indefinidamente con notas ya hechas.
     (3) Se usa esFechaVencida() de utils.js (v1.3) para pintar en rojo
     la fecha de notas vencidas en la lista, en vez de comparar strings
     sueltas acá. No se tocó crearRecordatorio(), toggleCompletado(),
     borrarRecordatorio() individual, ni los filtros existentes.
     V1.1: si la URL trae ?fecha=YYYY-MM-DD (llega desde el botón
     "+ Nuevo recordatorio este día" del calendario de index.html v2.11),
     se precarga el campo de fecha del formulario al cargar la página.
     No cambia nada más del CRUD existente.
     V1.0: módulo nuevo. Notas/recordatorios personales o de equipo, con
     fecha opcional, visibilidad ('personal'|'equipo') y vínculo opcional
     a un proyecto existente. Mismo esqueleto/tema que clientes.html
     (Oro Profundo, Playfair Display, nav.js/nav.css compartidos,
     utils.js para escapeHtml). Colección plana `recordatorios` con
     campo `autorId` (mismo patrón que bitácora/proyectos, ver
     firestore.rules v2.29). El widget resumen vive en index.html v2.8.
     No se tocó ningún otro módulo del ecosistema. -->

<style>

  border-radius:8px;padding:8px 14px;font-size:0.8rem;cursor:pointer;min-height:38px;

.badge-estado.warn{background:rgba(217,164,65,0.15);color:var(--warn);}
.badge-estado.ok{background:rgba(76,175,125,0.15);color:var(--ok);}
.nota-meta .relativo{color:var(--muted);font-style:italic;}
.chevron-checklist{
  background:var(--surf);border:1px solid var(--brd);color:var(--muted);cursor:pointer;
  font-size:0.78rem;font-weight:500;padding:10px 12px;border-radius:8px;white-space:nowrap;
  min-height:44px;display:inline-flex;align-items:center;gap:4px;margin-top:10px;

.checklist{

  border-top:1px dashed var(--brd);
}
.checklist-item{display:flex;align-items:center;gap:10px;font-size:0.85rem;min-height:44px;}
.checklist-item input[type="checkbox"]{width:20px;height:20px;flex-shrink:0;accent-color:var(--gold);}

.checklist-add input[type="text"]{flex:1;min-width:0;}

<body>

<script>
window.NAV_CONFIG = { activo: 'recordatorios' };
</script>
<div id="nav-mount"></div>
<script src="nav.js"></script>

<div class="main-wrap" id="mainWrap">
<header style="display:none;"></header>

<main>
  <h2 class="titulo">📝 Recordatorios</h2>
  <div class="sub-titulo">Notas y pendientes sueltos — personales o de equipo, con fecha opcional.</div>

  <div class="panel">
    <h3>Nueva nota</h3>
    <div class="form-row">
      <label>Texto</label>
      <textarea id="inputTexto" placeholder="¿Qué necesitas recordar?"></textarea>
    </div>
    <div class="form-row-inline">
      <div class="form-row">
        <label>Fecha (opcional)</label>
        <input type="date" id="inputFecha">
      </div>
      <div class="form-row">
        <label>Hora (opcional)</label>
        <input type="time" id="inputHora">
      </div>
      <div class="form-row">
        <label>Visibilidad</label>
        <select id="inputVisibilidad">
          <option value="personal">Solo yo</option>
          <option value="equipo">Equipo</option>
        </select>
      </div>
    </div>
    <button class="btn" onclick="crearRecordatorio()">Guardar recordatorio</button>
  </div>

  <div class="filtros">
    <button class="btn-ghost active" data-filtro="todas" onclick="cambiarFiltro('todas')">Todas</button>
    <button class="btn-ghost" data-filtro="mias" onclick="cambiarFiltro('mias')">Mías</button>
    <button class="btn-ghost" data-filtro="equipo" onclick="cambiarFiltro('equipo')">Equipo</button>
    <button class="btn-ghost" data-filtro="sinfecha" onclick="cambiarFiltro('sinfecha')">Sin fecha</button>
  </div>

  <div class="panel">
    <div class="panel-header-row">
      <h3 style="margin-bottom:0;">Recordatorios</h3>
      <button class="btn-ghost" onclick="limpiarCompletados()">🧹 Limpiar completados</button>
    </div>
    <div id="listaRecordatorios"></div>
    <div class="empty" id="emptyRecordatorios" style="display:none;">No hay recordatorios en este filtro.</div>
  </div>
</main>
</div><!-- /main-wrap -->

<script>
firebase.initializeApp(firebaseConfig);
const db = crearDB();
const auth = firebase.auth();
const recordatoriosRef = db.collection('recordatorios');

// ============ GUARD DE SESIÓN ============
let usuarioActual = null;
// v-NEXT: el guard de sesión (auth.onAuthStateChanged) se salta por
// completo cuando estaModoOfflineActivo() es true (firebase-config.js
// v1.3) — mismo patrón ya usado en index.html v2.23. Sin señal,
// onAuthStateChanged nunca confirma el usuario y esto mandaba siempre
// a login.html sin poder continuar en modo offline. No protege datos
// que ya están cargados en este mismo dispositivo, así que pedir login
// contra un servidor inalcanzable no agregaba seguridad real.
if(estaModoOfflineActivo()){
  console.info('AUDIOLINK: modo offline activo — guard de sesión omitido.');
} else {
  auth.onAuthStateChanged(async (user) => {
    if(!user){
      window.location.href = 'login.html';
      return;
    }
    try{
      const doc = await db.collection('equipoInterno').doc(user.email).get();
      if(!doc.exists || doc.data().activo !== true){
        await auth.signOut();
        window.location.href = 'login.html';
        return;
      }
      usuarioActual = { uid: user.uid, email: user.email, nombre: (doc.data().nombre || user.email) };
      iniciarListener();
      precargarFechaDesdeUrl();
    } catch(e){
      console.error('Error validando sesión:', e);
      window.location.href = 'login.html';
    }
  });
}

// ============ ESTADO ============
let recordatorios = [];
let filtroActual = 'todas';

function iniciarListener(){
  recordatoriosRef.onSnapshot(snap => {
    recordatorios = [];
    snap.forEach(doc => recordatorios.push({ id: doc.id, ...doc.data() }));
    // orden: con fecha primero (asc), luego sin fecha por creadoEn desc
    recordatorios.sort((a, b) => {
      if(a.fecha && b.fecha) return a.fecha.localeCompare(b.fecha);
      if(a.fecha && !b.fecha) return -1;
      if(!a.fecha && b.fecha) return 1;
      const ta = a.creadoEn ? a.creadoEn.toMillis() : 0;
      const tb = b.creadoEn ? b.creadoEn.toMillis() : 0;
      return tb - ta;
    });
    renderLista();
  }, err => console.error('Error cargando recordatorios:', err));
}

// ============ PRECARGA DESDE URL (v1.1) ============
function precargarFechaDesdeUrl(){
  const fecha = new URLSearchParams(window.location.search).get('fecha');
  if(fecha) document.getElementById('inputFecha').value = fecha;
}

// ============ CREAR ============
function crearRecordatorio(){
  const texto = document.getElementById('inputTexto').value.trim();
  if(!texto){ alert('Escribe el texto del recordatorio.'); return; }
  const fecha = document.getElementById('inputFecha').value || null;
  const hora = document.getElementById('inputHora').value || null;
  const visibilidad = document.getElementById('inputVisibilidad').value;

  recordatoriosRef.add({
    texto,
    fecha,
    hora,
    subitems: [],
    visibilidad,
    completado: false,
    autorId: usuarioActual.uid,
    autorNombre: usuarioActual.nombre,
    creadoEn: firebase.firestore.Timestamp.now()
  }).then(() => {
    document.getElementById('inputTexto').value = '';
    document.getElementById('inputFecha').value = '';
    document.getElementById('inputHora').value = '';
    document.getElementById('inputVisibilidad').value = 'personal';
  }).catch(err => {
    console.error('Error creando recordatorio:', err);
    alert('No se pudo guardar el recordatorio.');
  });
}

// ============ TOGGLE COMPLETADO ============
function toggleCompletado(id, actual){
  recordatoriosRef.doc(id).update({ completado: !actual })
    .catch(err => console.error('Error actualizando recordatorio:', err));
}

// ============ BORRAR ============
function borrarRecordatorio(id){
  if(!confirm('¿Borrar este recordatorio?')) return;
  recordatoriosRef.doc(id).delete()
    .catch(err => console.error('Error borrando recordatorio:', err));
}

// ============ LIMPIAR COMPLETADOS (v1.2) ============
function limpiarCompletados(){
  const completados = recordatorios.filter(r => r.completado);
  if(completados.length === 0){ alert('No hay recordatorios completados para limpiar.'); return; }
  if(!confirm(`¿Borrar ${completados.length} recordatorio(s) ya completados? Esta acción no se puede deshacer.`)) return;
  const batch = db.batch();
  completados.forEach(r => batch.delete(recordatoriosRef.doc(r.id)));
  batch.commit().catch(err => {
    console.error('Error limpiando completados:', err);
    alert('No se pudieron borrar los recordatorios completados.');
  });
}

// ============ EDITAR (v1.2) ============
let editandoId = null;
// v1.6: qué notas tienen su checklist expandida — en memoria, empieza
// colapsada, se resetea al recargar (no hace falta persistirlo).
const checklistExpandida = new Set();

function toggleChecklistExpandida(id){
  if(checklistExpandida.has(id)) checklistExpandida.delete(id);
  else checklistExpandida.add(id);
  renderLista();
}

function iniciarEdicion(id){
  editandoId = id;
  renderLista();
}

function cancelarEdicion(){
  editandoId = null;
  renderLista();
}

function guardarEdicion(id){
  const nuevoTexto = document.getElementById('editTexto_' + id).value.trim();
  if(!nuevoTexto){ alert('El texto no puede quedar vacío.'); return; }
  recordatoriosRef.doc(id).update({ texto: nuevoTexto })
    .then(() => { editandoId = null; })
    .catch(err => {
      console.error('Error editando recordatorio:', err);
      alert('No se pudo guardar la edición.');
    });
}

// ============ CHECKLIST / SUBITEMS (v1.3) ============
function agregarSubitem(id){
  const input = document.getElementById('nuevoSubitem_' + id);
  const inputMonto = document.getElementById('nuevoSubitemMonto_' + id);
  const texto = input.value.trim();
  if(!texto) return;
  const monto = inputMonto && inputMonto.value ? Number(inputMonto.value) : null;
  const r = recordatorios.find(x => x.id === id);
  const subitems = (r.subitems || []).concat([{ id: 'si_' + Date.now(), texto, hecho: false, monto: (monto && monto > 0) ? monto : null }]);
  recordatoriosRef.doc(id).update({ subitems }).then(() => {
    input.value = '';
    if(inputMonto) inputMonto.value = '';
  }).catch(err => console.error('Error agregando sub-ítem:', err));
}

function toggleSubitem(id, subitemId){
  const r = recordatorios.find(x => x.id === id);
  const subitems = (r.subitems || []).map(s => s.id === subitemId ? { ...s, hecho: !s.hecho } : s);
  recordatoriosRef.doc(id).update({ subitems })
    .catch(err => console.error('Error actualizando sub-ítem:', err));
}

function borrarSubitem(id, subitemId){
  const r = recordatorios.find(x => x.id === id);
  const subitems = (r.subitems || []).filter(s => s.id !== subitemId);
  recordatoriosRef.doc(id).update({ subitems })
    .catch(err => console.error('Error borrando sub-ítem:', err));
}

// tiempoRelativo() y estadoRecordatorio() ahora viven en utils.js v1.4
// (compartidas con el widget del Dashboard en index.html).

// ============ FILTROS ============
function cambiarFiltro(f){
  filtroActual = f;
  document.querySelectorAll('.filtros .btn-ghost').forEach(b => {
    b.classList.toggle('active', b.dataset.filtro === f);
  });
  renderLista();
}

function recordatoriosFiltrados(){
  switch(filtroActual){
    case 'mias': return recordatorios.filter(r => r.autorId === usuarioActual.uid);
    case 'equipo': return recordatorios.filter(r => r.visibilidad === 'equipo');
    case 'sinfecha': return recordatorios.filter(r => !r.fecha);
    default: return recordatorios;
  }
}

// ============ RENDER ============
function fechaLegible(fechaStr){
  const [y, m, d] = fechaStr.split('-');
  return new Date(y, m - 1, d).toLocaleDateString('es-CO', { day:'numeric', month:'short', year:'numeric' });
}

function renderLista(){
  const cont = document.getElementById('listaRecordatorios');
  const empty = document.getElementById('emptyRecordatorios');
  const lista = recordatoriosFiltrados();

  if(lista.length === 0){
    cont.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  cont.innerHTML = lista.map(r => {
    if(r.id === editandoId){
      return `
        <div class="nota-item">
          <div class="cuerpo">
            <textarea id="editTexto_${r.id}" style="width:100%;background:var(--surf);border:1px solid var(--gold);border-radius:6px;padding:8px;color:var(--txt);font-family:var(--S);font-size:0.9rem;min-height:60px;">${escapeHtml(r.texto)}</textarea>
            <div class="nota-meta" style="margin-top:8px;">
              <button class="icon-btn" title="Guardar" onclick="guardarEdicion('${r.id}')">✓</button>
              <button class="icon-btn" title="Cancelar" onclick="cancelarEdicion()">✕</button>
            </div>
          </div>
        </div>`;
    }
    const estado = !r.completado ? estadoRecordatorio(r.fecha) : null;
    const relativo = !r.completado && r.fecha ? tiempoRelativo(r.fecha, r.hora) : null;
    const subitems = r.subitems || [];
    const expandida = checklistExpandida.has(r.id);
    const hechos = subitems.filter(s => s.hecho).length;
    const chevronHtml = subitems.length > 0
      ? `<button class="chevron-checklist" onclick="toggleChecklistExpandida('${r.id}')">☑️ ${expandida ? '▴' : '▾'} Lista (${hechos}/${subitems.length})</button>`
      : '';
    const totalGeneral = subitems.reduce((sum, s) => sum + (s.monto || 0), 0);
    const totalPendiente = subitems.filter(s => !s.hecho).reduce((sum, s) => sum + (s.monto || 0), 0);
    const hayMontos = totalGeneral > 0;
    const totalesHtml = hayMontos ? `
        <div class="checklist-totales">
          <span>Total: <strong>${formatCOP(totalGeneral)}</strong></span>
          <span>Pendiente: <strong>${formatCOP(totalPendiente)}</strong></span>
        </div>` : '';
    const subitemsHtml = subitems.length > 0 && expandida ? `
        <div class="checklist">
          ${subitems.map(s => `
            <div class="checklist-item ${s.hecho ? 'hecho' : ''}">
              <input type="checkbox" ${s.hecho ? 'checked' : ''} onchange="toggleSubitem('${r.id}','${s.id}')">
              <span>${escapeHtml(s.texto)}</span>
              ${s.monto ? `<span class="checklist-monto">${formatCOP(s.monto)}</span>` : ''}
              <button class="icon-btn borrar" title="Quitar" onclick="borrarSubitem('${r.id}','${s.id}')">✕</button>
            </div>`).join('')}
          ${totalesHtml}
        </div>` : '';
    const mostrarInputAgregar = subitems.length === 0 || expandida;
    return `
    <div class="nota-item ${r.completado ? 'completado' : ''}">
      <div class="cuerpo">
        <div class="texto">${escapeHtml(r.texto)}</div>
        <div class="nota-meta">
          ${r.fecha ? `<span class="fecha" style="${estado && estado.clase === 'err' ? 'color:var(--err);' : ''}">📅 ${fechaLegible(r.fecha)}${r.hora ? ' · ⏰ ' + r.hora : ''}</span>` : ''}
          ${estado ? `<span class="badge-estado ${estado.clase}">${estado.texto}</span>` : ''}
          ${relativo ? `<span class="relativo">${relativo}</span>` : ''}
          <span class="badge-vis ${r.visibilidad}">${r.visibilidad === 'equipo' ? 'Equipo' : 'Solo yo'}</span>
          <span>${escapeHtml(r.autorNombre || '')}</span>
        </div>
        ${chevronHtml}
        ${subitemsHtml}
        ${mostrarInputAgregar ? `
        <div class="checklist-add">
          <input type="text" id="nuevoSubitem_${r.id}" placeholder="+ agregar ítem a la lista" onkeydown="if(event.key==='Enter') agregarSubitem('${r.id}')">
          <input type="number" inputmode="numeric" id="nuevoSubitemMonto_${r.id}" placeholder="$ (opcional)" class="checklist-add-monto" onkeydown="if(event.key==='Enter') agregarSubitem('${r.id}')">
        </div>` : ''}
      </div>
      <div class="nota-acciones">
        <button class="icon-btn" title="Editar" onclick="iniciarEdicion('${r.id}')">✏️</button>
        <button class="icon-btn" title="${r.completado ? 'Marcar pendiente' : 'Marcar como hecho'}" onclick="toggleCompletado('${r.id}', ${r.completado === true})">${r.completado ? '↺' : '✓'}</button>
        <button class="icon-btn borrar" title="Borrar" onclick="borrarRecordatorio('${r.id}')">🗑️</button>
      </div>
    </div>
  `;
  }).join('');
}
</script>

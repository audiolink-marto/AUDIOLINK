:root{ --sb-w:220px; --sb-c:64px; --bn-h:58px; }

.dash-cal-head button{background:transparent;border:1px solid var(--brd);color:var(--txt);border-radius:6px;cursor:pointer;padding:2px 8px;}
.dash-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:0.74rem;}
.dash-cal-grid .dow{color:var(--muted);padding-bottom:4px;}
.dash-cal-day{position:relative;padding:6px 0;border-radius:6px;cursor:default;}
.dash-cal-day.con-evento{cursor:pointer;}
.dash-cal-day.con-evento:hover{background:var(--surf-light);}
.dash-cal-dots{display:flex;gap:2px;justify-content:center;margin-top:2px;}
.dash-cal-dots span{width:5px;height:5px;border-radius:50%;}
.dot-pasada{background:var(--ok);}
.dot-proxima{background:#6ea3e8;}
.dot-entrega{background:var(--warn);}
.dash-cal-tooltip{
  position:absolute;z-index:20;background:var(--surf);border:1px solid var(--brd);border-radius:8px;
  padding:10px 12px;font-size:0.78rem;min-width:180px;box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.dash-cal-tooltip a{color:var(--gold);}
.dash-proxima-sesion{font-size:0.85rem;color:var(--muted);margin-bottom:16px;}
.detalle-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;}
.chip{
  background:var(--surf-light);border:1px solid var(--brd);border-radius:6px;
  padding:6px 12px;font-size:0.8rem;color:var(--muted);
}
.narrativa-box{
  background:var(--surf-light);border-left:2px solid var(--gold);
  padding:14px 16px;margin-top:16px;font-size:0.88rem;color:var(--txt);
  border-radius:0 6px 6px 0;line-height:1.5;
}
.equipo-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.equipo-chip{
  background:var(--gold-bg);border:1px solid var(--gold);border-radius:20px;
  padding:5px 14px;font-size:0.78rem;color:var(--gold);
}
.pdf-actions{display:flex;gap:10px;margin-top:20px;}

<script>
// ============ FIREBASE CONFIG ============
// TU_CONFIG_AQUI — reemplaza con el config real de tu proyecto Firebase
// (Firebase Console → Configuración del proyecto → Tus apps → SDK config)
/* firebaseConfig ahora vive en firebase-config.js (ecosistema compartido) */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
// v4.1: comentado — Firebase Storage requiere plan Blaze, no activado.
// const storage = firebase.storage(); // v4.0 — audio de Producción musical
const proyectosRef = db.collection('proyectos');
const clientesRef = db.collection('clientes');

// ============ GUARD DE SESIÓN ============
let sesionValidada = false;
auth.onAuthStateChanged(async (user) => {
  if(!user){
    window.location.href = 'login.html';
    return;
  }
  try{
    const doc = await db.collection('equipoInterno').doc(user.email).get();
    if(!doc.exists || doc.data().activo !== true){
      await auth.signOut();
      window.location.href = 'login.html';
      return;
    }
    sesionValidada = true;
  } catch(e){
    console.error('Error validando sesión:', e);
    window.location.href = 'login.html';
  }
});

// cerrarSesion(), toggleTema(), toggleMasMobile() y el colapsar del sidebar
// ahora viven en nav.js (compartido por todo el ecosistema).

// ============ ESTADO ============
let proyectos = [];
let proyectoActualId = null;
let editando = false;

// resumenPagos: { [proyectoId]: { cotizacionId, cotizado, cobrado, saldo } }
// Se llena por separado del listener de `proyectos` (misma lógica de
// pagos.html: collectionGroup('cotizaciones') + subcolección pagos).
let resumenPagos = {};

// origenDetalle: si la URL trae ?from=pagos (ej. proyecto.html?id=X&from=pagos,
// como ahora enlaza pagos.html), el botón "volver" del detalle regresa a
// pagos.html en vez de al listado de proyectos. Sin ?from, comportamiento
// intacto de siempre.
const origenDetalle = new URLSearchParams(window.location.search).get('from');

const ETAPAS_LABEL = {
  preproduccion: "Preproducción",
  grabacion: "Grabación",
  edicion: "Edición",
  mezcla: "Mezcla",
  mastering: "Mastering",
  entrega: "Entrega"
};

const COMERCIAL_LABEL = {
  cotizacion: "Cotización",
  aprobado: "Aprobado",
  en_curso: "En curso",
  finalizado: "Finalizado"
};

// clientesLista: colección 'clientes' (v4.11), solo para poblar el selector
// "Cliente registrado" del formulario. clienteArtista/clienteEmail (texto
// libre) siguen siendo la fuente real de esos datos en cada proyecto; el
// selector solo los pre-llena como atajo.
let clientesLista = [];
clientesRef.orderBy('nombre').onSnapshot(snap => {
  clientesLista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const sel = document.getElementById('fClienteId');
  if(!sel) return;
  const actual = sel.value;
  sel.innerHTML = '<option value="">— Sin vincular / escribir manualmente abajo —</option>' +
    clientesLista.map(c => `<option value="${c.id}">${escapeHtml(c.nombre || c.email || 'Sin nombre')}</option>`).join('');
  sel.value = actual;
}, err => console.error('Error escuchando clientes:', err));

function aplicarClienteSeleccionado(){
  const id = document.getElementById('fClienteId').value;
  if(!id) return;
  const c = clientesLista.find(x => x.id === id);
  if(!c) return;
  document.getElementById('fCliente').value = c.nombre || '';
  document.getElementById('fCorreoCliente').value = c.email || '';
}

// ============ LISTENER TIEMPO REAL ============
proyectosRef.orderBy('creadoEn', 'desc').onSnapshot(snap => {
  proyectos = [];
  snap.forEach(doc => proyectos.push({ id: doc.id, ...doc.data() }));
  renderListado();
  const urlParams = new URLSearchParams(window.location.search);
  const idParam = urlParams.get('id');
  if(idParam && proyectoActualId === null && document.getElementById('vistaDetalle').classList.contains('active') === false){
    verDetalle(idParam);
  }
}, err => {
  console.error("Error cargando proyectos:", err);
});

// ============ RESUMEN FINANCIERO (Cotizado/Cobrado/Saldo) ============
// Mismo patrón que pagos.html: cotización aceptada por proyecto + suma de
// su subcolección pagos. No interfiere con el listener de `proyectos`.
db.collectionGroup('cotizaciones').where('estado', '==', 'aceptada')
  .onSnapshot(snap => {
    const vistos = new Set();
    snap.forEach(d => {
      const proyectoId = d.ref.parent.parent.id;
      vistos.add(proyectoId);
      const existente = resumenPagos[proyectoId];
      resumenPagos[proyectoId] = {
        cotizacionId: d.id,
        cotizado: d.data().total || 0,
        cobrado: existente ? existente.cobrado : 0,
        saldo: existente ? (d.data().total || 0) - existente.cobrado : (d.data().total || 0)
      };
      escucharPagosResumen(proyectoId, d.id);
    });
    // Proyectos que ya no tienen cotización aceptada (se desaceptó, etc.)
    Object.keys(resumenPagos).forEach(pid => {
      if(!vistos.has(pid)) delete resumenPagos[pid];
    });
    renderListado();
    refrescarDetalleSiActivo();
  }, err => {
    console.error('Error cargando resumen financiero (revisa el índice de collectionGroup si falla):', err);
  });

function refrescarDetalleSiActivo(){
  if(proyectoActualId && document.getElementById('vistaDetalle').classList.contains('active')){
    renderDetalleContent();
  }
}

/* ============ DASHBOARD DE PROYECTO (v4.3) ============
   Se agrega como landing del detalle, arriba del contenido existente
   (resumen financiero, chips, narrativa, equipo — nada de eso se toca).
   Usa datos ya disponibles (proyecto, resumenPagos) + dos listeners
   nuevos y acotados al proyecto abierto (sesiones y producción), que se
   desuscriben al salir del detalle o cambiar de proyecto para no dejar
   lecturas de Firestore corriendo de fondo. */
let unsubSesionesDash = null;
let unsubProduccionDash = null;
let sesionesDash = [];
let produccionDash = [];
let dashCalMes = new Date();

function suscribirDashboardDetalle(id){
  if(unsubSesionesDash) unsubSesionesDash();
  if(unsubProduccionDash) unsubProduccionDash();
  sesionesDash = [];
  produccionDash = [];
  dashCalMes = new Date();
  unsubSesionesDash = proyectosRef.doc(id).collection('sesiones')
    .onSnapshot(snap => {
      sesionesDash = [];
      snap.forEach(d => sesionesDash.push({ id: d.id, ...d.data() }));
      refrescarDetalleSiActivo();
    }, err => console.error('Error cargando sesiones del dashboard:', err));
  unsubProduccionDash = proyectosRef.doc(id).collection('produccion')
    .onSnapshot(snap => {
      produccionDash = [];
      snap.forEach(d => produccionDash.push({ id: d.id, ...d.data() }));
      refrescarDetalleSiActivo();
    }, err => console.error('Error cargando producción del dashboard:', err));
}

function desuscribirDashboardDetalle(){
  if(unsubSesionesDash) { unsubSesionesDash(); unsubSesionesDash = null; }
  if(unsubProduccionDash) { unsubProduccionDash(); unsubProduccionDash = null; }
}

function contarInstrumentacion(instr){
  if(!instr) return { grupos: 0, piezas: 0 };
  let grupos = 0, piezas = 0;
  Object.keys(instr).forEach(k => {
    if(Array.isArray(instr[k]) && instr[k].length){ grupos++; piezas += instr[k].length; }
  });
  return { grupos, piezas };
}

function renderBarraEtapa(etapaActual){
  const claves = Object.keys(ETAPAS_LABEL);
  const idxActual = claves.indexOf(etapaActual);
  return claves.map((k, i) => {
    let cls = '';
    if(i < idxActual) cls = 'hecha';
    else if(i === idxActual) cls = 'actual';
    return `<span class="${cls}" title="${ETAPAS_LABEL[k]}"></span>`;
  }).join('');
}

/* Ruta de etapas del dashboard (v4.4) — adaptación de renderEtapaChips()
   de portal.html: misma lógica (idxActual, sub por fecha de grabación/
   entrega), pero retorna el HTML como string para insertarlo dentro de
   renderDashboardProyecto() en vez de escribirlo en un elemento del DOM
   con getElementById. No se tocó renderBarraEtapa() ni ETAPAS_LABEL. */
function renderRutaEtapa(p){
  const claves = Object.keys(ETAPAS_LABEL);
  const idxActual = claves.indexOf(p.etapaActual);

  const conFecha = sesionesDash.filter(s => s.fecha).sort((a,b) => a.fecha.localeCompare(b.fecha));
  let rangoGrabacion = null;
  if(conFecha.length){
    const fmt = f => new Date(f + 'T00:00:00').toLocaleDateString('es-CO', {day:'2-digit', month:'short'});
    const primera = conFecha[0].fecha, ultima = conFecha[conFecha.length - 1].fecha;
    rangoGrabacion = primera === ultima ? fmt(primera) : `${fmt(primera)} – ${fmt(ultima)}`;
  }
  const entrega = p.fechaEntregaEstimada ? new Date(p.fechaEntregaEstimada + 'T00:00:00').toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}) : null;

  return `
    <div class="etapa-ruta">
      ${claves.map((k, i) => {
        const cls = i < idxActual ? 'hecha' : i === idxActual ? 'actual' : 'pendiente';
        let sub = '';
        if(k === 'grabacion' && rangoGrabacion) sub = rangoGrabacion;
        if(k === 'entrega' && entrega) sub = entrega;
        const esUltima = i === claves.length - 1;
        return `
          <div class="etapa-nodo-row">
            <div class="etapa-nodo-col">
              <div class="etapa-nodo ${cls}">${cls === 'hecha' ? '✓' : ''}</div>
              ${!esUltima ? `<div class="etapa-linea ${i < idxActual ? 'hecha' : ''}"></div>` : ''}
            </div>
            <div class="etapa-nodo-txt">
              <span class="${cls}">${ETAPAS_LABEL[k]}</span>
              ${sub ? `<small>${sub}</small>` : (cls === 'actual' ? `<small class="etapa-actual-tag">etapa actual</small>` : '')}
            </div>
          </div>`;
      }).join('')}
    </div>
  `;
}

function renderMiniCalendario(p){
  const anio = dashCalMes.getFullYear();
  const mes = dashCalMes.getMonth();
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const primerDia = new Date(anio, mes, 1);
  const diasEnMes = new Date(anio, mes + 1, 0).getDate();
  const offset = primerDia.getDay();
  const entregaStr = p.fechaEntregaEstimada ? p.fechaEntregaEstimada.split('T')[0] : null;

  const eventosPorDia = {};
  sesionesDash.forEach(s => {
    if(!s.fecha) return;
    const d = new Date(s.fecha + 'T00:00:00');
    const pasada = d < hoy;
    if(!eventosPorDia[s.fecha]) eventosPorDia[s.fecha] = [];
    eventosPorDia[s.fecha].push({ tipo: pasada ? 'pasada' : 'proxima', sesion: s });
  });
  if(entregaStr && entregaStr.slice(0,7) === `${anio}-${String(mes+1).padStart(2,'0')}`){
    if(!eventosPorDia[entregaStr]) eventosPorDia[entregaStr] = [];
    eventosPorDia[entregaStr].push({ tipo: 'entrega' });
  }

  const dow = ['D','L','M','X','J','V','S'];
  let celdas = dow.map(d => `<div class="dow">${d}</div>`).join('');
  for(let i = 0; i < offset; i++) celdas += `<div></div>`;
  for(let dia = 1; dia <= diasEnMes; dia++){
    const fechaStr = `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const eventos = eventosPorDia[fechaStr];
    const dots = eventos ? `<div class="dash-cal-dots">${eventos.map(e => `<span class="dot-${e.tipo}"></span>`).join('')}</div>` : '';
    celdas += `<div class="dash-cal-day ${eventos ? 'con-evento' : ''}" ${eventos ? `onclick="mostrarTooltipDia(event,'${fechaStr}')"` : ''}>${dia}${dots}</div>`;
  }

  return `
    <div class="dash-calendario" id="dashCalendario">
      <div class="dash-cal-head">
        <button onclick="cambiarMesDash(-1)">‹</button>
        <span>${dashCalMes.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' })}</span>
        <button onclick="cambiarMesDash(1)">›</button>
      </div>
      <div class="dash-cal-grid">${celdas}</div>
    </div>`;
}

function cambiarMesDash(delta){
  dashCalMes = new Date(dashCalMes.getFullYear(), dashCalMes.getMonth() + delta, 1);
  refrescarDetalleSiActivo();
}

function mostrarTooltipDia(evt, fechaStr){
  evt.stopPropagation();
  const existente = document.querySelector('.dash-cal-tooltip');
  if(existente) existente.remove();
  const sesionesDia = sesionesDash.filter(s => s.fecha === fechaStr);
  const esEntrega = proyectos.find(x => x.id === proyectoActualId)?.fechaEntregaEstimada?.split('T')[0] === fechaStr;
  const fechaFmt = new Date(fechaStr + 'T00:00:00').toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long' });
  let html = `<strong>${fechaFmt}</strong><br>`;
  if(esEntrega) html += `<div style="color:var(--warn);margin-top:4px;">Entrega estimada del proyecto</div>`;
  sesionesDia.forEach(s => {
    html += `<div style="margin-top:6px;">${escapeHtml(s.actividad || 'Sesión')}${s.sala ? ' · ' + escapeHtml(s.sala) : ''}<br><a href="logistica.html?id=${proyectoActualId}">Ver en logística →</a></div>`;
  });
  const box = document.createElement('div');
  box.className = 'dash-cal-tooltip';
  box.innerHTML = html;
  evt.currentTarget.appendChild(box);
  setTimeout(() => document.addEventListener('click', function cerrar(e){
    if(!box.contains(e.target)){ box.remove(); document.removeEventListener('click', cerrar); }
  }), 0);
}

function renderDashboardProyecto(p){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const totalSesiones = sesionesDash.length;
  const sesionesHechas = sesionesDash.filter(s => s.fecha && new Date(s.fecha + 'T00:00:00') < hoy).length;
  const proximaSesion = sesionesDash
    .filter(s => s.fecha && new Date(s.fecha + 'T00:00:00') >= hoy)
    .sort((a,b) => a.fecha.localeCompare(b.fecha))[0];

  const instr = contarInstrumentacion(p.instrumentacion);
  const r = resumenPagos[p.id];
  const pctFinanciero = r && r.cotizado > 0 ? Math.min(100, Math.round((r.cobrado / r.cotizado) * 100)) : 0;

  return `
    ${renderRutaEtapa(p)}
    ${r ? `<div class="dash-financiera-bar"><div style="width:${pctFinanciero}%"></div></div>` : ''}
    <div class="dash-cards">
      <div class="dash-card"><span class="lbl">Sesiones</span><span class="val">${sesionesHechas} de ${totalSesiones}</span></div>
      <div class="dash-card"><span class="lbl">Instrumentación</span><span class="val">${instr.grupos} grupo(s)</span></div>
      <div class="dash-card"><span class="lbl">Producción</span><span class="val">${produccionDash.length} ítem(s)</span></div>
    </div>
    ${renderMiniCalendario(p)}
    <div class="dash-proxima-sesion">${proximaSesion ? `Próxima sesión: ${new Date(proximaSesion.fecha + 'T00:00:00').toLocaleDateString('es-CO')} · ${escapeHtml(proximaSesion.actividad || '')}` : 'No hay sesiones próximas.'}</div>
  `;
}
/* ============ FIN DASHBOARD DE PROYECTO ============ */

function escucharPagosResumen(proyectoId, cotizId){
  proyectosRef.doc(proyectoId).collection('pagos')
    .where('cotizacionId', '==', cotizId)
    .onSnapshot(psnap => {
      let suma = 0;
      psnap.forEach(p => suma += (p.data().monto || 0));
      const r = resumenPagos[proyectoId];
      if(r && r.cotizacionId === cotizId){
        r.cobrado = suma;
        r.saldo = r.cotizado - suma;
        renderListado();
        if(proyectoActualId === proyectoId) refrescarDetalleSiActivo();
      }
    }, err => console.error('Error cargando pagos del resumen:', err));
}

function renderListado(){
  const grid = document.getElementById('gridProyectos');
  const empty = document.getElementById('emptyState');
  if(proyectos.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = proyectos.map(p => {
    const r = resumenPagos[p.id];
    const saldoHtml = (r && r.saldo > 0)
      ? `<div class="meta-saldo">💰 Saldo pendiente: ${formatCOP(r.saldo)}</div>`
      : '';
    return `
    <div class="card" onclick="verDetalle('${p.id}')">
      <div class="card-top">
        <div>
          <span class="tipo-tag">${p.tipo === 'propio' ? 'Proyecto propio' : 'Cliente'}</span>
          <h3>${escapeHtml(p.nombre || 'Sin nombre')}</h3>
        </div>
        <div class="card-top-actions">
          <span class="badge ${p.estado || 'ok'}">${p.estado || 'ok'}</span>
          <a href="logistica.html?id=${p.id}" class="btn-ir-sesiones" title="Ver sesiones" onclick="event.stopPropagation()">📅</a>
        </div>
      </div>
      <div class="meta">${escapeHtml(p.clienteArtista || '—')}</div>
      <div class="meta">Prod. ejecutivo: ${escapeHtml(p.productorEjecutivo || '—')}</div>
      ${saldoHtml}
      <span class="etapa">${ETAPAS_LABEL[p.etapaActual] || p.etapaActual || '—'}</span>
      <span class="etapa" style="margin-left:6px;">${COMERCIAL_LABEL[p.estadoComercial] || 'Cotización'}</span>
    </div>
  `;
  }).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

// v4.9: escapa un string para insertarlo de forma segura dentro de un
// string de JS (comillas simples) que a su vez vive dentro de un atributo
// HTML (comillas dobles). Sin esto, un texto con " rompe el atributo.
function escJsHtml(str){
  return String(str || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');
}

/* ============ INSTRUMENTACIÓN (v4.2) ============
   Catálogo de piezas por grupo, usado solo para prellenar el <select> de
   cada grupo — el usuario puede agregar piezas fuera del catálogo con
   "agregar personalizada". El estado real (instrumentacionState) es la
   única fuente de verdad mientras el modal está abierto; se reconstruye
   por completo en cada abrirModal/editar y se vuelca a instrumentacion
   al guardar. No se relaciona con Cloudinary/Storage ni con producción. */
const CATALOGO_INSTRUMENTACION = {
  bateria: { label: 'Batería', piezas: ['Kick','Redoblante','Tom 1','Tom 2','Tom de piso','Hi-hat','Overhead L','Overhead R','Ride'] },
  percusionLatina: { label: 'Percusión latina', piezas: ['Congas','Bongó','Timbales','Campana','Güiro','Maracas','Clave'] },
  cuerdas: { label: 'Cuerdas', piezas: ['Bajo eléctrico','Contrabajo','Baby bass','Guitarra eléctrica','Guitarra acústica','Tres','Cuatro'] },
  bronces: { label: 'Bronces', piezas: ['Trompeta','Trombón','Saxofón','Flauta traversa'] },
  voces: { label: 'Voces', piezas: ['Voz principal','Coro 1','Coro 2','Coro 3'] },
  teclas: { label: 'Teclas', piezas: ['Piano','Teclado/Sintetizador'] },
  otros: { label: 'Otros', piezas: [] }
};

let instrumentacionState = {};
let instrGruposAbiertos = {};

function instrumentacionVacia(){
  const st = {};
  Object.keys(CATALOGO_INSTRUMENTACION).forEach(k => st[k] = []);
  return st;
}

function generarUnidades(nombre, cantidad, unidadesPrevias){
  const arr = [];
  for(let i = 0; i < cantidad; i++){
    if(unidadesPrevias && unidadesPrevias[i]) arr.push(unidadesPrevias[i]);
    else arr.push(cantidad > 1 ? `${nombre} ${i+1}` : nombre);
  }
  return arr;
}

function renderInstrumentacion(){
  const cont = document.getElementById('instrumentacionContainer');
  cont.innerHTML = Object.keys(CATALOGO_INSTRUMENTACION).map(key => {
    const grupo = CATALOGO_INSTRUMENTACION[key];
    const piezas = instrumentacionState[key] || [];
    const abierto = !!instrGruposAbiertos[key];
    const yaAgregadas = piezas.map(p => p.nombre);
    const disponibles = grupo.piezas.filter(p => !yaAgregadas.includes(p));

    const filas = piezas.map((p, idx) => {
      const unidadesHtml = p.cantidad > 1 ? `
        <div class="instr-unidad-row">
          ${p.unidades.map((u, uIdx) => `<input type="text" value="${escapeHtml(u)}" onchange="cambiarUnidadInstr('${key}',${idx},${uIdx},this.value)">`).join('')}
        </div>` : '';
      return `
        <div class="instr-pieza-row">
          <input type="text" value="${escapeHtml(p.nombre)}" onchange="renombrarPiezaInstr('${key}',${idx},this.value)">
          <input type="number" min="1" value="${p.cantidad}" onchange="cambiarCantidadInstr('${key}',${idx},this.value)">
          <button onclick="quitarPiezaInstr('${key}',${idx})" title="Quitar">✕</button>
        </div>
        ${unidadesHtml}`;
    }).join('');

    const selectHtml = disponibles.length ? `
      <select id="instrSelect_${key}">
        <option value="">Elegir pieza...</option>
        ${disponibles.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}
      </select>
      <button class="btn btn-ghost" onclick="agregarDesdeSelectInstr('${key}')" style="height:34px;">+ agregar</button>` : '';

    return `
      <div class="instr-grupo ${abierto ? 'abierto' : ''}">
        <div class="instr-grupo-header" onclick="toggleGrupoInstr('${key}')">
          <strong>${grupo.label}</strong>
          <span>${piezas.length ? piezas.length + ' pieza(s)' : 'sin piezas'} ▾</span>
        </div>
        <div class="instr-grupo-body">
          ${filas}
          <div class="instr-footer-row">
            ${selectHtml}
            <span class="link-add" onclick="agregarPersonalizadaInstr('${key}')">+ agregar personalizada</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleGrupoInstr(key){
  instrGruposAbiertos[key] = !instrGruposAbiertos[key];
  renderInstrumentacion();
}

function agregarPiezaInstr(key, nombre){
  if(!nombre.trim()) return;
  instrumentacionState[key].push({ nombre: nombre.trim(), cantidad: 1, unidades: [nombre.trim()] });
  instrGruposAbiertos[key] = true;
  renderInstrumentacion();
}

function agregarDesdeSelectInstr(key){
  const sel = document.getElementById(`instrSelect_${key}`);
  if(sel && sel.value) agregarPiezaInstr(key, sel.value);
}

function agregarPersonalizadaInstr(key){
  const nombre = prompt('Nombre de la pieza a agregar:');
  if(nombre) agregarPiezaInstr(key, nombre);
}

function quitarPiezaInstr(key, idx){
  instrumentacionState[key].splice(idx, 1);
  renderInstrumentacion();
}

function renombrarPiezaInstr(key, idx, valor){
  const p = instrumentacionState[key][idx];
  if(!valor.trim()) { renderInstrumentacion(); return; }
  p.nombre = valor.trim();
  p.unidades = generarUnidades(p.nombre, p.cantidad, null);
  renderInstrumentacion();
}

function cambiarCantidadInstr(key, idx, valor){
  const p = instrumentacionState[key][idx];
  const cantidad = Math.max(1, parseInt(valor, 10) || 1);
  p.unidades = generarUnidades(p.nombre, cantidad, p.unidades);
  p.cantidad = cantidad;
  renderInstrumentacion();
}

function cambiarUnidadInstr(key, idx, uIdx, valor){
  instrumentacionState[key][idx].unidades[uIdx] = valor.trim() || instrumentacionState[key][idx].unidades[uIdx];
}
/* ============ FIN INSTRUMENTACIÓN ============ */

async function guardarProyecto(){
  const nombre = document.getElementById('fNombre').value.trim();
  if(!nombre){
    alert('El nombre del proyecto es obligatorio.');
    return;
  }
  const equipo = [];
  document.querySelectorAll('#equipoContainer .equipo-row').forEach(row => {
    const rol = row.querySelector('.equipo-rol').value.trim();
    const nom = row.querySelector('.equipo-nombre').value.trim();
    if(rol || nom) equipo.push({ rol, nombre: nom });
  });

  const data = {
    nombre,
    tipo: document.getElementById('fTipo').value,
    estado: document.getElementById('fEstado').value,
    estadoComercial: document.getElementById('fEstadoComercial').value,
    clienteArtista: document.getElementById('fCliente').value.trim(),
    clienteEmail: document.getElementById('fCorreoCliente').value.trim().toLowerCase(),
    clienteId: document.getElementById('fClienteId').value || null,
    productorEjecutivo: document.getElementById('fProductor').value.trim(),
    etapaActual: document.getElementById('fEtapa').value,
    fechaEntregaEstimada: document.getElementById('fFechaEntrega').value || null,
    cantTemas: Number(document.getElementById('fCantTemas').value) || 1,
    equipo,
    narrativa: document.getElementById('fNarrativa').value.trim(),
    instrumentacion: instrumentacionState,
    costos: {
      presupuesto: Number(document.getElementById('fPresupuesto').value) || 0,
      notasInternas: document.getElementById('fNotasInternas').value.trim()
    },
    visibleCliente: true
  };

  try{
    if(editando && proyectoActualId){
      await proyectosRef.doc(proyectoActualId).update(data);
    } else {
      data.creadoEn = firebase.firestore.FieldValue.serverTimestamp();
      data.fechaInicio = firebase.firestore.FieldValue.serverTimestamp();
      const docRef = await proyectosRef.add(data);
      proyectoActualId = docRef.id;
    }
    cerrarModal();
    verDetalle(proyectoActualId);
  } catch(err){
    console.error(err);
    alert('Error guardando el proyecto. Revisa la consola.');
  }
}

// ============ DETALLE ============
function verDetalle(id){
  const cambioDeProyecto = proyectoActualId !== id;
  proyectoActualId = id;
  const p = proyectos.find(x => x.id === id);
  if(!p) return;

  document.getElementById('vistaListado').style.display = 'none';
  document.getElementById('vistaDetalle').classList.add('active');

  const backLink = document.getElementById('backLink');
  if(origenDetalle === 'pagos'){
    backLink.textContent = '← Volver a Pagos';
    backLink.onclick = () => window.location.href = 'pagos.html';
  } else {
    backLink.textContent = '← Volver a proyectos';
    backLink.onclick = volverListado;
  }

  if(cambioDeProyecto) suscribirDashboardDetalle(id);
  renderDetalleContent();
}

function renderDetalleContent(){
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;

  const entrega = p.fechaEntregaEstimada ? new Date(p.fechaEntregaEstimada).toLocaleDateString('es-CO') : '—';

  const r = resumenPagos[proyectoActualId];
  const pagado = r && r.saldo <= 0;
  const resumenHtml = r ? `
    <div class="resumen-financiero">
      <div class="monto-item"><span class="lbl">Cotizado</span><span class="val">${formatCOP(r.cotizado)}</span></div>
      <div class="monto-item"><span class="lbl">Cobrado</span><span class="val">${formatCOP(r.cobrado)}</span></div>
      <div class="monto-item saldo ${pagado ? 'pagado' : ''}"><span class="lbl">Saldo</span><span class="val">${formatCOP(r.saldo)}</span></div>
    </div>` : '';

  document.getElementById('detalleContent').innerHTML = `
    <span class="tipo-tag">${p.tipo === 'propio' ? 'Proyecto propio' : 'Cliente'}</span>
    <h2>${escapeHtml(p.nombre)}</h2>
    <span class="badge ${p.estado || 'ok'}">${p.estado || 'ok'}</span>
    ${renderDashboardProyecto(p)}
    ${resumenHtml}
    <div class="detalle-meta">
      <span class="chip">Cliente/Artista: ${escapeHtml(p.clienteArtista || '—')}</span>
      <span class="chip">Prod. Ejecutivo: ${escapeHtml(p.productorEjecutivo || '—')}</span>
      <span class="chip">Etapa: ${ETAPAS_LABEL[p.etapaActual] || '—'}</span>
      <span class="chip">Comercial: ${COMERCIAL_LABEL[p.estadoComercial] || 'Cotización'}</span>
      <span class="chip">Entrega est.: ${entrega}</span>
    </div>
    ${p.narrativa ? `<div class="narrativa-box">${escapeHtml(p.narrativa)}</div>` : ''}
    ${p.equipo && p.equipo.length ? `
      <div class="equipo-list">
        ${p.equipo.map(e => `<span class="equipo-chip">${escapeHtml(e.rol)}: ${escapeHtml(e.nombre)}</span>`).join('')}
      </div>` : ''}
  `;
}

function verSesiones(){
  if(!proyectoActualId) return;
  window.location.href = `logistica.html?id=${proyectoActualId}`;
}

function volverListado(){
  document.getElementById('vistaDetalle').classList.remove('active');
  document.getElementById('vistaListado').style.display = 'block';
  proyectoActualId = null;
  desuscribirDashboardDetalle();
}

function editarProyectoActual(){
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;
  editando = true;
  document.getElementById('modalTitulo').textContent = 'Editar Proyecto';
  document.getElementById('fNombre').value = p.nombre || '';
  document.getElementById('fTipo').value = p.tipo || 'propio';
  document.getElementById('fEstado').value = p.estado || 'ok';
  document.getElementById('fEstadoComercial').value = p.estadoComercial || 'cotizacion';
  document.getElementById('fClienteId').value = p.clienteId || '';
  document.getElementById('fCliente').value = p.clienteArtista || '';
  document.getElementById('fCorreoCliente').value = p.clienteEmail || '';
  document.getElementById('fProductor').value = p.productorEjecutivo || '';
  document.getElementById('fEtapa').value = p.etapaActual || 'preproduccion';
  document.getElementById('fFechaEntrega').value = p.fechaEntregaEstimada ? p.fechaEntregaEstimada.split('T')[0] : '';
  document.getElementById('fCantTemas').value = p.cantTemas || 1;
  document.getElementById('fNarrativa').value = p.narrativa || '';
  document.getElementById('fPresupuesto').value = (p.costos && p.costos.presupuesto) || '';
  document.getElementById('fNotasInternas').value = (p.costos && p.costos.notasInternas) || '';
  document.getElementById('equipoContainer').innerHTML = '';
  if(p.equipo && p.equipo.length){
    p.equipo.forEach(e => agregarFilaEquipo(e.rol, e.nombre));
  } else {
    agregarFilaEquipo();
  }
  instrumentacionState = instrumentacionVacia();
  if(p.instrumentacion){
    Object.keys(instrumentacionState).forEach(key => {
      if(Array.isArray(p.instrumentacion[key])) instrumentacionState[key] = p.instrumentacion[key];
    });
  }
  instrGruposAbiertos = {};
  renderInstrumentacion();
  document.getElementById('modalBg').classList.add('active');
}

// ============ EXPORTAR PDF ============
function exportarPDF(modo){
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const goldRGB = [201, 162, 75];
  const darkRGB = [11, 11, 13];
  const surfRGB = [21, 21, 23];
  const mutedRGB = [154, 151, 143];
  const pageW = 210;
  const marginX = 18;

  // ===== HEADER dark con marca =====
  doc.setFillColor(...darkRGB);
  doc.rect(0, 0, pageW, 38, 'F');
  doc.setDrawColor(...goldRGB);
  doc.setLineWidth(0.6);
  doc.line(0, 38, pageW, 38);

  doc.setTextColor(...goldRGB);
  doc.setFont(undefined, 'bold');
  doc.setFontSize(20);
  doc.text('AUDIOLINK', marginX, 20);
  doc.setFontSize(8.5);
  doc.setFont(undefined, 'normal');
  doc.setTextColor(...mutedRGB);
  doc.text(
    modo === 'interno' ? 'INFORME INTERNO · CONFIDENCIAL' : 'RESUMEN DE PROYECTO',
    marginX, 28
  );
  doc.setFontSize(8);
  doc.text(new Date().toLocaleDateString('es-CO', { day:'2-digit', month:'long', year:'numeric' }), pageW - marginX, 28, { align:'right' });

  // ===== TÍTULO PROYECTO =====
  let y = 52;
  doc.setTextColor(20, 20, 20);
  doc.setFont(undefined, 'bold');
  doc.setFontSize(17);
  doc.text(p.nombre || 'Sin nombre', marginX, y);

  // tag tipo + badge estado
  y += 7;
  doc.setFontSize(8.5);
  doc.setFont(undefined, 'normal');
  doc.setTextColor(...mutedRGB);
  doc.text((p.tipo === 'propio' ? 'PROYECTO PROPIO' : 'CLIENTE') + '   ·   ETAPA: ' + (ETAPAS_LABEL[p.etapaActual] || '—').toUpperCase(), marginX, y);

  y += 10;
  doc.setDrawColor(230, 230, 230);
  doc.setLineWidth(0.3);
  doc.line(marginX, y, pageW - marginX, y);
  y += 10;

  // ===== FICHA DATOS (bloque con fondo suave) =====
  const fichaAltura = 45;
  doc.setFillColor(246, 244, 239);
  doc.roundedRect(marginX, y - 6, pageW - marginX*2, fichaAltura, 2, 2, 'F');

  const colIzqX = marginX + 6;
  const colDerX = marginX + 98;
  let yFicha = y + 2;

  const campoFicha = (x, yy, label, val) => {
    doc.setFontSize(7.5);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(...goldRGB.map ? goldRGB : goldRGB);
    doc.setTextColor(140, 108, 40);
    doc.text(label.toUpperCase(), x, yy);
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    doc.setTextColor(30, 30, 30);
    doc.text(String(val || '—'), x, yy + 5.5);
  };

  campoFicha(colIzqX, yFicha, 'Cliente / Artista', p.clienteArtista);
  campoFicha(colDerX, yFicha, 'Productor Ejecutivo', p.productorEjecutivo);
  yFicha += 13;
  campoFicha(colIzqX, yFicha, 'Etapa actual', ETAPAS_LABEL[p.etapaActual]);
  campoFicha(colDerX, yFicha, 'Entrega estimada', p.fechaEntregaEstimada ? new Date(p.fechaEntregaEstimada).toLocaleDateString('es-CO') : '—');
  yFicha += 13;
  campoFicha(colIzqX, yFicha, 'Estado comercial', COMERCIAL_LABEL[p.estadoComercial] || 'Cotización');

  y += fichaAltura + 20;

  // ===== EQUIPO =====
  if(p.equipo && p.equipo.length){
    doc.setFontSize(10.5);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(20, 20, 20);
    doc.text('Equipo asignado', marginX, y);
    y += 7;
    doc.setFontSize(9.5);
    doc.setFont(undefined, 'normal');
    p.equipo.forEach(e => {
      doc.setTextColor(...goldRGB.map ? [140,108,40] : [140,108,40]);
      doc.setFont(undefined, 'bold');
      doc.text('•', marginX, y);
      doc.setTextColor(50, 50, 50);
      doc.text(`${e.rol}: `, marginX + 5, y);
      doc.setFont(undefined, 'normal');
      const rolWidth = doc.getTextWidth(`${e.rol}: `);
      doc.text(e.nombre || '', marginX + 5 + rolWidth, y);
      y += 6.5;
    });
    y += 4;
  }

  // ===== NARRATIVA =====
  if(p.narrativa){
    doc.setFontSize(10.5);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(20, 20, 20);
    doc.text('Contexto', marginX, y);
    y += 3;
    doc.setDrawColor(...goldRGB);
    doc.setLineWidth(1.2);
    doc.line(marginX, y, marginX, y + 1);
    y += 6;
    doc.setFontSize(9.5);
    doc.setFont(undefined, 'normal');
    doc.setTextColor(70, 70, 70);
    const splitNarrativa = doc.splitTextToSize(p.narrativa, pageW - marginX*2 - 4);
    doc.text(splitNarrativa, marginX + 4, y);
    y += splitNarrativa.length * 5.5 + 6;
  }

  // ===== BLOQUE CONFIDENCIAL (solo interno) =====
  if(modo === 'interno'){
    y += 4;
    doc.setFillColor(217, 164, 65);
    doc.roundedRect(marginX, y - 6, pageW - marginX*2, 10, 1.5, 1.5, 'F');
    doc.setTextColor(35, 27, 10);
    doc.setFont(undefined, 'bold');
    doc.setFontSize(9);
    doc.text('⚠  INFORMACIÓN CONFIDENCIAL — SOLO USO INTERNO', marginX + 4, y);
    y += 14;

    doc.setTextColor(30, 30, 30);
    doc.setFontSize(9.5);
    doc.setFont(undefined, 'bold');
    doc.text('Presupuesto:', marginX, y);
    doc.setFont(undefined, 'normal');
    const presupuesto = (p.costos && p.costos.presupuesto) ? p.costos.presupuesto.toLocaleString('es-CO') : '0';
    doc.text(`$${presupuesto}`, marginX + 32, y);
    y += 8;

    if(p.costos && p.costos.notasInternas){
      doc.setFont(undefined, 'bold');
      doc.text('Notas internas:', marginX, y);
      y += 6;
      doc.setFont(undefined, 'normal');
      doc.setFontSize(9);
      const splitNotas = doc.splitTextToSize(p.costos.notasInternas, pageW - marginX*2);
      doc.text(splitNotas, marginX, y);
      y += splitNotas.length * 5;
    }
  }

  // ===== FOOTER =====
  const pageHeight = doc.internal.pageSize.height;
  doc.setDrawColor(230, 230, 230);
  doc.setLineWidth(0.2);
  doc.line(marginX, pageHeight - 15, pageW - marginX, pageHeight - 15);
  doc.setFontSize(7.5);
  doc.setTextColor(...mutedRGB);
  doc.setFont(undefined, 'normal');
  doc.text('AUDIOLINK — Producción y Logística Musical', marginX, pageHeight - 10);
  doc.text(modo === 'interno' ? 'Documento confidencial' : 'Documento generado automáticamente', pageW - marginX, pageHeight - 10, { align:'right' });

  // Abrir en pestaña nueva en vez de descargar
  const blobUrl = doc.output('bloburl');
  window.open(blobUrl, '_blank');
}

// ============ MODAL: EQUIPO INTERNO (v2.1) ============
// Colección equipoInterno, id de documento = correo. Se guarda activo:true
// porque el guard de sesión existente (login.html, proyecto.html, logistica.html,
// index.html, portal.html) exige doc.data().activo === true. Mismo patrón de
// PsicoGestión (agregadoEn), adaptado a ese requisito.
function abrirModalEquipoInterno(){
  document.getElementById('equipoErr').textContent = '';
  document.getElementById('equipoNuevoCorreo').value = '';
  cargarListaEquipoInterno();
  document.getElementById('modalEquipoBg').classList.add('active');
}

function cerrarModalEquipoInterno(){
  document.getElementById('modalEquipoBg').classList.remove('active');
}

async function cargarListaEquipoInterno(){
  const cont = document.getElementById('equipoLista');
  cont.innerHTML = '<div class="empty" style="padding:16px;">Cargando...</div>';
  try{
    const snap = await db.collection('equipoInterno').get();
    if(snap.empty){
      cont.innerHTML = '<div class="empty" style="padding:16px;">Sin correos registrados.</div>';
      return;
    }
    cont.innerHTML = snap.docs.map(d => `
      <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--brd);border-radius:8px;padding:10px 14px;background:var(--surf-light);">
        <span style="font-size:0.88rem;">${escapeHtml(d.id)}</span>
        <span style="color:var(--err);cursor:pointer;font-size:0.9rem;" onclick="window._eiQuitar('${d.id}')" title="Quitar acceso">✕</span>
      </div>`).join('');
  } catch(err){
    console.error(err);
    cont.innerHTML = '<div class="empty" style="padding:16px;">No pudimos cargar la lista.</div>';
  }
}

async function agregarEquipoInterno(){
  const errEl = document.getElementById('equipoErr');
  errEl.textContent = '';
  const correo = document.getElementById('equipoNuevoCorreo').value.trim().toLowerCase();
  if(!correo || !correo.includes('@')){
    errEl.textContent = 'Ingresa un correo válido.';
    return;
  }
  try{
    await db.collection('equipoInterno').doc(correo).set({
      activo: true,
      agregadoEn: new Date().toISOString()
    });
    document.getElementById('equipoNuevoCorreo').value = '';
    cargarListaEquipoInterno();
  } catch(err){
    console.error(err);
    errEl.textContent = 'No pudimos agregar el correo. Intenta de nuevo.';
  }
}

window._eiQuitar = async function(correo){
  if(auth.currentUser && correo === auth.currentUser.email){
    alert('No puedes quitarte a ti mismo del equipo interno desde aquí.');
    return;
  }
  if(!confirm(`¿Quitar a ${correo} del equipo interno? Perderá acceso administrativo.`)) return;
  try{
    await db.collection('equipoInterno').doc(correo).delete();
    cargarListaEquipoInterno();
  } catch(err){
    console.error(err);
    alert('No pudimos eliminar el correo.');
  }
};

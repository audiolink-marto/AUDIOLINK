async function agregarIngenieroAlProyecto(){
  const errEl = document.getElementById('ingenieroErr');
  errEl.textContent = '';
  const correo = document.getElementById('ingenieroNuevoCorreo').value.trim().toLowerCase();
  const nombre = document.getElementById('ingenieroNuevoNombre').value.trim();
  if(!correo || !correo.includes('@')){
    errEl.textContent = 'Ingresa un correo válido.';
    return;
  }
  try{
    const ref = db.collection('ingenieros').doc(correo);
    const doc = await ref.get();
    if(doc.exists){
      // Ya existe (puede estar asignado a otros proyectos) — solo se
      // agrega este proyecto a su array, y se reactiva por si estaba
      // desactivado. El nombre solo se actualiza si se escribió uno
      // (no se borra un nombre ya guardado por dejar el campo vacío).
      const datosActualizar = {
        proyectosAsignados: firebase.firestore.FieldValue.arrayUnion(proyectoActualId),
        activo: true
      };
      if(nombre) datosActualizar.nombre = nombre;
      await ref.update(datosActualizar);
    } else {
      if(!nombre){
        errEl.textContent = 'Ingresa el nombre del ingeniero (primera vez que se registra).';
        return;
      }
      // v4.20: además del doc de Firestore, se crea la cuenta real de
      // Firebase Auth con contraseña temporal + correo de "crear tu
      // contraseña" — mismo patrón que _pcActivar de clientes.html.
      // Sin esto el ingeniero nunca tenía forma real de loguearse.
      try{
        const passTemp = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
        await authIng.createUserWithEmailAndPassword(correo, passTemp);
        await authIng.sendPasswordResetEmail(correo, ingActionCodeSettings);
        await authIng.signOut();
      } catch(authErr){
        console.error(authErr);
        if(authErr.code === 'auth/email-already-in-use'){
          // Ya tiene cuenta de Auth (ej. quedó a medias en un intento
          // anterior) — no es un error real, seguimos y guardamos el doc.
        } else {
          errEl.textContent = 'No pudimos crear la cuenta de acceso. Intenta de nuevo.';
          return;
        }
      }
      await ref.set({
        nombre,
        activo: true,
        proyectosAsignados: [proyectoActualId],
        agregadoEn: new Date().toISOString()
      });
    }
    document.getElementById('ingenieroNuevoCorreo').value = '';
    document.getElementById('ingenieroNuevoNombre').value = '';
    cargarListaIngenieros();
  } catch(err){
    console.error(err);
    errEl.textContent = 'No pudimos agregar el correo. Intenta de nuevo.';
  }
}

// Quita SOLO el acceso a este proyecto (arrayRemove) — nunca borra el
// doc completo, porque el ingeniero puede tener otros proyectos
// asignados. Si tras quitar este proyecto se queda sin ninguno, el doc
// se conserva igual (activo:true pero proyectosAsignados vacío = sin
// acceso real a nada, esIngenieroDe() ya lo bloquea solo).
// v4.20 — mismo patrón que _pcReenviar de clientes.html: reenvía el
// correo de "crear tu contraseña" por si el ingeniero lo perdió o

window._ingReenviar = async function(correo){

// v4.20 — link genérico de login del Inge (mismo login.html que usa el
// staff, la propia colección `ingenieros` decide el rol al entrar).
const LOGIN_ING_URL = 'https://audiolink-marto.github.io/AUDIOLINK/login.html';
window._ingCopiarLink = function(btnId){
  const btn = document.getElementById(`ingCopiar-${btnId}`);
  const textoOriginal = btn ? btn.textContent : '';
  const marcarCopiado = () => {
    if(!btn) return;
    btn.textContent = '✅ Copiado';
    setTimeout(() => { btn.textContent = textoOriginal; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(LOGIN_ING_URL).then(marcarCopiado).catch(() => {
      alert(`Copia manual: ${LOGIN_ING_URL}`);
    });
  } else {
    alert(`Copia manual: ${LOGIN_ING_URL}`);
  }
};

// ============ MODAL TEMAS (v5.4) ============
// temasDash ya viene cargado en tiempo real por el listener existente
// (suscribirDashboardDetalle) — este modal reutiliza esos mismos datos
// en vez de abrir un listener nuevo, así que se mantiene sincronizado
// solo mientras el modal está abierto (se refresca manual tras cada
// escritura, igual que el resto de modales del archivo).
const ETIQUETA_ESTADO_TEMA = { pendiente: 'Pendiente', en_proceso: 'En proceso', aprobado: 'Aprobado' };

function abrirModalTemas(){
  if(!proyectoActualId){
    alert('Abre un proyecto primero.');
    return;
  }
  document.getElementById('temaErr').textContent = '';
  document.getElementById('temaNuevoNombre').value = '';
  renderListaTemasModal();
  document.getElementById('modalTemasBg').classList.add('active');
}

function cerrarModalTemas(){
  document.getElementById('modalTemasBg').classList.remove('active');
}

function renderListaTemasModal(){
  const cont = document.getElementById('temaLista');
  if(!temasDash.length){
    cont.innerHTML = '<div class="empty" style="padding:16px;">Aún no hay temas en este proyecto.</div>';
    return;
  }
  const ordenados = [...temasDash].sort((a, b) => (a.orden ?? Infinity) - (b.orden ?? Infinity) || (a.nombre || '').localeCompare(b.nombre || ''));
  const etapas = [
    { campo: 'estadoEdicion', label: 'Edición' },
    { campo: 'estadoMezcla', label: 'Mezcla' },
    { campo: 'estadoMastering', label: 'Mastering' }
  ];
  cont.innerHTML = ordenados.map((t, i) => {
    const sesionesDelTema = sesionesDash.filter(s => s.temaId === t.id);
    const grab = calcularEstadoGrabacionTema(sesionesDelTema);
    const inactivo = t.activo === false;
    return `
    <div class="tema-modal-row ${inactivo ? 'tema-inactivo' : ''}">
      <div class="fila-top">
        <div class="orden-btns">
          <button type="button" title="Subir" ${i === 0 ? 'disabled style="opacity:0.25;"' : ''} onclick="moverTema('${t.id}', -1)">▲</button>
          <button type="button" title="Bajar" ${i === ordenados.length - 1 ? 'disabled style="opacity:0.25;"' : ''} onclick="moverTema('${t.id}', 1)">▼</button>
        </div>
        <input type="text" value="${escapeHtml(t.nombre || '')}" onblur="renombrarTema('${t.id}', this.value)">
        ${inactivo ? '<span class="tema-badge-inactivo" title="Desactivado en logística — no aparece para sesiones nuevas">Inactivo</span>' : ''}
      </div>
      <div class="estados-row">
        ${etapas.map(e => `
          <label>${e.label}
            <select onchange="actualizarEstadoTema('${t.id}', '${e.campo}', this.value)">
              ${Object.keys(ETIQUETA_ESTADO_TEMA).map(v => `<option value="${v}" ${(t[e.campo] || 'pendiente') === v ? 'selected' : ''}>${ETIQUETA_ESTADO_TEMA[v]}</option>`).join('')}
            </select>
          </label>
        `).join('')}
      </div>
      <div class="meta-row">
        <span>🎙️ Grabación: ${grab.texto}</span>
      </div>
      <div class="tema-modal-acciones">
        ${inactivo
          ? `<span class="link-add" onclick="toggleActivoTema('${t.id}', true)">↺ Reactivar</span>`
          : `<span class="link-add" onclick="toggleActivoTema('${t.id}', false)">⏸ Desactivar</span>`}
        <span class="btn-eliminar-tema" title="${sesionesDelTema.length > 0 ? 'No se puede eliminar: tiene sesiones asociadas' : 'Eliminar definitivamente'}" onclick="eliminarTemaDefinitivo('${t.id}', ${sesionesDelTema.length})">🗑️ Eliminar definitivo</span>
      </div>
    </div>`;
  }).join('');
}

async function agregarTema(){
  const errEl = document.getElementById('temaErr');
  errEl.textContent = '';
  const nombreEl = document.getElementById('temaNuevoNombre');
  const nombre = nombreEl.value.trim();
  if(!nombre){
    errEl.textContent = 'Escribe un nombre para el tema.';
    return;
  }
  const ordenMax = temasDash.reduce((max, t) => Math.max(max, t.orden ?? -1), -1);
  try{
    await proyectosRef.doc(proyectoActualId).collection('temas').add({
      nombre,
      orden: ordenMax + 1,
      activo: true,
      estadoEdicion: 'pendiente',
      estadoMezcla: 'pendiente',
      estadoMastering: 'pendiente'
    });
    nombreEl.value = '';
  } catch(err){
    console.error(err);
    errEl.textContent = 'No pudimos crear el tema. Intenta de nuevo.';
  }
  // temasDash se actualiza solo vía el listener en tiempo real; el
  // re-render del modal se dispara desde ahí (ver refrescarModalTemasSiActivo).
}

async function renombrarTema(temaId, nuevoNombre){
  const nombre = (nuevoNombre || '').trim();
  const actual = temasDash.find(t => t.id === temaId);
  if(!nombre || !actual || nombre === actual.nombre) { renderListaTemasModal(); return; }
  try{
    await proyectosRef.doc(proyectoActualId).collection('temas').doc(temaId).update({ nombre });
  } catch(err){
    console.error(err);
    alert('No pudimos renombrar el tema.');
    renderListaTemasModal();
  }
}

async function actualizarEstadoTema(temaId, campo, valor){
  try{
    await proyectosRef.doc(proyectoActualId).collection('temas').doc(temaId).update({ [campo]: valor });
  } catch(err){
    console.error(err);
    alert('No pudimos actualizar el estado.');
    renderListaTemasModal();
  }
}

// Reordena intercambiando el `orden` con el tema vecino en esa
// dirección — swap simple, no reescribe toda la lista. Si alguno de
// los dos temas todavía no tenía `orden` (temas viejos), se le asigna
// su posición actual en el listado ordenado antes del swap.
async function moverTema(temaId, direccion){
  const ordenados = [...temasDash].sort((a, b) => (a.orden ?? Infinity) - (b.orden ?? Infinity) || (a.nombre || '').localeCompare(b.nombre || ''));
  const idx = ordenados.findIndex(t => t.id === temaId);
  const idxVecino = idx + direccion;
  if(idx === -1 || idxVecino < 0 || idxVecino >= ordenados.length) return;
  const actual = ordenados[idx];
  const vecino = ordenados[idxVecino];
  const ordenActual = actual.orden ?? idx;
  const ordenVecino = vecino.orden ?? idxVecino;
  try{
    const batch = db.batch();
    batch.update(proyectosRef.doc(proyectoActualId).collection('temas').doc(actual.id), { orden: ordenVecino });
    batch.update(proyectosRef.doc(proyectoActualId).collection('temas').doc(vecino.id), { orden: ordenActual });
    await batch.commit();
  } catch(err){
    console.error(err);
    alert('No pudimos reordenar los temas.');
  }
}

// v5.12 (a pedido de AUDIOLINK — "unificar borrado de tema con
// logistica.html"): reemplaza el hard-delete único por dos acciones
// separadas, mismo criterio que logistica.html (toggleActivoTema, campo
// `activo`), para que ambos archivos entiendan igual qué es un "tema
// apagado":
//  - toggleActivoTema(): soft-delete/reactivar, sin fricción, siempre
//    disponible. Es la acción por defecto.
//  - eliminarTemaDefinitivo(): hard delete real, SOLO ofrecido si el
//    tema no tiene sesiones vinculadas (nSesiones === 0) — si las
//    tiene, se fuerza a desactivar primero para no perder trazabilidad
//    de sesiones ya grabadas con ese temaId.
async function toggleActivoTema(temaId, activarAhora){
  const tema = temasDash.find(t => t.id === temaId);
  const nombre = tema ? tema.nombre : 'este tema';
  const accion = activarAhora ? 'reactivar' : 'desactivar';
  if(!confirm(`¿${accion.charAt(0).toUpperCase() + accion.slice(1)} el tema "${nombre}"?`)) return;
  try{
    await proyectosRef.doc(proyectoActualId).collection('temas').doc(temaId).update({ activo: activarAhora });
  } catch(err){
    console.error(err);
    alert(`No pudimos ${accion} el tema.`);
  }
}

async function eliminarTemaDefinitivo(temaId, nSesiones){
  const tema = temasDash.find(t => t.id === temaId);
  const nombre = tema ? tema.nombre : 'este tema';
  if(nSesiones > 0){
    alert(`"${nombre}" tiene ${nSesiones} sesión(es) asociada(s) — no se puede eliminar definitivamente sin perder esa trazabilidad. Desactívalo en su lugar.`);
    return;
  }
  if(!confirm(`¿Eliminar definitivamente el tema "${nombre}"? Esta acción no se puede deshacer.`)) return;
  try{
    await proyectosRef.doc(proyectoActualId).collection('temas').doc(temaId).delete();
  } catch(err){
    console.error(err);
    alert('No pudimos eliminar el tema.');
  }
}

// El listener de temasDash (suscribirDashboardDetalle) ya dispara
// refrescarDetalleSiActivo() en cada cambio; acá solo se engancha el
// refresco del modal si está abierto, sin tocar ese listener.
// ---- v5.7: modal "Gestionar Instrumentación" (dashboard) ----
// A diferencia de Temas, acá no hay listener de subcolección: el estado
// se carga una vez al abrir (desde `proyectos`, ya sincronizado por el
// listener principal) y se guarda entero (los dos campos) al hacer clic
// en Guardar. Reutiliza instrumentacionState/instrumentacionGruposState/
// renderInstrumentacion() de instrumentacion.js, sin tocar ese archivo.
function abrirModalInstrumentacion(){
  if(!proyectoActualId){
    alert('Abre un proyecto primero.');
    return;
  }
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;
  instrumentacionGruposState = (p.instrumentacionGrupos && Object.keys(p.instrumentacionGrupos).length)
    ? JSON.parse(JSON.stringify(p.instrumentacionGrupos))
    : catalogoInstrumentacionDefaultCopy();
  instrumentacionState = instrumentacionVacia();
  if(p.instrumentacion){
    Object.keys(instrumentacionState).forEach(key => {
      if(Array.isArray(p.instrumentacion[key])) instrumentacionState[key] = p.instrumentacion[key];
    });
  }
  instrGruposAbiertos = {};
  renderInstrumentacion();
  document.getElementById('modalInstrumentacionBg').classList.add('active');
}

function cerrarModalInstrumentacion(){
  document.getElementById('modalInstrumentacionBg').classList.remove('active');
}

async function guardarInstrumentacion(){
  if(!proyectoActualId) return;
  try{
    await proyectosRef.doc(proyectoActualId).update({
      instrumentacion: instrumentacionState,
      instrumentacionGrupos: instrumentacionGruposState
    });
    cerrarModalInstrumentacion();
  } catch(err){
    console.error('Error guardando instrumentación:', err);
    alert('No se pudo guardar la instrumentación. Revisa la consola.');
  }
}

function refrescarModalTemasSiActivo(){
  if(document.getElementById('modalTemasBg')?.classList.contains('active')){
    renderListaTemasModal();
  }
}

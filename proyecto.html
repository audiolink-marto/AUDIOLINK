.instr-grupo-titulo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.instr-grupo-acciones{display:flex;gap:6px;flex-shrink:0;}
.instr-grupo-body{padding:10px 12px;display:none;}
.instr-grupo.abierto .instr-grupo-body{display:block;}
.instr-pieza-row{display:grid;grid-template-columns:1fr 0.8fr 30px 30px 30px;gap:6px;margin-bottom:6px;align-items:center;}
.instr-subgrupo-input{font-size:0.82rem;opacity:0.85;}
.instr-opcion-row{display:grid;grid-template-columns:1fr 30px;gap:8px;margin-bottom:6px;align-items:center;}
.instr-pieza-row button,.instr-opcion-row button,.instr-footer-row button,.instr-grupo-acciones button{
  background:transparent;border:1px solid var(--brd);color:var(--err);
  border-radius:6px;padding:0 8px;cursor:pointer;height:34px;
}
.instr-grupo-acciones button{color:var(--muted);}
.instr-grupo-acciones button:disabled{opacity:0.35;cursor:not-allowed;}
.instr-pieza-row button:disabled{opacity:0.35;cursor:not-allowed;color:var(--muted);}
.instr-footer-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.instr-footer-row select{flex:1;min-width:140px;}
.instr-footer-row .link-add{align-self:center;}
@media (max-width:600px){
  .instr-pieza-row{grid-template-columns:1fr 0.75fr 26px 26px 26px;gap:4px;}
  .instr-subgrupo-input{font-size:0.76rem;padding:6px 6px;}
}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
/* v4.23: Cancelar/Guardar del editor de proyecto pasan a chip flotante
   translúcido, mismo patrón que logistica.html v2.54 — pero adaptado:
   acá el scroll pasa DENTRO de #modalBg (overflow-y:auto propio, ver
   .modal-bg), no en window, así que el listener (más abajo, en script)
   escucha el scroll de #modalBg y no de window. z-index por encima del
   overlay (.modal-bg es z-index:100) para no quedar tapado por el
   fondo oscuro. No se tocó el resto de modales (Equipo/Ingenieros) ni
   sus .modal-actions — solo el modal principal de edición de proyecto. */
#modalBg .modal-actions.float-chip{
  position:fixed;left:50%;bottom:24px;margin-top:0;
  transform:translate(-50%,0);
  background:color-mix(in srgb, var(--surf) 78%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--brd);border-radius:999px;
  padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,0.28);
  z-index:110;justify-content:center;
  transition:transform 0.25s ease,opacity 0.25s ease;
}
@supports not (backdrop-filter: blur(1px)){
  #modalBg .modal-actions.float-chip{background:var(--surf);}
}
#modalBg .modal-actions.float-chip button{border-radius:999px;}
#modalBg .modal-actions.float-chip.oculto{
  transform:translate(-50%,140%);opacity:0;pointer-events:none;
}
@media (max-width:768px){
  #modalBg .modal-actions.float-chip{bottom:calc(var(--bn-h, 58px) + 14px);}
}
.link-add{color:var(--gold);font-size:0.8rem;cursor:pointer;display:inline-block;margin-top:4px;}
.field input[type="file"]{padding:8px 10px;font-size:0.82rem;color:var(--muted);}
/* Detalle */
.detalle{display:none;}
.detalle.active{display:block;}
.detalle-head{
  background:var(--surf);border:1px solid var(--brd);border-radius:10px;
  padding:24px;margin-bottom:20px;
}
.detalle-head h2{font-size:1.4rem;color:var(--gold);margin-bottom:6px;}
.resumen-financiero{display:flex;gap:24px;flex-wrap:wrap;background:var(--surf-2,rgba(255,255,255,0.03));border:1px solid var(--brd);border-radius:8px;padding:14px 18px;margin-bottom:16px;}
.resumen-financiero .monto-item{font-size:0.85rem;}
.resumen-financiero .monto-item .lbl{color:var(--muted);display:block;font-size:0.72rem;}
.resumen-financiero .monto-item .val{font-weight:600;font-size:1rem;}
.resumen-financiero .monto-item.saldo .val{color:var(--warn);}
.resumen-financiero .monto-item.saldo.pagado .val{color:var(--ok);}
.dash-etapa-bar{display:flex;gap:3px;margin:6px 0 14px;}
.dash-etapa-bar span{flex:1;height:6px;border-radius:3px;background:var(--brd);}
.dash-etapa-bar span.hecha{background:var(--ok);}
.dash-etapa-bar span.actual{background:var(--gold);}
/* Ruta de etapas (v4.4) — traída tal cual de portal.html (mismas clases:
   .etapa-ruta, .etapa-nodo-row, .etapa-nodo-col, .etapa-linea,
   .etapa-nodo-txt) para unificar el dashboard con el portal de clientes. */
.etapa-ruta{margin-top:14px;}
.etapa-nodo-row{display:flex;gap:12px;}
.etapa-nodo-col{display:flex;flex-direction:column;align-items:center;}
.etapa-nodo{width:18px;height:18px;min-width:18px;border-radius:50%;border:2px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;background:var(--surf);}
.etapa-nodo.hecha{border-color:var(--ok);background:var(--ok);color:var(--bg);}
.etapa-nodo.actual{border-color:var(--etapa-acento, var(--gold));background:var(--etapa-acento-bg, var(--gold-bg));box-shadow:0 0 0 3px var(--etapa-acento-bg, var(--gold-bg));position:relative;}
.etapa-nodo.actual::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--gold);
  animation:etapaPulso 2.2s ease-out infinite;
}
@keyframes etapaPulso{
  0%{transform:scale(0.85);opacity:0.9;}
  100%{transform:scale(1.9);opacity:0;}
}
.etapa-nodo.pendiente{opacity:0.55;}
.etapa-linea{width:2px;flex:1;min-height:22px;background:var(--brd);margin:2px 0;}
.etapa-linea.hecha{background:var(--ok);}
.etapa-nodo-txt{padding-bottom:18px;}
.etapa-nodo-txt span{display:block;font-size:0.85rem;font-weight:600;color:var(--txt);}
.etapa-nodo-txt span.pendiente{color:var(--faint);font-weight:500;}
.etapa-nodo-txt span.actual{color:var(--etapa-acento, var(--gold));}
.etapa-nodo-txt span.hecha{color:var(--ok);}
.etapa-nodo-txt small{display:block;margin-top:2px;font-size:0.72rem;color:var(--muted);}
.etapa-nodo-txt small.etapa-actual-tag{color:var(--etapa-acento, var(--gold));}
@media (min-width:640px){
  .etapa-ruta{display:flex;align-items:flex-start;}
  .etapa-nodo-row{flex:1;flex-direction:column;gap:6px;}
  .etapa-nodo-col{flex-direction:row;width:100%;align-items:center;}
  .etapa-linea{width:auto;flex:1;height:2px;min-height:0;margin:0 4px;}
  .etapa-nodo-txt{padding-bottom:0;text-align:center;}
}
.dash-financiera-bar{height:8px;border-radius:4px;background:var(--brd);overflow:hidden;margin:6px 0 14px;}
.dash-financiera-bar div{height:100%;background:#6ea3e8;}
.dash-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.dash-card{background:var(--surf-2,rgba(255,255,255,0.03));border:1px solid var(--brd);border-radius:8px;padding:12px 14px;}
.dash-card .lbl{font-size:0.72rem;color:var(--muted);display:block;margin-bottom:4px;}
.dash-card .val{font-size:1.3rem;font-weight:600;}
@media (max-width:600px){.dash-cards{grid-template-columns:1fr 1fr;}}
.dash-calendario{background:var(--surf-2,rgba(255,255,255,0.03));border:1px solid var(--brd);border-top:2px solid var(--etapa-acento, var(--brd));border-radius:8px;padding:14px 18px;margin-bottom:16px;position:relative;}
.dash-cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:0.85rem;}
.dash-cal-head button{background:transparent;border:1px solid var(--brd);color:var(--txt);border-radius:6px;cursor:pointer;padding:2px 8px;}
.dash-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:0.85rem;}
.dash-cal-grid .dow{color:var(--muted);padding-bottom:4px;font-size:0.7rem;}
/* v4.24: celda cuadrada + fondo propio + resaltado de "hoy", mismo
   criterio visual que .cal-day/.cal-day.today de index.html (Dashboard)
   — a pedido del usuario, para que ambos calendarios se vean iguales.
   El tooltip de detalle (dash-cal-tooltip) y los colores de los puntos
   (pasada/proxima/entrega, distintos de ok/warn/err de index.html) se
   dejan como están a propósito: son diferencias funcionales, no
   estéticas — cada calendario muestra información distinta. */
.dash-cal-day{
  position:relative;aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;border-radius:8px;cursor:default;
  background:var(--surf-light);border:1px solid transparent;
}
.dash-cal-day.hoy{border-color:var(--gold);}
.dash-cal-day.con-evento{cursor:pointer;}
.dash-cal-day.con-evento:hover{border-color:var(--gold);}
/* v5.10: días vacíos también son clicables (abren logística) desde
   v5.8, pero les faltaba el mismo cursor:pointer que ya tenían los
   días con eventos — sin esto no había ninguna señal de que se podían
   tocar. Se deja aparte de .con-evento (no hereda su :hover con borde
   dorado) porque ese color ya significa "hay algo acá", y un día vacío
   no tiene nada que resaltar, solo es un atajo de creación. */
.dash-cal-day.clicable{cursor:pointer;}
.dash-cal-dots{display:flex;gap:2px;justify-content:center;margin-top:2px;}
.dash-cal-dots span{width:5px;height:5px;border-radius:50%;}
.dot-pasada{background:var(--ok);}
.dot-proxima{background:#6ea3e8;}
.dot-entrega{background:var(--warn);}
.dash-cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:0.7rem;color:var(--muted);}
.dash-cal-legend span{display:inline-flex;align-items:center;gap:4px;}
.dash-cal-legend i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dash-cal-legend i.pasada{background:var(--ok);}
.dash-cal-legend i.proxima{background:#6ea3e8;}
.dash-cal-legend i.entrega{background:var(--warn);}
.dash-cal-tooltip{
  position:absolute;z-index:20;background:var(--surf);border:1px solid var(--brd);border-radius:8px;
  padding:10px 12px;font-size:0.78rem;min-width:180px;box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.dash-cal-tooltip a{color:var(--gold);}
.dash-proxima-sesion{font-size:0.85rem;color:var(--muted);margin-bottom:16px;}

/* ============ DASHBOARD DE PROYECTO — secciones v4.24 ============ */
.dash-seccion{margin:18px 0;}
/* v4.33: acento visual por etapa del proyecto — variable CSS --etapa-acento
   definida según la clase etapa-X que pone renderDetalleContent() en
   #vistaDetalle. Es solo "temperatura" visual (borde de sección de título +
   borde superior del mini-calendario), no cambia contenido ni layout.
   Colores dentro de la paleta existente salvo Edición (#9b8ee0, violeta
   suave nuevo, único tono agregado). */
#vistaDetalle.etapa-preproduccion{ --etapa-acento: var(--muted); --etapa-acento-bg: rgba(154,151,143,0.12); }
#vistaDetalle.etapa-grabacion{ --etapa-acento: #6ea3e8; --etapa-acento-bg: rgba(110,163,232,0.12); }
#vistaDetalle.etapa-edicion{ --etapa-acento: #9b8ee0; --etapa-acento-bg: rgba(155,142,224,0.12); }
#vistaDetalle.etapa-mezcla{ --etapa-acento: var(--warn); --etapa-acento-bg: rgba(217,164,65,0.12); }
#vistaDetalle.etapa-mastering{ --etapa-acento: #5ec9b8; --etapa-acento-bg: rgba(94,201,184,0.12); }
#vistaDetalle.etapa-entrega{ --etapa-acento: var(--ok); --etapa-acento-bg: rgba(76,175,125,0.12); }
.dash-seccion-titulo{
  font-size:0.78rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:0.04em;margin-bottom:8px;font-weight:600;
  border-left:3px solid var(--etapa-acento, var(--brd));padding-left:8px;
}
.dash-temas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.dash-tema-card{
  background:var(--surf-2,rgba(255,255,255,0.03));border:1px solid var(--brd);
  border-radius:8px;padding:10px 12px;
}
.dash-tema-card .nombre{font-size:0.88rem;font-weight:600;margin-bottom:6px;}
.dash-tema-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip-mini{
  font-size:0.68rem;padding:2px 8px;border-radius:10px;font-weight:600;
  letter-spacing:0.02em;
}
.chip-mini.con-notas{background:rgba(76,175,125,0.15);color:var(--ok);}
.chip-mini.sin-iniciar{background:rgba(154,151,143,0.12);color:var(--muted);}
/* v5.4: chips de estado real por etapa (reemplazan la lectura binaria) */
.chip-mini.estado-pendiente{background:rgba(154,151,143,0.12);color:var(--muted);}
.chip-mini.estado-en_proceso{background:rgba(217,164,65,0.15);color:var(--warn);}
.chip-mini.estado-aprobado{background:rgba(76,175,125,0.15);color:var(--ok);}
.dash-tema-card .sesiones-count{font-size:0.72rem;color:var(--muted);margin-top:6px;}
.dash-temas-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.dash-temas-mismatch{font-size:0.78rem;color:var(--warn);background:rgba(217,164,65,0.08);border-radius:6px;padding:6px 10px;margin-bottom:10px;}
.btn-mini{background:var(--gold-bg,rgba(212,175,88,0.1));color:var(--gold,#d4af58);border:1px solid var(--gold,#d4af58);border-radius:6px;padding:5px 10px;font-size:0.76rem;cursor:pointer;white-space:nowrap;}
.btn-mini:hover{background:var(--gold,#d4af58);color:var(--bg);}
.tema-modal-row{border:1px solid var(--brd);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surf-light,rgba(255,255,255,0.02));}
.tema-modal-row .fila-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.tema-modal-row .fila-top input[type="text"]{flex:1;background:transparent;border:1px solid var(--brd);border-radius:6px;padding:5px 8px;color:inherit;font-size:0.86rem;}
.tema-modal-row .orden-btns{display:flex;flex-direction:column;gap:0;}
.tema-modal-row .orden-btns button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.72rem;line-height:1;padding:2px 4px;}
.tema-modal-row .orden-btns button:hover{color:var(--gold,#d4af58);}
.tema-modal-row .estados-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:0.76rem;}
.tema-modal-row .estados-row label{display:flex;flex-direction:column;gap:2px;color:var(--muted);}
.tema-modal-row .estados-row select{background:var(--surf,transparent);border:1px solid var(--brd);border-radius:5px;padding:3px 6px;color:inherit;font-size:0.78rem;}
.tema-modal-row .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:0.74rem;color:var(--muted);}
.tema-modal-row .btn-eliminar-tema{color:var(--err);cursor:pointer;}
/* v5.12: distinción visual de tema desactivado (activo:false, mismo
   campo que usa logistica.html) + acciones separadas (desactivar vs
   eliminar definitivo) en el modal de gestión. */
.tema-badge-inactivo{
  font-size:0.65rem;color:var(--muted);border:1px solid var(--brd);
  border-radius:999px;padding:1px 7px;font-weight:400;letter-spacing:0.02em;
}
.dash-tema-card.tema-inactivo,.tema-modal-row.tema-inactivo{opacity:0.55;}
.tema-modal-acciones{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:0.76rem;}
.dash-alertas{display:flex;flex-direction:column;gap:6px;}
.dash-alerta{
  display:flex;align-items:center;gap:8px;font-size:0.85rem;
  color:var(--warn);background:rgba(217,164,65,0.08);
  border:1px solid rgba(217,164,65,0.25);border-radius:6px;padding:8px 12px;
  text-decoration:none;cursor:pointer;transition:border-color 0.15s;
}
.dash-alerta:hover{border-color:var(--warn);}
.dash-sin-alertas{font-size:0.85rem;color:var(--muted);}
/* v5.11: mini-gestión de Equipo asignado en el dashboard */
.dash-equipo-lista{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.dash-equipo-fila{
  display:flex;align-items:center;justify-content:space-between;gap:8px;

}
.dash-equipo-agregar{display:flex;gap:8px;flex-wrap:wrap;}
.dash-equipo-agregar select,.dash-equipo-agregar input{flex:1;min-width:120px;}
.dash-pago-rapido{display:flex;gap:8px;flex-wrap:wrap;}
/* ===== v5.14: PDF Cliente/Interno migrado a HTML/CSS + window.print() ===
   Mismo lenguaje visual que cotizador.html (print-header, print-card,
   etc.) para que los documentos que le llegan al cliente sean consistentes
   entre sí. Reemplaza por completo el dibujo manual con jsPDF (coordenadas
   x/y a mano, sin salto de página) — acá el navegador pagina solo. */
@media print {
  @page { size: letter; margin: 15mm 15mm 15mm 15mm; }
  body { background:#FFFFFF !important; color:#000000 !important; font-family: var(--S); }
  .waveform-bg, #nav-mount, .main-wrap > header,
  #vistaListado, #modalBg, #modalEquipoBg,
  .sidebar, .mobile-topbar, .mobile-bottomnav, .mas-mobile-panel { display:none !important; }
  #vistaDetalle{ display:block !important; }
  #vistaDetalle > *:not(#print-view){ display:none !important; }
  #print-view{
    display:block !important; color:#000000 !important; padding:0;
    position:relative; min-height:100%;
  }
  .print-header{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid #C4982C; padding-bottom:16px; margin-bottom:24px;
  }
  .print-title{ font-family: var(--T); font-size:26px; font-weight:bold; color:#111111; letter-spacing:-0.02em; }
  .print-subtitle{ font-size:11px; color:#7A7060; font-family: var(--M); text-transform:uppercase; letter-spacing:0.15em; margin-top:2px; }
  .print-meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .print-card{
    background:#FAFAFA !important; border:1px solid #E5E5E5; border-radius:6px;
    padding:14px; font-size:12.5px; line-height:1.6;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .print-card-title{
    font-family: var(--M); font-size:10px; text-transform:uppercase;
    color:#7A7060; letter-spacing:0.05em; margin-bottom:6px;
  }
  .print-section-title{
    font-family: var(--M); font-size:11px; text-transform:uppercase;
    color:#111111; letter-spacing:0.05em; font-weight:bold;
    border-left:4px solid #C4982C; padding-left:10px; margin:22px 0 10px;
  }
  .print-equipo-item{ font-size:12.5px; margin-bottom:5px; }
  .print-equipo-item b{ color:#7A7060; font-weight:600; }
  .print-narrativa{ font-size:12px; line-height:1.6; color:#333333; white-space:pre-wrap; }
  .print-confidencial{
    background:#C4982C !important; color:#1a1400 !important; font-family: var(--M);
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em; font-weight:bold;
    padding:8px 12px; border-radius:3px; margin:22px 0 14px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .print-footer-container{ margin-top:30px; border-top:2px solid #111111; padding-top:16px; }
  .print-footer-grid{ display:flex; justify-content:space-between; font-size:10px; color:#555555; }
}

.dash-seccion-titulo-click{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;}
.dash-seccion-caret{font-size:0.7rem;transition:transform 0.15s;color:var(--faint);}
.dash-seccion-colapsable.colapsada .dash-seccion-caret{transform:rotate(-90deg);}
.dash-seccion-colapsable.colapsada .dash-seccion-body{display:none;}
.dash-seccion-nota{font-size:0.68rem;color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px;}
.dash-instr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.dash-instr-card{
  background:var(--surf-2,rgba(255,255,255,0.03));border:1px solid var(--brd);
  border-radius:8px;padding:10px 12px;
}
.dash-instr-card .nombre{font-size:0.88rem;font-weight:600;margin-bottom:6px;}
.dash-instr-chips{display:flex;gap:6px;flex-wrap:wrap;}
.dash-instr-vacio{font-size:0.85rem;color:var(--muted);}
.dash-card-click{cursor:pointer;}
.dash-card-click:hover{border-color:var(--gold);}
#dashConsentDetalle{margin-top:10px;border:1px solid var(--brd);border-radius:8px;padding:10px 12px;background:var(--surf-2,rgba(255,255,255,0.02));}

<script>
// ============ FIREBASE CONFIG ============
// TU_CONFIG_AQUI — reemplaza con el config real de tu proyecto Firebase
// (Firebase Console → Configuración del proyecto → Tus apps → SDK config)
/* firebaseConfig ahora vive en firebase-config.js (ecosistema compartido) */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
// v4.1: comentado — Firebase Storage requiere plan Blaze, no activado.
// const storage = firebase.storage(); // v4.0 — audio de Producción musical
const proyectosRef = db.collection('proyectos');
const clientesRef = db.collection('clientes');

// ===== APP SECUNDARIA PARA INGENIEROS (v4.20) =====
// Mismo patrón que authPortal en clientes.html: createUserWithEmailAndPassword
// cierra/reemplaza la sesión activa en la instancia donde se llama, así que
// usamos una segunda instancia de Firebase solo para crear la cuenta del
// ingeniero, sin tocar tu sesión de staff en la app principal.
const appIng = firebase.initializeApp(firebaseConfig, 'ing-activador');
const authIng = appIng.auth();
// Mismo motivo que portalActionCodeSettings de clientes.html: sin esto el
// correo de "crear tu contraseña" deja al ingeniero en una página genérica
// de Firebase en vez de traerlo de vuelta al login. A diferencia de
// portal.html (que sí tiene login propio embebido), ingeniero.html NO
// tiene pantalla de login — solo guard — así que apunta a login.html
// directo, no a ingeniero.html (evita el rebote innecesario).
const ingActionCodeSettings = {
  url: 'https://audiolink-marto.github.io/AUDIOLINK/login.html',
  handleCodeInApp: false
};

// ============ GUARD DE SESIÓN ============
let sesionValidada = false;
auth.onAuthStateChanged(async (user) => {
  if(!user){
    window.location.href = 'login.html';
    return;
  }
  try{
    const doc = await db.collection('equipoInterno').doc(user.email).get();
    if(!doc.exists || doc.data().activo !== true){
      await auth.signOut();
      window.location.href = 'login.html';
      return;
    }
    sesionValidada = true;
  } catch(e){
    console.error('Error validando sesión:', e);
    window.location.href = 'login.html';
  }
});

// cerrarSesion(), toggleTema(), toggleMasMobile() y el colapsar del sidebar
// ahora viven en nav.js (compartido por todo el ecosistema).

// ============ ESTADO ============
let proyectos = [];
let proyectoActualId = null;
let editando = false;

// resumenPagos: { [proyectoId]: { cotizacionId, cotizado, cobrado, saldo } }
// Se llena por separado del listener de `proyectos` (misma lógica de
// pagos.html: collectionGroup('cotizaciones') + subcolección pagos).
let resumenPagos = {};

// resumenEgresosProyecto: { total, porTipo:{musico,tecnico,estudio}, cantidad }
// del proyecto actualmente abierto en el detalle. Se recalcula cada vez que
// se abre un proyecto distinto (v5.21) — no es un mapa de todos los
// proyectos, solo del que está activo, para no disparar N consultas.
let resumenEgresosProyecto = null;
let unsubscribeEgresosProyecto = null;

function cargarEgresosProyecto(proyectoId){
  desuscribirEgresosProyecto();
  resumenEgresosProyecto = null;
  unsubscribeEgresosProyecto = db.collection('egresos').where('proyectoId', '==', proyectoId)
    .onSnapshot(snap => {
      const r = { total: 0, porTipo: { musico: 0, tecnico: 0, estudio: 0 }, cantidad: 0 };
      snap.forEach(d => {
        const eg = d.data();
        r.total += (eg.monto || 0);
        r.porTipo[eg.personaTipo] = (r.porTipo[eg.personaTipo] || 0) + (eg.monto || 0);
        r.cantidad += 1;
      });
      resumenEgresosProyecto = r;
      if(proyectoActualId === proyectoId) renderDetalleContent();
    }, err => console.error('Error escuchando egresos del proyecto:', err));
}

function desuscribirEgresosProyecto(){
  if(unsubscribeEgresosProyecto){
    unsubscribeEgresosProyecto();
    unsubscribeEgresosProyecto = null;
  }
}

// origenDetalle: si la URL trae ?from=pagos (ej. proyecto.html?id=X&from=pagos,
// como ahora enlaza pagos.html), el botón "volver" del detalle regresa a
// pagos.html en vez de al listado de proyectos. Sin ?from, comportamiento
// intacto de siempre.
const origenDetalle = new URLSearchParams(window.location.search).get('from');

const ETAPAS_LABEL = {
  preproduccion: "Preproducción",
  grabacion: "Grabación",
  edicion: "Edición",
  mezcla: "Mezcla",
  mastering: "Mastering",
  entrega: "Entrega"
};

const COMERCIAL_LABEL = {
  cotizacion: "Cotización",
  aprobado: "Aprobado",
  en_curso: "En curso",
  finalizado: "Finalizado"
};

// clientesLista: colección 'clientes' (v4.11), fuente principal del selector
// "Cliente" del formulario. Si no hay cliente vinculado (fClienteId vacío),
// se habilita el campo manual "Cliente / Artista" como atajo rápido para
// clientes no registrados en el CRUD (v4.27). clienteArtista/clienteEmail
// siguen siendo la fuente real guardada en cada proyecto.
let clientesLista = [];
clientesRef.orderBy('nombre').onSnapshot(snap => {
  clientesLista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const sel = document.getElementById('fClienteId');
  if(!sel) return;
  const actual = sel.value;
  sel.innerHTML = '<option value="">— Cliente rápido (escribir manualmente) —</option>' +
    clientesLista.map(c => `<option value="${c.id}">${escapeHtml(c.nombre || c.email || 'Sin nombre')}</option>`).join('');
  sel.value = actual;
}, err => console.error('Error escuchando clientes:', err));

function aplicarClienteSeleccionado(){
  const id = document.getElementById('fClienteId').value;
  const wrap = document.getElementById('fClienteManualWrap');
  if(!id){
    if(wrap) wrap.style.display = '';
    return;
  }
  if(wrap) wrap.style.display = 'none';
  const c = clientesLista.find(x => x.id === id);
  if(!c) return;
  document.getElementById('fCliente').value = c.nombre || '';
  document.getElementById('fCorreoCliente').value = c.email || '';
}

// equipoTecnicoCache: colección 'equipoTecnico' (v5.11), fuente del selector
// de "Equipo asignado" del proyecto. Reemplaza el input de texto libre de
// nombre por un <select> contra el catálogo, mismo patrón que logistica.html
// ("🔧 Técnicos asignados"). El rol sigue siendo texto editable por proyecto
// (una misma persona puede cumplir roles distintos según el proyecto).
let equipoTecnicoCache = [];
db.collection('equipoTecnico').orderBy('nombre').onSnapshot(snap => {
  equipoTecnicoCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  document.querySelectorAll('#equipoContainer .equipo-row').forEach(row => {
    const sel = row.querySelector('.equipo-tecnico-select');
    if(sel) poblarSelectTecnico(sel, sel.dataset.tecnicoId || '');
  });
  pintarSelectEquipoDash();
}, err => console.error('Error escuchando equipoTecnico:', err));

function poblarSelectTecnico(sel, tecnicoIdActual){
  const opciones = ['<option value="">— Seleccionar de equipoTecnico —</option>']
    .concat(equipoTecnicoCache.map(t => `<option value="${t.id}">${escapeHtml(t.nombre || 'Sin nombre')}</option>`));
  sel.innerHTML = opciones.join('');
  sel.value = tecnicoIdActual || '';
}

// ============ LISTENER TIEMPO REAL ============
proyectosRef.orderBy('creadoEn', 'desc').onSnapshot(snap => {
  proyectos = [];
  snap.forEach(doc => proyectos.push({ id: doc.id, ...doc.data() }));
  renderListado();
  refrescarDetalleSiActivo();
  const urlParams = new URLSearchParams(window.location.search);
  const idParam = urlParams.get('id');
  if(idParam && proyectoActualId === null && document.getElementById('vistaDetalle').classList.contains('active') === false){
    verDetalle(idParam);
  }
}, err => {
  console.error("Error cargando proyectos:", err);
});

// ============ RESUMEN FINANCIERO (Cotizado/Cobrado/Saldo) ============
// Mismo patrón que pagos.html: cotización aceptada por proyecto + suma de
// su subcolección pagos. No interfiere con el listener de `proyectos`.
db.collectionGroup('cotizaciones').where('estado', '==', 'aceptada')
  .onSnapshot(snap => {
    const vistos = new Set();
    snap.forEach(d => {
      const proyectoId = d.ref.parent.parent.id;
      vistos.add(proyectoId);
      const existente = resumenPagos[proyectoId];
      resumenPagos[proyectoId] = {
        cotizacionId: d.id,
        cotizado: d.data().total || 0,
        cobrado: existente ? existente.cobrado : 0,
        saldo: existente ? (d.data().total || 0) - existente.cobrado : (d.data().total || 0)
      };
      escucharPagosResumen(proyectoId, d.id);
    });
    // Proyectos que ya no tienen cotización aceptada (se desaceptó, etc.)
    Object.keys(resumenPagos).forEach(pid => {
      if(!vistos.has(pid)) delete resumenPagos[pid];
    });
    renderListado();
    refrescarDetalleSiActivo();
  }, err => {
    console.error('Error cargando resumen financiero (revisa el índice de collectionGroup si falla):', err);
  });

function refrescarDetalleSiActivo(){
  if(proyectoActualId && document.getElementById('vistaDetalle').classList.contains('active')){
    renderDetalleContent();
  }
}

/* ============ DASHBOARD DE PROYECTO (v4.3) ============
   Se agrega como landing del detalle, arriba del contenido existente
   (resumen financiero, chips, narrativa, equipo — nada de eso se toca).
   Usa datos ya disponibles (proyecto, resumenPagos) + dos listeners
   nuevos y acotados al proyecto abierto (sesiones y producción), que se
   desuscriben al salir del detalle o cambiar de proyecto para no dejar
   lecturas de Firestore corriendo de fondo. */
let unsubSesionesDash = null;
let unsubProduccionDash = null;
let sesionesDash = [];
let produccionDash = [];
let dashCalMes = new Date();

// --- v4.24: Temas (Edición/Mezcla/Mastering) ---
let unsubTemasDash = null;
let temasDash = [];

// --- v4.24: Tomas y Consentimientos, un listener POR SESIÓN (se crean/
// destruyen dinámicamente cuando cambia sesionesDash, ver
// actualizarListenersPorSesionDash()) ---
let unsubTomasPorSesion = {};       // { sesionId: unsubscribeFn }
let unsubConsentPorSesion = {};     // { sesionId: unsubscribeFn }
let tomasPorSesionDash = {};        // { sesionId: [tomas...] }
let consentPorSesionDash = {};      // { sesionId: [consentimientos...] }

function suscribirDashboardDetalle(id){
  if(unsubSesionesDash) unsubSesionesDash();
  if(unsubProduccionDash) unsubProduccionDash();
  if(unsubTemasDash) unsubTemasDash();
  limpiarListenersPorSesionDash();
  sesionesDash = [];
  produccionDash = [];
  temasDash = [];
  dashCalMes = new Date();
  unsubSesionesDash = proyectosRef.doc(id).collection('sesiones')
    .onSnapshot(snap => {
      sesionesDash = [];
      snap.forEach(d => sesionesDash.push({ id: d.id, ...d.data() }));
      actualizarListenersPorSesionDash(id);
      refrescarDetalleSiActivo();
    }, err => console.error('Error cargando sesiones del dashboard:', err));
  unsubProduccionDash = proyectosRef.doc(id).collection('produccion')
    .onSnapshot(snap => {
      produccionDash = [];
      snap.forEach(d => produccionDash.push({ id: d.id, ...d.data() }));
      refrescarDetalleSiActivo();
    }, err => console.error('Error cargando producción del dashboard:', err));

  // v4.24: temas del proyecto (Edición/Mezcla/Mastering viven acá desde
  // logistica.html v2.9, ver bitacora.html) — solo lectura.
  unsubTemasDash = proyectosRef.doc(id).collection('temas')
    .onSnapshot(snap => {
      temasDash = [];
      snap.forEach(d => temasDash.push({ id: d.id, ...d.data() }));
      refrescarDetalleSiActivo();
      refrescarModalTemasSiActivo();
    }, err => console.error('Error cargando temas del dashboard:', err));
}

// v4.24: tomas y consentimientos viven por SESIÓN
// (sesiones/{id}/tomas, sesiones/{id}/consentimientos), no hay una sola
// subcolección del proyecto que las traiga todas — así que se abre un
// listener por cada sesión existente, y se cierra el de las sesiones que
// ya no estén (se borró la sesión, o cambiamos de proyecto).
function actualizarListenersPorSesionDash(proyectoId){
  const idsActuales = new Set(sesionesDash.map(s => s.id));

  // cerrar listeners de sesiones que ya no existen
  Object.keys(unsubTomasPorSesion).forEach(sid => {
    if(!idsActuales.has(sid)){
      unsubTomasPorSesion[sid]();
      delete unsubTomasPorSesion[sid];
      delete tomasPorSesionDash[sid];
    }
  });
  Object.keys(unsubConsentPorSesion).forEach(sid => {
    if(!idsActuales.has(sid)){
      unsubConsentPorSesion[sid]();
      delete unsubConsentPorSesion[sid];
      delete consentPorSesionDash[sid];
    }
  });

  // abrir listeners nuevos para sesiones que aún no los tengan
  sesionesDash.forEach(s => {
    const sesionRef = proyectosRef.doc(proyectoId).collection('sesiones').doc(s.id);
    if(!unsubTomasPorSesion[s.id]){
      unsubTomasPorSesion[s.id] = sesionRef.collection('tomas').onSnapshot(snap => {
        tomasPorSesionDash[s.id] = [];
        snap.forEach(d => tomasPorSesionDash[s.id].push({ id: d.id, ...d.data() }));
        refrescarDetalleSiActivo();
      }, err => console.error('Error cargando tomas de sesión', s.id, err));
    }
    if(!unsubConsentPorSesion[s.id]){
      unsubConsentPorSesion[s.id] = sesionRef.collection('consentimientos').onSnapshot(snap => {
        consentPorSesionDash[s.id] = [];
        snap.forEach(d => consentPorSesionDash[s.id].push({ id: d.id, ...d.data() }));
        refrescarDetalleSiActivo();
      }, err => console.error('Error cargando consentimientos de sesión', s.id, err));
    }
  });
}

function limpiarListenersPorSesionDash(){
  Object.values(unsubTomasPorSesion).forEach(fn => fn());
  Object.values(unsubConsentPorSesion).forEach(fn => fn());
  unsubTomasPorSesion = {};
  unsubConsentPorSesion = {};
  tomasPorSesionDash = {};
  consentPorSesionDash = {};
}

function desuscribirDashboardDetalle(){
  if(unsubSesionesDash) { unsubSesionesDash(); unsubSesionesDash = null; }
  if(unsubProduccionDash) { unsubProduccionDash(); unsubProduccionDash = null; }
  if(unsubTemasDash) { unsubTemasDash(); unsubTemasDash = null; }
  limpiarListenersPorSesionDash();
}

function contarInstrumentacion(instr){
  if(!instr) return { grupos: 0, piezas: 0 };
  let grupos = 0, piezas = 0;
  Object.keys(instr).forEach(k => {
    if(Array.isArray(instr[k]) && instr[k].length){ grupos++; piezas += instr[k].length; }
  });
  return { grupos, piezas };
}

function renderBarraEtapa(etapaActual){
  const claves = Object.keys(ETAPAS_LABEL);
  const idxActual = claves.indexOf(etapaActual);
  return claves.map((k, i) => {
    let cls = '';
    if(i < idxActual) cls = 'hecha';
    else if(i === idxActual) cls = 'actual';
    return `<span class="${cls}" title="${ETAPAS_LABEL[k]}"></span>`;
  }).join('');
}

// v4.31: permite cambiar etapaActual haciendo clic en un nodo del
// roadmap (renderRutaEtapa), sin abrir el modal completo. Actualiza solo
// ese campo en Firestore, con confirm() previo para evitar clics
// accidentales. El listener en tiempo real de 'proyectos' refresca el
// dashboard solo. No toca el resto de guardarProyecto/editarProyecto.
async function cambiarEtapaDashboard(nuevaEtapa){
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;
  if(p.etapaActual === nuevaEtapa) return;
  const ok = confirm(`¿Marcar etapa actual como "${ETAPAS_LABEL[nuevaEtapa]}"?`);
  if(!ok) return;
  try{
    await proyectosRef.doc(proyectoActualId).update({ etapaActual: nuevaEtapa });
  }catch(err){
    console.error('Error cambiando etapa desde el roadmap:', err);
    alert('No se pudo actualizar la etapa. Intenta de nuevo.');
  }
}

/* Ruta de etapas del dashboard (v4.4) — adaptación de renderEtapaChips()
   de portal.html: misma lógica (idxActual, sub por fecha de grabación/
   entrega), pero retorna el HTML como string para insertarlo dentro de
   renderDashboardProyecto() en vez de escribirlo en un elemento del DOM
   con getElementById. No se tocó renderBarraEtapa() ni ETAPAS_LABEL. */
function renderRutaEtapa(p){
  const claves = Object.keys(ETAPAS_LABEL);
  const idxActual = claves.indexOf(p.etapaActual);

  const conFecha = sesionesDash.filter(s => s.fecha).sort((a,b) => a.fecha.localeCompare(b.fecha));
  let rangoGrabacion = null;
  if(conFecha.length){
    const fmt = f => new Date(f + 'T00:00:00').toLocaleDateString('es-CO', {day:'2-digit', month:'short'});
    const primera = conFecha[0].fecha, ultima = conFecha[conFecha.length - 1].fecha;
    rangoGrabacion = primera === ultima ? fmt(primera) : `${fmt(primera)} – ${fmt(ultima)}`;
  }
  const entrega = p.fechaEntregaEstimada ? new Date(p.fechaEntregaEstimada + 'T00:00:00').toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}) : null;

  return `
    <div class="etapa-ruta">
      ${claves.map((k, i) => {
        const cls = i < idxActual ? 'hecha' : i === idxActual ? 'actual' : 'pendiente';
        let sub = '';
        if(k === 'grabacion' && rangoGrabacion) sub = rangoGrabacion;
        if(k === 'entrega' && entrega) sub = entrega;
        const esUltima = i === claves.length - 1;
        return `
          <div class="etapa-nodo-row">
            <div class="etapa-nodo-col">
              <div class="etapa-nodo ${cls}" onclick="cambiarEtapaDashboard('${k}')" title="Marcar como etapa actual" style="cursor:pointer;">${cls === 'hecha' ? '✓' : ''}</div>
              ${!esUltima ? `<div class="etapa-linea ${i < idxActual ? 'hecha' : ''}"></div>` : ''}
            </div>
            <div class="etapa-nodo-txt">
              <span class="${cls}">${ETAPAS_LABEL[k]}</span>
              ${sub ? `<small>${sub}</small>` : (cls === 'actual' ? `<small class="etapa-actual-tag">etapa actual</small>` : '')}
            </div>
          </div>`;
      }).join('')}
    </div>
  `;
}

function renderMiniCalendario(p){
  const anio = dashCalMes.getFullYear();
  const mes = dashCalMes.getMonth();
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const primerDia = new Date(anio, mes, 1);
  const diasEnMes = new Date(anio, mes + 1, 0).getDate();
  const offset = primerDia.getDay();
  const entregaStr = p.fechaEntregaEstimada ? p.fechaEntregaEstimada.split('T')[0] : null;

  const eventosPorDia = {};
  sesionesDash.forEach(s => {
    if(!s.fecha) return;
    const d = new Date(s.fecha + 'T00:00:00');
    const pasada = d < hoy;
    if(!eventosPorDia[s.fecha]) eventosPorDia[s.fecha] = [];
    eventosPorDia[s.fecha].push({ tipo: pasada ? 'pasada' : 'proxima', sesion: s });
  });
  if(entregaStr && entregaStr.slice(0,7) === `${anio}-${String(mes+1).padStart(2,'0')}`){
    if(!eventosPorDia[entregaStr]) eventosPorDia[entregaStr] = [];
    eventosPorDia[entregaStr].push({ tipo: 'entrega' });
  }

  const dow = ['D','L','M','X','J','V','S'];
  let celdas = dow.map(d => `<div class="dow">${d}</div>`).join('');
  for(let i = 0; i < offset; i++) celdas += `<div></div>`;
  for(let dia = 1; dia <= diasEnMes; dia++){
    const fechaStr = `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const eventos = eventosPorDia[fechaStr];
    const esHoy = new Date(fechaStr + 'T00:00:00').getTime() === hoy.getTime();
    const dots = eventos ? `<div class="dash-cal-dots">${eventos.map(e => `<span class="dot-${e.tipo}"></span>`).join('')}</div>` : '';
    const onclickDia = eventos ? `mostrarTooltipDia(event,'${fechaStr}')` : `abrirLogisticaDesdeCalendario('${fechaStr}')`;
    celdas += `<div class="dash-cal-day ${esHoy ? 'hoy' : ''} ${eventos ? 'con-evento' : 'clicable'}" onclick="${onclickDia}">${dia}${dots}</div>`;
  }

  return `
    <div class="dash-calendario" id="dashCalendario">
      <div class="dash-cal-head">
        <button onclick="cambiarMesDash(-1)">‹</button>
        <span>${dashCalMes.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' })}</span>
        <button onclick="cambiarMesDash(1)">›</button>
      </div>
      <div class="dash-cal-grid">${celdas}</div>
      <div class="dash-cal-legend">
        <span><i class="pasada"></i>Sesión pasada</span>
        <span><i class="proxima"></i>Próxima sesión</span>
        <span><i class="entrega"></i>Entrega</span>
      </div>
    </div>`;
}

function cambiarMesDash(delta){
  dashCalMes = new Date(dashCalMes.getFullYear(), dashCalMes.getMonth() + delta, 1);
  refrescarDetalleSiActivo();
}

function mostrarTooltipDia(evt, fechaStr){
  evt.stopPropagation();
  const existente = document.querySelector('.dash-cal-tooltip');
  if(existente) existente.remove();
  const sesionesDia = sesionesDash.filter(s => s.fecha === fechaStr);
  const esEntrega = proyectos.find(x => x.id === proyectoActualId)?.fechaEntregaEstimada?.split('T')[0] === fechaStr;
  const fechaFmt = new Date(fechaStr + 'T00:00:00').toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long' });
  let html = `<strong>${fechaFmt}</strong><br>`;
  if(esEntrega) html += `<div style="color:var(--warn);margin-top:4px;">Entrega estimada del proyecto <span class="link-add" onclick="editarFechaEntregaDash()">✎ Cambiar fecha</span></div>`;
  sesionesDia.forEach(s => {
    const dPasada = new Date(s.fecha + 'T00:00:00') < new Date(new Date().toDateString());
    const etiquetaSesion = dPasada ? 'Sesión pasada' : 'Próxima sesión';
    html += `<div style="margin-top:6px;">${escapeHtml(s.actividad || 'Sesión')}${s.sala ? ' · ' + escapeHtml(s.sala) : ''} · <em>${etiquetaSesion}</em> · <span class="link-add" onclick="moverFechaSesionDash('${s.id}','${s.fecha}')">✎ Mover fecha</span><br><a href="logistica.html?id=${proyectoActualId}">Ver en logística →</a></div>`;
  });
  const box = document.createElement('div');
  box.className = 'dash-cal-tooltip';
  box.innerHTML = html;
  evt.currentTarget.appendChild(box);
  // v5.10: en mobile la celda del día es angosta (~40-45px) y el tooltip
  // tiene min-width:180px — antes se salía de la pantalla en los días
  // de la derecha de la grilla (viernes/sábado). Se corrige la posición
  // DESPUÉS de insertarlo (con las medidas reales ya calculadas), sin
  // tocar el CSS base: si se sale por la derecha, se ancla por la
  // derecha del día en vez de por la izquierda; si igual se sale por la
  // izquierda de la pantalla (celdas muy angostas), se centra respecto
  // a la ventana en vez del día.
  requestAnimationFrame(() => {
    box.style.left = '0';
    box.style.right = 'auto';
    let r = box.getBoundingClientRect();
    const margen = 8;
    if(r.right > window.innerWidth - margen){
      box.style.left = 'auto';
      box.style.right = '0';
      r = box.getBoundingClientRect();
    }
    if(r.left < margen){
      box.style.right = 'auto';
      box.style.left = `${box.offsetLeft + (margen - r.left)}px`;
    }
  });
  setTimeout(() => document.addEventListener('click', function cerrar(e){
    if(!box.contains(e.target)){ box.remove(); document.removeEventListener('click', cerrar); }
  }), 0);
}

// v5.8: validación simple de fecha AAAA-MM-DD, reutilizada por los dos
// ajustes rápidos de abajo (no reemplaza ningún <input type="date">
// existente, es para el prompt() de texto libre).
function validarFechaISODash(str){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
  const d = new Date(str + 'T00:00:00');
  return !isNaN(d.getTime());
}

// v5.8: atajo rápido — cambia SOLO fechaEntregaEstimada del proyecto.
// No toca ningún otro campo del documento.
async function editarFechaEntregaDash(){
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;
  const actual = p.fechaEntregaEstimada ? p.fechaEntregaEstimada.split('T')[0] : '';
  const nueva = prompt('Nueva fecha de entrega (AAAA-MM-DD):', actual);
  if(nueva === null) return;
  if(!validarFechaISODash(nueva.trim())){
    alert('Fecha inválida. Usa el formato AAAA-MM-DD (ej: 2026-08-15).');
    return;
  }
  try{
    await proyectosRef.doc(proyectoActualId).update({ fechaEntregaEstimada: nueva.trim() });
  } catch(err){
    console.error('Error actualizando fecha de entrega:', err);
    alert('No se pudo actualizar la fecha de entrega. Revisa la consola.');
  }
}

// v5.8: atajo rápido — mueve SOLO el campo `fecha` de una sesión ya
// existente (sesiones/{id}). Sala, actividad, tema y todo lo demás de
// la sesión se sigue editando en logistica.html, sin cambios.
async function moverFechaSesionDash(sesionId, fechaActual){
  if(!proyectoActualId) return;
  const nueva = prompt('Nueva fecha de la sesión (AAAA-MM-DD):', fechaActual || '');
  if(nueva === null) return;
  if(!validarFechaISODash(nueva.trim())){
    alert('Fecha inválida. Usa el formato AAAA-MM-DD (ej: 2026-08-15).');
    return;
  }
  try{
    await proyectosRef.doc(proyectoActualId).collection('sesiones').doc(sesionId).update({ fecha: nueva.trim() });
    document.querySelector('.dash-cal-tooltip')?.remove();
  } catch(err){
    console.error('Error moviendo fecha de sesión:', err);
    alert('No se pudo mover la fecha de la sesión. Revisa la consola.');
  }
}

// v5.4: reemplaza el chip binario "con notas/sin iniciar" por el estado
// real fijado desde el modal de Gestión de Temas (estadoEdicion/
// estadoMezcla/estadoMastering). Las notas de texto (notasEdicion/
// notasMezcla/notasMastering, que sigue escribiendo bitacora.html) ya
// no se leen acá — quedaron solo como texto de apoyo dentro del modal
// de gestión, no como fuente del estado visual.
//
// v5.5 (a pedido de AUDIOLINK): se agrega Grabación como cuarta etapa
// del resumen, pero NO como campo manual — se deriva de las sesiones ya
// vinculadas al tema (sesionesDash con temaId), porque a diferencia de
// Edición/Mezcla/Mastering (un evento por tema) Grabación puede ser
// varias sesiones (batería, voces, cuerdas...) y un solo campo manual
// se habría desincronizado igual que cantTemas. Heurística: sesión con
// fecha ya pasada = asumida realizada; fecha de hoy en adelante o sin
// fecha = programada. No depende de ningún campo nuevo en la sesión.
// v5.5 (a pedido de AUDIOLINK): se agrega Grabación como cuarta etapa
// del resumen, pero NO como campo manual — se deriva de las sesiones ya
// vinculadas al tema (sesionesDash con temaId), porque a diferencia de
// Edición/Mezcla/Mastering (un evento por tema) Grabación puede ser
// varias sesiones (batería, voces, cuerdas...) y un solo campo manual
// se habría desincronizado igual que cantTemas. No depende de ningún
// campo nuevo en la sesión.
//
// v5.6 (afina v5.5, a pedido de AUDIOLINK): "fecha ya pasada" por sí
// sola no prueba que la sesión se grabó — pudo cancelarse o
// reprogramarse. Se cruza con tomasPorSesionDash (v4.24, ya cargado
// por sesión, sin listener nuevo): una sesión pasada SOLO cuenta como
// "realizada" si tiene al menos una toma registrada. Si ya pasó la
// fecha y no tiene tomas, se marca como "vencida sin registro" —
// alerta en vez de darla por hecha a ciegas. Sesiones futuras/sin
// fecha siguen contando como "programada" sin importar si ya tienen
// alguna toma de prueba.
function calcularEstadoGrabacionTema(sesionesDelTema){
  if(!sesionesDelTema.length){
    return { estado: 'pendiente', texto: 'Sin sesiones programadas' };
  }
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  let realizadas = 0, vencidasSinRegistro = 0, programadas = 0;
  sesionesDelTema.forEach(s => {
    const yaPaso = s.fecha && new Date(s.fecha + 'T00:00:00') < hoy;
    const tieneTomas = (tomasPorSesionDash[s.id] || []).length > 0;
    if(yaPaso && tieneTomas) realizadas++;
    else if(yaPaso && !tieneTomas) vencidasSinRegistro++;
    else programadas++;
  });
  const partes = [];
  if(vencidasSinRegistro > 0) partes.push(`⚠️ ${vencidasSinRegistro} vencida(s) sin registro`);
  if(realizadas > 0) partes.push(`${realizadas} realizada(s)`);
  if(programadas > 0) partes.push(`${programadas} programada(s)`);
  const estado = vencidasSinRegistro > 0 ? 'en_proceso'
    : (realizadas === sesionesDelTema.length ? 'aprobado'
    : (realizadas === 0 ? 'pendiente' : 'en_proceso'));
  return { estado, texto: partes.join(' · ') };
}

async function agregarEquipoDash(){
  if(!proyectoActualId) return;
  const sel = document.getElementById('dashEquipoSelectTecnico');
  const rolInput = document.getElementById('dashEquipoRol');
  const tecnicoId = sel.value;
  const rol = rolInput.value.trim();
  if(!tecnicoId){ alert('Selecciona un técnico del catálogo.'); return; }
  const t = equipoTecnicoCache.find(x => x.id === tecnicoId);
  const p = proyectos.find(x => x.id === proyectoActualId);
  const equipoActual = (p && p.equipo) ? [...p.equipo] : [];
  equipoActual.push({ rol, nombre: t ? (t.nombre || '') : '', tecnicoId });

    await proyectosRef.doc(proyectoActualId).update({ equipo: equipoActual });
    sel.value = '';
    rolInput.value = '';
  } catch(err){
    console.error('Error agregando técnico al equipo:', err);
    alert('No se pudo agregar al equipo. Revisa la consola.');

async function quitarEquipoDash(index){
  if(!proyectoActualId) return;

  if(!p || !p.equipo) return;
  const equipoActual = [...p.equipo];
  equipoActual.splice(index, 1);
  try{
    await proyectosRef.doc(proyectoActualId).update({ equipo: equipoActual });
  } catch(err){
    console.error('Error quitando técnico del equipo:', err);
    alert('No se pudo quitar del equipo. Revisa la consola.');

}


function renderDashTemas(p){
  if(!temasDash.length && (p?.cantTemas || 0) <= 0) return '';
  const etapas = [
    { campo: 'estadoEdicion', label: 'Edición' },
    { campo: 'estadoMezcla', label: 'Mezcla' },
    { campo: 'estadoMastering', label: 'Mastering' }
  ];
  const ordenados = [...temasDash].sort((a, b) => (a.orden ?? Infinity) - (b.orden ?? Infinity) || (a.nombre || '').localeCompare(b.nombre || ''));
  const cantManual = p?.cantTemas || 0;
  // v5.13: cantReal excluye temas inactivos (activo:false) — antes un
  // tema desactivado seguía contando como "creado de verdad" en el
  // mismatch contra cantTemas, pudiendo ocultar un descuadre real.
  const cantReal = temasDash.filter(t => t.activo !== false).length;

  const grid = ordenados.length ? `

            <div class="dash-tema-chips">
              <span class="chip-mini estado-${grab.estado}" title="Grabación: ${grab.texto}">Grabación · ${grab.texto}</span>

                return `<span class="chip-mini estado-${estado}" title="${e.label}: ${labelEstado}">${e.label} · ${labelEstado}</span>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}

// v4.30: sección del dashboard que muestra la instrumentación completa
// del proyecto (todas las piezas por grupo), no solo el conteo que ya
// mostraba la dash-card "Instrumentación". Lee de p.instrumentacion
// (mismo dato guardado por el formulario) y usa las etiquetas de grupo
// de CATALOGO_INSTRUMENTACION para que los nombres coincidan con los
// del formulario. No modifica ni guarda nada, es solo lectura.
// v4.35: helper genérico para envolver una sección del dashboard en un
// acordeón colapsable. colapsadaPorDefecto se calcula según relevancia
// de la sección para la etapaActual del proyecto (ver llamados en
// renderDashInstrumentacion/renderDashProduccionSesiones). El estado no
// se persiste entre renders — solo evita el ruido visual por defecto,
// un clic siempre la reabre mientras se está viendo el detalle.
// v4.36: dashSeccionesManual guarda la elección manual del usuario (abrir/
// cerrar) por sección, para que prevalezca sobre el default por etapa
// mientras se está viendo el mismo proyecto — antes se perdía en cada
// re-render (ej. al llegar un cambio en tiempo real). Se reinicia al
// cambiar de proyecto (ver verDetalle).
let dashSeccionesManual = {};

function envolverSeccionColapsable(id, tituloHtml, bodyHtml, colapsadaPorDefecto){
  const colapsada = dashSeccionesManual.hasOwnProperty(id) ? dashSeccionesManual[id] : colapsadaPorDefecto;
  return `
    <div class="dash-seccion dash-seccion-colapsable ${colapsada ? 'colapsada' : ''}" id="seccionWrap_${id}">
      <div class="dash-seccion-titulo dash-seccion-titulo-click" onclick="toggleSeccionDash('${id}')">

      </div>
      <div class="dash-seccion-body" id="seccionBody_${id}">${bodyHtml}</div>
    </div>
  `;
}

function toggleSeccionDash(id){
  const wrap = document.getElementById(`seccionWrap_${id}`);
  if(!wrap) return;
  const ahoraColapsada = wrap.classList.toggle('colapsada');
  dashSeccionesManual[id] = ahoraColapsada;
}

function renderDashInstrumentacion(instr, gruposProyecto, etapaActual){
  if(!instr) return '';
  const catalogo = (gruposProyecto && Object.keys(gruposProyecto).length) ? gruposProyecto : CATALOGO_INSTRUMENTACION_DEFAULT;
  // v5.9: se ordena por el campo `orden` de cada grupo (mismo campo que
  // instrumentacion.js v1.5 ya usa en el editor) — antes esta vista de
  // solo lectura del Dashboard seguía usando Object.keys(catalogo) tal
  // cual, que es justo lo que Firestore NO garantiza preservar en un
  // mapa. Fallback a 0 por si algún grupo viejo aún no tiene `orden`
  // (se completa solo la próxima vez que se abra y guarde el editor).
  const grupos = Object.keys(catalogo)
    .sort((a, b) => (catalogo[a].orden || 0) - (catalogo[b].orden || 0))
    .map(key => ({ key, label: catalogo[key].label, piezas: instr[key] || [] }))
    .filter(g => g.piezas.length);

  const relevante = ['preproduccion', 'grabacion'].includes(etapaActual);
  const body = grupos.length ? `
        <div class="dash-instr-grid">
          ${grupos.map(g => `
            <div class="dash-instr-card">
              <div class="nombre">${escapeHtml(g.label)}</div>
              <div class="dash-instr-chips">
                ${g.piezas.map(p => `<span class="chip-mini con-notas">${escapeHtml(p.nombre)}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      ` : `<div class="dash-instr-vacio">Sin instrumentación cargada.</div>`;

  return envolverSeccionColapsable('instrumentacion', '🎚️ Instrumentación', `
      <div class="dash-temas-header">
        <span></span>
        <button class="btn-mini" onclick="abrirModalInstrumentacion()">🛠️ Gestionar instrumentación</button>
      </div>
      ${body}
  `, !relevante);
}

function renderDashProduccionSesiones(etapaActual){
  const todasTomas = Object.values(tomasPorSesionDash).flat();
  const todosConsent = Object.values(consentPorSesionDash).flat();

  if(!sesionesDash.length) return '';

  const usarSi = todasTomas.filter(t => t.usar === true).length;
  const usarNo = todasTomas.filter(t => t.usar === false).length;
  const sinMarcar = todasTomas.length - usarSi - usarNo;

  let ultimaTomaTxt = 'Sin tomas registradas aún';
  if(todasTomas.length){
    const conFecha = todasTomas.filter(t => t.creadoEn && t.creadoEn.toDate);
    if(conFecha.length){
      const ultima = conFecha.sort((a, b) => b.creadoEn.toDate() - a.creadoEn.toDate())[0];
      ultimaTomaTxt = `Última toma: ${ultima.creadoEn.toDate().toLocaleDateString('es-CO')} · ${escapeHtml(ultima.instrumento || '')}`;
    }
  }

  const relevante = ['grabacion', 'edicion'].includes(etapaActual);
  const body = `
      <div class="dash-cards">
        <div class="dash-card"><span class="lbl">Tomas registradas</span><span class="val">${todasTomas.length}</span></div>
        <div class="dash-card"><span class="lbl">Para usar / descartadas</span><span class="val">${usarSi} / ${usarNo}</span></div>

}

async function registrarPagoRapidoDash(){
  if(!proyectoActualId) return;
  const r = resumenPagos[proyectoActualId];
  if(!r){ alert('Este proyecto no tiene una cotización aceptada.'); return; }
  const monto = Number(document.getElementById('dashPagoMonto').value);
  if(!monto || monto <= 0){ alert('Ingresa un monto válido.'); return; }
  const fecha = document.getElementById('dashPagoFecha').value || null;
  const metodo = document.getElementById('dashPagoMetodo').value;
  const nota = document.getElementById('dashPagoNota').value.trim();

  const data = {
    cotizacionId: r.cotizacionId,
    monto,
    fecha,
    metodo,
    nota,
    creadoEn: firebase.firestore.FieldValue.serverTimestamp()
  };

  try{
    await proyectosRef.doc(proyectoActualId).collection('pagos').add(data);
    document.getElementById('dashPagoMonto').value = '';
    document.getElementById('dashPagoNota').value = '';
  } catch(err){
    console.error('Error registrando pago rápido:', err);
    alert('No se pudo registrar el pago. Revisa la consola.');
  }
}


function escucharPagosResumen(proyectoId, cotizId){
  proyectosRef.doc(proyectoId).collection('pagos')
    .where('cotizacionId', '==', cotizId)
    .onSnapshot(psnap => {
      let suma = 0;
      psnap.forEach(p => suma += (p.data().monto || 0));
      const r = resumenPagos[proyectoId];
      if(r && r.cotizacionId === cotizId){
        r.cobrado = suma;
        r.saldo = r.cotizado - suma;
        renderListado();
        if(proyectoActualId === proyectoId) refrescarDetalleSiActivo();
      }
    }, err => console.error('Error cargando pagos del resumen:', err));
}

function renderListado(){
  const grid = document.getElementById('gridProyectos');
  const empty = document.getElementById('emptyState');
  if(proyectos.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = proyectos.map(p => {
    const r = resumenPagos[p.id];
    const saldoHtml = (r && r.saldo > 0)
      ? `<div class="meta-saldo">💰 Saldo pendiente: ${formatCOP(r.saldo)}</div>`
      : '';
    const fechaEntregaLegible = p.fechaEntregaEstimada
      ? new Date(p.fechaEntregaEstimada + 'T00:00:00').toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'})
      : null;
    const extraHtml = (fechaEntregaLegible || p.cantTemas || p.costos?.presupuesto)
      ? `<div class="meta">
          ${fechaEntregaLegible ? '📅 ' + fechaEntregaLegible : ''}
          ${fechaEntregaLegible && p.cantTemas ? ' · ' : ''}
          ${p.cantTemas ? '🎵 ' + p.cantTemas + ' tema' + (p.cantTemas === 1 ? '' : 's') : ''}
          ${(fechaEntregaLegible || p.cantTemas) && p.costos?.presupuesto ? ' · ' : ''}
          ${p.costos?.presupuesto ? '💵 ' + formatCOP(p.costos.presupuesto) : ''}
        </div>`
      : '';
    return `
    <div class="card" onclick="verDetalle('${p.id}')">
      <div class="card-top">
        <div>
          <span class="tipo-tag">${p.tipo === 'propio' ? 'Proyecto propio' : escapeHtml(p.clienteArtista || 'Cliente')}</span>
          <h3>${escapeHtml(p.nombre || 'Sin nombre')}</h3>
        </div>
        <div class="card-top-actions">
          <span class="badge ${p.estado || 'ok'}">${p.estado || 'ok'}</span>
          <a href="logistica.html?id=${p.id}" class="btn-ir-sesiones" title="Ver sesiones" onclick="event.stopPropagation()">📅</a>
        </div>
      </div>
      <div class="meta">${escapeHtml(p.clienteArtista || '—')}</div>
      <div class="meta">Prod. ejecutivo: ${escapeHtml(p.productorEjecutivo || '—')}</div>
      ${extraHtml}
      ${saldoHtml}
      <span class="etapa">${ETAPAS_LABEL[p.etapaActual] || p.etapaActual || '—'}</span>
      <span class="etapa" style="margin-left:6px;">${COMERCIAL_LABEL[p.estadoComercial] || 'Cotización'}</span>
    </div>
  `;
  }).join('');
}

// v4.21: escapeHtml() ahora vive en utils.js (ya se cargaba acá desde
// v4.9 solo para formatCOP — se quitó la copia local, mismo
// comportamiento).

// v4.9: escapa un string para insertarlo de forma segura dentro de un
// string de JS (comillas simples) que a su vez vive dentro de un atributo
// HTML (comillas dobles). Sin esto, un texto con " rompe el atributo.
function escJsHtml(str){
  return String(str || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');
}

document.getElementById('modalBg').addEventListener('scroll', () => {
  const panel = document.getElementById('modalBg');
  const chip = document.getElementById('modalActionsFloat');
  if(!panel.classList.contains('active')) return;
  const y = panel.scrollTop;
  const delta = y - ultimoScrollYFloatProyecto;
  if(Math.abs(delta) < 6) return;
  if(delta > 0 && y > 40){
    chip.classList.add('oculto');
  } else {
    chip.classList.remove('oculto');
  }
  ultimoScrollYFloatProyecto = y;
}, { passive: true });

function agregarFilaEquipo(rol='', nombre='', tecnicoId=''){
  const container = document.getElementById('equipoContainer');
  const row = document.createElement('div');
  row.className = 'equipo-row';

  // v5.11: si la fila viene de un proyecto viejo con nombre en texto suelto
  // y sin tecnicoId (no existía el catálogo cuando se guardó), no se fuerza
  // a elegir del catálogo — se conserva el nombre visible en un span de
  // solo lectura junto al select, que queda vacío/placeholder.
  const esTextoSuelto = !!nombre && !tecnicoId;

  row.innerHTML = `
    <input type="text" placeholder="Rol (ej: Mezcla)" class="equipo-rol" value="${escapeHtml(rol)}">
    <select class="equipo-tecnico-select"></select>
    ${esTextoSuelto ? `<span class="equipo-nombre-legado" title="Proyecto anterior al catálogo — de solo lectura">${escapeHtml(nombre)} (texto)</span>` : ''}
    <button onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(row);

  const sel = row.querySelector('.equipo-tecnico-select');
  sel.dataset.tecnicoId = tecnicoId;
  sel.dataset.nombreLegado = esTextoSuelto ? nombre : '';
  poblarSelectTecnico(sel, tecnicoId);
  sel.addEventListener('change', () => { sel.dataset.tecnicoId = sel.value; });
}

// v5.0: el editor de instrumentación (catálogo, render, agregar/quitar
// piezas y grupos) se movió a instrumentacion.js — se cargó arriba con
// <script src="instrumentacion.js">. Acá solo queda la conexión con el
// resto del modal (cargar/guardar por proyecto), más abajo.

async function guardarProyecto(){
  const nombre = document.getElementById('fNombre').value.trim();
  if(!nombre){
    alert('El nombre del proyecto es obligatorio.');
    return;
  }
  const equipo = [];
  document.querySelectorAll('#equipoContainer .equipo-row').forEach(row => {
    const rol = row.querySelector('.equipo-rol').value.trim();
    const sel = row.querySelector('.equipo-tecnico-select');
    const tecnicoId = sel.value || '';
    // v5.11: si hay tecnicoId, el nombre se toma del catálogo (snapshot de
    // texto para no depender de un join). Si la fila es legado (sin
    // tecnicoId pero con nombre suelto guardado en dataset), se conserva tal cual.
    let nom = '';
    if(tecnicoId){
      const t = equipoTecnicoCache.find(x => x.id === tecnicoId);
      nom = t ? (t.nombre || '') : '';
    } else {
      nom = sel.dataset.nombreLegado || '';
    }
    if(rol || nom || tecnicoId) equipo.push({ rol, nombre: nom, tecnicoId });
  });

  const data = {
    nombre,
    tipo: document.getElementById('fTipo').value,
    estado: document.getElementById('fEstado').value,
    estadoComercial: document.getElementById('fEstadoComercial').value,
    clienteArtista: document.getElementById('fCliente').value.trim(),
    clienteEmail: document.getElementById('fCorreoCliente').value.trim().toLowerCase(),
    clienteId: document.getElementById('fClienteId').value || null,
    productorEjecutivo: document.getElementById('fProductor').value.trim(),
    etapaActual: document.getElementById('fEtapa').value,
    fechaEntregaEstimada: document.getElementById('fFechaEntrega').value || null,
    cantTemas: Number(document.getElementById('fCantTemas').value) || 1,
    equipo,
    narrativa: document.getElementById('fNarrativa').value.trim(),
    costos: {
      presupuesto: Number(document.getElementById('fPresupuesto').value) || 0,
      notasInternas: document.getElementById('fNotasInternas').value.trim()
    },
    visibleCliente: true
  };

  try{
    if(editando && proyectoActualId){
      await proyectosRef.doc(proyectoActualId).update(data);
    } else {
      data.creadoEn = firebase.firestore.FieldValue.serverTimestamp();
      data.fechaInicio = firebase.firestore.FieldValue.serverTimestamp();
      const docRef = await proyectosRef.add(data);
      proyectoActualId = docRef.id;
    }
    cerrarModal();
    verDetalle(proyectoActualId);
  } catch(err){
    console.error(err);
    alert('Error guardando el proyecto. Revisa la consola.');
  }
}

function verDetalle(id){
  const cambioDeProyecto = proyectoActualId !== id;
  proyectoActualId = id;
  const p = proyectos.find(x => x.id === id);
  if(!p) return;

  if(cambioDeProyecto) dashSeccionesManual = {};

  document.getElementById('vistaListado').style.display = 'none';
  document.getElementById('vistaDetalle').classList.add('active');

  const backLink = document.getElementById('backLink');
  if(origenDetalle === 'pagos'){
    backLink.textContent = '← Volver a Pagos';
    backLink.onclick = () => window.location.href = 'pagos.html';
  } else {
    backLink.textContent = '← Volver a proyectos';
    backLink.onclick = volverListado;
  }

  if(cambioDeProyecto) suscribirDashboardDetalle(id);
  if(cambioDeProyecto) cargarEgresosProyecto(id);
  renderDetalleContent();
}

function renderDetalleContent(){
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;

  const vistaDetalle = document.getElementById('vistaDetalle');
  Object.keys(ETAPAS_LABEL).forEach(k => vistaDetalle.classList.remove(`etapa-${k}`));
  if(p.etapaActual) vistaDetalle.classList.add(`etapa-${p.etapaActual}`);

  const entrega = p.fechaEntregaEstimada ? new Date(p.fechaEntregaEstimada).toLocaleDateString('es-CO') : '—';

  const r = resumenPagos[proyectoActualId];
  const pagado = r && r.saldo <= 0;
  const pctFinanciero = r && r.cotizado > 0 ? Math.min(100, Math.round((r.cobrado / r.cotizado) * 100)) : 0;
  const resumenHtml = r ? `
    <div class="resumen-financiero">
      <div class="monto-item"><span class="lbl">Cotizado</span><span class="val">${formatCOP(r.cotizado)}</span></div>
      <div class="monto-item"><span class="lbl">Cobrado</span><span class="val">${formatCOP(r.cobrado)}</span></div>
      <div class="monto-item saldo ${pagado ? 'pagado' : ''}"><span class="lbl">Saldo</span><span class="val">${formatCOP(r.saldo)}</span></div>
    </div>
    <div class="dash-financiera-bar"><div style="width:${pctFinanciero}%"></div></div>` : '';
  const pagoRapidoHtml = r ? renderPagoRapido() : '';

  // v5.21: tarjeta "Egresos del proyecto" — total pagado a músicos/
  // técnicos/salas para ESTE proyecto, leído de la colección egresos.
  const etiquetasTipoEgr = { musico: '🎻 Músicos', tecnico: '🎚️ Técnicos', estudio: '🏢 Salas' };
  let egresosHtml = '';
  if(resumenEgresosProyecto){
    const re = resumenEgresosProyecto;
    const chipsEgr = Object.keys(re.porTipo)
      .filter(t => re.porTipo[t] > 0)
      .map(t => `<span class="chip">${etiquetasTipoEgr[t]}: ${formatCOP(re.porTipo[t])}</span>`)
      .join('');
    egresosHtml = `
      <div class="resumen-financiero" style="margin-top:10px;">
        <div class="monto-item"><span class="lbl">Egresos del proyecto</span><span class="val">${formatCOP(re.total)}</span></div>
      </div>
      <div class="detalle-meta" style="margin-top:6px;">${chipsEgr}
        <a href="egresos.html" class="chip" style="text-decoration:none;">Ver detalle en Egresos →</a>
      </div>`;
    // v5.22: Margen real (cobrado - egresos) — solo si hay cotización
    // aceptada (r existe) y al menos un egreso registrado. No confundir
    // con "Margen estimado" del PDF interno (cotizado - presupuesto),
    // que es una proyección antes de que pase nada; este es con plata
    // que ya entró y ya salió.
    if(r && re.total > 0){
      const margenReal = r.cobrado - re.total;
      egresosHtml += `
      <div class="resumen-financiero" style="margin-top:6px;">
        <div class="monto-item ${margenReal < 0 ? 'saldo' : ''}"><span class="lbl">Margen real (cobrado − egresos)</span><span class="val">${formatCOP(margenReal)}</span></div>
      </div>`;
    }
  }

  document.getElementById('detalleContent').innerHTML = `
    <span class="tipo-tag">${p.tipo === 'propio' ? 'Proyecto propio' : escapeHtml(p.clienteArtista || 'Cliente')}</span>
    <h2>${escapeHtml(p.nombre)}</h2>
    <span class="badge ${p.estado || 'ok'}">${p.estado || 'ok'}</span>
    <div class="detalle-meta">
      <span class="chip">Cliente/Artista: ${escapeHtml(p.clienteArtista || '—')}</span>
      <span class="chip">Prod. Ejecutivo: ${escapeHtml(p.productorEjecutivo || '—')}</span>
      <span class="chip">Etapa: ${ETAPAS_LABEL[p.etapaActual] || '—'}</span>
      <span class="chip">Comercial: ${COMERCIAL_LABEL[p.estadoComercial] || 'Cotización'}</span>
      <span class="chip">Entrega est.: ${entrega}</span>
    </div>
    ${renderRutaEtapa(p)}
    ${p.narrativa ? `<div class="narrativa-box">${escapeHtml(p.narrativa)}</div>` : ''}
    ${resumenHtml}
    ${egresosHtml}
    ${pagoRapidoHtml}
    ${renderDashboardProyecto(p)}
  `;
  pintarSelectEquipoDash();
  const fPago = document.getElementById('dashPagoFecha');
  if(fPago) fPago.value = new Date().toISOString().split('T')[0];
}

// v5.14: exportarPDF migrado de jsPDF (dibujo manual x/y, sin salto de
// página) a HTML/CSS + window.print(), mismo modelo que cotizador.html.
// Paridad de contenido exacta con la versión jsPDF anterior: header,
// ficha (cliente/artista, productor ejecutivo, etapa, entrega estimada,
// estado comercial), equipo, narrativa, bloque confidencial (solo modo
// 'interno': presupuesto + notas internas). No se agregó contenido nuevo
// en esta migración — eso queda para después, a propósito.
function exportarPDF(modo){
  const p = proyectos.find(x => x.id === proyectoActualId);
  if(!p) return;

  const fecha = new Date().toLocaleDateString('es-CO', { day:'2-digit', month:'long', year:'numeric' });

  let html = `
    <div class="print-header">
      <div>
        <div class="print-title">AUDIOLINK</div>
        <div class="print-subtitle">${modo === 'interno' ? 'Informe Interno · Confidencial' : 'Resumen de Proyecto'}</div>
      </div>
      <div style="font-family:var(--M);font-size:10px;color:#7A7060;">${fecha}</div>
    </div>

    <div style="font-family:var(--T);font-size:19px;font-weight:bold;color:#111111;margin-bottom:2px;">${escapeHtml(p.nombre || 'Sin nombre')}</div>
    <div style="font-family:var(--M);font-size:9.5px;color:#7A7060;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:20px;">
      ${p.tipo === 'propio' ? 'Proyecto propio' : 'Cliente'} · Etapa: ${escapeHtml(ETAPAS_LABEL[p.etapaActual] || '—')}
    </div>

    <div class="print-meta-grid">
      <div class="print-card">
        <div class="print-card-title">Titular del Proyecto</div>
        <strong>Cliente / Artista:</strong> ${escapeHtml(p.clienteArtista || '—')}<br>
        <strong>Productor Ejecutivo:</strong> ${escapeHtml(p.productorEjecutivo || '—')}
      </div>
      <div class="print-card">
        <div class="print-card-title">Estado del Proyecto</div>
        <strong>Etapa actual:</strong> ${escapeHtml(ETAPAS_LABEL[p.etapaActual] || '—')}<br>
        <strong>Entrega estimada:</strong> ${p.fechaEntregaEstimada ? new Date(p.fechaEntregaEstimada).toLocaleDateString('es-CO') : '—'}<br>
        <strong>Estado comercial:</strong> ${escapeHtml(COMERCIAL_LABEL[p.estadoComercial] || 'Cotización')}
      </div>
    </div>
  `;

  if(p.equipo && p.equipo.length){
    html += `<div class="print-section-title">Equipo asignado</div>`;
    p.equipo.forEach(e => {
      html += `<div class="print-equipo-item"><b>${escapeHtml(e.rol || '')}:</b> ${escapeHtml(e.nombre || '')}</div>`;
    });
  }

  if(p.narrativa){
    html += `
      <div class="print-section-title">Contexto</div>
      <div class="print-narrativa">${escapeHtml(p.narrativa)}</div>
    `;
  }

  // v5.15 (a pedido de AUDIOLINK — "añade créditos + lo que propusiste
  // para el resumen"): bloque de Temas (nombre + estado por etapa, sin
  // notas internas de edición/mezcla/mastering) y timeline de sesiones
  // (fecha + sala/actividad), en AMBOS modos — no es información
  // sensible, mismo nivel de detalle que la ficha que ya sale en los
  // dos. Van antes del bloque confidencial, que sigue exclusivo de
  // 'interno'. Reutiliza temasDash/sesionesDash ya cargados por el
  // dashboard — no abre listeners nuevos.
  const temasActivos = temasDash.filter(t => t.activo !== false)
    .sort((a, b) => (a.orden ?? Infinity) - (b.orden ?? Infinity) || (a.nombre || '').localeCompare(b.nombre || ''));
  if(temasActivos.length){
    html += `<div class="print-section-title">Temas</div>`;
    temasActivos.forEach(t => {
      html += `
        <div class="print-equipo-item" style="margin-bottom:9px;">
          <b>${escapeHtml(t.nombre || 'Sin nombre')}</b><br>
          <span style="font-size:11px;color:#555;">
            Edición: ${ETIQUETA_ESTADO_TEMA[t.estadoEdicion] || 'Pendiente'} ·
            Mezcla: ${ETIQUETA_ESTADO_TEMA[t.estadoMezcla] || 'Pendiente'} ·
            Mastering: ${ETIQUETA_ESTADO_TEMA[t.estadoMastering] || 'Pendiente'}
          </span>
        </div>`;
    });
  }

  const sesionesConFecha = sesionesDash.filter(s => s.fecha).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if(sesionesConFecha.length){
    html += `<div class="print-section-title">Cronograma de sesiones</div>`;
    sesionesConFecha.forEach(s => {
      const fechaTxt = new Date(s.fecha + 'T00:00:00').toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
      const lugar = [s.estudioNombre, s.sala].filter(Boolean).map(escapeHtml).join(' — ');
      html += `<div class="print-equipo-item"><b>${fechaTxt}:</b> ${escapeHtml(s.actividad || 'Sesión')}${lugar ? ' · ' + lugar : ''}</div>`;
    });
  }

  if(modo === 'interno'){
    html += `<div class="print-confidencial">⚠ Información confidencial — solo uso interno</div>`;

    // --- Resumen financiero (reutiliza resumenPagos, ya calculado por
    // escucharPagosResumen — no se recalcula nada acá) ---
    const r = resumenPagos[proyectoActualId];
    const presupuestoNum = (p.costos && p.costos.presupuesto) ? Number(p.costos.presupuesto) : 0;
    html += `<div class="print-section-title" style="margin-top:0;">Resumen financiero</div>`;
    html += `<div style="font-size:12px;margin-bottom:2px;"><strong>Presupuesto interno:</strong> ${formatCOP(presupuestoNum)}</div>`;
    if(r){
      html += `
        <div style="font-size:12px;"><strong>Cotizado:</strong> ${formatCOP(r.cotizado)}</div>
        <div style="font-size:12px;"><strong>Cobrado:</strong> ${formatCOP(r.cobrado)}</div>
        <div style="font-size:12px;margin-bottom:6px;"><strong>Saldo:</strong> ${formatCOP(r.saldo)}</div>
      `;
      // v5.17: margen estimado (cotizado - presupuesto interno), no un
      // "descuadre" — a propósito NO son el mismo número por diseño
      // (presupuesto = costo interno, cotizado = precio al cliente).
      // Solo se muestra si hay presupuesto interno cargado, si no la
      // resta no dice nada útil.
      if(presupuestoNum > 0){
        const margen = r.cotizado - presupuestoNum;
        const margenPct = r.cotizado > 0 ? ((margen / r.cotizado) * 100).toFixed(1) : '0.0';
        html += `<div style="font-size:12px;margin-bottom:6px;"><strong>Margen estimado:</strong> ${formatCOP(margen)} (${margenPct}%)</div>`;
      }
    } else {
      html += `<div style="font-size:11px;color:#777;margin-bottom:6px;">Sin cotización aceptada aún.</div>`;
    }
    if(p.costos && p.costos.notasInternas){
      html += `<div style="font-size:11px;margin-top:4px;"><strong>Notas internas:</strong><br>${escapeHtml(p.costos.notasInternas)}</div>`;
    }

    // --- Detalle operativo de sesiones: horario, estudio/sala, técnicos
    // y músicos asignados con tarifa (equipoTecnico/musicos, snapshot
    // guardado por logistica.html en cada sesión — mismos campos que ya
    // usa logistica.html, no se inventa estructura nueva) ---
    if(sesionesConFecha.length){
      html += `<div class="print-section-title">Detalle operativo de sesiones</div>`;
      sesionesConFecha.forEach(s => {
        const fechaTxt = new Date(s.fecha + 'T00:00:00').toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
        const horario = (s.horaInicio && s.horaFin) ? `${s.horaInicio}–${s.horaFin}` : '';
        const lugar = [s.estudioNombre, s.sala].filter(Boolean).join(' — ');
        html += `<div class="print-equipo-item" style="margin-bottom:7px;">
          <b>${fechaTxt}${horario ? ' · ' + horario : ''}</b> — ${escapeHtml(s.actividad || 'Sesión')}${lugar ? ' · ' + escapeHtml(lugar) : ''}`;
        if(Array.isArray(s.tecnicosAsignados) && s.tecnicosAsignados.length){
          html += `<br><span style="font-size:10.5px;color:#555;">🔧 ${s.tecnicosAsignados.map(t => escapeHtml(t.nombre || '') + (t.rol ? ' (' + escapeHtml(t.rol) + ')' : '') + (t.tarifa ? ' · ' + formatCOP(t.tarifa) : '')).join(' · ')}</span>`;
        }
        if(Array.isArray(s.musicosAsignados) && s.musicosAsignados.length){
          html += `<br><span style="font-size:10.5px;color:#555;">🎻 ${s.musicosAsignados.map(m => escapeHtml(m.nombre || '') + (m.instrumento ? ' (' + escapeHtml(m.instrumento) + ')' : '') + (m.tarifa ? ' · ' + formatCOP(m.tarifa) + (m.canales > 1 ? ' × ' + m.canales + ' canales' : '') : '')).join(' · ')}</span>`;
        }
        html += `</div>`;
      });
    }
  }

  html += `
    <div class="print-footer-container">
      <div class="print-footer-grid">
        <span>AUDIOLINK — Producción y Logística Musical</span>
        <span>${modo === 'interno' ? 'Documento confidencial' : 'Documento generado automáticamente'}</span>
      </div>
      <div style="text-align:center;font-size:9.5px;color:#8a8578;margin-top:8px;letter-spacing:0.02em;">Marto 🧠 · martowave@gmail.com</div>
    </div>
  `;

  document.getElementById('print-view').innerHTML = html;
  window.print();
}

async function cargarListaIngenieros(){
  const cont = document.getElementById('ingenieroLista');

  try{
    // No hay forma de "where array-contains" sin índice si combinamos con
    // otros filtros, pero acá es el único filtro — where simple está bien.
    const snap = await db.collection('ingenieros')
      .where('proyectosAsignados', 'array-contains', proyectoActualId)
      .get();

    }

          ${d.data().nombre ? `<br><span style="color:var(--muted);font-size:0.76rem;">${escapeHtml(d.id)}</span>` : ''}

        </div>

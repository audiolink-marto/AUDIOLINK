<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba — switch vectorial (tema) + toggle checkbox</title>
<style>
:root{
  --bg:#0b0b0d; --surf:#16161a; --txt:#f2f0eb; --muted:#9a978f; --gold:#c9a24b;
  --metal-a:#e9e6dc; --metal-b:#b9b6ab; --metal-c:#8f8c82;
}
body{background:var(--bg);color:var(--txt);font-family:sans-serif;display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 20px;}
h2{font-size:0.95rem;color:var(--muted);font-weight:500;margin:0 0 4px;}
.fila{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;}
.tarjeta{background:var(--surf);border-radius:12px;padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.etiqueta{font-size:0.72rem;color:var(--muted);}

/* ===== SWITCH DE TEMA (2 posiciones, resorte) ===== */
.al-switch{
  --w:26px; --h:44px;
  width:var(--w); height:var(--h);
  cursor:pointer; display:inline-block; user-select:none;
}
.al-switch svg{width:100%;height:100%;display:block;overflow:visible;}
.al-switch .carcasa{
  fill:linear-gradient(135deg,var(--metal-a),var(--metal-c));
}
.al-switch .carcasa-rect{
  fill:#dcd9d0; stroke:#3a382f; stroke-width:2;
}
.al-switch .marca{stroke:#3a382f;stroke-width:2;stroke-linecap:round;}
.al-switch .led{fill:#6b6a63; transition:fill .25s ease;}
.al-switch .led-glow{opacity:0; transition:opacity .25s ease;}
.al-switch.claro .led{fill:#f6c453;}
.al-switch.claro .led-glow{opacity:1;}
.al-switch .palanca-grp{
  transform-origin:50px 92px;
  transform:rotate(18deg);
  transition:transform .22s cubic-bezier(.34,1.4,.64,1);
}
.al-switch.claro .palanca-grp{transform:rotate(-18deg);}
.al-switch .palanca{
  fill:#cfccc2; stroke:#3a382f; stroke-width:2;
}
.al-switch .palanca-brillo{fill:#fff;opacity:0.35;}

/* tamaños de muestra */
.al-switch.t40{--w:26px;--h:40px;}
.al-switch.t60{--w:39px;--h:60px;}
.al-switch.t96{--w:62px;--h:96px;}

/* ===== CANDIDATO PARA CHECKBOX (rocker chico, mismo lenguaje) ===== */
.al-check{
  --w:44px; --h:24px;
  width:var(--w); height:var(--h);
  cursor:pointer; display:inline-block;
}
.al-check svg{width:100%;height:100%;display:block;}
.al-check .pista{fill:#3a382f; transition:fill .2s ease;}
.al-check.on .pista{fill:#8a6d2c;}
.al-check .perilla{
  fill:#e9e6dc; stroke:#3a382f; stroke-width:1.5;
  transition:transform .2s cubic-bezier(.34,1.4,.64,1);
  transform:translateX(0px);
}
.al-check.on .perilla{transform:translateX(20px);}
.al-check .led2{fill:#6b6a63;transition:fill .2s ease;}
.al-check.on .led2{fill:#f6c453;}
</style>
</head>
<body>

<div class="tarjeta">
  <h2>Switch de tema — tamaños reales de UI</h2>
  <div class="fila">
    <div style="text-align:center;">
      <div class="al-switch t40" onclick="this.classList.toggle('claro')" id="sw40">
        <svg viewBox="0 0 100 170">
          <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#f6c453" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#f6c453" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect class="carcasa-rect" x="8" y="8" width="84" height="154" rx="14"/>
          <line class="marca" x1="28" y1="34" x2="42" y2="34"/>
          <line class="marca" x1="28" y1="136" x2="42" y2="136"/>
          <circle class="led-glow" cx="72" cy="34" r="16" fill="url(#glow)"/>
          <circle class="led" cx="72" cy="34" r="7"/>
          <g class="palanca-grp">
            <circle class="palanca" cx="50" cy="92" r="20"/>
            <rect class="palanca" x="44" y="40" width="12" height="55" rx="6"/>
            <ellipse class="palanca-brillo" cx="46" cy="55" rx="3" ry="14"/>
          </g>
        </svg>
      </div>
      <div class="etiqueta">40px</div>
    </div>
    <div style="text-align:center;">
      <div class="al-switch t60" onclick="this.classList.toggle('claro')">
        <svg viewBox="0 0 100 170">
          <rect class="carcasa-rect" x="8" y="8" width="84" height="154" rx="14"/>
          <line class="marca" x1="28" y1="34" x2="42" y2="34"/>
          <line class="marca" x1="28" y1="136" x2="42" y2="136"/>
          <circle class="led-glow" cx="72" cy="34" r="16" fill="url(#glow)"/>
          <circle class="led" cx="72" cy="34" r="7"/>
          <g class="palanca-grp">
            <circle class="palanca" cx="50" cy="92" r="20"/>
            <rect class="palanca" x="44" y="40" width="12" height="55" rx="6"/>
            <ellipse class="palanca-brillo" cx="46" cy="55" rx="3" ry="14"/>
          </g>
        </svg>
      </div>
      <div class="etiqueta">60px</div>
    </div>
    <div style="text-align:center;">
      <div class="al-switch t96 claro" onclick="this.classList.toggle('claro')">
        <svg viewBox="0 0 100 170">
          <rect class="carcasa-rect" x="8" y="8" width="84" height="154" rx="14"/>
          <line class="marca" x1="28" y1="34" x2="42" y2="34"/>
          <line class="marca" x1="28" y1="136" x2="42" y2="136"/>
          <circle class="led-glow" cx="72" cy="34" r="16" fill="url(#glow)"/>
          <circle class="led" cx="72" cy="34" r="7"/>
          <g class="palanca-grp">
            <circle class="palanca" cx="50" cy="92" r="20"/>
            <rect class="palanca" x="44" y="40" width="12" height="55" rx="6"/>
            <ellipse class="palanca-brillo" cx="46" cy="55" rx="3" ry="14"/>
          </g>
        </svg>
      </div>
      <div class="etiqueta">96px (arranca en "claro")</div>
    </div>
  </div>
  <p class="etiqueta" style="margin-top:6px;">Tocá cualquiera para alternar. Arriba = claro (LED encendido) · Abajo = oscuro (LED apagado).</p>
</div>

<div class="tarjeta">
  <h2>Candidato para checkbox (mismo lenguaje, solo para comparar)</h2>
  <div class="fila">
    <div class="al-check" onclick="this.classList.toggle('on')">
      <svg viewBox="0 0 60 32">
        <rect class="pista" x="1" y="1" width="58" height="30" rx="15"/>
        <circle class="perilla" cx="16" cy="16" r="12"/>
        <circle class="led2" cx="16" cy="16" r="3"/>
      </svg>
    </div>
    <div class="etiqueta">tocá para alternar</div>
  </div>
</div>

</body>
</html>

<title>Avatares & Iconos — AUDIOLINK</title>
<!--
  AUDIOLINK · avatares-iconos.html · v1.4
  v1.4: 2 mejoras a pedido del usuario:
    (a) Checkboxes Avatar/Icono ahora viven DIRECTAMENTE en cada card de
        la grilla (antes solo estaban dentro del modal) — clic ahí
        actualiza el doc en Firestore al instante (toggleTipoDesdeCard()),
        sin necesidad de abrir "Editar". Se bloquea dejar los 2
        desmarcados: si el usuario intenta desmarcar el último tipo
        activo, se revierte el checkbox y se avisa con alert(). El modal
        Nuevo/Editar sigue teniendo sus propios checkboxes (v1.3) para
        cuando se crea un ítem nuevo o se edita todo lo demás junto.
    (b) Categoría deja de ser un <input type="text"> libre en el modal
        (individual y lote) — ahora se eligen como CHIPS clicables
        (listaCategorias(), derivada del catálogo ya cargado), más un
        campo pequeño para escribir una categoría nueva solo cuando hace
        falta. Objetivo: evitar duplicados accidentales por escritura
        libre (ej. "músicos" vs "Músicos"), sin bloquear la posibilidad
        de crear categorías nuevas. El filtro de categoría (dropdown de
        arriba) no se tocó — ya era de opción única, no tenía este riesgo.
  v1.3: a pedido del usuario — un mismo ítem puede ser Avatar Y Icono a la
  vez (ej. un ícono de perico sirve como avatar de participante en Vacas
  Y como ícono en otro catálogo), sin duplicar el archivo en Cloudinary
  ni la entrada en Firestore. El campo `tipo` pasa de string único
  ('avatar' | 'icono') a ARREGLO (ej. ['avatar','icono']):
    - Modal individual (Nuevo/Editar): el <select> Tipo se reemplaza por
      2 checkboxes (Avatar / Icono), al menos uno debe quedar marcado.
    - Modal Subir en lote: mismo cambio, aplica a todos los archivos del
      lote igual que antes (una sola configuración para todo el lote).
    - Filtro de tipo y tipo-tag de cada card: se adaptan para leer un
      arreglo, con compatibilidad hacia atrás — un ítem viejo con
      tipo:"avatar" (string) se sigue mostrando y filtrando igual que
      antes en ESTE panel (no se fuerza migración aquí).
  IMPORTANTE (avisado al usuario): vacas.html y vaca.html cambian su
  consulta de tipo=='avatar' a tipo array-contains 'avatar' — los ítems
  viejos con tipo como string NO aparecerán en el selector de avatar de
  participantes hasta que se editen aquí y se guarden de nuevo (así
  quedan migrados a arreglo). El usuario migrará manualmente los
  existentes (SALSA, AFA, etc.) — no se corrió ningún script de
  migración automática.
  v1.2: se agrega filtro por Categoría — dropdown que se llena solo con
  las categorías que ya existen en el catálogo (evita duplicados por
  escritura libre, ej. "músicos" vs "Músicos"). Se combina con los
  filtros de Tipo y búsqueda por nombre que ya existían (los 3 aplican
  en conjunto). El dropdown se repuebla cada vez que llega un cambio del
  listener en tiempo real, preservando la selección actual si sigue
  existiendo. No se tocó ninguna otra función existente.
  v1.1: se agrega "Subir en lote" — botón nuevo junto a "+ Nuevo" que abre
  una vista propia (no el modal individual): Tipo y Categoría se definen
  UNA VEZ para todo el lote (selector arriba), se eligen varios archivos
  a la vez, cada uno se lista con miniatura local + nombre editable
  (precargado con el nombre del archivo, sin extensión, tal cual). Al
  subir, cada archivo va a Cloudinary (mismo folder/preset ICONOS) y crea
  su propio documento en avataresIconos, uno por uno, con progreso
  visible. No se tocó el modal individual (Nuevo/Editar) ni ninguna otra
  función existente.
  v1.0: archivo nuevo. Panel CRUD del catálogo de avatars/
  ecosistema. Imágenes en Cloudinary (cloud_name dv7lelmoy, folder
  ICONOS, upload preset unsigned "ICONOS"), metadata en Firestore
  (colección avataresIconos), leído en tiempo real (onSnapshot) para
  que el resto del ecosistema pueda "escuchar" el catálogo actualizado
  (criterio de ARQUITECTURA.md: pantalla abierta activamente = tiempo
  real). Miniatura generada por transformación de URL de Cloudinary
  (w_150,h_150,c_fill) — no se sube un archivo duplicado.
  Ver CHANGELOG.md para el detalle de versiones futuras — este
  comentario documenta solo la versión vigente.
-->

<style>
:root{
  --bg:#0b0b0d;
  --surf:#151517;
  --surf-light:#1d1d20;
  --brd:#2a2a2e;
  --gold:#c9a24b;
  --gold-bg:rgba(201,162,75,0.12);
  --txt:#f0ede6;
  --muted:#9a978f;
  --faint:#5c5a55;
  --ok:#4caf7d;
  --warn:#d9a441;
  --err:#d4574a;
  --T:"Playfair Display",Georgia,serif;
  --S:"DM Sans",'Segoe UI',system-ui,-apple-system,sans-serif;
  --M:"JetBrains Mono",monospace;
}
:root[data-tema="light"]{

  --surf:#ffffff;
  --surf-light:#f3f0e8;

  --gold:#a8823a;
  --gold-bg:rgba(168,130,58,0.10);
  --txt:#2a2620;
  --muted:#7a756a;
  --faint:#a39d8f;
  --ok:#3a8f63;
  --warn:#b8842f;
  --err:#b8453a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--S);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
header, main{position:relative;z-index:1;}
header{
  padding:16px 20px;
  border-bottom:1px solid var(--brd);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--surf);
  flex-wrap:wrap;
  gap:12px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;visibility:hidden;position:absolute;}
.btn{
  background:var(--gold-bg);
  border:1px solid var(--gold);
  color:var(--gold);
  padding:9px 18px;
  border-radius:6px;
  font-size:0.85rem;
  cursor:pointer;
  transition:all 0.2s;
  font-weight:500;
}
.btn:hover{background:var(--gold);color:var(--bg);}
.btn-ghost{background:transparent;border:1px solid var(--brd);color:var(--muted);}
.btn-ghost:hover{border-color:var(--muted);color:var(--txt);}
.btn[disabled]{opacity:0.5;cursor:not-allowed;}

main{padding:28px;max-width:1200px;margin:0 auto;}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
.top-actions h2{font-size:1rem;color:var(--muted);font-weight:500;letter-spacing:0.04em;}
.filtros{display:flex;gap:8px;flex-wrap:wrap;}
.filtros select,.filtros input{
  background:var(--surf-light);border:1px solid var(--brd);color:var(--txt);
  padding:8px 10px;border-radius:6px;font-size:0.82rem;font-family:inherit;
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.card{
  background:var(--surf);
  border:1px solid var(--brd);
  border-radius:10px;
  padding:14px;
  cursor:pointer;
  transition:all 0.2s;
  text-align:center;
}
.card:hover{border-color:var(--gold);box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.card .thumb-wrap{
  width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;

.card .thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.card h3{font-size:0.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .tipo-tag{font-size:0.68rem;color:var(--faint);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-top:4px;}
/* v1.4: checkboxes de tipo directo en la card */
.card-tipos{display:flex;gap:10px;justify-content:center;margin-top:8px;font-size:0.72rem;color:var(--muted);}

.card-tipos input[type="checkbox"]{width:auto;margin:0;cursor:pointer;}
/* v1.4: chips de categoría (modal individual y lote) */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{
  background:var(--surf-light);border:1px solid var(--brd);color:var(--muted);
  padding:5px 12px;border-radius:999px;font-size:0.78rem;cursor:pointer;
  font-family:inherit;transition:all 0.15s;
}
.chip:hover{border-color:var(--gold);color:var(--txt);}
.chip.activo{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);font-weight:600;}
.chip-nueva{display:flex;gap:8px;}
.chip-nueva input{flex:1;}
.badge-inactivo{
  font-size:0.6rem;color:var(--muted);border:1px solid var(--brd);
  border-radius:999px;padding:1px 7px;display:inline-block;margin-top:6px;
}
.card.inactivo{opacity:0.5;}
.empty{color:var(--muted);font-size:0.9rem;padding:40px 0;text-align:center;}

/* Modal (mismas clases que el resto del ecosistema) */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 20px;
}
.modal-bg.active{display:flex;}
.modal{background:var(--surf);border:1px solid var(--brd);border-radius:12px;max-width:480px;width:100%;padding:28px;}
.modal h2{color:var(--gold);font-size:1.1rem;margin-bottom:20px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:6px;letter-spacing:0.02em;}
.field input,.field select{
  width:100%;background:var(--surf-light);border:1px solid var(--brd);color:var(--txt);
  padding:10px 12px;border-radius:6px;font-size:0.9rem;font-family:inherit;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-bg);}
.field input[type="file"]{padding:8px 10px;font-size:0.82rem;color:var(--muted);}
.field input[type="checkbox"]{width:auto;margin-right:8px;}
.preview-thumb{
  width:100px;height:100px;border-radius:8px;object-fit:cover;
  background:var(--surf-light);border:1px solid var(--brd);margin-bottom:12px;display:none;
}
.preview-thumb.mostrar{display:block;}
.progreso-subida{font-size:0.78rem;color:var(--gold);margin-bottom:12px;display:none;}
.progreso-subida.mostrar{display:block;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
.modal-actions .link-danger{
  color:var(--err);font-size:0.8rem;cursor:pointer;margin-right:auto;align-self:center;

/* Lote */
.modal-lote{max-width:640px;}
.lote-config{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.lote-lista{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}

.lote-item img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg);}
.lote-item input{flex:1;background:var(--surf);border:1px solid var(--brd);color:var(--txt);padding:7px 10px;border-radius:5px;font-size:0.85rem;font-family:inherit;}
.lote-item .lote-estado{font-size:0.72rem;color:var(--muted);width:70px;text-align:right;flex-shrink:0;}
.lote-item .lote-estado.ok{color:var(--ok);}

.lote-empty{color:var(--muted);font-size:0.84rem;padding:20px 0;text-align:center;}
.lote-progreso{font-size:0.8rem;color:var(--gold);margin-bottom:10px;display:none;}
.lote-progreso.mostrar{display:block;}
</style>

<script>
// ============ FIREBASE ============
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const catalogoRef = db.collection('avataresIconos');

// ============ CLOUDINARY ============
const CLOUDINARY_CLOUD_NAME = 'dv7lelmoy';
const CLOUDINARY_UPLOAD_PRESET = 'ICONOS'; // unsigned
const CLOUDINARY_FOLDER = 'ICONOS';

function urlMiniatura(urlOriginal){
  // Inserta la transformación justo después de "/upload/"
  return urlOriginal.replace('/upload/', '/upload/w_150,h_150,c_fill,f_auto,q_auto/');
}

// v1.3: helper de compatibilidad — `tipo` puede venir como arreglo (formato
// nuevo) o como string suelto (formato viejo, ítems no migrados aún). Se usa
// en el filtro y en el tipo-tag de cada card para que ambos formatos
// convivan sin romper nada mientras el usuario migra manualmente.
function tipoArray(it){
  if(Array.isArray(it.tipo)) return it.tipo;
  return it.tipo ? [it.tipo] : [];
}

// v1.4: toggle directo desde la card, sin abrir el modal. Actualiza SOLO
// el campo tipo del doc puntual — no toca nombre/categoria/activo/url.
// Bloquea dejar los 2 tipos desmarcados: si el usuario intenta quitar el
// último tipo activo, se revierte el checkbox visualmente y se avisa.
async function toggleTipoDesdeCard(id, valor, marcado, checkboxEl){
  const it = catalogo.find(x => x.id === id);
  if(!it) return;
  let tipos = tipoArray(it);
  if(marcado){
    if(!tipos.includes(valor)) tipos = [...tipos, valor];
  } else {
    const restante = tipos.filter(t => t !== valor);
    if(restante.length === 0){
      checkboxEl.checked = true; // revertir — no se permite dejar sin ningún tipo
      alert('Debe quedar marcado al menos un tipo (Avatar o Icono).');
      return;
    }
    tipos = restante;
  }
  try{
    await catalogoRef.doc(id).update({ tipo: tipos, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp() });
  } catch(err){
    checkboxEl.checked = !marcado; // revertir visualmente si Firestore rechaza el cambio
    alert('No se pudo actualizar: ' + err.message);
  }
}

// ============ GUARD DE SESIÓN (mismo patrón que el resto del ecosistema) ============
let sesionValidada = false;
auth.onAuthStateChanged(async (user) => {
  if(!user){
    window.location.href = 'login.html';
    return;
  }
  try{
    const doc = await db.collection('equipoInterno').doc(user.email).get();
    if(!doc.exists || doc.data().activo !== true){
      await auth.signOut();
      window.location.href = 'login.html';
      return;
    }
    sesionValidada = true;
    escucharCatalogo();
  } catch(e){
    console.error('Error validando sesión:', e);
    window.location.href = 'login.html';
  }
});

// ============ ESTADO ============
let catalogo = [];
let editId = null; // null = creando nuevo; string = editando doc existente
let urlSubidaPendiente = null; // url de Cloudinary tras subir, hasta guardar
let categoriaModalActual = ''; // v1.4: categoría elegida por chips en el modal individual

// ============ LISTENER EN TIEMPO REAL ============
function escucharCatalogo(){
  catalogoRef.orderBy('nombre').onSnapshot((snap) => {
    catalogo = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarOpcionesCategoria();
    renderGrid();
  }, (err) => {
    console.error('Error escuchando avataresIconos:', err);
  });
}

// v1.4: helper compartido — categorías únicas ya usadas en el catálogo,
// ordenadas alfabéticamente. Antes esta lógica vivía solo dentro de
// actualizarOpcionesCategoria() (para el dropdown de filtro); ahora la
// reutilizan también los chips de los modales.
function listaCategorias(){
  return [...new Set(catalogo.map(it => (it.categoria || '').trim()).filter(Boolean))].sort();
}

function actualizarOpcionesCategoria(){
  const select = document.getElementById('fCategoriaFiltro');
  const valorActual = select.value;
  const categorias = listaCategorias();
  select.innerHTML = '<option value="">Todas las categorías</option>' +
    categorias.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if(categorias.includes(valorActual)) select.value = valorActual;
}

// v1.4: chips de categoría del modal individual — evita duplicados por
// escritura libre (ej. "músicos" vs "Músicos"). Si la selección actual
// no está todavía en listaCategorias() (categoría recién escrita, aún
// no guardada en ningún doc), se agrega igual como chip para que se vea
// marcada.
function renderCategoriaChipsModal(){
  const cont = document.getElementById('fCategoriaChips');
  let cats = listaCategorias();
  if(categoriaModalActual && !cats.includes(categoriaModalActual)) cats = [...cats, categoriaModalActual].sort();
  cont.innerHTML = cats.length === 0
    ? '<span style="color:var(--muted);font-size:0.8rem">Aún no hay categorías — escribe una nueva abajo.</span>'
    : cats.map(c => `<button type="button" class="chip ${c === categoriaModalActual ? 'activo' : ''}" onclick="seleccionarCategoriaModal('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`).join('');
}

function seleccionarCategoriaModal(cat){
  // clic de nuevo sobre el chip ya activo = deseleccionar (categoría opcional)
  categoriaModalActual = (categoriaModalActual === cat) ? '' : cat;
  renderCategoriaChipsModal();
}

function agregarCategoriaNueva(){
  const input = document.getElementById('fCategoriaNueva');
  const val = input.value.trim();
  if(!val) return;
  categoriaModalActual = val;
  input.value = '';
  renderCategoriaChipsModal();
}

// ============ RENDER ============
function renderGrid(){
  const grid = document.getElementById('gridCatalogo');
  const empty = document.getElementById('emptyState');
  const tipoFiltro = document.getElementById('fTipoFiltro').value;
  const categoriaFiltro = document.getElementById('fCategoriaFiltro').value;
  const buscar = document.getElementById('fBuscar').value.trim().toLowerCase();

  const filtrado = catalogo.filter(it => {
    if(tipoFiltro && !tipoArray(it).includes(tipoFiltro)) return false;
    if(categoriaFiltro && (it.categoria || '').trim() !== categoriaFiltro) return false;
    if(buscar && !(it.nombre || '').toLowerCase().includes(buscar)) return false;
    return true;
  });

  if(filtrado.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtrado.map(it => {
    const tipos = tipoArray(it);
    return `
    <div class="card ${it.activo === false ? 'inactivo' : ''}" onclick="abrirModalEditar('${it.id}')">
      <div class="thumb-wrap">
        <img src="${escapeHtml(urlMiniatura(it.urlCloudinary))}" alt="${escapeHtml(it.nombre || '')}" loading="lazy">
      </div>
      <h3>${escapeHtml(it.nombre || 'Sin nombre')}</h3>
      <div class="card-tipos" onclick="event.stopPropagation()">
        <label><input type="checkbox" ${tipos.includes('avatar') ? 'checked' : ''} onchange="toggleTipoDesdeCard('${it.id}','avatar',this.checked,this)"> Avatar</label>
        <label><input type="checkbox" ${tipos.includes('icono') ? 'checked' : ''} onchange="toggleTipoDesdeCard('${it.id}','icono',this.checked,this)"> Icono</label>
      </div>
      ${it.categoria ? `<span class="tipo-tag">${escapeHtml(it.categoria)}</span>` : ''}
      ${it.activo === false ? '<span class="badge-inactivo">Inactivo</span>' : ''}
    </div>
  `;
  }).join('');
}

// ============ SUBIDA A CLOUDINARY ============
function onArchivoSeleccionado(e){
  const archivo = e.target.files[0];
  if(!archivo) return;

  const progreso = document.getElementById('progresoSubida');
  const btnGuardar = document.getElementById('btnGuardar');
  progreso.classList.add('mostrar');
  btnGuardar.disabled = true;
  urlSubidaPendiente = null;

  const formData = new FormData();
  formData.append('file', archivo);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', CLOUDINARY_FOLDER);

  fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if(!data.secure_url){
      throw new Error(data.error?.message || 'Cloudinary no devolvió una URL.');
    }
    urlSubidaPendiente = data.secure_url;
    const preview = document.getElementById('previewThumb');
    preview.src = urlMiniatura(urlSubidaPendiente);
    preview.classList.add('mostrar');
    progreso.classList.remove('mostrar');
    btnGuardar.disabled = false;
  })
  .catch(err => {
    console.error('Error subiendo a Cloudinary:', err);
    alert('No se pudo subir la imagen: ' + err.message + '\n\nVerifica que el upload preset "ICONOS" exista y sea de tipo Unsigned en Cloudinary.');
    progreso.classList.remove('mostrar');
    btnGuardar.disabled = false;
  });
}

// ============ MODAL ============
function abrirModalNuevo(){
  editId = null;
  urlSubidaPendiente = null;
  document.getElementById('modalTitulo').textContent = 'Nuevo';
  document.getElementById('fArchivo').value = '';
  document.getElementById('fNombre').value = '';
  document.getElementById('fTipoAvatar').checked = true; // v1.3
  document.getElementById('fTipoIcono').checked = false; // v1.3
  categoriaModalActual = ''; // v1.4
  document.getElementById('fCategoriaNueva').value = ''; // v1.4
  renderCategoriaChipsModal(); // v1.4
  document.getElementById('fActivo').checked = true;
  document.getElementById('previewThumb').classList.remove('mostrar');
  document.getElementById('btnEliminar').style.display = 'none';
  document.getElementById('btnGuardar').disabled = false;
  document.getElementById('modalBg').classList.add('active');
}

function abrirModalEditar(id){
  const it = catalogo.find(x => x.id === id);
  if(!it) return;
  editId = id;
  urlSubidaPendiente = null;
  document.getElementById('modalTitulo').textContent = 'Editar';
  document.getElementById('fArchivo').value = '';
  document.getElementById('fNombre').value = it.nombre || '';
  // v1.3: precarga desde tipoArray() — soporta tanto el formato nuevo
  // (arreglo) como el viejo (string suelto, ítems aún no migrados).
  const tiposActuales = tipoArray(it);
  document.getElementById('fTipoAvatar').checked = tiposActuales.includes('avatar');
  document.getElementById('fTipoIcono').checked = tiposActuales.includes('icono');
  categoriaModalActual = it.categoria || ''; // v1.4
  document.getElementById('fCategoriaNueva').value = ''; // v1.4
  renderCategoriaChipsModal(); // v1.4
  document.getElementById('fActivo').checked = it.activo !== false;
  const preview = document.getElementById('previewThumb');
  preview.src = urlMiniatura(it.urlCloudinary);
  preview.classList.add('mostrar');
  document.getElementById('btnEliminar').style.display = 'inline';
  document.getElementById('btnGuardar').disabled = false;
  document.getElementById('modalBg').classList.add('active');
}

function cerrarModal(){
  document.getElementById('modalBg').classList.remove('active');
}

function guardarActual(){
  const nombre = document.getElementById('fNombre').value.trim();
  if(!nombre){
    alert('El nombre es obligatorio.');
    return;
  }
  if(!editId && !urlSubidaPendiente){
    alert('Sube una imagen antes de guardar.');
    return;
  }
  // v1.3: tipo ahora es arreglo — al menos uno de los 2 checkboxes debe
  // estar marcado (mismo criterio de validación obligatoria que antes
  // tenía el <select>, que siempre traía un valor).
  const tipo = [];
  if(document.getElementById('fTipoAvatar').checked) tipo.push('avatar');
  if(document.getElementById('fTipoIcono').checked) tipo.push('icono');
  if(tipo.length === 0){
    alert('Marca al menos un tipo (Avatar y/o Icono).');
    return;
  }

  const datos = {
    nombre,
    tipo,
    categoria: categoriaModalActual, // v1.4: viene de los chips, no de un input libre
    activo: document.getElementById('fActivo').checked,
    actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
  };
  if(urlSubidaPendiente){
    datos.urlCloudinary = urlSubidaPendiente;
  }

  const btnGuardar = document.getElementById('btnGuardar');
  btnGuardar.disabled = true;

  const promesa = editId
    ? catalogoRef.doc(editId).update(datos)
    : catalogoRef.add({ ...datos, creadoEn: firebase.firestore.FieldValue.serverTimestamp() });

  promesa
    .then(() => cerrarModal())
    .catch(err => {
      console.error('Error guardando:', err);
      alert('No se pudo guardar: ' + err.message);
    })
    .finally(() => { btnGuardar.disabled = false; });
}

function eliminarActual(){
  if(!editId) return;
  if(!confirm('¿Eliminar este avatar/icono? La imagen seguirá existiendo en Cloudinary, solo se borra del catálogo.')) return;
  catalogoRef.doc(editId).delete()
    .then(() => cerrarModal())
    .catch(err => {
      console.error('Error eliminando:', err);
      alert('No se pudo eliminar: ' + err.message);
    });
}

// ============ SUBIR EN LOTE (v1.1) ============
let loteArchivos = []; // [{file, nombre, previewUrl, estado: 'pendiente'|'subiendo'|'ok'|'error'}]
let categoriaLoteActual = ''; // v1.4: categoría elegida por chips, para todo el lote

// v1.4: mismos chips que el modal individual, apuntando a #fLoteCategoriaChips.
function renderCategoriaChipsLote(){
  const cont = document.getElementById('fLoteCategoriaChips');
  let cats = listaCategorias();
  if(categoriaLoteActual && !cats.includes(categoriaLoteActual)) cats = [...cats, categoriaLoteActual].sort();
  cont.innerHTML = cats.length === 0
    ? '<span style="color:var(--muted);font-size:0.8rem">Aún no hay categorías — escribe una nueva abajo.</span>'
    : cats.map(c => `<button type="button" class="chip ${c === categoriaLoteActual ? 'activo' : ''}" onclick="seleccionarCategoriaLote('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`).join('');
}

function seleccionarCategoriaLote(cat){
  categoriaLoteActual = (categoriaLoteActual === cat) ? '' : cat;
  renderCategoriaChipsLote();
}

function agregarCategoriaNuevaLote(){
  const input = document.getElementById('fLoteCategoriaNueva');
  const val = input.value.trim();
  if(!val) return;
  categoriaLoteActual = val;
  input.value = '';
  renderCategoriaChipsLote();
}

function nombreSinExtension(nombreArchivo){
  const idx = nombreArchivo.lastIndexOf('.');
  return idx > 0 ? nombreArchivo.slice(0, idx) : nombreArchivo;
}

function abrirModalLote(){
  loteArchivos = [];
  document.getElementById('fLoteTipoAvatar').checked = false; // v1.3 — default previo era 'icono' solo
  document.getElementById('fLoteTipoIcono').checked = true; // v1.3
  categoriaLoteActual = ''; // v1.4
  document.getElementById('fLoteCategoriaNueva').value = ''; // v1.4
  renderCategoriaChipsLote(); // v1.4
  document.getElementById('fLoteArchivos').value = '';
  document.getElementById('loteProgreso').classList.remove('mostrar');
  document.getElementById('btnSubirLote').disabled = true;
  renderListaLote();
  document.getElementById('modalLoteBg').classList.add('active');
}

function cerrarModalLote(){
  document.getElementById('modalLoteBg').classList.remove('active');
  loteArchivos.forEach(it => URL.revokeObjectURL(it.previewUrl));
  loteArchivos = [];
}

function onArchivosLoteSeleccionados(e){
  const archivos = Array.from(e.target.files || []);
  loteArchivos = archivos.map(file => ({
    file,
    nombre: nombreSinExtension(file.name),
    previewUrl: URL.createObjectURL(file),
    estado: 'pendiente'
  }));
  document.getElementById('btnSubirLote').disabled = loteArchivos.length === 0;
  renderListaLote();
}

function renderListaLote(){
  const cont = document.getElementById('loteLista');
  if(loteArchivos.length === 0){
    cont.innerHTML = '<div class="lote-empty">Selecciona uno o varios archivos para empezar.</div>';
    return;
  }
  cont.innerHTML = loteArchivos.map((it, i) => `
    <div class="lote-item">
      <img src="${it.previewUrl}" alt="">
      <input type="text" value="${escapeHtml(it.nombre)}" oninput="actualizarNombreLote(${i}, this.value)" ${it.estado !== 'pendiente' ? 'disabled' : ''}>
      <span class="lote-estado ${it.estado === 'ok' ? 'ok' : it.estado === 'error' ? 'err' : ''}">${
        it.estado === 'ok' ? '✔ Listo' : it.estado === 'error' ? '✖ Error' : it.estado === 'subiendo' ? 'Subiendo...' : 'Pendiente'
      }</span>
    </div>
  `).join('');
}

function actualizarNombreLote(i, valor){
  if(loteArchivos[i]) loteArchivos[i].nombre = valor;
}

async function subirLote(){
  if(loteArchivos.length === 0) return;
  // v1.3: tipo ahora es arreglo, mismo criterio de validación que el modal individual.
  const tipo = [];
  if(document.getElementById('fLoteTipoAvatar').checked) tipo.push('avatar');
  if(document.getElementById('fLoteTipoIcono').checked) tipo.push('icono');
  if(tipo.length === 0){
    alert('Marca al menos un tipo (Avatar y/o Icono) para el lote.');
    return;
  }
  const categoria = categoriaLoteActual; // v1.4: viene de los chips, no de un input libre
  const btnSubirLote = document.getElementById('btnSubirLote');
  const progreso = document.getElementById('loteProgreso');
  btnSubirLote.disabled = true;
  progreso.classList.add('mostrar');

  let ok = 0, error = 0;

  for(let i = 0; i < loteArchivos.length; i++){
    const item = loteArchivos[i];
    if(item.estado === 'ok') continue; // ya subido (por si se reintenta)
    item.estado = 'subiendo';
    renderListaLote();
    progreso.textContent = `Subiendo ${i + 1} de ${loteArchivos.length}...`;

    try{
      const formData = new FormData();
      formData.append('file', item.file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('folder', CLOUDINARY_FOLDER);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if(!data.secure_url){
        throw new Error(data.error?.message || 'Cloudinary no devolvió una URL.');
      }

      await catalogoRef.add({
        nombre: item.nombre.trim() || nombreSinExtension(item.file.name),
        tipo,
        categoria,
        activo: true,
        urlCloudinary: data.secure_url,
        creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
        actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
      });

      item.estado = 'ok';
      ok++;
    } catch(err){
      console.error('Error subiendo item de lote:', item.file.name, err);
      item.estado = 'error';
      error++;
    }
    renderListaLote();
  }

  progreso.textContent = `Listo: ${ok} subidos${error > 0 ? `, ${error} con error` : ''}.`;
  btnSubirLote.disabled = false;

  if(error === 0){
    setTimeout(() => cerrarModalLote(), 1200);
  }
}
</script>

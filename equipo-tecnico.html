<!-- AUDIOLINK · equipo-tecnico.html · v1.7
     v1.7: se migra al patrón offline Fase 1 (mismo cambio que
     index.html v2.21, proyecto.html v5.34, logistica.html v2.72) — se
     agrega <script src="offline-mock.js"> en el <head> (antes de
     firebase-config.js) y se cambia `const db = firebase.firestore()`
     por `const db = crearDB()`. Con AUDIOLINK_MODO_OFFLINE en false
     (default), crearDB() devuelve firebase.firestore() real — cero
     cambio de comportamiento. No se tocó ninguna otra lógica.
     v1.6: mismo cambio que musicos.html v2.0 — mitigación de costo de
     collectionGroup('sesiones'): (1) botón manual "🔄 Calcular
     registrado" en vez de disparo automático; (2) caché en localStorage
     15 min (audiolink_registrados_tecnicos); (3) advertencia visible de
     sesiones sin tarifa asignada (no suman, pero ahora se avisa cuántas
     quedaron fuera). No se tocó ninguna otra lógica.
     v1.5
     v1.5: mismo agregado que musicos.html v1.9, adaptado a técnicos:
     "Registrado" (suma de tarifa de todas las sesiones donde el técnico
     aparece en tecnicosAsignados — SIN multiplicar por canales, ese
     campo no existe para técnicos, es tarifa plana por asignación), vía
     db.collectionGroup('sesiones') (ya permitido para staff, no se
     tocaron reglas). Estado Pagado/Abonado/Pendiente (Total pagado v1.4
     vs Registrado). Botón "📄 Exportar informe" en el panel — mismo
     estilo visual que musicos.html/egresos.html. No se tocó ninguna otra
     lógica del CRUD.
     v1.4
     v1.4: "Total pagado" (v1.3) pasa de carga única (.get()) a tiempo
     real (.onSnapshot()) — mismo motivo que musicos.html v1.8: se usa
     para informes, necesita reflejar el estado exacto al momento de
     generarlos. Solo lectura, no se tocó el CRUD de técnicos.
     v1.3
     v1.3: se agrega "Total pagado" — lectura de la colección egresos
     (egresos.html v1.3), filtrada por personaTipo=='tecnico' y agrupada
     por personaId. Se carga una sola vez al iniciar (no en tiempo real,
     es solo dato de contexto) y se muestra en cada tarjeta y en el panel
     de edición (solo lectura, no editable desde acá — el registro de
     pagos sigue viviendo únicamente en egresos.html). No se tocó ninguna
     otra lógica del CRUD de técnicos.
     v1.2
     v1.2: se aumenta un poco el tamaño en mobile de botones/campos de
     formulario (.btn/.btn-ghost, .field input/select/textarea, .field
     label) para mejorar legibilidad y área táctil — no toca botones
     chicos de utilidad. .btn-icon ("⋮") sube de 38px a 42px. Mismo
     ajuste aplicado en paralelo a los otros 10 archivos del ecosistema
     y a nav.css v1.1.
     v1.1: se retira el bloque de CSS de navegación (sidebar/mobile-topbar/
     bottomnav/panel "···") que estaba copiado y pegado en este archivo —
     ahora vive centralizado en nav.css (<link> agregado en el <head>).
     Se conservan intactas las reglas propias de la página dentro del
     mismo @media (768px): .top-actions, .modal-actions, #btnEliminar,
     .row2. Se agrega también la regla .btn-icon (faltaba por completo),
     que estiliza el botón "⋮" que nav.js inyecta en la topbar mobile —
     antes se veía sin tamaño ni centrado. No se tocó ninguna otra
     lógica ni estilo de la página.
     v1: primera versión. Catálogo de equipo técnico (Ingeniero de
     Grabación, Asistente, etc.) — colección Firestore NUEVA y separada
     'equipoTecnico' (NO es equipoInterno, que es solo el guard de login
     de todo el ecosistema; mezclar tarifas de negocio ahí sería un
     riesgo si algún día cambian los permisos de esa colección).
     Campos por técnico: nombre, rol (texto libre), tarifa, activo.
     Pensado para que cotizador.html cargue de acá el datalist de
     "Ingeniería de Grabación" y autocomplete la tarifa al elegir un
     nombre existente (mismo patrón que onCambioConsentMusico() en
     logistica.html) — ese ajuste en cotizador.html queda para un paso
     aparte, este archivo es solo el catálogo.
     Estructura, estilos, sidebar/nav.js, tema claro/oscuro y guard de
     sesión calcados de logistica.html/cotizador.html, sin inventar
     patrones nuevos. El formulario de alta/edición NO es modal flotante
     — es un panel en el mismo flujo de la página (mismo criterio que el
     editor de sesión de logistica.html v2.16): oculta la lista y
     muestra el formulario en su lugar, con "← Volver a la lista". -->

<script>
// ============ FIREBASE CONFIG ============
firebase.initializeApp(firebaseConfig);
const db = crearDB();
const auth = firebase.auth();
const equipoTecnicoRef = db.collection('equipoTecnico');
const egresosRefTec = db.collection('egresos'); // v1.3: solo lectura, para "Total pagado"

// ============ GUARD DE SESIÓN (mismo patrón que logistica.html/cotizador.html) ============
auth.onAuthStateChanged(async (user) => {
  if(!user){
    window.location.href = 'login.html';
    return;
  }
  try{
    const doc = await db.collection('equipoInterno').doc(user.email).get();
    if(!doc.exists || doc.data().activo !== true){
      await auth.signOut();
      window.location.href = 'login.html';
      return;
    }
    initEquipoTecnico();
  } catch(e){
    console.error('Error validando sesión:', e);
    window.location.href = 'login.html';
  }
});

// cerrarSesion(), toggleTema(), toggleMasMobile() y el colapsar del sidebar
// viven en nav.js (compartido por todo el ecosistema) — no se duplican acá.

// ============ ESTADO ============
let tecnicos = [];
let tecnicoActualId = null;
let unsubscribeTecnicos = null;
let totalesPagadosTec = {}; // v1.3: { personaId: totalAcumulado } desde egresos
let totalesRegistradosTec = {}; // v1.5: { tecnicoId: totalRegistrado } — suma de tarifa en sesiones (collectionGroup)
let tecnicoIdParaInforme = null;
let tecnicoNombreParaInforme = '';

let sinTarifaTec = {}; // v1.6: { tecnicoId: cantidadDeSesionesSinTarifa }

// v1.6: mismo patrón de caché/botón manual que musicos.html v2.0.
function cargarRegistradosTecnicos(forzar){
  const CACHE_KEY = 'audiolink_registrados_tecnicos';
  const CACHE_MIN = 15;
  if(!forzar){
    try{
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(cache && (Date.now() - cache.ts) < CACHE_MIN * 60 * 1000){
        totalesRegistradosTec = cache.registrados;
        sinTarifaTec = cache.sinTarifa;
        mostrarInfoCacheRegistradoTec(cache.ts);
        renderTecnicos();
        return;
      }
    } catch(e){ /* caché corrupto o inexistente, se ignora y se recalcula */ }
  }
  document.getElementById('registradoCacheInfoTec').textContent = 'Calculando…';
  db.collectionGroup('sesiones').get()
    .then(snap => {
      totalesRegistradosTec = {};
      sinTarifaTec = {};
      snap.forEach(d => {
        const s = d.data();
        (s.tecnicosAsignados || []).forEach(t => {
          if(!t.tecnicoId) return;
          if(t.tarifa == null){
            sinTarifaTec[t.tecnicoId] = (sinTarifaTec[t.tecnicoId] || 0) + 1;
            return;
          }
          totalesRegistradosTec[t.tecnicoId] = (totalesRegistradosTec[t.tecnicoId] || 0) + Number(t.tarifa);
        });
      });
      const ts = Date.now();
      try{
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ts, registrados: totalesRegistradosTec, sinTarifa: sinTarifaTec }));
      } catch(e){ /* localStorage lleno o no disponible, se sigue sin cachear */ }
      mostrarInfoCacheRegistradoTec(ts);
      renderTecnicos();
    })
    .catch(err => console.error('Error cargando registrado (sesiones) de técnicos:', err));
}

function mostrarInfoCacheRegistradoTec(ts){
  const mins = Math.round((Date.now() - ts) / 60000);
  document.getElementById('registradoCacheInfoTec').textContent =
    mins === 0 ? 'Calculado hace instantes' : `Calculado hace ${mins} min`;
}

// v1.5: Pagado/Abonado/Pendiente — pagado vs registrado
function estadoPagoTecnico(id){
  const pagado = totalesPagadosTec[id] || 0;
  const registrado = totalesRegistradosTec[id] || 0;
  if(registrado === 0) return null;
  if(pagado >= registrado) return { texto: 'Pagado', color: 'var(--ok)' };
  if(pagado > 0) return { texto: 'Abonado', color: 'var(--warn)' };
  return { texto: 'Pendiente', color: 'var(--err)' };
}

function initEquipoTecnico(){
  egresosRefTec.where('personaTipo', '==', 'tecnico').onSnapshot(snap => {
      totalesPagadosTec = {};
      snap.forEach(d => {
        const eg = d.data();
        totalesPagadosTec[eg.personaId] = (totalesPagadosTec[eg.personaId] || 0) + (eg.monto || 0);
      });
      renderTecnicos();
    }, err => console.error('Error escuchando totales de egresos:', err));

  unsubscribeTecnicos = equipoTecnicoRef.orderBy('nombre').onSnapshot(snap => {
    tecnicos = [];
    snap.forEach(d => tecnicos.push({ id: d.id, ...d.data() }));
    renderTecnicos();
  }, err => {
    console.error('Error cargando equipoTecnico:', err);
  });

  cargarRegistradosTecnicos(); // v1.6: usa caché de localStorage si está vigente (15 min); si no, calcula
}

function renderTecnicos(){
  const grid = document.getElementById('gridTecnicos');
  const empty = document.getElementById('emptyState');
  if(tecnicos.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = tecnicos.map(t => `
    <div class="card" onclick="abrirPanelEditar('${t.id}')">
      <div class="card-top">
        <h3>${t.nombre || '—'}</h3>
        <span class="badge ${t.activo !== false ? 'vis' : 'priv'}">${t.activo !== false ? 'Activo' : 'Inactivo'}</span>
      </div>
      <div class="meta">${t.rol || 'Sin rol asignado'}</div>
      <div class="tarifa">${typeof formatCOP === 'function' ? formatCOP(t.tarifa || 0) : (t.tarifa || 0)}</div>
      <div style="font-size:0.72rem;color:var(--muted);margin-top:6px;">Total pagado: ${typeof formatCOP === 'function' ? formatCOP(totalesPagadosTec[t.id] || 0) : (totalesPagadosTec[t.id] || 0)}${totalesRegistradosTec[t.id] ? ' de ' + formatCOP(totalesRegistradosTec[t.id]) : ''}
        ${(() => { const e = estadoPagoTecnico(t.id); return e ? `<span style="color:${e.color};font-weight:600;margin-left:6px;">● ${e.texto}</span>` : ''; })()}
        ${sinTarifaTec[t.id] ? `<div style="color:var(--warn);margin-top:2px;">⚠️ ${sinTarifaTec[t.id]} sesión(es) sin tarifa asignada</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ============ PANEL (alta/edición) ============
function abrirPanelNuevo(){
  tecnicoActualId = null;
  document.getElementById('panelTitulo').textContent = 'Nuevo técnico';
  document.getElementById('fNombre').value = '';
  document.getElementById('fRol').value = '';
  document.getElementById('fTarifa').value = '';
  document.getElementById('fActivo').checked = true;
  document.getElementById('btnEliminar').style.display = 'none';
  document.getElementById('campoTotalPagadoTec').style.display = 'none';
  document.getElementById('campoRegistradoTec').style.display = 'none';
  document.getElementById('btnInformeTec').style.display = 'none';
  mostrarPanel();
}

function abrirPanelEditar(id){
  const t = tecnicos.find(x => x.id === id);
  if(!t) return;
  tecnicoActualId = id;
  document.getElementById('panelTitulo').textContent = 'Editar técnico';
  document.getElementById('fNombre').value = t.nombre || '';
  document.getElementById('fRol').value = t.rol || '';
  document.getElementById('fTarifa').value = t.tarifa || '';
  document.getElementById('fActivo').checked = t.activo !== false;
  document.getElementById('btnEliminar').style.display = 'inline-block';
  document.getElementById('campoTotalPagadoTec').style.display = 'block';
  document.getElementById('valorTotalPagadoTec').textContent = typeof formatCOP === 'function' ? formatCOP(totalesPagadosTec[id] || 0) : (totalesPagadosTec[id] || 0);
  document.getElementById('campoRegistradoTec').style.display = 'block';
  document.getElementById('valorRegistradoTec').textContent = typeof formatCOP === 'function' ? formatCOP(totalesRegistradosTec[id] || 0) : (totalesRegistradosTec[id] || 0);
  const est = estadoPagoTecnico(id);
  document.getElementById('badgeEstadoTec').innerHTML = (est ? `<span style="color:${est.color};font-weight:600;font-size:0.8rem;">● ${est.texto}</span>` : '<span style="color:var(--muted);font-size:0.8rem;">Sin sesiones con tarifa registrada</span>') +
    (sinTarifaTec[id] ? `<div style="color:var(--warn);font-size:0.76rem;margin-top:4px;">⚠️ ${sinTarifaTec[id]} sesión(es) sin tarifa asignada (no incluidas en Registrado)</div>` : '');
  document.getElementById('btnInformeTec').style.display = 'inline-block';
  tecnicoIdParaInforme = id;
  tecnicoNombreParaInforme = t.nombre || '';
  mostrarPanel();
}

// v1.5: informe PDF de un técnico — registrado/pagado/saldo/estado +
// historial de sus pagos. Mismo lenguaje visual que musicos.html v1.9.
async function exportarInformeTecnico(){
  if(!tecnicoIdParaInforme) return;
  const id = tecnicoIdParaInforme;
  const registrado = totalesRegistradosTec[id] || 0;
  const pagado = totalesPagadosTec[id] || 0;
  const saldo = registrado - pagado;
  const est = estadoPagoTecnico(id);
  const fecha = new Date().toLocaleDateString('es-CO', { day:'2-digit', month:'long', year:'numeric' });

  let pagosHtml = '<tr><td colspan="4" style="color:#888;">Sin pagos registrados.</td></tr>';
  try{
    const snap = await db.collection('egresos').where('personaId', '==', id).get();
    const pagos = snap.docs.map(d => d.data()).filter(eg => eg.personaTipo === 'tecnico').sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    if(pagos.length){
      pagosHtml = pagos.map(eg => `<tr>
        <td>${eg.fecha || '—'}</td>
        <td>${escapeHtml(eg.proyectoNombre || '—')}${eg.temaNombre ? ' → ' + escapeHtml(eg.temaNombre) : ''}</td>
        <td>${eg.esAnticipo ? 'Anticipo' : 'Pago'}</td>
        <td>${formatCOP(eg.monto || 0)}</td>
      </tr>`).join('');
    }
  } catch(err){
    console.error('Error cargando pagos para el informe:', err);
  }

  const html = `
    <div class="print-header">
      <div>
        <div class="print-title">AUDIOLINK</div>
        <div class="print-subtitle">Informe de pagos — ${escapeHtml(tecnicoNombreParaInforme)}</div>
      </div>
      <div style="font-family:var(--M);font-size:10px;color:#7A7060;">${fecha}</div>
    </div>
    <div class="print-resumen-grid">
      <div class="print-resumen-item"><div class="lbl">Registrado</div><div class="val">${formatCOP(registrado)}</div></div>
      <div class="print-resumen-item"><div class="lbl">Pagado</div><div class="val">${formatCOP(pagado)}</div></div>
      <div class="print-resumen-item"><div class="lbl">Saldo</div><div class="val">${formatCOP(saldo)}</div></div>
      <div class="print-resumen-item"><div class="lbl">Estado</div><div class="val">${est ? est.texto : '—'}</div></div>
    </div>
    ${sinTarifaTec[id] ? `<div style="font-size:11px;color:#8a6d1a;margin-top:6px;">⚠️ ${sinTarifaTec[id]} sesión(es) sin tarifa asignada, no incluidas en "Registrado".</div>` : ''}
    <div class="print-section-title">Historial de pagos</div>
    <table class="print-table">
      <thead><tr><th>Fecha</th><th>Proyecto</th><th>Tipo</th><th>Monto</th></tr></thead>
      <tbody>${pagosHtml}</tbody>
    </table>
    <div class="print-footer-container">
      <div class="print-footer-grid">
        <span>AUDIOLINK — Producción y Logística Musical</span>
        <span>Documento confidencial — solo uso interno</span>
      </div>
      <div style="text-align:center;font-size:9.5px;color:#8a8578;margin-top:8px;letter-spacing:0.02em;">Marto 🧠 · martowave@gmail.com</div>
    </div>
  `;
  document.getElementById('print-view').innerHTML = html;
  window.print();
}

function mostrarPanel(){
  document.getElementById('gridTecnicos').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.querySelector('.top-actions').style.display = 'none';
  document.getElementById('panelTecnico').classList.add('active');
}

function cerrarPanel(){
  document.getElementById('panelTecnico').classList.remove('active');
  document.querySelector('.top-actions').style.display = '';
  document.getElementById('gridTecnicos').style.display = '';
  renderTecnicos();
}

async function guardarTecnico(){
  const nombre = document.getElementById('fNombre').value.trim();
  const rol = document.getElementById('fRol').value.trim();
  const tarifa = Number(document.getElementById('fTarifa').value) || 0;
  const activo = document.getElementById('fActivo').checked;

  if(!nombre){
    alert('Ingresa el nombre del técnico.');
    return;
  }

  const data = { nombre, rol, tarifa, activo };

  try{
    if(tecnicoActualId){
      await equipoTecnicoRef.doc(tecnicoActualId).update(data);
    } else {
      await equipoTecnicoRef.add(data);
    }
    cerrarPanel();
  } catch(e){
    console.error('Error guardando técnico:', e);
    alert('Error guardando el técnico. Revisa la consola.');
  }
}

async function eliminarTecnico(){
  if(!tecnicoActualId) return;
  if(!confirm('¿Eliminar este técnico del catálogo? Esta acción no se puede deshacer.')) return;
  try{
    await equipoTecnicoRef.doc(tecnicoActualId).delete();
    cerrarPanel();
  } catch(e){
    console.error('Error eliminando técnico:', e);
    alert('Error eliminando el técnico. Revisa la consola.');
  }
}
</script>

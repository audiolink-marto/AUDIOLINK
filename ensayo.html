// v1.7: estado por sesión (bpm, compás, offset, secciones, loop, click)
// — getTiempoActual()/seek() abstraen si el reproductor es <audio> o
// YouTube, para que el resto de estas funciones no necesite saberlo.
let estadoPractica = {};

// v3.36: (a pedido) si el celular rota o la ventana cambia de tamaño,
// el ancho real del canvas (canvas.clientWidth, usado por
// dibujarWaveform desde v3.36) cambia con él — sin este listener, el
// waveform quedaba con la resolución vieja hasta el próximo evento
// (play/seek/etc.). Se debounce con requestAnimationFrame para no
// redibujar de más mientras el usuario todavía está arrastrando el
// borde de la ventana o girando el teléfono.
let resizeWaveformsRAF = null;
window.addEventListener('resize', () => {
  if(resizeWaveformsRAF) cancelAnimationFrame(resizeWaveformsRAF);
  resizeWaveformsRAF = requestAnimationFrame(() => {
    Object.keys(estadoPractica).forEach(uid => {
      const est = estadoPractica[uid];
      if(est && est.waveformPeaks && est.getTiempoActual){
        dibujarWaveform(uid, est.getTiempoActual());
      }
    });
  });
});

// v2.2/v2.3: si el tema tiene BPM/compás cargados pero no hay maqueta
// para el instrumento de este músico, igual se muestra el bloque —
// ahora con los mismos controles de siempre (el botón de metrónomo
// libre ya está incluido en controlesPracticaHtml para todos los
// casos), solo sin reproductor arriba.
function segundosATextoPractica(seg){
  seg = Math.max(0, seg || 0);
  const m = Math.floor(seg / 60);
  const s = Math.floor(seg % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
// v3.175: (a pedido) inverso de segundosATextoPractica — mismo formato
// y misma función (textoASegundos) que ya usa el editor de secciones
// del staff (guia-practica.html) para sus campos "Desde/Hasta (tiempo)".
function textoASegundosPractica(txt){
  const partes = (txt || '0:0').split(':');
  if(partes.length === 2) return (parseInt(partes[0],10) || 0) * 60 + (parseInt(partes[1],10) || 0);
  return parseInt(partes[0],10) || 0;
}

// Duración de un compás completo y snap al borde más cercano — mismo
// criterio que segundosPorCompas()/snapASegundoDeCompas() en
// guia-practica.html v1.3, para que loop y secciones queden coherentes.
function snapACompasPractica(seg, bpm, compasesPorBarra, offset){
  offset = offset || 0;
  const secPerBar = (60 / bpm) * compasesPorBarra;
  if(!secPerBar) return seg;
  const n = Math.round((seg - offset) / secPerBar);
  return Math.max(0, offset + n * secPerBar);
}

let audioCtxPractica = null;

// v3.120: (a pedido, "el click se siente inestable") único punto de
// creación/resume del AudioContext compartido. Antes, cada
// crearWebAudioPlayer() (loop exacto de una maqueta) abría SU PROPIO
// AudioContext nuevo, distinto del audioCtxPractica que usa el
// scheduler para agendar los beeps — el click se agendaba con el
// reloj de un contexto y la posición real de reproducción venía del
// reloj de OTRO contexto. Con varios instrumentos/maquetas activos
// (uno por uid) eso significaba varios AudioContext corriendo a la
// vez, cada uno con su propio hilo de audio — fuente típica de
// jitter/drift entre agendado y reproducción real, sobre todo en
// móvil. Ahora todo (scheduler + cada player de loop exacto) pide el
// contexto por acá, así siempre es el mismo.
function obtenerAudioCtxPractica(){
  if(!audioCtxPractica) audioCtxPractica = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtxPractica.state === 'suspended') audioCtxPractica.resume();
  return audioCtxPractica;
}

// v3.214: (a pedido, "en mobile el audio se siente atrasado") tiempo
// real que tarda el hardware en sacar el sonido por el parlante desde
// que Web Audio lo agenda. En desktop suele ser bajo (10-20ms,
// imperceptible); en mobile puede ser 80-150ms (medido 112ms en
// Opera/Android) — suficiente para que el punto visual (que se
// enciende en el instante en que se AGENDA el sonido, no en el que
// suena) se sienta adelantado respecto a lo que se oye. outputLatency
// es la propiedad estándar para esto; baseLatency es el respaldo en
// navegadores que no la soportan; 0 es el último respaldo (mismo
// comportamiento que antes de este fix, no rompe nada). Se consulta en
// vivo (no se cachea): el valor puede cambiar si el sistema operativo
// reenruta el audio (ej. conectar/desconectar Bluetooth a mitad de
// sesión).
function latenciaSalidaAudioPractica(){
  const ctx = audioCtxPractica;
  if(!ctx) return 0;
  if(typeof ctx.outputLatency === 'number' && ctx.outputLatency > 0) return ctx.outputLatency;
  if(typeof ctx.baseLatency === 'number' && ctx.baseLatency > 0) return ctx.baseLatency;
  return 0;
}

// v3.97: (a pedido, "el metrónomo en móvil no es constante") scheduler
// de audio independiente del rAF visual. Antes, cada beep se disparaba
// EN EL MISMO INSTANTE en que actualizarContadorPractica() (llamada
// desde requestAnimationFrame) detectaba el cambio de beat — y rAF no
// tiene garantía de timing: el sistema operativo puede retrasarlo o
// saltarse frames (batería, pantalla, etc.), sobre todo en móvil. En
// escritorio casi no se nota porque rAF es mucho más estable ahí.
// Solución (estándar para metrónomos web, técnica de Chris Wilson/
// Web Audio): un setInterval corto agenda los próximos beeps ~100ms
// hacia adelante usando el reloj de Web Audio (audioCtxPractica.
// currentTime, que corre en el hilo de audio con precisión de
// hardware) en vez de esperar a que rAF "note" que tocaba sonar.
// El rAF/actualizarContadorPractica() sigue intacto para lo VISUAL
// (dots, números, flash de clave) — el jitter ahí no se nota ni se
// oye. Ver bloques removidos en actualizarContadorPractica (click y
// clave) que antes disparaban el beep directamente.
const SCHED_LOOKAHEAD_SEC = 0.1;
const SCHED_INTERVAL_MS = 25;
function schedulerTickGlobalPractica(){
  for(const uid in estadoPractica){
    const est = estadoPractica[uid];
    if(!est) continue;
    const clickOn = !!est.clickActivo;
    // v3.113: (a pedido) claveOn ahora también se activa si el tema no
    // tiene clave general pero ALGUNA sección sí trae claveSeccion
    // propia (est.tieneClaveSeccionAlguna, precalculado al cargar el
    // tema) — antes dependía solo de est.claveEfectiva/est.clave, y una
    // sección con clave propia en un tema sin clave general nunca
    // sonaba. Si el tema ya tiene clave general, el resultado es
    // idéntico a antes (ninguna sección "apaga" la clave general).
    const claveOn = est.claveActiva !== false && (!!(est.claveEfectiva !== undefined ? est.claveEfectiva : est.clave) || !!est.tieneClaveSeccionAlguna);
    const libreOn = !!est.metroLibreActivo;
    if(!clickOn && !claveOn && !libreOn) continue;

    obtenerAudioCtxPractica();

    const bpmEf = est.bpmEfectivo || est.bpm;
    if(!bpmEf) continue;
    // v3.205: (a pedido) FIX raíz — secPerBeat (el click de audio REAL)
    // ahora incorpora factorCompasGeneralDe(est) (4/denominador del
    // compás, ej. 0.5 para /8). Antes, un compás /8 sonaba al DOBLE de
    // lento que el pulso real (por eso hacía falta la subdivisión ×2
    // como parche audible) — ahora el click suena al tempo real de
    // una sola vez. Para cualquier tema en /4 el factor da 1: cero
    // cambio de audio en el catálogo existente.
    const secPerBeat = (60 / bpmEf) * factorCompasGeneralDe(est);
    const offset = (est.offset || 0) + (est.offsetLocalDelta || 0);
    const tiempoActual = libreOn
      ? (performance.now() - est.metroLibreInicio) / 1000
      : (est.getTiempoActual ? est.getTiempoActual() : 0);
    const tRel = Math.max(0, tiempoActual - offset);
    const ahoraCtx = audioCtxPractica.currentTime;
    const ventanaHasta = tRel + SCHED_LOOKAHEAD_SEC;

    // --- pulso normal (click / metrónomo libre) ---
    if(clickOn || libreOn){
      if(est.schedNextBeatIdx == null ||
         Math.abs(est.schedNextBeatIdx * secPerBeat - tRel) > secPerBeat * 1.5){
        // primera vez, o desincronizado (seek/loop/cambio de bpm): resync
        est.schedNextBeatIdx = Math.ceil(tRel / secPerBeat);
      }
      // v3.110: (a pedido) tramos de compás para el click sincronizado
      // (no el libre, ver comentario en tramosClickMusico) — se calcula
      // UNA vez por tick, no dentro del while, para no rehacer el
      // sort/forEach por cada beat agendado en la ventana.
      const tramosClick = (clickOn && !libreOn) ? recorrerTramosMusico(seccionesRuntimeDe(est), offset, bpmEf, compasEfectivoDe(est), !!est.compasesOverride, factorCompasGeneralDe(est)) : null;
      while(est.schedNextBeatIdx * secPerBeat < ventanaHasta){
        const beatTime = est.schedNextBeatIdx * secPerBeat;
        const when = ahoraCtx + (beatTime - tRel);
        let beatEnBarra;
        if(tramosClick){
          const tAbs = offset + beatTime;
          const tramoActual = tramoMusicoEnSegundo(tramosClick, tAbs);
          const beatsDesdeInicioTramo = Math.round((tAbs - tramoActual.inicioSeg) / secPerBeat);
          beatEnBarra = tramoActual.beats ? (((beatsDesdeInicioTramo % tramoActual.beats) + tramoActual.beats) % tramoActual.beats) : 0;
        } else {
          beatEnBarra = ((est.schedNextBeatIdx % compasEfectivoDe(est)) + compasEfectivoDe(est)) % compasEfectivoDe(est);
        }
        const acento = (est.acentos && est.acentos[beatEnBarra]) || 'normal';
        if(acento !== 'mudo') beepPractica(acento === 'fuerte', est.sonidoClick, acento === 'fuerte' ? est.volFuerte : est.volNormal, false, when);
        est.schedNextBeatIdx++;
      }
    }

    // --- subdivisión (v3.152, a pedido) ---
    // Clicks de RELLENO entre los pulsos principales de arriba — mismo
    // contador de tiempo (tRel/ahoraCtx/ventanaHasta) pero con su
    // propio índice independiente (schedNextSubIdx), así el pulso
    // principal (schedNextBeatIdx, beatEnBarra, acentos, tramosClick)
    // queda intacto, cero riesgo de desincronizar el click/bombillos
    // que ya funcionaban. Los golpes que caen justo sobre un pulso
    // principal (subIdx % subdiv === 0) se saltan — esos ya suenan
    // arriba con su propio acento. Volumen reducido (×0.6) y siempre
    // sonido "normal" para que se escuchen como relleno, no como pulso.
    const subdiv = subdivisionDe(est);
    if((clickOn || libreOn) && subdiv > 1){
      const secPerSub = secPerBeat / subdiv;
      if(est.schedNextSubIdx == null ||
         Math.abs(est.schedNextSubIdx * secPerSub - tRel) > secPerSub * 1.5){
        est.schedNextSubIdx = Math.ceil(tRel / secPerSub);
      }
      while(est.schedNextSubIdx * secPerSub < ventanaHasta){
        const subTime = est.schedNextSubIdx * secPerSub;
        if(((est.schedNextSubIdx % subdiv) + subdiv) % subdiv !== 0){
          const whenSub = ahoraCtx + (subTime - tRel);
          beepPractica(false, est.sonidoClick, (est.volNormal || 0.55) * 0.6, false, whenSub);
        }
        est.schedNextSubIdx++;
      }
    }

    // --- clave ---
    if(claveOn){
      // v3.112: (a pedido) clave por sección — se resuelve el tramo UNA
      // vez al entrar acá (no dentro del while de agendamiento: la
      // ventana SCHED_LOOKAHEAD_SEC es 0.1s, muy por debajo de un ciclo
      // de clave típico, así que no hace falta resync a mitad de
      // ventana, igual razonamiento que resolverClaveDeTramo() de abajo).
      // Si hay claveOverride activo se respeta el global de siempre
      // para TODOS los tramos (sin cambio de comportamiento); si no,
      // el tramo con claveSeccion propia usa su patrón, y el que no
      // tiene cae al efectivo general — exactamente como hasta ahora.
      const { onsets: claveOnsetsEf, cicloSec: claveCicloSecEf, tRelAncla: tRelAnclaClave } = resolverClaveDeTramo(est, offset, tRel);
      if(claveOnsetsEf && claveOnsetsEf.length && claveCicloSecEf){
        const n = claveOnsetsEf.length;
        const tiempoDeEvento = (g) => {
          const ciclo = Math.floor(g / n);
          const idxLocal = ((g % n) + n) % n;
          return ciclo * claveCicloSecEf + claveOnsetsEf[idxLocal];
        };
        // v3.125: (a pedido) FIX raíz — todo el timing de la clave
        // (resync y agendamiento) pasa a razonar sobre tRelAnclaClave
        // (reloj anclado al inicio del TRAMO cuando hay claveSeccion
        // propia, global si no — ver resolverClaveDeTramo) en vez de
        // tRel (siempre global). "ahoraCtx" sigue siendo el reloj real
        // de Web Audio para el "when" final. "ventanaHasta" (arriba,
        // línea ~3155) SIGUE en tRel global — se usa tal cual para el
        // click normal (sin cambio ahí) pero NO sirve para comparar
        // contra tiempoDeEvento (que ahora puede estar en otro reloj);
        // se define una ventana propia en el mismo reloj de la clave.
        const ventanaHastaClave = tRelAnclaClave + SCHED_LOOKAHEAD_SEC;
        if(est.schedNextClaveIdx == null ||
           Math.abs(tiempoDeEvento(est.schedNextClaveIdx) - tRelAnclaClave) > claveCicloSecEf * 1.5){
          // resync: primer evento con tiempo > tRelAnclaClave
          const cicloIndex = Math.floor(tRelAnclaClave / claveCicloSecEf);
          const tCiclo = tRelAnclaClave - cicloIndex * claveCicloSecEf;
          let nextLocal = claveOnsetsEf.findIndex(o => o > tCiclo);
          est.schedNextClaveIdx = nextLocal === -1 ? (cicloIndex + 1) * n : cicloIndex * n + nextLocal;
        }
        while(tiempoDeEvento(est.schedNextClaveIdx) < ventanaHastaClave){
          const idxLocal = ((est.schedNextClaveIdx % n) + n) % n;
          const acentoClave = (est.acentosClave && est.acentosClave[idxLocal]) || 'normal';
          if(acentoClave !== 'mudo'){
            const when = ahoraCtx + (tiempoDeEvento(est.schedNextClaveIdx) - tRelAnclaClave);
            beepPractica(acentoClave === 'fuerte', (est.sonidoClave || 'clasico'), acentoClave === 'fuerte' ? est.volFuerte : est.volNormal, false, when);
          }
          est.schedNextClaveIdx++;
        }
      }
    }
  }
}
setInterval(schedulerTickGlobalPractica, SCHED_INTERVAL_MS);
// v2.4: parámetro sonido ('clasico'|'grave'|'woodblock') — solo cambia
// waveform/frecuencias del beep, la lógica de timing no se toca.
// v2.5: parámetro volumen (0 a 1) — antes el "acento" solo cambiaba la
// frecuencia (poco perceptible); ahora también escala el gain real,
// que es lo que hace audible la diferencia entre golpe fuerte/normal.
// v3.72: (a pedido) ícono del botón de metrónomo — antes era texto
// plano (▮/▯), que se ve distinto según la fuente del dispositivo.
// Un SVG inline con currentColor se ve igual en todos lados y hereda
// el color (gris normal / dorado activo) que ya define .practica-click-btn.activo
// en CSS — no requiere archivo externo ni cambia el tamaño del botón.
const ICONO_METRONOMO_SVG = '📏';
// v3.77: (a pedido) contenido del botón de metrónomo con ícono + texto
// "Metro" — reutilizado en toggleClickPractica y actualizarUIAjustesPractica
// para no repetir el markup en dos lugares.
const HTML_BOTON_METRO = ICONO_METRONOMO_SVG;

const SONIDOS_CLICK = {
  clasico:   { tipo: 'sine',     fFuerte: 1300, fNormal: 900  },
  grave:     { tipo: 'triangle', fFuerte: 700,  fNormal: 500  },
  woodblock: { tipo: 'square',   fFuerte: 1800, fNormal: 1200 },
  // v3.71: (a pedido) sonido orgánico/real de clave — no es un
  // oscilador de tono puro (sine/triangle/square) como los de arriba,
  // sino ruido blanco filtrado en banda + envolvente corta, que se
  // acerca más al golpe percusivo de dos palos de madera que un tono
  // sostenido. Ver rama 'noise' en beepPractica().
  claveorganica: { tipo: 'noise', fFuerte: 2800, fNormal: 2100 }
};
function beepPractica(fuerte, sonido, volumen, precuenta, when){
  obtenerAudioCtxPractica();
  const cfg = SONIDOS_CLICK[sonido] || SONIDOS_CLICK.clasico;
  const vol = Math.max(0, Math.min(1, volumen == null ? 1 : volumen));
  if(vol <= 0) return;
  const ctx = audioCtxPractica;
  // v3.97: si viene un instante agendado (scheduler de audio), el beep
  // arranca AHÍ en vez de "ya" — así el timing no depende de cuándo
  // rAF llegó a llamar esta función. Sin `when` (pre-conteo, u otros
  // usos puntuales) se comporta exactamente igual que antes.
  const t0 = when != null ? when : ctx.currentTime;
  // v3.71: rama de síntesis por ruido filtrado (clave orgánica) — no
  // usa oscilador, sino un buffer de ruido blanco corto pasado por un
  // filtro pasa-banda centrado en la frecuencia del acento, con
  // envolvente rápida (ataque instantáneo, decaimiento ~45ms) para
  // imitar el golpe seco de una clave real.
  if(cfg.tipo === 'noise'){
    const dur = 0.045;
    const bufferSize = Math.max(1, Math.round(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.2);
    }
    const noiseSource = ctx.createBufferSource();
    noiseSource.buffer = buffer;
    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = (fuerte ? cfg.fFuerte : cfg.fNormal) * (precuenta ? 1.3 : 1);
    bandpass.Q.value = 7;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.6 * vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noiseSource.connect(bandpass).connect(gain).connect(ctx.destination);
    noiseSource.start(t0);
    noiseSource.stop(t0 + dur);
    return;
  }
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = cfg.tipo;
  // v3.45: (a pedido) el pre-conteo suena más agudo (x1.5) que el click
  // normal, para que se note claramente la diferencia entre "todavía es
  // el conteo" y "ya arrancó de verdad".
  osc.frequency.value = (fuerte ? cfg.fFuerte : cfg.fNormal) * (precuenta ? 1.5 : 1);
  gain.gain.setValueAtTime(0.22 * vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.08);
}

// v1.9: acceso rápido — salta directo al inicio de la sección tocada,
// en el reproductor que esté activo en ese momento (YouTube, audio
// original, o archivo local si ya se cargó uno).
// v3.210: (a pedido) "deseleccionar sección" — mismo click que ya
// seekeaba (irASeccionPractica), pero si el bloque/chip clickeado es
// el que YA está resaltado (.activo), en vez de saltar de nuevo al
// mismo lugar (no hace nada perceptible), apaga el resaltado verde y
// el loop de sección, SIN mover el audio. irASeccionPractica queda
// intacta — sigue siendo el único camino real de "saltar".
function onClickBloqueSeccionPractica(uid, segundos){
  const bloque = document.getElementById('mapabloque-' + uid + '-' + segundos);
  const chip = document.getElementById('chip-' + uid + '-' + segundos);
  const yaActivo = (bloque && bloque.classList.contains('activo')) || (chip && chip.classList.contains('activo'));
  if(yaActivo){ desactivarSeccionResaltada(uid, segundos); return; }
  // v3.211: FIX "deseleccionar funcionaba una sola vez" — al apagar el
  // resaltado (desactivarSeccionResaltada) NO se tocaba
  // est.ultimaSeccionChip a propósito (ver comentario ahí), pero eso
  // dejaba a actualizarContadorPractica creyendo que "no cambió de
  // sección" cuando el usuario reactivaba clickeando la MISMA sección
  // de nuevo: nuevoChipKey seguía siendo igual a ultimaSeccionChip, así
  // que el chip/bloque nunca recuperaba la clase .activo hasta que el
  // audio realmente entraba a otra sección. Reseteando acá (justo antes
  // del seek, solo en la rama de reactivación manual) se fuerza a que
  // el próximo tick detecte el "cambio" y vuelva a encender el
  // resaltado de inmediato.
  const est = estadoPractica[uid];
  if(est){ est.ultimaSeccionChip = null; est.seccionDesactivadaSegundos = null; }
  irASeccionPractica(uid, segundos);
}
// v3.210: apaga el resaltado de ESTA sección puntual. No toca
// est.ultimaSeccionChip a propósito: mientras el audio siga dentro de
// la misma sección, actualizarContadorPractica (ver "nuevoChipKey !==
// est.ultimaSeccionChip") no vuelve a tocar estas clases porque no
// detecta cambio de sección — así el apagado se mantiene solo hasta
// que el playback realmente entre a otra sección, momento en el que
// el resaltado automático de siempre vuelve a prender la que
// corresponda, sin que haga falta un flag extra ni limpieza manual.
// v3.212: (a pedido) FIX — esto apagaba el chip/bloque y el contador,
// pero el resaltado DORADO dentro del waveform (dibujarWaveform,
// idxSeccionActiva) es un dibujo aparte que se recalcula cada frame
// solo mirando tiempoActual — no sabía nada de la clase .activo, así
// que la franja de la sección seguía pintada en el canvas. Se guarda
// est.seccionDesactivadaSegundos para que dibujarWaveform la salte, y
// se fuerza un redibujo ahora mismo para que el apagado se vea al
// toque (antes dependía del próximo tick de reproducción).
function desactivarSeccionResaltada(uid, segundos){
  const est = estadoPractica[uid];
  if(!est) return;
  if(est.loopSeccionActivo) toggleLoopSeccionPractica(uid);
  const bloque = document.getElementById('mapabloque-' + uid + '-' + segundos);
  if(bloque) bloque.classList.remove('activo');
  const chip = document.getElementById('chip-' + uid + '-' + segundos);
  if(chip) chip.classList.remove('activo');
  const elSeccion = document.getElementById('seccion-' + uid);
  if(elSeccion) elSeccion.innerHTML = '—';
  est.seccionDesactivadaSegundos = segundos;
  if(est.getTiempoActual) dibujarWaveform(uid, est.getTiempoActual());
}
function irASeccionPractica(uid, segundos){
  const est = estadoPractica[uid];
  if(!est) return;
  // v3.50: (a pedido) guia-practica.html calcula 'segundos' solo con el
  // offset OFICIAL (Firebase) — no conoce offsetLocalDelta (la
  // calibración fina por archivo/dispositivo, panel dorado). Si acá
  // hay un offsetLocalDelta distinto de 0, hay que sumarlo para que el
  // salto caiga en el mismo punto real que ya usa el resto de la app
  // (metrónomo, click, contador — todos restan offset+offsetLocalDelta).
  // Sin esto, el contador mostraba un compás distinto al configurado en
  // Secciones apenas se tocaba el chip.
  // v3.180: (a pedido) FIX — esa suma solo aplica a secciones del TEMA
  // (est.secciones, en segundos "crudos" contra el offset oficial). Las
  // secciones LOCALES (est.seccionesLocales, v3.174) se crean con
  // est.getTiempoActual() — ya son tiempo REAL del archivo, sumarles
  // offsetLocalDelta de nuevo las corría del punto correcto (el salto
  // no caía al inicio real de la sección, que era justo lo que se
  // pedía acá). Con archivo local cargado, seccionesRuntimeDe siempre
  // devuelve las locales (nunca las del tema), así que alcanza con
  // mirar est.archivoLocalUrl para decidir cuál es el caso.
  const segundosReal = est.archivoLocalUrl ? segundos : segundos + (est.offsetLocalDelta || 0);
  est.seek(segundosReal);
  // v3.47: (a pedido) el margen de tolerancia de v3.42 (para el
  // desfasaje de precisión del seek en archivo local) se estaba
  // aplicando SIEMPRE, incluso durante reproducción normal en curso —
  // eso hacía que cualquier sección "encendiera" 0.25s antes de su
  // límite real. Ahora el margen solo se activa por un instante justo
  // después de un salto manual de sección (acá), cubriendo el evento
  // 'seeked' que llega con el tiempo real (posiblemente impreciso), y
  // se apaga solo después de 800ms — la reproducción normal ya no lo
  // usa, así que el límite vuelve a ser exacto.
  // (seekManualObjetivo sigue guardando el segundo CRUDO, sin sumar
  // offsetLocalDelta — es lo que compara actualizarContadorPractica
  // contra sec.desdeSegundos, también crudo, para saber qué sección fue
  // el objetivo del salto reciente.)
  est.seekManualObjetivo = segundos;
  clearTimeout(est.seekManualObjetivoTimeout);
  est.seekManualObjetivoTimeout = setTimeout(() => { est.seekManualObjetivo = null; }, 800);
  // v3.41: (a pedido) si está en pausa, nada dispara el refresco de UI
  // (chip encendido, barra de progreso, waveform) hasta que se le da
  // play — ahora se fuerza ese refresco acá mismo, así el chip prende
  // y el audio-bar se ubica de una vez, esté sonando o no.
  actualizarContadorPractica(uid, segundosReal);
  dibujarWaveform(uid, segundosReal);
}

// (a pedido) loop automático: mientras está activo, cada vez que el
// playback llega al final de la sección actual (mismo límite finSec que
// ya calcula el bloque de progreso más abajo) vuelve al inicio de ESA
// MISMA sección — si el músico avanza a otra sección (chip o seek
// manual), el loop sigue "la sección actual" en cada momento, no queda
// pegado a la que estaba activa cuando se prendió el botón. Se excluye
// con el loop manual (marcarLoopPractica): activar uno apaga el otro.
function toggleLoopSeccionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(!est.loopSeccionActivo && est.loopActivo) marcarLoopPractica(uid);
  est.loopSeccionActivo = !est.loopSeccionActivo;
  // v3.178: (a pedido) pasa de checkbox a botón cuadrado icon-only —
  // ya no hay "checked" que alternar, se usa la misma clase .activo
  // que el resto de los botones cuadrados del panel (ver
  // .practica-click-btn.activo).
  const chk = document.getElementById('loopseccionbtn-' + uid);
  if(chk) chk.classList.toggle('activo', est.loopSeccionActivo);
  // v3.29: al apagar, borra la franja del waveform que este loop venía
  // dibujando (loopInicio/loopFin se van seteando solo mientras está
  // activo, ver actualizarContadorPractica). Al encender no hace falta
  // nada acá — se setean solos en el próximo tick.
  if(!est.loopSeccionActivo){
    est.loopInicio = null; est.loopFin = null;
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
  }
}

// v3.84: (a pedido, Fase 3) muestra/oculta el panel de cifrado/letra de
// la sección activa — el botón solo aparece (display, ver
// actualizarContadorPractica) cuando la sección tiene datos de cifrado.
// El contenido del panel se arma/actualiza aparte, en
// actualizarLineaCifradoPractica(); acá solo se abre/cierra, sin
// recalcular nada.
// v3.85: (a pedido) exporta la estructura de ESTA sesión a PDF, mismo
// formato real/latin book (cajas de compás, 4 por línea) que ya arma
// guia-practica.html — mismo código adaptado para leer de `est` (bpm/
// compasesPorBarra/secciones/clave/temaNombre) en vez de los inputs del
// panel de staff. Los datos (acordesPorCompas/letraPorCompas,
// acordesCiclo/letraCiclo) son los mismos que ya carga el staff, sin
// duplicar nada. 100% en el navegador (jsPDF por CDN), sin backend.
// v1.81: (a pedido) amalgama — mismo criterio que beatsPorBarraDeSeccion
// de guia-practica.html: s.compasOverride ("Compás (si cambia acá)")
// ahora se respeta también acá para calcular la duración real de esa
// sección puntual, en vez de asumir siempre el compás general del
// tema (est.compasesPorBarra). Sin override válido, cae al general —
// cero cambio para temas sin amalgama.
// v3.152: (a pedido) nuevo parámetro forzarGeneral — cuando hay un
// compasesOverride de SESIÓN activo (ver compasEfectivoDe), ese valor
// debe mandar SIEMPRE, incluso sobre secciones que ya traen su propio
// compasOverride guardado (ej. un coro en 3/4). Antes, el compás de
// sección siempre ganaba, así que el override de sesión (pensado para
// "archivo local en otro compás") no servía de nada en temas con
// secciones — el click/los puntos volvían al compás de la sección tan
// pronto arrancaba. Sin compasesOverride de sesión (forzarGeneral
// false/undefined) el comportamiento es idéntico al de siempre.
function beatsPorBarraDeSeccionMusico(s, beatsGeneral, forzarGeneral){
  if(forzarGeneral) return beatsGeneral;
  const ov = (s.compasOverride || '').trim();
  if(ov){
    const n = parseInt(ov.split('/')[0], 10);
    if(n > 0) return n;
  }
  return beatsGeneral;
}
// v3.109: (a pedido) misma búsqueda que ya hacía actualizarContadorPractica
// (línea ~3810) para saber en qué sección cae un tiempo dado, extraída
// acá para reusarla en el snap de loops (marcarLoopPractica/
// loopRapidoCompasesPractica) — sin margen (MARGEN_SECCION es un ajuste
// propio del chip/etiqueta en vivo, no aplica al snap de un loop).
// v3.111: seccionEnSegundoMusico() (v3.109) se retira acá — quedó sin
// uso: los loops ya pasan a usar recorrerTramosMusico/tramoMusicoEnSegundo
// de abajo, que hacen lo mismo y además anclan correctamente contra el
// inicio del tramo (ver comentario en marcarLoopPractica).
// v3.111: (a pedido) constructor único de tramos — fusiona y reemplaza
// tramosClickMusico/tramoClickEnSegundo (v3.110) y el uso suelto de
// seccionEnSegundoMusico en los loops (v3.109). Mismo criterio que
// recorrerTramos()/compasDeSegundos() de guia-practica.html, ahora con
// compasInicio ACUMULADO — necesario para el contador en vivo y el
// rango "Compás X-Y" de la etiqueta de sección, que necesitan la
// numeración ABSOLUTA de compás (no solo saber el compás/beats del
// tramo actual, que era lo único que necesitaba el click en v3.110).
// Un solo lugar con el criterio: contador, puntos (sin clave), loops y
// click ahora comparten el mismo modelo de tramos.
function recorrerTramosMusico(secciones, offset, bpm, beatsGeneral, forzarGeneral, factorGeneral){
  // v3.205: (a pedido) factorGeneral (4/denominador del compás general
  // del tema) se suma como parámetro nuevo AL FINAL — cualquier llamada
  // vieja que no lo pase cae en `undefined`, y factorCompasDeSeccion ya
  // resuelve ese caso devolviendo 1 (mismo comportamiento de siempre).
  const fg = factorGeneral || 1;
  const secs = (secciones || []).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const tramos = [];
  let inicioSeg = offset;
  let compasAcumulado = 1;
  const primerInicio = secs.length ? Math.max(secs[0].desdeSegundos || 0, offset) : Infinity;
  if(!secs.length || primerInicio > offset){
    const beats = beatsGeneral;
    const factor = fg;
    const secPerBar = bpm ? (60 / bpm) * beats * factor : 0;
    const finSeg = secs.length ? primerInicio : Infinity;
    tramos.push({ inicioSeg, finSeg, beats, factor, secPerBar, compasInicio: compasAcumulado, claveSeccion: null });
    if(secPerBar && finSeg !== Infinity) compasAcumulado += Math.round((finSeg - inicioSeg) / secPerBar);
    inicioSeg = finSeg;
  }
  secs.forEach((s, idx) => {
    const desde = Math.max(s.desdeSegundos || 0, inicioSeg);
    const siguienteInicio = (idx + 1 < secs.length) ? secs[idx + 1].desdeSegundos : null;
    const finSeg = (siguienteInicio != null) ? siguienteInicio : ((s.hastaSegundos != null) ? s.hastaSegundos : Infinity);
    const beats = beatsPorBarraDeSeccionMusico(s, beatsGeneral, forzarGeneral);
    const factor = factorCompasDeSeccion(s, fg, forzarGeneral);
    const secPerBar = bpm ? (60 / bpm) * beats * factor : 0;
    tramos.push({ inicioSeg: desde, finSeg, beats, factor, secPerBar, compasInicio: compasAcumulado, claveSeccion: s.claveSeccion || null });
    if(secPerBar && finSeg !== Infinity) compasAcumulado += Math.round((finSeg - desde) / secPerBar);
    inicioSeg = finSeg;
  });
  return tramos;
}
function tramoMusicoEnSegundo(tramos, seg){
  let actual = tramos[0];
  tramos.forEach(t => { if((seg || 0) >= t.inicioSeg) actual = t; });
  return actual;
}
function compasDeSegundosMusico(tramos, seg){
  const t = tramoMusicoEnSegundo(tramos, seg);
  if(!t || !t.secPerBar) return 1;
  return Math.max(1, t.compasInicio + Math.round(((seg || 0) - t.inicioSeg) / t.secPerBar));
}
// v3.110 tenía acá tramosClickMusico()/tramoClickEnSegundo(), una
// versión simplificada (sin compasInicio) usada solo por el click.
// v3.111 los retira: recorrerTramosMusico()/tramoMusicoEnSegundo() de
// arriba hacen exactamente lo mismo (y más), así que el scheduler
// pasa a usar esos — un solo constructor de tramos para todo el
// archivo (contador, puntos, loops y click).
function exportarEstructuraPracticaPDF(uid){
  const est = estadoPractica[uid];
  if(!est){ return; }
  const seccionesFuente = seccionesRuntimeDe(est);
  if(!seccionesFuente || !seccionesFuente.length){ mostrarToast('Este tema no tiene secciones cargadas todavía.', 'info'); return; }

  // v3.100: mismo cálculo de duración que ya usaba este archivo (secPerBar
  // a partir de bpm/compasesPorBarra, fin = hastaSegundos manual o el
  // desdeSegundos de la próxima sección) — es lo único que de verdad
  // difiere de guia-practica.html (que usa duracionCompasesSeccion, basado
  // solo en hastaSegundos manual, sin caer a la próxima sección). El
  // dibujo (dibujarCajas/dibujarCajaBreak/letra de ensayo/D.C./coda/barra
  // de repetición) vive en pdf-estructura.js, compartido con el staff.
  // v1.81: secPerBar general ya no se usa acá directo — se mueve DENTRO
  // del .map() de abajo (secPerBarSeccion), por sección, para respetar
  // compasOverride.
  const claveTxt = est.clave ? (CLAVE_ETIQUETAS[est.clave] || est.clave) : null;

  const secciones = seccionesFuente.slice().sort((a, b) => (a.desdeSegundos || 0) - (b.desdeSegundos || 0));
  const seccionesParaPDF = secciones.map((s, i) => {
    // v3.103: (a pedido) FIX — antes las secciones Vamp (Solo/Coro)
    // quedaban con duracion=null a propósito, porque la versión vieja de
    // pdf-estructura.js no la necesitaba (usaba cicloCompases para la
    // grilla). Desde pdf-estructura.js v1.46 el contador global de
    // compases (#N, título "· N comp.", "se repite xN", resumen
    // "c.#X-c.#Y") SÍ necesita duracion también en los Vamp — al llegar
    // null, el contador se apagaba apenas pasaba la 1ra sección Vamp y
    // todo lo que venía después se quedaba sin numerar. Ahora se calcula
    // igual para todos los tipos, misma fórmula de siempre (por tiempo
    // real: hastaSegundos manual, o si no hay, el desdeSegundos de la
    // sección siguiente).
    // v1.81: (a pedido) secPerBar ahora es POR SECCIÓN (respeta
    // s.compasOverride), no el fijo de arriba — mismo `secPerBar`
    // general de siempre cuando la sección no tiene override.
    const secPerBarSeccion = est.bpm ? (60 / est.bpm) * beatsPorBarraDeSeccionMusico(s, compasEfectivoDe(est)) : 0;
    const siguiente = secciones[i+1] || null;
    const finSec = (s.hastaSegundos != null) ? s.hastaSegundos : (siguiente ? siguiente.desdeSegundos : null);
    const duracion = (secPerBarSeccion > 0 && finSec != null) ? Math.max(1, Math.round((finSec - (s.desdeSegundos||0)) / secPerBarSeccion)) : null;
    return Object.assign({}, s, {
      duracion: duracion,
      color: colorDeSeccionEnLista(secciones, i)
    });
  });

  generarEstructuraPDF({
    temaNombre: est.temaNombre || 'Tema',
    bpm: est.bpm || '—',
    compasTexto: est.compasTexto || '4/4',
    claveTxt: claveTxt,
    secciones: seccionesParaPDF
  });
}

// v3.107: (a pedido) "PDF Percusión" — mismo armado de datos que
// exportarEstructuraPracticaPDF de arriba (mismo `secciones`, mismo
// `duracion`/`color` ya resueltos, incluido el FIX v3.103 de duracion
// en Vamp y el v1.81 de compasOverride por sección), pero llama a
// generarEstructuraPDFPercusion (pdf-percusion.js) en vez de
// generarEstructuraPDF (pdf-armonias.js). Los campos propios de
// percusión (esCampana, instrumentosPercusion, acentosPorCompas,
// notasPercusionPorCompas) ya vienen dentro de `s` desde Firestore
// (se cargan en guia-practica.html) — Object.assign los copia tal cual,
// no hace falta leerlos acá. Cero cambios en exportarEstructuraPracticaPDF.
function exportarEstructuraPracticaPDFPercusion(uid){
  const est = estadoPractica[uid];
  if(!est){ return; }
  const seccionesFuente = seccionesRuntimeDe(est);
  if(!seccionesFuente || !seccionesFuente.length){ mostrarToast('Este tema no tiene secciones cargadas todavía.', 'info'); return; }

  // v1.81: secPerBar general ya no se usa directo — se mueve dentro del
  // .map() (secPerBarSeccion), mismo criterio que exportarEstructuraPracticaPDF.
  const claveTxt = est.clave ? (CLAVE_ETIQUETAS[est.clave] || est.clave) : null;

  const secciones = seccionesFuente.slice().sort((a, b) => (a.desdeSegundos || 0) - (b.desdeSegundos || 0));
  const seccionesParaPDF = secciones.map((s, i) => {
    const secPerBarSeccion = est.bpm ? (60 / est.bpm) * beatsPorBarraDeSeccionMusico(s, compasEfectivoDe(est)) : 0;
    const siguiente = secciones[i+1] || null;
    const finSec = (s.hastaSegundos != null) ? s.hastaSegundos : (siguiente ? siguiente.desdeSegundos : null);
    const duracion = (secPerBarSeccion > 0 && finSec != null) ? Math.max(1, Math.round((finSec - (s.desdeSegundos||0)) / secPerBarSeccion)) : null;
    return Object.assign({}, s, {
      duracion: duracion,
      color: colorDeSeccionEnLista(secciones, i)
    });
  });

  generarEstructuraPDFPercusion({
    temaNombre: est.temaNombre || 'Tema',
    bpm: est.bpm || '—',
    compasTexto: est.compasTexto || '4/4',
    claveTxt: claveTxt,
    secciones: seccionesParaPDF
  });
}

function toggleClickPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.clickActivo = !est.clickActivo;
  est.ultimoBeatClick = -1;
  est.ultimoOnsetClave = -Infinity;
  const btn = document.getElementById('clickbtn-' + uid);
  if(btn){
    btn.innerHTML = HTML_BOTON_METRO;
    btn.classList.toggle('activo', est.clickActivo);
  }
  guardarAjustesPractica(uid);
}

// v3.71: (a pedido) botón propio para el sonido de la clave —
// independiente del click general (clickActivo). Antes la clave sonaba
// siempre que clickActivo estuviera prendido y hubiera clave activa,
// sin forma de silenciarla por separado (por ej. para escuchar solo el
// pulso, o solo la clave). El flash visual de la × NO se apaga con
// esto — solo el sonido — así el seguimiento visual del patrón sigue
// funcionando aunque esté muda.
function toggleClavePractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.claveActiva = est.claveActiva === false ? true : false;
  const btn = document.getElementById('clavebtn-' + uid);
  if(btn){
    // v3.72: (a pedido) antes el estado apagado solo se notaba por
    // opacidad 0.4, poco visible en pantalla chica o con poca luz.
    // Ahora se apoya en la misma clase .activo (fondo/borde/color
    // dorado) que ya usan clickbtn y metrobtn — consistente con el
    // resto de la UI, sin inventar un tratamiento nuevo.
    btn.classList.toggle('activo', est.claveActiva !== false);
  }
  guardarAjustesPractica(uid);
}

// v3.6: persistencia de ajustes de metrónomo en localStorage, por uid
// ('practica-'+id de sesión). Solo lo que ya vivía en memoria en
// estadoPractica[uid] — nunca toca Firestore ni el dato real del
// tema. Si localStorage falla (modo privado, cuota, etc.) se ignora
// en silencio, el metrónomo sigue funcionando solo que sin recordar.
function guardarAjustesPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  try{
    localStorage.setItem('audiolink-ajustes-' + uid, JSON.stringify({
      bpmOverride: est.bpmOverride,
      claveOverride: est.claveOverride,
      tonalidadOverride: est.tonalidadOverride,
      compasesOverride: est.compasesOverride,
      subdivisionOverride: est.subdivisionOverride,
      sonidoClick: est.sonidoClick,
      sonidoClave: est.sonidoClave,
      acentos: est.acentos,
      acentosClave: est.acentosClave,
      volFuerte: est.volFuerte,
      volNormal: est.volNormal,
      clickActivo: est.clickActivo,
      claveActiva: est.claveActiva
    }));
  }catch(e){}
}

// v3.6: se llama al inicializar, antes de recalcularEfectivoPractica,
// para que los overrides restaurados ya entren en el primer cálculo
// de bpm/clave efectivos. Si no hay nada guardado o el JSON es
// inválido, deja los valores por defecto que ya trae estadoPractica[uid]
// intactos.
function cargarAjustesGuardados(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  let guardado;
  try{
    const raw = localStorage.getItem('audiolink-ajustes-' + uid);
    if(!raw) return;
    guardado = JSON.parse(raw);
  }catch(e){ return; }
  if(!guardado || typeof guardado !== 'object') return;
  if(guardado.bpmOverride != null) est.bpmOverride = guardado.bpmOverride;
  if(guardado.claveOverride !== undefined) est.claveOverride = guardado.claveOverride;
  if(guardado.tonalidadOverride !== undefined) est.tonalidadOverride = guardado.tonalidadOverride;
  if(guardado.compasesOverride !== undefined) est.compasesOverride = guardado.compasesOverride;
  if(guardado.subdivisionOverride) est.subdivisionOverride = guardado.subdivisionOverride;
  if(guardado.sonidoClick) est.sonidoClick = guardado.sonidoClick;
  if(guardado.sonidoClave) est.sonidoClave = guardado.sonidoClave;
  if(Array.isArray(guardado.acentos) && guardado.acentos.length === est.acentos.length) est.acentos = guardado.acentos;
  if(Array.isArray(guardado.acentosClave) && guardado.acentosClave.length === est.acentosClave.length) est.acentosClave = guardado.acentosClave;
  if(typeof guardado.volFuerte === 'number') est.volFuerte = guardado.volFuerte;
  if(typeof guardado.volNormal === 'number') est.volNormal = guardado.volNormal;
  if(typeof guardado.clickActivo === 'boolean') est.clickActivo = guardado.clickActivo;
  if(typeof guardado.claveActiva === 'boolean') est.claveActiva = guardado.claveActiva;
}

// v3.192: (a pedido) ¿este tema tiene ajustes de sesión guardados en
// ESTE dispositivo? Mismo criterio que ya usa recalcularEfectivoPractica
// para mostrar "(ajustado)" en el badge de práctica, pero leído directo
// de localStorage — no requiere que estadoPractica[id] ya exista (la
// card de la grilla no abrió el tema todavía). Solo lectura, nunca
// escribe ni toca Firestore.
// v3.194: FIX — buscaba localStorage['audiolink-ajustes-'+id], pero
// crearEstadoPracticaParaTema arma el uid real como 'practica-'+id
// (ver más abajo), y guardarAjustesPractica/cargarAjustesGuardados
// SIEMPRE guardan bajo ese uid completo, nunca bajo el id pelado. Por
// eso el ícono 🔧 nunca aparecía: la clave que se buscaba no existía.
// v3.196: (a pedido) restablecer los ajustes de sesión DESDE la card,
// sin tener que entrar a practicar. A diferencia de
// restablecerAjustesPractica(uid), esta no requiere que
// estadoPractica[uid] exista (el tema puede no estar abierto en esta
// sesión de la página): borra directo la clave de localStorage y
// vuelve a renderizar la grilla para que el 🔧 desaparezca al toque.
// Si el tema SÍ está abierto en esta sesión (estadoPractica ya
// cargado), además limpia el estado en memoria para que quede
// coherente si el usuario entra a practicar después sin recargar.
function restablecerAjustesSesionDesdeCard(id, nombreTema){
  pedirConfirmacion({
    titulo: 'Restablecer ajustes de sesión',
    mensaje: `Se va a borrar el tempo/tono/clave/compás ajustados en este dispositivo para "${nombreTema || 'este tema'}", y va a volver a los valores originales del tema. Esto no afecta el tema guardado en la nube.`,
    okTexto: 'Restablecer',
    peligro: false
  }).then(ok => {
    if(!ok) return;
    try{ localStorage.removeItem('audiolink-ajustes-practica-' + id); }catch(e){}
    const uid = 'practica-' + id;
    if(estadoPractica[uid]) restablecerAjustesPractica(uid);
    filtrarYRenderizarTemas();
  });
}
function temaTieneAjustesSesion(id){
  let guardado;
  try{
    const raw = localStorage.getItem('audiolink-ajustes-practica-' + id);
    if(!raw) return false;
    guardado = JSON.parse(raw);
  }catch(e){ return false; }
  if(!guardado || typeof guardado !== 'object') return false;
  return (guardado.bpmOverride != null)
    || (guardado.claveOverride !== undefined && guardado.claveOverride !== null)
    || (guardado.tonalidadOverride !== undefined && guardado.tonalidadOverride !== null)
    || (guardado.compasesOverride != null)
    || ((guardado.subdivisionOverride || 1) !== 1);
}

// v3.12: (a pedido) borra del localStorage los ajustes de metrónomo
// (audiolink-ajustes-practica-*) de sesiones que ya no vienen en la
// respuesta actual de Firestore — antes se acumulaban sin límite
// (sesión borrada, o el músico ya no asignado a ella). Solo toca claves
// con ese prefijo exacto, nunca otra cosa del localStorage. Si falla
// (modo privado, etc.) se ignora en silencio, igual que el resto de
// funciones de persistencia de este bloque.
// v3.48: (a pedido) persistencia del pre-conteo (activo + 1/2 compases)
// como preferencia GENERAL del navegador — a diferencia de
// cargarAjustesGuardados (arriba), que es por sesión/tema, esta usa una
// única clave fija en localStorage, así que aplica igual sin importar
// qué tema abras. Se lee al inicializar cada estadoPractica[uid] y se
// escribe cada vez que el músico toca el botón de pre-conteo o elige
// 1/2 compases (ver togglePreconteoPractica / elegirCompasesPreconteoPractica).
const PRECONT_GENERAL_KEY = 'audiolink-preconteo-general';
function cargarPreconteoGeneral(){
  try{
    const raw = localStorage.getItem(PRECONT_GENERAL_KEY);
    if(!raw) return null;
    const g = JSON.parse(raw);
    if(!g || typeof g !== 'object') return null;
    return g;
  }catch(e){ return null; }
}
function guardarPreconteoGeneral(activo, compases){
  try{ localStorage.setItem(PRECONT_GENERAL_KEY, JSON.stringify({ activo, compases })); }catch(e){}
}
// sincroniza los botones (precontbtn- y precont-uid-1/2) con el estado
// actual — se llama al inicializar (con el valor recuperado de
// localStorage) y desde los propios toggles.
function sincronizarUIPreconteo(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const btn = document.getElementById('precontbtn-' + uid);
  if(btn) btn.classList.toggle('activo', est.precontActivo);
  [1,2].forEach(v => {
    const b = document.getElementById('precont-' + uid + '-' + v);
    if(b) b.classList.toggle('activo', v === (est.precontCompases || 1));
  });
}

function recalcularEfectivoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmEf = est.bpmOverride || est.bpm;
  const claveEf = est.claveOverride !== undefined ? est.claveOverride : est.clave;
  // v3.205: (a pedido) mismo FIX de denominador que el resto del motor
  // (factor 1 en /4: sin cambio) — antes este recálculo (se dispara al
  // cambiar bpmOverride/claveOverride) quedaba desalineado del factor
  // ya aplicado en la carga inicial (crearEstadoPracticaParaTema).
  const secPerBeatEf = (60 / bpmEf) * factorCompasGeneralDe(est);
  const secPerBarEf = secPerBeatEf * compasEfectivoDe(est);
  est.bpmEfectivo = bpmEf;
  est.claveEfectiva = claveEf;
  est.claveOnsetsEfectivo = claveEf ? construirOnsetsClave(claveEf, secPerBeatEf, secPerBarEf) : [];
  est.claveCicloSecEfectivo = secPerBarEf * 2;
  est.ultimoOnsetClave = -Infinity;
  est.ultimoCompasClave = -1;
}

// v2.4: reescribe el badge (♩ BPM · compás · clave) con los valores
// EFECTIVOS, agregando "(ajustado)" si hay algún override activo —
// para que el músico nunca confunda un ajuste temporal con el dato
// real cargado por staff.
// v3.133: (a pedido) tonalidad/armadura en el badge — mismo círculo de
// quintas que guia-practica.html (archivos sueltos, sin JS compartido).
// Acá además se dibujan los símbolos como en una partitura (♯/♭
// repetidos según la armadura, y la tonalidad con ♯/♭ en vez de #/b) en
// vez del texto "3 bemoles" que usa el formulario de staff.
const ARMADURA_POR_TONALIDAD = {
  'c':'Ninguna (0 alteraciones)','am':'Ninguna (0 alteraciones)',
  'g':'1 sostenido','em':'1 sostenido',
  'd':'2 sostenidos','bm':'2 sostenidos',
  'a':'3 sostenidos','f#m':'3 sostenidos','gbm':'3 sostenidos',
  'e':'4 sostenidos','c#m':'4 sostenidos','dbm':'4 sostenidos',
  'b':'5 sostenidos','cb':'5 sostenidos','g#m':'5 sostenidos','abm':'5 sostenidos',
  'f#':'6 sostenidos','gb':'6 sostenidos','d#m':'6 sostenidos','ebm':'6 sostenidos',
  'c#':'7 sostenidos','db':'5 bemoles','a#m':'7 sostenidos','bbm':'5 bemoles',
  'f':'1 bemol','dm':'1 bemol',
  'bb':'2 bemoles','a#':'2 bemoles','gm':'2 bemoles',
  'eb':'3 bemoles','d#':'3 bemoles','cm':'3 bemoles',
  'ab':'4 bemoles','g#':'4 bemoles','fm':'4 bemoles',
};
function armaduraDeTonalidad(tonalidad){
  const t = (tonalidad || '').trim().toLowerCase().replace(/\s+/g, '');
  if(!t) return '';
  return ARMADURA_POR_TONALIDAD[t] || '';
}
// "F#m" -> "F♯m", "Bbm" -> "B♭m" (solo para mostrar, nunca para guardar
// ni para hacer match contra ARMADURA_POR_TONALIDAD, que sigue en #/b).
function formatoTonalidadMusical(tonalidad){
  return (tonalidad || '').replace(/#/g, '♯').replace(/([A-Ga-g])b\b/g, '$1♭');
}
// De "6 sostenidos" / "3 bemoles" / "Ninguna (0 alteraciones)" a "♯♯♯♯♯♯"
// / "♭♭♭" / "" — como se ven las alteraciones en la armadura de un
// pentagrama.
function simbolosDeArmadura(tonalidad){
  const texto = armaduraDeTonalidad(tonalidad);
  const m = texto.match(/^(\d+)\s+(sostenido|bemol)/);
  if(!m) return '';
  return (m[2] === 'sostenido' ? '♯' : '♭').repeat(parseInt(m[1], 10));
}
// v3.193: (a pedido) qué notas llevan esas alteraciones, en el orden
// real en que aparecen en una armadura de pentagrama (círculo de
// quintas) — no alfabético. Ninguna tabla nueva de tonalidades: solo
// lee la cantidad/tipo que ya calcula armaduraDeTonalidad() y recorta
// el orden fijo de siempre (Fa-Do-Sol-Re-La-Mi-Si para sostenidos,
// Si-Mi-La-Re-Sol-Do-Fa para bemoles).
const ORDEN_SOSTENIDOS_ARMADURA = ['F','C','G','D','A','E','B'];
const ORDEN_BEMOLES_ARMADURA = ['B','E','A','D','G','C','F'];
function notasDeArmadura(tonalidad){
  const texto = armaduraDeTonalidad(tonalidad);
  const m = texto.match(/^(\d+)\s+(sostenido|bemol)/);
  if(!m) return '';
  const n = parseInt(m[1], 10);
  const esSostenido = m[2] === 'sostenido';
  const simbolo = esSostenido ? '♯' : '♭';
  const orden = esSostenido ? ORDEN_SOSTENIDOS_ARMADURA : ORDEN_BEMOLES_ARMADURA;
  return orden.slice(0, n).map(nota => nota + simbolo).join(' ');
}

// v3.185: firma normalizada de los overrides de sesión, usada tanto
// para la foto al abrir (crearEstadoPracticaParaTema) como para la
// comparación en cada render del badge (actualizarBadgePractica) —
// un solo lugar, así las dos lecturas nunca pueden desalinearse. Ver
// el comentario FIX dentro de actualizarBadgePractica para el porqué.
function firmaAjustesPractica(est){
  return JSON.stringify({
    bpmOverride: est.bpmOverride ?? null,
    claveOverride: est.claveOverride ?? null,
    tonalidadOverride: est.tonalidadOverride ?? null,
    compasesOverride: est.compasesOverride ?? null,
    subdivisionOverride: est.subdivisionOverride ?? null
  });
}
function actualizarBadgePractica(uid, compas){
  const est = estadoPractica[uid];
  const el = document.getElementById('badge-' + uid);
  if(!est || !el) return;
  const claveLabel = est.claveEfectiva ? CLAVE_ETIQUETAS[est.claveEfectiva] : '';
  // v3.144: (a pedido) tonalidad/armadura mostradas ahora respetan
  // tonalidadOverride (sesión, del tag detectado del archivo local) si
  // existe — mismo patrón que bpmOverride/claveOverride. Nunca toca
  // est.tonalidad (el valor real del tema en Firestore).
  const tonalidadEfectiva = est.tonalidadOverride !== undefined ? est.tonalidadOverride : est.tonalidad;
  // v3.183: ver comentario en crearEstadoPracticaParaTema — "ajustado"
  // ahora significa "distinto de lo que había AL ABRIR esta pantalla"
  // (incluye lo restaurado de una sesión previa), no "distinto del
  // default". Si por algún motivo la foto no existe (no debería pasar),
  // se cae de vuelta al criterio anterior para no romper nada.
  // v3.185 FIX: la foto y esta comparación usaban JSON.stringify()
  // directo sobre el estado — JSON.stringify() BORRA las claves en
  // undefined. claveOverride/tonalidadOverride arrancan en undefined,
  // así que quedaban ausentes en la foto tomada al abrir; pero
  // restablecerAjustesPractica() las deja en null (sí aparecen en el
  // JSON), y compasesOverride/subdivisionOverride tienen el mismo
  // problema. Resultado: después de restablecer, la firma actual ya
  // no coincidía nunca con la foto original y el badge quedaba
  // marcado "(ajustado)" para siempre. firmaAjustesPractica()
  // normaliza undefined→null antes de comparar, en los dos puntos
  // (acá y en crearEstadoPracticaParaTema), así restablecer sí vuelve
  // a dejar la firma idéntica a la de apertura.
  const snapshotActual = firmaAjustesPractica(est);
  const ajustado = est.snapshotAjustesAlAbrir != null
    ? (snapshotActual !== est.snapshotAjustesAlAbrir)
    : (est.bpmOverride != null || est.claveOverride !== undefined || est.tonalidadOverride !== undefined || est.compasesOverride != null || (est.subdivisionOverride || 1) !== 1);
  const simbolos = simbolosDeArmadura(tonalidadEfectiva);
  // v3.193: (a pedido) además de los símbolos repetidos (♭♭♭), mostrar
  // qué notas concretas llevan esa alteración (ej. "Bb Eb Ab") — a
  // pedido, se deja de mostrar el símbolo repetido y se muestran SOLO
  // las notas.
  const notasArmadura = simbolos ? notasDeArmadura(tonalidadEfectiva) : '';
  const tonalidadLabel = tonalidadEfectiva ? `${formatoTonalidadMusical(tonalidadEfectiva)}${notasArmadura ? ` (${notasArmadura})` : ''}` : '';
  // v3.149: (a pedido) compás y clave son info de STAFF (guia-
  // practica.html) sin ningún dato equivalente detectable en un
  // archivo local (no existe tag de compás/clave rítmica) — con
  // archivo local cargado, se ocultan del badge en vez de seguir
  // mostrando el compás/clave del tema viejo. BPM y tonalidad SÍ
  // siguen porque ahora vienen del propio archivo (tag). El
  // metrónomo/click sigue funcionando igual por dentro — esto es
  // solo el texto que se muestra.
  const esLocal = !!est.archivoLocalUrl;
  // v3.166: (a pedido) el compás EFECTIVO (compasEfectivoDe — el que
  // realmente usa el click/metrónomo) ahora se muestra SIEMPRE en el
  // badge, con o sin archivo local. Antes (v3.149) se ocultaba con
  // archivo local por no haber tag de compás detectable — pero eso
  // dejaba al músico sin forma de ver qué compás está sonando sin
  // abrir Ajustes. Con compasesOverride de sesión activo, o con
  // archivo local, se muestra el número de pulsos por compás tal cual
  // ("compás: 6") en vez del texto "X/4" del tema (que asume una
  // figura que no necesariamente es la real). Sin override y con
  // maqueta oficial, sigue mostrándose el texto de siempre — cero
  // cambio visual en el caso de toda la vida. La clave sigue oculta
  // con archivo local, sin cambios (sigue sin tag detectable).
  // v3.169: (a pedido) formato "N/4" en vez de número plano ("4/4" en
  // vez de "4") — se asume denominador de negra (/4), que es el
  // criterio que ya usa el resto del panel (subdivisión es un
  // multiplicador de sesión aparte, no un denominador distinto).
  const efectivo = compasEfectivoDe(est);
  // v3.210: FIX — esLocal (est.archivoLocalUrl) es TRUE en TODO
  // audio de esta app (hasta el que baja de Cloudinary pasa por
  // onArchivoLocalElegido, ver ese comentario), así que esta rama se
  // ejecutaba SIEMPRE, sin importar el override — y el "/4" estaba
  // fijo a fuego, ignorando el denominador real del tema (ej. 5/8
  // mostraba "5/4"). Ahora se usa el denominador real de
  // est.compasTexto (el numerador sí puede cambiar por override de
  // sesión; el denominador del tema no lo toca ningún override
  // existente en el proyecto).
  const denominadorReal = parseInt((est.compasTexto || '4/4').split('/')[1], 10) || 4;
  const compasLabel = (est.compasesOverride != null || esLocal)
    ? `${efectivo}/${denominadorReal}`
    : (compas || '—');
  const partes = [];
  const bpmChip = `<span class="practica-badge practica-badge-bpm">♩ ${est.bpmEfectivo ? formatBpm(est.bpmEfectivo) : '—'} BPM</span>`;
  partes.push(bpmChip);
  partes.push(`<span class="practica-badge practica-badge-sec">${escapeHtml(compasLabel)}</span>`);
  // v3.213: (a pedido) "faltan badges jerarquizados de clave, compás,
  // etc." — cada dato pasa a ser su propio chip .practica-badge-sec en
  // vez de texto unido con " · " dentro de una sola línea plana. El BPM
  // (bpmChip, arriba) queda como protagonista visual porque es el dato
  // que más se consulta en vivo mientras se toca.
  if(claveLabel) partes.push(`<span class="practica-badge practica-badge-sec">${escapeHtml(claveLabel)}</span>`);
  if(tonalidadLabel) partes.push(`<span class="practica-badge practica-badge-sec">${escapeHtml(tonalidadLabel)}</span>`);
  if(ajustado) partes.push('<span class="practica-badge-ajustado">(ajustado)</span>');
  const html = partes.join('');
  el.innerHTML = html;
  // v3.169: (a pedido) mismo contenido también debajito de la tira de
  // puntos (Pulso·Clave) — badge2-${uid}, agregado al HTML pero sin
  // conectar todavía. Se arma una sola vez arriba y se copia acá, así
  // los dos quedan siempre sincronizados sin duplicar la lógica.
  const el2 = document.getElementById('badge2-' + uid);
  if(el2) el2.innerHTML = html;
}

// v2.4: sincroniza el panel (valor de BPM, select de clave, chip de
// sonido, botones de acento) con el estado actual — se llama al
// inicializar y desde restablecerAjustesPractica().
function actualizarUIAjustesPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  actualizarResumenCompasSubdivPractica(uid);
  const bpmVal = document.getElementById('bpmval-' + uid);
  if(bpmVal) bpmVal.textContent = est.bpmEfectivo ? formatBpm(est.bpmEfectivo) : est.bpmEfectivo;
  const select = document.getElementById('claveselect-' + uid);
  if(select) select.value = est.claveEfectiva || '';
  const turno = document.getElementById('claveturno-' + uid);
  if(turno) turno.style.display = est.claveEfectiva ? '' : 'none';
  const figurasEl = document.getElementById('clavefiguras-' + uid);
  if(figurasEl){
    figurasEl.style.display = est.claveEfectiva ? '' : 'none';
    if(est.claveEfectiva && est.claveEfectiva !== est.ultimaClaveFigurasRenderizada){
      figurasEl.innerHTML = claveFigurasHtml(uid, est.claveEfectiva, compasEfectivoDe(est));
      est.ultimaClaveFigurasRenderizada = est.claveEfectiva;
    }
  }
  const claveLabelEl = document.getElementById('clavelabel-' + uid);
  if(claveLabelEl) claveLabelEl.style.display = est.claveEfectiva ? '' : 'none';
  // v3.77: (a pedido) la etiqueta de la sección de Pulso ("Pulso ·
  // Clave (tipo)") solo se fijaba una vez, al armar el HTML inicial —
  // si la clave cambiaba después desde el select de Ajustes, el texto
  // quedaba desactualizado (o directamente ausente, si no había clave
  // al cargar la página). Ahora se recalcula acá cada vez.
  const pulsoLabelEl = document.getElementById('pulsolabel-' + uid);
  if(pulsoLabelEl){
    const tipoClave = est.claveEfectiva ? (CLAVE_ETIQUETAS[est.claveEfectiva] || '') : '';
    pulsoLabelEl.textContent = 'Pulso' + (tipoClave ? ' · Clave (' + tipoClave + ')' : '');
  }
  // v3.61: re-renderiza la tira unificada cuando cambia la clave
  // efectiva (mismo criterio de "solo si cambió" que figurasEl arriba,
  // con su propio flag para no interferir con ultimaClaveFigurasRenderizada).
  const pcuStripEl = document.getElementById('pcu-strip-' + uid);
  if(pcuStripEl && est.claveEfectiva !== est.ultimaClaveUnificadaRenderizada){
    pcuStripEl.outerHTML = pulsoClaveUnificadoHtml(uid, compasEfectivoDe(est), est.claveEfectiva);
    est.ultimaClaveUnificadaRenderizada = est.claveEfectiva;
    est.ultimoTiempoPcu = undefined;
    // v3.114: el DOM se acaba de reemplazar entero (vuelve a nacer con
    // la plantilla "home" activa) — se resetea también para que el
    // próximo tick de actualizarContadorPractica no asuma que ya
    // estábamos en esa plantilla y se salte la sincronización.
    est.ultimoBeatsPcu = undefined;
    // v3.69: la tira se acaba de reemplazar — sincronizamos marcadores.
    requestAnimationFrame(() => sincronizarNotasClavePulso(uid));
  }
  const clickBtn = document.getElementById('clickbtn-' + uid);
  if(clickBtn){
    clickBtn.innerHTML = HTML_BOTON_METRO;
    clickBtn.classList.toggle('activo', est.clickActivo);
  }
  const claveBtn = document.getElementById('clavebtn-' + uid);
  if(claveBtn){
    // v3.117: (a pedido) el botón se ocultaba por completo sin clave
    // GENERAL, aunque alguna sección tuviera su propia claveSeccion —
    // ahí no había forma de apagarla/prenderla. Ahora también se
    // muestra si tieneClaveSeccionAlguna (flag ya calculado al cargar
    // el tema, ver ~6230).
    claveBtn.style.display = (est.claveEfectiva || est.tieneClaveSeccionAlguna) ? '' : 'none';
    claveBtn.classList.toggle('activo', est.claveActiva !== false);
  }
  ['clasico', 'grave', 'woodblock', 'claveorganica'].forEach(s => {
    const chip = document.getElementById('sonido-' + uid + '-' + s);
    if(chip) chip.classList.toggle('activo', (est.sonidoClick || 'clasico') === s);
  });
  // v3.75: (a pedido) fila y chips del sonido de la clave, sonido
  // independiente del click — solo se muestra si hay clave configurada
  // (mismo criterio que claveturno/clavefiguras/claveBtn de arriba).
  const sonidoClaveFilaEl = document.getElementById('sonidoclavefila-' + uid);
  if(sonidoClaveFilaEl) sonidoClaveFilaEl.style.display = est.claveEfectiva ? '' : 'none';
  ['clasico', 'grave', 'woodblock', 'claveorganica'].forEach(s => {
    const chip = document.getElementById('sonidoclave-' + uid + '-' + s);
    if(chip) chip.classList.toggle('activo', (est.sonidoClave || 'clasico') === s);
  });
  (est.acentos || []).forEach((a, i) => {
    const btn = document.getElementById('acento-' + uid + '-' + i);
    // v3.9: el botón del tiempo 1 (i===0) conserva la clase "beat1"
    // siempre (juega con el verde del semáforo), sin importar si el
    // usuario lo cicló a normal/mudo — className se reescribe entero
    // acá así que hay que volver a agregarla cada vez.
    if(btn) btn.className = 'practica-acento-btn' + (i === 0 ? ' beat1' : '') + (a === 'fuerte' ? ' fuerte' : a === 'mudo' ? ' mudo' : '');
  });
  (est.acentosClave || []).forEach((a, i) => {
    const btn = document.getElementById('acentoclave-' + uid + '-' + i);
    if(btn) btn.className = 'practica-acento-btn' + (a === 'fuerte' ? ' fuerte' : a === 'mudo' ? ' mudo' : '');
  });
  const filaAcentosClave = document.getElementById('filaacentosclave-' + uid);
  if(filaAcentosClave) filaAcentosClave.style.display = est.claveEfectiva ? '' : 'none';
  const bpmRange = document.getElementById('bpmrange-' + uid);
  if(bpmRange) bpmRange.value = est.bpmEfectivo;
  const volFuerte = document.getElementById('volfuerte-' + uid);
  if(volFuerte) volFuerte.value = Math.round((est.volFuerte == null ? 1 : est.volFuerte) * 100);
  const volNormal = document.getElementById('volnormal-' + uid);
  if(volNormal) volNormal.value = Math.round((est.volNormal == null ? 0.55 : est.volNormal) * 100);
  const volFuerteMini = document.getElementById('volfuerte-mini-' + uid);
  if(volFuerteMini) volFuerteMini.value = Math.round((est.volFuerte == null ? 1 : est.volFuerte) * 100);
  const volNormalMini = document.getElementById('volnormal-mini-' + uid);
  if(volNormalMini) volNormalMini.value = Math.round((est.volNormal == null ? 0.55 : est.volNormal) * 100);
}

function toggleAjustesPractica(uid){

function ajustarBpmPractica(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  const base = est.bpmOverride || est.bpm;
  est.bpmOverride = Math.max(30, Math.min(300, base + delta));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
}

// v2.5: slider continuo de BPM — salta directo al valor, mismo
// override en memoria que usan los botones ±5.
function ajustarBpmSliderPractica(uid, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  est.bpmOverride = Math.max(30, Math.min(300, parseInt(valor, 10)));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
}

// v2.5: volumen real (no solo tono) por nivel de acento. El slider

// v2.4: vuelve todo (BPM, clave, sonido, acentos) a los valores reales
// del tema — nunca hubo nada guardado, solo se limpian los overrides
// en memoria.
// v3.150: aplica un compás override de sesión (2-12, límite músical
// razonable — cubre simples, compuestos e impares comunes) — mismo
// patrón que usarBpmDetectadoPractica, pero acá SIEMPRE es manual (no
// hay forma de detectar el compás de un tag de audio). Regenera
// acentos (se resetea el patrón, no tiene sentido conservarlo si
// cambia la cantidad de tiempos) y fuerza el re-render de la tira de
// pulso/clave y de las figuras, invalidando los flags de "ya
// renderizado" que usa actualizarUIAjustesPractica — mismo mecanismo
// que ya dispara un cambio de clave, solo que forzado acá también por
// compás.
function cambiarCompasOverridePractica(uid, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  const parsed = Math.round(parseFloat(valor));
  const n = Math.max(2, Math.min(12, isFinite(parsed) ? parsed : est.compasesPorBarra));
  est.compasesOverride = (n === est.compasesPorBarra) ? null : n;
  // v3.153: FIX — faltaba este recálculo acá (Restablecer sí lo hacía,
  // este cambio no). Sin él, est.claveCicloSecEfectivo/claveOnsetsEfectivo
  // quedaban con la duración de compás VIEJA hasta la próxima recarga
  // de página, así que el contador grande (que lee tramoActualContador
  // en cada frame) ya mostraba el compás/pulso correcto, pero la tira
  // de puntos de Pulso·Clave (que ancla su ciclo a claveCicloSecEfectivo
  // cuando hay clave activa) seguía reiniciando con el largo de compás
  // anterior — de ahí el punto encendido "adelantado" pese a que el
  // número de arriba ya decía el pulso correcto.
  recalcularEfectivoPractica(uid);
  const efectivo = compasEfectivoDe(est);
  est.acentos = acentosPorDefecto(efectivo);
  const acentosRow = document.getElementById('acentosrow-' + uid);
  if(acentosRow) acentosRow.innerHTML = acentosBtnsHtml(uid, efectivo);
  est.ultimaClaveFigurasRenderizada = undefined;
  est.ultimaClaveUnificadaRenderizada = undefined;
  [2,3,4,5,6,7,8,9,12].forEach(b => {
    const btn = document.getElementById('compaspreset-' + uid + '-' + b);
    if(btn) btn.classList.toggle('activo', b === efectivo);
  });
  const libre = document.getElementById('compaslibre-' + uid);
  if(libre) libre.value = efectivo;
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  if(est.getTiempoActual) dibujarWaveform(uid, est.getTiempoActual());
  guardarAjustesPractica(uid);
}
// v3.152: texto informativo junto a los presets/campo libre de compás
// ("6 ×2 = 12 clicks/compás") — oculto si no hay subdivisión activa
// (×1), para no agregar ruido visual a quien no usa esta función
// nueva. No participa de ningún cálculo, es solo lectura.
function actualizarResumenCompasSubdivPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const el = document.getElementById('resumencompas-' + uid);
  if(!el) return;
  const efectivo = compasEfectivoDe(est);
  const subdiv = subdivisionDe(est);
  if(subdiv === 1){
    el.style.display = 'none';
    el.textContent = '';
  } else {
    el.style.display = '';
    el.textContent = `(${efectivo} ×${subdiv} = ${efectivo * subdiv} clicks/compás)`;
  }
}
// v3.152: (a pedido) subdivisión del click — multiplicador de sesión
// (1/2/4, nunca toca Firestore). A propósito NO toca compasEfectivoDe
// ni est.acentos (que siguen representando los pulsos PRINCIPALES,
// tal cual antes de esta versión) — solo agrega clicks de RELLENO en
// el scheduler de audio (ver bloque nuevo en schedulerTickGlobalPractica)
// entre esos mismos pulsos, sin alterar la duración real del compás
// ni ninguno de los 29 sitios que ya leen compasEfectivoDe(est)
// (waveform, loop, secciones, clave, PDF). Con ×1 (default) el
// comportamiento es idéntico a como era antes de v3.152.
function cambiarSubdivisionPractica(uid, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  const n = [1, 2, 4].includes(valor) ? valor : 1;

  est.schedNextSubIdx = null; // fuerza resync del scheduler de relleno

    const btn = document.getElementById('subdivpreset-' + uid + '-' + s);
    if(btn) btn.classList.toggle('activo', s === n);
  });

  actualizarBadgePractica(uid, est.compasTexto);
  guardarAjustesPractica(uid);
}
function restablecerAjustesPractica(uid){

  // v3.19: waveform — se decodifica el archivo una sola vez acá (no
  // por frame); el redibujado del playhead viaja en el mismo tick()
  // de abajo, que ya corre a 60fps mientras suena.
  est.waveformPeaks = null;
  est.waveformDuracion = 0;
  // v3.37: estado del zoom horizontal — 1x por defecto, autoscroll
  // prendido por defecto (coincide con el checkbox tildado en el HTML).
  est.waveformZoom = 1;
  est.waveformAutoScroll = true;
  const waveWrap = document.getElementById('waveformwrap-' + uid);
  const waveToolbar = document.getElementById('waveformtoolbar-' + uid);
  const cueRow = document.getElementById('cuerow-' + uid);
  if(waveWrap) waveWrap.style.display = 'none';
  if(waveToolbar) waveToolbar.style.display = 'none';
  if(cueRow) cueRow.style.display = 'none';
  // v3.95: nuevo archivo/versión — se limpia el aviso de fallback del
  // anterior hasta saber si este nuevo waveform carga o no.
  mostrarSeekFallbackPractica(uid, false);

  // v3.48: motor nativo (<audio>) — SIEMPRE se deja listo, sea el que
  // se use de entrada (si Web Audio falla) o el que entre al cambiar de
  // velocidad. Comparte tick/listeners genéricos con el motor Web Audio
  // (ver conectarMotorLocalPractica) para no duplicar esa lógica.
  conectarListenersMotorLocalPractica(uid, audioLocal);

  if(est.webAudioPlayerLocal){ est.webAudioPlayerLocal.cerrar(); est.webAudioPlayerLocal = null; }
  const cargandoEl = document.getElementById('playercargando-' + uid);
  const playBtn = document.getElementById('playbtn-' + uid);
  if(cargandoEl) cargandoEl.style.display = 'inline';
  if(playBtn) playBtn.disabled = true;
  // v3.48: por defecto arranca en el motor nativo mientras decodifica —
  // así el waveform/duración ya tienen algo con qué mostrar UI básica,
  // y si la decodificación falla, el músico igual puede reproducir de
  // una (ver comentario "nunca sin poder reproducir" en el catch de abajo).
  conectarMotorLocalPractica(uid, audioLocal);

  decodificarArchivoAudio(files[0]).then(audioBuffer => {
    // si el músico ya cambió de archivo mientras esto corría, este
    // resultado quedó viejo — no lo pisamos sobre el nuevo (mismo
    // criterio que ya usaba prepararWaveformLocal desde v3.19).
    if(est.archivoLocalFile !== files[0]) return;
    prepararWaveformDesdeBuffer(uid, audioBuffer);
    const player = crearWebAudioPlayer();
    player.cargarBuffer(audioBuffer);
    // v3.201: (a pedido) mismo reruteo que el <audio> nativo de arriba
    // — la salida del loop exacto también pasa por los filtros de tono.
    obtenerFiltrosPractica(uid);
    player.conectarSalida(est.filtroHighpass);
    conectarListenersMotorLocalPractica(uid, player);
    est.webAudioPlayerLocal = player;
    // v3.48: si el músico ya había cambiado la velocidad (poco probable
    // en el instante que tarda en decodificar, pero por las dudas) no
    // se pisa el motor nativo que ya esté usando a otra velocidad.
    if((est.velocidadLocal || 1) === 1){
      conectarMotorLocalPractica(uid, player);
    }
  }).catch(err => {
    console.error('No se pudo decodificar el audio para loop exacto/waveform:', err);
    // v3.48/v3.19: si falla (formato no soportado, etc.), el músico
    // sigue teniendo el <audio> nativo de siempre — el loop exacto y el
    // waveform son un plus, nunca un requisito para reproducir.
    mostrarSeekFallbackPractica(uid, true);
  }).finally(() => {
    if(cargandoEl) cargandoEl.style.display = 'none';
    if(playBtn) playBtn.disabled = false;
  });
  // v3.46: ya no son los controles nativos del <audio> — ahora el
  // músico le da play desde el playerbar custom cuando quiera.
}

// v3.48: decodifica un File/Blob completo a AudioBuffer — extraído de
// lo que antes hacía prepararWaveformLocal en soledad, ahora se
// reusa también para armar el motor Web Audio del loop (un solo
// decode, no dos). Cierra el AudioContext temporal usado para decodificar
// apenas termina (no el del player, que vive mientras suena).
async function decodificarArchivoAudio(fileOrBlob){
  const arrayBuffer = await fileOrBlob.arrayBuffer();
  const ctxTmp = new (window.AudioContext || window.webkitAudioContext)();
  try{
    return await ctxTmp.decodeAudioData(arrayBuffer);
  } finally {
    try{ ctxTmp.close(); }catch(e){}
  }
}

// v3.48: conecta est.getTiempoActual/getDuracion/seek/pause/play/
// audioActivo a un motor dado (el <audio> nativo o un
// crearWebAudioPlayer()) — ambos exponen la misma interfaz mínima, así
// que cambiar de uno a otro (ver ajustarVelocidadLocalPractica) es solo
// reasignar estas referencias, sin tocar el resto del código que las usa.
function conectarMotorLocalPractica(uid, motor){
  const est = estadoPractica[uid];
  if(!est) return;
  // v3.58: (a pedido) si ya había un motor conectado antes (cambio de
  // velocidad, paso a loop exacto, cambio de versión de maqueta), se
  // traspasa el volumen/mute que el músico haya dejado en el
  // playerbar — sin esto, cada reconexión interna volvía a 100% y
  // sin silenciar, aunque el slider en pantalla siguiera mostrando
  // otro valor.
  if(est.audioActivo && motor !== est.audioActivo){
    try{
      if(typeof est.audioActivo.volume === 'number') motor.volume = est.audioActivo.volume;
      motor.muted = !!est.audioActivo.muted;
    }catch(e){}
  }
  est.getTiempoActual = () => motor.currentTime;
  est.getDuracion = () => motor.duration || 0;
  est.seek = (t) => { motor.currentTime = t; };
  est.pause = () => motor.pause();
  est.play = () => motor.play();
  est.audioActivo = motor;
}

// v3.48: listeners genéricos (play/pause/ended/seeked) — se enganchan
// una vez por motor (nativo y Web Audio comparten la misma interfaz de
// addEventListener). El tick de rAF lee est.audioActivo/est.getTiempoActual
// de forma DINÁMICA (no captura el motor por closure), así que si el
// motor activo cambia a mitad de una reproducción (cambio de velocidad)
// el tick sigue funcionando sin reiniciar nada.
function conectarListenersMotorLocalPractica(uid, motor){
  const est = estadoPractica[uid];
  if(!est) return;
  const tick = () => {
    const e = estadoPractica[uid];
    if(!e || !e.audioActivo || e.audioActivo.paused) return;
    // v3.214: se resta la latencia de salida real del dispositivo antes
    // de dibujar — el sonido y el click (scheduler) NO se tocan, solo
    // se retrasa lo visual para que calce con el instante en que el
    // sonido realmente llega al oído.
    const tVisual = Math.max(0, e.getTiempoActual() - latenciaSalidaAudioPractica());
    actualizarContadorPractica(uid, tVisual);
    dibujarWaveform(uid, tVisual);
    requestAnimationFrame(tick);
  };
  motor.addEventListener('play', () => { marcarReproduccionActiva(uid); actualizarIconoPlayPractica(uid); requestAnimationFrame(tick); });
  motor.addEventListener('pause', () => actualizarIconoPlayPractica(uid));
  motor.addEventListener('ended', () => actualizarIconoPlayPractica(uid));
  motor.addEventListener('seeked', () => {
    const e = estadoPractica[uid];
    if(!e) return;
    actualizarContadorPractica(uid, e.getTiempoActual());
    dibujarWaveform(uid, e.getTiempoActual());
  });
}

// v3.19/v3.48: extrae los picos de amplitud del waveform desde un
// AudioBuffer ya decodificado (antes decodificaba el archivo de nuevo
// acá mismo; ahora recibe el buffer ya listo, sea del flujo normal o
// de una decodificación de respaldo, para no decodificar dos veces).
// v3.55: (a pedido) extrae el public_id de una URL de Cloudinary para
// mostrarlo como "nombre" del archivo — toma el último segmento de la
// ruta (después de la última "/"), le saca la extensión, y cambia
// guiones bajos/medios por espacios para que se lea más natural. Si
// el preset no usa el nombre real como public_id, esto va a mostrar
// el código aleatorio de siempre (no hay forma de distinguirlo desde
// acá) — es una limitación conocida, no un bug.
function nombrePublicIdDesdeUrl(url){
  if(!url) return '';
  try{
    const sinQuery = url.split('?')[0];
    const partes = sinQuery.split('/');
    let ultimo = partes[partes.length - 1] || '';
    ultimo = ultimo.replace(/\.[a-zA-Z0-9]{2,5}$/, ''); // saca extensión
    ultimo = ultimo.replace(/[_-]+/g, ' ').trim();
    return ultimo;
  }catch(e){ return ''; }
}

// v3.95: (a pedido) el slider playerseek queda oculto por defecto (el
// waveform ya tiene click-to-seek) — esta función lo muestra solo
// cuando el waveform no está disponible (decode falló), como red de
// seguridad para no dejar al músico sin forma de saltar en la pista.
function mostrarSeekFallbackPractica(uid, mostrar){
  const seek = document.getElementById('playerseek-' + uid);
  const aviso = document.getElementById('seekfallbackaviso-' + uid);
  if(seek) seek.style.display = mostrar ? '' : 'none';
  if(aviso) aviso.style.display = mostrar ? '' : 'none';
}

function prepararWaveformDesdeBuffer(uid, audioBuffer){
  const est = estadoPractica[uid];
  if(!est) return;
  const datos = audioBuffer.getChannelData(0);
  // v3.38: (a pedido) más picos (antes 140) para que el waveform se
  // vea nítido incluso zoomeado (v3.37 agregó zoom hasta 8x, y con
  // pocos picos las barras se veían anchas/cuadradas al acercarse).
  // El costo es solo un array de floats en memoria (unos pocos KB);
  // el trabajo pesado (decodificar el archivo entero) ya se hace sí
  // o sí para tener est.waveformDuracion, así que esto no agrega
  // peso de descarga ni tiempo de carga perceptible.
  const NUM_PICOS = 1000;
  const tam = Math.floor(datos.length / NUM_PICOS);
  const picos = [];
  for(let i = 0; i < NUM_PICOS; i++){
    let max = 0;
    const inicio = i * tam;
    for(let j = 0; j < tam; j++){
      const v = Math.abs(datos[inicio + j] || 0);
      if(v > max) max = v;
    }
    picos.push(max);
  }
  const picoGlobal = Math.max(...picos) || 1;
  for(let i = 0; i < picos.length; i++){
    picos[i] = picos[i] / picoGlobal;
  }
  est.waveformPeaks = picos;
  est.waveformDuracion = audioBuffer.duration;
  mostrarSeekFallbackPractica(uid, false);
  const waveWrap = document.getElementById('waveformwrap-' + uid);
  const waveToolbar = document.getElementById('waveformtoolbar-' + uid);
  const cueRow = document.getElementById('cuerow-' + uid);
  if(waveWrap) waveWrap.style.display = 'block';
  if(waveToolbar) waveToolbar.style.display = 'flex';
  if(cueRow) cueRow.style.display = 'flex';
  dibujarWaveform(uid, est.getTiempoActual());
  // v3.193: (a pedido) "en mobile el waveform no ocupa el ancho
  // completo" — dibujarWaveform mide wrapEl.clientWidth UNA vez y fija
  // canvas.style.width a ese valor en px. Si esa primera medición
  // ocurre antes de que el layout final del contenedor esté asentado
  // (ej. el sidebar/topbar de nav.js todavía terminando de montarse),
  // el canvas queda pegado a un ancho viejo. El listener de 'resize'
  // de la ventana (ver más arriba) no cubre este caso porque no hay
  // ningún resize de VENTANA — el contenedor cambia de tamaño solo.
  // ResizeObserver sí detecta cualquier cambio real de tamaño del
  // wrap (layout tardío, rotación, orientación, sidebar) y dispara
  // incluso en el primer layout. Un solo observer por uid (se guarda
  // en est.waveformResizeObserver) para no ir acumulando observers
  // cada vez que se vuelve a cargar un archivo local del mismo tema.
  if(waveWrap && typeof ResizeObserver !== 'undefined'){
    if(est.waveformResizeObserver) est.waveformResizeObserver.disconnect();
    est.waveformResizeObserver = new ResizeObserver(() => {
      if(est.getTiempoActual) dibujarWaveform(uid, est.getTiempoActual());
    });
    est.waveformResizeObserver.observe(waveWrap);
  }
}

// v3.19: (compatibilidad) misma firma de siempre por si algo la sigue
// llamando con un File en vez de un AudioBuffer — decodifica y delega
// en prepararWaveformDesdeBuffer.
async function prepararWaveformLocal(uid, file){
  const est = estadoPractica[uid];
  if(!est) return;
  try{
    const audioBuffer = await decodificarArchivoAudio(file);
    if(est.archivoLocalFile !== file) return;
    prepararWaveformDesdeBuffer(uid, audioBuffer);
  }catch(err){
    console.error('No se pudo generar el waveform:', err);
  }
}

// v3.20: dibuja barras (tocado=lila, resto=gris), ticks de
// compás cada N (N se elige para no saturar ni dejar el waveform
// pelado, ver intervaloCompasesWaveform) y la franja del loop manual
// si hay uno activo. Se llama por frame mientras suena (liviano: ~140
// rects + unas pocas líneas) y también cada vez que cambia offset o
// loop, para que los ticks/la franja queden alineados al instante.
// v3.34: alto de la zona de barras+ticks (fijo) y alto de cada
// carril de etiquetas (se suman abajo, tantos como hagan falta).
const WAVEFORM_ONDA_H = 90;
const WAVEFORM_LANE_H = 20;
const WAVEFORM_MAX_CARRILES = 6;

function dibujarWaveform(uid, tiempoActual){
  const est = estadoPractica[uid];
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(!est || !canvas || !est.waveformPeaks) return;
  const ctxDraw = canvas.getContext('2d');
  // v3.36: (a pedido) antes el canvas dibujaba siempre en una
  // resolución interna fija (700 de ancho) y el navegador la
  // "achicaba" con CSS al ancho real de pantalla (width:100%). En un
  // celular angosto eso comprime todo horizontalmente pero el alto
  // quedaba exacto en px → texto y líneas se veían aplastados/
  // alargados, no uniformes. Ahora se mide el ancho real en pantalla
  // (canvas.clientWidth, en "px CSS") y se usa ESE como sistema de
  // coordenadas para dibujar — más devicePixelRatio, para que el
  // texto salga nítido en pantallas de alta densidad (la mayoría de
  // celulares) en vez de verse borroso.
  const dpr = window.devicePixelRatio || 1;
  // v3.37: (a pedido) zoom horizontal — W ya no es "el ancho visible
  // del canvas" (eso cambia todo el tiempo si el canvas es más ancho
  // que la pantalla y hay scroll), sino el ancho del WRAP (lo que se
  // ve en pantalla, sin scrollear) multiplicado por el nivel de zoom.
  // A zoom 1x esto es exactamente lo mismo que v3.36 (wrap y canvas
  // miden lo mismo). A zoom 2x, 3x, etc. el canvas se dibuja más
  // ancho que la pantalla y el wrap (que tiene overflow-x:auto) deja
  // scrollearlo.
  const wrapEl = document.getElementById('waveformwrap-' + uid);
  const wrapWidth = (wrapEl && wrapEl.clientWidth) || canvas.clientWidth || 700;
  const zoom = est.waveformZoom || 1;
  const W = Math.round(wrapWidth * zoom);
  const dur = est.waveformDuracion || 1;
  const estilos = getComputedStyle(document.documentElement);
  const colorOk = estilos.getPropertyValue('--ok').trim() || '#4caf7d';
  const colorProgreso = '#a78bd6';
  const colorFaint = estilos.getPropertyValue('--faint').trim() || '#5c5a55';
  const colorGold = estilos.getPropertyValue('--gold').trim() || '#c9a24b';

  // v3.27: (a pedido) fx de "encendido" al pasar por un tick/sección —
  // se detecta el cruce comparando el tiempo de este frame contra el
  // del frame anterior (est.waveformTiempoPrevio). Si el salto es
  // grande (seek manual) no se dispara nada, solo en avance normal de
  // reproducción, para no generar flashes falsos al saltar de punto.
  const tPrevFrame = (est.waveformTiempoPrevio != null) ? est.waveformTiempoPrevio : tiempoActual;
  const avanceNormal = tiempoActual > tPrevFrame && (tiempoActual - tPrevFrame) < 1.5;
  const ahora = performance.now();
  const FLASH_MS = 280;

  // v3.34: las secciones (y cuántos carriles de etiquetas hacen
  // falta) se calculan ACÁ, antes de dibujar nada, porque el alto
  // final del canvas depende de eso. La asignación de carril de cada
  // etiqueta se guarda en infoSecciones y se reusa más abajo al
  // dibujar, para no recalcular dos veces con resultados distintos.
  // v3.136: (a pedido) "ocultar etiquetas de estructura" también en el
  // waveform — tratamos las secciones como vacías para TODO lo que se
  // dibuja acá (líneas de inicio/fin de sección, etiquetas de nombre,
  // Y el resaltado dorado de sección activa, que también depende de
  // infoSecciones/idxSeccionActiva más abajo). La franja verde de LOOP
  // y la barra de progreso/playhead son independientes de esto (no
  // usan secciones) y siguen dibujándose igual, como corresponde.
  const secciones = seccionesRuntimeDe(est).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const infoSecciones = []; // {sec, tSec, sx, color, nombreSec, anchoNombre, carril}
  ctxDraw.font = 'bold 14px monospace'; // tamaño más grande (con flash) para medir con margen de sobra
  // v3.49: (a pedido) offsetEfectivo/bpmParaTicks/secPerBar se movieron
  // acá arriba (antes se calculaban más abajo, junto a los ticks) para
  // poder snapear también la línea de cada sección a la MISMA grilla de
  // los ticks — antes la línea usaba desdeSegundos crudo, así que con
  // cualquier imprecisión de origen (o un offset distinto al que había
  // cuando se autoró la sección en guia-practica.html) se veía corrida
  // del tick real, aunque el loop nativo (est.loopInicio, ver
  // actualizarContadorPractica) ya cerrara bien. Ahora tick y línea de
  // sección usan el mismo cálculo — siempre van a coincidir.
  const offsetEfectivo = (est.offset || 0) + (est.offsetLocalDelta || 0);
  // v3.147: (a pedido, revierte v3.146) bpmParaTicks vuelve a usar
  // bpmEfectivo (con override) — el músico quiere que la regla/loop
  // sigan el BPM REAL del archivo local cargado (detectado por tag),
  // no el guardado en el tema de staff, cuando hay un override activo
  // (botón "Ajustar click a X"). Antes de tocar ese botón, bpmEfectivo
  // === est.bpm, así que no cambia nada hasta que el músico decide
  // aplicar el detectado.
  const bpmParaTicks = est.bpmEfectivo || est.bpm;
  // v3.205: (a pedido) FIX de denominador — mismo factor que el resto
  // del motor (factor 1 en /4: sin cambio para el catálogo existente).
  const secPerBar = (60 / bpmParaTicks) * compasEfectivoDe(est) * factorCompasGeneralDe(est);
  secciones.forEach((sec, i) => {
    const tSecCrudo = sec.desdeSegundos || 0;
    // v3.111: FIX — v3.109 anclaba este snap contra offsetEfectivo (el
    // offset GLOBAL del tema); pero tSecCrudo YA ES el borde real de
    // ESTE tramo (es el propio desdeSegundos de la sección), así que
    // el ancla correcta es él mismo — snapear contra su propio inicio
    // siempre da el mismo valor (sin drift de tramos anteriores con
    // compás distinto). Se deja tSec = tSecCrudo directo: matemáticamente
    // es el mismo resultado que llamar a snapACompasPractica con ese
    // ancla, sin la llamada de más.
    const tSec = tSecCrudo;
    // v3.184: FIX — antes era `tSec <= 0`, así que cualquier sección que
    // arranca justo en el segundo 0 (muy común en ensayo.html: marcar la
    // primera sección con 🎯 apenas arranca la pista) se saltaba entera —
    // sin línea, sin etiqueta, sin resaltado de "sección activa". Con
    // `tSec < 0` esa sección inicial se dibuja igual que cualquier otra;
    // solo se sigue ignorando el caso realmente inválido (tiempo
    // negativo), que no debería poder ocurrir de todos modos.
    if(tSec < 0 || tSec >= dur) return;
    const sx = (tSec / dur) * W;
    const color = colorDeSeccionEnLista(secciones, i);
    const nombreCrudo = String(sec.nombre || '');
    // v3.124: (a pedido) antepone la letra de ensayo (A/B/C…) al nombre
    // en la etiqueta del waveform — mismo dato que ya se ve en el PDF
    // (exportarEstructuraPDF de guia-practica.html), calculado con la
    // función portada arriba. Se resuelve contra est.secciones (orden
    // ORIGINAL, no `secciones` que es la copia de acá ordenada por
    // tiempo — ver comentario largo junto a letraEnsayoSugerida). Si el
    // nombre está vacío, se sigue sin dibujar nada (mismo criterio de
    // siempre, más abajo) — una sección sin nombre no muestra ni letra
    // ni etiqueta.
    const letraSec = nombreCrudo ? letraEnsayoDeSeccion(est.secciones || [], sec) : '';
    const nombreSec = nombreCrudo ? (letraSec ? `${letraSec} · ${nombreCrudo}` : nombreCrudo) : '';
    const anchoNombreSolo = nombreSec ? ctxDraw.measureText(nombreSec).width : 0;
    // v3.105: (a pedido) la nota de sección va PEGADA al lado del
    // nombre, mismo renglón (como en el PDF) — se dejó de usar un
    // carril propio por debajo (v3.104). Truncada corta (16 car. + "…",
    // contra los 70 del PDF) y con fuente más chica/tenue para que siga
    // siendo claramente secundaria frente al nombre. anchoNombre pasa a
    // ser el ancho TOTAL (nombre + separador + nota) — así el cálculo de
    // carril de más abajo (que no cambió) sigue evitando choques sin
    // agregar lógica nueva: una sección vecina larga se corre sola igual
    // que antes, ahora contemplando también el espacio que ocupa la nota.
    const notaCruda = (sec.notaSeccion || '').trim();
    const notaSec = notaCruda.length > 16 ? notaCruda.slice(0, 16) + '…' : notaCruda;
    ctxDraw.font = 'italic 11px monospace';
    const anchoNota = notaSec ? ctxDraw.measureText(notaSec).width : 0;
    ctxDraw.font = 'bold 14px monospace'; // vuelve al tamaño de medición del nombre
    const SEP_NOTA = 6;
    const anchoNombre = anchoNombreSolo + (notaSec ? SEP_NOTA + anchoNota : 0);
    infoSecciones.push({ sec, tSec, sx, color, nombreSec, anchoNombre, anchoNombreSolo, notaSec });
  });
  // asigna carril (0 = pegado a la onda, va creciendo hacia abajo):
  // primer carril libre donde la etiqueta no choca con la anterior de
  // ese carril; si los WAVEFORM_MAX_CARRILES están ocupados, usa el
  // que deje pasar antes (el que menos se superpone), para no perder
  // etiquetas aunque queden encimadas en un caso extremo.
  const GAP_ETIQUETAS = 4;
  const carrilesFinX = new Array(WAVEFORM_MAX_CARRILES).fill(-Infinity);
  let carrilMaxUsado = 0;
  infoSecciones.forEach(info => {
    if(!info.nombreSec){ info.carril = 0; return; }
    const labelX = info.sx + 1;
    let elegido = -1;
    for(let c = 0; c < WAVEFORM_MAX_CARRILES; c++){
      if(labelX >= carrilesFinX[c] + GAP_ETIQUETAS){ elegido = c; break; }
    }
    if(elegido === -1){
      // ninguno libre: el que menos se superpone (fin más lejano hacia atrás)
      elegido = 0;
      for(let c = 1; c < WAVEFORM_MAX_CARRILES; c++){
        if(carrilesFinX[c] < carrilesFinX[elegido]) elegido = c;
      }
    }
    carrilesFinX[elegido] = labelX + info.anchoNombre + 6;
    info.carril = elegido;
    if(elegido > carrilMaxUsado) carrilMaxUsado = elegido;
  });
  const nCarriles = infoSecciones.some(i => i.nombreSec) ? (carrilMaxUsado + 1) : 0;
  const H = WAVEFORM_ONDA_H + nCarriles * WAVEFORM_LANE_H;
  // v3.36: la resolución física del canvas es (ancho real × dpr) por
  // (alto × dpr) — solo se toca cuando cambió algo (ancho de pantalla,
  // cantidad de carriles, o dpr), para no forzar un reset en cada
  // frame mientras suena. setTransform deja el resto del código de
  // dibujo intacto: sigue trabajando en píxeles "CSS" (W, H) de
  // siempre, sin tener que multiplicar cada coordenada por dpr.
  if(canvas.dataset.cssW != W || canvas.dataset.cssH != H || canvas.dataset.dpr != dpr){
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; // v3.37: explícito (antes width:100% del CSS alcanzaba porque nunca era más ancho que el wrap)
    canvas.style.height = H + 'px';
    canvas.dataset.cssW = W;
    canvas.dataset.cssH = H;
    canvas.dataset.dpr = dpr;
  }
  ctxDraw.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctxDraw.clearRect(0, 0, W, H);

  // v3.51: (a pedido) franja de fondo para la SECCIÓN seleccionada
  // (chip activo) — distinta de la franja del loop de abajo (esa es
  // colorOk/verde; esta es dorada) para poder distinguir "estoy en
  // esta sección" de "el loop está marcado acá", aunque coincidan.
  // Usa el mismo tSec snapeado que ya calcula infoSecciones (misma
  // grilla que ticks y líneas, ver nota v3.49 más arriba) para que el
  // borde de la franja coincida exacto con la línea de la sección.
  let idxSeccionActiva = -1;
  for(let i = 0; i < infoSecciones.length; i++){
    if(tiempoActual >= infoSecciones[i].tSec) idxSeccionActiva = i;
  }
  // v3.212: (a pedido) si el músico deseleccionó a mano esta sección
  // (desactivarSeccionResaltada), no se pinta la franja dorada aunque
  // tiempoActual siga cayendo adentro — se vuelve a pintar sola apenas
  // el playback realmente cruza a otra sección (ver reset de
  // est.seccionDesactivadaSegundos en actualizarContadorPractica).
  const estaDesactivadaManual = idxSeccionActiva !== -1
    && est.seccionDesactivadaSegundos != null
    && Math.abs(infoSecciones[idxSeccionActiva].tSec - est.seccionDesactivadaSegundos) < 0.001;
  if(idxSeccionActiva !== -1 && !estaDesactivadaManual){
    const infoAct = infoSecciones[idxSeccionActiva];
    const finManual = infoAct.sec.hastaSegundos;
    let tFinActiva;
    if(finManual != null){
      // v3.109: beats de la propia sección activa (compasOverride).
      const beatsActiva = beatsPorBarraDeSeccionMusico(infoAct.sec, compasEfectivoDe(est));
      // v3.205: (a pedido) factor de denominador de esta sección (factor
      // 1 en /4: sin cambio).
      const factorActiva = factorCompasDeSeccion(infoAct.sec, factorCompasGeneralDe(est), false);
      // v3.111: FIX — ancla contra infoAct.tSec (el inicio real de ESTE
      // tramo, ya resuelto arriba) en vez de offsetEfectivo (global).
      // Mismo criterio de "reinicio en el borde": finManual snapea a la
      // grilla propia de esta sección, no a la del tema completo.
      tFinActiva = snapACompasPractica(finManual, bpmParaTicks, beatsActiva * factorActiva, infoAct.tSec);
    } else if(infoSecciones[idxSeccionActiva + 1]){
      tFinActiva = infoSecciones[idxSeccionActiva + 1].tSec;
    } else {
      tFinActiva = dur;
    }
    const xA = (infoAct.tSec / dur) * W;
    const xB = (Math.min(tFinActiva, dur) / dur) * W;
    ctxDraw.fillStyle = colorGold + '29';
    ctxDraw.fillRect(xA, 0, Math.max(1, xB - xA), H);
  }

  // franja de loop (si hay uno marcado), detrás de todo lo demás
  if(est.loopInicio != null && est.loopFin != null){
    const x1 = (est.loopInicio / dur) * W;
    const x2 = (est.loopFin / dur) * W;
    ctxDraw.fillStyle = colorOk + '33';
    ctxDraw.fillRect(x1, 0, Math.max(1, x2 - x1), H);
  }

  const picos = est.waveformPeaks;
  // v3.38: (a pedido junto con subir NUM_PICOS a 1000) el gap fijo de
  // 2px entre barras funcionaba con 140 picos, pero con 1000 picos en
  // una pantalla angosta sin zoom el espacio por pico puede ser menor
  // a 2px — daba barras de ancho negativo (no se dibujaban, waveform
  // "vacío"). Ahora el gap es proporcional al espacio disponible por
  // pico (slot), nunca más grande que ese espacio, así bw siempre da
  // positivo. A zoom alto (más espacio por pico) el gap vuelve a
  // acercarse a 2px, como siempre.
  const slot = W / picos.length;
  const gap = Math.min(2, slot * 0.25);
  const bw = Math.max(0.4, slot - gap);
  const progressX = (tiempoActual / dur) * W;
  const ALTO_BARRAS = 0.68; // proporción DENTRO de la zona fija de la onda (WAVEFORM_ONDA_H)
  for(let i = 0; i < picos.length; i++){
    const x = i * slot;
    const h = Math.max(2, picos[i] * WAVEFORM_ONDA_H * ALTO_BARRAS);
    const y = (WAVEFORM_ONDA_H - h) / 2; // centradas dentro de la zona de la onda, nunca invade la zona de etiquetas
    ctxDraw.fillStyle = (x < progressX) ? colorProgreso : colorFaint;
    ctxDraw.fillRect(x, y, bw, h);
  }

  // ticks de compás — usan el mismo offset efectivo que ya calcula el
  // metrónomo (est.offset + est.offsetLocalDelta), así el primer tick
  // cae exacto donde el metrónomo marca el tiempo 1.
  // v3.25 (histórico, superado por v3.204 abajo): pasó de dinámica
  // (intervaloCompasesWaveform, por duración/tempo) a FIJA cada 16
  // siempre. (offsetEfectivo/bpmParaTicks/secPerBar se calculan arriba,
  // junto a infoSecciones — ver nota v3.49 ahí.)
  // v3.204: (a pedido, mobile first) resolución ADAPTATIVA según el
  // espacio real en pantalla — antes era fija (cada=16 siempre, ver
  // historial v3.25). Mismo principio que ya usa v3.38 para el gap
  // del waveform: pixels disponibles (W/dur, afectado por zoom), no
  // duración total del tema. Así una sección corta o una vista con
  // zoom muestra sus propios ticks en vez de saltar directo al
  // próximo múltiplo de 16 — resuelve el caso real detectado (sección
  // de 2 compases sin tick propio del compás 2).
  // Candidatos en escalera (ladder), de más fino a más grueso — se
  // elige el más fino que todavía deje MIN_PX_TICK_PRINCIPAL de
  // separación entre ticks, para que 2-3 dígitos + su caja de fondo no
  // se amontonen en pantallas angostas. En una vista típica de celular
  // sin zoom con un tema completo, esto da el mismo cada=16 de
  // siempre (no cambia el caso ya validado) — solo se achica cuando
  // hay espacio real de sobra (sección corta, zoom, pantalla ancha).
  const pxPorCompas = dur > 0 ? (secPerBar / dur) * W : 0;
  const CANDIDATOS_CADA_TICK = [1, 2, 4, 8, 16, 32, 64, 128, 256];
  const MIN_PX_TICK_PRINCIPAL = 56;
  const MIN_PX_TICK_SECUNDARIO = 32;
  function elegirCadaTick(minPx){
    for(let i = 0; i < CANDIDATOS_CADA_TICK.length; i++){
      if(CANDIDATOS_CADA_TICK[i] * pxPorCompas >= minPx) return CANDIDATOS_CADA_TICK[i];
    }
    return CANDIDATOS_CADA_TICK[CANDIDATOS_CADA_TICK.length - 1];
  }
  const cada = elegirCadaTick(MIN_PX_TICK_PRINCIPAL);
  const compasDur = secPerBar * cada;
  const colorFondoTick = estilos.getPropertyValue('--bg').trim() || '#0b0b0d';
  ctxDraw.textAlign = 'center';
  let compasNum = cada + 1;
  // v3.202: (a pedido) el compás 1 (offsetEfectivo, arranque real del
  // tema) no tenía tick/número/hora — el bucle de abajo arranca recién
  // en offsetEfectivo+compasDur. Se agrega acá el mismo dibujo (tick,
  // número, mm:ss), mismo estilo y mismo criterio de "encendido" que
  // el resto de esta regla, sin tocar el bucle existente.
  if(offsetEfectivo >= 0 && offsetEfectivo < dur){
    const t0 = offsetEfectivo;
    const tx0 = (t0 / dur) * W;
    if(avanceNormal && tPrevFrame < t0 && tiempoActual >= t0){
      est.waveformFlashTick = t0;
      est.waveformFlashTickHasta = ahora + FLASH_MS;
    }
    const encendido0 = est.waveformFlashTick != null && Math.abs(est.waveformFlashTick - t0) < 0.001
      && est.waveformFlashTickHasta && ahora < est.waveformFlashTickHasta;
    if(encendido0){
      ctxDraw.shadowColor = colorGold;
      ctxDraw.shadowBlur = 10;
      ctxDraw.strokeStyle = '#fff4d6';
      ctxDraw.lineWidth = 2.5;
    }else{
      ctxDraw.shadowBlur = 0;
      ctxDraw.strokeStyle = colorGold;
      ctxDraw.lineWidth = 1;
    }
    ctxDraw.beginPath();
    ctxDraw.moveTo(tx0, 14);
    ctxDraw.lineTo(tx0, H);
    ctxDraw.stroke();
    ctxDraw.shadowBlur = 0;
    ctxDraw.font = encendido0 ? 'bold 14px monospace' : 'bold 13px monospace';
    const textoNum0 = '1';
    const anchoTexto0 = ctxDraw.measureText(textoNum0).width;
    ctxDraw.fillStyle = colorFondoTick;
    ctxDraw.fillRect(tx0 - anchoTexto0 / 2 - 3, 0, anchoTexto0 + 6, 14);
    ctxDraw.fillStyle = encendido0 ? '#fff4d6' : colorGold;
    ctxDraw.fillText(textoNum0, tx0, 11);
    const mmP0 = Math.floor(t0 / 60);
    const ssP0 = String(Math.floor(t0 % 60)).padStart(2, '0');
    const textoTiempoP0 = `${mmP0}:${ssP0}`;
    ctxDraw.font = encendido0 ? 'bold 12px monospace' : '11px monospace';
    const anchoTiempoP0 = ctxDraw.measureText(textoTiempoP0).width;
    const yTiempoP0 = WAVEFORM_ONDA_H - 4;
    ctxDraw.fillStyle = colorFondoTick;
    ctxDraw.fillRect(tx0 - anchoTiempoP0 / 2 - 2, yTiempoP0 - 9, anchoTiempoP0 + 4, 11);
    ctxDraw.fillStyle = encendido0 ? '#fff4d6' : colorGold;
    ctxDraw.fillText(textoTiempoP0, tx0, yTiempoP0);
  }
  for(let t = offsetEfectivo + compasDur; t < dur; t += compasDur){
    const tx = (t / dur) * W;
    // ¿este tick se acaba de cruzar en este frame?
    if(avanceNormal && tPrevFrame < t && tiempoActual >= t){
      est.waveformFlashTick = t;
      est.waveformFlashTickHasta = ahora + FLASH_MS;
    }
    const encendido = est.waveformFlashTick != null && Math.abs(est.waveformFlashTick - t) < 0.001
      && est.waveformFlashTickHasta && ahora < est.waveformFlashTickHasta;
    if(encendido){
      ctxDraw.shadowColor = colorGold;
      ctxDraw.shadowBlur = 10;
      ctxDraw.strokeStyle = '#fff4d6';
      ctxDraw.lineWidth = 2.5;
    }else{
      ctxDraw.shadowBlur = 0;
      ctxDraw.strokeStyle = colorGold;
      ctxDraw.lineWidth = 1;
    }
    ctxDraw.beginPath();
    ctxDraw.moveTo(tx, 14);
    ctxDraw.lineTo(tx, H);
    ctxDraw.stroke();
    ctxDraw.shadowBlur = 0;
    ctxDraw.font = encendido ? 'bold 14px monospace' : 'bold 13px monospace';
    const textoNum = String(compasNum);
    const anchoTexto = ctxDraw.measureText(textoNum).width;
    ctxDraw.fillStyle = colorFondoTick;
    ctxDraw.fillRect(tx - anchoTexto / 2 - 3, 0, anchoTexto + 6, 14);
    ctxDraw.fillStyle = encendido ? '#fff4d6' : colorGold;
    ctxDraw.fillText(textoNum, tx, 11);
    // v3.145: (a pedido) la regla de tiempo se movió de "debajo del
    // número de compás" (arriba) a la parte inferior DEL WAVEFORM (el
    // borde de abajo de la zona de la onda, WAVEFORM_ONDA_H) — antes
    // quedaba pegada al compás, ahora es una franja propia abajo,
    // separada. Sigue usando el mismo t del tick, así ambas reglas
    // (compás arriba, tiempo abajo) siguen coincidiendo en X.
    const mmP = Math.floor(t / 60);
    const ssP = String(Math.floor(t % 60)).padStart(2, '0');
    const textoTiempoP = `${mmP}:${ssP}`;
    ctxDraw.font = encendido ? 'bold 12px monospace' : '11px monospace';
    const anchoTiempoP = ctxDraw.measureText(textoTiempoP).width;
    const yTiempoP = WAVEFORM_ONDA_H - 4;
    ctxDraw.fillStyle = colorFondoTick;
    ctxDraw.fillRect(tx - anchoTiempoP / 2 - 2, yTiempoP - 9, anchoTiempoP + 4, 11);
    ctxDraw.fillStyle = encendido ? '#fff4d6' : colorGold;
    ctxDraw.fillText(textoTiempoP, tx, yTiempoP);
    compasNum += cada;
  }

  // v3.143: (a pedido) resolución subida de cada 8 a cada 4 compases —
  // y ahora se ve MÁS tenue que antes (menos alpha, línea más fina,
  // sin caja de fondo detrás del número) a propósito, para que se
  // distinga claramente del principal de 16 aunque haya el doble de
  // ticks que antes. Sigue saltando los múltiplos de 16 (ya dibujados
  // arriba, más marcados) para no superponer líneas.
  // v3.58 (histórico, ya no aplica el "cada 8"): regla secundaria cada
  // 8 compases — menor jerarquía que la principal de 16 (línea fina y
  // tenue, sin el destello dorado de "encendido"). Usa el mismo
  // offsetEfectivo/secPerBar que la de 16, así que ambas grillas
  // siempre coinciden.
  // v3.59 (histórico): el número de estos ticks se veía muy poco
  // (colorFaint, sin caja de fondo, encima de las barras de la onda) —
  // subió a la misma franja superior que los números de 16, con caja
  // de fondo. v3.143 vuelve a sacarle la caja de fondo a propósito
  // (ahora hay el doble de ticks, la caja se sentía muy cargada) pero
  // mantiene el color dorado tenue para que siga siendo legible.
  // v3.204: (a pedido, mobile first) cadaSec ahora se deriva del
  // `cada` principal (adaptativo) en vez de un 4 fijo — sigue siendo
  // 1/4 del principal (mismo criterio visual: secundaria = 1 nivel más
  // fino), pero solo se dibuja si esa subdivisión (cada>=4) todavía
  // deja aire real en pantalla (MIN_PX_TICK_SECUNDARIO); si no hay
  // espacio ni para eso, se salta la secundaria entera (cadaSec=0) en
  // vez de amontonar números chicos ilegibles.
  const cadaSec = (cada >= 4 && (cada / 4) * pxPorCompas >= MIN_PX_TICK_SECUNDARIO) ? cada / 4 : 0;
  const compasDurSec = secPerBar * cadaSec;
  if(compasDurSec > 0){
    ctxDraw.shadowBlur = 0;
    ctxDraw.font = '9px monospace';
    ctxDraw.textAlign = 'center';
    let nSec = cadaSec;
    for(let t = offsetEfectivo + compasDurSec; t < dur; t += compasDurSec){
      if(nSec % cada !== 0){
        const tx = (t / dur) * W;
        // v3.70: el de 16 (arriba) ya detectaba el cruce y hacía
        // destello; este secundario nunca lo tuvo — se agrega el mismo
        // criterio, con su propio flag (waveformFlashTickSec) para no
        // pisar el estado del de 16.
        if(avanceNormal && tPrevFrame < t && tiempoActual >= t){
          est.waveformFlashTickSec = t;
          est.waveformFlashTickSecHasta = ahora + FLASH_MS;
        }
        const encendidoSec = est.waveformFlashTickSec != null && Math.abs(est.waveformFlashTickSec - t) < 0.001
          && est.waveformFlashTickSecHasta && ahora < est.waveformFlashTickSecHasta;
        if(encendidoSec){
          ctxDraw.shadowColor = colorGold;
          ctxDraw.shadowBlur = 8;
          ctxDraw.globalAlpha = 1;
          ctxDraw.strokeStyle = '#fff4d6';
          ctxDraw.lineWidth = 2;
        }else{
          ctxDraw.shadowBlur = 0;
          ctxDraw.globalAlpha = 0.22;
          ctxDraw.strokeStyle = colorGold;
          ctxDraw.lineWidth = 1;
        }
        ctxDraw.beginPath();
        ctxDraw.moveTo(tx, 20);
        ctxDraw.lineTo(tx, H);
        ctxDraw.stroke();
        ctxDraw.shadowBlur = 0;
        const textoSec = String(nSec + 1);
        ctxDraw.globalAlpha = encendidoSec ? 1 : 0.5;
        ctxDraw.fillStyle = encendidoSec ? '#fff4d6' : colorGold;
        ctxDraw.font = encendidoSec ? 'bold 10px monospace' : '9px monospace';
        ctxDraw.fillText(textoSec, tx, 11);
        // v3.145: (a pedido) misma reubicación que la principal — la
        // hora ya no va debajo del número, va en la parte inferior del
        // waveform (borde de WAVEFORM_ONDA_H), sin caja de fondo (se
        // mantiene igual de tenue que se pidió).
        const mmS = Math.floor(t / 60);
        const ssS = String(Math.floor(t % 60)).padStart(2, '0');
        ctxDraw.font = '9px monospace';
        ctxDraw.fillStyle = encendidoSec ? '#fff4d6' : colorGold;
        ctxDraw.fillText(`${mmS}:${ssS}`, tx, WAVEFORM_ONDA_H - 4);
        ctxDraw.globalAlpha = 1;
        ctxDraw.font = '9px monospace';
      }
      nSec += cadaSec;
    }
  }

  // v3.25/v3.31/v3.32/v3.33 (resumen de lo que ya traía esto, sigue
  // igual): marcadores de las secciones de la sesión, con color propio
  // por sección (colorSeccionPorIndice, mismo índice que los chips de
  // arriba del waveform) y detección de "encendido" al cruzar cada una.
  // v3.34: (a pedido) la etiqueta de cada sección YA NO pisa la forma
  // de onda. Antes se apretaban en 2 carriles pegados al fondo del
  // mismo canvas de las barras. Ahora viven en una franja propia,
  // debajo de la zona de la onda (WAVEFORM_ONDA_H), con tantos
  // carriles como hicieron falta (calculados arriba, en infoSecciones,
  // antes de fijar el alto del canvas). La línea vertical de cada
  // sección cruza TODA la altura (onda + franja de etiquetas) para
  // que quede clarísimo a qué línea corresponde cada nombre, sin
  // importar en qué carril terminó cayendo. Sigue en 2 pasadas
  // (líneas primero, etiquetas encima) para que ninguna línea tape un
  // texto, igual que en v3.32.
  ctxDraw.textAlign = 'left';

  // -- pasada 1: líneas (inicio sólida + fin punteada), toda la altura --
  infoSecciones.forEach(info => {
    const { sec, tSec, sx, color } = info;
    if(avanceNormal && tPrevFrame < tSec && tiempoActual >= tSec){
      est.waveformFlashSeccion = tSec;
      est.waveformFlashSeccionHasta = ahora + FLASH_MS;
    }
    const encendida = est.waveformFlashSeccion != null && Math.abs(est.waveformFlashSeccion - tSec) < 0.001
      && est.waveformFlashSeccionHasta && ahora < est.waveformFlashSeccionHasta;
    info.encendida = encendida;
    if(encendida){
      ctxDraw.shadowColor = color;
      ctxDraw.shadowBlur = 12;
      ctxDraw.strokeStyle = colorMezclarBlanco(color, 0.55);
      ctxDraw.lineWidth = 3;
    }else{
      ctxDraw.shadowBlur = 0;
      ctxDraw.strokeStyle = color;
      ctxDraw.lineWidth = 2;
    }
    ctxDraw.beginPath();
    ctxDraw.moveTo(sx, 14);
    ctxDraw.lineTo(sx, H);
    ctxDraw.stroke();
    ctxDraw.shadowBlur = 0;
    // fin manual (hastaSegundos) — línea punteada, mismo color, toda la altura.
    if(sec.hastaSegundos != null && sec.hastaSegundos > 0 && sec.hastaSegundos < dur){
      const sxFin = (sec.hastaSegundos / dur) * W;
      ctxDraw.beginPath();
      ctxDraw.setLineDash([4, 3]);
      ctxDraw.strokeStyle = color;
      ctxDraw.lineWidth = 2;
      ctxDraw.moveTo(sxFin, 14);
      ctxDraw.lineTo(sxFin, H);
      ctxDraw.stroke();
      ctxDraw.setLineDash([]);
    }
  });

  // -- pasada 2: etiquetas, cada una en su carril ya asignado arriba --
  infoSecciones.forEach(({ nombreSec, anchoNombre, anchoNombreSolo, sx, carril, encendida, color, notaSec }) => {
    if(!nombreSec) return;
    ctxDraw.font = encendida ? 'bold 14px monospace' : 'bold 13px monospace';
    const labelX = sx + 1;
    const labelY = WAVEFORM_ONDA_H + carril * WAVEFORM_LANE_H + 3;
    ctxDraw.fillStyle = colorFondoTick;
    ctxDraw.fillRect(labelX, labelY, anchoNombre + 6, 16);
    ctxDraw.fillStyle = encendida ? colorMezclarBlanco(color, 0.55) : color;
    ctxDraw.fillText(nombreSec, labelX + 3, labelY + 12);
    // v3.105: nota de sección pegada al lado del nombre, mismo renglón
    // (como en el PDF) — itálica, chica y en colorFaint (tenue a
    // propósito, dato secundario) para que el ojo vaya primero al
    // nombre. El fondo ya se dibujó de una sola vez arriba, con el ancho
    // combinado (anchoNombre incluye la nota), así no hace falta un
    // segundo fillRect pegado.
    if(notaSec){
      ctxDraw.font = 'italic 11px monospace';
      ctxDraw.fillStyle = colorFaint;
      ctxDraw.fillText(notaSec, labelX + 3 + anchoNombreSolo + 6, labelY + 11);
    }
  });

  // v3.139: (a pedido) línea de "comienzo de canción" (offsetEfectivo)
  // — existía antes de v3.137 mezclada con el CUE; al separar los
  // conceptos en v3.138 se había perdido sin querer. Vuelve acá como
  // marca independiente (celeste, distinta del rosa del CUE y del
  // dorado de los ticks de compás) — es el punto que calibran los
  // botones 🎯 de Configuración, siempre visible mientras
  // offsetLocalDelta ≠ 0.
  if(est.offsetLocalDelta && offsetEfectivo > 0 && offsetEfectivo < dur){
    const xOffset = (offsetEfectivo / dur) * W;
    const colorOffsetLinea = '#6fd6ff';
    ctxDraw.shadowBlur = 0;
    ctxDraw.strokeStyle = colorOffsetLinea;
    ctxDraw.lineWidth = 2;
    ctxDraw.beginPath();
    // v3.203: (a pedido) FIX — esta línea arrancaba en y=0, tapando el
    // tick de compás 1 agregado en v3.202 (mismo x, ambos empiezan en
    // el borde superior). Ahora arranca en y=14, igual que el resto de
    // los ticks de compás (que dejan 0-14 libre para su número) — la
    // bandera baja con ella, ya no monta el número/hora del tick.
    ctxDraw.moveTo(xOffset, 14);
    ctxDraw.lineTo(xOffset, H);
    ctxDraw.stroke();
    ctxDraw.fillStyle = colorOffsetLinea;
    ctxDraw.beginPath();
    ctxDraw.moveTo(xOffset, 14);
    ctxDraw.lineTo(xOffset - 8, 19);
    ctxDraw.lineTo(xOffset, 24);
    ctxDraw.closePath();
    ctxDraw.fill();
  }

  // v3.138: (a pedido) marca de CUE — punto donde arranca la
  // reproducción al tocar play (ver togglePlayPractica), marcado con
  // los botones del reproductor (marcarCuePractica /
  // toggleArmarCueWaveform). Totalmente independiente del offset (línea
  // ELIMINADA en v3.138: la de v3.137 usaba offsetLocalDelta, que es
  // solo para click/conteo — mezclaba los dos conceptos). Color propio
  // (rosa/magenta) para no confundirse con los ticks de compás (dorado)
  // ni las líneas de sección. Desaparece sola con "✕ Quitar CUE"
  // (quitarCuePractica, pone cuePlayback en null).
  if(est.cuePlayback != null && est.cuePlayback >= 0 && est.cuePlayback < dur){
    const xCue = (est.cuePlayback / dur) * W;
    const colorCue = '#ff5da2';
    ctxDraw.shadowBlur = 0;
    ctxDraw.strokeStyle = colorCue;
    ctxDraw.lineWidth = 2;
    ctxDraw.beginPath();
    ctxDraw.moveTo(xCue, 0);
    ctxDraw.lineTo(xCue, H);
    ctxDraw.stroke();
    ctxDraw.fillStyle = colorCue;
    ctxDraw.beginPath();
    ctxDraw.moveTo(xCue, 0);
    ctxDraw.lineTo(xCue + 8, 5);
    ctxDraw.lineTo(xCue, 10);
    ctxDraw.closePath();
    ctxDraw.fill();
  }

  // v3.37: (a pedido) autoscroll — solo aplica si hay zoom (si no, el
  // canvas entero ya es visible y no hay nada que scrollear) y si el
  // checkbox "Seguir reproducción" está tildado. Se corrige el scroll
  // del wrap SOLO cuando el playhead se sale del área visible (no en
  // cada frame, para no pelearse con el dedo del músico si está
  // scrolleando manualmente el waveform). Si el músico scrolleó a mano
  // hace poco (est.waveformUltimoScrollManual), se respeta ese gesto
  // y no se fuerza el autoscroll hasta pasado ese margen de tiempo.
  if(wrapEl && zoom > 1 && est.waveformAutoScroll){
    const scrollManualReciente = est.waveformUltimoScrollManual && (ahora - est.waveformUltimoScrollManual) < 1500;
    if(!scrollManualReciente){
      const visibleIzq = wrapEl.scrollLeft;
      const visibleDer = visibleIzq + wrapEl.clientWidth;
      const margen = wrapEl.clientWidth * 0.15;
      if(progressX < visibleIzq + margen || progressX > visibleDer - margen){
        est.waveformScrollProgramatico = true;
        wrapEl.scrollLeft = Math.max(0, progressX - wrapEl.clientWidth / 2);
        clearTimeout(est.waveformScrollProgTimeout);
        est.waveformScrollProgTimeout = setTimeout(() => { est.waveformScrollProgramatico = false; }, 100);
      }
    }
  }

  est.waveformTiempoPrevio = tiempoActual;
}

// v3.37: (a pedido) zoom horizontal del waveform. delta +1/-1 desde
// los botones +/-. Tope 1x-8x. Al cambiar el zoom se redibuja ya
// mismo (cambia W, y por lo tanto el ancho del canvas) y se actualiza
// la etiqueta numérica de al lado de los botones.
const WAVEFORM_ZOOM_MIN = 1;
const WAVEFORM_ZOOM_MAX = 8;
function zoomWaveform(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  const actual = est.waveformZoom || 1;
  const nuevo = Math.max(WAVEFORM_ZOOM_MIN, Math.min(WAVEFORM_ZOOM_MAX, actual + delta));
  if(nuevo === actual) return;
  est.waveformZoom = nuevo;
  const label = document.getElementById('waveformzoomlabel-' + uid);
  if(label) label.textContent = nuevo + '×';
  dibujarWaveform(uid, est.getTiempoActual ? est.getTiempoActual() : 0);
}
// v3.205: (a pedido) botón cuadrado ↺ — restaura el zoom a 1× de una
// sola vez, mismo patrón exacto que zoomWaveform (no toca autoscroll
// ni ningún otro estado).
function resetZoomWaveform(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if((est.waveformZoom || 1) === 1) return;
  est.waveformZoom = 1;
  const label = document.getElementById('waveformzoomlabel-' + uid);
  if(label) label.textContent = '1×';
  dibujarWaveform(uid, est.getTiempoActual ? est.getTiempoActual() : 0);
}
// v3.210: (a pedido) botón cuadrado 🤿 — ajusta el zoom a la sección
// que está sonando AHORA (mismo criterio de "sección actual" que ya
// usa el resaltado del mapa/chip, ver comentario de irASeccionPractica
// y el bloque de highlighting en actualizarContadorPractica: si hay
// sección siguiente, el fin real es su inicio; si no, hastaSegundos o
// el final del audio). Zoom entero (mismo rango 1×-8× que +/-),
// redondeado HACIA ABAJO para garantizar que la sección completa
// entre en el ancho visible sin cortarse, y hace scroll para dejar el
// inicio de la sección pegado al borde izquierdo — mismo patrón que
// ya usa el autoscroll (wrapEl.scrollLeft/waveformScrollProgramatico).
function ajustarZoomASeccionPractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.waveformDuracion) return;
  const dur = est.waveformDuracion;
  const tiempoActual = est.getTiempoActual ? est.getTiempoActual() : 0;
  const secciones = seccionesRuntimeDe(est).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  if(!secciones.length){ mostrarToast('Este tema no tiene secciones marcadas.', 'info'); return; }
  let actual = null, siguiente = null;
  secciones.forEach((sec, i) => {
    if(tiempoActual >= (sec.desdeSegundos || 0)){ actual = sec; siguiente = secciones[i+1] || null; }
  });
  if(!actual){ mostrarToast('No hay una sección activa en este punto del audio.', 'info'); return; }
  const inicio = actual.desdeSegundos || 0;
  const finCandidato = siguiente ? (siguiente.desdeSegundos || 0) : actual.hastaSegundos;
  const fin = (finCandidato != null) ? finCandidato : dur;
  const duracionSeccion = Math.max(0.5, fin - inicio);
  const zoomIdeal = dur / duracionSeccion;
  const nuevoZoom = Math.max(WAVEFORM_ZOOM_MIN, Math.min(WAVEFORM_ZOOM_MAX, Math.floor(zoomIdeal)));
  est.waveformZoom = nuevoZoom;
  const label = document.getElementById('waveformzoomlabel-' + uid);
  if(label) label.textContent = nuevoZoom + '×';
  dibujarWaveform(uid, tiempoActual);
  const wrapEl = document.getElementById('waveformwrap-' + uid);
  if(wrapEl){
    const wrapWidth = wrapEl.clientWidth || 700;
    const W = Math.round(wrapWidth * nuevoZoom);
    est.waveformScrollProgramatico = true;
    wrapEl.scrollLeft = Math.max(0, (inicio / dur) * W);
    clearTimeout(est.waveformScrollProgTimeout);
    est.waveformScrollProgTimeout = setTimeout(() => { est.waveformScrollProgramatico = false; }, 100);
  }
}

// v3.37: prende/apaga el autoscroll (checkbox "Seguir reproducción").
// v3.178: (a pedido) pasa de checkbox a botón cuadrado icon-only —
// ya no recibe el "checked" de un <input>, alterna el estado
// internamente y refleja la clase .activo en el propio botón (mismo
// patrón que toggleLoopSeccionPractica, arriba).
function toggleAutoScrollWaveformBtn(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.waveformAutoScroll = !est.waveformAutoScroll;
  const btn = document.getElementById('waveformautoscroll-' + uid);
  if(btn) btn.classList.toggle('activo', est.waveformAutoScroll);
}

// v3.163: función toggleOcultarEtiquetasEstructura (v3.135) eliminada
// — quedó sin efecto real desde que seccionesRuntimeDe(est) vacía las
// secciones automáticamente con archivo local (ver más arriba), que
// era el único caso para el que existía. El checkbox y el wrap
// asociado también se sacaron de bloquePracticaHtml.

// v3.37: si el músico scrollea el waveform a mano (arrastra con el
// dedo/mouse mientras está zoomeado), el autoscroll no debe pelearse
// con ese gesto ni "tirarlo" de vuelta al playhead. Se distingue
// scroll manual de scroll programático (el que hace la propia función
// de autoscroll) con la bandera est.waveformScrollProgramatico, que
// dibujarWaveform prende justo antes de mover el scroll y apaga un
// instante después. Cualquier evento de scroll que NO tenga esa
// bandera prendida se toma como gesto del músico, y pausa el
// autoscroll por 1.5s (ver waveformUltimoScrollManual en
// dibujarWaveform) — tiempo suficiente para que termine de acomodar
// la vista antes de que el autoscroll vuelva a tomar el control.
// Delegado en document (los canvas/wraps se crean dinámicamente por
// uid), filtrando por la clase del wrap.
document.addEventListener('scroll', (ev) => {
  const wrapEl = ev.target;
  if(!wrapEl || !wrapEl.classList || !wrapEl.classList.contains('practica-waveform-wrap')) return;
  const uid = (wrapEl.id || '').replace('waveformwrap-', '');
  const est = estadoPractica[uid];
  if(!est || est.waveformScrollProgramatico) return;
  est.waveformUltimoScrollManual = performance.now();
}, true);

// v3.19: elige cada cuántos compases poner un tick para que siempre
// queden entre ~4 y ~10 marcas visibles, sin importar tempo/duración
// del tema — mismo criterio que se probó en el boceto.
function intervaloCompasesWaveform(duracionSeg, secPerBar){
  const totalCompases = duracionSeg / secPerBar;
  const candidatos = [4, 8, 16, 32, 64, 128, 256];
  for(let i = 0; i < candidatos.length; i++){
    if(totalCompases / candidatos[i] <= 10) return candidatos[i];
  }
  return candidatos[candidatos.length - 1];
}

// v3.19: click/tap en el waveform salta a ese punto — usa est.seek(),
// el mismo hook que ya usan los demás controles, así que funciona
// igual sin importar si detrás hay <audio> local (el único caso real
// hoy, ya que el waveform solo existe para archivo local).
function seekWaveformClick(evento, uid){
  const est = estadoPractica[uid];
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(!est || !canvas || !est.waveformDuracion) return;
  const rect = canvas.getBoundingClientRect();
  const frac = (evento.clientX - rect.left) / rect.width;
  const t = Math.max(0, Math.min(est.waveformDuracion, frac * est.waveformDuracion));
  // v3.135: (a pedido) "ajustar el comienzo con click en la onda" — si
  // el modo está armado (toggleArmarMarcarInicioWaveform), este click
  // marca el tiempo 1 ACÁ en vez de hacer seek/cerrar loop, y se
  // desarma solo. Mismo cálculo que marcarOffsetLocalPractica, pero
  // con el tiempo clickeado en vez de est.getTiempoActual().
  if(est.marcandoInicioClick){
    est.offsetLocalDelta = t - (est.offset || 0);
    est.marcandoInicioClick = false;
    canvas.classList.remove('practica-waveform-armado');
    const btnArmado = document.getElementById('marcarinicioclick-' + uid);
    if(btnArmado) btnArmado.classList.remove('activo');
    actualizarUIOffsetLocalPractica(uid);
    actualizarContadorPractica(uid, est.getTiempoActual());
    dibujarWaveform(uid, est.getTiempoActual());
    guardarOffsetLocalEnStorage(uid);
    return;
  }
  // v3.138: (a pedido) "CUE con click en la onda" — mismo patrón que el
  // armado de offset de arriba, pero para el CUE de reproducción
  // (variable independiente, ver toggleArmarCueWaveform). Se revisa
  // DESPUÉS del armado de offset para que nunca puedan quedar los dos
  // modos activos a la vez con resultados ambiguos (en la práctica solo
  // se arma uno por vez, ya que cada botón desarma implícitamente con
  // su propio toggle).
  if(est.marcandoCueClick){
    est.cuePlayback = t;
    est.marcandoCueClick = false;
    canvas.classList.remove('practica-waveform-armado-cue');
    const btnCueArmado = document.getElementById('cueclickbtn-' + uid);
    if(btnCueArmado) btnCueArmado.classList.remove('activo');
    dibujarWaveform(uid, est.getTiempoActual());
    return;
  }
  // v3.28: (a pedido) si hay un loop a medio marcar (ya se tocó
  // "Marcar loop aquí" una vez y está esperando el fin), tocar el
  // waveform también sirve para cerrarlo ahí — no hace falta esperar
  // a que la reproducción llegue sola a ese punto.
  if(est.loopInicio != null && !est.loopActivo){
    marcarLoopPractica(uid, t);
    return;
  }
  est.seek(t);
  dibujarWaveform(uid, t);
}
// v3.135: arma/desarma el modo "marcar tiempo 1 con el próximo click en
// la onda" — separado del click normal (seek) para no volver
// ambiguo el gesto de tocar la onda, que ya se usa para saltar y para
// cerrar un loop a medio marcar.
function toggleArmarMarcarInicioWaveform(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.marcandoInicioClick = !est.marcandoInicioClick;
  const btn = document.getElementById('marcarinicioclick-' + uid);
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(btn) btn.classList.toggle('activo', est.marcandoInicioClick);
  if(canvas) canvas.classList.toggle('practica-waveform-armado', est.marcandoInicioClick);
}

// v3.138: (a pedido) CUE de reproducción — independiente del offset de
// arriba. "📍 Marcar CUE aquí" marca en el segundo donde está la
// reproducción AHORA MISMO (mismo patrón que marcarOffsetLocalPractica,
// pero sobre cuePlayback en vez de offsetLocalDelta).
function marcarCuePractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.cuePlayback = est.getTiempoActual();
  dibujarWaveform(uid, est.getTiempoActual());
}
// v3.138: "📍 CUE con click en la onda" — arma/desarma el modo (mismo
// patrón que toggleArmarMarcarInicioWaveform), y el próximo click en la
// onda (ver seekWaveformClick) fija el CUE exactamente ahí.
function toggleArmarCueWaveform(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.marcandoCueClick = !est.marcandoCueClick;
  const btn = document.getElementById('cueclickbtn-' + uid);
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(btn) btn.classList.toggle('activo', est.marcandoCueClick);
  if(canvas) canvas.classList.toggle('practica-waveform-armado-cue', est.marcandoCueClick);
}
// v3.138: "✕ Quitar CUE" — vuelve a null; el play arranca de nuevo
// desde el offset efectivo normal (ver togglePlayPractica) y la línea
// rosa desaparece del waveform.
function quitarCuePractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.cuePlayback = null;
  dibujarWaveform(uid, est.getTiempoActual());
}

// (a pedido) "cuadrar el comienzo" del archivo local: en vez de solo
// tantear con ± manuales, se puede tocar el archivo, esperar a
// escuchar el primer golpe real, y tocar este botón justo ahí — el
// tiempo de reproducción actual pasa a ser el nuevo punto cero
// (offsetLocalDelta se calcula para que ese instante caiga exacto en
// offset efectivo = tiempo actual). Después se puede afinar con los
// botones ± de 0.05s si quedó un poco corrido.
// (a pedido) detección automática del primer transiente — YA NO se
// dispara sola al cargar el archivo (se probó así y costaba más
// cuadrar el resultado que a mano); ahora es un botón aparte que el
// músico toca cuando quiere. Decodifica el archivo con la Web Audio
// API (sin reproducirlo) para leer las muestras crudas, y busca la
// primera ventana de ~15ms cuya energía (RMS) supera un umbral relativo
// al pico de volumen real de la canción — ese salto es el primer golpe.
// Con intros de ataque nítido (percusión, kick) esto puede ser más
// preciso que el tap manual, porque no depende del tiempo de reacción
// humano — pero con fade-ins o pads sin ataque puede fallar, por eso
// NUNCA reemplaza el tap/± manual: solo los deja pre-cargados como
// punto de partida, y el músico corrige si hace falta.
// `file` es opcional — si no se pasa (caso normal, botón del panel),
// usa el File guardado en onArchivoLocalElegido (est.archivoLocalFile).
// `limiteSegundos` acota cuánto del archivo se analiza — 45s por
// defecto (cubre casi cualquier intro real sin recorrer la canción
// entera); null = sin límite, usado por "Buscar más allá".
async function detectarOffsetAutomaticoPractica(uid, file, limiteSegundos = 45){
  const info = document.getElementById('offsetlocalauto-' + uid);
  const btnBuscarMas = document.getElementById('offsetlocalbuscarmas-' + uid);
  const est0 = estadoPractica[uid];
  const archivo = file || (est0 && est0.archivoLocalFile);
  if(!archivo){
    if(info) info.textContent = 'No hay archivo cargado todavía.';
    return;
  }
  if(info) info.textContent = 'Analizando el audio para detectar el primer golpe…';
  try{
    const arrayBuffer = await archivo.arrayBuffer();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) throw new Error('sin Web Audio API');
    const ctx = new Ctx();
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    const data = audioBuffer.getChannelData(0);
    const sampleRate = audioBuffer.sampleRate;
    const maxSamples = limiteSegundos ? Math.min(data.length, sampleRate * limiteSegundos) : data.length;
    // (corregido) el umbral original asumía silencio real en los
    // primeros ~150ms para medir un "piso de ruido" — si el beat entra
    // justo en el segundo 0 (como reportado), esa ventana mide el beat
    // mismo, no ruido, y el umbral quedaba tan alto que nada lo cruzaba
    // nunca. Ahora se compara contra el PICO real de la canción (dentro
    // del rango analizado), que funciona igual haya o no silencio
    // antes del golpe.
    let pico = 0;
    for(let i = 0; i < maxSamples; i++){
      const a = Math.abs(data[i]);
      if(a > pico) pico = a;
    }
    const umbral = Math.max(pico * 0.3, 0.01);
    const ventanaSamples = Math.max(1, Math.floor(sampleRate * 0.015));
    let transienteSample = -1;
    for(let i = 0; i < maxSamples; i += ventanaSamples){
      const fin = Math.min(i + ventanaSamples, maxSamples);
      let sum = 0;
      for(let j = i; j < fin; j++) sum += data[j] * data[j];
      const rms = Math.sqrt(sum / (fin - i));
      if(rms > umbral){ transienteSample = i; break; }
    }
    if(ctx.close) ctx.close();
    const est = estadoPractica[uid];
    if(!est){ return; }
    if(transienteSample < 0){
      if(info){
        info.textContent = limiteSegundos
          ? `No se detectó un golpe claro en los primeros ${limiteSegundos}s — puede ser una intro más larga, o sin ataque nítido. Marcá el tiempo 1 a mano abajo, o probá "Buscar más allá".`
          : 'No se detectó un golpe claro en todo el archivo — es una intro sin ataque nítido (fade-in, pad). Marcá el tiempo 1 a mano abajo.';
      }
      // (a pedido) solo se ofrece "buscar más allá" si esta pasada
      // tenía límite — si ya buscó sin límite y no encontró nada, no
      // hay "más allá" a donde ir.
      if(btnBuscarMas) btnBuscarMas.style.display = limiteSegundos ? 'block' : 'none';
      return;
    }
    if(btnBuscarMas) btnBuscarMas.style.display = 'none';
    const segundos = transienteSample / sampleRate;
    est.offsetLocalDelta = segundos - (est.offset || 0);
    actualizarUIOffsetLocalPractica(uid);
    if(info) info.textContent = `Golpe inicial detectado en ${segundos.toFixed(2)}s — ajustalo abajo si no quedó exacto.`;
    guardarOffsetLocalEnStorage(uid); // v3.28
  }catch(e){
    if(info) info.textContent = 'No se pudo analizar el audio automáticamente — marcá el tiempo 1 a mano abajo.';
    if(btnBuscarMas) btnBuscarMas.style.display = 'none';
  }
}

// (a pedido) reintenta la detección SIN límite de tiempo (todo el
// archivo), reutilizando el File guardado en onArchivoLocalElegido —
// así el músico no tiene que volver a elegir el archivo del dispositivo.
function buscarMasAllaOffsetPractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.archivoLocalFile) return;
  const info = document.getElementById('offsetlocalauto-' + uid);
  if(info) info.textContent = 'Analizando todo el archivo… puede tardar un poco más.';
  detectarOffsetAutomaticoPractica(uid, est.archivoLocalFile, null);
}

// (a pedido) "por si la intro es suave": deja escuchar desde antes del
// punto detectado (o desde el principio absoluto) SIN perder el offset
// ya calculado — actualizarContadorPractica ya deja el contador
// congelado en "compás 1" mientras tiempoActual < offset (tRel se
// clampea a 0), así que no hace falta lógica extra: simplemente
// rebobina, y el conteo arranca solo, exacto, cuando el playback llega
// al punto marcado como tiempo 1.
function reproducirDesdeInicioPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.seek(0);
}

// (a pedido) el offset resuelve el desfase inicial — este botón lo usa
// como punto de referencia: al tocarlo justo en el tiempo 1 real,
// offsetLocalDelta se calcula para que ESE instante caiga exacto en el
// offset efectivo. Después se puede afinar con los botones ± de 0.05s
// si quedó un poco corrido.
function marcarOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const actual = est.getTiempoActual();
  est.offsetLocalDelta = actual - (est.offset || 0);
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, actual);
  dibujarWaveform(uid, actual);
  guardarOffsetLocalEnStorage(uid); // v3.28
}

function ajustarOffsetLocalPractica(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  est.offsetLocalDelta = (est.offsetLocalDelta || 0) + delta;
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, est.getTiempoActual());
  dibujarWaveform(uid, est.getTiempoActual());
  guardarOffsetLocalEnStorage(uid); // v3.28
}

function restablecerOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.offsetLocalDelta = 0;
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, est.getTiempoActual());
  dibujarWaveform(uid, est.getTiempoActual());
  guardarOffsetLocalEnStorage(uid); // v3.28 — guarda el 0, pisando el ajuste anterior
}

// (a pedido) fijar el offset por valor exacto en vez de solo a los
// empujones con ±  — toma el número tal cual del input y lo aplica como
// offsetLocalDelta absoluto (no sumado al que había).
function fijarOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  const input = document.getElementById('offsetlocalinput-' + uid);
  if(!est || !input) return;
  const valor = parseFloat(input.value);
  if(isNaN(valor)) return;
  est.offsetLocalDelta = valor;
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, est.getTiempoActual());
  dibujarWaveform(uid, est.getTiempoActual());
  guardarOffsetLocalEnStorage(uid); // v3.28
}

function actualizarUIOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  const el = document.getElementById('offsetlocalval-' + uid);
  if(!est || !el) return;
  const d = est.offsetLocalDelta || 0;
  el.textContent = (d >= 0 ? '+' : '') + d.toFixed(2) + 's';
}

// v3.28: (a pedido) recordar el offset local por archivo, SOLO en este
// navegador (localStorage) — no toca Firebase ni el offset oficial del
// tema. Sirve para no tener que recalibrar cada vez que se vuelve a
// cargar el MISMO archivo de práctica del dispositivo. Se identifica
// el archivo por nombre + tamaño en bytes (no por contenido real) —
// suficiente para no confundir dos archivos distintos, sin el costo de
// calcular un hash.
// v1 ensayo.html: el offset ya no se guarda por archivo+tamaño en
// localStorage (ese criterio era para "el mismo archivo en este
// navegador") — ahora cada tema vive en Firestore (GUIAS2) y te sigue
// en cualquier dispositivo. Mismos nombres de función que el motor
// original (misma firma, mismos call-sites) para no tocar nada de la
// lógica que los usa — solo cambia DÓNDE se guarda/lee.
// v3.190: (a pedido) se saca el debounce de v3.189 — el ahorro de
// escrituras no valía el riesgo de perder un ajuste si el músico cierra

function guardarOffsetLocalEnStorage(uid){
  const est = estadoPractica[uid];
  if(!est || !temaActualId) return;
  db.collection('GUIAS2').doc(temaActualId).set({ offset: est.offsetLocalDelta || 0 }, { merge: true })
    .catch(e => console.error('No se pudo guardar el offset en Firestore:', e));
}
function cargarOffsetLocalDeStorage(archivo){
  return (temaActualDatos && typeof temaActualDatos.offset === 'number') ? temaActualDatos.offset : null;
}

// v3.174: (a pedido) "secciones locales propias" — pendiente que quedó
// anotado desde v3.163: con archivo local cargado, las secciones del
// TEMA (Firebase) se ignoran porque están calibradas en segundos
// contra la maqueta oficial y casi nunca calzan con un archivo
// distinto (ver seccionesRuntimeDe). Esto NO reemplaza esa decisión —
// le da al músico su propio set de marcadores para el archivo local,
// anclados al reloj de ESE archivo. Mismo patrón de persistencia que
// el offset (claveOffsetLocalStorage): identificado por nombre+tamaño
// del archivo, solo en este navegador, nunca toca Firebase/Firestore.
// Estructura de cada sección: {nombre, desdeSegundos, hastaSegundos}
// — hastaSegundos es opcional (undefined = termina donde arranca la
// siguiente, mismo criterio que ya usan mapaSeccionesHtml/
// recorrerTramosMusico con las secciones del tema).
// v1 ensayo.html: mismo criterio que el offset arriba — las secciones
// "de este archivo" pasan a ser las secciones OFICIALES del tema,
// guardadas en su documento de Firestore (GUIAS2) en vez de
// localStorage por archivo+tamaño.
function guardarSeccionesLocalEnStorage(uid){
  const est = estadoPractica[uid];
  if(!est || !temaActualId) return;
  db.collection('GUIAS2').doc(temaActualId).set({ secciones: est.seccionesLocales || [] }, { merge: true })
    .catch(e => console.error('No se pudieron guardar las secciones en Firestore:', e));
}
function cargarSeccionesLocalDeStorage(archivo){
  return (temaActualDatos && Array.isArray(temaActualDatos.secciones)) ? temaActualDatos.secciones : null;
}
// Refresca el mapa de estructura (mismo bloque visual que ya usan las
// secciones del tema, mapaSeccionesHtml) con las secciones vigentes
// (seccionesRuntimeDe ya devuelve las locales si hay archivo local).
function actualizarMapaEstructuraPractica(uid){
  const est = estadoPractica[uid];
  const wrap = document.getElementById('mapaestructurawrap-' + uid);
  if(!est || !wrap) return;
  const secciones = seccionesRuntimeDe(est).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const bpm = est.bpmEfectivo || est.bpm; // v3.177: idem fix de secPerBarLocalPractica
  wrap.innerHTML = mapaSeccionesHtml(uid, secciones, bpm, compasEfectivoDe(est), undefined, factorCompasGeneralDe(est));
  // v3.183: (a pedido) antes estos elementos solo existían en el DOM si
  // tema.secciones ya traía datos al ABRIR la pantalla — pero en
  // ensayo.html las secciones siempre se crean DESPUÉS, a mano (🎯), así
  // que nunca aparecían. Ahora existen siempre (ocultos por defecto,
  // ver controlesPracticaHtml) y esta función, que ya se llama cada vez
  // que la lista de secciones cambia, decide si mostrarlos u ocultarlos.
  const hay = secciones.length > 0;
  const idsToggle = ['loopseccionbtn-', 'pdfrow-'];
  idsToggle.forEach(prefijo => {
    const el = document.getElementById(prefijo + uid);
    if(el) el.style.display = hay ? '' : 'none';
  });
  const seccionActualEl = document.getElementById('seccion-' + uid);
  if(seccionActualEl && !hay) seccionActualEl.style.display = 'none';
}
// v3.175: (a pedido) "lo más parecido posible" al módulo ⏱ Tiempo del
// editor de secciones del staff (guia-practica.html): Desde/Hasta
// editables tanto por Nº de compás como por minuto:segundo (se
// mantienen sincronizados entre sí), presets rápidos de duración
// (x1..x64) y un indicador de "→ N compases". A diferencia del staff
// (que tiene varios tramos con compás propio por sección,
// compasOverride, vamp/origen, etc.), acá es más simple: un solo
// BPM/compás efectivo para todo el archivo local (est.bpmOverride||
// est.bpm, compasEfectivoDe(est)) y offset = est.offsetLocalDelta —
// alcanza porque estas secciones son propias de UN archivo, no de un
// tema con varias maquetas.
// v3.177: FIX — usaba est.bpmOverride||est.bpm, pero el BPM real que
// usa la regla de compases del waveform (dibujarWaveform, bpmParaTicks)
// y el resto del motor (loop, metrónomo) es est.bpmEfectivo||est.bpm
// — bpmEfectivo ya incluye el ajuste fino/tap-tempo, no solo el
// override crudo. Por eso los presets (x4, etc.) no coincidían con
// los compases reales marcados sobre la onda.
function secPerBarLocalPractica(est){
  const bpm = est.bpmEfectivo || est.bpm;
  const compases = compasEfectivoDe(est);
  // v3.205: (a pedido) incorpora factorCompasGeneralDe(est) — mismo FIX
  // de denominador que el resto del motor. Factor 1 en /4: sin cambio.
  return (bpm && compases) ? (60 / bpm) * compases * factorCompasGeneralDe(est) : 0;
}
// v3.176: FIX — usaba solo est.offsetLocalDelta como punto de compás 1,
// pero el offset real de "comienzo de canción" en TODO el resto del
// archivo (metrónomo, click, contador, ticks del waveform, loop —
// ver offsetEfectivo en dibujarWaveform/recorrerTramosMusico/etc.) es
// offset + offsetLocalDelta: offsetLocalDelta es solo el AJUSTE que
// se suma sobre est.offset (el offset oficial del tema), no un
// reemplazo. Por eso el compás 1 marcado acá no coincidía con el "Set
// de 1er tiempo manual" ya calibrado en el panel de arriba.
function compasDeSegundosLocalPractica(seg, est){
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return 1;
  const offsetEfectivo = (est.offset || 0) + (est.offsetLocalDelta || 0);
  return Math.max(1, Math.round(((seg || 0) - offsetEfectivo) / secPerBar) + 1);
}
function segundosDeCompasLocalPractica(compasNum, est){
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return 0;
  const offsetEfectivo = (est.offset || 0) + (est.offsetLocalDelta || 0);
  return Math.max(0, offsetEfectivo + (compasNum - 1) * secPerBar);
}
// Mismo criterio que textoIndicadorDuracionSeccion() del staff, pero
// sin vamp/origen (no aplica a secciones locales).
function textoIndicadorDuracionSeccionLocal(s, est){
  if(s.hastaSegundos == null) return '';
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return '';
  const d = compasDeSegundosLocalPractica(s.hastaSegundos, est) - compasDeSegundosLocalPractica(s.desdeSegundos || 0, est);
  return d > 0 ? `→ ${d} compás${d === 1 ? '' : 'es'}` : '';
}
function esPresetHastaActivoLocal(s, n, est){
  if(s.hastaSegundos == null) return false;
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return false;
  const esperado = (s.desdeSegundos || 0) + n * secPerBar;
  return Math.abs(s.hastaSegundos - esperado) < 0.01;
}
// Redibuja la lista editable (mismos campos que el sub-bloque ⏱ Tiempo
// del staff: Desde compás/tiempo, Hasta compás/tiempo opcional,
// presets, ↺, indicador de duración) del panel de Configuración. Se

  // guia-practica.html: punto de color + nombre + rango de tiempo +

  // nunca se guarda en localStorage junto con las secciones) — mismo

  est.seccionesLocalesColapso = est.seccionesLocalesColapso || {};

      (s.hastaSegundos != null ? ' – ' + segundosATextoPractica(s.hastaSegundos) + ' (c.' + (compasDeSegundosLocalPractica(s.hastaSegundos, est) - 1) + ')' : '');
    return `<div class="practica-seccion-local-card">
      <div class="practica-seccion-local-header" onclick="toggleColapsoSeccionLocal('${uid}', ${i})">
        <span class="practica-seccion-local-header-color" style="background:${color}"></span>
        <span class="practica-seccion-local-header-nombre">${escapeHtml(s.nombre || 'Sin nombre')}</span>
        <span class="practica-seccion-local-header-tiempo">${rangoTxt}</span>

      </div>

        <div class="practica-seccion-local-fila">
          <input type="text" class="practica-offsetlocal-input" value="${escapeHtml(s.nombre || '')}" placeholder="Nombre de la sección" onchange="renombrarSeccionLocalPractica('${uid}', ${i}, this.value)">
        </div>
        <div class="practica-seccion-local-campos">
          <div class="practica-seccion-local-campo">
            <label>Desde (compás)</label>
            <input type="number" class="practica-offsetlocal-input" min="1" step="1" value="${compasDeSegundosLocalPractica(s.desdeSegundos || 0, est)}" onchange="actualizarSeccionLocalDesdeCompas('${uid}', ${i}, this.value)">
          </div>
          <div class="practica-seccion-local-campo">
            <label>Desde (tiempo)</label>
            <input type="text" class="practica-offsetlocal-input" value="${segundosATextoPractica(s.desdeSegundos || 0)}" placeholder="Minuto:segundo (ej: 1:30)" onchange="actualizarSeccionLocalDesdeTiempo('${uid}', ${i}, this.value)">
          </div>

          <div class="practica-seccion-local-campo">

            <input type="number" class="practica-offsetlocal-input" min="1" step="1" value="${s.hastaSegundos != null ? (compasDeSegundosLocalPractica(s.hastaSegundos, est) - 1) : ''}" title="Último compás de ESTA sección (inclusive)" onchange="actualizarSeccionLocalHastaCompas('${uid}', ${i}, this.value)">
          </div>
          <div class="practica-seccion-local-campo">
            <label>Hasta (tiempo, opcional)</label>
            <input type="text" class="practica-offsetlocal-input" value="${s.hastaSegundos != null ? segundosATextoPractica(s.hastaSegundos) : ''}" placeholder="Minuto:segundo" onchange="actualizarSeccionLocalHastaTiempo('${uid}', ${i}, this.value)">
          </div>
          <button class="practica-click-btn" onclick="limpiarSeccionLocalHasta('${uid}', ${i})" title="Volver a automático (sin fin manual — termina donde arranca la siguiente)">↺</button>

          <span class="practica-offsetlocal-info">Presets (fin = N compases desde el inicio):</span>
          ${[1,2,4,8,16,32,64].map(n => `<button type="button" class="btn-preset${esPresetHastaActivoLocal(s, n, est) ? ' activo' : ''}" onclick="setSeccionLocalHastaPreset('${uid}', ${i}, ${n})">x${n}</button>`).join('')}
        </div>
        ${indicador ? `<div class="practica-seccion-local-duracion">${indicador}</div>` : ''}

  }).join('') || `<span class="practica-offsetlocal-info">Todavía no marcaste ninguna sección de este archivo.</span>`;

function toggleColapsoSeccionLocal(uid, idx){
  const est = estadoPractica[uid];
  if(!est) return;
  est.seccionesLocalesColapso = est.seccionesLocalesColapso || {};
  const yaAbierta = est.seccionesLocalesColapso[idx] === false;
  est.seccionesLocalesColapso[idx] = yaAbierta ? true : false;
  actualizarListaSeccionesLocalesPractica(uid);
}
function marcarSeccionLocalPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const inputNombre = document.getElementById('seccionlocalnombre-' + uid);
  const nombre = (inputNombre && inputNombre.value.trim()) || `Sección ${(est.seccionesLocales || []).length + 1}`;
  const actual = est.getTiempoActual();
  est.seccionesLocales = est.seccionesLocales || [];
  const nuevoIdx = est.seccionesLocales.length;
  est.seccionesLocales.push({ nombre: nombre, desdeSegundos: actual });
  // v3.180: nace expandida (mismo criterio que agregarFilaSeccion() en
  // el staff) — recién creada, tiene más sentido verla abierta que
  // tener que abrirla a mano para ajustarla.
  est.seccionesLocalesColapso = est.seccionesLocalesColapso || {};
  est.seccionesLocalesColapso[nuevoIdx] = false;
  if(inputNombre) inputNombre.value = '';
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, actual);
}
function renombrarSeccionLocalPractica(uid, idx, nuevoNombre){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  est.seccionesLocales[idx].nombre = nuevoNombre.trim() || est.seccionesLocales[idx].nombre;
  guardarSeccionesLocalEnStorage(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function actualizarSeccionLocalDesdeCompas(uid, idx, valor){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  const n = parseInt(valor, 10);
  if(!n) { actualizarListaSeccionesLocalesPractica(uid); return; }
  est.seccionesLocales[idx].desdeSegundos = segundosDeCompasLocalPractica(n, est);
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function actualizarSeccionLocalDesdeTiempo(uid, idx, txt){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  est.seccionesLocales[idx].desdeSegundos = textoASegundosPractica(txt);
  guardarSeccionesLocalEnStorage(uid);

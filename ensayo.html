// contador/pulso, tira pcu) para resolver qué onsets de clave le
// corresponden al instante actual. bpmEf/offset se pasan porque cada
// consumidor los calcula en su propio scope (bpmEfectivo, offset+
// offsetLocalDelta) — acá no se recalculan de nuevo, se reciben ya
// resueltos, para no duplicar ese criterio en un cuarto lugar.
function resolverClaveDeTramo(est, offset, tRel){
  // v3.125: fallback y tramos SIN claveSeccion propia siguen anclando
  // el ciclo al reloj GLOBAL del tema (tRelAncla = tRel, sin cambio de
  // comportamiento) — ver tercer campo devuelto.
  const fallback = { onsets: est.claveOnsetsEfectivo || est.claveOnsets || [], cicloSec: est.claveCicloSecEfectivo || est.claveCicloSec, tRelAncla: tRel };
  // v3.116: (a pedido) el override de sesión a "Sin clave" (valor
  // null, distinto de undefined=sin override) debe seguir ganando
  // sobre la clave GENERAL, pero YA NO sobre una claveSeccion PROPIA
  // de una sección específica — solo un override a una clave
  // ESPECÍFICA (valor truthy) sigue pisando todo, como hasta ahora.
  if(est.claveOverride !== undefined && est.claveOverride !== null) return fallback; // override a clave específica: comportamiento global de siempre
  const bpmEf = est.bpmEfectivo || est.bpm;
  const tramos = recorrerTramosMusico(seccionesRuntimeDe(est), offset, bpmEf, compasEfectivoDe(est), !!est.compasesOverride, factorCompasGeneralDe(est));
  const tramoActual = tramoMusicoEnSegundo(tramos, offset + tRel);
  if(!tramoActual || !tramoActual.claveSeccion || !tramoActual.secPerBar) return fallback;
  const secPerBeatTramo = tramoActual.secPerBar / tramoActual.beats;
  // v3.125: (a pedido) FIX raíz — "la clave va cruzada con el metro"
  // cuando la sección con claveSeccion propia no arranca justo en un
  // borde del ciclo global de 2 compases (por un cambio de compás
  // antes, o simplemente porque el tramo no cae ahí). El ciclo de la
  // clave pasa a anclarse SIEMPRE al INICIO REAL DEL TRAMO
  // (tramoActual.inicioSeg), igual criterio que ya usa barIndex/
  // beatEnBarra — así el ciclo de 2 compases arranca limpio en el
  // primer compás de la sección, sin importar qué pasó antes en el
  // tema. Diagnóstico completo: ver conversación v3.125.
  const tRelAncla = Math.max(0, (offset + tRel) - tramoActual.inicioSeg);
  return {
    onsets: construirOnsetsDesdePatron(tramoActual.claveSeccion, secPerBeatTramo, tramoActual.secPerBar),
    cicloSec: tramoActual.secPerBar * 2,
    tRelAncla
  };
}

function dotsPracticaHtml(uid, compasesPorBarra){

// v3.62: (a pedido) los puntos vuelven a resolución de NEGRAS (uno
// por tiempo, no por corchea) — antes había un punto por corchea, se
// veía muy apretado y las × de clave (que sí caen en posiciones de
// corchea, ej. beatOffset 1.5) quedaban pegadas/tapadas por los
// puntos grandes (fuerte). Ahora los puntos se dibujan en la grilla
// de tiempos (flex, uno por celda) y las × se posicionan aparte, por
// porcentaje absoluto sobre todo el ancho de la tira (según su
// beatOffset real, igual criterio que ya usaba claveFigurasHtml), en
// una franja propia debajo de los puntos — así nunca se superponen,
// aunque la × caiga justo debajo de un punto fuerte.
// v3.61: (a pedido, "nivel 3 ultra plus") tira única que fusiona el
// pulso general y los golpes de clave en un solo widget, reemplazando
// en el HTML los 3 widgets separados (Pulso/Compás 1-2/pistas de
// clave) que quedan arriba (dotsPracticaHtml/claveFigurasHtml) sin
// usarse pero SIN BORRAR, por si se necesita volver atrás. Si hay
// clave activa son 2 compases (todo el ciclo de la célula); si no hay
// clave, es solo 1 compás de pulso. Actualizado en tiempo real desde
// actualizarContadorPractica() (bloque nuevo, no toca los cálculos
// existentes de esa función). Las × reutilizan a propósito el mismo
// id (clavenota-uid-barIdx-posIdx) que ya usaba claveFigurasHtml, así
// el bloque de detección de golpe de clave que ya existía en
// actualizarContadorPractica() (sin tocar) las enciende solo, sin
// necesitar lógica nueva para eso.
// v3.114: (a pedido) plantillas de conteo — antes esta tira se armaba
// UNA sola vez con compasesPorBarra (el compás GENERAL del tema), así
// que una sección con compasOverride a otro compás no tenía la
// cantidad correcta de puntos y el golpe se recortaba contra el
// último (Math.min en actualizarContadorPractica). Ahora se
// pre-generan las plantillas básicas (PCU_BEATS_BASICOS) + el compás
// general (si no está ya en la lista, para no perder compatibilidad
// con compases fuera del vocabulario básico) DENTRO del mismo strip,
// ocultas con CSS, y se activa/oculta la que corresponda por tramo —
// mismo criterio de "no regenerar DOM en caliente" que la clave. Solo
// la plantilla que coincide con el compás GENERAL lleva los
// marcadores de clave (CLAVE_PATRONES asume ese compás) — sin cambio
// respecto al comportamiento de siempre para esa.
function pulsoClaveUnificadoHtml(uid, compasesPorBarra, clave){
  const patron = CLAVE_PATRONES[clave];
  const beatsAMostrar = Array.from(new Set([...PCU_BEATS_BASICOS, compasesPorBarra])).sort((a,b) => a - b);
  // v3.115: (a pedido) TODAS las plantillas pre-generan siempre 2
  // compases de puntos (antes solo la home, y solo si el tema tenía
  // clave GENERAL) — el segundo compás (.pcu-cell-bar2) arranca oculto
  // por CSS (.pcu-tira-1compas) y se muestra en tiempo real desde
  // actualizarContadorPractica() cuando el tramo activo tiene clave
  // (general o propia de la sección) — sin crear/borrar nodos, mismo
  // criterio de "todo pre-armado, solo se activa/oculta" que ya usa
  // .pcu-tira-activa.
  const tiras = beatsAMostrar.map(beats => {
    const esHome = beats === compasesPorBarra;
    const totalTiempos = beats * 2;
    const celdas = Array.from({ length: totalTiempos }).map((_, i) => {
      const fuerte = (i % beats) === 0;
      const claseBar2 = i >= beats ? ' pcu-cell-bar2' : '';
      // v3.205: (a pedido) 3 sub-puntos por celda (1/4, 2/4, 3/4 del
      // tiempo), ocultos por CSS salvo que .pcu-strip tenga la clase
      // subdiv-2 (solo el del medio) o subdiv-4 (los 3) — ver
      // actualizarClasesSubdivPcu(). No reemplazan el punto principal
      // (pcu-dot), se dibujan como capa adicional dentro de la misma
      // celda. Sin subdivisión activa (subdiv=1, caso de siempre) no
      // se ven — cero cambio visual para el 100% de los temas que no
      // usan esta función.
      const subdots = [1,2,3].map(slot =>
        `<span class="pcu-subdot${slot === 2 ? ' pcu-subdot-mid' : ' pcu-subdot-q'}" style="left:${slot * 25}%" id="pcu-subdot-${uid}-${beats}-${i}-${slot}"></span>`
      ).join('');
      return `<div class="pcu-cell${claseBar2}"><span class="pcu-dot ${fuerte ? 'fuerte' : ''}" id="pcu-dot-${uid}-${beats}-${i}"></span>${subdots}</div>`;
    }).join('');
    let notas = '';
    if(esHome && patron){
      notas = patron.map((ladoBeats, barIdx) => ladoBeats.map((beatOffset, posIdx) => {
        const frac = (barIdx * beats + beatOffset) / totalTiempos;
        return `<span class="pcu-x" id="clavenota-${uid}-${barIdx}-${posIdx}" data-frac="${frac}"></span>`;
      }).join('')).join('');
    }
    // v3.122: (a pedido) el color de fondo por tipo de compás no
    // gustaba estéticamente — se deja SIEMPRE el aspecto de la
    // plantilla principal/4/4 (puntos grises en reposo, igual para
    // cualquier compás). PCU_BEATS_COLOR queda definido (por si se
    // quiere reactivar) pero ya no se aplica acá. Lo único que sigue
    // variando el fondo de un círculo es el flash dorado/verde normal
    // de .pcu-dot.activo al pasar el golpe (mismo criterio de siempre,
    // se ve igual en el 1er compás y en el 2do — "segunda vuelta").
    const estiloColor = '';
    // v3.115: arranca en 1 compás salvo la home con clave GENERAL —
    // mismo estado inicial que antes (home+patrón ya mostraba 2
    // compases desde el primer render).
    const clase1CompasInicial = (esHome && patron) ? '' : ' pcu-tira-1compas';
    return `<div class="pcu-tira${esHome ? ' pcu-tira-activa' : ''}${clase1CompasInicial}" id="pcu-tira-${uid}-${beats}" data-beats="${beats}"${estiloColor}>${celdas}${notas}</div>`;
  }).join('');
  return `<div class="pcu-strip" id="pcu-strip-${uid}">${tiras}</div>`;
}

// v3.115: (a pedido) × de clave generadas al vuelo cuando el tramo
// activo declara su PROPIA claveSeccion — la × estática que trae la
// plantilla home usa la clave GENERAL (CLAVE_PATRONES), así que no
// sirve para un patrón distinto por sección. Solo se llama cuando
// cambia el tramo o su patrón (no por frame) — acá se tocan unos
// pocos <span> dentro de la tira activa, no se regenera toda la tira.
function actualizarNotasClaveDinamicasTira(tira, uid, onsets, cicloSec){
  if(!tira) return;
  tira.querySelectorAll('.pcu-x-din').forEach(n => n.remove());
  if(!onsets || !onsets.length || !cicloSec) return;
  onsets.forEach((onsetSec, idx) => {
    const nota = document.createElement('span');
    nota.className = 'pcu-x pcu-x-din';
    nota.id = 'clavenota-' + uid + '-t-' + idx;
    nota.dataset.frac = onsetSec / cicloSec;
    tira.appendChild(nota);
  });
}

// v3.69: mide la posición real (ya renderizada) de los puntos de
// pulso dentro de una tira y ubica cada marcador de clave (.pcu-x)
// exactamente en el centro del punto correspondiente — o interpolado
// entre dos puntos si su beatOffset cae a mitad de camino (ej. 1.5).
// Reemplaza cualquier cálculo por fórmula (calc/%), que era frágil
// ante padding, gaps o tamaños de punto distintos (fuerte vs normal).
function sincronizarNotasClavePulso(uid){
  const strip = document.getElementById('pcu-strip-' + uid);
  if(!strip) return;
  // v3.114: (a pedido) ahora el strip puede tener varias plantillas
  // ocultas dentro (ver pulsoClaveUnificadoHtml) — se escanea SOLO la
  // activa (.pcu-tira-activa). Las ocultas tienen getBoundingClientRect
  // en 0 (display:none) y contaminarían el cálculo si se incluyeran.
  const tiraActiva = strip.querySelector('.pcu-tira-activa');
  if(!tiraActiva) return;
  const dots = tiraActiva.querySelectorAll('.pcu-dot');
  const notas = tiraActiva.querySelectorAll('.pcu-x');
  if(!dots.length || !notas.length) return;
  const stripRect = strip.getBoundingClientRect();
  const centros = Array.from(dots).map(d => {
    const r = d.getBoundingClientRect();
    return (r.left + r.width / 2) - stripRect.left;
  });
  const totalTiempos = centros.length;
  notas.forEach(nota => {
    const frac = parseFloat(nota.dataset.frac);
    if(isNaN(frac)) return;
    const posFloat = frac * totalTiempos;
    const i0 = Math.min(Math.floor(posFloat), totalTiempos - 1);
    const t = posFloat - i0;
    // v3.76: (a pedido, ajuste solo visual — el sonido ya estaba bien)
    // antes, cuando el golpe cae a mitad de camino DESPUÉS del último
    // punto de la tira (ej. "y" de 4, cuando el lado de 3 de la clave
    // es el segundo compás del ciclo de 2), no había un punto
    // "siguiente" real hacia el cual interpolar — i1 se recortaba al
    // mismo índice que i0 y el golpe quedaba pegado exactamente sobre
    // ese último punto en vez de a mitad de camino. Ahora, en ese caso
    // puntual, se extrapola usando el mismo espaciado que ya hay entre
    // los dos últimos puntos reales de la tira, en vez de repetir el
    // último punto — el resto de los casos (con punto siguiente real)
    // no cambia.
    let centroSiguiente;
    if(i0 >= totalTiempos - 1){
      const espaciado = totalTiempos > 1 ? (centros[totalTiempos - 1] - centros[totalTiempos - 2]) : 0;
      centroSiguiente = centros[totalTiempos - 1] + espaciado;
    } else {
      centroSiguiente = centros[i0 + 1];
    }
    const x = centros[i0] + (centroSiguiente - centros[i0]) * t;
    nota.style.left = x + 'px';
    nota.style.transform = 'translateX(-50%)';
    nota.style.opacity = '1';
  });
}

// Recorre todas las tiras pcu-strip actualmente en el DOM y las
// sincroniza — se usa tras un render masivo (lista de sesiones) o
// en resize, ya que el ancho disponible cambia.
function sincronizarTodasLasNotasClave(){
  document.querySelectorAll('.pcu-strip').forEach(strip => {
    const uid = strip.id.replace('pcu-strip-', '');
    sincronizarNotasClavePulso(uid);
  });
}
window.addEventListener('resize', () => requestAnimationFrame(sincronizarTodasLasNotasClave));



// v2.8: figuras simplificadas de la clave — una × por golpe real,
// posicionada proporcionalmente (left %) según su beatOffset dentro
// del compás. Sin silencios ni ligaduras dibujadas (no hay data de
// duración, solo onsets — dibujar eso sería inventar rítmica). Se
// reconstruye cada vez que cambia la clave efectiva (patrón distinto
// según son/rumba/bossa y 2-3/3-2); se encienden en tiempo real en
// actualizarContadorPractica() reusando el mismo idxLocal del click.
function claveFigurasHtml(uid, clave, compasesPorBarra){
  const patron = CLAVE_PATRONES[clave];
  if(!patron) return '';
  // v3.0: ticks en corcheas (2 por tiempo) — tiempo 1 fuerte, resto de
  // tiempos medio, corcheas débiles (el "y") apenas visibles. Solo
  // jerarquía de peso/opacidad en la escala de grises, sin color: el
  // color se reserva para la × activa (evento real), no para la guía.
  const totalTicks = compasesPorBarra * 2;
  const ticks = Array.from({ length: totalTicks }).map((_, i) => {
    const leftPct = (i / totalTicks) * 100;
    const cls = i === 0 ? 'fuerte' : (i % 2 === 0 ? 'medio' : 'debil');
    // v3.14: el tick de comienzo de compás (i===0) lleva id propio por
    // track (barIdx) para poder flashearlo en actualizarContadorPractica
    // — los demás ticks son solo referencia visual, no se togglean.
    return `<span class="clave-tick ${cls}" style="left:${leftPct}%" ${i === 0 ? `id="clavetick0-${uid}-{{BARIDX}}"` : ''}></span>`;
  }).join('');
  return patron.map((ladoBeats, barIdx) => {
    const ticksBarra = ticks.replace('{{BARIDX}}', barIdx);
    const notas = ladoBeats.map((beatOffset, posIdx) => {
      const leftPct = (beatOffset / compasesPorBarra) * 100;
      return `<span class="clave-nota" id="clavenota-${uid}-${barIdx}-${posIdx}" style="left:${leftPct}%">×</span>`;
    }).join('');
    return `<div class="clave-figura-track">${ticksBarra}${notas}</div>`;
  }).join('');
}

// v1.7: bloque de controles compartido (metrónomo + progreso + loop),
// igual para audio y YouTube — solo cambia el reproductor de arriba.
// v1.8: se agrega botón "Usar canción del dispositivo".
// v1.9: línea de BPM/compás visible, y fila de accesos rápidos a
// secciones (scroll horizontal tipo chips, pensada para mobile —
// nada de wrap en varias líneas ni botones chiquitos).
// v3.33: (a pedido) paleta de colores por sección — antes todas las
// secciones se veían del mismo verde (líneas, etiquetas y chips), y
// con varias juntas costaba saber cuál era cuál a simple vista. Ahora
// cada sección tiene su propio color fijo según su posición en la
// lista ordenada por tiempo (sección 1 = color 1, sección 2 = color
// 2, etc., cíclico si hay más secciones que colores) — mismo índice
// usado en los chips de arriba y en el waveform, así el color es
// consistente entre los dos lugares donde se ve la sección.
const PALETA_SECCIONES = ['#4caf7d', '#4a9fd8', '#c9a24b', '#d1784a', '#a374d9', '#d95f8a', '#4bc4c9', '#8fbf4a'];
function colorSeccionPorIndice(i){
  return PALETA_SECCIONES[i % PALETA_SECCIONES.length];
}
// v3.87: (a pedido, ajuste de color compartido — guia-practica.html
// v1.24 "Es igual a") una sección con origenId usa el mismo color que
// su sección de origen, en vez de uno propio por posición — mismo
// criterio que ya aplica guia-practica.html. `lista` es el array YA
// ordenado por tiempo donde se está pintando en cada caso (chips,
// mapa, waveform, PDF, panel de letra); si no hay origenId, o el
// origen no está en esa lista, cae al color por índice de siempre. No
// se edita nada de esto acá — el dato (origenId) ya llega copiado
// desde guia-practica.html junto con el resto de la sección.
function colorDeSeccionEnLista(lista, i){
  const sec = lista[i];
  if(sec && sec.origenId){
    const idxOrigen = lista.findIndex(s => s.id === sec.origenId);
    if(idxOrigen !== -1) return colorSeccionPorIndice(idxOrigen);
  }
  return colorSeccionPorIndice(i);
}
// v3.124: (a pedido) portada 1:1 desde guia-practica.html
// (letraEnsayoSugerida, v1.29/v1.29.5) — misma lógica exacta, sin
// tocar ningún criterio: A/B/C… contando solo secciones con nombre no
// vacío y sin origenId; una sección con origenId comparte la letra de
// su origen (o esa letra + "'" si es esVariacion). Única adaptación:
// acá no existe un global `seccionesEnEdicion` como en el editor, así
// que recibe la lista como parámetro. IMPORTANTE: a diferencia de
// colorDeSeccionEnLista de arriba (que trabaja con la lista YA
// ordenada por tiempo), esta función necesita la lista en su ORDEN
// ORIGINAL de guardado (est.secciones, sin el .sort() que se le aplica
// en dibujarWaveform y otros lados) — es el mismo criterio que usa
// guia-practica.html (seccionesEnEdicion, sin ordenar) para que la
// letra coincida siempre con la que ve el staff en el editor y en el
// PDF, sin importar el orden por desdeSegundos que se use acá para
// dibujar.
function letraEnsayoSugerida(seccionesOriginal, i){
  const s = seccionesOriginal[i];
  if(s && s.origenId){
    const origenIdx = seccionesOriginal.findIndex(x => x.id === s.origenId);
    if(origenIdx >= 0){
      const base = letraEnsayoSugerida(seccionesOriginal, origenIdx);
      return s.esVariacion ? base + '\'' : base;
    }
  }
  let n = 0;
  for(let j = 0; j <= i; j++){
    const sj = seccionesOriginal[j];
    if(!sj || !(sj.nombre || '').trim()) continue;
    if(sj.origenId) continue; // comparte (o deriva con prima) la letra del origen, no cuenta como nueva
    if(j === i) break;
    n++;
  }
  return String.fromCharCode(65 + (n % 26));
}
// v3.124: resuelve la letra FINAL de una sección — manual
// (sec.letraEnsayo, si el staff cargó una a mano) o, si no hay,
// la sugerida (letraEnsayoSugerida) — mismo criterio de prioridad
// que exportarEstructuraPDF() en guia-practica.html
// ((s.letraEnsayo||'').trim() || letraEnsayoSugerida(...)). Recibe
// SIEMPRE la lista en orden original (ver comentario de
// letraEnsayoSugerida) — el llamador es responsable de pasar
// est.secciones, no la copia ordenada por tiempo.
function letraEnsayoDeSeccion(seccionesOriginal, sec){
  const manual = (sec.letraEnsayo || '').trim();
  if(manual) return manual;
  const idx = seccionesOriginal.indexOf(sec);
  return idx >= 0 ? letraEnsayoSugerida(seccionesOriginal, idx) : '';
}
// mezcla un color hex (#rrggbb) con blanco, para el flash de "sección
// actual" — mismo criterio que antes usaba el verde fijo '#c8f5dd'
// (que es --ok mezclado con blanco), ahora generalizado a cualquier
// color de la paleta.
function colorMezclarBlanco(hex, factor){
  const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
  const mix = (c) => Math.round(c + (255 - c) * factor);
  return `#${mix(r).toString(16).padStart(2,'0')}${mix(g).toString(16).padStart(2,'0')}${mix(b).toString(16).padStart(2,'0')}`;
}
// v3.94: (a pedido) contraste automático de texto para chips/bloques
// de sección — con colores claros de la paleta (dorado, verde claro)
// el texto blanco fijo perdía legibilidad. Luminancia relativa
// (fórmula WCAG simplificada): fondo claro → texto casi negro, fondo
// oscuro → texto blanco.
function colorTextoContraste(hex){
  const r = parseInt(hex.slice(1,3), 16) / 255, g = parseInt(hex.slice(3,5), 16) / 255, b = parseInt(hex.slice(5,7), 16) / 255;
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum > 0.6 ? '#1a1a1a' : '#ffffff';
}

function seccionesChipsHtml(uid, secciones, bpm, compasesPorBarra, factorGeneral){
  if(!secciones || !secciones.length) return '';
  const fg = factorGeneral || 1;
  const ordenadas = secciones.slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const chips = ordenadas
    .map((sec, i) => {
      const color = colorDeSeccionEnLista(ordenadas, i);
      const siguiente = ordenadas[i+1] || null;
      const finSec = (sec.hastaSegundos != null) ? sec.hastaSegundos : (siguiente ? siguiente.desdeSegundos : null);
      // v3.130: (a pedido) FIX — secPerBar pasa a calcularse POR SECCIÓN
      // (beatsPorBarraDeSeccionMusico, respeta compasOverride) en vez del
      // compás general fijo del tema. Mismo criterio que ya usa el
      // contador en vivo (recorrerTramosMusico) y el PDF
      // (exportarEstructuraPracticaPDF, v1.81) — antes el chip mostraba
      // "4 c." en una sección de 3/4 que en realidad dura 5 compases.
      // v3.205: (a pedido) FIX de denominador — se suma factorCompasDeSeccion
      // (factor 1 en /4: sin cambio para el catálogo existente).
      const secPerBar = bpm ? (60 / bpm) * beatsPorBarraDeSeccionMusico(sec, compasesPorBarra) * factorCompasDeSeccion(sec, fg, false) : 0;
      const duracion = (secPerBar > 0 && finSec != null) ? Math.max(1, Math.round((finSec - (sec.desdeSegundos||0)) / secPerBar)) : null;
      // v3.94: badge de variación como elemento propio (no prefijo de
      // texto) + duración en compases, mismo dato que ya mostraba el
      // bloque grande — para no tener que mirar el mapa para ubicarse.
      return `<button class="practica-seccion-chip" id="chip-${uid}-${sec.desdeSegundos}" style="--sec-color:${color};--sec-text:${colorTextoContraste(color)}" onclick="onClickBloqueSeccionPractica('${uid}', ${sec.desdeSegundos})">${sec.esVariacion ? '<span class="practica-chip-variacion">🔁</span>' : ''}${escapeHtml(sec.nombre)}${duracion != null ? `<span class="practica-mapa-comp">${duracion} c.</span>` : ''}</button>`;
    })
    .join('');
  return `<div class="practica-secciones-chips">${chips}</div>`;
}

// v3.85: (a pedido) mapa completo del tema — un bloque por sección con
// ancho proporcional a su duración en compases, mismos colores que ya
// usan chip/barra/etiqueta (colorSeccionPorIndice). Tira horizontal con
// scroll (mismo patrón mobile-first que .practica-secciones-chips justo
// arriba) en vez de apilar vertical, para no alargar la pantalla en
// celular. El bloque de la sección que está sonando se resalta desde
// actualizarContadorPractica() (clase .activo, mismo criterio que ya
// usa el chip) — acá solo se arma el HTML estático una vez.
function mapaSeccionesHtml(uid, secciones, bpm, compasesPorBarra, offset, factorGeneral){
  if(!secciones || !secciones.length) return '';
  const fg = factorGeneral || 1;
  const ordenadas = secciones.slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const bloques = ordenadas.map((sec, i) => {
    const siguiente = ordenadas[i+1] || null;
    const finSec = (sec.hastaSegundos != null) ? sec.hastaSegundos : (siguiente ? siguiente.desdeSegundos : null);
    // v3.130: (a pedido) mismo FIX que seccionesChipsHtml — secPerBar
    // por sección (respeta compasOverride) en vez del compás general.
    // v3.205: (a pedido) FIX de denominador — factor 1 en /4: sin cambio.
    const secPerBar = bpm ? (60 / bpm) * beatsPorBarraDeSeccionMusico(sec, compasesPorBarra) * factorCompasDeSeccion(sec, fg, false) : 0;
    const duracion = (secPerBar > 0 && finSec != null) ? Math.max(1, Math.round((finSec - (sec.desdeSegundos||0)) / secPerBar)) : null;
    // v3.98: (a pedido) ancho proporcional a TIEMPOS reales (compases ×
    // pulsos por compás), no a compases crudos — mismo criterio que
    // guia-practica.html (LINEA_TIEMPOS) para que una sección de igual
    // duración "pese" lo mismo visualmente sea cual sea el compás del
    // tema. El factor 1.5 está elegido para que en 4/4 (caso más común,
    // 4 pulsos/compás) el ancho quede IGUAL al de antes (duracion*6 ==
    // tiempos*1.5 cuando compasesPorBarra=4) — solo cambia el resultado
    // para compases distintos de 4/4.
    const tiempos = duracion != null ? duracion * compasesPorBarra : null;
    const anchoMin = tiempos != null ? Math.min(140, Math.max(48, tiempos * 1.5)) : 60;
    const color = colorDeSeccionEnLista(ordenadas, i);
    return `<div class="practica-mapa-bloque" id="mapabloque-${uid}-${sec.desdeSegundos}" style="--sec-color:${color};--sec-text:${colorTextoContraste(color)};min-width:${anchoMin}px;" onclick="onClickBloqueSeccionPractica('${uid}', ${sec.desdeSegundos})">${sec.esVariacion ? '<span class="practica-chip-variacion">🔁</span>' : ''}${escapeHtml(sec.nombre)}${duracion != null ? `<span class="practica-mapa-comp">${duracion} c.</span>` : ''}</div>`;
  }).join('');
  return `<div class="practica-mapa-tema" id="mapatema-${uid}">${bloques}</div>`;
}

// v2.3: el botón de metrónomo libre (toggleMetronomoLibre) queda
// siempre visible en la fila de controles, tenga o no maqueta cargada
// — igual que el botón de click, ya no depende de un modo especial.
// Se excluye mutuamente con la maqueta: activarlo pausa el
// reproductor si estaba sonando (y viceversa), vía
// marcarReproduccionActiva(), para que nunca escriban el contador dos
// relojes a la vez.
// v2.4: acentos por defecto — solo el tiempo 1 fuerte, resto normal.
// Usado al inicializar estadoPractica y al Restablecer.
// v3.150: (a pedido) compasesOverride — mismo patrón que bpmOverride/
// tonalidadOverride/claveOverride: un override de SESIÓN (nunca toca
// Firestore/est.compasesPorBarra) para cuando el archivo local
// cargado está en un compás distinto al configurado en el tema (ej.
// 6/8). compasEfectivoDe(est) es el único punto de lectura — todo el
// código que antes leía est.compasesPorBarra directamente ahora pasa
// por acá, así que loop/waveform/metrónomo/clave siempre coinciden
// entre sí, igual que ya pasa con bpmEfectivo.
// v3.163: (a pedido) DEFINITIVO — reemplaza todo el andamiaje de debug
// v3.159/v3.160 (5 banderas DEBUG_AISLAR_*) por la decisión final: las
// secciones/marcadores de staff están calibradas en segundos contra la
// maqueta oficial y casi nunca calzan en el tiempo con un archivo
// local distinto — con archivo local cargado, secciones se trata como
// vacía (est.secciones real NUNCA se toca ni se pierde, solo se
// ignora en runtime). BPM/compás/tonalidad/clave NO tienen este
// problema (son valores sueltos, no timestamps) y ya tenían su propio
// sistema de overrides de sesión funcionando bien — quedan sin cambios,
// siguen partiendo del valor del tema como punto de partida.
// v3.174: (a pedido) "secciones locales propias" — con archivo local
// cargado, en vez de devolver siempre [] (v3.163), ahora devuelve
// est.seccionesLocales: marcadores que el músico crea a mano para
// ESE archivo específico (ver marcarSeccionLocalPractica más abajo),
// anclados al reloj real del archivo local en vez de a los timestamps
// del tema/maqueta oficial (que es justamente lo que no calzaba).
// est.secciones (las del tema, Firebase) NUNCA se tocan ni se leen
// acá con archivo local — siguen intactas para cuando se vuelve a la
// maqueta oficial. Export a PDF tampoco cambia (sigue leyendo
// est.secciones directo, ver comentario de v3.163).
function seccionesRuntimeDe(est){
  return (est && est.archivoLocalUrl) ? (est.seccionesLocales || []) : (est.secciones || []);
}
function compasEfectivoDe(est){
  return (est.compasesOverride || est.compasesPorBarra);
}
// v3.152: (a pedido) subdivisión del click — multiplicador de sesión
// (1/2/4, nunca toca Firestore) que agrega clicks de RELLENO entre los
// pulsos principales, SIN cambiar la duración del compás ni el valor
// de compasEfectivoDe(est). Los 29 sitios existentes (waveform, loop,
// secciones, clave, PDF) siguen leyendo compasEfectivoDe(est) tal cual
// — la subdivisión solo afecta al scheduler de audio (más clicks
// dentro del mismo compás) y al texto informativo (badge/panel). Con
// el default (1) el comportamiento es idéntico a como era antes de
// v3.152.
function subdivisionDe(est){
  return est.subdivisionOverride || 1;
}
// v3.205: (a pedido) FIX de fondo — hasta ahora el DENOMINADOR del
// compás (tema.compas o compasOverride de sección, ej. "5/8") se
// descartaba en TODOS los cálculos de duración: solo se usaba el
// numerador (beats), asumiendo siempre pulso de negra (denominador 4).
// Esto hacía que cualquier compás no-/4 (5/8, 6/8, etc.) se calculara
// con el DOBLE (u otro múltiplo) de su duración real — afectando
// conteo de compases, regla del waveform, loops Y EL CLICK DE AUDIO
// REAL. factorDenomCompas() centraliza el parseo correcto; para
// cualquier compás en /4 (el 100% del catálogo viejo) devuelve
// exactamente 1 — cero cambio de comportamiento para esos temas.
function factorDenomCompas(compasStr){
  const d = parseInt((compasStr || '').trim().split('/')[1], 10);
  return (d > 0) ? (4 / d) : 1;
}
// Factor general del tema (constante, calculado una vez al cargar el
// tema — ver crearEstadoPracticaParaTema/actualizarUIAlTema — y guardado
// en est.compasFactorGeneral). Con fallback a 1 por si algún estado
// viejo no lo tuviera seteado.
function factorCompasGeneralDe(est){
  return (est && est.compasFactorGeneral) || 1;
}
// Mismo criterio que beatsPorBarraDeSeccionMusico (respeta compasOverride
// de sección, ej. "5/8"), pero para el factor de denominador: si la
// sección tiene su propio compasOverride con denominador propio, ese
// manda; si no, hereda el factor general del tema. forzarGeneral (override
// de sesión) tiene la misma prioridad que ya tiene en beatsPorBarraDeSeccionMusico.
function factorCompasDeSeccion(s, factorGeneral, forzarGeneral){
  if(forzarGeneral) return factorGeneral;
  const ov = ((s && s.compasOverride) || '').trim();
  if(ov && ov.includes('/')) return factorDenomCompas(ov);
  return factorGeneral;
}

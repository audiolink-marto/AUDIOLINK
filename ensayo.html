}
// v1.29.10 del staff: se tipea el ÚLTIMO compás de esta sección
// (inclusive), no el compás donde arranca la próxima — internamente
// hastaSegundos sigue guardando el límite exclusivo de siempre, por
// eso el +1 acá.
function actualizarSeccionLocalHastaCompas(uid, idx, valor){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  const n = parseInt(valor, 10);
  if(!n) { actualizarListaSeccionesLocalesPractica(uid); return; }
  est.seccionesLocales[idx].hastaSegundos = segundosDeCompasLocalPractica(n + 1, est);
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function actualizarSeccionLocalHastaTiempo(uid, idx, txt){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  est.seccionesLocales[idx].hastaSegundos = txt.trim() ? textoASegundosPractica(txt) : null;
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function setSeccionLocalHastaPreset(uid, idx, n){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return;
  est.seccionesLocales[idx].hastaSegundos = (est.seccionesLocales[idx].desdeSegundos || 0) + n * secPerBar;
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function limpiarSeccionLocalHasta(uid, idx){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  est.seccionesLocales[idx].hastaSegundos = null;
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function eliminarSeccionLocalPractica(uid, idx){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales) return;
  est.seccionesLocales.splice(idx, 1);
  // v3.180: el splice corre los índices de las secciones siguientes —
  // se resetea el mapa de colapso (solo UI, nada de datos) para no
  // dejar un índice viejo apuntando a la sección equivocada. Vuelven
  // todas a su estado colapsado por defecto.
  est.seccionesLocalesColapso = {};
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}

// (a pedido) tap-tempo de varios golpes en vez de un solo click — un
// solo click contra un punto lejano ya daba buena precisión, pero
// depende de acertar exacto en UN instante; el tiempo de reacción
// humano (~50-150ms) pesa entero en ese único punto. Tocando un tap
// por cada tiempo 1 que se escucha, el ruido de reacción de cada tap
// es más o menos aleatorio e independiente del de los demás — al medir
// TODOS los compases entre el primer y el último tap de una sola vez
// (no promediando BPMs parciales, que arrastrarían el ruido de cada
// intervalo corto) el error de reacción se diluye entre el tiempo
// total, no entre cada tap individual. Cuenta de compases por
// intervalo: se redondea delta/secPerBarGuia (usando el BPM efectivo
// ANTES de esta calibración como guía) — funciona mientras el error de
// tempo real no sea tan grande como para desviar el redondeo a un
// compás equivocado, que es justo el caso típico (diferencias de
// decimales de BPM, no de BPMs enteros distintos).
function tapCalibracionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(!est.calibTaps) est.calibTaps = [];
  est.calibTaps.push(est.getTiempoActual());
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = `Taps: ${est.calibTaps.length}`;
}

function reiniciarTapCalibracionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.calibTaps = [];
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = 'Taps: 0';
  const info = document.getElementById('offsetlocalbpminfo-' + uid);
  if(info) info.textContent = '';
}

function calcularBpmTapsPractica(uid){
  const est = estadoPractica[uid];
  const info = document.getElementById('offsetlocalbpminfo-' + uid);
  if(!est) return;
  const taps = (est.calibTaps || []).slice().sort((a, b) => a - b);
  if(taps.length < 3){
    if(info) info.textContent = 'Necesitás al menos 3 taps (uno por cada tiempo 1 que escuches) — con más taps y más separados, más preciso.';
    return;
  }
  // v3.205: (a pedido) FIX de denominador — mismo factor que el resto
  // del motor, para que el tap tempo calcule bien también en compases
  // no-/4 (factor 1 en /4: sin cambio).
  const secPerBarGuia = (60 / est.bpmEfectivo) * compasEfectivoDe(est) * factorCompasGeneralDe(est);
  let totalBars = 0;
  for(let i = 1; i < taps.length; i++){
    const delta = taps[i] - taps[i - 1];
    const bars = Math.round(delta / secPerBarGuia);
    if(bars >= 1) totalBars += bars;
  }
  const totalTime = taps[taps.length - 1] - taps[0];
  if(totalBars < 1 || totalTime <= 0){
    if(info) info.textContent = 'No se pudo calcular — probá de nuevo, un tap por cada tiempo 1 (no cada tiempo suelto).';
    return;
  }
  const secPerBarReal = totalTime / totalBars;
  const bpmReal = Math.round(((60 * compasEfectivoDe(est) * factorCompasGeneralDe(est)) / secPerBarReal) * 100) / 100;
  est.bpmOverride = Math.max(30, Math.min(300, bpmReal));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  if(info) info.textContent = `BPM ajustado a ${est.bpmOverride.toFixed(2)} (${taps.length} taps, ${totalBars} compases medidos)`;
  est.calibTaps = [];
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = 'Taps: 0';
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

// (a pedido) ajuste fino del BPM calculado por tap — el ± del panel
// general es de 5 en 5 (pensado para ajustes gruesos) y su slider
// redondea a enteros, así que tocarlos ahí borraría la precisión
// decimal que dio el tap. Este control opera directo sobre
// est.bpmOverride con pasos de 0.5/0.05, y sí actualiza el slider/badge
// del panel general (actualizarUIAjustesPractica) para que no queden
// desincronizados entre sí — solo que sin pasar por su redondeo.
function ajustarBpmFinoPractica(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  const base = est.bpmOverride || est.bpm;
  est.bpmOverride = Math.round(Math.max(30, Math.min(300, base + delta)) * 100) / 100;
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

function fijarBpmLocalPractica(uid){
  const est = estadoPractica[uid];
  const input = document.getElementById('bpmlocalinput-' + uid);
  if(!est || !input) return;
  const valor = parseFloat(input.value);
  if(isNaN(valor)) return;
  est.bpmOverride = Math.max(30, Math.min(300, valor));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

function actualizarUIBpmLocalPractica(uid){
  const est = estadoPractica[uid];
  const el = document.getElementById('bpmlocalval-' + uid);
  if(!est || !el) return;
  const bpm = est.bpmOverride || est.bpm;
  el.textContent = (bpm ? bpm.toFixed(2) : '—') + ' BPM';
}

// v3.16: feedback breve "✓ guardado" junto al valor de BPM — solo para
// los ajustes que efectivamente pasan por guardarAjustesPractica()
// (tap, fino, fijar exacto). Offset y velocidad no persisten, así que
// nunca llaman a esto.
function mostrarGuardadoBpmFino(uid){
  const el = document.getElementById('bpmlocalguardado-' + uid);
  if(!el) return;
  el.textContent = '✓ guardado';
  el.classList.add('visible');
  clearTimeout(el._guardadoTimeoutId);
  el._guardadoTimeoutId = setTimeout(() => el.classList.remove('visible'), 1500);
}

// (a pedido) entrenador de velocidad — solo aplica al <audio> local
// (audioLocal.playbackRate), no afecta el grid del metrónomo para
// nada: nuestro reloj lee audioLocal.currentTime, que siempre
// representa la posición REAL dentro del archivo sin importar a qué
// velocidad se reproduce, así que el semáforo/clave/click siguen
// exactos a cualquier velocidad sin tocar ni una línea de esa lógica.
// Rango 50%-120% (internamente, sigue siendo un factor de velocidad).
// preservesPitch ya se activó al cargar el archivo (ver
// onArchivoLocalElegido) para que sonar más lento no suene grave, solo
// lento.
// v3.202: (a pedido) el control pasa de % a BPM objetivo — el usuario
// piensa en "quiero que suene a X BPM", no en porcentaje. bpmBase es
// el tempo real del tema (est.bpmEfectivo||est.bpm, el mismo valor que
// usa todo el resto del motor); la velocidad sigue siendo
// bpmObjetivo/bpmBase, mismo clamp 50%-120% de siempre.
function bpmBaseVelocidadPractica(est){
  return est.bpmEfectivo || est.bpm || 0;
}

function aplicarVelocidadBpmPractica(uid, bpmObjetivo){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmBase = bpmBaseVelocidadPractica(est);
  if(!bpmBase || !bpmObjetivo || bpmObjetivo <= 0) return;
  const nueva = Math.max(0.5, Math.min(1.2, Math.round((bpmObjetivo / bpmBase) * 100) / 100));
  cambiarVelocidadLocalPractica(uid, nueva);
}

function ajustarVelocidadBpmLocalPractica(uid, deltaBpm){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmBase = bpmBaseVelocidadPractica(est);
  if(!bpmBase) return;
  const bpmActual = bpmBase * (est.velocidadLocal || 1);
  aplicarVelocidadBpmPractica(uid, bpmActual + deltaBpm);
}

function aplicarVelocidadBpmInputPractica(uid){
  const input = document.getElementById('velocidadlocalbpm-' + uid);
  if(!input) return;
  aplicarVelocidadBpmPractica(uid, parseFloat(input.value));
}

function restablecerVelocidadLocalPractica(uid){
  cambiarVelocidadLocalPractica(uid, 1);
}

// v3.48: a diferencia de antes (que solo tocaba audioLocal.playbackRate),
// ahora la velocidad decide QUÉ MOTOR está sonando: a 100% usa Web Audio
// (loop exacto, pero sin preservesPitch — no lo soporta), a cualquier
// otra velocidad usa el <audio> nativo (preservesPitch real, tono
// correcto; el loop vuelve al mecanismo de vigilar-y-saltar de siempre).
// Si Web Audio no llegó a estar listo (todavía decodificando, o falló),
// est.webAudioPlayerLocal es null y esto simplemente se queda en el
// motor nativo sin romper nada.
function cambiarVelocidadLocalPractica(uid, nueva){
  const est = estadoPractica[uid];
  const audioLocal = document.getElementById('local-' + uid);
  if(!est || !audioLocal) return;
  const anterior = est.velocidadLocal || 1;
  est.velocidadLocal = nueva;
  const el = document.getElementById('velocidadlocalbpm-' + uid);
  if(el){
    const bpmBase = bpmBaseVelocidadPractica(est);
    el.value = bpmBase ? formatBpm(bpmBase * nueva) : '';
  }
  const usabaWebAudio = est.audioActivo === est.webAudioPlayerLocal && !!est.webAudioPlayerLocal;
  const debeUsarWebAudio = (nueva === 1) && !!est.webAudioPlayerLocal;
  if(usabaWebAudio === debeUsarWebAudio){
    // mismo motor de antes — si es el nativo, solo actualiza el rate.
    if(!debeUsarWebAudio) audioLocal.playbackRate = nueva;
    return;
  }
  const tActual = est.getTiempoActual ? est.getTiempoActual() : 0;
  const estabaSonando = est.audioActivo && !est.audioActivo.paused;
  if(est.pause) est.pause();
  if(debeUsarWebAudio){
    conectarMotorLocalPractica(uid, est.webAudioPlayerLocal);
    est.seek(tActual);
    aplicarLoopNativoPractica(uid);
  } else {
    audioLocal.playbackRate = nueva;
    conectarMotorLocalPractica(uid, audioLocal);
    est.seek(tActual);
  }
  if(estabaSonando) est.play();
}

// v3.198: (a pedido) paginación de la grilla — antes se armaba TODO
// misTemas filtrado en un solo innerHTML, sin límite. Con pocos temas
// no se nota, pero con 200+ cada re-render (cada tecla en el buscador,
// cada toggle de progreso, etc.) reconstruye cientos de nodos DOM de

const LIMITE_PAGINACION_TEMAS = 60;
let temasRenderizadosLimite = LIMITE_PAGINACION_TEMAS;
function resetPaginacionTemas(){ temasRenderizadosLimite = LIMITE_PAGINACION_TEMAS; }

// v3.189: se guarda cuándo se cargó por última vez, para que
// volverAMisTemas() pueda decidir si hace falta releer Firestore o si
// alcanza con lo que ya está en memoria (ver más abajo).
let misTemasCargadosEn = 0;
async function cargarMisTemas(){
  const cont = document.getElementById('listaTemas');
  const empty = document.getElementById('emptyTemas');
  cont.innerHTML = '<div class="empty">Cargando...</div>';
  empty.style.display = 'none';
  try{
    const correo = auth.currentUser.email;
    const snap = await db.collection('GUIAS2').where('dueño', '==', correo).get();
    misTemas = [];
    snap.forEach(d => misTemas.push({ id: d.id, ...d.data() }));
    misTemas.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
    categoriaActivaFiltro = null;
    resetPaginacionTemas();
    await cargarMisCategorias();
    await cargarMisSetlists();
    poblarFiltroTonalidades();
    filtrarYRenderizarTemas();
    misTemasCargadosEn = Date.now();
  } catch(err){
    console.error('Error cargando tus temas:', err);
    cont.innerHTML = '<div class="empty">No pudimos cargar tus temas.</div>';
  }
}

function renderizarChipsCategoria(){

  const chipTodas = `<button type="button" class="chip-categoria${categoriaActivaFiltro === null ? ' activo' : ''}" onclick="elegirCategoriaFiltroPorIndice(-1)">Todas</button>`;
  // v3.185: se pasa por índice (no por string en el onclick) para no

  ).join('');

function elegirCategoriaFiltroPorIndice(idx){
  const row = document.getElementById('chipsCategoriaRow');
  resetPaginacionTemas();
  if(idx < 0){ categoriaActivaFiltro = null; filtrarYRenderizarTemas(); return; }
  const categorias = JSON.parse(row.dataset.categorias || '[]');
  categoriaActivaFiltro = categorias[idx] ?? null;
  filtrarYRenderizarTemas();
}
function ordenarTemas(lista){
  const copia = lista.slice();
  if(ordenTemasActivo === 'bpm') copia.sort((a, b) => (a.bpm || 0) - (b.bpm || 0));
  else if(ordenTemasActivo === 'reciente') copia.sort((a, b) => (b.creado?.seconds || 0) - (a.creado?.seconds || 0));
  else copia.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
  return copia;
}
// v3.210: (a pedido) texto del badge de clave en la card de la grilla
// — "2-3"/"3-2" para los 6 presets (se extrae del sufijo numérico del
// código, ej. "son23" -> "2-3"), y sin número para un patrón
// personalizado (no hay "2-3" real que mostrar ahí). Sin clave, ''.
function etiquetaClaveBadge(clave){
  const c = (clave || '').trim();
  if(!c) return '';
  const m = /^(?:son|rumba|bossa)([23])([23])$/.exec(c);
  if(m) return `${m[1]}-${m[2]}`;
  return ''; // personalizado: solo se muestra el ícono, sin número
}
function filtrarYRenderizarTemas(){
  const cont = document.getElementById('listaTemas');
  const empty = document.getElementById('emptyTemas');
  const emptyFiltro = document.getElementById('emptyTemasFiltro');
  const buscador = document.getElementById('buscadorTemas');
  if(!cont) return;
  renderizarChipsCategoria();
  const badge = document.getElementById('filtrosContBadge');
  const btnFiltros = document.getElementById('btnAbrirFiltros');
  const nFiltros = contarFiltrosActivos();
  if(badge){ badge.style.display = nFiltros ? 'inline-block' : 'none'; badge.textContent = nFiltros; }
  if(btnFiltros) btnFiltros.classList.toggle('activo', nFiltros > 0);
  if(!misTemas || !misTemas.length){
    cont.innerHTML = '';
    empty.style.display = 'block';
    emptyFiltro.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  const texto = ((buscador && buscador.value) || '').trim().toLowerCase();
  const f = filtrosTemasActivos;
  let filtrados = misTemas.filter(t => {
    const pasaTexto = !texto || (t.nombre || '').toLowerCase().includes(texto);
    const pasaCategoria = categoriaActivaFiltro === null || (t.categoria || '').trim() === categoriaActivaFiltro;
    const pasaCompas = !f.compas || (t.compas || '4/4') === f.compas;
    const pasaTonalidad = !f.tonalidad || (t.tonalidad || '') === f.tonalidad;
    const pasaClave = !f.clave || (t.clave || '') === f.clave;
    const pasaProgreso = !f.progreso || (t.progreso || '') === f.progreso;
    return pasaTexto && pasaCategoria && pasaCompas && pasaTonalidad && pasaClave && pasaProgreso;
  });
  filtrados = ordenarTemas(filtrados);
  if(!filtrados.length){
    cont.innerHTML = '';
    emptyFiltro.style.display = 'block';
    return;
  }
  emptyFiltro.style.display = 'none';
  const totalFiltrados = filtrados.length;
  const visibles = filtrados.slice(0, temasRenderizadosLimite);
  const restantes = totalFiltrados - visibles.length;
  // v3.200: (a pedido) punto 1 de la revisión de código, alcance
  // acotado a ESTA sección (la más tocada últimamente, y donde ya
  // había tenido que escapar comillas a mano en v3.196). En vez de
  // interpolar el id/nombre del tema DENTRO del string de un
  // onclick="...('${t.id}')" (fragil: un nombre con comilla mal
  // escapada rompe el atributo entero y el botón deja de responder
  // sin avisar), cada elemento lleva su data-id/data-nombre/data-accion
  // como atributos normales (el navegador los escapa solo, no hace
  // falta escapar apóstrofes a mano nunca más) y un único listener
  // delegado en #listaTemas (ver manejarClickListaTemas más abajo)
  // decide qué función llamar. Las funciones de destino (abrirTema,
  // renombrarTema, etc.) NO cambian su firma ni su lógica interna.
  cont.innerHTML = visibles.map(t => { const tieneAjustes = temaTieneAjustesSesion(t.id); return `
      <div class="tema-card${tieneAjustes ? ' tiene-ajustes' : ''}" data-accion="abrir-tema" data-id="${t.id}">
        <button class="tema-card-progreso" data-accion="ciclar-progreso" data-id="${t.id}" title="Progreso: click para cambiar">${infoProgreso(t.progreso).emoji}</button>
        ${tieneAjustes ? `<button class="tema-card-ajustes" data-accion="restablecer-ajustes" data-id="${t.id}" data-nombre="${escapeHtml(t.nombre || 'este tema')}" title="Tenés ajustes de sesión guardados en este dispositivo (tempo/tono/clave/compás distintos del original) — click para restablecer">🔧</button>` : ''}
        <button class="tema-card-menubtn" data-accion="toggle-menu" data-id="${t.id}" title="Opciones">⋮</button>
        <div class="tema-card-menu" id="menutema-${t.id}" style="display:none;" data-accion="stop">
          <button data-accion="renombrar-tema" data-id="${t.id}">✏️ Cambiar nombre</button>
          <button data-accion="cambiar-categoria" data-id="${t.id}">🏷️ Cambiar categoría</button>
          <button data-accion="editar-tema" data-id="${t.id}">🛠️ Editar tema</button>
          <button data-accion="duplicar-tema" data-id="${t.id}">📄 Duplicar tema</button>

        ${t.categoria ? `<span class="tema-card-categoria">${escapeHtml(t.categoria)}</span>` : ''}

// v3.200: listener único delegado para toda la grilla de #listaTemas.
// closest('[data-accion]') siempre encuentra el elemento más específico
// primero (un botón adentro de la card gana sobre la card misma), así
// que reemplaza los event.stopPropagation() sueltos que había antes:
// solo se ejecuta UNA acción por click, nunca "sube" a la de afuera.
function manejarClickListaTemas(ev){
  const el = ev.target.closest('[data-accion]');
  if(!el) return;
  const accion = el.dataset.accion;
  const id = el.dataset.id;
  if(accion === 'stop') return; // click en el fondo del menú desplegable: no hace nada
  ev.stopPropagation();
  switch(accion){
    case 'abrir-tema': abrirTema(id); break;
    case 'ciclar-progreso': ciclarProgresoTema(id); break;
    case 'toggle-menu': toggleMenuTema(ev, id); break;
    case 'renombrar-tema': renombrarTema(id); break;
    case 'cambiar-categoria': cambiarCategoriaTema(id); break;
    case 'editar-tema': abrirEditorTema(id); break;
    case 'duplicar-tema': duplicarTema(id); break;
    case 'borrar-tema': borrarTema(id); break;
    case 'restablecer-ajustes': restablecerAjustesSesionDesdeCard(id, el.dataset.nombre); break;
    case 'cargar-mas-temas': cargarMasTemas(); break;
  }
}

function renderizarEditorSetlist(){
  const sl = (misSetlists || []).find(s => s.id === setlistEditorId);

  const titulo = document.getElementById('sheetSetlistEditorTitulo');

  const incluidos = idsIncluidos.map(id => (misTemas || []).find(t => t.id === id)).filter(Boolean);
  const fueraIds = new Set(idsIncluidos);
  const fuera = (misTemas || []).filter(t => !fueraIds.has(t.id));
  const filasIncluidos = incluidos.map((t, i) => `

      <button class="quitar" onclick="quitarTemaDeSetlist('${t.id}')" title="Quitar de la lista">✕</button>
    </div>`).join('');
  const filasFuera = fuera.map(t => `
    <div class="setlist-fila fuera">
      <span class="setlist-fila-nombre">${escapeHtml(t.nombre || 'Tema')}</span>

}
async function _guardarTemaIdsSetlist(nuevosIds){
  const sl = (misSetlists || []).find(s => s.id === setlistEditorId);
  if(!sl) return;
  try{
    await db.collection('SETLISTS2').doc(setlistEditorId).set({ temaIds: nuevosIds }, { merge: true });
    sl.temaIds = nuevosIds;
    renderizarEditorSetlist();
  }catch(err){
    console.error('No se pudo actualizar la lista:', err);
    mostrarToast('No se pudo guardar el cambio en la lista. Intenta de nuevo.', 'error');
  }
}
function agregarTemaASetlist(temaId){
  const sl = (misSetlists || []).find(s => s.id === setlistEditorId);
  if(!sl) return;
  const ids = (sl.temaIds || []).slice();
  if(ids.includes(temaId)) return;
  ids.push(temaId);
  _guardarTemaIdsSetlist(ids);
}
function quitarTemaDeSetlist(temaId){
  const sl = (misSetlists || []).find(s => s.id === setlistEditorId);
  if(!sl) return;
  _guardarTemaIdsSetlist((sl.temaIds || []).filter(id => id !== temaId));
}
function moverTemaEnSetlist(indice, delta){
  const sl = (misSetlists || []).find(s => s.id === setlistEditorId);
  if(!sl) return;
  const ids = (sl.temaIds || []).slice();
  const destino = indice + delta;
  if(destino < 0 || destino >= ids.length) return;
  [ids[indice], ids[destino]] = [ids[destino], ids[indice]];
  _guardarTemaIdsSetlist(ids);
}
function practicarDesdeSetlist(){
  const sl = (misSetlists || []).find(s => s.id === setlistEditorId);

// ============ v3.188: MODALES PROPIOS (reemplazan prompt/confirm) ============
// Dos helpers basados en promesas, para que el código que los llama se
// lea igual que antes (const x = await pedirTexto(...)) sin rehacer la
// lógica de cada acción. Un solo modal de cada tipo en el DOM; la
// promesa pendiente se guarda en _resolverModal* y se limpia siempre al
// cerrar, así no quedan promesas colgadas si el músico cancela.
let _resolverModalTexto = null;
let _resolverModalConfirm = null;
function pedirTexto({ titulo, valor, okTexto }){
  return new Promise(resolve => {
    _resolverModalTexto = resolve;
    const tit = document.getElementById('modalTextoTitulo');
    const inp = document.getElementById('modalTextoInput');
    const ov  = document.getElementById('modalTextoOverlay');
    if(tit) tit.textContent = titulo || 'Editar';
    if(inp) inp.value = valor || '';
    const btnOk = document.querySelector('#modalTextoOverlay .btn');
    if(btnOk) btnOk.textContent = okTexto || 'Guardar';
    if(ov) ov.classList.add('abierto');
    // focus diferido: el overlay recién pasa a display:flex en este
    // mismo frame, y focus() sobre un elemento oculto no hace nada.
    setTimeout(() => { if(inp){ inp.focus(); inp.select(); } }, 30);
  });
}
function resolverModalTexto(valor){
  const ov = document.getElementById('modalTextoOverlay');
  if(ov) ov.classList.remove('abierto');
  const fn = _resolverModalTexto;
  _resolverModalTexto = null;
  if(fn) fn(valor === null || valor === undefined ? null : valor);
}
// v3.197: (a pedido) reemplaza los alert() de error/aviso. No
// bloqueante, se apila si hay más de uno, se autodescarta a los 4.2s
// (o al tocarlo). tipo: 'error' (rojo, para los "no se pudo...") o
// 'info' (dorado, para avisos tipo "cuidado, ya existe un tema con
// ese nombre"). Por defecto 'info' para no asustar con rojo cosas que
// no son errores de verdad.
function mostrarToast(mensaje, tipo){
  const stack = document.getElementById('toastStack');
  if(!stack){ console.warn('[toast]', mensaje); return; }
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'error' ? ' error' : '');
  el.textContent = mensaje;
  const quitar = () => {
    el.classList.add('saliendo');
    setTimeout(() => el.remove(), 200);
  };
  el.addEventListener('click', quitar);
  stack.appendChild(el);
  requestAnimationFrame(() => el.classList.add('visible'));
  setTimeout(quitar, 4200);
}
function pedirConfirmacion({ titulo, mensaje, okTexto, peligro }){
  return new Promise(resolve => {
    _resolverModalConfirm = resolve;
    const tit = document.getElementById('modalConfirmTitulo');
    const msg = document.getElementById('modalConfirmMsg');
    const btn = document.getElementById('modalConfirmOkBtn');
    const ov  = document.getElementById('modalConfirmOverlay');
    if(tit) tit.textContent = titulo || '¿Confirmás?';
    if(msg){ msg.textContent = mensaje || ''; msg.style.display = mensaje ? 'block' : 'none'; }
    if(btn){ btn.textContent = okTexto || 'Confirmar'; btn.classList.toggle('peligro', !!peligro); }
    if(ov) ov.classList.add('abierto');
  });
}
function resolverModalConfirm(ok){
  const ov = document.getElementById('modalConfirmOverlay');
  if(ov) ov.classList.remove('abierto');
  const fn = _resolverModalConfirm;
  _resolverModalConfirm = null;
  if(fn) fn(!!ok);
}
// Escape cierra el modal que esté arriba (confirm primero, porque puede
// abrirse encima del sheet de categorías).
document.addEventListener('keydown', (ev) => {
  if(ev.key !== 'Escape') return;
  if(_resolverModalConfirm){ resolverModalConfirm(false); return; }
  if(_resolverModalTexto){ resolverModalTexto(null); }
});

// ============ v3.188: RESPALDO DE LA LIBRERÍA ============
// Todo se arma en el navegador desde misTemas/misCategorias (ya en
// memoria) — no hay lectura extra a Firestore ni descarga de audio: del
// audio se guarda solo la URL de Cloudinary.
function abrirSheetRespaldo(){
  const ov = document.getElementById('sheetRespaldoOverlay');
  if(ov) ov.classList.add('abierto');
}
function cerrarSheetRespaldo(){
  const ov = document.getElementById('sheetRespaldoOverlay');
  if(ov) ov.classList.remove('abierto');
}
function _descargarArchivoTexto(nombre, contenido, mime){
  try{
    const blob = new Blob([contenido], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // revoke diferido: en algunos navegadores móviles revocar en el
    // mismo tick cancela la descarga recién disparada.
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(err){
    console.error('No se pudo generar el archivo de respaldo:', err);
    mostrarToast('No se pudo generar el archivo. Intenta de nuevo.', 'error');
  }
}
function _selloFechaRespaldo(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function descargarRespaldoJSON(){
  const correo = (auth.currentUser && auth.currentUser.email) || '';
  const data = {
    app: 'audiolink-ensayo',
    version: '3.191',
    exportado: new Date().toISOString(),
    dueño: correo,
    categorias: (misCategorias || []).map(c => ({ nombre: c.nombre || '' })),
    temas: (misTemas || []).map(t => ({
      nombre: t.nombre || '',
      bpm: (t.bpm === 0 || t.bpm) ? t.bpm : null,
      compas: t.compas || '',
      tonalidad: t.tonalidad || '',
      clave: t.clave || '',
      categoria: t.categoria || '',
      offset: t.offset || 0,
      secciones: t.secciones || [],
      progreso: t.progreso || '',
      notas: t.notas || '',
      audioUrl: t.audioUrl || ''
    })),
    // v3.191: las listas se exportan por NOMBRE de tema (no por id, que
    // no tiene sentido fuera de esta cuenta/proyecto) — así, importar
    // el respaldo en otra cuenta puede reconstruir la lista si los
    // nombres de los temas coinciden.
    setlists: (misSetlists || []).map(sl => ({
      nombre: sl.nombre || '',
      temaNombres: (sl.temaIds || []).map(id => ((misTemas || []).find(t => t.id === id) || {}).nombre || '').filter(Boolean)
    }))
  };
  _descargarArchivoTexto(`audiolink-ensayo-${_selloFechaRespaldo()}.json`, JSON.stringify(data, null, 2), 'application/json');
  cerrarSheetRespaldo();
}
function _csvCampo(v){
  const s = (v === null || v === undefined) ? '' : String(v);
  return '"' + s.replace(/"/g, '""') + '"';
}
function descargarRespaldoCSV(){
  const cab = ['Nombre', 'BPM', 'Compás', 'Tonalidad', 'Clave', 'Categoría', 'Progreso', 'Notas', 'Secciones', 'AudioUrl'];
  const filas = (misTemas || []).map(t => [
    t.nombre || '',
    (t.bpm === 0 || t.bpm) ? t.bpm : '',
    t.compas || '',
    t.tonalidad || '',
    t.clave || '',
    t.categoria || '',
    infoProgreso(t.progreso).texto,
    t.notas || '',
    (t.secciones || []).length,
    t.audioUrl || ''
  ].map(_csvCampo).join(','));
  // BOM al inicio para que Excel abra bien los acentos.
  const csv = '\ufeff' + [cab.map(_csvCampo).join(',')].concat(filas).join('\r\n');
  _descargarArchivoTexto(`audiolink-ensayo-${_selloFechaRespaldo()}.csv`, csv, 'text/csv');
  cerrarSheetRespaldo();
}

// ============ v3.190: IMPORTAR RESPALDO ============
// Lee el JSON de descargarRespaldoJSON() (mismo formato, campo
// "version"). Match por NOMBRE de tema, no por id (el id de Firestore
// no viaja de forma útil entre respaldos/cuentas). Reglas, a propósito
// conservadoras:
// - Tema con nombre YA existente en la librería -> se actualiza por
//   merge: bpm/compás/tonalidad/clave/categoría/offset/secciones.
//   El audioUrl del JSON NUNCA se copia sobre el ya guardado — el
//   respaldo no contiene el audio en sí, y pisar la URL dejaría el
//   tema sin sonido si el archivo es de otra cuenta/dispositivo.
// - Tema con nombre NUEVO -> se crea el documento en GUIAS2 con
//   audioUrl:null (el músico va a tener que subirle el audio, igual
//   que "Subir nuevo tema").
// - Categorías del JSON que no existan en CATEGORIAS2 -> se crean.
// Nombres duplicados DENTRO del mismo archivo importado no se
// contemplan especialmente: el primero que aparece decide si hay match
// o no, y los siguientes con el mismo nombre matchean contra el mismo
// tema ya tocado (comportamiento razonable, no se complica más).
async function onArchivoImportarElegido(files){
  const file = files && files[0];
  if(!file) return;
  const inputEl = document.getElementById('inputImportarRespaldo');
  const estadoEl = document.getElementById('importarRespaldoEstado');
  const mostrarEstado = (txt) => { if(estadoEl){ estadoEl.style.display = 'block'; estadoEl.textContent = txt; } };
  try{
    const texto = await file.text();
    const data = JSON.parse(texto);
    if(!data || !Array.isArray(data.temas)){
      mostrarToast('Este archivo no tiene el formato esperado (¿es un JSON exportado desde acá?).', 'error');
      return;
    }
    const nSetlists = Array.isArray(data.setlists) ? data.setlists.length : 0;
    const okImportar = await pedirConfirmacion({
      titulo: 'Importar respaldo',
      mensaje: `Se van a crear o actualizar ${data.temas.length} tema(s)${nSetlists ? ` y ${nSetlists} lista(s)` : ''} a partir de "${file.name}". El audio ya guardado no se reemplaza.`,
      okTexto: 'Importar'
    });
    if(!okImportar) return;

    mostrarEstado('Importando...');
    const correo = auth.currentUser.email;

    // 1) categorías nuevas primero, para poder asignarlas a los temas.
    const nombresCatExistentes = new Set((misCategorias || []).map(c => (c.nombre || '').toLowerCase()));
    const catsDelArchivo = Array.from(new Set((data.categorias || []).map(c => (c.nombre || '').trim()).filter(Boolean)));
    let categoriasCreadas = 0;
    for(const nombreCat of catsDelArchivo){
      if(nombresCatExistentes.has(nombreCat.toLowerCase())) continue;
      try{
        const docRef = await db.collection('CATEGORIAS2').add({
          dueño: correo, nombre: nombreCat, creado: firebase.firestore.FieldValue.serverTimestamp()
        });
        misCategorias.push({ id: docRef.id, dueño: correo, nombre: nombreCat });
        nombresCatExistentes.add(nombreCat.toLowerCase());
        categoriasCreadas++;
      }catch(err){ console.error('No se pudo crear la categoría importada "' + nombreCat + '":', err); }
    }
    misCategorias.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

    // 2) temas: update por nombre si existe, create si no.
    let actualizados = 0, creados = 0, fallidos = 0;
    for(const t of data.temas){
      const nombre = (t.nombre || '').trim();
      if(!nombre) continue;
      const camposComunes = {
        bpm: (t.bpm === 0 || t.bpm) ? t.bpm : 120,
        compas: t.compas || '4/4',
        tonalidad: t.tonalidad || '',
        clave: t.clave || null,
        categoria: t.categoria || '',
        offset: t.offset || 0,
        secciones: Array.isArray(t.secciones) ? t.secciones : [],
        progreso: t.progreso || '',
        notas: t.notas || ''
      };
      const existente = (misTemas || []).find(m => (m.nombre || '').toLowerCase() === nombre.toLowerCase());
      try{
        if(existente){
          // v3.190: audioUrl a propósito NO va en este set() — se deja
          // el que ya tenía el tema en Firestore, intacto.
          await db.collection('GUIAS2').doc(existente.id).set(camposComunes, { merge: true });
          Object.assign(existente, camposComunes);
          actualizados++;
        } else {
          const docRef = await db.collection('GUIAS2').add({
            dueño: correo, nombre, ...camposComunes, audioUrl: null,
            creado: firebase.firestore.FieldValue.serverTimestamp()
          });
          misTemas.push({ id: docRef.id, dueño: correo, nombre, ...camposComunes, audioUrl: null });
          creados++;
        }
      }catch(err){
        console.error('No se pudo importar el tema "' + nombre + '":', err);
        fallidos++;
      }
    }
    misTemas.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
    poblarFiltroTonalidades();
    filtrarYRenderizarTemas();

    // 3) v3.191: listas — vienen por NOMBRE de tema en el JSON (los ids
    // de Firestore de otro respaldo no sirven acá). Se resuelven contra
    // misTemas YA actualizado por el paso 2 de arriba, así que un tema
    // recién creado en esta misma importación también puede quedar en
    // su lista. Nombre de lista existente -> se reemplaza su temaIds
    // (mismo criterio "el archivo manda" que ya usan bpm/compás/etc. en
    // los temas); nombre nuevo -> se crea la lista.
    let setlistsCreadas = 0, setlistsActualizadas = 0;
    for(const sl of (data.setlists || [])){
      const nombreLista = (sl.nombre || '').trim();
      if(!nombreLista) continue;
      const idsResueltos = (sl.temaNombres || [])
        .map(n => ((misTemas || []).find(m => (m.nombre || '').toLowerCase() === (n || '').toLowerCase()) || {}).id)
        .filter(Boolean);
      const existenteSl = (misSetlists || []).find(s => (s.nombre || '').toLowerCase() === nombreLista.toLowerCase());
      try{
        if(existenteSl){
          await db.collection('SETLISTS2').doc(existenteSl.id).set({ temaIds: idsResueltos }, { merge: true });
          existenteSl.temaIds = idsResueltos;
          setlistsActualizadas++;
        } else {
          const docRef = await db.collection('SETLISTS2').add({
            dueño: correo, nombre: nombreLista, temaIds: idsResueltos,
            creado: firebase.firestore.FieldValue.serverTimestamp()
          });
          misSetlists.push({ id: docRef.id, dueño: correo, nombre: nombreLista, temaIds: idsResueltos });
          setlistsCreadas++;
        }
      }catch(err){ console.error('No se pudo importar la lista "' + nombreLista + '":', err); }
    }
    misSetlists.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

    let resumen = `Listo: ${creados} tema(s) nuevo(s), ${actualizados} actualizado(s)`;
    if(categoriasCreadas) resumen += `, ${categoriasCreadas} categoría(s) nueva(s)`;
    if(setlistsCreadas || setlistsActualizadas) resumen += `, ${setlistsCreadas} lista(s) nueva(s) y ${setlistsActualizadas} actualizada(s)`;
    if(fallidos) resumen += `. ${fallidos} tema(s) no se pudieron importar (ver consola).`;
    if(creados > 0) resumen += ' Los temas nuevos quedan sin audio propio: hay que subírselo (borrar y volver a subir con el mismo nombre, o esperar una futura opción de "reemplazar audio").';
    mostrarEstado(resumen);
  }catch(err){
    console.error('No se pudo leer el archivo de respaldo:', err);
    mostrarToast('No se pudo leer ese archivo. ¿Es un JSON válido exportado desde acá?', 'error');
  }finally{
    if(inputEl) inputEl.value = '';
  }
}

// ============ v3.188: CAMBIO RÁPIDO DE TEMA (botón ⇄ en práctica) ============
// Antes, estando dentro de un tema, la única forma de ir a otro era
// volver a la grilla. Este sheet filtra misTemas en memoria y llama a
// abrirTema() directo, que ya se encarga de reconstruir todo el bloque
// de práctica (no se duplica nada de esa lógica acá).
function abrirSelectorTema(){
  const buscador = document.getElementById('sheetTemaBuscador');
  if(buscador) buscador.value = '';
  renderizarSheetTemas();
  const ov = document.getElementById('sheetTemaOverlay');
  if(ov) ov.classList.add('abierto');
}
function cerrarSelectorTema(){
  const ov = document.getElementById('sheetTemaOverlay');
  if(ov) ov.classList.remove('abierto');
}
function renderizarSheetTemas(){
  const lista = document.getElementById('sheetTemaLista');
  if(!lista) return;
  const texto = normalizarTxtPractica(((document.getElementById('sheetTemaBuscador') || {}).value || ''));
  const filtrados = (misTemas || []).filter(t => {
    if(!texto) return true;
    return normalizarTxtPractica(t.nombre || '').includes(texto)
        || normalizarTxtPractica(t.categoria || '').includes(texto);
  });
  if(!filtrados.length){
    lista.innerHTML = '<div class="sheet-opcion-vacia">Ningún tema coincide con la búsqueda.</div>';
    return;
  }
  lista.innerHTML = filtrados.map(t => {
    const esActual = t.id === temaActualId;
    const meta = `${formatBpm(t.bpm)} BPM · ${escapeHtml(t.compas || '4/4')}${t.categoria ? ' · ' + escapeHtml(t.categoria) : ''}`;
    return `
    <button type="button" class="sheet-tema-opcion${esActual ? ' activo' : ''}"${esActual ? '' : ` onclick="elegirTemaDesdeSheet('${t.id}')"`}>
      <span>${escapeHtml(t.nombre || 'Tema')}${esActual ? ' ✓' : ''}</span>
      <span class="sheet-tema-meta">${meta}</span>
    </button>`;
  }).join('');
}
function elegirTemaDesdeSheet(temaId){
  cerrarSelectorTema();
  // v3.191: si había una lista activa y el tema elegido sigue siendo
  // parte de ella, no se pierde el contexto (la barra ◀▶ sigue viva).
  // Si es un tema fuera de la lista, abrirTema(id) sin el 2do
  // parámetro ya limpia setlistActivaId por su cuenta.
  const slActiva = (misSetlists || []).find(s => s.id === setlistActivaId);
  const sigueEnLaLista = slActiva && (slActiva.temaIds || []).includes(temaId);
  abrirTema(temaId, sigueEnLaLista);
}

// v3.191: (a pedido) estado de progreso por tema (🔴 por aprender /
// 🟡 en proceso / 🟢 listo). Campo nuevo "progreso" en GUIAS2, string
// vacío = sin marcar (mismo criterio que "categoria"). Un tap en el
// badge de la tarjeta cicla al siguiente estado — sin abrir ningún
// sheet, porque es algo que se marca muy seguido.
const ORDEN_PROGRESO = ['', 'aprender', 'proceso', 'listo'];
function infoProgreso(valor){
  switch(valor){
    case 'aprender': return { emoji: '🔴', texto: 'Por aprender' };
    case 'proceso':  return { emoji: '🟡', texto: 'En proceso' };
    case 'listo':    return { emoji: '🟢', texto: 'Listo' };
    default:         return { emoji: '⚪', texto: 'Sin marcar' };
  }
}
async function ciclarProgresoTema(temaId){
  const tema = (misTemas || []).find(t => t.id === temaId);
  if(!tema) return;
  const idx = ORDEN_PROGRESO.indexOf(tema.progreso || '');
  const nuevo = ORDEN_PROGRESO[(idx + 1) % ORDEN_PROGRESO.length];
  try{
    await db.collection('GUIAS2').doc(temaId).set({ progreso: nuevo }, { merge: true });
    tema.progreso = nuevo;
    filtrarYRenderizarTemas();
  }catch(err){
    console.error('No se pudo cambiar el progreso:', err);
    mostrarToast('No se pudo cambiar el progreso. Intenta de nuevo.', 'error');
  }
}

// v3.191: (a pedido) duplicar tema — crea una copia con el MISMO
// audioUrl (no vuelve a subir nada a Cloudinary; ambos temas apuntan
// al mismo archivo en la nube, que es justo lo que se busca para
// variaciones del mismo tema a otro BPM/tonalidad). Copia BPM, compás,
// tonalidad, clave, categoría; secciones/offset/progreso/notas NO se
// copian — son ajustes de práctica específicos que probablemente no
// apliquen igual a la variación.
async function duplicarTema(temaId){
  const tema = (misTemas || []).find(t => t.id === temaId);
  if(!tema) return;
  const okDup = await pedirConfirmacion({
    titulo: `¿Duplicar "${tema.nombre || 'este tema'}"?`,
    mensaje: 'Se crea una copia con el mismo audio. Podés cambiarle nombre, BPM, etc. sin afectar el original.',
    okTexto: 'Duplicar'
  });
  if(!okDup) return;
  try{
    const nombreCopia = (tema.nombre || 'Tema') + ' (copia)';
    const datosCopia = {
      dueño: auth.currentUser.email,
      nombre: nombreCopia,
      bpm: tema.bpm, compas: tema.compas || '4/4',
      tonalidad: tema.tonalidad || '', clave: tema.clave || null,
      categoria: tema.categoria || '',
      offset: 0, secciones: [], progreso: '', notas: '',
      audioUrl: tema.audioUrl || null,
      creado: firebase.firestore.FieldValue.serverTimestamp()
    };
    const docRef = await db.collection('GUIAS2').add(datosCopia);
    misTemas.push({ id: docRef.id, ...datosCopia });
    misTemas.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
    filtrarYRenderizarTemas();
  }catch(err){
    console.error('No se pudo duplicar el tema:', err);
    mostrarToast('No se pudo duplicar el tema. Intenta de nuevo.', 'error');
  }
}

  try{

async function borrarTema(temaId){
  const tema = (misTemas || []).find(t => t.id === temaId);
  if(!tema) return;
  // v3.188: confirm() nativo -> modal propio.
  const okBorrar = await pedirConfirmacion({
    titulo: `¿Borrar "${tema.nombre || 'este tema'}"?`,
    mensaje: 'Esta acción no se puede deshacer.',
    okTexto: 'Borrar tema',
    peligro: true
  });
  if(!okBorrar) return;
  try{
    await db.collection('GUIAS2').doc(temaId).delete();
    misTemas = (misTemas || []).filter(t => t.id !== temaId);
    // v3.185: si el tema borrado era el que había quedado persistido
    // como "abierto" (ver restaurarTemaAbiertoSiCorresponde), se limpia
    // — si no, un reload futuro intentaría reabrir un tema que ya no
    // existe.
    let idPersistido = null;
    try{ idPersistido = localStorage.getItem(claveTemaActualPersistido()); }catch(e){}
    if(idPersistido === temaId) limpiarTemaActualPersistido();
    filtrarYRenderizarTemas();
  } catch(err){
    console.error('No se pudo borrar el tema:', err);
    mostrarToast('No se pudo borrar el tema. Intenta de nuevo.', 'error');
  }
}

// v3.185: motor del bottom sheet de categorías — compartido entre
// "Subir nuevo tema" (guarda en nuevoTemaCategoriaSeleccionada, se lee
// recién al confirmar la subida) y "🏷️ Cambiar categoría" de un tema
// ya existente (guarda directo en Firestore vía guardarCategoriaEnTema).
// sheetCategoriaContexto guarda hacia dónde va la selección.
let nuevoTemaCategoriaSeleccionada = '';
let sheetCategoriaContexto = { modo: null, temaId: null };
// v3.206: contexto en memoria del sheet "Editar tema" — se llena al
// abrirlo (abrirEditorTema) y se lee al guardar (confirmarEditarTema).
// La categoría elegida en el sub-sheet de categorías (modo 'editar' de
// elegirCategoriaDesdeSheet) también se guarda acá, NO se escribe a
// Firestore hasta confirmar el editor completo.
let editarTemaContexto = { temaId: null, categoriaSeleccionada: '' };
function abrirSelectorCategoria(modo, temaId){
  sheetCategoriaContexto = { modo, temaId: temaId || null };
  // v3.188: modo 'gestion' — el mismo sheet, pero como editor puro:
  // cambia el título y se oculta "Sin categoría" (no hay nada a lo que
  // asignar). Los modos 'tema' y 'subir' siguen exactamente igual.
  const titulo = document.getElementById('sheetCategoriaTitulo');
  if(titulo) titulo.textContent = (modo === 'gestion') ? 'Mis categorías' : 'Elegir categoría';
  const sinBtn = document.getElementById('sheetCategoriaSinBtn');
  // v3.206: modo 'editar' (desde el editor completo de tema) se
  // comporta como 'tema'/'subir' en cuanto a mostrar "Sin categoría".
  if(sinBtn) sinBtn.style.display = (modo === 'gestion') ? 'none' : '';
  const buscador = document.getElementById('sheetCategoriaBuscador');
  const nueva = document.getElementById('sheetCategoriaNuevaInput');
  if(buscador) buscador.value = '';
  if(nueva) nueva.value = '';
  renderizarSheetCategorias();
  const overlay = document.getElementById('sheetCategoriaOverlay');
  if(overlay) overlay.classList.add('abierto');
}
function cerrarSelectorCategoria(){
  const overlay = document.getElementById('sheetCategoriaOverlay');
  if(overlay) overlay.classList.remove('abierto');
}
function renderizarSheetCategorias(){
  const lista = document.getElementById('sheetCategoriaLista');
  if(!lista) return;
  const texto = ((document.getElementById('sheetCategoriaBuscador') || {}).value || '').trim().toLowerCase();
  const esGestion = sheetCategoriaContexto.modo === 'gestion';
  const actual = sheetCategoriaContexto.modo === 'tema'
    ? ((misTemas || []).find(t => t.id === sheetCategoriaContexto.temaId) || {}).categoria || ''
    // v3.206: modo 'editar' — la categoría "actual" vive en el
    // contexto del editor (editarTemaContexto), no en misTemas ni en
    // nuevoTemaCategoriaSeleccionada.
    : (sheetCategoriaContexto.modo === 'editar' ? editarTemaContexto.categoriaSeleccionada
    : (esGestion ? '' : nuevoTemaCategoriaSeleccionada));
  const filtradas = (misCategorias || []).filter(c => !texto || (c.nombre || '').toLowerCase().includes(texto));
  if(!filtradas.length){
    lista.innerHTML = `<div class="sheet-opcion-vacia">${(misCategorias || []).length ? 'Ninguna categoría coincide con la búsqueda.' : 'Todavía no creaste ninguna categoría. Escribí el nombre abajo para crear la primera.'}</div>`;
    return;
  }
  // v3.188: en modo 'gestion' el botón grande no asigna nada — muestra
  // cuántos temas usan la categoría y queda inerte; las acciones reales
  // son ✏️ y 🗑️, que son las mismas de v3.186.
  lista.innerHTML = filtradas.map(c => {
    const usos = (misTemas || []).filter(t => (t.categoria || '') === c.nombre).length;
    return `
    <div class="sheet-opcion-row">
      <button type="button" class="sheet-opcion${actual === c.nombre ? ' activo' : ''}"${esGestion ? ' style="cursor:default;"' : ` onclick="elegirCategoriaDesdeSheet('${c.id}')"`}>
        <span>${escapeHtml(c.nombre)}</span>${esGestion ? `<span style="font-size:0.74rem;opacity:0.7;">${usos} tema${usos === 1 ? '' : 's'}</span>` : (actual === c.nombre ? '<span>✓</span>' : '')}
      </button>
      <button type="button" class="sheet-opcion-editar" title="Renombrar" onclick="event.stopPropagation(); renombrarCategoriaDesdeSheet('${c.id}')">✏️</button>
      <button type="button" class="sheet-opcion-editar" title="Borrar" onclick="event.stopPropagation(); borrarCategoriaDesdeSheet('${c.id}')">🗑️</button>
    </div>`;
  }).join('');
}
// v3.186: (a pedido) editor de categorías — renombrar/borrar desde el
// mismo sheet. Al borrar una que ya tienen temas asignados, esos temas
// quedan "Sin categoría" (categoria:'') — no se bloquea el borrado ni
// se pide reasignar antes.
async function renombrarCategoriaDesdeSheet(categoriaId){
  const cat = (misCategorias || []).find(c => c.id === categoriaId);
  if(!cat) return;
  // v3.188: prompt() nativo -> modal propio (se abre por encima del
  // sheet de categorías, que queda visible detrás).
  const nuevoNombre = await pedirTexto({ titulo: 'Nuevo nombre de la categoría', valor: cat.nombre || '' });
  if(nuevoNombre === null) return;
  const limpio = nuevoNombre.trim();
  if(!limpio || limpio === cat.nombre) return;
  const yaExiste = (misCategorias || []).some(c => c.id !== categoriaId && (c.nombre || '').toLowerCase() === limpio.toLowerCase());
  if(yaExiste){ mostrarToast('Ya existe una categoría con ese nombre.', 'info'); return; }
  const nombreViejo = cat.nombre;
  try{
    await db.collection('CATEGORIAS2').doc(categoriaId).set({ nombre: limpio }, { merge: true });
    cat.nombre = limpio;
    misCategorias.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
    // v3.186: renombrar la categoría también actualiza el string
    // 'categoria' ya guardado en cada tema que la tenía asignada — si
    // no, el tema quedaría con el nombre viejo (huérfano, invisible en
    // los chips de filtro que salen de misCategorias). Se actualiza en
    // Firestore y en memoria (misTemas), un doc a la vez.
    const temasAfectados = (misTemas || []).filter(t => (t.categoria || '') === nombreViejo);
    await Promise.all(temasAfectados.map(t =>
      db.collection('GUIAS2').doc(t.id).set({ categoria: limpio }, { merge: true }).then(() => { t.categoria = limpio; })
    ));
    renderizarSheetCategorias();
    filtrarYRenderizarTemas();
  } catch(err){
    console.error('No se pudo renombrar la categoría:', err);
    mostrarToast('No se pudo renombrar la categoría. Intenta de nuevo.', 'error');
  }
}
async function borrarCategoriaDesdeSheet(categoriaId){
  const cat = (misCategorias || []).find(c => c.id === categoriaId);
  if(!cat) return;
  const temasAfectados = (misTemas || []).filter(t => (t.categoria || '') === cat.nombre);
  const aviso = temasAfectados.length
    ? `${temasAfectados.length} tema(s) quedarán sin categoría.`
    : 'Esta acción no se puede deshacer.';
  // v3.188: confirm() nativo -> modal propio.
  const okBorrarCat = await pedirConfirmacion({
    titulo: `¿Borrar "${cat.nombre}"?`,
    mensaje: aviso,
    okTexto: 'Borrar categoría',
    peligro: true
  });
  if(!okBorrarCat) return;
  try{
    await db.collection('CATEGORIAS2').doc(categoriaId).delete();
    misCategorias = (misCategorias || []).filter(c => c.id !== categoriaId);
    // Los temas que tenían esta categoría quedan "Sin categoría" (a
    // pedido) — categoria:'' en GUIAS2, mismo campo/esquema de siempre.
    await Promise.all(temasAfectados.map(t =>
      db.collection('GUIAS2').doc(t.id).set({ categoria: '' }, { merge: true }).then(() => { t.categoria = ''; })
    ));
    if(categoriaActivaFiltro === cat.nombre) categoriaActivaFiltro = null;
    renderizarSheetCategorias();
    filtrarYRenderizarTemas();
  } catch(err){
    console.error('No se pudo borrar la categoría:', err);
    mostrarToast('No se pudo borrar la categoría. Intenta de nuevo.', 'error');
  }
}
async function crearCategoriaDesdeSheet(){
  const input = document.getElementById('sheetCategoriaNuevaInput');
  const nombre = ((input && input.value) || '').trim();
  if(!nombre) return;
  const yaExiste = (misCategorias || []).find(c => (c.nombre || '').toLowerCase() === nombre.toLowerCase());

    // nada ni cerrar el sheet — solo se limpia el input.
    if(sheetCategoriaContexto.modo === 'gestion'){ if(input) input.value = ''; return; }

  }
  try{
    const docRef = await db.collection('CATEGORIAS2').add({
      dueño: auth.currentUser.email,

    });

    misCategorias.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

      if(input) input.value = '';

  } catch(err){

function elegirCategoriaDesdeSheet(categoriaId){

// ============ SUBIR TEMA NUEVO ============
let archivoASubir = null;

async function onArchivoNuevoTemaElegido(files){
  const file = files && files[0];
  if(!file) return;
  archivoASubir = file;
  // v3.192: (a pedido) "¿ya subí esto?" — dos chequeos baratos, sin red:
  // 1) mismo nombre de tema que uno ya existente; 2) mismo tamaño en
  // bytes que el archivo original de un tema ya existente (detecta el
  // mismo audio aunque le hayan cambiado el nombre). Ninguno de los dos
  // bloquea la subida, solo avisan — el músico decide si sigue.
  const nombreElegido = file.name.replace(/\.[^.]+$/, '').trim().toLowerCase();
  const coincideNombre = (misTemas || []).find(m => (m.nombre || '').trim().toLowerCase() === nombreElegido);
  const coincideTamaño = (misTemas || []).find(m => m.tamañoBytes && m.tamañoBytes === file.size);
  if(coincideNombre && coincideTamaño && coincideNombre.id === coincideTamaño.id){
    mostrarToast(`Cuidado: ya tenés un tema llamado "${coincideNombre.nombre}" y con el mismo tamaño de archivo. Es muy probable que sea el mismo audio.`, 'info');
  } else if(coincideNombre){
    mostrarToast(`Cuidado: ya tenés un tema llamado "${coincideNombre.nombre}".`, 'info');
  } else if(coincideTamaño){
    mostrarToast(`Cuidado: el archivo elegido pesa lo mismo que el audio de "${coincideTamaño.nombre}". Podría ser el mismo archivo con otro nombre.`, 'info');
  }
  const tags = await leerTagsAudioID3(file);
  const nombreSinExt = file.name.replace(/\.[^.]+$/, '');
  document.getElementById('nuevoTemaNombre').value = nombreSinExt;
  // v3.184: (a pedido) "no redondees los BPM nunca" — antes se hacía
  // Math.round() acá, así que un BPM detectado como 123.45 en el tag
  // ID3 quedaba guardado como 123 en el tema nuevo. El campo ya acepta
  // decimales (step="0.01"), así que se precarga con el valor real del
  // tag tal cual, sin redondear.
  document.getElementById('nuevoTemaBpm').value = tags.bpm ? parseFloat(tags.bpm) : 120;
  document.getElementById('nuevoTemaCompas').value = '4/4';
  // v3.205: (a pedido) reset del input "Otro…" al elegir un archivo nuevo
  // — evita que quede visible/con texto viejo de una subida anterior.
  document.getElementById('nuevoTemaCompasLibre').style.display = 'none';
  document.getElementById('nuevoTemaCompasLibre').value = '';
  limpiarErrorCompasLibre();
  const tonalidadDetectada = tags.key ? tags.key.replace(/\s*\(Camelot[^)]*\)\s*$/i, '').trim() : '';
  document.getElementById('nuevoTemaTonalidad').value = tonalidadDetectada;
  document.getElementById('nuevoTemaClave').value = '';
  // v3.208: reset del bloque de clave personalizada al elegir un
  // archivo nuevo — mismo criterio que el reset de compás libre arriba.
  onCambioNuevoTemaClave('');
  document.getElementById('subirForm').style.display = 'block';
}

// v3.205: (a pedido) muestra/oculta el input de texto libre según la
// opción elegida en el selector de compás ("Otro…" lo revela).
function onCambioNuevoTemaCompas(valor){
  const libreInput = document.getElementById('nuevoTemaCompasLibre');
  if(!libreInput) return;
  libreInput.style.display = (valor === 'otro') ? 'block' : 'none';
  if(valor !== 'otro'){ libreInput.value = ''; limpiarErrorCompasLibre(); }
}
function limpiarErrorCompasLibre(){
  const err = document.getElementById('nuevoTemaCompasLibreError');
  if(err){ err.style.display = 'none'; err.textContent = ''; }
}
// v3.205: (a pedido) valida el formato N/D del compás libre — si no
// matchea, devuelve null y muestra el error en el propio formulario
// (en vez de dejar guardar un string que rompería secPerBar en
// silencio más adelante, ver factorDenomCompas/beatsPorBarraDeSeccionMusico).
function validarCompasLibre(valor){
  const limpio = (valor || '').trim();
  const match = /^([1-9][0-9]?)\/([1-9][0-9]?)$/.exec(limpio);
  if(!match){
    const err = document.getElementById('nuevoTemaCompasLibreError');
    if(err){ err.style.display = 'block'; err.textContent = 'Formato inválido — usá número/número, ej: 11/8'; }
    return null;
  }
  return `${match[1]}/${match[2]}`;
}

async function confirmarSubidaNuevoTema(){
  if(!archivoASubir){ mostrarToast('Elige un archivo de audio primero.', 'info'); return; }
  const nombre = (document.getElementById('nuevoTemaNombre').value || 'Tema').trim();
  const bpm = parseFloat(document.getElementById('nuevoTemaBpm').value) || 120;
  const compasSelect = document.getElementById('nuevoTemaCompas').value || '4/4';
  let compas = compasSelect;
  if(compasSelect === 'otro'){
    compas = validarCompasLibre(document.getElementById('nuevoTemaCompasLibre').value);
    if(compas == null) return; // el error ya quedó visible en el formulario, no se guarda nada
  }
  const categoria = nuevoTemaCategoriaSeleccionada || '';
  const tonalidad = (document.getElementById('nuevoTemaTonalidad').value || '').trim();
  const clave = resolverClaveSeleccionada('nuevoTemaClave', 'nuevoTemaClaveLibre');
  const btn = document.getElementById('btnConfirmarSubida');
  const msg = document.getElementById('subirEstadoMsg');
  btn.disabled = true;
  msg.textContent = 'Guardando...';
  try{
    // v3.192: (a pedido) tamañoBytes del archivo original — se guarda
    // solo para poder detectar en subidas futuras "¿ya subí este
    // archivo?" (ver onArchivoNuevoTemaElegido). Campo aditivo, no
    // afecta audioUrl ni ningún cálculo existente.
    const tamañoBytes = archivoASubir.size || null;
    const docRef = await db.collection('GUIAS2').add({
      dueño: auth.currentUser.email,
      nombre, bpm, compas, categoria, tonalidad, clave,
      offset: 0, secciones: [], progreso: '', notas: '',
      audioUrl: null, tamañoBytes,
      creado: firebase.firestore.FieldValue.serverTimestamp()
    });
    // v1: el archivo ya elegido corre DE UNA por el motor local (waveform,
    // metrónomo, todo) — la subida a Cloudinary pasa en paralelo, sin
    // bloquear la práctica.
    const tema = { id: docRef.id, dueño: auth.currentUser.email, nombre, bpm, compas, categoria, tonalidad, clave, offset: 0, secciones: [], progreso: '', notas: '', tamañoBytes };
    // v3.189: se agrega a misTemas en memoria — volverAMisTemas() ya no
    // relee Firestore siempre, así que si no se hace esto acá el tema
    // recién creado no aparecería en la grilla hasta pasados 3 minutos.
    misTemas.push(tema);
    misTemas.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
    abrirTemaConArchivo(tema, archivoASubir);
    msg.textContent = 'Subiendo copia a Cloudinary...';
    subirAudioACloudinary(archivoASubir, pct => {
      msg.textContent = `Subiendo ${pct}%…`;
    }).then(url => {
      return db.collection('GUIAS2').doc(docRef.id).set({ audioUrl: url }, { merge: true }).then(() => url);
    }).then(url => {
      if(temaActualId === docRef.id && temaActualDatos) temaActualDatos.audioUrl = url;
    }).catch(err => {
      console.error('No se pudo subir el audio a Cloudinary:', err);
      mostrarToast('El tema quedó guardado y ya podés practicar, pero no se pudo subir la copia en la nube. Podés reintentar más tarde.', 'error');
    });
  } catch(err){
    console.error('Error creando el tema:', err);
    msg.textContent = 'No se pudo guardar el tema. Intenta de nuevo.';
  } finally {
    btn.disabled = false;
  }
}

// v1.1: FIX — mismo mecanismo EXACTO que subirArchivoACloudinary() en
// guia-practica.html (ya probado con las maquetas): unsigned upload por
// XHR (para poder mostrar % de progreso) en vez de fetch sin progreso.
function subirAudioACloudinary(file, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME_AUDIO}/video/upload`);
    xhr.upload.onprogress = (e) => {
      if(e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      let data = null;
      try{ data = JSON.parse(xhr.responseText); }catch(err){ /* respuesta no-JSON, sigue abajo con data=null */ }
      if(xhr.status >= 200 && xhr.status < 300 && data && data.secure_url){
        resolve(data.secure_url);
      } else {
        reject(new Error((data && data.error && data.error.message) || `Error de Cloudinary (status ${xhr.status})`));
      }
    };
    xhr.onerror = () => reject(new Error('Error de red al subir a Cloudinary'));
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET_AUDIO);
    xhr.send(form);
  });
}

// ============ v3.189: CACHÉ DE AUDIO (Cache API) ============
// Nombre fijo del caché + tope de entradas. Subir el tope no rompe
// nada, solo usa más espacio en disco del navegador.
const AUDIOLINK_CACHE_NOMBRE = 'audiolink-audio-cache-v1';
const AUDIOLINK_CACHE_MAX = 10;
// LRU muy simple guardado en localStorage: un array de audioUrl, más
// reciente al final. No necesita ser exacto — solo evita que el caché
// crezca sin límite si el músico abre muchos temas distintos.
function _lruAudioLeer(){
  try{ return JSON.parse(localStorage.getItem('audiolink_lru_audio') || '[]'); }
  catch(e){ return []; }
}
function _lruAudioGuardar(lista){
  try{ localStorage.setItem('audiolink_lru_audio', JSON.stringify(lista)); }catch(e){}
}
async function _lruTocarAudioCache(url){
  let lista = _lruAudioLeer().filter(u => u !== url);
  lista.push(url);
  // si nos pasamos del tope, el/los más viejos se borran también del
  // caché real (si no, el LRU en localStorage queda mintiendo).
  if(lista.length > AUDIOLINK_CACHE_MAX){
    const sobran = lista.splice(0, lista.length - AUDIOLINK_CACHE_MAX);
    try{
      const cache = await caches.open(AUDIOLINK_CACHE_NOMBRE);
      await Promise.all(sobran.map(u => cache.delete(u)));
    }catch(e){ console.error('No se pudo limpiar el caché de audio (LRU):', e); }
  }
  _lruAudioGuardar(lista);
}
// Devuelve el Blob desde caché si existe, o null. Cache API puede no
// existir (contextos no seguros/navegadores viejos) — si falla,
// simplemente se sigue como si no hubiera caché, sin cortar la práctica.
async function _obtenerAudioDeCache(url){
  if(!('caches' in window)) return null;
  try{
    const cache = await caches.open(AUDIOLINK_CACHE_NOMBRE);
    const resp = await cache.match(url);
    if(!resp) return null;
    return await resp.blob();
  }catch(e){
    console.error('No se pudo leer el caché de audio:', e);
    return null;
  }
}
async function _guardarAudioEnCache(url, resp){
  if(!('caches' in window)) return;
  try{
    const cache = await caches.open(AUDIOLINK_CACHE_NOMBRE);
    // resp.clone() porque la respuesta original todavía se está
    // consumiendo (r.blob()) del lado de abrirTema().
    await cache.put(url, resp.clone());
    await _lruTocarAudioCache(url);
  }catch(e){
    console.error('No se pudo guardar el audio en caché:', e);
  }
}

// ============ ABRIR UN TEMA (mío) ============
// v3.191: segundo parámetro mantenerSetlist — true cuando la llamada
// viene de dentro de una lista activa (abrirTemaDesdeSetlist,
// anterior/siguienteEnSetlist). Cualquier otra entrada (tarjeta de la
// grilla, ⋮, restaurar tema al recargar) no lo pasa, así que por
// defecto se sale del contexto de lista.
function abrirTema(id, mantenerSetlist){
  const tema = misTemas.find(t => t.id === id);
  if(!tema) return;
  if(!tema.audioUrl){ mostrarToast('Este tema todavía no tiene el audio disponible (revisa tu conexión con la subida anterior).', 'info'); return; }
  if(!mantenerSetlist) setlistActivaId = null;
  mostrarVista('practica');
  guardarTemaActualPersistido(id);
  document.getElementById('practicaTituloTema').textContent = tema.nombre || 'Tema';
  document.getElementById('contenedorPractica').innerHTML = bloquePracticaHtml(tema);
  crearEstadoPracticaParaTema(tema);
  actualizarBarraSetlistPractica();
  const cargando = document.getElementById('practicaCargandoAudio');
  if(cargando) cargando.style.display = 'inline';
  const uidCargaAudio = 'practica-' + tema.id;
  // v3.189: primero el caché. Si tema.audioUrl cambió desde que se
  // cacheó (ej. re-subida) la key del caché cambia con él, así que no
  // hay riesgo de servir audio viejo con URL nueva.
  _obtenerAudioDeCache(tema.audioUrl).then(blobCacheado => {
    if(blobCacheado){
      const file = new File([blobCacheado], (tema.nombre || 'tema') + '.audio', { type: blobCacheado.type || 'audio/mpeg' });
      onArchivoLocalElegido(uidCargaAudio, [file]);
      if(cargando) cargando.style.display = 'none';
      return;
    }
    fetch(tema.audioUrl).then(r => {
      _guardarAudioEnCache(tema.audioUrl, r);
      return r.blob();
    }).then(blob => {
      const file = new File([blob], (tema.nombre || 'tema') + '.audio', { type: blob.type || 'audio/mpeg' });
      onArchivoLocalElegido(uidCargaAudio, [file]);
    }).catch(err => {
      console.error('No se pudo traer el audio desde Cloudinary:', err);
      mostrarToast('No se pudo cargar el audio de este tema. Revisa tu conexión e intenta de nuevo.', 'error');
    }).finally(() => {
      if(cargando) cargando.style.display = 'none';
    });
  });
}

// v1: recién subido, el archivo ya está en el dispositivo — se le da al
// motor local directo, sin ir a buscarlo a Cloudinary (que recién está
// subiendo en paralelo, ver confirmarSubidaNuevoTema).
function abrirTemaConArchivo(tema, file){
  setlistActivaId = null; // v3.191: un tema recién subido nunca es parte de una lista
  mostrarVista('practica');
  guardarTemaActualPersistido(tema.id);
  document.getElementById('practicaTituloTema').textContent = tema.nombre || 'Tema';
  document.getElementById('contenedorPractica').innerHTML = bloquePracticaHtml(tema);
  crearEstadoPracticaParaTema(tema);
  actualizarBarraSetlistPractica();
  onArchivoLocalElegido('practica-' + tema.id, [file]);
}

// v3.189: (a pedido) ya no relee Firestore siempre — todas las
// mutaciones locales (renombrar, cambiar categoría, borrar, crear,
// editar/borrar categoría) ya actualizan misTemas/misCategorias en
// memoria desde que existen, así que releer acá era trabajo repetido.
// Solo se vuelve a pedir a Firestore si pasaron más de 3 minutos desde
// la última carga (por si se editó algo desde otro dispositivo) o si
// esta es la primera vez que se entra a la grilla.
const MIS_TEMAS_FRESCURA_MS = 3 * 60 * 1000;
function volverAMisTemas(){
  temaActualId = null; temaActualDatos = null;
  limpiarTemaActualPersistido();
  mostrarVista('lista');
  const vencido = (Date.now() - misTemasCargadosEn) > MIS_TEMAS_FRESCURA_MS;
  if(vencido || !misTemasCargadosEn){
    cargarMisTemas();
  } else {
    filtrarYRenderizarTemas();
  }
}

// v1: mismo bloque que armaba inicializarReproductoresPractica en
// musico.html por cada sesión — acá es un solo tema, sin maquetas/
// versiones/YouTube (siempre se llega al audio por onArchivoLocalElegido,
// nunca por conectarMaquetaEnPractica, que ya no existe en este archivo).
// v3.199: (a pedido) punto 3 de la revisión de código — limpieza
// centralizada de estadoPractica. Antes crearEstadoPracticaParaTema
// limpiaba a mano solo 3 de los ~9 timeouts/handles que fue juntando
// el estado con el tiempo (flashTimeoutId, claveNotaFlashTimeoutId,
// claveTickFlashTimeoutId) — cada handle nuevo que se agregaba en otro
// lado del código quedaba afuera si no se venía a actualizar acá
// también. De hecho, revisando, el ResizeObserver del fix de waveform
// (v3.193) NUNCA se desconectaba al cambiar de tema — quedaba vivo
// para siempre, escuchando un wrap que ya no se usa. Esta función es
// ahora el ÚNICO lugar que limpia un estadoPractica[uid] completo;
// cualquier handle nuevo (timeout, observer, listener) que se agregue
// a futuro se suma a esta lista y listo, no hay que acordarse de
// tocar crearEstadoPracticaParaTema de nuevo.
function destruirEstadoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(est.archivoLocalUrl) URL.revokeObjectURL(est.archivoLocalUrl);
  if(est.webAudioPlayerLocal && typeof est.webAudioPlayerLocal.cerrar === 'function'){
    try{ est.webAudioPlayerLocal.cerrar(); }catch(e){}
  }
  if(est.waveformResizeObserver) est.waveformResizeObserver.disconnect();
  // v3.201: los nodos de filtro viven mientras vive el estado — al
  // destruirlo, se desconectan del grafo (mismo criterio que el resto
  // de esta función).
  if(est.filtroHighpass){ try{ est.filtroHighpass.disconnect(); }catch(e){} }
  if(est.filtroLowpass){ try{ est.filtroLowpass.disconnect(); }catch(e){} }
  clearTimeout(est.flashTimeoutId);
  clearTimeout(est.claveNotaFlashTimeoutId);
  clearTimeout(est.claveNotaVisualOnTimeoutId);
  clearTimeout(est.claveTickFlashTimeoutId);
  clearTimeout(est.clavePilotoFlashTimeoutId);
  clearTimeout(est.clavePilotoVisualOnTimeoutId);
  clearTimeout(est.seekManualObjetivoTimeout);
  clearTimeout(est.waveformScrollProgTimeout);
  if(est.metroPrecontTimeouts) est.metroPrecontTimeouts.forEach(t => clearTimeout(t));
  delete estadoPractica[uid];
}
function crearEstadoPracticaParaTema(tema){
  const uid = 'practica-' + tema.id;
  const compasesPorBarra = parseInt((tema.compas || '4/4').split('/')[0], 10) || 4;
  // v3.205: (a pedido) factor de denominador del compás general del
  // tema (4/denominador, ej. 0.5 para /8) — factor 1 en /4: sin cambio
  // para el catálogo existente. Se guarda en est.compasFactorGeneral y
  // se usa en TODO el motor (click real, regla, loops, contador).
  const compasFactorGeneral = factorDenomCompas(tema.compas);

  destruirEstadoPractica(uid);

  temaActualId = tema.id;
  temaActualDatos = tema;

  const secPerBeatInicial = (60 / tema.bpm) * compasFactorGeneral;
  const secPerBarInicial = secPerBeatInicial * compasesPorBarra;
  estadoPractica[uid] = {
    bpm: tema.bpm,
    compasesPorBarra,
    compasFactorGeneral,
    compasTexto: tema.compas,
    tonalidad: tema.tonalidad || '',
    offset: 0,
    offsetLocalDelta: tema.offset || 0,
    cuePlayback: null,
    velocidadLocal: 1,
    waveformPeaks: null,
    waveformDuracion: 0,
    secciones: [],
    temaNombre: tema.nombre || 'Tema',
    loopInicio: null, loopFin: null, loopActivo: false,
    loopSeccionActivo: false,
    clickActivo: false, ultimoBeatClick: -1,
    precontActivo: true, precontCompases: 1, metroPrecontEnCurso: false, metroPrecontTimeouts: [], precontOmitir: false,
    seekManualObjetivo: null, seekManualObjetivoTimeout: null,
    ultimoBeatVisual: -1,
    flashTimeoutId: null,
    claveNotaFlashTimeoutId: null,
    claveTickFlashTimeoutId: null,
    clave: tema.clave || null,
    claveOnsets: tema.clave ? construirOnsetsClave(tema.clave, secPerBeatInicial, secPerBarInicial) : [],
    claveCicloSec: secPerBarInicial * 2,
    tieneClaveSeccionAlguna: (tema.secciones || []).some(s => (s.claveSeccion || '').trim()),
    ultimoOnsetClave: -Infinity,
    ultimoCompasClave: -1,
    bpmOverride: null,
    claveOverride: undefined,
    sonidoClick: 'clasico',
    sonidoClave: 'clasico',
    claveActiva: true,
    acentos: acentosPorDefecto(compasesPorBarra),
    acentosClave: acentosClavePorDefecto(),
    volFuerte: 1,
    volNormal: 0.55,
    getTiempoActual: () => 0,
    seek: () => {},
    pause: () => {},
    ytPlayer: null,
    archivoLocalUrl: null,
    maquetasVersion: [],
    maquetaVersionIdx: 0,
    el: {
      compas: document.getElementById('compas-' + uid),
      dots: Array.from({ length: compasesPorBarra }, (_, i) => document.getElementById('dot-' + uid + '-' + i))
    }
  };
  const est = estadoPractica[uid];
  cargarAjustesGuardados(uid);
  // v3.183: (a pedido) el badge "(ajustado)" comparaba los overrides
  // contra sus valores por defecto — pero cargarAjustesGuardados()
  // (arriba) restaura la calibración guardada de una sesión ANTERIOR
  // en este mismo dispositivo, así que el badge salía marcado desde el
  // arranque aunque en ESTA sesión no se haya tocado nada todavía. Se
  // guarda acá una foto de los overrides justo después de restaurar
  // (antes de que el músico pueda tocar nada), y actualizarBadgePractica
  // compara contra ESTA foto en vez de contra los defaults — el
  // ajuste heredado no cuenta, solo lo que cambie de acá en adelante.
  est.snapshotAjustesAlAbrir = firmaAjustesPractica(est);
  if(est.compasesOverride){
    const efectivoInicial = compasEfectivoDe(est);
    est.acentos = acentosPorDefecto(efectivoInicial);
    const acentosRowInicial = document.getElementById('acentosrow-' + uid);
    if(acentosRowInicial) acentosRowInicial.innerHTML = acentosBtnsHtml(uid, efectivoInicial);
    [2,3,4,5,6,7,8,9,12].forEach(b => {
      const btn = document.getElementById('compaspreset-' + uid + '-' + b);
      if(btn) btn.classList.toggle('activo', b === efectivoInicial);
    });
    const libreInicial = document.getElementById('compaslibre-' + uid);
    if(libreInicial) libreInicial.value = efectivoInicial;
    est.ultimaClaveFigurasRenderizada = undefined;
    est.ultimaClaveUnificadaRenderizada = undefined;
  }
  if(est.subdivisionOverride){
    [1, 2, 4].forEach(s => {
      const btnSubdivInicial = document.getElementById('subdivpreset-' + uid + '-' + s);
      if(btnSubdivInicial) btnSubdivInicial.classList.toggle('activo', s === est.subdivisionOverride);
    });
  }
  actualizarResumenCompasSubdivPractica(uid);
  const preconteoGuardado = cargarPreconteoGeneral();
  if(preconteoGuardado){
    if(typeof preconteoGuardado.activo === 'boolean') est.precontActivo = preconteoGuardado.activo;
    if(preconteoGuardado.compases === 1 || preconteoGuardado.compases === 2) est.precontCompases = preconteoGuardado.compases;
  }
  sincronizarUIPreconteo(uid);
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, tema.compas);
  actualizarUIAjustesPractica(uid);
  actualizarUIBpmLocalPractica(uid);
}

// ============ bloquePracticaHtml — pantalla de práctica de UN tema ============
// Mismo criterio visual que musico.html (título + nombre de archivo +
// controlesPracticaHtml), sin maquetas/versiones/YouTube: acá el audio
// siempre llega por onArchivoLocalElegido (device o Cloudinary).
function bloquePracticaHtml(tema){
  const uid = 'practica-' + tema.id;
  const compasesPorBarra = parseInt((tema.compas || '4/4').split('/')[0], 10) || 4;
  const tituloCancion = `<div class="practica-titulo-cancion">${escapeHtml(tema.nombre || 'Tema')}</div>`;
  // v3.191: (a pedido) notas por tema — campo de texto libre visible en
  // práctica ("entra en el 3, cuidado con el corte"). Guardado
  // EXPLÍCITO (botón, o al salir del campo con onchange) en vez de
  // por tecla — evita escribir a Firestore en cada letra tipeada.
  const notasHtml = `
    <div class="practica-notas-box">
      <label for="notas-${uid}">📝 Notas de este tema</label>
      <textarea id="notas-${uid}" rows="2" placeholder="Ej: entra en el compás 3, cuidado con el corte del puente..."
        onchange="guardarNotasTema('${tema.id}', this.value)">${escapeHtml(tema.notas || '')}</textarea>
      <div class="practica-notas-estado" id="notasestado-${uid}"></div>
    </div>`;
  return `
    <div class="practica-box">
      ${tituloCancion}
      ${notasHtml}
      <div class="practica-archivo-nombre-top" id="archivonombretop-${uid}"></div><span class="practica-loop-info practica-archivolocal-tags" id="archivolocaltagstop-${uid}"></span> <span id="practicaCargandoAudio" style="display:none;color:var(--muted)">Cargando audio de la nube…</span>
      ${controlesPracticaHtml(uid, compasesPorBarra, tema.bpm, tema.compas, tema.secciones || [], tema.clave)}
    </div>`;
}

// v3.191: guarda las notas — se llama al salir del textarea (onchange),
// no en cada tecla. Escritura directa a Firestore (mismo criterio que
// el resto de los campos de tema desde que se sacó el debounce en
// v3.190): sin timers, sin riesgo de perder el último cambio.
async function guardarNotasTema(temaId, valor){
  const estadoEl = document.getElementById('notasestado-practica-' + temaId);
  try{
    await db.collection('GUIAS2').doc(temaId).set({ notas: valor || '' }, { merge: true });
    if(temaActualDatos && temaActualDatos.id === temaId) temaActualDatos.notas = valor || '';
    const tema = (misTemas || []).find(t => t.id === temaId);
    if(tema) tema.notas = valor || '';
    if(estadoEl){ estadoEl.textContent = 'Guardado ✓'; setTimeout(() => { if(estadoEl.textContent === 'Guardado ✓') estadoEl.textContent = ''; }, 2000); }
  }catch(err){
    console.error('No se pudieron guardar las notas:', err);
    if(estadoEl) estadoEl.textContent = 'No se pudo guardar. Intenta de nuevo.';
  }
}

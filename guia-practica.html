<script>
const params = new URLSearchParams(location.search);
const proyectoId = params.get('p');
const temaId = params.get('t');
let temaRef = null;
let temaDataActual = {};
let instrumentosDelProyecto = []; // v1.1: instrumentos ya asignados a músicos en las sesiones de este proyecto

// v1.13: (a pedido) catálogo de secciones típicas de salsa/son, con su
// "tipo" embebido — el tipo decide qué campos de contenido tendrá la
// sección más adelante (letra, acordes por compás, ciclo de vamp),
// pero por ahora solo se guarda el tipo junto al nombre; el formulario
// de contenido según tipo queda para una siguiente pasada (fase 2).
// tipo: "fija" (acordes por compás, duración medida) | "vamp" (ciclo
// corto que se repite, con letra o solista) | "bloque" (frase fija de
// metales, sin contenido de texto).
const CATALOGO_SECCIONES = [
  { nombre: 'Intro', tipo: 'fija' },
  { nombre: 'Verso', tipo: 'fija' },
  { nombre: 'Coro', tipo: 'vamp', alias: 'Montuno' },
  { nombre: 'Solo', tipo: 'vamp' },
  { nombre: 'Descarga', tipo: 'vamp' },
  { nombre: 'Pie/Cue de solista', tipo: 'bloque' },
  { nombre: 'Mambo', tipo: 'bloque' },
  { nombre: 'Moña', tipo: 'bloque' },
  { nombre: 'Remate', tipo: 'bloque' },
  { nombre: 'Coda/Final', tipo: 'fija' },
];
function tipoDeNombreSeccion(nombre){
  const match = CATALOGO_SECCIONES.find(c => c.nombre === nombre || c.alias === nombre);
  return match ? match.tipo : null;
}
// v1.18: duración exacta en compases de una sección fija/bloque —
// null si todavía no tiene "hasta" definido (no hay cómo saber cuánto
// dura sin un fin manual, ver presets x4/x8/etc ya existentes).
function duracionCompasesSeccion(s){
  if(s.hastaSegundos == null) return null;
  const d = compasDeSegundos(s.hastaSegundos) - compasDeSegundos(s.desdeSegundos || 0);
  return d > 0 ? d : null;
}
// ajusta un array de strings a longitud n, preservando lo ya escrito
function resizeArrayAcordes(arr, n){
  const base = Array.isArray(arr) ? arr.slice(0, n) : [];
  while(base.length < n) base.push('');
  return base;
}
function etiquetaContenidoSeccion(nombre){
  if(nombre === 'Coro') return 'Letra del coro';
  if(nombre === 'Solo') return 'Solista / instrumento';
  if(nombre === 'Descarga') return 'Solistas (orden)';
  return 'Contenido';
}

// v1.2: faltaba por completo — mismo patrón que proyecto.html (estas 3
// líneas no vienen de firebase-config.js, cada página las declara).
firebase.initializeApp(firebaseConfig);
const db = crearDB();
const auth = firebase.auth();

async function iniciarGuiaPractica(){
  temaRef = db.collection('proyectos').doc(proyectoId).collection('temas').doc(temaId);
  try{
    const [proyDoc, temaDoc, sesionesSnap] = await Promise.all([
      db.collection('proyectos').doc(proyectoId).get(),
      temaRef.get(),
      db.collection('proyectos').doc(proyectoId).collection('sesiones').get()
    ]);
    if(!temaDoc.exists){
      document.getElementById('contextoTema').textContent = 'No se encontró este tema.';
      return;
    }
    temaDataActual = temaDoc.data() || {};
    const nombreProyecto = proyDoc.exists ? (proyDoc.data().nombre || '—') : '—';
    document.getElementById('contextoTema').textContent = `${nombreProyecto} → ${temaDataActual.nombre || '—'}`;

    document.getElementById('inputBpm').value = temaDataActual.practicaBpm || '';
    document.getElementById('inputCompas').value = temaDataActual.practicaCompas || '';
    document.getElementById('inputOffset').value = temaDataActual.practicaOffset || 0;
    document.getElementById('inputClave').value = temaDataActual.practicaClave || '';

    // v1.1: (a pedido) el instrumento de cada maqueta ya NO se escribe
    // a mano — se elige de los instrumentos que YA están asignados a
    // músicos en las sesiones de este proyecto (musicosAsignados[].
    // instrumento), para que el match con musico.html quede
    // garantizado (misma fuente de datos, sin typeos ni sinónimos). No
    // se crea ningún catálogo nuevo ni se toca musicos.html/proyecto.html.
    const setInstrumentos = new Set();
    sesionesSnap.forEach(d => {
      const asignados = Array.isArray(d.data().musicosAsignados) ? d.data().musicosAsignados : [];
      asignados.forEach(m => { if((m.instrumento || '').trim()) setInstrumentos.add(m.instrumento.trim()); });
    });
    instrumentosDelProyecto = [...setInstrumentos].sort((a, b) => a.localeCompare(b));

    renderSecciones(temaDataActual.practicaSecciones || []);
    renderMaquetas(temaDataActual.practicaMaquetas || []);
  } catch(e){
    console.error(e);
    document.getElementById('contextoTema').textContent = 'Error cargando el tema.';
  }
}

function mostrarOk(id){
  const el = document.getElementById(id);
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2000);
}

async function guardarDatosTema(){
  const bpm = parseInt(document.getElementById('inputBpm').value, 10) || null;
  const compas = document.getElementById('inputCompas').value || null;
  const offset = parseFloat(document.getElementById('inputOffset').value) || 0;
  const clave = document.getElementById('inputClave').value || null;

  // v1.11: (a pedido) si el offset (o BPM/compás) cambia y ya hay
  // secciones creadas, esas secciones guardan un desdeSegundos crudo
  // que quedó calculado con la grilla VIEJA (offset/bpm de ese
  // momento). Si el offset cambia después, esa misma sección queda
  // en un segundo distinto del compás que se había marcado — se
  // ofrece "reanclar": recalcular desdeSegundos/hastaSegundos de cada
  // sección para que caigan en el MISMO número de compás, ya con la
  // grilla nueva. Es opt-in vía confirm(); si se dice que no, o no
  // cambió nada, o no hay secciones, el guardado sigue igual que
  // siempre.
  let seccionesAGuardar = null;
  const offsetViejo = temaDataActual.practicaOffset || 0;
  const bpmViejo = temaDataActual.practicaBpm || bpm;
  const compasViejoStr = temaDataActual.practicaCompas || compas || '4/4';
  const cambioGrilla = offset !== offsetViejo || bpm !== bpmViejo || compas !== compasViejoStr;
  if(cambioGrilla && seccionesEnEdicion.length){
    const quiereReanclar = confirm(
      `La grilla de compases cambió (offset ${offsetViejo}s → ${offset}s` +
      (bpm !== bpmViejo ? `, BPM ${bpmViejo} → ${bpm}` : '') +
      `).\n\n¿Querés reanclar las ${seccionesEnEdicion.length} sección(es) ya creadas para que mantengan el mismo compás? (si decís que no, quedan en el mismo segundo de siempre, pero corridas de compás)`
    );
    if(quiereReanclar){
      const beatsPorBarraViejo = parseInt(compasViejoStr.split('/')[0], 10) || 4;
      const beatsPorBarraNuevo = parseInt((compas || '4/4').split('/')[0], 10) || 4;
      const secPerBarViejo = segundosPorCompas(bpmViejo, beatsPorBarraViejo);
      const secPerBarNuevo = segundosPorCompas(bpm, beatsPorBarraNuevo);
      if(secPerBarViejo && secPerBarNuevo){
        seccionesEnEdicion = seccionesEnEdicion.map(s => {
          const nuevo = { ...s };
          const n = Math.round(((s.desdeSegundos || 0) - offsetViejo) / secPerBarViejo);
          nuevo.desdeSegundos = Math.max(0, offset + n * secPerBarNuevo);
          if(s.hastaSegundos != null){
            const nH = Math.round(((s.hastaSegundos || 0) - offsetViejo) / secPerBarViejo);
            nuevo.hastaSegundos = Math.max(0, offset + nH * secPerBarNuevo);
          }
          return nuevo;
        });
        seccionesAGuardar = seccionesEnEdicion.map(s => ({ ...s }));
        pintarSecciones();
      }
    }
  }

  try{
    const patch = { practicaBpm: bpm, practicaCompas: compas, practicaOffset: offset, practicaClave: clave };
    if(seccionesAGuardar) patch.practicaSecciones = seccionesAGuardar;
    await temaRef.update(patch);
    temaDataActual.practicaBpm = bpm;
    temaDataActual.practicaCompas = compas;
    temaDataActual.practicaOffset = offset;
    temaDataActual.practicaClave = clave;
    if(seccionesAGuardar) temaDataActual.practicaSecciones = seccionesAGuardar;
    mostrarOk('okDatosTema');
  }catch(e){ console.error(e); alert('No se pudo guardar BPM/compás.'); }
}

// v1.3: duración de un compás completo, según BPM + tipo de compás
// (usa el numerador, ej. "4/4" -> 4 tiempos por compás — mismo
// criterio que previewBeatsPerBar()/musico.html).
function segundosPorCompas(bpm, beatsPerBar){
  if(!bpm || !beatsPerBar) return 0;
  return (60 / bpm) * beatsPerBar;
}
// Redondea un segundo al borde de compás más cercano, respetando el
// offset del compás 1. Si no hay BPM/compás válidos todavía, no
// redondea (devuelve el valor tal cual) para no bloquear al staff.
function snapASegundoDeCompas(seg){
  const bpm = parseFloat(document.getElementById('inputBpm').value) || 0;
  const beatsPerBar = previewBeatsPerBar();
  const offset = parseFloat(document.getElementById('inputOffset').value) || 0;
  const secPerBar = segundosPorCompas(bpm, beatsPerBar);
  if(!secPerBar) return seg;
  const n = Math.round((seg - offset) / secPerBar);
  return Math.max(0, offset + n * secPerBar);
}

// ============ SECCIONES ============
let seccionesEnEdicion = [];

// v1.24: id estable por sección — no depende de la posición en el
// array (que cambia al reordenar por compás), necesario para que
// "Es igual a"/origenId y el checkbox de propagación sepan a qué
// sección apuntan aunque se reordene o se guarde de nuevo. Si una
// sección ya guardada de antes de v1.24 no tiene id, se le asigna acá
// al cargar — no se toca ningún otro dato suyo.
function nuevoIdSeccion(){
  return 'sec-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}

function renderSecciones(secciones){
  seccionesEnEdicion = secciones.map(s => ({ ...s, id: s.id || nuevoIdSeccion(), tipo: s.tipo || tipoDeNombreSeccion(s.nombre) }));
  pintarSecciones();
}

// campos de contenido que copia "Es igual a" (una sola vez, al elegir
// el origen) — todo lo que define acordes/letra/ciclo/repeticiones/
// cierre de la sección, sin tocar nombre/tiempo/id/origenId propios.
// v1.25: separados por tipo real de sección — copiarContenidoSeccion()
// ya no mezcla campos de vamp/ciclo con los de fija-bloque (antes
// copiaba los 12 sin filtrar, y el campo ausente en el origen quedaba
// como `undefined` explícito → Firebase rechaza el guardado).
const CAMPOS_VAMP = ['cicloCompases','acordesCiclo','letraCiclo','contenido'];
const CAMPOS_FIJA = ['acordesPorCompas','letraPorCompas','repeticiones','finalDistintoN','acordesFinal2','letraFinal2','acordesSinTiempo'];
const CAMPOS_CONTENIDO_SECCION = ['tipo', ...CAMPOS_VAMP, ...CAMPOS_FIJA];

function copiarContenidoSeccion(origen){
  const copia = { tipo: origen.tipo };
  const propios = origen.tipo === 'fija-bloque' ? CAMPOS_FIJA : CAMPOS_VAMP;
  const otros = origen.tipo === 'fija-bloque' ? CAMPOS_VAMP : CAMPOS_FIJA;
  propios.forEach(campo => {
    const v = origen[campo];
    copia[campo] = Array.isArray(v) ? v.slice() : v;
  });
  // limpia a null los campos del otro tipo, para no dejar basura de
  // una sección que antes era del tipo contrario (no undefined: eso
  // es justo lo que rechazaba Firebase)
  otros.forEach(campo => { copia[campo] = null; });
  return copia;
}

function seleccionarOrigenSeccion(i, origenId){
  const s = seccionesEnEdicion[i];
  if(!origenId){
    s.origenId = null;
    // v1.26: sin origen no hay "variación" que proteger — se limpia
    // para no dejar flags huérfanos si más adelante se le asigna otro origen.
    s.esVariacion = false;
    s.notaVariacion = null;
    pintarSecciones();
    return;
  }
  const origen = seccionesEnEdicion.find(x => x.id === origenId);
  if(!origen) return;
  Object.assign(s, copiarContenidoSeccion(origen));
  s.origenId = origenId;
  pintarSecciones();
}

// secciones elegibles como origen para la sección i: todas menos ella
// misma, y solo las que a su vez no dependen de otra (relación de un
// solo nivel, sin cadenas A→B→C).
function opcionesOrigenSeccion(i){
  return seccionesEnEdicion.filter((s, j) => j !== i && !s.origenId);
}

// true si la sección en el índice i es origen de al menos una
// dependiente (usado para el mapa/PDF y para el checkbox de
// propagación).
function esOrigenDeAlguna(id){
  return seccionesEnEdicion.some(s => s.origenId === id);
}

function dependientesDe(id){
  return seccionesEnEdicion.filter(s => s.origenId === id);
}

// v1.24: un checkbox por cada sección que sea origen de al menos una
// dependiente — persistido en propagarCambios (tildado por defecto en
// una sección nueva). Al guardar (guardarSecciones), si está tildado,
// se empujan los campos de contenido actuales de esa sección a todas
// sus dependientes.
function pintarPropagacionSecciones(){
  const cont = document.getElementById('propagacionSecciones');
  if(!cont) return;
  const origenes = seccionesEnEdicion.filter(s => esOrigenDeAlguna(s.id));
  if(!origenes.length){
    cont.innerHTML = '';
    return;
  }
  cont.innerHTML = `
    <div class="seccion-repeticion-titulo">🔁 Repeticiones</div>
    <div class="seccion-ayuda" style="margin-bottom:8px;">Al guardar, estas secciones pueden empujar sus acordes/letra actuales a las que son "igual a" ellas. Las marcadas como variación nunca se tocan, aunque el checkbox esté tildado.</div>
    ` + origenes.map(o => {
    const checked = o.propagarCambios !== false;
    return `<label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--muted);margin-bottom:4px;">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="seccionesEnEdicion.find(s=>s.id==='${o.id}').propagarCambios = this.checked">
      Al guardar, actualizar las secciones iguales a "${(o.nombre || 'Sin nombre').replace(/"/g,'&quot;')}"
    </label>`;
  }).join('');
}

// v1.21: (a pedido) paleta y mapa/línea de tiempo del tema — mismos
// colores que ya usa musico.html (PALETA_SECCIONES/colorSeccionPorIndice
// ahí) para que la vista de staff y la del músico se vean consistentes.
// Un bloque por sección, ancho proporcional a su duración en compases
// (duracionCompasesSeccion, ya existente); si una sección todavía no
// tiene "hasta" definido, se le da un ancho mínimo fijo (no hay cómo
// saber cuánto dura de verdad todavía). Se repinta junto con
// pintarSecciones() (mismo llamador, ver abajo), así nunca queda
// desactualizado respecto de las tarjetas.
const PALETA_SECCIONES = ['#4caf7d', '#4a9fd8', '#c9a24b', '#d1784a', '#a374d9', '#d95f8a', '#4bc4c9', '#8fbf4a'];
function colorSeccionPorIndice(i){
  return PALETA_SECCIONES[i % PALETA_SECCIONES.length];
}
// v1.24: una sección con origenId usa el mismo color que su origen
// (mismo criterio replicado en musico.html) en vez de uno por
// posición propia — así se ve de un vistazo que son la misma idea
// repetida. `lista` es el array donde se está pintando (acá siempre
// seccionesEnEdicion); si el origen ya no existe (se borró), cae al
// color por índice de siempre.
function colorDeSeccionEnLista(lista, i){
  const s = lista[i];
  if(s && s.origenId){
    const idxOrigen = lista.findIndex(x => x.id === s.origenId);
    if(idxOrigen !== -1) return colorSeccionPorIndice(idxOrigen);
  }
  return colorSeccionPorIndice(i);
}
function pintarMapaTema(){
  const cont = document.getElementById('mapaTema');
  if(!cont) return;
  if(!seccionesEnEdicion.length){
    cont.innerHTML = '';
    return;
  }
  cont.className = 'mapa-tema';
  cont.innerHTML = seccionesEnEdicion.map((s, i) => {
    const duracion = duracionCompasesSeccion(s);
    const anchoFlex = duracion != null ? Math.max(1, duracion) : 3;
    const etiqueta = duracion != null ? `${s.nombre || '—'} (${duracion})` : (s.nombre || '—');
    return `<div class="mapa-tema-bloque" style="flex-grow:${anchoFlex};background:${colorDeSeccionEnLista(seccionesEnEdicion, i)};" title="${(s.nombre || '—').replace(/"/g,'&quot;')}${duracion != null ? ' · ' + duracion + ' comp.' : ' · duración sin definir'}">${etiqueta}</div>`;
  }).join('');
}

// v1.20: (a pedido) las tarjetas se reordenan solas por compás (desde
// desdeSegundos) al salir del campo "Desde" (onblur, no oninput — así
// no saltan de lugar mientras el staff todavía está escribiendo el
// número). Antes el orden en pantalla era solo el de inserción/carga;
// recién se prolijaba al guardar (guardarSecciones ya ordenaba antes de
// escribir a Firestore, eso no cambió). Sort estable: si dos secciones
// quedan con el mismo desdeSegundos, mantienen el orden relativo que ya
// tenían.
function ordenarYPintarSecciones(){
  seccionesEnEdicion = seccionesEnEdicion
    .map((s, i) => ({ s, i }))
    .sort((a, b) => (a.s.desdeSegundos || 0) - (b.s.desdeSegundos || 0) || a.i - b.i)
    .map(x => x.s);
  pintarSecciones();
}

            <option value="__otro__"${(s.nombre && !CATALOGO_SECCIONES.some(c => c.nombre === s.nombre)) ? ' selected' : ''}>Otro…</option>
          </select>
          ${(s.nombre !== undefined && s.nombre !== '' && !CATALOGO_SECCIONES.some(c => c.nombre === s.nombre)) || s.mostrarNombreLibre ? `<input type="text" placeholder="Nombre de la sección" style="margin-top:6px;" value="${(s.nombre || '').replace(/"/g,'&quot;')}" oninput="seccionesEnEdicion[${i}].nombre = this.value">` : ''}
        </div>
        <div class="seccion-campo">
          <label>Desde (compás)</label>

        </div>
        <div class="seccion-campo">

        </div>

function toggleColapsoSeccion(i){
  const s = seccionesEnEdicion[i];
  s._colapsada = !(s._colapsada !== false); // toggle, arrancando en "colapsada"
  pintarSecciones();
}

// v1.24: selector "Es igual a" — copia el contenido de otra sección
// UNA VEZ al elegirla (no queda linkeado en vivo). Solo lista como
// opción secciones que a su vez no sean ya dependientes de otra
// (opcionesOrigenSeccion), para no armar cadenas. Si la sección elegida
// como origen ya no existe (se borró), origenId queda sin match y el
// select cae solo en "— ninguno —".
function htmlOrigenSeccion(s, i){
  const opciones = opcionesOrigenSeccion(i);
  if(!opciones.length && !s.origenId) return '';
  // v1.27: (a pedido) caja visual propia "🔁 Repetición" — agrupa
  // "Es igual a" + variación en un sub-bloque reconocible, con textos
  // de ayuda cortos para que el staff entienda el flujo sin tener que
  // acordarse de memoria qué hace cada checkbox.
  const filaVariacion = s.origenId ? `
    <div class="seccion-variacion-box">
      <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;">
        <input type="checkbox" ${s.esVariacion ? 'checked' : ''} onchange="seccionesEnEdicion[${i}].esVariacion = this.checked; pintarSecciones();">
        Es una variación
      </label>
      <div class="seccion-ayuda">Se copió una vez de la sección de arriba, pero esta queda con contenido propio: aunque "actualizar las secciones iguales" esté tildado, esta ya no se vuelve a pisar.</div>
      ${s.esVariacion ? `
      <div class="seccion-campo" style="margin-top:8px;max-width:320px;">
        <label>Nota de variación (opcional)</label>
        <input type="text" value="${(s.notaVariacion || '').replace(/"/g,'&quot;')}" placeholder="ej. 2da vuelta - más aguda" oninput="seccionesEnEdicion[${i}].notaVariacion = this.value">
      </div>` : ''}

  return `
    <div class="seccion-repeticion-box">
      <div class="seccion-repeticion-titulo">🔁 Repetición</div>
      <div class="seccion-card-fila">
        <div class="seccion-campo">
          <label>Es igual a</label>
          <select onchange="seleccionarOrigenSeccion(${i}, this.value)">
            <option value="">— ninguno —</option>
            ${opciones.map(o => `<option value="${o.id}"${s.origenId === o.id ? ' selected' : ''}>${(o.nombre || 'Sin nombre').replace(/"/g,'&quot;')}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="seccion-ayuda">Copia una vez los acordes/letra de otra sección que suena igual (ej. un "Mambo" que se repite). No queda linkeado en vivo: podés editar esta tarjeta después sin afectar la otra.</div>
      ${filaVariacion}
    </div>`;
}

// v1.18: arma el bloque de acordes/contenido según el tipo de la
// sección — vamp (ciclo corto + contenido) o fija/bloque (acordes por
// compás exacto, calculado del hasta-desde). Si no hay tipo (nombre
// "Otro…" sin catalogar) o falta duración, no se arma nada o solo el
// aviso correspondiente.
function htmlAcordesSeccion(s, i){
  if(!s.tipo) return '';
  if(s.tipo === 'vamp'){
    const ciclo = s.cicloCompases || 2;
    const acordes = resizeArrayAcordes(s.acordesCiclo, ciclo);
    const letra = resizeArrayAcordes(s.letraCiclo, ciclo);
    return `
      <div class="seccion-fila-acordes">
        <div class="seccion-ciclo-campo">
          <label style="margin:0;">Ciclo (compases)</label>
          <input type="number" min="1" step="1" value="${ciclo}" oninput="actualizarCicloCompases(${i}, this.value)">
        </div>
        <div class="acordes-grid">
          ${acordes.map((a, j) => `<div class="acorde-celda">
            <input type="text" class="acorde-input" placeholder="c.${j+1}" value="${(a || '').replace(/"/g,'&quot;')}" oninput="actualizarAcordeCiclo(${i}, ${j}, this.value)">
            <input type="text" class="letra-input" placeholder="letra" value="${(letra[j] || '').replace(/"/g,'&quot;')}" oninput="actualizarLetraCiclo(${i}, ${j}, this.value)">
          </div>`).join('')}
        </div>
        <div class="seccion-contenido-campo">
          <label>${etiquetaContenidoSeccion(s.nombre)}</label>
          <textarea rows="2" placeholder="${etiquetaContenidoSeccion(s.nombre)}" oninput="seccionesEnEdicion[${i}].contenido = this.value">${(s.contenido || '')}</textarea>
        </div>
      </div>`;
  }
  // fija / bloque
  const duracion = duracionCompasesSeccion(s);
  const introLibre = s.nombre === 'Intro' ? `
        <div class="seccion-contenido-campo">
          <label>Tramo libre / rubato (opcional)</label>
          <textarea rows="2" placeholder="Acordes sueltos antes de entrar en tempo, ej: Cmaj7 ... Fmaj7 ..." oninput="seccionesEnEdicion[${i}].acordesSinTiempo = this.value">${(s.acordesSinTiempo || '')}</textarea>
        </div>` : '';
  if(duracion == null){
    return `
      <div class="seccion-fila-acordes">
        ${introLibre}
        <div class="seccion-aviso">Definí el fin de la sección arriba (o un preset x4/x8/etc) para cargar los acordes por compás.</div>
      </div>`;
  }
  const repeticiones = s.repeticiones || 1;
  // v1.22.1: FIX — `duracion` sale del tiempo real (Desde/Hasta), que ya
  // incluye TODAS las pasadas si repeticiones>1 (ej: 16 comp. reales =
  // 2 pasadas de 8). La grilla tiene que pedir solo UNA pasada
  // (basePase), si no el staff termina tipeando los acordes repetidos
  // igual que en modo lineal — perdiendo el único objetivo de esta
  // función. acordesPorCompas/letraPorCompas ahora tienen tamaño
  // basePase, no duracion.
  const basePase = repeticiones > 1 ? Math.max(1, Math.round(duracion / repeticiones)) : duracion;
  const acordes = resizeArrayAcordes(s.acordesPorCompas, basePase);
  const letra = resizeArrayAcordes(s.letraPorCompas, basePase);
  const finalN = Math.min(basePase, s.finalDistintoN || 1);
  const acordesFinal2 = resizeArrayAcordes(s.acordesFinal2, finalN);
  const letraFinal2 = resizeArrayAcordes(s.letraFinal2, finalN);
  return `
    <div class="seccion-fila-acordes">
      ${introLibre}
      <label>Acordes y letra (${basePase} comp.${repeticiones > 1 ? ` × ${repeticiones} pasadas = ${duracion} comp. reales` : ''})</label>
      <div class="acordes-grid">
        ${acordes.map((a, j) => `<div class="acorde-celda">
          <input type="text" class="acorde-input" placeholder="c.${j+1}" value="${(a || '').replace(/"/g,'&quot;')}" oninput="actualizarAcordePorCompas(${i}, ${j}, this.value)">
          <input type="text" class="letra-input" placeholder="letra" value="${(letra[j] || '').replace(/"/g,'&quot;')}" oninput="actualizarLetraPorCompas(${i}, ${j}, this.value)">
        </div>`).join('')}
      </div>
      <div class="seccion-repeticion-campos">
        <div class="seccion-ciclo-campo">
          <label style="margin:0;">Repeticiones</label>
          <input type="number" min="1" step="1" value="${repeticiones}" oninput="actualizarRepeticiones(${i}, this.value)">
        </div>
        ${repeticiones > 1 ? `
        <div class="seccion-ciclo-campo">
          <label style="margin:0;">Compases distintos en la 2da vez</label>
          <input type="number" min="1" max="${basePase}" step="1" value="${finalN}" oninput="actualizarFinalDistintoN(${i}, this.value)">
        </div>
        <label style="margin-top:4px;">2da vez (últimos ${finalN} comp.)</label>
        <div class="acordes-grid">
          ${acordesFinal2.map((a, j) => `<div class="acorde-celda">
            <input type="text" class="acorde-input" placeholder="2v c.${basePase - finalN + j + 1}" value="${(a || '').replace(/"/g,'&quot;')}" oninput="actualizarAcordeFinal2(${i}, ${j}, this.value)">
            <input type="text" class="letra-input" placeholder="letra" value="${(letraFinal2[j] || '').replace(/"/g,'&quot;')}" oninput="actualizarLetraFinal2(${i}, ${j}, this.value)">
          </div>`).join('')}
        </div>` : ''}
      </div>
    </div>`;
}

function actualizarCicloCompases(i, valor){
  const n = Math.max(1, parseInt(valor, 10) || 1);
  seccionesEnEdicion[i].cicloCompases = n;
  seccionesEnEdicion[i].acordesCiclo = resizeArrayAcordes(seccionesEnEdicion[i].acordesCiclo, n);
  // v1.19: (a pedido, Fase 3) letraCiclo sigue el mismo índice que
  // acordesCiclo — se redimensiona en el mismo momento, para que
  // nunca quede desalineada de la grilla de acordes.
  seccionesEnEdicion[i].letraCiclo = resizeArrayAcordes(seccionesEnEdicion[i].letraCiclo, n);
  pintarSecciones();
}
function actualizarAcordeCiclo(i, j, valor){
  if(!Array.isArray(seccionesEnEdicion[i].acordesCiclo)) seccionesEnEdicion[i].acordesCiclo = [];
  seccionesEnEdicion[i].acordesCiclo[j] = valor;
}
function actualizarAcordePorCompas(i, j, valor){
  if(!Array.isArray(seccionesEnEdicion[i].acordesPorCompas)) seccionesEnEdicion[i].acordesPorCompas = [];
  seccionesEnEdicion[i].acordesPorCompas[j] = valor;
}
// v1.19: (a pedido, Fase 3) letra línea-por-línea, mismo índice de
// compás que ya usan acordesCiclo/acordesPorCompas — sin campo de
// compás propio, se lee la posición en la misma grilla.
function actualizarLetraCiclo(i, j, valor){
  if(!Array.isArray(seccionesEnEdicion[i].letraCiclo)) seccionesEnEdicion[i].letraCiclo = [];
  seccionesEnEdicion[i].letraCiclo[j] = valor;
}
function actualizarLetraPorCompas(i, j, valor){
  if(!Array.isArray(seccionesEnEdicion[i].letraPorCompas)) seccionesEnEdicion[i].letraPorCompas = [];
  seccionesEnEdicion[i].letraPorCompas[j] = valor;
}
// v1.22: (a pedido) repetición con 1ra/2da vez — la sección se sigue
// cargando UNA sola vez (acordesPorCompas/letraPorCompas de siempre);
// repeticiones>1 más el contenido alternativo de "2da vez"
// (acordesFinal2/letraFinal2, solo los últimos finalDistintoN compases)
// son los únicos datos nuevos. No duplica compases a mano — el cálculo
// de qué vuelta va y qué compás real corresponde a qué casilla vive en
// musico.html, reusando el mismo motor cíclico que ya arma el ciclo de
// las secciones vamp.
function actualizarRepeticiones(i, valor){
  const n = Math.max(1, parseInt(valor, 10) || 1);
  const s = seccionesEnEdicion[i];
  s.repeticiones = n;
  // re-encoge la grilla a UNA pasada si se acaba de activar la
  // repetición (mismo criterio de resizeArrayAcordes que el resto:
  // conserva lo cargado, no lo borra).
  const duracion = duracionCompasesSeccion(s) || 1;
  const basePase = n > 1 ? Math.max(1, Math.round(duracion / n)) : duracion;
  s.acordesPorCompas = resizeArrayAcordes(s.acordesPorCompas, basePase);
  s.letraPorCompas = resizeArrayAcordes(s.letraPorCompas, basePase);
  if(n > 1){
    s.finalDistintoN = Math.min(basePase, s.finalDistintoN || 1);
    s.acordesFinal2 = resizeArrayAcordes(s.acordesFinal2, s.finalDistintoN);
    s.letraFinal2 = resizeArrayAcordes(s.letraFinal2, s.finalDistintoN);
  }
  pintarSecciones();
}
function actualizarFinalDistintoN(i, valor){
  const s = seccionesEnEdicion[i];
  const duracion = duracionCompasesSeccion(s) || 1;
  const repeticiones = s.repeticiones || 1;
  const basePase = repeticiones > 1 ? Math.max(1, Math.round(duracion / repeticiones)) : duracion;
  const n = Math.min(basePase, Math.max(1, parseInt(valor, 10) || 1));
  s.finalDistintoN = n;
  s.acordesFinal2 = resizeArrayAcordes(s.acordesFinal2, n);
  s.letraFinal2 = resizeArrayAcordes(s.letraFinal2, n);
  pintarSecciones();
}
function actualizarAcordeFinal2(i, j, valor){
  if(!Array.isArray(seccionesEnEdicion[i].acordesFinal2)) seccionesEnEdicion[i].acordesFinal2 = [];
  seccionesEnEdicion[i].acordesFinal2[j] = valor;
}
function actualizarLetraFinal2(i, j, valor){
  if(!Array.isArray(seccionesEnEdicion[i].letraFinal2)) seccionesEnEdicion[i].letraFinal2 = [];
  seccionesEnEdicion[i].letraFinal2[j] = valor;
}

function seleccionarNombreSeccion(i, valor){
  if(valor === '__otro__'){
    seccionesEnEdicion[i].nombre = '';
    seccionesEnEdicion[i].tipo = undefined;
    seccionesEnEdicion[i].mostrarNombreLibre = true;
  } else {
    seccionesEnEdicion[i].nombre = valor;
    seccionesEnEdicion[i].tipo = tipoDeNombreSeccion(valor);
    seccionesEnEdicion[i].mostrarNombreLibre = false;
  }
  pintarSecciones();
}

function agregarFilaSeccion(){
  // v1.28: nace expandida (_colapsada:false) para poder cargarla de una,
  // sin tener que abrirla a mano justo después de crearla.
  seccionesEnEdicion.push({ id: nuevoIdSeccion(), nombre: '', desdeSegundos: 0, _colapsada: false });
  pintarSecciones();
}

function eliminarSeccion(i){
  const idEliminado = seccionesEnEdicion[i].id;
  seccionesEnEdicion.splice(i, 1);
  // v1.24: las dependientes ya tienen su copia propia (el copiado es
  // una sola vez, no en vivo), así que no quedan vacías — solo se les
  // limpia origenId para que el selector "Es igual a" vuelva a
  // "ninguno" y dejen de compartir color/checkbox con un origen que ya
  // no existe.
  seccionesEnEdicion.forEach(s => { if(s.origenId === idEliminado) s.origenId = null; });
  pintarSecciones();
}

function segundosATexto(seg){
  seg = seg || 0;
  const m = Math.floor(seg / 60);
  const s = Math.floor(seg % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function textoASegundos(txt){
  const partes = (txt || '0:0').split(':');
  if(partes.length === 2) return (parseInt(partes[0],10) || 0) * 60 + (parseInt(partes[1],10) || 0);
  return parseInt(partes[0],10) || 0;
}
// v1.4: (a pedido) las secciones también se pueden cargar por N° de
// compás, no solo por minuto:segundo — dos inputs por fila, cada uno
// guarda desdeSegundos directamente al editarlo (gana el último que
// se tocó, mismo criterio que ya usaba el input de tiempo). El campo
// que NO se está editando muestra la conversión en vivo como
// placeholder (preview, no pisa lo que el staff ya escribió ahí).
function segundosDeCompas(compasNum){
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return 0;
  return Math.max(0, previewOffset() + (compasNum - 1) * secPerBar);
}
function compasDeSegundos(seg){
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return 1;
  return Math.max(1, Math.round(((seg || 0) - previewOffset()) / secPerBar) + 1);
}
function actualizarSeccionDesdeTiempo(i, txt){
  seccionesEnEdicion[i].desdeSegundos = textoASegundos(txt);
  const inputCompasEl = document.getElementById('seccompas-' + i);
  if(inputCompasEl) inputCompasEl.placeholder = 'compás ' + compasDeSegundos(seccionesEnEdicion[i].desdeSegundos);
}
function actualizarSeccionDesdeCompas(i, valor){
  const n = parseInt(valor, 10);
  if(!n){
    const inputTiempoEl = document.getElementById('sectiempo-' + i);
    if(inputTiempoEl) inputTiempoEl.placeholder = 'Minuto:segundo (ej: 1:30)';
    return;
  }
  seccionesEnEdicion[i].desdeSegundos = segundosDeCompas(n);
  const inputTiempoEl = document.getElementById('sectiempo-' + i);
  if(inputTiempoEl) inputTiempoEl.placeholder = segundosATexto(seccionesEnEdicion[i].desdeSegundos);
}

// v1.6: (a pedido) fin de sección editable a mano — mismo patrón de
// compás/tiempo en espejo que ya usaba "desde", pero opcional: si se
// deja vacío (hastaSegundos == null/undefined), musico.html sigue
// calculando el fin automáticamente como el inicio de la siguiente
// sección (o +4 compases estimados si es la última), tal como ya
// funcionaba antes de este campo existir.
function actualizarSeccionHastaCompas(i, valor){
  const n = parseInt(valor, 10);
  const inputTiempoEl = document.getElementById('sechastatiempo-' + i);
  if(!n){
    // campo vaciado a mano — no toca hastaSegundos acá; se limpia
    // explícitamente con el botón ↺ (limpiarSeccionHasta), para no
    // perder el valor por accidente al borrar el número mientras se
    // vuelve a escribir.
    return;
  }
  seccionesEnEdicion[i].hastaSegundos = segundosDeCompas(n);
  if(inputTiempoEl) inputTiempoEl.value = segundosATexto(seccionesEnEdicion[i].hastaSegundos);
}
function actualizarSeccionHastaTiempo(i, txt){
  if(!(txt || '').trim()) return; // igual que arriba: vaciar no borra el valor guardado
  seccionesEnEdicion[i].hastaSegundos = textoASegundos(txt);
  const inputCompasEl = document.getElementById('sechastacompas-' + i);
  if(inputCompasEl) inputCompasEl.placeholder = 'compás ' + compasDeSegundos(seccionesEnEdicion[i].hastaSegundos);
}
function limpiarSeccionHasta(i){
  seccionesEnEdicion[i].hastaSegundos = null;
  pintarSecciones();
}

// v1.7: (a pedido) presets rápidos de duración para el fin manual —
// mismo dato final que escribir el compás a mano en "hasta" (hastaSegundos
// = inicio de la sección + n compases), solo que de un click. Se
// recalculan siempre contra BPM/compás vigentes (previewBpm/
// previewBeatsPerBar), igual que segundosDeCompas/compasDeSegundos de
// arriba, así que si el staff ajusta BPM después, el preset ya
// aplicado no se re-ajusta solo (mismo comportamiento que el resto de
// los campos de esta pantalla: son segundos fijos una vez guardados).
function setSeccionHastaPreset(i, n){
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return;
  seccionesEnEdicion[i].hastaSegundos = (seccionesEnEdicion[i].desdeSegundos || 0) + n * secPerBar;
  pintarSecciones();
}
// Resalta el preset activo (botón "encendido") cuando el hastaSegundos
// guardado coincide exactamente con ese múltiplo de compases — solo
// estético, para que el staff vea de un vistazo cuál usó.
function esPresetHastaActivo(s, i, n){
  if(s.hastaSegundos == null) return false;
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return false;
  const esperado = (s.desdeSegundos || 0) + n * secPerBar;
  return Math.abs(s.hastaSegundos - esperado) < 0.01;
}

// v1.21: (a pedido) exporta la estructura del tema a PDF en formato
// "real/latin book" — cajas de compás en fila (4 por línea) en vez de
// una lista corrida, mismo dato que ya cargan acordesPorCompas/
// letraPorCompas (secciones fijas/bloque) y acordesCiclo/letraCiclo
// (vamp, se imprime el ciclo una vez con nota "se repite" en vez de
// repetir cajas). Genera el PDF enteramente en el navegador (jsPDF vía
// CDN, ver <script> arriba) — no pasa por ningún backend, coherente con
// el resto del ecosistema (sitio estático). Usa temaDataActual/inputBpm/
// inputCompas/inputClave tal cual ya los completa el staff arriba, sin
// dato nuevo.
function exportarEstructuraPDF(){
  if(!window.jspdf){ alert('No se pudo cargar el generador de PDF. Revisá tu conexión e intentá de nuevo.'); return; }
  if(!seccionesEnEdicion.length){ alert('No hay secciones cargadas todavía.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margen = 12;
  const anchoUtil = pageW - margen * 2;
  let y = margen;

  const bpm = document.getElementById('inputBpm').value || '—';
  const compas = document.getElementById('inputCompas').value || '4/4';
  const claveSel = document.getElementById('inputClave');
  const claveTxt = claveSel && claveSel.value ? claveSel.options[claveSel.selectedIndex].textContent : null;
  const nombreTema = temaDataActual.nombre || 'Tema sin nombre';

  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(nombreTema, margen, y); y += 7;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(`BPM ${bpm} · Compás ${compas}${claveTxt ? ' · Clave: ' + claveTxt : ''}`, margen, y);
  y += 8;

  const asegurarEspacio = (alto) => {
    if(y + alto > pageH - margen){ doc.addPage(); y = margen; }
  };

  const POR_FILA = 4;
  const cajaAncho = anchoUtil / POR_FILA;
  const cajaAlto = 16;

  const dibujarCajas = (acordes, letra, total) => {
    const filas = Math.ceil(total / POR_FILA);
    asegurarEspacio(filas * cajaAlto + 2);
    for(let j = 0; j < total; j++){
      const fila = Math.floor(j / POR_FILA);
      const col = j % POR_FILA;
      const x = margen + col * cajaAncho;
      const yCaja = y + fila * cajaAlto;
      doc.setDrawColor(180); doc.rect(x, yCaja, cajaAncho, cajaAlto);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(140);
      doc.text('c.' + (j + 1), x + 1.5, yCaja + 4);
      doc.setTextColor(20);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
      const acorde = (acordes && acordes[j]) || '';
      doc.text(acorde, x + cajaAncho / 2, yCaja + 8, { align: 'center' });
      const le = (letra && letra[j]) || '';
      if(le){
        doc.setFont('helvetica', 'italic'); doc.setFontSize(7);
        const leCorta = le.length > 22 ? le.slice(0, 21) + '…' : le;
        doc.text(leCorta, x + cajaAncho / 2, yCaja + 13, { align: 'center' });
      }
    }
    y += filas * cajaAlto + 4;
  };

  // v1.24: (a pedido) color compartido — una sección con origenId usa
  // el color de su origen (colorDeSeccionEnLista) en vez de uno por
  // posición propia, y se le agrega "(D.C.)" al nombre para dejar
  // claro que es la misma idea repetida (da capo). El cuadro de
  // acordes/letra se sigue dibujando COMPLETO en cada aparición (ya
  // tiene su propia copia de datos, no hay nada que "ver arriba").
  const secciones = seccionesEnEdicion.slice().sort((a, b) => (a.desdeSegundos || 0) - (b.desdeSegundos || 0));
  secciones.forEach((s, i) => {
    if(!(s.nombre || '').trim()) return;
    asegurarEspacio(10);
    const color = colorDeSeccionEnLista(secciones, i);
    const rgb = [parseInt(color.slice(1,3),16), parseInt(color.slice(3,5),16), parseInt(color.slice(5,7),16)];
    doc.setFillColor(rgb[0], rgb[1], rgb[2]);
    doc.rect(margen, y, anchoUtil, 7, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    // v1.26: si es una variación, la etiqueta avisa que el cuadro NO es
    // igual al original (no alcanza con "ya lo vi arriba") — incluye la
    // nota corta si el staff cargó una.
    const etiquetaDC = s.origenId
      ? (s.esVariacion
          ? ` (D.C. — variación${(s.notaVariacion || '').trim() ? ': ' + s.notaVariacion.trim() : ''})`
          : ' (D.C.)')
      : '';
    doc.text(s.nombre + etiquetaDC, margen + 2, y + 5);
    y += 9;
    doc.setTextColor(20);

    if(s.tipo === 'vamp'){
      const ciclo = s.cicloCompases || (s.acordesCiclo && s.acordesCiclo.length) || 0;
      if(ciclo > 0){
        dibujarCajas(s.acordesCiclo, s.letraCiclo, ciclo);
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(120);
        doc.text('🔁 se repite (ciclo de ' + ciclo + ' comp.)', margen, y);
        y += 6; doc.setTextColor(20);
      } else {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(120);
        doc.text('Definí el ciclo de compases arriba para ver las cajas acá.', margen, y);
        y += 6; doc.setTextColor(20);
      }
    } else {
      const duracion = duracionCompasesSeccion(s);
      if(duracion != null && duracion > 0){
        if(s.nombre === 'Intro' && (s.acordesSinTiempo || '').trim()){
          doc.setFont('helvetica', 'italic'); doc.setFontSize(8);
          doc.text('Libre/rubato: ' + s.acordesSinTiempo, margen, y);
          y += 6;
        }
        // v1.23: (a pedido) repetición con 1ra/2da vez — dibuja UNA sola
        // pasada (basePase cajas, lo que realmente cargó el staff en la
        // grilla de arriba) en vez de repetir la fila entera
        // `repeticiones` veces; abajo, nota de repetición y, si hay 2da
        // vez cargada, una fila chica aparte con esas cajas.
        // repeticiones=1 (default) no cambia nada.
        const repeticiones = s.repeticiones || 1;
        if(repeticiones > 1){
          const basePase = Math.max(1, Math.round(duracion / repeticiones));
          dibujarCajas(s.acordesPorCompas, s.letraPorCompas, basePase);
          doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(120);
          doc.text('𝄇 se repite x' + repeticiones + ' (' + duracion + ' comp. reales)', margen, y);
          y += 6; doc.setTextColor(20);
          const finalN = Math.min(basePase, s.finalDistintoN || 1);
          const hay2da = (s.acordesFinal2 && s.acordesFinal2.some(a => (a||'').trim())) || (s.letraFinal2 && s.letraFinal2.some(l => (l||'').trim()));
          if(hay2da){
            doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
            doc.text('2ª vez:', margen, y); y += 4;
            dibujarCajas(s.acordesFinal2, s.letraFinal2, finalN);
          }
        } else {
          dibujarCajas(s.acordesPorCompas, s.letraPorCompas, duracion);
        }
      } else {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(120);
        doc.text('Definí el fin de la sección para ver las cajas acá.', margen, y);
        y += 6; doc.setTextColor(20);
      }
    }
    y += 2;
  });

  const nombreArchivo = 'estructura-' + nombreTema.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '.pdf';
  // v1.28: (a pedido) preview antes de descargar — en vez de forzar la
  // descarga directa con doc.save(), se abre el PDF ya armado (mismo
  // dibujo de siempre, cero cambios en dibujarCajas/cálculo de
  // compases) en una pestaña nueva con el visor nativo del navegador.
  // Desde ahí el staff ve el resultado real y decide si lo descarga o
  // imprime con los controles propios del visor — no se duplica
  // ninguna lógica de renderizado. setProperties(title) hace que el
  // visor y el nombre sugerido al guardar coincidan con nombreArchivo.
  doc.setProperties({ title: nombreArchivo });
  const urlPreview = doc.output('bloburl');
  const ventana = window.open(urlPreview, '_blank');
  if(!ventana){
    // Bloqueador de pop-ups u otro impedimento: no se pierde el PDF,
    // se cae al comportamiento anterior (descarga directa).
    doc.save(nombreArchivo);
  }
}

async function guardarSecciones(){
  // v1.24: propagación — antes de armar el objeto a guardar, cada
  // sección que es origen de otras y tiene su checkbox tildado
  // (propagarCambios !== false) empuja sus campos de contenido
  // actuales a todas sus dependientes, sobrescribiendo la copia vieja
  // de cada una. Si está destildado, esa sección no toca a nadie y
  // cada dependiente se guarda tal cual está.
  // v1.26: las dependientes marcadas esVariacion nunca se pisan acá,
  // aunque el checkbox de propagación del origen esté tildado — son
  // una copia inicial que después se editó a mano (ej. "2da vuelta con
  // variación") y no deben volver a sincronizarse con el origen.
  seccionesEnEdicion.forEach(o => {
    if(o.propagarCambios === false) return;
    const deps = dependientesDe(o.id).filter(d => !d.esVariacion);
    if(!deps.length) return;
    const copia = copiarContenidoSeccion(o);
    deps.forEach(d => Object.assign(d, copia));
  });
  // v1.3: snap al borde de compás más cercano (usa BPM/compás/offset
  // actuales) — así el tiempo guardado no depende de que el staff lo
  // haya escrito exacto a mano.
  // v1.6: el fin manual (hastaSegundos) se snapea igual que el
  // inicio, cuando está definido — si quedó undefined/null se guarda
  // tal cual (musico.html lo toma como "sin fin manual, calcular
  // automático").
  const limpio = seccionesEnEdicion
    .filter(s => (s.nombre || '').trim())
    .map(s => {
      // v1.28: _colapsada es solo estado de UI (colapsar/expandir la
      // tarjeta) — se descarta igual que mostrarNombreLibre, nunca se
      // guarda en Firebase.
      const { mostrarNombreLibre, _colapsada, ...resto } = s;
      return {
        ...resto,
        desdeSegundos: snapASegundoDeCompas(s.desdeSegundos || 0),
        hastaSegundos: (s.hastaSegundos != null) ? snapASegundoDeCompas(s.hastaSegundos) : null
      };
    })
    .sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0))
    // v1.25: red de seguridad — si alguna sección quedó con una clave
    // en `undefined` de antes de este fix, se elimina la clave (no se
    // manda como null) antes de guardar; Firebase rechaza `undefined`.
    .map(s => {
      Object.keys(s).forEach(k => { if(s[k] === undefined) delete s[k]; });
      return s;
    });
  try{
    await temaRef.update({ practicaSecciones: limpio });
    temaDataActual.practicaSecciones = limpio;
    mostrarOk('okSecciones');
  }catch(e){ console.error(e); alert('No se pudieron guardar las secciones.'); }
}

// ============ MAQUETAS POR INSTRUMENTO ============
let maquetasEnEdicion = [];

function renderMaquetas(maquetas){
  maquetasEnEdicion = maquetas.map(m => ({ ...m }));
  pintarMaquetas();
}

// v1.1: si el proyecto ya tiene instrumentos asignados en alguna
// sesión, se elige de un <select> (garantiza el match exacto con
// musico.html). Si el proyecto todavía no tiene ningún músico
// asignado, cae a texto libre (mismo comportamiento de antes) para no
// bloquear la carga de maquetas antes de tener asignaciones — y si el
// valor ya guardado no está en la lista (se asignó después de crear
// la maqueta, o cambiaron el texto en la sesión), se agrega igual como
// opción para no perder el dato existente.
function campoInstrumentoHtml(m, i){
  const valorActual = (m.instrumento || '').trim();
  if(!instrumentosDelProyecto.length){
    return `<input type="text" placeholder="Instrumento (ej: Bajo)" value="${valorActual.replace(/"/g,'&quot;')}" onchange="maquetasEnEdicion[${i}].instrumento = this.value">`;
  }
  const opciones = [...instrumentosDelProyecto];
  if(valorActual && !opciones.includes(valorActual)) opciones.push(valorActual);
  return `<select onchange="maquetasEnEdicion[${i}].instrumento = this.value">
    <option value="">— Instrumento —</option>
    ${opciones.map(op => `<option value="${op.replace(/"/g,'&quot;')}" ${op === valorActual ? 'selected' : ''}>${op.replace(/</g,'&lt;')}</option>`).join('')}
  </select>`;
}

// v1.14: (a pedido) mini reproductor propio para las filas de audio de
// Maquetas — mismo look que el playerbar de musico.html (▶ / tiempo /
// barra / 🔊), pero chiquito y aislado: no depende de nada del motor
// de metrónomo/waveform de musico.html (acá no aplica). Los <audio>
// se recrean cada vez que pintarMaquetas() redibuja, así que estas
// funciones consultan el DOM por id en cada llamada en vez de guardar
// referencias.
function fmtTiempoMaqueta(s){
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}
function toggleMaquetaAudio(i){
  const audio = document.getElementById('mqaudio-' + i);
  if(!audio) return;
  if(audio.paused) audio.play(); else audio.pause();
}
function actualizarTiempoMaquetaAudio(i){
  const audio = document.getElementById('mqaudio-' + i);
  const tiempo = document.getElementById('mqaudiotiempo-' + i);
  const seek = document.getElementById('mqaudioseek-' + i);
  if(!audio || !tiempo || !seek) return;
  tiempo.textContent = fmtTiempoMaqueta(audio.currentTime) + ' / ' + fmtTiempoMaqueta(audio.duration);
  if(audio.duration) seek.value = Math.round((audio.currentTime / audio.duration) * 1000);
}
function seekMaquetaAudio(i, val){
  const audio = document.getElementById('mqaudio-' + i);
  if(!audio || !audio.duration) return;
  audio.currentTime = (val / 1000) * audio.duration;
}
function toggleMuteMaquetaAudio(i){
  const audio = document.getElementById('mqaudio-' + i);
  const btn = document.getElementById('mqaudiovolbtn-' + i);
  if(!audio || !btn) return;
  audio.muted = !audio.muted;
  btn.textContent = audio.muted ? '🔇' : '🔊';
}

function pintarMaquetas(){
  const cont = document.getElementById('listaMaquetas');
  if(!maquetasEnEdicion.length){
    cont.innerHTML = '<div class="vacio">Sin maquetas todavía.</div>';
    return;
  }
  cont.innerHTML = maquetasEnEdicion.map((m, i) => `
    <div class="maqueta-card" style="${m.color ? `border-left-color:${m.color};` : ''}">
      <div class="maqueta-card-fila">
        <div class="maqueta-campo">
          <label>Instrumento</label>
          ${campoInstrumentoHtml(m, i)}
        </div>
        <div class="maqueta-campo">
          <label>Etiqueta</label>
          <input type="text" placeholder="ej: Sin bajo" value="${(m.etiqueta || '').replace(/"/g,'&quot;')}" onchange="maquetasEnEdicion[${i}].etiqueta = this.value" title="Si un instrumento tiene varias maquetas, esto se ve como chip para elegir cuál escuchar">
        </div>
        <div class="maqueta-campo maqueta-color-campo">
          <label>Color</label>
          <div class="maqueta-color-swatches">
            ${MAQUETA_COLORES.map(c => `<button type="button" class="maqueta-color-dot${m.color === c ? ' activo' : ''}" style="background:${c}" onclick="setMaquetaColor(${i}, '${c}')" title="Color de esta pista"></button>`).join('')}
          </div>
        </div>
        <button class="btn-del maqueta-card-del" onclick="eliminarMaqueta(${i})" title="Eliminar maqueta">🗑️</button>
      </div>
      <div class="maqueta-card-fila">
        <div class="maqueta-campo maqueta-campo-url">
          <label>URL (YouTube o audio)</label>
          <input type="text" placeholder="https://…" value="${(m.url || '').replace(/"/g,'&quot;')}" onchange="maquetasEnEdicion[${i}].url = this.value">
        </div>
        <div class="maqueta-campo maqueta-campo-tipo">
          <label>Tipo</label>
          <select onchange="maquetasEnEdicion[${i}].tipo = this.value">
            <option value="youtube" ${m.tipo === 'youtube' ? 'selected' : ''}>YouTube</option>
            <option value="audio" ${m.tipo === 'audio' ? 'selected' : ''}>Audio directo</option>
          </select>
        </div>
        <label class="btn-ghost btn-upload-audio">
          📤 Subir audio
          <input type="file" accept="audio/*" style="display:none" onchange="subirAudioMaqueta(${i}, this.files[0])">
        </label>
      </div>
      ${(m.tipo === 'audio' && (m.url || '').trim()) ? `
      <div class="mqaudio-bar">
        <audio class="mqaudio-el" id="mqaudio-${i}" src="${(m.url || '').replace(/"/g,'&quot;')}" preload="metadata"
          ontimeupdate="actualizarTiempoMaquetaAudio(${i})"
          onloadedmetadata="actualizarTiempoMaquetaAudio(${i})"
          onplay="document.getElementById('mqaudioplay-${i}').textContent='⏸'"
          onpause="document.getElementById('mqaudioplay-${i}').textContent='▶'"
          onended="document.getElementById('mqaudioplay-${i}').textContent='▶'"></audio>
        <button type="button" class="mqaudio-btn" id="mqaudioplay-${i}" onclick="toggleMaquetaAudio(${i})" title="Reproducir / Pausar">▶</button>
        <span class="mqaudio-tiempo" id="mqaudiotiempo-${i}">0:00 / 0:00</span>
        <input type="range" class="mqaudio-seek" id="mqaudioseek-${i}" min="0" max="1000" step="1" value="0" oninput="seekMaquetaAudio(${i}, this.value)">
        <button type="button" class="mqaudio-btn" id="mqaudiovolbtn-${i}" onclick="toggleMuteMaquetaAudio(${i})" title="Silenciar">🔊</button>
      </div>` : ''}
      <div class="upload-status" id="maquetaUploadStatus-${i}"></div>
    </div>
  `).join('');
}

// v1.16: paleta fija de colores opcionales por maqueta (dorado, verde,
// violeta, azul, naranja, gris) — solo para diferenciar pistas de un
// vistazo (ej. "con bajo" / "sin bajo"), sin significado fijo por sí
// mismos. musico.html usa el mismo color en los chips de versión.
const MAQUETA_COLORES = ['#c9a24b','#4caf7d','#a78bd6','#5a9bd6','#e0785d','#8a8a8a'];
function setMaquetaColor(i, color){
  maquetasEnEdicion[i].color = (maquetasEnEdicion[i].color === color) ? null : color;
  pintarMaquetas();
}

function agregarFilaMaqueta(){
  maquetasEnEdicion.push({ instrumento: '', etiqueta: '', url: '', tipo: 'youtube' });
  pintarMaquetas();
}

function eliminarMaqueta(i){
  maquetasEnEdicion.splice(i, 1);
  pintarMaquetas();
}

// v1.8: (a pedido) subir audio de maqueta directo a Cloudinary desde
// acá, sin pasar por otra herramienta — mismo mecanismo "unsigned
// upload" que ya se usa para imágenes (upload preset sin firmar, no
// hace falta ninguna clave secreta en el navegador). El audio en
// Cloudinary vive bajo resource_type "video" (así lo maneja
// Cloudinary, no separa un tipo "audio" aparte) — eso habilita el
// procesamiento con soporte de range requests, necesario para que el
// seek/scrub de musico.html siga siendo instantáneo.
const CLOUDINARY_CLOUD_NAME = 'mqwgjh3u';
const CLOUDINARY_PRESET_AUDIO = 'GUIASAUDIO';

function subirArchivoACloudinary(file, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`);
    xhr.upload.onprogress = (e) => {
      if(e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      let data = null;
      try{ data = JSON.parse(xhr.responseText); }catch(err){ /* respuesta no-JSON, sigue abajo con data=null */ }
      if(xhr.status >= 200 && xhr.status < 300 && data && data.secure_url){
        resolve(data.secure_url);
      } else {
        reject(new Error((data && data.error && data.error.message) || `Error de Cloudinary (status ${xhr.status})`));
      }
    };
    xhr.onerror = () => reject(new Error('Error de red al subir a Cloudinary'));
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET_AUDIO);
    xhr.send(form);
  });
}

async function subirAudioMaqueta(i, file){
  if(!file) return;
  const estado = document.getElementById('maquetaUploadStatus-' + i);
  if(estado){ estado.style.display = 'block'; estado.style.color = 'var(--muted)'; estado.textContent = 'Subiendo 0%…'; }
  try{
    const url = await subirArchivoACloudinary(file, pct => {
      if(estado) estado.textContent = `Subiendo ${pct}%…`;
    });
    maquetasEnEdicion[i].url = url;
    maquetasEnEdicion[i].tipo = 'audio';
    pintarMaquetas();
    // v1.8: pintarMaquetas() recrea la fila (y el div de estado, vacío
    // de nuevo) — el URL ya cargado en el campo de texto es la
    // confirmación visual de que terminó bien, sin dejar un mensaje
    // colgado que haya que limpiar después.
  }catch(e){
    console.error('Error subiendo audio a Cloudinary:', e);
    if(estado){ estado.style.color = 'var(--err)'; estado.textContent = 'No se pudo subir el audio. Probá de nuevo.'; }
  }
}

async function guardarMaquetas(){
  const limpio = maquetasEnEdicion.filter(m => (m.instrumento || '').trim() && (m.url || '').trim());
  try{
    await temaRef.update({ practicaMaquetas: limpio });
    temaDataActual.practicaMaquetas = limpio;
    mostrarOk('okMaquetas');
  }catch(e){ console.error(e); alert('No se pudieron guardar las maquetas.'); }
}

// ============ PREVIEW DEL CONTADOR (mismo concepto que la demo) ============
let previewPlaying = false;
let previewSynth = null;
let previewLoop = null;
let previewStart = 0;

function previewBeatsPerBar(){
  const compas = document.getElementById('inputCompas').value || '4/4';
  return parseInt(compas.split('/')[0], 10) || 4;
}
function previewBpm(){
  return parseFloat(document.getElementById('inputBpm').value) || 96;
}
function previewOffset(){
  return parseFloat(document.getElementById('inputOffset').value) || 0;
}
function previewSeccionEn(t){
  const secciones = (seccionesEnEdicion || []).filter(s => (s.nombre||'').trim());
  if(!secciones.length) return '—';
  let actual = secciones[0];
  secciones.forEach(s => { if(t >= (s.desdeSegundos||0)) actual = s; });
  return actual.nombre;
}

async function previewTogglePlay(){
  const btn = document.getElementById('previewPlayBtn');
  if(!previewPlaying){
    await Tone.start();
    if(!previewSynth) previewSynth = new Tone.MembraneSynth().toDestination();
    const secPerBeat = 60 / previewBpm();
    previewLoop = new Tone.Loop(time => {
      previewSynth.triggerAttackRelease('C2', '16n', time);
    }, secPerBeat).start(0);
    Tone.Transport.start();
    previewStart = Tone.now();
    previewPlaying = true;
    btn.textContent = '⏸️ Pausar';
    requestAnimationFrame(previewUpdate);
  } else {
    Tone.Transport.pause();
    if(previewLoop) previewLoop.stop();
    previewPlaying = false;
    btn.textContent = '▶️ Reproducir click de prueba';
  }
}

function previewUpdate(){
  if(!previewPlaying) return;
  const elapsed = Tone.now() - previewStart;
  const secPerBeat = 60 / previewBpm();
  const secPerBar = secPerBeat * previewBeatsPerBar();
  const barIndex = Math.max(1, Math.floor((elapsed - previewOffset()) / secPerBar) + 1);
  document.getElementById('previewBar').textContent = barIndex;
  document.getElementById('previewSeccion').textContent = previewSeccionEn(elapsed);
  requestAnimationFrame(previewUpdate);
}

// ============ ARRANQUE / GUARD DE SESIÓN ============
// v1.2: faltaba por completo — la página nunca llamaba a
// iniciarGuiaPractica() ni validaba sesión. Se agrega acá, al final del
// script (después de que todas las variables/funciones ya existen), con
// el mismo patrón de proyecto.html: guard offline vía
// estaModoOfflineActivo() (firebase-config.js), y guard online vía
// auth.onAuthStateChanged() + validación de equipoInterno/{email}.activo
// === true. A diferencia de proyecto.html (que solo marcaba una bandera),
// acá se llama directo a iniciarGuiaPractica() al validar, porque esta
// página es de un solo flujo (staff-only, sin vista previa ni roles).
if(estaModoOfflineActivo()){
  console.info('AUDIOLINK: modo offline activo — guard de sesión omitido.');
  iniciarGuiaPractica();
} else {
  auth.onAuthStateChanged(async (user) => {
    if(!user){
      window.location.href = 'login.html?next=' + encodeURIComponent(location.href);
      return;
    }
    try{
      const doc = await db.collection('equipoInterno').doc(user.email).get();
      if(!doc.exists || doc.data().activo !== true){
        await auth.signOut();
        window.location.href = 'login.html';
        return;
      }
      iniciarGuiaPractica();
    } catch(e){
      console.error('Error validando sesión:', e);
      window.location.href = 'login.html';
    }
  });
}

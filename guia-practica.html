<head>

<title>Audiolink — Guía de práctica</title>
<!-- AUDIOLINK · guia-practica.html · v1.7
     v1.7: (a pedido) presets rápidos de duración junto al campo "hasta"
     — botones cuadrados x4/x8/x16/x32/x64 que fijan el fin manual de
     la sección en esa cantidad de compases desde su inicio, sin tener
     que escribir el compás a mano. El botón se resalta si el valor
     guardado coincide con ese preset. No cambia nada del cálculo de
     "desde" ni del guardado (sigue siendo hastaSegundos, snapeado
     igual que siempre).
     v1.6: (a pedido) fin de sección editable a mano (opcional) —
     nuevo campo "hasta" por sección, en espejo del "desde" (compás o
     minuto:segundo). Si se deja vacío, sigue funcionando como antes
     (musico.html calcula el fin automáticamente). Se guarda snapeado
     al borde de compás más cercano, igual que el "desde".
     v1.5
     v1.5: (a pedido) las secciones ahora se pueden cargar por N° de
     compás además de minuto:segundo — dos inputs por fila. El que se
     está escribiendo guarda directamente el desdeSegundos (gana el
     último que se tocó); el otro campo muestra la conversión en vivo
     como placeholder (solo preview, no pisa lo que ya está escrito
     ahí). Usa BPM/compás/offset ya cargados arriba (previewBpm/
     previewBeatsPerBar/previewOffset, ya existentes) — si todavía no
     hay BPM/compás guardados, el placeholder de compás simplemente no
     tiene con qué convertir (queda en blanco), sin romper nada.
     v1.4: (a pedido, junto con musico.html v2.0) nuevo campo "Clave"
     (practicaClave, string) en Datos del tema — selector con Ninguna/
     Son 2-3/Son 3-2/Rumba 2-3/Rumba 3-2/Bossa 2-3/Bossa 3-2. Se guarda
     junto con BPM/compás/offset (mismo botón). musico.html v2.0 usa
     este valor para hacer que el click de metrónomo siga la célula
     rítmica de la clave en vez de sonar por tiempo. No se tocó nada
     más — Secciones/Maquetas siguen igual.
     v1.3: (a pedido, junto con musico.html v1.7) dos cambios ligados a
     hacer que el loop/contador de musico.html caiga siempre justo en
     el borde de un compás:
     1) Nuevo campo "Offset del compás 1" (practicaOffset, number,
     segundos, default 0) — para temas con intro/anacrusa donde el
     compás 1 real no arranca en t=0. Se guarda junto con BPM/compás
     (mismo botón "Guardar BPM y compás"), y musico.html lo usa para
     todos sus cálculos de compás/loop.
     2) guardarSecciones() ahora redondea (snap) cada
     desdeSegundos al borde de compás más cercano, usando
     BPM+compás+offset actuales — así el tiempo que queda guardado en
     Firestore ya viene alineado, sin depender de que el staff lo haya
     escrito exacto a mano. El preview del contador (más abajo) también
     usa el offset para consistencia. No se tocó Maquetas ni el guard
     de sesión.
     v1.2: la página nunca arrancaba — faltaban por completo la
     inicialización de Firebase (firebase.initializeApp/crearDB()/
     firebase.auth(), presentes en proyecto.html pero nunca copiadas
     acá) y el bloque de arranque/guard de sesión (nadie llamaba a
     iniciarGuiaPractica()). Se agregó al final del script, mismo
     patrón que proyecto.html: guard offline vía
     estaModoOfflineActivo() (llama iniciarGuiaPractica() directo) y
     guard online vía auth.onAuthStateChanged() + validación de
     equipoInterno/{email}.activo === true (llama
     iniciarGuiaPractica() al validar, en vez de solo marcar una
     bandera, porque esta página es un solo flujo staff-only sin
     vista previa ni roles). No se tocó ninguna otra función existente.
     v1.1: (a pedido) el campo "Instrumento" de cada maqueta deja de
     ser texto libre — se elige de un <select> armado con los
     instrumentos que YA están asignados a músicos en las sesiones de
     este proyecto (musicosAsignados[].instrumento, leído de
     proyectos/{p}/sesiones). Esto garantiza que el match con
     musico.html (que filtra por s.miInstrumento exacto) nunca falle
     por typeos o sinónimos ("Bajo" vs "bajo eléctrico"), sin crear
     ningún catálogo nuevo ni tocar musicos.html/proyecto.html. Si el
     proyecto todavía no tiene ningún músico asignado, el campo cae a
     texto libre (mismo comportamiento de v1.0) para no bloquear la
     carga de maquetas antes de tener asignaciones; si un valor ya
     guardado no aparece en la lista actual, se agrega igual como
     opción para no perder el dato. No se tocó BPM/compás/secciones,
     ni el preview del contador, ni el guard de sesión.
     V1.0: nuevo, extraído como archivo standalone desde el diseño (no
     desde código existente) — sigue el mismo criterio de extracción
     que musicos.html/estudios.html: página propia con su propio guard
     de staff, en vez de agregar una sección más a proyecto.html (que
     ya tiene 4000+ líneas). Se abre desde proyecto.html con
     ?p={proyectoId}&t={temaId} (botón nuevo "🎧 Guía de práctica" por
     fila de tema — ver proyecto.html).

     Qué hace: por cada tema, permite cargar BPM, tipo de compás
     (incluye divisiones de 8 para doblar fácil: 4/4, 3/4, 6/8, 4/8,
     2/4, 5/4, 7/8, 12/8) y una lista de secciones (nombre + minuto:
     segundo de inicio) — todo COMPARTIDO por el tema, sin importar el
     instrumento. Además, una lista de "maquetas por instrumento"
     (link YouTube o audio + a qué instrumento corresponde), porque la
     pista de referencia SÍ puede variar por instrumento (ej. guía
     solo-bajo para el bajista) aunque el BPM/compás/secciones no.
     Todo se guarda en el MISMO documento proyectos/{p}/temas/{t}, en 4
     campos nuevos que no existían: practicaBpm (number), practicaCompas
     (string), practicaSecciones (array de {nombre, desdeSegundos}),
     practicaMaquetas (array de {instrumento, url, tipo}). No se toca
     ningún campo existente del documento tema (nombre, orden, activo,
     notasEdicion/Mezcla/Mastering, etc.) — esta página solo hace
     update() con esos 4 campos, nunca set() completo del doc.

     Al fondo hay un preview en vivo del widget contador de compases
     (Tone.js, mismo concepto que la demo), para que el staff pueda
     probar cómo se va a ver antes de mandarle el link al músico —
     ese widget real (consumiendo estos mismos campos) vive en
     musico.html, no acá.

     Firestore: usa esStaff() sin cambios — no hace falta tocar
     firestore.rules porque el CRUD normal de temas (proyecto.html) ya
     tiene permiso total de escritura vía esStaff(); la excepción
     angosta "sin login" de temas (usada por bitacora.html para
     notasEdicion/Mezcla/Mastering/etc.) NO incluye estos 4 campos
     nuevos a propósito — la lectura del músico pasa por el
     `allow get: if true` ya existente (necesita el ID exacto, que
     viaja dentro del doc de sesión/asignación, mismo criterio que el
     resto del ecosistema), no por esa excepción de escritura. -->

<style>
:root{
  --bg:#0b0b0d;
  --surf:#151517;
  --surf-light:#1d1d20;
  --brd:#2a2a2e;
  --gold:#c9a24b;
  --gold-bg:rgba(201,162,75,0.12);
  --txt:#f0ede6;
  --muted:#9a978f;
  --faint:#5c5a55;
  --ok:#4caf7d;
  --warn:#d9a441;
  --err:#d4574a;
  --T:"Playfair Display",Georgia,serif;
  --S:"DM Sans",'Segoe UI',system-ui,-apple-system,sans-serif;
  --M:"JetBrains Mono",monospace;
}
:root[data-tema="light"]{
  --bg:#faf8f4;
  --surf:#ffffff;
  --surf-light:#f3f0e8;
  --brd:#e2ddd0;
  --gold:#a8823a;
  --gold-bg:rgba(168,130,58,0.10);
  --txt:#2a2620;
  --muted:#7a756a;
  --faint:#a39d8f;
  --ok:#3a8f63;
  --warn:#b8842f;
  --err:#b8453a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:var(--S);min-height:100vh;position:relative;overflow-x:hidden;}
header, main, .main-wrap{position:relative;z-index:1;}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.card h3{font-family:var(--T);font-size:1.05rem;color:var(--gold);margin-bottom:12px;font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:6px;}
input, select{
  width:100%;padding:10px 12px;background:var(--surf-light);border:1px solid var(--brd);
  border-radius:8px;color:var(--txt);font-family:var(--S);font-size:0.9rem;
}
input:focus, select:focus{outline:none;border-color:var(--gold);}
.btn{padding:10px 16px;background:var(--gold);color:#1a1408;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.85rem;}
.btn-ghost{padding:9px 15px;background:transparent;border:1px solid var(--brd);color:var(--txt);border-radius:8px;cursor:pointer;font-size:0.85rem;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-del{background:none;border:none;color:var(--err);cursor:pointer;font-size:1rem;padding:4px 8px;}
.fila{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
/* v1.6: fila secundaria de "hasta" (fin manual opcional) — más chica
   y con menos margen inferior, para que se lea como un sub-renglón de
   la fila de "desde" de arriba y no como una sección nueva. */
.fila-hasta{margin-top:-4px;margin-bottom:14px;padding-left:4px;opacity:0.85;}
.fila-hasta-label{font-size:0.78rem;color:var(--faint);white-space:nowrap;}
.fila > *{flex:1;min-width:120px;}
.fila .btn-del{flex:0;}
/* v1.7: presets rápidos de duración para el fin manual de sección
   ("hasta") — botones cuadraditos con solo el número de compases. */
.hasta-presets{display:flex;gap:6px;flex:0 0 auto !important;min-width:0 !important;}
.btn-preset{
  flex:0 0 auto;width:38px;height:38px;padding:0;
  background:var(--surf-light);border:1px solid var(--brd);border-radius:8px;
  color:var(--muted);font-family:var(--S);font-size:0.78rem;font-weight:600;
  cursor:pointer;transition:border-color 0.15s,color 0.15s,background 0.15s;
}
.btn-preset:hover{border-color:var(--gold);color:var(--gold);}
.btn-preset.activo{background:var(--gold);border-color:var(--gold);color:#1a1408;}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.row-2{grid-template-columns:1fr;}}
.vacio{color:var(--faint);font-size:0.85rem;padding:10px 0;}
.guardado-ok{font-size:0.78rem;color:var(--ok);margin-top:6px;display:none;}
#previewWrap{background:var(--surf-light);border-radius:8px;padding:16px;}
</style>

<script>
window.NAV_CONFIG = { activo: 'proyecto', sbFootExtra: [], masMobileExtra: [] };

<div class="main-wrap" id="mainWrap">
  <div style="padding:20px 24px 60px; max-width:760px; margin:0 auto;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; flex-wrap:wrap;">
      <h2 style="font-family:var(--T); font-size:1.4rem;">🎧 Guía de práctica</h2>

    </div>
    <p id="contextoTema" style="color:var(--muted); font-size:0.85rem; margin-bottom:20px;">Cargando…</p>

    <div class="card">
      <h3>Datos del tema</h3>
      <div class="row-2">
        <div class="field">
          <label>BPM</label>

            <option value="4/8">4/8 (divisiones de 8, doblar fácil)</option>
            <option value="7/8">7/8</option>
            <option value="12/8">12/8</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Offset del compás 1 (segundos) — dejar en 0 si el tema no tiene intro</label>
        <input type="number" id="inputOffset" min="0" step="0.1" placeholder="Ej: 2.5">

          <option value="son32">Son 3-2</option>
          <option value="rumba23">Rumba 2-3</option>
          <option value="rumba32">Rumba 3-2</option>
          <option value="bossa23">Bossa 2-3</option>

      <div style="margin-top:12px;">

        <div class="guardado-ok" id="okSecciones">✓ Guardado</div>
      </div>
    </div>

    <div class="card">
      <h3>Maquetas por instrumento</h3>
      <p style="color:var(--muted); font-size:0.8rem; margin-bottom:12px;">El BPM/compás/secciones de arriba son del tema (compartidos). Acá cada instrumento puede tener su propia pista de referencia.</p>
      <div id="listaMaquetas"></div>
      <button class="btn-ghost" onclick="agregarFilaMaqueta()">+ Agregar maqueta</button>
      <div style="margin-top:12px;">
        <button class="btn" onclick="guardarMaquetas()">Guardar maquetas</button>
        <div class="guardado-ok" id="okMaquetas">✓ Guardado</div>
      </div>

          <button class="btn-ghost" id="previewPlayBtn" onclick="previewTogglePlay()">▶️ Reproducir click de prueba</button>
        </div>
        <div style="text-align:center; margin-bottom:16px;">
          <div style="font-size:12px; color:var(--muted);">compás</div>
          <div id="previewBar" style="font-size:36px; font-weight:600; color:var(--gold);">1</div>

<script>
const params = new URLSearchParams(location.search);
const proyectoId = params.get('p');
const temaId = params.get('t');
let temaRef = null;
let temaDataActual = {};
let instrumentosDelProyecto = []; // v1.1: instrumentos ya asignados a músicos en las sesiones de este proyecto

// v1.2: faltaba por completo — mismo patrón que proyecto.html (estas 3
// líneas no vienen de firebase-config.js, cada página las declara).
firebase.initializeApp(firebaseConfig);
const db = crearDB();
const auth = firebase.auth();

async function iniciarGuiaPractica(){
  temaRef = db.collection('proyectos').doc(proyectoId).collection('temas').doc(temaId);
  try{
    const [proyDoc, temaDoc, sesionesSnap] = await Promise.all([
      db.collection('proyectos').doc(proyectoId).get(),
      temaRef.get(),
      db.collection('proyectos').doc(proyectoId).collection('sesiones').get()
    ]);
    if(!temaDoc.exists){
      document.getElementById('contextoTema').textContent = 'No se encontró este tema.';
      return;
    }
    temaDataActual = temaDoc.data() || {};
    const nombreProyecto = proyDoc.exists ? (proyDoc.data().nombre || '—') : '—';
    document.getElementById('contextoTema').textContent = `${nombreProyecto} → ${temaDataActual.nombre || '—'}`;

    document.getElementById('inputBpm').value = temaDataActual.practicaBpm || '';
    document.getElementById('inputCompas').value = temaDataActual.practicaCompas || '';
    document.getElementById('inputOffset').value = temaDataActual.practicaOffset || 0;
    document.getElementById('inputClave').value = temaDataActual.practicaClave || '';

    // v1.1: (a pedido) el instrumento de cada maqueta ya NO se escribe
    // a mano — se elige de los instrumentos que YA están asignados a
    // músicos en las sesiones de este proyecto (musicosAsignados[].
    // instrumento), para que el match con musico.html quede
    // garantizado (misma fuente de datos, sin typeos ni sinónimos). No
    // se crea ningún catálogo nuevo ni se toca musicos.html/proyecto.html.
    const setInstrumentos = new Set();
    sesionesSnap.forEach(d => {
      const asignados = Array.isArray(d.data().musicosAsignados) ? d.data().musicosAsignados : [];
      asignados.forEach(m => { if((m.instrumento || '').trim()) setInstrumentos.add(m.instrumento.trim()); });
    });
    instrumentosDelProyecto = [...setInstrumentos].sort((a, b) => a.localeCompare(b));

    renderSecciones(temaDataActual.practicaSecciones || []);
    renderMaquetas(temaDataActual.practicaMaquetas || []);
  } catch(e){
    console.error(e);
    document.getElementById('contextoTema').textContent = 'Error cargando el tema.';
  }
}

function mostrarOk(id){
  const el = document.getElementById(id);
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2000);
}

async function guardarDatosTema(){
  const bpm = parseInt(document.getElementById('inputBpm').value, 10) || null;
  const compas = document.getElementById('inputCompas').value || null;
  const offset = parseFloat(document.getElementById('inputOffset').value) || 0;
  const clave = document.getElementById('inputClave').value || null;
  try{
    await temaRef.update({ practicaBpm: bpm, practicaCompas: compas, practicaOffset: offset, practicaClave: clave });
    temaDataActual.practicaBpm = bpm;
    temaDataActual.practicaCompas = compas;
    temaDataActual.practicaOffset = offset;
    temaDataActual.practicaClave = clave;
    mostrarOk('okDatosTema');
  }catch(e){ console.error(e); alert('No se pudo guardar BPM/compás.'); }
}

// v1.3: duración de un compás completo, según BPM + tipo de compás
// (usa el numerador, ej. "4/4" -> 4 tiempos por compás — mismo
// criterio que previewBeatsPerBar()/musico.html).
function segundosPorCompas(bpm, beatsPerBar){
  if(!bpm || !beatsPerBar) return 0;
  return (60 / bpm) * beatsPerBar;
}
// Redondea un segundo al borde de compás más cercano, respetando el
// offset del compás 1. Si no hay BPM/compás válidos todavía, no
// redondea (devuelve el valor tal cual) para no bloquear al staff.
function snapASegundoDeCompas(seg){
  const bpm = parseFloat(document.getElementById('inputBpm').value) || 0;
  const beatsPerBar = previewBeatsPerBar();
  const offset = parseFloat(document.getElementById('inputOffset').value) || 0;
  const secPerBar = segundosPorCompas(bpm, beatsPerBar);
  if(!secPerBar) return seg;
  const n = Math.round((seg - offset) / secPerBar);
  return Math.max(0, offset + n * secPerBar);
}

// ============ SECCIONES ============
let seccionesEnEdicion = [];

function renderSecciones(secciones){
  seccionesEnEdicion = secciones.map(s => ({ ...s }));
  pintarSecciones();
}

function pintarSecciones(){
  const cont = document.getElementById('listaSecciones');
  if(!seccionesEnEdicion.length){
    cont.innerHTML = '<div class="vacio">Sin secciones todavía.</div>';
    return;
  }
  cont.innerHTML = seccionesEnEdicion.map((s, i) => `
    <div class="fila">
      <input type="text" placeholder="Nombre (ej: Coro)" value="${(s.nombre || '').replace(/"/g,'&quot;')}" onchange="seccionesEnEdicion[${i}].nombre = this.value">
      <input type="number" min="1" step="1" id="seccompas-${i}" placeholder="${'compás ' + compasDeSegundos(s.desdeSegundos)}" oninput="actualizarSeccionDesdeCompas(${i}, this.value)">
      <input type="text" id="sectiempo-${i}" placeholder="Minuto:segundo (ej: 1:30)" value="${segundosATexto(s.desdeSegundos)}" oninput="actualizarSeccionDesdeTiempo(${i}, this.value)">
      <button class="btn-del" onclick="eliminarSeccion(${i})" title="Eliminar">🗑️</button>
    </div>
    <div class="fila fila-hasta">
      <span class="fila-hasta-label">hasta (opcional)</span>
      <input type="number" min="1" step="1" id="sechastacompas-${i}" placeholder="${'compás ' + (s.hastaSegundos != null ? compasDeSegundos(s.hastaSegundos) : '— auto —')}" oninput="actualizarSeccionHastaCompas(${i}, this.value)">
      <input type="text" id="sechastatiempo-${i}" placeholder="Minuto:segundo" value="${s.hastaSegundos != null ? segundosATexto(s.hastaSegundos) : ''}" oninput="actualizarSeccionHastaTiempo(${i}, this.value)">
      <div class="hasta-presets">
        ${[4,8,16,32,64].map(n => `<button type="button" class="btn-preset${esPresetHastaActivo(s, i, n) ? ' activo' : ''}" onclick="setSeccionHastaPreset(${i}, ${n})" title="Fin = ${n} compases desde el inicio de esta sección">x${n}</button>`).join('')}
      </div>
      <button class="btn-del" onclick="limpiarSeccionHasta(${i})" title="Volver a automático (sin fin manual)">↺</button>
    </div>
  `).join('');
}

function agregarFilaSeccion(){
  seccionesEnEdicion.push({ nombre: '', desdeSegundos: 0 });
  pintarSecciones();
}

function eliminarSeccion(i){
  seccionesEnEdicion.splice(i, 1);
  pintarSecciones();
}

function segundosATexto(seg){
  seg = seg || 0;
  const m = Math.floor(seg / 60);
  const s = Math.floor(seg % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function textoASegundos(txt){
  const partes = (txt || '0:0').split(':');
  if(partes.length === 2) return (parseInt(partes[0],10) || 0) * 60 + (parseInt(partes[1],10) || 0);
  return parseInt(partes[0],10) || 0;
}
// v1.4: (a pedido) las secciones también se pueden cargar por N° de
// compás, no solo por minuto:segundo — dos inputs por fila, cada uno
// guarda desdeSegundos directamente al editarlo (gana el último que
// se tocó, mismo criterio que ya usaba el input de tiempo). El campo
// que NO se está editando muestra la conversión en vivo como
// placeholder (preview, no pisa lo que el staff ya escribió ahí).
function segundosDeCompas(compasNum){
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return 0;
  return Math.max(0, previewOffset() + (compasNum - 1) * secPerBar);
}
function compasDeSegundos(seg){
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return 1;
  return Math.max(1, Math.round(((seg || 0) - previewOffset()) / secPerBar) + 1);
}
function actualizarSeccionDesdeTiempo(i, txt){
  seccionesEnEdicion[i].desdeSegundos = textoASegundos(txt);
  const inputCompasEl = document.getElementById('seccompas-' + i);
  if(inputCompasEl) inputCompasEl.placeholder = 'compás ' + compasDeSegundos(seccionesEnEdicion[i].desdeSegundos);
}
function actualizarSeccionDesdeCompas(i, valor){
  const n = parseInt(valor, 10);
  if(!n){
    const inputTiempoEl = document.getElementById('sectiempo-' + i);
    if(inputTiempoEl) inputTiempoEl.placeholder = 'Minuto:segundo (ej: 1:30)';
    return;
  }
  seccionesEnEdicion[i].desdeSegundos = segundosDeCompas(n);
  const inputTiempoEl = document.getElementById('sectiempo-' + i);
  if(inputTiempoEl) inputTiempoEl.placeholder = segundosATexto(seccionesEnEdicion[i].desdeSegundos);
}

// v1.6: (a pedido) fin de sección editable a mano — mismo patrón de
// compás/tiempo en espejo que ya usaba "desde", pero opcional: si se
// deja vacío (hastaSegundos == null/undefined), musico.html sigue
// calculando el fin automáticamente como el inicio de la siguiente
// sección (o +4 compases estimados si es la última), tal como ya
// funcionaba antes de este campo existir.
function actualizarSeccionHastaCompas(i, valor){
  const n = parseInt(valor, 10);
  const inputTiempoEl = document.getElementById('sechastatiempo-' + i);
  if(!n){
    // campo vaciado a mano — no toca hastaSegundos acá; se limpia
    // explícitamente con el botón ↺ (limpiarSeccionHasta), para no
    // perder el valor por accidente al borrar el número mientras se
    // vuelve a escribir.
    return;
  }
  seccionesEnEdicion[i].hastaSegundos = segundosDeCompas(n);
  if(inputTiempoEl) inputTiempoEl.value = segundosATexto(seccionesEnEdicion[i].hastaSegundos);
}
function actualizarSeccionHastaTiempo(i, txt){
  if(!(txt || '').trim()) return; // igual que arriba: vaciar no borra el valor guardado
  seccionesEnEdicion[i].hastaSegundos = textoASegundos(txt);
  const inputCompasEl = document.getElementById('sechastacompas-' + i);
  if(inputCompasEl) inputCompasEl.placeholder = 'compás ' + compasDeSegundos(seccionesEnEdicion[i].hastaSegundos);
}
function limpiarSeccionHasta(i){
  seccionesEnEdicion[i].hastaSegundos = null;
  pintarSecciones();
}

// v1.7: (a pedido) presets rápidos de duración para el fin manual —
// mismo dato final que escribir el compás a mano en "hasta" (hastaSegundos
// = inicio de la sección + n compases), solo que de un click. Se
// recalculan siempre contra BPM/compás vigentes (previewBpm/
// previewBeatsPerBar), igual que segundosDeCompas/compasDeSegundos de
// arriba, así que si el staff ajusta BPM después, el preset ya
// aplicado no se re-ajusta solo (mismo comportamiento que el resto de
// los campos de esta pantalla: son segundos fijos una vez guardados).
function setSeccionHastaPreset(i, n){
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return;
  seccionesEnEdicion[i].hastaSegundos = (seccionesEnEdicion[i].desdeSegundos || 0) + n * secPerBar;
  pintarSecciones();
}
// Resalta el preset activo (botón "encendido") cuando el hastaSegundos
// guardado coincide exactamente con ese múltiplo de compases — solo
// estético, para que el staff vea de un vistazo cuál usó.
function esPresetHastaActivo(s, i, n){
  if(s.hastaSegundos == null) return false;
  const secPerBar = segundosPorCompas(previewBpm(), previewBeatsPerBar());
  if(!secPerBar) return false;
  const esperado = (s.desdeSegundos || 0) + n * secPerBar;
  return Math.abs(s.hastaSegundos - esperado) < 0.01;
}

async function guardarSecciones(){
  // v1.3: snap al borde de compás más cercano (usa BPM/compás/offset
  // actuales) — así el tiempo guardado no depende de que el staff lo
  // haya escrito exacto a mano.
  // v1.6: el fin manual (hastaSegundos) se snapea igual que el
  // inicio, cuando está definido — si quedó undefined/null se guarda
  // tal cual (musico.html lo toma como "sin fin manual, calcular
  // automático").
  const limpio = seccionesEnEdicion
    .filter(s => (s.nombre || '').trim())
    .map(s => ({
      ...s,
      desdeSegundos: snapASegundoDeCompas(s.desdeSegundos || 0),
      hastaSegundos: (s.hastaSegundos != null) ? snapASegundoDeCompas(s.hastaSegundos) : null
    }))
    .sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  try{
    await temaRef.update({ practicaSecciones: limpio });
    temaDataActual.practicaSecciones = limpio;
    mostrarOk('okSecciones');
  }catch(e){ console.error(e); alert('No se pudieron guardar las secciones.'); }
}

// ============ MAQUETAS POR INSTRUMENTO ============
let maquetasEnEdicion = [];

function renderMaquetas(maquetas){
  maquetasEnEdicion = maquetas.map(m => ({ ...m }));
  pintarMaquetas();
}

// v1.1: si el proyecto ya tiene instrumentos asignados en alguna
// sesión, se elige de un <select> (garantiza el match exacto con
// musico.html). Si el proyecto todavía no tiene ningún músico
// asignado, cae a texto libre (mismo comportamiento de antes) para no
// bloquear la carga de maquetas antes de tener asignaciones — y si el
// valor ya guardado no está en la lista (se asignó después de crear
// la maqueta, o cambiaron el texto en la sesión), se agrega igual como
// opción para no perder el dato existente.
function campoInstrumentoHtml(m, i){
  const valorActual = (m.instrumento || '').trim();
  if(!instrumentosDelProyecto.length){
    return `<input type="text" placeholder="Instrumento (ej: Bajo)" value="${valorActual.replace(/"/g,'&quot;')}" onchange="maquetasEnEdicion[${i}].instrumento = this.value">`;
  }
  const opciones = [...instrumentosDelProyecto];
  if(valorActual && !opciones.includes(valorActual)) opciones.push(valorActual);
  return `<select onchange="maquetasEnEdicion[${i}].instrumento = this.value">
    <option value="">— Instrumento —</option>
    ${opciones.map(op => `<option value="${op.replace(/"/g,'&quot;')}" ${op === valorActual ? 'selected' : ''}>${op.replace(/</g,'&lt;')}</option>`).join('')}
  </select>`;
}

function pintarMaquetas(){
  const cont = document.getElementById('listaMaquetas');
  if(!maquetasEnEdicion.length){
    cont.innerHTML = '<div class="vacio">Sin maquetas todavía.</div>';
    return;
  }
  cont.innerHTML = maquetasEnEdicion.map((m, i) => `
    <div class="fila">
      ${campoInstrumentoHtml(m, i)}
      <input type="text" placeholder="URL (YouTube o audio)" value="${(m.url || '').replace(/"/g,'&quot;')}" onchange="maquetasEnEdicion[${i}].url = this.value">
      <select onchange="maquetasEnEdicion[${i}].tipo = this.value">
        <option value="youtube" ${m.tipo === 'youtube' ? 'selected' : ''}>YouTube</option>
        <option value="audio" ${m.tipo === 'audio' ? 'selected' : ''}>Audio directo</option>
      </select>
      <button class="btn-del" onclick="eliminarMaqueta(${i})" title="Eliminar">🗑️</button>
    </div>
  `).join('');
}

function agregarFilaMaqueta(){
  maquetasEnEdicion.push({ instrumento: '', url: '', tipo: 'youtube' });
  pintarMaquetas();
}

function eliminarMaqueta(i){
  maquetasEnEdicion.splice(i, 1);
  pintarMaquetas();
}

async function guardarMaquetas(){
  const limpio = maquetasEnEdicion.filter(m => (m.instrumento || '').trim() && (m.url || '').trim());
  try{
    await temaRef.update({ practicaMaquetas: limpio });
    temaDataActual.practicaMaquetas = limpio;
    mostrarOk('okMaquetas');
  }catch(e){ console.error(e); alert('No se pudieron guardar las maquetas.'); }
}

// ============ PREVIEW DEL CONTADOR (mismo concepto que la demo) ============
let previewPlaying = false;
let previewSynth = null;
let previewLoop = null;
let previewStart = 0;

function previewBeatsPerBar(){
  const compas = document.getElementById('inputCompas').value || '4/4';
  return parseInt(compas.split('/')[0], 10) || 4;
}
function previewBpm(){
  return parseFloat(document.getElementById('inputBpm').value) || 96;
}
function previewOffset(){
  return parseFloat(document.getElementById('inputOffset').value) || 0;
}
function previewSeccionEn(t){
  const secciones = (seccionesEnEdicion || []).filter(s => (s.nombre||'').trim());
  if(!secciones.length) return '—';
  let actual = secciones[0];
  secciones.forEach(s => { if(t >= (s.desdeSegundos||0)) actual = s; });
  return actual.nombre;
}

async function previewTogglePlay(){
  const btn = document.getElementById('previewPlayBtn');
  if(!previewPlaying){
    await Tone.start();
    if(!previewSynth) previewSynth = new Tone.MembraneSynth().toDestination();
    const secPerBeat = 60 / previewBpm();
    previewLoop = new Tone.Loop(time => {
      previewSynth.triggerAttackRelease('C2', '16n', time);
    }, secPerBeat).start(0);
    Tone.Transport.start();
    previewStart = Tone.now();
    previewPlaying = true;
    btn.textContent = '⏸️ Pausar';
    requestAnimationFrame(previewUpdate);
  } else {
    Tone.Transport.pause();
    if(previewLoop) previewLoop.stop();
    previewPlaying = false;
    btn.textContent = '▶️ Reproducir click de prueba';
  }
}

function previewUpdate(){
  if(!previewPlaying) return;
  const elapsed = Tone.now() - previewStart;
  const secPerBeat = 60 / previewBpm();
  const secPerBar = secPerBeat * previewBeatsPerBar();
  const barIndex = Math.max(1, Math.floor((elapsed - previewOffset()) / secPerBar) + 1);
  document.getElementById('previewBar').textContent = barIndex;
  document.getElementById('previewSeccion').textContent = previewSeccionEn(elapsed);
  requestAnimationFrame(previewUpdate);
}

// ============ ARRANQUE / GUARD DE SESIÓN ============
// v1.2: faltaba por completo — la página nunca llamaba a
// iniciarGuiaPractica() ni validaba sesión. Se agrega acá, al final del
// script (después de que todas las variables/funciones ya existen), con
// el mismo patrón de proyecto.html: guard offline vía
// estaModoOfflineActivo() (firebase-config.js), y guard online vía
// auth.onAuthStateChanged() + validación de equipoInterno/{email}.activo
// === true. A diferencia de proyecto.html (que solo marcaba una bandera),
// acá se llama directo a iniciarGuiaPractica() al validar, porque esta
// página es de un solo flujo (staff-only, sin vista previa ni roles).
if(estaModoOfflineActivo()){
  console.info('AUDIOLINK: modo offline activo — guard de sesión omitido.');
  iniciarGuiaPractica();
} else {
  auth.onAuthStateChanged(async (user) => {
    if(!user){
      window.location.href = 'login.html?next=' + encodeURIComponent(location.href);
      return;
    }
    try{
      const doc = await db.collection('equipoInterno').doc(user.email).get();
      if(!doc.exists || doc.data().activo !== true){
        await auth.signOut();
        window.location.href = 'login.html';
        return;
      }
      iniciarGuiaPractica();
    } catch(e){
      console.error('Error validando sesión:', e);
      window.location.href = 'login.html';
    }
  });
}

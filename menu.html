<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú</title>
<!-- AUDIOLINK · menu.html · v1.6
     v1.6: (a pedido) el modal de detalle ahora usa la misma proporción
     e imagen tratada que la card: aspect-ratio 16:7 (antes 4:3) y el
     mismo degradado sutil de fondo (.menu-card-img-overlay, reutilizado
     tal cual, sin texto). En mobile la card sigue ocultando el
     degradado (foto de 120px, ver v1.5), pero el modal SÍ lo mantiene
     en mobile porque ahí la imagen sigue siendo ancho completo, no un
     thumbnail chico.
     v1.5: (a pedido) dos ajustes al banner de la card agregado en v1.4:
     1) Se quita el nombre superpuesto sobre la foto — el texto en
        blanco competía visualmente con la imagen del producto. El
        nombre vuelve a mostrarse siempre en el body de la card, debajo
        de la foto, en desktop y mobile por igual (como en v1.3).
     2) La imagen de la card pasa de 4:3 a 16:7 (banner más angosto,
        panorámico) en vez de un recuadro casi cuadrado — deja el
        degradado sutil de fondo como acabado estético, sin necesidad
        de espacio para texto encima. Aplica solo en desktop; en mobile
        la imagen sigue siendo el cuadro de 120×120 de v1.3 (el aspect
        ratio 16:7 no tendría sentido en un thumbnail chico).
     v1.4: (a pedido) dos cambios, ambos leídos desde cocinaRecetas vía
     el espejo menuPublico (cocina.html v1.24), sin tocar Firestore
     rules ni la colección:
     1) El texto "· por lote de N unidades" en el precio ahora respeta
        mostrarLotePublico (además de la condición previa
        unidadesPorLote > 1). Si el campo no existe (recetas viejas) se
        trata como true, igual patrón que mostrarCantidadesCliente —
        no cambia nada para lo que ya está publicado.
     2) (a pedido, "fx tipo header") en DESKTOP (>600px) la card de la
        grilla mostró temporalmente un banner con degradado + nombre
        superpuesto — revertido en v1.5, ver arriba.
     v1.3: (a pedido) rediseño mobile — el menú es, en la práctica, la
     experiencia principal para casi todos los visitantes (el link se
     comparte y se abre desde el celular). Bajo 600px: tarjetas pasan
     de grid de 2 columnas apretadas a 1 columna en formato horizontal
     ("carta de restaurante": foto de 120px a la izquierda, info a la
     derecha) — mejor que reducir la foto a un cuadro chico, que es lo
     que menos ayuda a vender comida. Botón de cerrar del modal subido
     de 34px a 44px (zona táctil mínima recomendada). Toggle de tema
     reducido y header con más padding lateral en mobile para que no
     quede pegado al borde. Sin cambios de lógica ni de datos leídos.
     v1.2: FIX — faltaba inicializar Firebase (firebase.initializeApp()
     + const db = firebase.firestore()). firebase-config.js solo define
     firebaseConfig y las funciones auxiliares; nunca inicializa la app
     ni crea `db` por sí solo, eso lo hace cada HTML. Sin esas 2 líneas,
     cualquier consulta a Firestore tiraba "ReferenceError: db is not
     defined" y cortaba el resto del script (grilla se quedaba en
     "Cargando menú…" para siempre). Sin cambios de diseño ni de lógica
     de negocio.
     v1.1: (a pedido) toggle claro/oscuro visible para el visitante,
     botón fijo arriba a la derecha del header. El oscuro reutiliza la
     lógica de "Oro Profundo" del resto de Audiolink (fondo casi negro,
     acento dorado) para cuando el producto lo amerite (ej. línea
     gourmet, chocolatería, coctelería) — el claro sigue siendo el
     default porque la mayoría de fotos de comida se ven mejor así.
     Persistencia en localStorage, clave 'audiolink_menu_tema' (mismo
     patrón que 'audiolink_sb_colapsado' del sidebar) — el visitante que
     ya eligió oscuro no tiene que volver a tocarlo en su próxima visita
     desde el mismo navegador. Ambas paletas viven en variables CSS
     (:root y [data-tema="oscuro"]), sin duplicar reglas de layout.
     v1.0: primera versión — portal público de menú (sin login), parte
     del ecosistema Audiolink pero con paleta clara/cálida propia — el
     tema "Oro Profundo" (fondo oscuro, grano, VU meter) está pensado
     para transmitir estudio de grabación; para comida compite con las
     fotos de los platos en vez de resaltarlas. Se mantiene la
     tipografía de familia (Playfair Display / DM Sans) y el mismo nivel
     de pulido, con variante clara.

     Lee SOLO la colección menuPublico (espejo liviano escrito por
     cocina.html v1.24 — nombre, descripción, imagenUrl, precioVenta,
     unidadesPorLote, mostrarCantidadesCliente, mostrarLotePublico,
     insumos sin costo). NUNCA toca cocinaRecetas directamente — ese doc
     completo incluye costoTotal/ganancia/margenPct, información interna
     que no debe exponerse sin login. Requiere agregar la colección
     menuPublico a firestore.rules (lectura pública, escritura solo
     esStaff()) — entregado aparte junto con este archivo.

     Solo vitrina: sin carrito ni botón de pedido (a pedido del usuario,
     puede agregarse después siguiendo el patrón "Menú Selectivo" de
     Sagrada Delicia si se decide sumar interacción).
-->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --bg:#faf6ee;
  --bg-card:#ffffff;
  --border:#e8dfcc;
  --accent:#c2703d;
  --accent-soft:rgba(194,112,61,0.10);
  --text:#2b2620;
  --muted:#8a8073;
  --faint:#b5ab99;
  --T:'Playfair Display', serif;
  --M:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
body[data-tema="oscuro"]{
  --bg:#0b0b0d;
  --bg-card:#151517;
  --border:#2a2a2e;
  --accent:#c4982c;
  --accent-soft:rgba(196,152,44,0.12);
  --text:#f2efe6;
  --muted:#9a978f;
  --faint:#6f6c66;
}
*{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--M); -webkit-font-smoothing:antialiased;
  transition:background-color .2s ease, color .2s ease;
}
.menu-header{
  text-align:center; padding:48px 20px 32px; position:relative;
  border-bottom:1px solid var(--border);
  background:var(--bg-card);
  transition:background-color .2s ease, border-color .2s ease;
}
.menu-tema-toggle{
  position:absolute; top:16px; right:16px;
  width:38px; height:38px; border-radius:50%;
  background:var(--accent-soft); border:1px solid var(--border);
  cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  color:var(--text);
}
.menu-header h1{
  font-family:var(--T); font-size:32px; font-weight:700; margin:0 0 8px;
  color:var(--text);
}
.menu-header p{ margin:0; color:var(--muted); font-size:14px; letter-spacing:0.02em; }

.menu-grid{
  max-width:1100px; margin:0 auto; padding:32px 20px 60px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:22px;
}
.menu-card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  overflow:hidden; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  display:flex; flex-direction:column;
}
.menu-card:hover{ transform:translateY(-3px); box-shadow:0 12px 28px rgba(43,38,32,0.10); }
.menu-card-img{
  width:100%; aspect-ratio:16/7; background:var(--accent-soft);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  position:relative;
}
.menu-card-img img{ width:100%; height:100%; object-fit:cover; display:block; }
.menu-card-img .sin-foto{ color:var(--faint); font-size:13px; }
/* v1.5: banner con degradado (acabado estético) — mismo lenguaje
   visual que .coc-imagen-header de la ficha PDF (cocina.html v1.19),
   SIN nombre superpuesto (quitado a pedido: el texto encima competía
   con la foto). Solo entra en juego cuando la card tiene foto. Oculto
   por defecto en mobile, ver media query. */
.menu-card-img-overlay{
  position:absolute; left:0; right:0; bottom:0; height:38%;
  background:linear-gradient(to top, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 100%);
  pointer-events:none;
}
.menu-card-body{ padding:16px 18px 18px; flex:1; display:flex; flex-direction:column; gap:6px; }
.menu-card-nombre{ font-family:var(--T); font-size:18px; font-weight:700; line-height:1.25; }
.menu-card-precio{ color:var(--accent); font-weight:700; font-size:14px; margin-top:auto; padding-top:6px; }
.menu-card-precio small{ color:var(--muted); font-weight:400; }

.vacio{
  max-width:1100px; margin:60px auto; text-align:center; color:var(--muted); font-size:14px;
}

/* Modal de detalle */
.menu-modal-overlay{
  position:fixed; inset:0; background:rgba(43,38,32,0.45); z-index:999;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.menu-modal{
  background:var(--bg-card); border-radius:16px; max-width:520px; width:100%;
  max-height:88vh; overflow-y:auto; position:relative;
}
.menu-modal-img{ width:100%; aspect-ratio:16/7; overflow:hidden; position:relative; }
.menu-modal-img img{ width:100%; height:100%; object-fit:cover; display:block; }
.menu-modal-cerrar{
  position:absolute; top:12px; right:12px; width:44px; height:44px; border-radius:50%;
  background:rgba(255,255,255,0.92); border:none; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--text);
}
.menu-modal-body{ padding:22px 24px 26px; }
.menu-modal-nombre{ font-family:var(--T); font-size:22px; font-weight:700; margin:0 0 6px; }
.menu-modal-precio{ color:var(--accent); font-weight:700; font-size:15px; margin-bottom:14px; }
.menu-modal-precio small{ color:var(--muted); font-weight:400; }
.menu-modal-desc{ font-size:14px; line-height:1.55; color:var(--text); margin-bottom:16px; white-space:pre-line; }
.menu-modal-seccion-titulo{
  font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:8px;
}
.menu-modal-ing{ font-size:13.5px; color:var(--text); padding:4px 0; display:flex; justify-content:space-between; gap:12px; }
.menu-modal-ing span:last-child{ color:var(--muted); }

@media (max-width:600px){
  .menu-header{ padding:36px 56px 26px; }
  .menu-tema-toggle{ top:12px; right:12px; width:36px; height:36px; font-size:14px; }
  .menu-header h1{ font-size:24px; }
  .menu-header p{ font-size:13px; }
  /* v1.3: 1 columna en vez de grid de 2 — tarjeta horizontal tipo
     "carta de restaurante" (foto más grande a la izquierda, info a la
     derecha) en vez de mosaico chico. Para vender comida la foto tiene
     que verse bien, no reducida a un cuadro de 150px. */
  .menu-grid{
    grid-template-columns:1fr; gap:12px; padding:20px 14px 44px;
  }
  .menu-card{ flex-direction:row; }
  .menu-card-img{ width:120px; min-width:120px; aspect-ratio:1/1; }
  .menu-card-body{ padding:12px 14px; gap:4px; justify-content:center; }
  .menu-card-nombre{ font-size:15.5px; }
  .menu-card-precio{ font-size:13px; }
  .menu-modal-body{ padding:18px 18px 22px; }
  .menu-modal-nombre{ font-size:19px; }

  /* v1.5: el banner angosto con degradado no se usa en la card en
     mobile — con la card horizontal de 120px, el degradado sutil no
     aporta y puede oscurecer una foto ya chica. Se aplica solo dentro
     de .menu-card-img (no toca el mismo overlay reutilizado en el
     modal, que en mobile sigue siendo ancho completo). */
  .menu-card-img .menu-card-img-overlay{ display:none; }
}
</style>
</head>
<body>

<div class="menu-header">
  <button class="menu-tema-toggle" id="btnTemaMenu" onclick="alternarTemaMenu()" title="Cambiar tema">🌙</button>
  <h1 id="menuTitulo">Nuestro menú</h1>
  <p>Elige un producto para ver más detalles</p>
</div>

<div class="menu-grid" id="menuGrid">
  <div class="vacio">Cargando menú…</div>
</div>

<div id="menuModalContainer"></div>

<script>
// v1.1: toggle claro/oscuro, persistido en localStorage — se aplica
// ANTES de pintar la grilla para evitar parpadeo del tema por defecto.
const MENU_TEMA_KEY = 'audiolink_menu_tema';
function aplicarTemaMenu(tema){
  document.body.setAttribute('data-tema', tema);
  const btn = document.getElementById('btnTemaMenu');
  if(btn) btn.textContent = tema === 'oscuro' ? '☀️' : '🌙';
}
function alternarTemaMenu(){
  const actual = document.body.getAttribute('data-tema') === 'oscuro' ? 'oscuro' : 'claro';
  const nuevo = actual === 'oscuro' ? 'claro' : 'oscuro';
  localStorage.setItem(MENU_TEMA_KEY, nuevo);
  aplicarTemaMenu(nuevo);
}
aplicarTemaMenu(localStorage.getItem(MENU_TEMA_KEY) === 'oscuro' ? 'oscuro' : 'claro');

let menuCache = [];

// v1.2: FIX — faltaba inicializar Firebase. firebase-config.js SOLO
// define firebaseConfig/crearDB()/estaModoOfflineActivo(); nunca llama
// firebase.initializeApp() ni crea `db` por sí solo — eso lo hace cada
// HTML por separado (mismo patrón que cocina.html y el resto del
// ecosistema). Sin estas 2 líneas, cualquier db.collection(...) tiraba
// "ReferenceError: db is not defined" y cortaba el resto del script.
// menu.html no usa modo offline (portal público, siempre necesita red
// para mostrarle algo al cliente), así que se usa firebase.firestore()
// directo en vez de crearDB() — no depende de offline-mock.js, que
// tampoco está cargado acá a propósito.
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function _menuEsc(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function _menuMoneda(v){
  return '$' + Math.round(v || 0).toLocaleString('es-CO');
}

db.collection('menuPublico').orderBy('nombre').onSnapshot(snap => {
  menuCache = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderMenuGrid();
}, err => {
  console.error(err);
  document.getElementById('menuGrid').innerHTML = '<div class="vacio">No se pudo cargar el menú. Intenta recargar la página.</div>';
});

function renderMenuGrid(){
  const cont = document.getElementById('menuGrid');
  if(!menuCache.length){
    cont.innerHTML = '<div class="vacio">Por ahora no hay productos publicados en el menú.</div>';
    return;
  }
  cont.innerHTML = menuCache.map(r => `
    <div class="menu-card" onclick="abrirDetalleMenu('${r.id}')">
      <div class="menu-card-img">
        ${r.imagenUrl
          ? `<img src="${r.imagenUrl}" alt="${_menuEsc(r.nombre)}"><div class="menu-card-img-overlay"></div>`
          : `<span class="sin-foto">Sin foto</span>`}
      </div>
      <div class="menu-card-body">
        <div class="menu-card-nombre">${_menuEsc(r.nombre || 'Producto')}</div>
        <div class="menu-card-precio">${_menuPrecioTexto(r)}</div>
      </div>
    </div>`).join('');
}

// v1.4: agrega chequeo de mostrarLotePublico (además de unidadesPorLote
// > 1, condición ya existente). Campo ausente (recetas viejas) se lee
// como true — mismo patrón que mostrarCantidadesCliente — para no
// cambiar nada de lo que ya está publicado en el menú.
function _menuPrecioTexto(r){
  const base = `${_menuMoneda(r.precioVenta)} <small>c/u</small>`;
  const mostrarLote = r.mostrarLotePublico !== false;
  if(mostrarLote && (r.unidadesPorLote || 0) > 1){
    return `${base} <small>· por lote de ${_menuEsc(r.unidadesPorLote)} unidades</small>`;
  }
  return base;
}

function abrirDetalleMenu(id){
  const r = menuCache.find(x => x.id === id);
  if(!r) return;

  const mostrarCantidades = r.mostrarCantidadesCliente !== false;
  const htmlIngredientes = (r.insumos || []).length ? `
    <div class="menu-modal-seccion-titulo">Ingredientes</div>
    ${(r.insumos || []).map(i => mostrarCantidades ? `
      <div class="menu-modal-ing"><span>${_menuEsc(i.nombre)}</span><span>${_menuEsc(i.cantidad)} ${_menuEsc(i.unidad)}</span></div>`
      : `<div class="menu-modal-ing"><span>${_menuEsc(i.nombre)}</span></div>`).join('')}
  ` : '';

  const html = `
  <div class="menu-modal-overlay" onclick="if(event.target===this) cerrarDetalleMenu()">
    <div class="menu-modal">
      <button class="menu-modal-cerrar" onclick="cerrarDetalleMenu()">✕</button>
      ${r.imagenUrl ? `<div class="menu-modal-img"><img src="${r.imagenUrl}" alt="${_menuEsc(r.nombre)}"><div class="menu-card-img-overlay"></div></div>` : ''}
      <div class="menu-modal-body">
        <div class="menu-modal-nombre">${_menuEsc(r.nombre || 'Producto')}</div>
        <div class="menu-modal-precio">${_menuPrecioTexto(r)}</div>
        ${r.descripcion ? `<div class="menu-modal-desc">${_menuEsc(r.descripcion)}</div>` : ''}
        ${htmlIngredientes}
      </div>
    </div>
  </div>`;
  document.getElementById('menuModalContainer').innerHTML = html;
}

function cerrarDetalleMenu(){
  document.getElementById('menuModalContainer').innerHTML = '';
}
</script>

</body>
</html>

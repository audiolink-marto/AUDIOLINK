}
// apaga el resaltado de ESTA sección puntual. No toca
// est.ultimaSeccionChip a propósito: mientras el audio siga dentro de
// la misma sección, actualizarContadorPractica (ver "nuevoChipKey !==
// est.ultimaSeccionChip") no vuelve a tocar estas clases porque no
// detecta cambio de sección — así el apagado se mantiene solo hasta
// que el playback realmente entre a otra sección, momento en el que
// el resaltado automático de siempre vuelve a prender la que
// corresponda, sin que haga falta un flag extra ni limpieza manual.
function desactivarSeccionResaltada(uid, segundos){
  const est = estadoPractica[uid];
  if(!est) return;
  if(est.loopSeccionActivo) toggleLoopSeccionPractica(uid);
  const bloque = document.getElementById('mapabloque-' + uid + '-' + segundos);
  if(bloque) bloque.classList.remove('activo');
  const chip = document.getElementById('chip-' + uid + '-' + segundos);
  if(chip) chip.classList.remove('activo');
  const elSeccion = document.getElementById('seccion-' + uid);
  if(elSeccion) elSeccion.style.display = 'none';
  // FIX (ya resuelto en ensayo.html v3.212) el resaltado DORADO dentro
  // del waveform (dibujarWaveform, idxSeccionActiva) es un dibujo
  // aparte que se recalcula cada frame solo mirando tiempoActual — no
  // sabía nada de esta clase .activo, así que la franja de la sección
  // seguía pintada en el canvas. Se guarda est.seccionDesactivadaSegundos
  // para que dibujarWaveform la salte (ver ahí), y se fuerza un
  // redibujo ahora mismo para que el apagado se vea al toque.
  est.seccionDesactivadaSegundos = segundos;
  if(est.getTiempoActual) dibujarWaveform(uid, est.getTiempoActual());
}
// v1.9: acceso rápido — salta directo al inicio de la sección tocada,
// en el reproductor que esté activo en ese momento (YouTube, audio
// original, o archivo local si ya se cargó uno).
function irASeccionPractica(uid, segundos){
  const est = estadoPractica[uid];
  if(!est) return;
  // v3.50: (a pedido) guia-practica.html calcula 'segundos' solo con el
  // offset OFICIAL (Firebase) — no conoce offsetLocalDelta (la
  // calibración fina por archivo/dispositivo, panel dorado). Si acá
  // hay un offsetLocalDelta distinto de 0, hay que sumarlo para que el
  // salto caiga en el mismo punto real que ya usa el resto de la app
  // (metrónomo, click, contador — todos restan offset+offsetLocalDelta).
  // Sin esto, el contador mostraba un compás distinto al configurado en
  // Secciones apenas se tocaba el chip.
  // v3.180: (a pedido) FIX — esa suma solo aplica a secciones del TEMA
  // (est.secciones, en segundos "crudos" contra el offset oficial). Las
  // secciones LOCALES (est.seccionesLocales, v3.174) se crean con
  // est.getTiempoActual() — ya son tiempo REAL del archivo, sumarles
  // offsetLocalDelta de nuevo las corría del punto correcto (el salto
  // no caía al inicio real de la sección, que era justo lo que se
  // pedía acá). Con archivo local cargado, seccionesRuntimeDe siempre
  // devuelve las locales (nunca las del tema), así que alcanza con
  // mirar est.archivoLocalUrl para decidir cuál es el caso.
  const segundosReal = est.archivoLocalUrl ? segundos : segundos + (est.offsetLocalDelta || 0);
  est.seek(segundosReal);
  // v3.47: (a pedido) el margen de tolerancia de v3.42 (para el
  // desfasaje de precisión del seek en archivo local) se estaba
  // aplicando SIEMPRE, incluso durante reproducción normal en curso —
  // eso hacía que cualquier sección "encendiera" 0.25s antes de su
  // límite real. Ahora el margen solo se activa por un instante justo
  // después de un salto manual de sección (acá), cubriendo el evento
  // 'seeked' que llega con el tiempo real (posiblemente impreciso), y
  // se apaga solo después de 800ms — la reproducción normal ya no lo
  // usa, así que el límite vuelve a ser exacto.
  // (seekManualObjetivo sigue guardando el segundo CRUDO, sin sumar
  // offsetLocalDelta — es lo que compara actualizarContadorPractica
  // contra sec.desdeSegundos, también crudo, para saber qué sección fue
  // el objetivo del salto reciente.)
  est.seekManualObjetivo = segundos;
  clearTimeout(est.seekManualObjetivoTimeout);
  est.seekManualObjetivoTimeout = setTimeout(() => { est.seekManualObjetivo = null; }, 800);
  // v3.41: (a pedido) si está en pausa, nada dispara el refresco de UI
  // (chip encendido, barra de progreso, waveform) hasta que se le da
  // play — ahora se fuerza ese refresco acá mismo, así el chip prende
  // y el audio-bar se ubica de una vez, esté sonando o no.
  actualizarContadorPractica(uid, segundosReal);
  dibujarWaveform(uid, segundosReal);
}

// (a pedido) loop automático: mientras está activo, cada vez que el
// playback llega al final de la sección actual (mismo límite finSec que
// ya calcula el bloque de progreso más abajo) vuelve al inicio de ESA
// MISMA sección — si el músico avanza a otra sección (chip o seek
// manual), el loop sigue "la sección actual" en cada momento, no queda
// pegado a la que estaba activa cuando se prendió el botón. Se excluye
// con el loop manual (marcarLoopPractica): activar uno apaga el otro.
function toggleLoopSeccionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(!est.loopSeccionActivo && est.loopActivo) marcarLoopPractica(uid);
  est.loopSeccionActivo = !est.loopSeccionActivo;
  // v3.178: (a pedido) pasa de checkbox a botón cuadrado icon-only —
  // ya no hay "checked" que alternar, se usa la misma clase .activo
  // que el resto de los botones cuadrados del panel (ver
  // .practica-click-btn.activo).
  const chk = document.getElementById('loopseccionbtn-' + uid);
  if(chk) chk.classList.toggle('activo', est.loopSeccionActivo);
  // v3.29: al apagar, borra la franja del waveform que este loop venía
  // dibujando (loopInicio/loopFin se van seteando solo mientras está
  // activo, ver actualizarContadorPractica). Al encender no hace falta
  // nada acá — se setean solos en el próximo tick.
  if(!est.loopSeccionActivo){
    est.loopInicio = null; est.loopFin = null;
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());

  // v3.220: (a pedido) "el loop de sección quedó sin banderitas" — al encender,
  // loopInicio/loopFin solo se seteaban en el próximo tick de reproducción
  // (actualizarContadorPractica), así que en pausa (o hasta que arrancaba el
  // audio) no se veían ni la franja ni las banderitas de inicio/fin. Ahora se

  else if(est.getTiempoActual){

// v3.213: (a pedido) "hacemos la barrita de progreso más interactiva,
// que identifique compases y loops?" — dos agregados puramente
// visuales a la barra de progreso de sección (.practica-progreso-
// barra), reusando datos que actualizarContadorPractica ya calcula
// (compasesSeccion/inicioSec/finSec), sin tocar su interacción de
// click (toggleLoopSeccionPractica) ni el % de avance (elFill).
//
// Marcas de compás: una raya fina por compás dentro de la sección
// activa, más marcada cada 4 compases (fraseo típico). Se regenera
// solo cuando cambia la cantidad de compases de la sección (cacheado
// en est.progresoTicksCompases) — no en cada frame, para no tocar el
// DOM 60 veces por segundo sin necesidad.
function actualizarTicksProgresoPractica(uid, est, compasesSeccion){
  if(est.progresoTicksCompases === compasesSeccion) return;
  est.progresoTicksCompases = compasesSeccion;
  const cont = document.getElementById('progticks-' + uid);
  if(!cont) return;
  let html = '';
  for(let i = 1; i < compasesSeccion; i++){
    const pct = (i / compasesSeccion) * 100;
    const clase = (i % 4 === 0) ? 'practica-progreso-tick mayor' : 'practica-progreso-tick';
    html += `<div class="${clase}" style="left:${pct}%;"></div>`;
  }
  cont.innerHTML = html;
}

// Franja de loop: resalta (mismo verde var(--ok) que ya usa la franja
// del loop en el waveform, ver dibujarWaveform) el tramo de la barra
// que cae dentro del loop marcado (est.loopInicio/est.loopFin —
// incluye tanto el loop manual como el loop de sección completa,
// est.loopSeccionActivo, que en ese caso cubre el 100% del ancho),
// recortado a los límites de la sección visible (inicioSec/finSec).
function actualizarLoopRangeProgresoPractica(uid, est, inicioSec, finSec){
  const el = document.getElementById('progloop-' + uid);
  if(!el) return;
  if(est.loopInicio == null || est.loopFin == null || finSec <= inicioSec){
    el.style.display = 'none';
    return;
  }
  const a = Math.max(inicioSec, est.loopInicio);
  const b = Math.min(finSec, est.loopFin);
  if(b <= a){
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.style.left = (((a - inicioSec) / (finSec - inicioSec)) * 100) + '%';
  el.style.width = (((b - a) / (finSec - inicioSec)) * 100) + '%';
}

// v3.84: (a pedido, Fase 3) muestra/oculta el panel de cifrado/letra de

// v3.85: (a pedido) exporta la estructura de ESTA sesión a PDF, mismo

// v3.109: (a pedido) misma búsqueda que ya hacía actualizarContadorPractica
// (línea ~3810) para saber en qué sección cae un tiempo dado, extraída
// acá para reusarla en el snap de loops (marcarLoopPractica/
// loopRapidoCompasesPractica) — sin margen (MARGEN_SECCION es un ajuste
// propio del chip/etiqueta en vivo, no aplica al snap de un loop).
// v3.111: seccionEnSegundoMusico() (v3.109) se retira acá — quedó sin
// uso: los loops ya pasan a usar recorrerTramosMusico/tramoMusicoEnSegundo
// de abajo, que hacen lo mismo y además anclan correctamente contra el
// inicio del tramo (ver comentario en marcarLoopPractica).
// v3.111: (a pedido) constructor único de tramos — fusiona y reemplaza
// tramosClickMusico/tramoClickEnSegundo (v3.110) y el uso suelto de
// seccionEnSegundoMusico en los loops (v3.109). Mismo criterio que
// recorrerTramos()/compasDeSegundos() de guia-practica.html, ahora con
// compasInicio ACUMULADO — necesario para el contador en vivo y el
// rango "Compás X-Y" de la etiqueta de sección, que necesitan la
// numeración ABSOLUTA de compás (no solo saber el compás/beats del
// tramo actual, que era lo único que necesitaba el click en v3.110).
// Un solo lugar con el criterio: contador, puntos (sin clave), loops y
// click ahora comparten el mismo modelo de tramos.
function recorrerTramosMusico(secciones, offset, bpm, beatsGeneral, forzarGeneral){
  const secs = (secciones || []).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const tramos = [];
  let inicioSeg = offset;
  let compasAcumulado = 1;
  const primerInicio = secs.length ? Math.max(secs[0].desdeSegundos || 0, offset) : Infinity;
  if(!secs.length || primerInicio > offset){
    const beats = beatsGeneral;
    const secPerBar = bpm ? (60 / bpm) * beats : 0;
    const finSeg = secs.length ? primerInicio : Infinity;
    tramos.push({ inicioSeg, finSeg, beats, secPerBar, compasInicio: compasAcumulado, claveSeccion: null });
    if(secPerBar && finSeg !== Infinity) compasAcumulado += Math.round((finSeg - inicioSeg) / secPerBar);
    inicioSeg = finSeg;
  }
  secs.forEach((s, idx) => {
    const desde = Math.max(s.desdeSegundos || 0, inicioSeg);
    const siguienteInicio = (idx + 1 < secs.length) ? secs[idx + 1].desdeSegundos : null;
    const finSeg = (siguienteInicio != null) ? siguienteInicio : ((s.hastaSegundos != null) ? s.hastaSegundos : Infinity);
    const beats = beatsPorBarraDeSeccionMusico(s, beatsGeneral, forzarGeneral);
    const secPerBar = bpm ? (60 / bpm) * beats : 0;
    tramos.push({ inicioSeg: desde, finSeg, beats, secPerBar, compasInicio: compasAcumulado, claveSeccion: s.claveSeccion || null });
    if(secPerBar && finSeg !== Infinity) compasAcumulado += Math.round((finSeg - desde) / secPerBar);
    inicioSeg = finSeg;
  });
  return tramos;
}
function tramoMusicoEnSegundo(tramos, seg){
  let actual = tramos[0];
  tramos.forEach(t => { if((seg || 0) >= t.inicioSeg) actual = t; });
  return actual;
}
function compasDeSegundosMusico(tramos, seg){
  const t = tramoMusicoEnSegundo(tramos, seg);
  if(!t || !t.secPerBar) return 1;
  return Math.max(1, t.compasInicio + Math.round(((seg || 0) - t.inicioSeg) / t.secPerBar));
}
// v3.110 tenía acá tramosClickMusico()/tramoClickEnSegundo(), una
// versión simplificada (sin compasInicio) usada solo por el click.
// v3.111 los retira: recorrerTramosMusico()/tramoMusicoEnSegundo() de
// arriba hacen exactamente lo mismo (y más), así que el scheduler
// pasa a usar esos — un solo constructor de tramos para todo el
// archivo (contador, puntos, loops y click).
function exportarEstructuraPracticaPDF(uid){
  const est = estadoPractica[uid];
  if(!est){ return; }
  if(!est.secciones || !est.secciones.length){ mostrarToast('Este tema no tiene secciones cargadas todavía.', 'info'); return; }

  // v3.100: mismo cálculo de duración que ya usaba este archivo (secPerBar
  // a partir de bpm/compasesPorBarra, fin = hastaSegundos manual o el
  // desdeSegundos de la próxima sección) — es lo único que de verdad
  // difiere de guia-practica.html (que usa duracionCompasesSeccion, basado
  // solo en hastaSegundos manual, sin caer a la próxima sección). El
  // dibujo (dibujarCajas/dibujarCajaBreak/letra de ensayo/D.C./coda/barra
  // de repetición) vive en pdf-estructura.js, compartido con el staff.
  // v1.81: secPerBar general ya no se usa acá directo — se mueve DENTRO
  // del .map() de abajo (secPerBarSeccion), por sección, para respetar
  // compasOverride.
  const claveTxt = est.clave ? (CLAVE_ETIQUETAS[est.clave] || est.clave) : null;

  const secciones = est.secciones.slice().sort((a, b) => (a.desdeSegundos || 0) - (b.desdeSegundos || 0));
  const seccionesParaPDF = secciones.map((s, i) => {
    // v3.103: (a pedido) FIX — antes las secciones Vamp (Solo/Coro)
    // quedaban con duracion=null a propósito, porque la versión vieja de
    // pdf-estructura.js no la necesitaba (usaba cicloCompases para la
    // grilla). Desde pdf-estructura.js v1.46 el contador global de
    // compases (#N, título "· N comp.", "se repite xN", resumen
    // "c.#X-c.#Y") SÍ necesita duracion también en los Vamp — al llegar
    // null, el contador se apagaba apenas pasaba la 1ra sección Vamp y
    // todo lo que venía después se quedaba sin numerar. Ahora se calcula
    // igual para todos los tipos, misma fórmula de siempre (por tiempo
    // real: hastaSegundos manual, o si no hay, el desdeSegundos de la
    // sección siguiente).
    // v1.81: (a pedido) secPerBar ahora es POR SECCIÓN (respeta
    // s.compasOverride), no el fijo de arriba — mismo `secPerBar`
    // general de siempre cuando la sección no tiene override.
    const secPerBarSeccion = est.bpm ? (60 / est.bpm) * beatsPorBarraDeSeccionMusico(s, compasEfectivoDe(est)) : 0;
    const siguiente = secciones[i+1] || null;
    const finSec = (s.hastaSegundos != null) ? s.hastaSegundos : (siguiente ? siguiente.desdeSegundos : null);
    const duracion = (secPerBarSeccion > 0 && finSec != null) ? Math.max(1, Math.round((finSec - (s.desdeSegundos||0)) / secPerBarSeccion)) : null;
    return Object.assign({}, s, {
      duracion: duracion,
      color: colorDeSeccionEnLista(secciones, i)
    });
  });

  generarEstructuraPDF({
    temaNombre: est.temaNombre || 'Tema',
    bpm: est.bpm || '—',
    compasTexto: est.compasTexto || '4/4',
    claveTxt: claveTxt,
    anacrusa: !!est.anacrusa,
    secciones: seccionesParaPDF
  });
}

// v3.107: (a pedido) "PDF Percusión" — mismo armado de datos que
// exportarEstructuraPracticaPDF de arriba (mismo `secciones`, mismo
// `duracion`/`color` ya resueltos, incluido el FIX v3.103 de duracion
// en Vamp y el v1.81 de compasOverride por sección), pero llama a
// generarEstructuraPDFPercusion (pdf-percusion.js) en vez de
// generarEstructuraPDF (pdf-armonias.js). Los campos propios de
// percusión (esCampana, instrumentosPercusion, acentosPorCompas,
// notasPercusionPorCompas) ya vienen dentro de `s` desde Firestore
// (se cargan en guia-practica.html) — Object.assign los copia tal cual,
// no hace falta leerlos acá. Cero cambios en exportarEstructuraPracticaPDF.
function exportarEstructuraPracticaPDFPercusion(uid){
  const est = estadoPractica[uid];

  // v1.81: secPerBar general ya no se usa directo — se mueve dentro del
  // .map() (secPerBarSeccion), mismo criterio que exportarEstructuraPracticaPDF.
  const claveTxt = est.clave ? (CLAVE_ETIQUETAS[est.clave] || est.clave) : null;

  const secciones = est.secciones.slice().sort((a, b) => (a.desdeSegundos || 0) - (b.desdeSegundos || 0));
  const seccionesParaPDF = secciones.map((s, i) => {
    const secPerBarSeccion = est.bpm ? (60 / est.bpm) * beatsPorBarraDeSeccionMusico(s, compasEfectivoDe(est)) : 0;
    const siguiente = secciones[i+1] || null;
    const finSec = (s.hastaSegundos != null) ? s.hastaSegundos : (siguiente ? siguiente.desdeSegundos : null);
    const duracion = (secPerBarSeccion > 0 && finSec != null) ? Math.max(1, Math.round((finSec - (s.desdeSegundos||0)) / secPerBarSeccion)) : null;
    return Object.assign({}, s, {
      duracion: duracion,
      color: colorDeSeccionEnLista(secciones, i)
    });
  });

  generarEstructuraPDFPercusion({
    temaNombre: est.temaNombre || 'Tema',
    bpm: est.bpm || '—',
    compasTexto: est.compasTexto || '4/4',
    claveTxt: claveTxt,
    anacrusa: !!est.anacrusa,

}

// v3.84.1: (a pedido, Fase 3) sincroniza el panel de letra/acordes con
// el compás actual, reusando los datos que YA carga el staff en
// guia-practica.html (acordesPorCompas/letraPorCompas en secciones
// fijas, acordesCiclo/letraCiclo en vamps — v1.19) en vez de un campo
// nuevo: nada de esto se edita en musico.html, es solo lectura. Llamada
// desde actualizarContadorPractica() en cada frame, pero el trabajo
// pesado (reconstruir las líneas) solo corre cuando CAMBIA la sección
// activa (est.ultimaSeccionCifradoKey) — el resaltado de línea (lo que
// sí cambia seguido) solo toca clases, mismo criterio que ya usa el
// resto del archivo para no trabajar de más en cada frame (ver flash de
// compás/dots más arriba).
// `seccion` es la sección activa tal cual la calcula
// actualizarContadorPractica (o null si no hay ninguna sonando);
// `barIndexActual`/`barInicio` son el mismo número de compás global que
// ya se muestra en el contador grande y en "Compás X–Y" de la etiqueta
// de sección (v3.82) — así el índice de línea activa sale de restar
// ambos, sin numeración propia. `duracionCompases` es el mismo
// compasesSeccion que ya calcula el llamador para esa etiqueta (no
// aplica a vamps, que usan su propio cicloCompases cíclico).
function actualizarCifradoPractica(uid, est, seccion, barIndexActual, colorIdx, barInicio, duracionCompases, listaSecciones){
  const btn = document.getElementById('cifradotoggle-' + uid);
  const panel = document.getElementById('cifradopanel-' + uid);
  if(!btn || !panel) return;
  const esVamp = seccion && seccion.tipo === 'vamp';
  const acordes = seccion && (esVamp ? seccion.acordesCiclo : seccion.acordesPorCompas);
  const letra = seccion && (esVamp ? seccion.letraCiclo : seccion.letraPorCompas);
  const total = seccion ? (esVamp ? (seccion.cicloCompases || (acordes && acordes.length) || 0) : (duracionCompases || 0)) : 0;
  // v3.86: (a pedido) repetición con 1ra/2da vez (guia-practica.html
  // v1.22) — acordesPorCompas/letraPorCompas ahora representan UNA sola
  // pasada (basePase), no el total real de compases de la sección
  // (total, que ya incluye todas las pasadas si repeticiones>1). Este
  // mapa traduce "compás j de la sección" → "casilla de qué pasada",
  // y en la ÚLTIMA pasada, si cae dentro de los finalDistintoN compases
  // finales, lee de acordesFinal2/letraFinal2 en vez de la pasada base.
  // repeticiones=1 (default, sin cambios) hace basePase===total, o sea
  // se comporta exactamente igual que antes.
  const repeticiones = (!esVamp && seccion && seccion.repeticiones) || 1;
  const basePase = repeticiones > 1 ? Math.max(1, Math.round(total / repeticiones)) : total;
  const finalN = repeticiones > 1 ? Math.min(basePase, seccion.finalDistintoN || 1) : 0;
  const obtenerAcordeLetra = (j) => {
    if(repeticiones <= 1) return { ac: (acordes && acordes[j]) || '', le: (letra && letra[j]) || '' };
    const pasada = Math.floor(j / basePase);
    const pos = j % basePase;
    if(pasada === repeticiones - 1 && pos >= basePase - finalN){
      const k = pos - (basePase - finalN);
      return { ac: (seccion.acordesFinal2 && seccion.acordesFinal2[k]) || '', le: (seccion.letraFinal2 && seccion.letraFinal2[k]) || '' };
    }
    return { ac: (acordes && acordes[pos]) || '', le: (letra && letra[pos]) || '' };
  };
  const hayDato = total > 0 && ((acordes && acordes.some(a => (a || '').trim())) || (letra && letra.some(l => (l || '').trim())));
  if(!hayDato){
    btn.style.display = 'none';
    panel.style.display = 'none';
    btn.classList.remove('abierto');
    est.ultimaSeccionCifradoKey = null;
    est.ultimaLineaCifradoIdx = undefined;
    return;
  }
  btn.style.display = '';
  panel.style.setProperty('--sec-color', colorDeSeccionEnLista(listaSecciones || [], colorIdx));
  const seccionKey = seccion.desdeSegundos;
  if(est.ultimaSeccionCifradoKey !== seccionKey){
    est.ultimaSeccionCifradoKey = seccionKey;
    est.ultimaLineaCifradoIdx = undefined;
    est.cifradoTotal = total;
    est.cifradoEsVamp = esVamp;
    est.cifradoBarInicio = barInicio;
    const lineasHtml = [];
    for(let j = 0; j < total; j++){
      const { ac, le } = esVamp ? { ac: (acordes && acordes[j]) || '', le: (letra && letra[j]) || '' } : obtenerAcordeLetra(j);
      const texto = ac && le ? `${ac} — ${le}` : (ac || le || '·');
      const pasadaTxt = (!esVamp && repeticiones > 1) ? ` <span class="practica-cifrado-pasada">(${Math.floor(j / basePase) + 1}ª vez)</span>` : '';
      lineasHtml.push(`<div class="practica-cifrado-linea" id="cifradolinea-${uid}-${j}"><span class="practica-cifrado-num">c.${j + 1}</span> ${escapeHtml(texto)}${pasadaTxt}</div>`);
    }
    // v3.88: (a pedido) si la sección es una variación (guia-practica.html
    // v1.26/esVariacion), se muestra una línea de aviso arriba del
    // cifrado para que el músico sepa en vivo que este cuadro NO es
    // igual al de una aparición anterior de la misma sección.
    const notaVariacionHtml = seccion.esVariacion
      ? `<div class="practica-cifrado-nota-variacion">🔁 Variación${(seccion.notaVariacion || '').trim() ? ': ' + escapeHtml(seccion.notaVariacion.trim()) : ''}</div>`
      : '';
    panel.innerHTML = notaVariacionHtml + lineasHtml.join('');
  }
  let idxActiva = -1;
  if(total > 0){
    if(esVamp){
      idxActiva = ((barIndexActual - barInicio) % total + total) % total;
    } else {
      idxActiva = Math.min(total - 1, Math.max(-1, barIndexActual - barInicio));
    }
  }
  if(idxActiva !== est.ultimaLineaCifradoIdx){
    if(est.ultimaLineaCifradoIdx != null && est.ultimaLineaCifradoIdx >= 0){
      const prev = document.getElementById('cifradolinea-' + uid + '-' + est.ultimaLineaCifradoIdx);
      if(prev) prev.classList.remove('activa');
    }
    if(idxActiva >= 0){
      const cur = document.getElementById('cifradolinea-' + uid + '-' + idxActiva);
      if(cur){
        cur.classList.add('activa');
        if(panel.style.display !== 'none') cur.scrollIntoView({block: 'nearest', behavior: 'smooth'});
      }
    }
    est.ultimaLineaCifradoIdx = idxActiva;
  }
}

// v3.6: persistencia de ajustes de metrónomo en localStorage, por uid
// ('practica-'+id de sesión). Solo lo que ya vivía en memoria en
// estadoPractica[uid] — nunca toca Firestore ni el dato real del
// tema. Si localStorage falla (modo privado, cuota, etc.) se ignora
// en silencio, el metrónomo sigue funcionando solo que sin recordar.
function guardarAjustesPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  try{
    localStorage.setItem('audiolink-ajustes-' + uid, JSON.stringify({
      bpmOverride: est.bpmOverride,
      claveOverride: est.claveOverride,
      tonalidadOverride: est.tonalidadOverride,
      compasesOverride: est.compasesOverride,
      subdivisionOverride: est.subdivisionOverride,
      sonidoClick: est.sonidoClick,
      sonidoClave: est.sonidoClave,
      acentos: est.acentos,
      acentosClave: est.acentosClave,
      volFuerte: est.volFuerte,
      volNormal: est.volNormal,
      clickActivo: est.clickActivo,
      claveActiva: est.claveActiva,
      pendVelocidadOverride: est.pendVelocidadOverride
    }));
  }catch(e){}
}

// v3.6: se llama al inicializar, antes de recalcularEfectivoPractica,
// para que los overrides restaurados ya entren en el primer cálculo
// de bpm/clave efectivos. Si no hay nada guardado o el JSON es
// inválido, deja los valores por defecto que ya trae estadoPractica[uid]
// intactos.
function cargarAjustesGuardados(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  let guardado;
  try{
    const raw = localStorage.getItem('audiolink-ajustes-' + uid);
    if(!raw) return;
    guardado = JSON.parse(raw);
  }catch(e){ return; }
  if(!guardado || typeof guardado !== 'object') return;
  if(guardado.bpmOverride != null) est.bpmOverride = guardado.bpmOverride;
  if(guardado.claveOverride !== undefined) est.claveOverride = guardado.claveOverride;
  if(guardado.tonalidadOverride !== undefined) est.tonalidadOverride = guardado.tonalidadOverride;
  if(guardado.compasesOverride !== undefined) est.compasesOverride = guardado.compasesOverride;
  if(guardado.subdivisionOverride) est.subdivisionOverride = guardado.subdivisionOverride;
  if(guardado.sonidoClick) est.sonidoClick = guardado.sonidoClick;
  if(guardado.sonidoClave) est.sonidoClave = guardado.sonidoClave;
  if(Array.isArray(guardado.acentos) && guardado.acentos.length === est.acentos.length) est.acentos = guardado.acentos;
  if(Array.isArray(guardado.acentosClave) && guardado.acentosClave.length === est.acentosClave.length) est.acentosClave = guardado.acentosClave;
  if(typeof guardado.volFuerte === 'number') est.volFuerte = guardado.volFuerte;
  if(typeof guardado.volNormal === 'number') est.volNormal = guardado.volNormal;
  if(typeof guardado.clickActivo === 'boolean') est.clickActivo = guardado.clickActivo;
  if(typeof guardado.claveActiva === 'boolean') est.claveActiva = guardado.claveActiva;
  if(guardado.pendVelocidadOverride) est.pendVelocidadOverride = guardado.pendVelocidadOverride;
}

// v3.12: (a pedido) borra del localStorage los ajustes de metrónomo
// (audiolink-ajustes-practica-*) de sesiones que ya no vienen en la

// v3.48: (a pedido) persistencia del pre-conteo (activo + 1/2 compases)
// como preferencia GENERAL del navegador — a diferencia de
// cargarAjustesGuardados (arriba), que es por sesión/tema, esta usa una
// única clave fija en localStorage, así que aplica igual sin importar

// escribe cada vez que el músico toca el botón de pre-conteo o elige

function limpiarAjustesPracticaHuerfanos(sesionesVigentes){
  try{
    const prefijo = 'audiolink-ajustes-practica-';
    const idsVigentes = new Set(sesionesVigentes.map(s => prefijo + s.id));
    for(let i = localStorage.length - 1; i >= 0; i--){
      const key = localStorage.key(i);
      if(key && key.indexOf(prefijo) === 0 && !idsVigentes.has(key)){
        localStorage.removeItem(key);
      }
    }
  }catch(e){}
}

// v2.4: recalcula bpm/clave EFECTIVOS (con overrides) y sus onsets —
// se llama al inicializar el estado y cada vez que el músico cambia
// BPM o clave en el panel de ajustes. Nunca toca est.bpm/est.clave
// (los valores reales del tema), solo los campos "*Efectivo".
function recalcularEfectivoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmEf = est.bpmOverride || est.bpm;
  const claveEf = est.claveOverride !== undefined ? est.claveOverride : est.clave;
  const secPerBeatEf = 60 / bpmEf;
  const secPerBarEf = secPerBeatEf * compasEfectivoDe(est);
  est.bpmEfectivo = bpmEf;
  est.claveEfectiva = claveEf;
  est.claveOnsetsEfectivo = claveEf ? construirOnsetsClave(claveEf, secPerBeatEf, secPerBarEf) : [];
  est.claveCicloSecEfectivo = secPerBarEf * 2;
  est.ultimoOnsetClave = -Infinity;
  est.ultimoCompasClave = -1;
}

// v2.4: reescribe el badge (♩ BPM · compás · clave) con los valores
// EFECTIVOS, agregando "(ajustado)" si hay algún override activo —
// para que el músico nunca confunda un ajuste temporal con el dato
// real cargado por staff.
// v3.133: (a pedido) tonalidad/armadura en el badge — mismo círculo de
// quintas que guia-practica.html (archivos sueltos, sin JS compartido).
// Acá además se dibujan los símbolos como en una partitura (♯/♭
// repetidos según la armadura, y la tonalidad con ♯/♭ en vez de #/b) en
// vez del texto "3 bemoles" que usa el formulario de staff.
const ARMADURA_POR_TONALIDAD = {
  'c':'Ninguna (0 alteraciones)','am':'Ninguna (0 alteraciones)',
  'g':'1 sostenido','em':'1 sostenido',
  'd':'2 sostenidos','bm':'2 sostenidos',
  'a':'3 sostenidos','f#m':'3 sostenidos','gbm':'3 sostenidos',
  'e':'4 sostenidos','c#m':'4 sostenidos','dbm':'4 sostenidos',
  'b':'5 sostenidos','cb':'5 sostenidos','g#m':'5 sostenidos','abm':'5 sostenidos',
  'f#':'6 sostenidos','gb':'6 sostenidos','d#m':'6 sostenidos','ebm':'6 sostenidos',
  'c#':'7 sostenidos','db':'5 bemoles','a#m':'7 sostenidos','bbm':'5 bemoles',
  'f':'1 bemol','dm':'1 bemol',
  'bb':'2 bemoles','a#':'2 bemoles','gm':'2 bemoles',
  'eb':'3 bemoles','d#':'3 bemoles','cm':'3 bemoles',
  'ab':'4 bemoles','g#':'4 bemoles','fm':'4 bemoles',
};
function armaduraDeTonalidad(tonalidad){
  const t = (tonalidad || '').trim().toLowerCase().replace(/\s+/g, '');
  if(!t) return '';
  return ARMADURA_POR_TONALIDAD[t] || '';
}
// "F#m" -> "F♯m", "Bbm" -> "B♭m" (solo para mostrar, nunca para guardar
// ni para hacer match contra ARMADURA_POR_TONALIDAD, que sigue en #/b).
function formatoTonalidadMusical(tonalidad){
  return (tonalidad || '').replace(/#/g, '♯').replace(/([A-Ga-g])b\b/g, '$1♭');
}
// De "6 sostenidos" / "3 bemoles" / "Ninguna (0 alteraciones)" a "♯♯♯♯♯♯"
// / "♭♭♭" / "" — como se ven las alteraciones en la armadura de un
// pentagrama.
function simbolosDeArmadura(tonalidad){
  const texto = armaduraDeTonalidad(tonalidad);
  const m = texto.match(/^(\d+)\s+(sostenido|bemol)/);
  if(!m) return '';
  return (m[2] === 'sostenido' ? '♯' : '♭').repeat(parseInt(m[1], 10));
}
// v3.188: (a pedido, portado de ensayo.html v3.193/194) qué notas
// concretas llevan esa alteración, en el orden real en que aparecen en
// una armadura de pentagrama (círculo de quintas) — no alfabético. Sin
// tabla nueva de tonalidades: solo lee la cantidad/tipo que ya calcula
// armaduraDeTonalidad() y recorta el orden fijo de siempre.
const ORDEN_SOSTENIDOS_ARMADURA = ['F','C','G','D','A','E','B'];
const ORDEN_BEMOLES_ARMADURA = ['B','E','A','D','G','C','F'];
function notasDeArmadura(tonalidad){
  const texto = armaduraDeTonalidad(tonalidad);
  const m = texto.match(/^(\d+)\s+(sostenido|bemol)/);
  if(!m) return '';
  const n = parseInt(m[1], 10);
  const esSostenido = m[2] === 'sostenido';
  const simbolo = esSostenido ? '♯' : '♭';
  const orden = esSostenido ? ORDEN_SOSTENIDOS_ARMADURA : ORDEN_BEMOLES_ARMADURA;
  return orden.slice(0, n).map(nota => nota + simbolo).join(' ');
}

function actualizarBadgePractica(uid, compas){
  const est = estadoPractica[uid];
  if(!est) return;
  const claveLabel = est.claveEfectiva ? CLAVE_ETIQUETAS[est.claveEfectiva] : '';
  // v3.144: (a pedido) tonalidad/armadura mostradas ahora respetan
  // tonalidadOverride (sesión, del tag detectado del archivo local) si
  // existe — mismo patrón que bpmOverride/claveOverride. Nunca toca
  // est.tonalidad (el valor real del tema en Firestore).
  const tonalidadEfectiva = est.tonalidadOverride !== undefined ? est.tonalidadOverride : est.tonalidad;
  const ajustado = est.bpmOverride != null || est.claveOverride !== undefined || est.tonalidadOverride !== undefined || est.compasesOverride != null || (est.subdivisionOverride || 1) !== 1;
  const simbolos = simbolosDeArmadura(tonalidadEfectiva);
  // v3.188: (a pedido, portado de ensayo.html v3.194) se muestra el
  // nombre de las notas en vez del símbolo repetido (♭♭♭/♯♯♯).
  const notasArmadura = simbolos ? notasDeArmadura(tonalidadEfectiva) : '';
  const tonalidadLabel = tonalidadEfectiva ? `${formatoTonalidadMusical(tonalidadEfectiva)}${notasArmadura ? ` (${notasArmadura})` : ''}` : '';
  // v3.149: (a pedido) compás y clave son info de STAFF (guia-
  // practica.html) sin ningún dato equivalente detectable en un
  // archivo local (no existe tag de compás/clave rítmica) — con
  // archivo local cargado, se ocultan del badge en vez de seguir
  // mostrando el compás/clave del tema viejo. BPM y tonalidad SÍ
  // siguen porque ahora vienen del propio archivo (tag). El
  // metrónomo/click sigue funcionando igual por dentro — esto es
  // solo el texto que se muestra.
  const esLocal = !!est.archivoLocalUrl;
  // v3.166: (a pedido) el compás EFECTIVO (compasEfectivoDe — el que
  // realmente usa el click/metrónomo) ahora se muestra SIEMPRE en el
  // badge, con o sin archivo local. Antes (v3.149) se ocultaba con
  // archivo local por no haber tag de compás detectable — pero eso
  // dejaba al músico sin forma de ver qué compás está sonando sin
  // abrir Ajustes. Con compasesOverride de sesión activo, o con
  // archivo local, se muestra el número de pulsos por compás tal cual
  // ("compás: 6") en vez del texto "X/4" del tema (que asume una
  // figura que no necesariamente es la real). Sin override y con
  // maqueta oficial, sigue mostrándose el texto de siempre — cero
  // cambio visual en el caso de toda la vida. La clave sigue oculta
  // con archivo local, sin cambios (sigue sin tag detectable).
  // v3.169: (a pedido) formato "N/4" en vez de número plano ("4/4" en
  // vez de "4") — se asume denominador de negra (/4), que es el
  // criterio que ya usa el resto del panel (subdivisión es un
  // multiplicador de sesión aparte, no un denominador distinto).
  const efectivo = compasEfectivoDe(est);
  // v3.190: (a pedido, portado de ensayo.html v3.210.4) FIX — esta rama
  // asumía denominador de negra fijo ("/4") sin importar el compás real
  // del tema (ej. mostraba "5/4" en un tema 5/8 practicado con archivo
  // local). Ahora usa el denominador real de est.compasTexto — el
  // numerador sí puede cambiar por override de sesión, el denominador
  // del tema no lo toca ningún override existente en el proyecto.
  const denominadorReal = parseInt((est.compasTexto || '4/4').split('/')[1], 10) || 4;
  const compasLabel = (est.compasesOverride != null || esLocal)
    ? `${efectivo}/${denominadorReal}`
    : (compas || '—');
  const partes = [];
  const bpmChip = `<span class="practica-badge practica-badge-bpm">♩ ${est.bpmEfectivo ? formatBpm(est.bpmEfectivo) : '—'} BPM</span>`;
  partes.push(bpmChip);
  partes.push(`<span class="practica-badge practica-badge-sec">${escapeHtml(compasLabel)}</span>`);
  // v3.167: (a pedido) misma razón que el compás en v3.166 — la clave
  // efectiva (est.claveEfectiva) ya suena igual con o sin archivo
  // local (no depende de ningún tag), así que ocultarla del badge con
  // archivo local (v3.149) solo le quitaba visibilidad al músico sin
  // ninguna razón real. Ahora se muestra siempre que haya clave
  // activa, con o sin archivo local.
  // v3.190: (a pedido, portado de ensayo.html v3.213) "faltan badges
  // jerarquizados de clave, compás, etc." — cada dato pasa a ser su
  // propio chip .practica-badge-sec en vez de texto unido con " · "
  // dentro de una sola línea plana. El BPM (bpmChip, arriba) queda como
  // protagonista visual porque es el dato que más se consulta en vivo.
  if(claveLabel) partes.push(`<span class="practica-badge practica-badge-sec">${escapeHtml(claveLabel)}</span>`);
  if(tonalidadLabel) partes.push(`<span class="practica-badge practica-badge-sec">${escapeHtml(tonalidadLabel)}</span>`);
  if(ajustado) partes.push('<span class="practica-badge-ajustado">(ajustado)</span>');
  const html = partes.join('');
  // v3.195: (a pedido) se sacó el badge de arriba (badge-${uid}) por
  // quedar duplicado con este — badge2 vive dentro de la card del
  // contador desde v3.194 (portado de ensayo.html v3.216).
  const el2 = document.getElementById('badge2-' + uid);
  if(el2) el2.innerHTML = html;
}

// v2.4: sincroniza el panel (valor de BPM, select de clave, chip de
// sonido, botones de acento) con el estado actual — se llama al
// inicializar y desde restablecerAjustesPractica().
function actualizarUIAjustesPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  actualizarResumenCompasSubdivPractica(uid);
  const bpmVal = document.getElementById('bpmval-' + uid);
  if(bpmVal) bpmVal.textContent = est.bpmEfectivo ? formatBpm(est.bpmEfectivo) : est.bpmEfectivo;
  const select = document.getElementById('claveselect-' + uid);
  if(select) select.value = est.claveEfectiva || '';
  const turno = document.getElementById('claveturno-' + uid);
  if(turno) turno.style.display = est.claveEfectiva ? '' : 'none';
  const figurasEl = document.getElementById('clavefiguras-' + uid);
  if(figurasEl){
    figurasEl.style.display = est.claveEfectiva ? '' : 'none';
    if(est.claveEfectiva && est.claveEfectiva !== est.ultimaClaveFigurasRenderizada){
      figurasEl.innerHTML = claveFigurasHtml(uid, est.claveEfectiva, compasEfectivoDe(est));
      est.ultimaClaveFigurasRenderizada = est.claveEfectiva;
    }
  }
  const claveLabelEl = document.getElementById('clavelabel-' + uid);
  if(claveLabelEl) claveLabelEl.style.display = est.claveEfectiva ? '' : 'none';
  // v3.77: (a pedido) la etiqueta de la sección de Pulso ("Pulso ·
  // Clave (tipo)") solo se fijaba una vez, al armar el HTML inicial —
  // si la clave cambiaba después desde el select de Ajustes, el texto
  // quedaba desactualizado (o directamente ausente, si no había clave
  // al cargar la página). Ahora se recalcula acá cada vez.
  const pulsoLabelEl = document.getElementById('pulsolabel-' + uid);
  if(pulsoLabelEl){
    const tipoClave = est.claveEfectiva ? (CLAVE_ETIQUETAS[est.claveEfectiva] || '') : '';
    pulsoLabelEl.textContent = 'Pulso' + (tipoClave ? ' · Clave (' + tipoClave + ')' : '');
  }
  // v3.61: re-renderiza la tira unificada cuando cambia la clave
  // efectiva (mismo criterio de "solo si cambió" que figurasEl arriba,
  // con su propio flag para no interferir con ultimaClaveFigurasRenderizada).
  const pcuStripEl = document.getElementById('pcu-strip-' + uid);
  if(pcuStripEl && est.claveEfectiva !== est.ultimaClaveUnificadaRenderizada){
    pcuStripEl.outerHTML = pulsoClaveUnificadoHtml(uid, compasEfectivoDe(est), est.claveEfectiva);
    est.ultimaClaveUnificadaRenderizada = est.claveEfectiva;
    est.ultimoTiempoPcu = undefined;
    // v3.114: el DOM se acaba de reemplazar entero (vuelve a nacer con
    // la plantilla "home" activa) — se resetea también para que el
    // próximo tick de actualizarContadorPractica no asuma que ya
    // estábamos en esa plantilla y se salte la sincronización.
    est.ultimoBeatsPcu = undefined;
    // v3.69: la tira se acaba de reemplazar — sincronizamos marcadores.
    requestAnimationFrame(() => sincronizarNotasClavePulso(uid));
  }
  const clickBtn = document.getElementById('clickbtn-' + uid);
  if(clickBtn){
    clickBtn.innerHTML = HTML_BOTON_METRO;
    clickBtn.classList.toggle('activo', est.clickActivo);
  }
  const claveBtn = document.getElementById('clavebtn-' + uid);
  if(claveBtn){
    // v3.117: (a pedido) el botón se ocultaba por completo sin clave
    // GENERAL, aunque alguna sección tuviera su propia claveSeccion —
    // ahí no había forma de apagarla/prenderla. Ahora también se
    // muestra si tieneClaveSeccionAlguna (flag ya calculado al cargar
    // el tema, ver ~6230).
    claveBtn.style.display = (est.claveEfectiva || est.tieneClaveSeccionAlguna) ? '' : 'none';
    claveBtn.classList.toggle('activo', est.claveActiva !== false);
  }
  ['clasico', 'grave', 'woodblock', 'claveorganica'].forEach(s => {
    const chip = document.getElementById('sonido-' + uid + '-' + s);
    if(chip) chip.classList.toggle('activo', (est.sonidoClick || 'clasico') === s);
  });
  // v3.75: (a pedido) fila y chips del sonido de la clave, sonido
  // independiente del click — solo se muestra si hay clave configurada
  // (mismo criterio que claveturno/clavefiguras/claveBtn de arriba).
  const sonidoClaveFilaEl = document.getElementById('sonidoclavefila-' + uid);
  if(sonidoClaveFilaEl) sonidoClaveFilaEl.style.display = est.claveEfectiva ? '' : 'none';
  ['clasico', 'grave', 'woodblock', 'claveorganica'].forEach(s => {
    const chip = document.getElementById('sonidoclave-' + uid + '-' + s);
    if(chip) chip.classList.toggle('activo', (est.sonidoClave || 'clasico') === s);
  });
  (est.acentos || []).forEach((a, i) => {
    const btn = document.getElementById('acento-' + uid + '-' + i);
    // v3.9: el botón del tiempo 1 (i===0) conserva la clase "beat1"
    // siempre (juega con el verde del semáforo), sin importar si el
    // usuario lo cicló a normal/mudo — className se reescribe entero
    // acá así que hay que volver a agregarla cada vez.
    if(btn) btn.className = 'practica-acento-btn' + (i === 0 ? ' beat1' : '') + (a === 'fuerte' ? ' fuerte' : a === 'mudo' ? ' mudo' : '');
  });
  (est.acentosClave || []).forEach((a, i) => {
    const btn = document.getElementById('acentoclave-' + uid + '-' + i);
    if(btn) btn.className = 'practica-acento-btn' + (a === 'fuerte' ? ' fuerte' : a === 'mudo' ? ' mudo' : '');
  });
  const filaAcentosClave = document.getElementById('filaacentosclave-' + uid);
  if(filaAcentosClave) filaAcentosClave.style.display = est.claveEfectiva ? '' : 'none';
  const bpmRange = document.getElementById('bpmrange-' + uid);
  if(bpmRange) bpmRange.value = est.bpmEfectivo;
  const volFuerte = document.getElementById('volfuerte-' + uid);
  if(volFuerte) volFuerte.value = Math.round((est.volFuerte == null ? 1 : est.volFuerte) * 100);
  const volNormal = document.getElementById('volnormal-' + uid);
  if(volNormal) volNormal.value = Math.round((est.volNormal == null ? 0.55 : est.volNormal) * 100);
  const volFuerteMini = document.getElementById('volfuerte-mini-' + uid);
  if(volFuerteMini) volFuerteMini.value = Math.round((est.volFuerte == null ? 1 : est.volFuerte) * 100);
  const volNormalMini = document.getElementById('volnormal-mini-' + uid);
  if(volNormalMini) volNormalMini.value = Math.round((est.volNormal == null ? 0.55 : est.volNormal) * 100);
}

function toggleAjustesPractica(uid){
  const panel = document.getElementById('ajustes-' + uid);
  if(!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
}

function ajustarBpmPractica(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  const base = est.bpmOverride || est.bpm;
  est.bpmOverride = Math.max(30, Math.min(300, base + delta));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
}

// v2.5: slider continuo de BPM — salta directo al valor, mismo
// override en memoria que usan los botones ±5.
function ajustarBpmSliderPractica(uid, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  est.bpmOverride = Math.max(30, Math.min(300, parseInt(valor, 10)));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
}

// v2.5: volumen real (no solo tono) por nivel de acento. El slider
// llega en 0-100, se guarda 0-1 para beepPractica().
function ajustarVolumenAcentoPractica(uid, campo, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  est[campo] = Math.max(0, Math.min(100, parseInt(valor, 10))) / 100;
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
}

function cambiarClavePractica(uid, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  est.claveOverride = valor === '' ? null : valor;
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
}

function elegirSonidoPractica(uid, sonido){

function toggleAcentoPractica(uid, idx){
  const est = estadoPractica[uid];
  if(!est || !est.acentos) return;
  const orden = ['normal', 'fuerte', 'mudo'];

  guardarAjustesPractica(uid);

// v3.8: mismo mecanismo de ciclo normal/fuerte/mudo que
// toggleAcentoPractica(), pero sobre los golpes de la clave en vez de
// los tiempos del metrónomo. 'fuerte' usa el mismo tono agudo +
// volFuerte que ya existía para el primer golpe (v2.0); 'mudo' apaga
// ese golpe puntual sin afectar el resto del patrón ni el click normal.
function toggleAcentoClavePractica(uid, idx){
  const est = estadoPractica[uid];
  if(!est || !est.acentosClave) return;
  const orden = ['normal', 'fuerte', 'mudo'];
  const actualIdx = orden.indexOf(est.acentosClave[idx]);

  guardarAjustesPractica(uid);

            <label>Desde (compás)</label>
            <input type="number" class="practica-offsetlocal-input" min="1" step="1" value="${compasDeSegundosLocalPractica(s.desdeSegundos || 0, est)}" onchange="actualizarSeccionLocalDesdeCompas('${uid}', ${i}, this.value)">
          </div>
          <div class="practica-seccion-local-campo">
            <label>Desde (tiempo)</label>
            <input type="text" class="practica-offsetlocal-input" value="${segundosATextoPractica(s.desdeSegundos || 0)}" placeholder="Minuto:segundo (ej: 1:30)" onchange="actualizarSeccionLocalDesdeTiempo('${uid}', ${i}, this.value)">
          </div>
        </div>
        <div class="practica-seccion-local-campos">
          <div class="practica-seccion-local-campo">

          </div>
          <div class="practica-seccion-local-campo">
            <label>Hasta (tiempo, opcional)</label>
            <input type="text" class="practica-offsetlocal-input" value="${s.hastaSegundos != null ? segundosATextoPractica(s.hastaSegundos) : ''}" placeholder="Minuto:segundo" onchange="actualizarSeccionLocalHastaTiempo('${uid}', ${i}, this.value)">
          </div>
          <button class="practica-click-btn" onclick="limpiarSeccionLocalHasta('${uid}', ${i})" title="Volver a automático (sin fin manual — termina donde arranca la siguiente)">↺</button>

          <span class="practica-offsetlocal-info">Presets (fin = N compases desde el inicio):</span>
          ${[1,2,4,8,16,32,64].map(n => `<button type="button" class="btn-preset${esPresetHastaActivoLocal(s, n, est) ? ' activo' : ''}" onclick="setSeccionLocalHastaPreset('${uid}', ${i}, ${n})">x${n}</button>`).join('')}
        </div>
        ${indicador ? `<div class="practica-seccion-local-duracion">${indicador}</div>` : ''}
      </div>
    </div>`;
  }).join('') || `<span class="practica-offsetlocal-info">Todavía no marcaste ninguna sección de este archivo.</span>`;
}
function toggleColapsoSeccionLocal(uid, idx){
  const est = estadoPractica[uid];
  if(!est) return;
  est.seccionesLocalesColapso = est.seccionesLocalesColapso || {};
  const yaAbierta = est.seccionesLocalesColapso[idx] === false;
  est.seccionesLocalesColapso[idx] = yaAbierta ? true : false;
  actualizarListaSeccionesLocalesPractica(uid);
}
function marcarSeccionLocalPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const inputNombre = document.getElementById('seccionlocalnombre-' + uid);
  const nombre = (inputNombre && inputNombre.value.trim()) || `Sección ${(est.seccionesLocales || []).length + 1}`;
  const actual = est.getTiempoActual();
  est.seccionesLocales = est.seccionesLocales || [];
  const nuevoIdx = est.seccionesLocales.length;
  est.seccionesLocales.push({ nombre: nombre, desdeSegundos: actual });
  // v3.180: nace expandida (mismo criterio que agregarFilaSeccion() en
  // el staff) — recién creada, tiene más sentido verla abierta que
  // tener que abrirla a mano para ajustarla.
  est.seccionesLocalesColapso = est.seccionesLocalesColapso || {};
  est.seccionesLocalesColapso[nuevoIdx] = false;
  if(inputNombre) inputNombre.value = '';
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);

  dibujarWaveform(uid, actual);
}
function renombrarSeccionLocalPractica(uid, idx, nuevoNombre){

  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  est.seccionesLocales[idx].nombre = nuevoNombre.trim() || est.seccionesLocales[idx].nombre;
  guardarSeccionesLocalEnStorage(uid);

function actualizarSeccionLocalDesdeCompas(uid, idx, valor){

// v1.29.10 del staff: se tipea el ÚLTIMO compás de esta sección

function setSeccionLocalHastaPreset(uid, idx, n){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return;
  est.seccionesLocales[idx].hastaSegundos = (est.seccionesLocales[idx].desdeSegundos || 0) + n * secPerBar;
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function limpiarSeccionLocalHasta(uid, idx){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales || !est.seccionesLocales[idx]) return;
  est.seccionesLocales[idx].hastaSegundos = null;
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function eliminarSeccionLocalPractica(uid, idx){
  const est = estadoPractica[uid];
  if(!est || !est.seccionesLocales) return;
  est.seccionesLocales.splice(idx, 1);
  // v3.180: el splice corre los índices de las secciones siguientes —
  // se resetea el mapa de colapso (solo UI, nada de datos) para no
  // dejar un índice viejo apuntando a la sección equivocada. Vuelven
  // todas a su estado colapsado por defecto.
  est.seccionesLocalesColapso = {};
  guardarSeccionesLocalEnStorage(uid);
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}

// (a pedido) tap-tempo de varios golpes en vez de un solo click — un
// solo click contra un punto lejano ya daba buena precisión, pero
// depende de acertar exacto en UN instante; el tiempo de reacción
// humano (~50-150ms) pesa entero en ese único punto. Tocando un tap
// por cada tiempo 1 que se escucha, el ruido de reacción de cada tap
// es más o menos aleatorio e independiente del de los demás — al medir
// TODOS los compases entre el primer y el último tap de una sola vez
// (no promediando BPMs parciales, que arrastrarían el ruido de cada
// intervalo corto) el error de reacción se diluye entre el tiempo
// total, no entre cada tap individual. Cuenta de compases por
// intervalo: se redondea delta/secPerBarGuia (usando el BPM efectivo
// ANTES de esta calibración como guía) — funciona mientras el error de
// tempo real no sea tan grande como para desviar el redondeo a un
// compás equivocado, que es justo el caso típico (diferencias de
// decimales de BPM, no de BPMs enteros distintos).
function tapCalibracionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(!est.calibTaps) est.calibTaps = [];
  est.calibTaps.push(est.getTiempoActual());
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = `Taps: ${est.calibTaps.length}`;
}

function reiniciarTapCalibracionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.calibTaps = [];
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = 'Taps: 0';
  const info = document.getElementById('offsetlocalbpminfo-' + uid);
  if(info) info.textContent = '';
}

function calcularBpmTapsPractica(uid){
  const est = estadoPractica[uid];
  const info = document.getElementById('offsetlocalbpminfo-' + uid);
  if(!est) return;
  const taps = (est.calibTaps || []).slice().sort((a, b) => a - b);
  if(taps.length < 3){
    if(info) info.textContent = 'Necesitás al menos 3 taps (uno por cada tiempo 1 que escuches) — con más taps y más separados, más preciso.';
    return;
  }
  const secPerBarGuia = (60 / est.bpmEfectivo) * compasEfectivoDe(est);
  let totalBars = 0;
  for(let i = 1; i < taps.length; i++){
    const delta = taps[i] - taps[i - 1];
    const bars = Math.round(delta / secPerBarGuia);
    if(bars >= 1) totalBars += bars;
  }
  const totalTime = taps[taps.length - 1] - taps[0];
  if(totalBars < 1 || totalTime <= 0){
    if(info) info.textContent = 'No se pudo calcular — probá de nuevo, un tap por cada tiempo 1 (no cada tiempo suelto).';
    return;
  }
  const secPerBarReal = totalTime / totalBars;
  const bpmReal = Math.round(((60 * compasEfectivoDe(est)) / secPerBarReal) * 100) / 100;
  est.bpmOverride = Math.max(30, Math.min(300, bpmReal));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  if(info) info.textContent = `BPM ajustado a ${est.bpmOverride.toFixed(2)} (${taps.length} taps, ${totalBars} compases medidos)`;
  est.calibTaps = [];
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = 'Taps: 0';
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

// (a pedido) ajuste fino del BPM calculado por tap — el ± del panel
// general es de 5 en 5 (pensado para ajustes gruesos) y su slider
// redondea a enteros, así que tocarlos ahí borraría la precisión
// decimal que dio el tap. Este control opera directo sobre
// est.bpmOverride con pasos de 0.5/0.05, y sí actualiza el slider/badge
// del panel general (actualizarUIAjustesPractica) para que no queden
// desincronizados entre sí — solo que sin pasar por su redondeo.
function ajustarBpmFinoPractica(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  const base = est.bpmOverride || est.bpm;
  est.bpmOverride = Math.round(Math.max(30, Math.min(300, base + delta)) * 100) / 100;
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

function fijarBpmLocalPractica(uid){
  const est = estadoPractica[uid];
  const input = document.getElementById('bpmlocalinput-' + uid);
  if(!est || !input) return;
  const valor = parseFloat(input.value);
  if(isNaN(valor)) return;
  est.bpmOverride = Math.max(30, Math.min(300, valor));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

function actualizarUIBpmLocalPractica(uid){
  const est = estadoPractica[uid];
  const el = document.getElementById('bpmlocalval-' + uid);
  if(!est || !el) return;
  const bpm = est.bpmOverride || est.bpm;
  el.textContent = (bpm ? bpm.toFixed(2) : '—') + ' BPM';
}

// v3.16: feedback breve "✓ guardado" junto al valor de BPM — solo para
// los ajustes que efectivamente pasan por guardarAjustesPractica()
// (tap, fino, fijar exacto). Offset y velocidad no persisten, así que
// nunca llaman a esto.
function mostrarGuardadoBpmFino(uid){
  const el = document.getElementById('bpmlocalguardado-' + uid);
  if(!el) return;
  el.textContent = '✓ guardado';
  el.classList.add('visible');
  clearTimeout(el._guardadoTimeoutId);
  el._guardadoTimeoutId = setTimeout(() => el.classList.remove('visible'), 1500);
}

// (a pedido) entrenador de velocidad — solo aplica al <audio> local
// (audioLocal.playbackRate), no afecta el grid del metrónomo para
// nada: nuestro reloj lee audioLocal.currentTime, que siempre
// representa la posición REAL dentro del archivo sin importar a qué
// velocidad se reproduce, así que el semáforo/clave/click siguen
// exactos a cualquier velocidad sin tocar ni una línea de esa lógica.
// Rango 50%-120%, pasos de 5%. preservesPitch ya se activó al cargar
// el archivo (ver onArchivoLocalElegido) para que sonar más lento no
// suene grave, solo lento.
// v3.191: (a pedido, portado de ensayo.html v3.202.2) el control pasa
// de % a BPM objetivo — el usuario piensa en "quiero que suene a X
// BPM", no en porcentaje. bpmBase es el tempo real del tema
// (est.bpmEfectivo||est.bpm, el mismo valor que usa todo el resto del
// motor); la velocidad sigue siendo bpmObjetivo/bpmBase, mismo clamp
// 50%-120% de siempre. Reemplaza el control por %, no queda alterno.
function bpmBaseVelocidadPractica(est){
  return est.bpmEfectivo || est.bpm || 0;
}
function aplicarVelocidadBpmPractica(uid, bpmObjetivo){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmBase = bpmBaseVelocidadPractica(est);
  if(!bpmBase || !bpmObjetivo || bpmObjetivo <= 0) return;
  const nueva = Math.max(0.5, Math.min(1.2, Math.round((bpmObjetivo / bpmBase) * 100) / 100));
  cambiarVelocidadLocalPractica(uid, nueva);
}
function ajustarVelocidadBpmLocalPractica(uid, deltaBpm){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmBase = bpmBaseVelocidadPractica(est);
  if(!bpmBase) return;
  const bpmActual = bpmBase * (est.velocidadLocal || 1);
  aplicarVelocidadBpmPractica(uid, bpmActual + deltaBpm);
}
function aplicarVelocidadBpmInputPractica(uid){
  const input = document.getElementById('velocidadlocalbpm-' + uid);
  if(!input) return;
  aplicarVelocidadBpmPractica(uid, parseFloat(input.value));
}

function restablecerVelocidadLocalPractica(uid){
  cambiarVelocidadLocalPractica(uid, 1);
}

// v3.48: a diferencia de antes (que solo tocaba audioLocal.playbackRate),
// ahora la velocidad decide QUÉ MOTOR está sonando: a 100% usa Web Audio
// (loop exacto, pero sin preservesPitch — no lo soporta), a cualquier
// otra velocidad usa el <audio> nativo (preservesPitch real, tono
// correcto; el loop vuelve al mecanismo de vigilar-y-saltar de siempre).
// Si Web Audio no llegó a estar listo (todavía decodificando, o falló),
// est.webAudioPlayerLocal es null y esto simplemente se queda en el
// motor nativo sin romper nada.
function cambiarVelocidadLocalPractica(uid, nueva){
  const est = estadoPractica[uid];
  const audioLocal = document.getElementById('local-' + uid);
  if(!est || !audioLocal) return;
  const anterior = est.velocidadLocal || 1;
  est.velocidadLocal = nueva;
  const el = document.getElementById('velocidadlocalbpm-' + uid);
  if(el){
    const bpmBase = bpmBaseVelocidadPractica(est);
    el.value = bpmBase ? formatBpm(bpmBase * nueva) : '';
  }
  const usabaWebAudio = est.audioActivo === est.webAudioPlayerLocal && !!est.webAudioPlayerLocal;
  const debeUsarWebAudio = (nueva === 1) && !!est.webAudioPlayerLocal;
  if(usabaWebAudio === debeUsarWebAudio){
    // mismo motor de antes — si es el nativo, solo actualiza el rate.
    if(!debeUsarWebAudio) audioLocal.playbackRate = nueva;
    return;
  }
  const tActual = est.getTiempoActual ? est.getTiempoActual() : 0;
  const estabaSonando = est.audioActivo && !est.audioActivo.paused;
  if(est.pause) est.pause();
  if(debeUsarWebAudio){
    conectarMotorLocalPractica(uid, est.webAudioPlayerLocal);
    est.seek(tActual);
    aplicarLoopNativoPractica(uid);
  } else {
    audioLocal.playbackRate = nueva;
    conectarMotorLocalPractica(uid, audioLocal);
    est.seek(tActual);
  }
  if(estabaSonando) est.play();
}

// v3.188: (a pedido, portado de ensayo.html v3.199) limpieza
// centralizada de un estadoPractica[uid] completo — antes acá se
// limpiaban a mano solo 3 de los ~8 timeouts que fue juntando el
// estado con el tiempo (flashTimeoutId, claveNotaFlashTimeoutId,
// claveTickFlashTimeoutId), y NUNCA se cerraba webAudioPlayerLocal al
// reemplazar el estado (solo se cerraba al cambiar de archivo DENTRO
// de la misma sesión, ver onArchivoLocalElegido) — quedaba sonando/
// vivo en memoria si la sesión se re-renderizaba. Se preserva el
// caso especial de YouTube (ytPlayer.destroy()) que ensayo.html no
// tiene. Cualquier handle nuevo (timeout, observer, listener) que se
// agregue a futuro se suma a esta lista y listo.
function destruirEstadoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(est.ytPlayer && typeof est.ytPlayer.destroy === 'function'){
    try{ est.ytPlayer.destroy(); }catch(e){}
  }
  if(est.archivoLocalUrl) URL.revokeObjectURL(est.archivoLocalUrl);
  if(est.webAudioPlayerLocal && typeof est.webAudioPlayerLocal.cerrar === 'function'){
    try{ est.webAudioPlayerLocal.cerrar(); }catch(e){}
  }
  if(est.waveformResizeObserver) est.waveformResizeObserver.disconnect();
  if(est.filtroHighpass){ try{ est.filtroHighpass.disconnect(); }catch(e){} }
  if(est.filtroLowpass){ try{ est.filtroLowpass.disconnect(); }catch(e){} }
  clearTimeout(est.flashTimeoutId);
  clearTimeout(est.claveNotaFlashTimeoutId);
  clearTimeout(est.claveNotaVisualOnTimeoutId);
  clearTimeout(est.claveTickFlashTimeoutId);
  clearTimeout(est.clavePilotoFlashTimeoutId);
  clearTimeout(est.clavePilotoVisualOnTimeoutId);
  clearTimeout(est.seekManualObjetivoTimeout);
  clearTimeout(est.waveformScrollProgTimeout);
  if(est.metroPrecontTimeouts) est.metroPrecontTimeouts.forEach(t => clearTimeout(t));
  delete estadoPractica[uid];
}
function inicializarReproductoresPractica(sesiones){
  sesiones.forEach(s => {
    const temaData = s.temaId ? temaCache[s.temaId] : null;
    if(!temaData || !temaData.practicaBpm || !temaData.practicaCompas) return;
    // v2.2: si no hay maqueta para este instrumento, el bloque igual se
    // renderizó (modo libre) — se arma el mismo estadoPractica[uid]
    // (bpm/compás/clave) pero sin conectar audio/YouTube; getTiempoActual
    // se queda en el default (0) porque toggleMetronomoLibre() alimenta
    // actualizarContadorPractica() directamente con su propio reloj.
    const versionesDeEstaSesion = obtenerMaquetasParaSesion(s);
    const maqueta = versionesDeEstaSesion[0] || null;
    const uid = 'practica-' + s.id;
    const compasesPorBarra = parseInt((temaData.practicaCompas || '4/4').split('/')[0], 10) || 4;

    // v1.8/v3.188: si esta sesión ya tenía estado de una carga anterior
    // (ej. se re-renderizó por un RSVP), se destruye TODO por completo
    // (YT.Player, ObjectURL local, webAudioPlayerLocal, timeouts) antes
    // de reemplazarlo — ver destruirEstadoPractica arriba.
    destruirEstadoPractica(uid);

    // v1.7: estado central de esta sesión — getTiempoActual/seek/pause
    // se conectan más abajo según el tipo de reproductor.
    const secPerBeatInicial = 60 / temaData.practicaBpm;
    const secPerBarInicial = secPerBeatInicial * compasesPorBarra;
    estadoPractica[uid] = {
      bpm: temaData.practicaBpm,
      compasesPorBarra,
      compasTexto: temaData.practicaCompas,
      tonalidad: temaData.practicaTonalidad || '',
      offset: temaData.practicaOffset || 0,
      // (a pedido) ajuste de offset SOLO para archivo cargado del
      // dispositivo — no toca est.offset (el offset real del tema,
      // calibrado para la maqueta oficial de audio/YouTube). Se suma
      // encima de est.offset al calcular tRel (ver actualizarContadorPractica),
      // y se resetea a 0 cada vez que se carga un archivo nuevo
      // (onArchivoLocalElegido) porque cada archivo puede tener su
      // propio silencio inicial. Nunca se persiste ni se manda a
      // Firestore — vive solo en memoria de esta sesión.
      offsetLocalDelta: 0,
      // v3.138: (a pedido) CUE de reproducción — punto donde arranca el
      // play (togglePlayPractica), totalmente independiente del offset
      // de arriba (que solo alinea click/conteo). null = sin CUE, el
      // play arranca desde el offset efectivo normal. Se marca con los
      // botones del reproductor (marcarCuePractica /
      // toggleArmarCueWaveform) y se resetea a null con cada archivo
      // nuevo (onArchivoLocalElegido) o con "✕ Quitar CUE"
      // (quitarCuePractica). Tampoco se persiste ni se manda a
      // Firestore — solo memoria de esta sesión.
      cuePlayback: null,
      // (a pedido) velocidad de reproducción del archivo local
      // (entrenador de velocidad) — 1 = 100%, no afecta el cálculo del
      // metrónomo (ver ajustarVelocidadLocalPractica).
      velocidadLocal: 1,
      // v3.19: picos de amplitud del archivo local para el waveform —
      // se extraen una sola vez al cargar el archivo (ver
      // prepararWaveformLocal), nunca se recalculan por frame.
      waveformPeaks: null,
      waveformDuracion: 0,
      secciones: temaData.practicaSecciones || [],
      // v3.85: (a pedido) nombre del tema, para el encabezado del PDF
      // exportado (exportarEstructuraPracticaPDF) — mismo dato que ya
      // usa guia-practica.html (temaDoc.data().nombre), solo que acá no
      // se mostraba en pantalla hasta ahora.
      temaNombre: temaData.nombre || 'Tema',
      loopInicio: null, loopFin: null, loopActivo: false,
      // v (a pedido): loop automático de la sección actual — distinto
      // del loop manual de arriba (loopInicio/loopFin), se excluyen
      // mutuamente para no pelear por el seek. Ver toggleLoopSeccionPractica.
      loopSeccionActivo: false,
      clickActivo: false, ultimoBeatClick: -1,
      // v3.44: pre-conteo del metrónomo libre — activado por defecto,
      // 1 compás por defecto (ver toggleMetronomoLibre / checkbox+chips
      // en panelAjustesHtml).
      precontActivo: true, precontCompases: 1, metroPrecontEnCurso: false, metroPrecontTimeouts: [], precontOmitir: false,
      seekManualObjetivo: null, seekManualObjetivoTimeout: null,
      // v3.13: control del flash corto (medio tiempo) del número/
      // semáforo — ver actualizarContadorPractica.
      ultimoBeatVisual: -1,
      flashTimeoutId: null,
      // v3.14: timeouts del flash corto de los golpes de clave y del
      // tick de comienzo de compás en la línea de clave — mismo
      // patrón que flashTimeoutId de arriba.
      claveNotaFlashTimeoutId: null,
      claveTickFlashTimeoutId: null,
      // v2.0: si hay clave, el click sigue estos onsets (en segundos,
      // dentro del ciclo de 2 compases) en vez de sonar por tiempo.
      clave: temaData.practicaClave || null,
      claveOnsets: temaData.practicaClave ? construirOnsetsClave(temaData.practicaClave, secPerBeatInicial, secPerBarInicial) : [],
      claveCicloSec: secPerBarInicial * 2,
      // v3.113: (a pedido) clave por sección — se precalcula una vez al
      // cargar el tema si ALGUNA sección trae claveSeccion propia, para
      // que el gate claveOn (más abajo, schedulerTickGlobalPractica) se
      // active aunque el tema NO tenga clave general. Sin esto, un tema
      // sin clave general pero con secciones que sí tienen claveSeccion
      // nunca sonaba: claveOn dependía solo de est.clave/claveEfectiva.
      tieneClaveSeccionAlguna: (temaData.practicaSecciones || []).some(s => (s.claveSeccion || '').trim()),
      ultimoOnsetClave: -Infinity,
      ultimoCompasClave: -1,
      // v2.4: ajustes de metrónomo (BPM/clave override, sonido,
      // acentos) — todo en memoria, nunca a Firestore. bpmOverride
      // null y claveOverride undefined significan "usa el valor real
      // del tema" (recalcularEfectivoPractica los resuelve).
      bpmOverride: null,
      claveOverride: undefined,
      sonidoClick: 'clasico',
      sonidoClave: 'clasico',
      claveActiva: true,
      acentos: acentosPorDefecto(compasesPorBarra),
      // v3.8: acentos por golpe de clave — se inicializan siempre (5
      // golpes fijos, ver acentosClavePorDefecto), aunque este tema no
      // tenga clave; simplemente no se usan hasta que la haya.
      acentosClave: acentosClavePorDefecto(),
      // v2.5: volumen relativo (0-1) de golpe fuerte/normal, calibrable
      // con sliders — antes el acento solo cambiaba el tono (poco
      // audible). Mudo no usa volumen, directamente no suena.
      volFuerte: 1,
      volNormal: 0.55,
      getTiempoActual: () => 0,
      seek: () => {},
      pause: () => {},
      ytPlayer: null,
      archivoLocalUrl: null,
      // v3.56: (a pedido) versiones disponibles de maqueta para este
      // instrumento (ej. "Con bajo"/"Sin bajo") y cuál está activa —
      // ver cambiarVersionMaquetaPractica.
      maquetasVersion: versionesDeEstaSesion,
      maquetaVersionIdx: 0,
      // v3.12: refs de DOM que actualizarContadorPractica() escribe en
      // CADA tick de rAF (hasta 60 veces/segundo) — se resuelven una
      // sola vez acá, al construir el estado, en vez de getElementById
      // repetido por frame. El resto de refs (sección/chips/clave) se
      // tocan solo cuando cambian, no por frame, así que se quedan como
      // estaban (el costo de buscarlas ahí es insignificante).
      el: {
        compas: document.getElementById('compas-' + uid),
        dots: Array.from({ length: compasesPorBarra }, (_, i) => document.getElementById('dot-' + uid + '-' + i))
      }
    };
    const est = estadoPractica[uid];
    cargarAjustesGuardados(uid);
    // v3.150: si se restauró un compasesOverride guardado, el panel de
    // ajustes se armó con el compás ORIGINAL del tema (antes de esta
    // carga) — hay que regenerar acentos/preset/libre para que
    // coincidan con el efectivo ya restaurado. Mismo bloque que usa
    // cambiarCompasOverridePractica.
    if(est.compasesOverride){
      const efectivoInicial = compasEfectivoDe(est);
      est.acentos = acentosPorDefecto(efectivoInicial);
      const acentosRowInicial = document.getElementById('acentosrow-' + uid);
      if(acentosRowInicial) acentosRowInicial.innerHTML = acentosBtnsHtml(uid, efectivoInicial);
      [2,3,4,5,6,7,8,9,12].forEach(b => {
        const btn = document.getElementById('compaspreset-' + uid + '-' + b);
        if(btn) btn.classList.toggle('activo', b === efectivoInicial);
      });
      const libreInicial = document.getElementById('compaslibre-' + uid);
      if(libreInicial) libreInicial.value = efectivoInicial;
      est.ultimaClaveFigurasRenderizada = undefined;
      est.ultimaClaveUnificadaRenderizada = undefined;
    }
    // v3.152: mismo criterio que arriba, pero para la subdivisión
    // restaurada — solo hace falta corregir los chips y el resumen (no
    // toca acentos/compás, la subdivisión es independiente de esos).
    if(est.subdivisionOverride){
      [1, 2, 4].forEach(s => {
        const btnSubdivInicial = document.getElementById('subdivpreset-' + uid + '-' + s);
        if(btnSubdivInicial) btnSubdivInicial.classList.toggle('activo', s === est.subdivisionOverride);
      });
    }
    actualizarResumenCompasSubdivPractica(uid);
    // v3.48: preferencia general de pre-conteo (ver definición arriba) —
    // pisa el default (activo, 1 compás) si el músico ya había elegido
    // otra cosa en este navegador, sin importar de qué tema se trate.
    const preconteoGuardado = cargarPreconteoGeneral();
    if(preconteoGuardado){
      if(typeof preconteoGuardado.activo === 'boolean') est.precontActivo = preconteoGuardado.activo;
      if(preconteoGuardado.compases === 1 || preconteoGuardado.compases === 2) est.precontCompases = preconteoGuardado.compases;
    }
    sincronizarUIPreconteo(uid);
    recalcularEfectivoPractica(uid);
    actualizarBadgePractica(uid, temaData.practicaCompas);
    actualizarUIAjustesPractica(uid);
    // v3.15: si había un bpmOverride guardado de una sesión anterior,
    // el panel general ya lo refleja (línea de arriba), pero el bloque
    // fino de calibración (bpmlocalval) no se pintaba hasta que el
    // músico tocara un botón — quedaba en "— BPM" mintiendo que no
    // había ajuste. Un solo refresco acá, al abrir.
    actualizarUIBpmLocalPractica(uid);

    // v2.2/v2.3: sin maqueta, no hay audio/YouTube que conectar — el
    // reloj del metrónomo libre lo maneja toggleMetronomoLibre() con su
    // propio performance.now(), y el botón de local file (siempre
    // presente en controlesPracticaHtml) se conecta aparte en
    // onArchivoLocalElegido() cuando el músico lo use.
    if(!maqueta) return;
    conectarMaquetaEnPractica(uid, maqueta);
  });
}

// v3.56: (a pedido) conecta el audio/YouTube de UNA maqueta al estado
// ya armado en estadoPractica[uid] — se separó del cuerpo de
// inicializarReproductoresPractica (donde vivía antes, igual línea por
// línea) para poder reusarla también al cambiar de versión
// (cambiarVersionMaquetaPractica), sin duplicar esta lógica en dos
// lugares que se puedan desincronizar con el tiempo. Comportamiento
// idéntico al de antes para la carga inicial.
function conectarMaquetaEnPractica(uid, maqueta){
  const est = estadoPractica[uid];
  if(!est || !maqueta) return;

  if(maqueta.tipo === 'audio'){
    const audio = document.getElementById('audio-' + uid);
    if(!audio) return;
    const ytDivPrevio = document.getElementById('yt-' + uid);
    if(ytDivPrevio) ytDivPrevio.style.display = 'none';
    audio.src = maqueta.url;
    // v3.186: filtros de tono — el <audio> nativo de la maqueta remota
    // se conecta a Web Audio UNA SOLA VEZ en su vida (mismo criterio
    // que el archivo local, ver onArchivoLocalElegido), reusado en
    // cada cambio de versión ("Con bajo"/"Sin bajo") de esta sesión.
    if(!est.audioRemotoSource){
      obtenerFiltrosPractica(uid);
      est.audioRemotoSource = obtenerAudioCtxPractica().createMediaElementSource(audio);
      est.audioRemotoSource.connect(est.filtroHighpass);
    }
    const barra = document.getElementById('playerbar-' + uid);
    if(barra) barra.style.display = 'flex';
    const panelFiltros = document.getElementById('filtroslocal-' + uid);
    if(panelFiltros) panelFiltros.style.display = 'block';
    // v3.95: (a pedido) faltaba feedback de carga acá — a diferencia
    // de onArchivoLocalElegido() (archivo del dispositivo), este
    // camino (maqueta remota / cambio de versión con bajo/sin bajo)
    // nunca mostraba "Cargando audio…" mientras se descarga/decodifica
    // la nueva pista. Mismo elemento (playercargando) que ya usaba el
    // archivo local, PERO sin deshabilitar el botón de play: acá el
    // <audio> nativo ya es reproducible de una (streaming progresivo,
    // ver comentario v3.48 abajo) — bloquear el botón contradiría eso.
    // Es solo un aviso de que el waveform/loop exacto están en camino.
    const cargandoEl = document.getElementById('playercargando-' + uid);
    if(cargandoEl) cargandoEl.style.display = 'inline';
    // v3.95: limpia el aviso de fallback de la versión anterior hasta
    // saber si este nuevo waveform carga o no.
    mostrarSeekFallbackPractica(uid, false);
    // v3.48: arranca de una con el <audio> nativo (streaming
    // progresivo, como siempre) y en 2do plano intenta el "upgrade" a
    // Web Audio (loop exacto) — no hace falta bloquear nada mientras
    // tanto, el músico ya puede reproducir normal desde el vamos.
    conectarListenersMotorLocalPractica(uid, audio);
    conectarMotorLocalPractica(uid, audio);
    fetch(maqueta.url).then(r => r.arrayBuffer()).then(async ab => {
      const ctxTmp = new (window.AudioContext || window.webkitAudioContext)();
      try{
        return await ctxTmp.decodeAudioData(ab);
      } finally {
        try{ ctxTmp.close(); }catch(e){}
      }
    }).then(audioBuffer => {
      const estAhora = estadoPractica[uid];
      // si el músico ya cambió de archivo/versión/sesión mientras esto
      // corría (re-render, RSVP, cambio de versión, etc.), este
      // resultado quedó viejo.
      if(!estAhora || estAhora.audioActivo !== audio) return;
      const player = crearWebAudioPlayer();
      player.cargarBuffer(audioBuffer);
      // v3.186: mismo reruteo que el archivo local — la maqueta remota
      // también pasa por los filtros de tono de este uid.
      obtenerFiltrosPractica(uid);
      player.conectarSalida(estAhora.filtroHighpass);
      conectarListenersMotorLocalPractica(uid, player);
      const tActual = estAhora.getTiempoActual();
      const estabaSonando = estAhora.audioActivo && !estAhora.audioActivo.paused;
      // v3.121: FIX — se guarda el motor anterior ANTES de reconectar
      // (cambio de versión de maqueta, chips "Con bajo"/"Sin bajo"). Si
      // ese motor anterior ya era un crearWebAudioPlayer() (venía de una
      // versión previa ya "mejorada" a loop exacto), había quedado sin
      // cerrar — antes eso perdía un AudioContext entero por cada
      // cambio de versión; con el contexto compartido (v3.120) dejaba
      // el nodo colgado para siempre en el grafo. El <audio> nativo (uid
      // fijo, se reusa siempre) no tiene .cerrar, así que este cierre
      // nunca lo afecta a él.
      const motorAnteriorRemoto = estAhora.audioActivo;
      if(estabaSonando) estAhora.pause();
      conectarMotorLocalPractica(uid, player);
      if(motorAnteriorRemoto && motorAnteriorRemoto !== player && typeof motorAnteriorRemoto.cerrar === 'function'){
        motorAnteriorRemoto.cerrar();
      }
      estAhora.seek(tActual);
      aplicarLoopNativoPractica(uid);
      if(estabaSonando) estAhora.play();
      // v3.52: (a pedido) waveform de la maqueta remota — se reusa el
      // mismo audioBuffer que ya se decodificó arriba para el loop
      // exacto (no se descarga/decodifica una segunda vez). Usa la
      // misma función que el archivo local (prepararWaveformDesdeBuffer),
      // así que el canvas/toolbar/zoom se comportan idéntico.
      prepararWaveformDesdeBuffer(uid, audioBuffer);
      // v3.55: (a pedido) el nombre ahora se extrae del public_id de
      // la URL de Cloudinary (nombrePublicIdDesdeUrl) en vez de un
      // campo guardado aparte — el preset ya está configurado para
      // usar el nombre real del archivo como public_id, así que esto
      // se actualiza solo con cualquier URL (manual o por upload),
      // sin depender de nada que se pueda desincronizar. Las
      // maquetas viejas (subidas antes de ese cambio de preset) van
      // a mostrar el código aleatorio de siempre hasta que se
      // vuelvan a subir.
      const nombrePublico = nombrePublicIdDesdeUrl(maqueta.url);
      if(nombrePublico){
        const nombreSpanTop = document.getElementById('archivonombretop-' + uid);
        if(nombreSpanTop) nombreSpanTop.textContent = '🎵 ' + nombrePublico;
        // v3.195: (a pedido) mismo nombre también en archivolocalnombre
        // (practica-local-row, debajo de la card del contador desde
        // v3.194) — antes SOLO se mostraba arriba (archivonombretop)
        // para el caso de maqueta en la nube; ahora que archivonombretop
        // se va a sacar por duplicado, este es el único lugar que le
        // queda al músico para ver qué maqueta está sonando.
        const nombreSpanBottom = document.getElementById('archivolocalnombre-' + uid);
        if(nombreSpanBottom) nombreSpanBottom.textContent = '🎵 ' + nombrePublico;
      }
    }).catch(err => {
      console.warn('No se pudo preparar el loop exacto para la maqueta remota (se sigue usando el audio nativo de siempre):', err);
      mostrarSeekFallbackPractica(uid, true);
    }).finally(() => {
      if(cargandoEl) cargandoEl.style.display = 'none';
    });
    return;
  }

  const ytId = extraerIdYoutube(maqueta.url);
  const ytDiv = document.getElementById('yt-' + uid);
  if(!ytId || !ytDiv) return;
  const barraAudio = document.getElementById('playerbar-' + uid);
  if(barraAudio) barraAudio.style.display = 'none';
  const cueRowYt = document.getElementById('cuerow-' + uid);
  if(cueRowYt) cueRowYt.style.display = 'none';
  ytDiv.style.display = '';
  // v3.56: si ya había un YT.Player de una versión anterior conectada
  // en esta misma sesión (cambio de versión), se destruye antes de
  // crear el nuevo — evita acumular reproductores/iframes ocultos.
  if(est.ytPlayer && typeof est.ytPlayer.destroy === 'function'){
    try{ est.ytPlayer.destroy(); }catch(e){}
    est.ytPlayer = null;
  }
  const crearPlayer = () => {
    const player = new YT.Player('yt-' + uid, {
      videoId: ytId,
      height: '100%', width: '100%',
      events: {
        onReady: () => {
          est.getTiempoActual = () => player.getCurrentTime();
          est.seek = (t) => player.seekTo(t, true);
          est.pause = () => player.pauseVideo();
        },
        onStateChange: (e) => {
          if(e.data === YT.PlayerState.PLAYING){
            marcarReproduccionActiva(uid);
            const tick = () => {
              if(player.getPlayerState() !== YT.PlayerState.PLAYING) return;
              actualizarContadorPractica(uid, player.getCurrentTime());
              requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }
        }
      }
    });
    est.ytPlayer = player;
  };
  if(ytApiListo) crearPlayer(); else colaInicializacionYt.push(crearPlayer);
}

// v3.56: (a pedido) cambia la versión de maqueta activa para este
// instrumento (chips "Con bajo"/"Sin bajo", etc.) — mantiene el mismo
// segundo donde estaba el músico, así se puede comparar el mismo
// pasaje con y sin su instrumento. Simplificación consciente: el
// cambio de versión PAUSA la reproducción (no la retoma sola) — evita
// tener que detectar "estaba sonando" de forma genérica entre los dos
// motores posibles (Web Audio / YouTube), que son bastante distintos
// entre sí. El músico solo tiene que tocar play de nuevo del otro
// lado exacto donde iba.
function cambiarVersionMaquetaPractica(uid, idx){
  const est = estadoPractica[uid];
  if(!est || !est.maquetasVersion || !est.maquetasVersion[idx]) return;
  if(idx === est.maquetaVersionIdx) return;
  const tActual = est.getTiempoActual ? est.getTiempoActual() : 0;
  if(est.pause) est.pause();
  est.maquetaVersionIdx = idx;
  const nuevaMaqueta = est.maquetasVersion[idx];
  conectarMaquetaEnPractica(uid, nuevaMaqueta);
  // el <audio> nativo arranca de 0 hasta que carga metadata; seek con
  // un pequeño reintento cubre el caso de que el navegador todavía no
  // sepa la duración cuando llamamos seek() la primera vez.
  const intentarSeek = () => { if(est.seek) est.seek(tActual); };
  intentarSeek();
  setTimeout(intentarSeek, 300);
  document.querySelectorAll(`#versionchips-${uid} .practica-version-chip`).forEach((btn, i) => {
    btn.classList.toggle('activo', i === idx);
  });
}

// v1.2: abre consentimiento.html (existente, sin tocar) con los datos
// ya conocidos precargados — mismo esquema de parámetros que ya genera
// logistica.html ("Generar link de consentimiento"), solo que acá no
// hace falta que staff lo arme y lo mande: el músico ya está en su
// propio portal con sus propios datos.
function abrirConsentimiento(proyectoId, sesionId, tarifa){
  const params = new URLSearchParams({
    p: proyectoId, s: sesionId,
    nombre: nombreMusicoActual, correo: correoActual
  });
  if(tarifa) params.set('tarifa', tarifa);
  window.open('consentimiento.html?' + params.toString(), '_blank');
}

async function responderRsvp(proyectoId, sesionId, respuesta){
  if(modoPreview){ mostrarToast('No puedes confirmar asistencia en modo vista previa.', 'info'); return; }
  try{
    // set(...,{merge:true}) con objeto anidado — NO usar update() con un
    // string tipo 'rsvp.correo@ejemplo.com': Firestore interpreta los
    // puntos de un string de update() como separadores de campo, y un
    // correo real tiene puntos, así que rompería la ruta. Con un objeto
    // JS normal, la key (aunque tenga puntos) se guarda literal.
    await db.collection('proyectos').doc(proyectoId).collection('sesiones').doc(sesionId)
      .set({ rsvp: { [correoActual]: respuesta } }, { merge: true });
    cargarSesiones();
  } catch(err){
    console.error('Error guardando RSVP:', err);
    mostrarToast('No pudimos guardar tu respuesta. Intenta de nuevo.', 'error');
  }
}

    const encendida = est.waveformFlashSeccion != null && Math.abs(est.waveformFlashSeccion - tSec) < 0.001
      && est.waveformFlashSeccionHasta && ahora < est.waveformFlashSeccionHasta;
    info.encendida = encendida;
    if(encendida){
      ctxDraw.shadowColor = color;
      ctxDraw.shadowBlur = 12;
      ctxDraw.strokeStyle = colorMezclarBlanco(color, 0.55);
      ctxDraw.lineWidth = 3;
    }else{
      ctxDraw.shadowBlur = 0;
      ctxDraw.strokeStyle = color;
      ctxDraw.lineWidth = 2;
    }
    ctxDraw.beginPath();
    ctxDraw.moveTo(sx, 14);
    ctxDraw.lineTo(sx, H);
    ctxDraw.stroke();
    ctxDraw.shadowBlur = 0;
    // fin manual (hastaSegundos) — línea punteada, mismo color, toda la altura.
    if(sec.hastaSegundos != null && sec.hastaSegundos > 0 && sec.hastaSegundos < dur){
      const sxFin = (sec.hastaSegundos / dur) * W;
      ctxDraw.beginPath();
      ctxDraw.setLineDash([4, 3]);
      ctxDraw.strokeStyle = color;
      ctxDraw.lineWidth = 2;
      ctxDraw.moveTo(sxFin, 14);
      ctxDraw.lineTo(sxFin, H);
      ctxDraw.stroke();
      ctxDraw.setLineDash([]);
    }
  });

  // -- pasada 2: etiquetas, cada una en su carril ya asignado arriba --
  infoSecciones.forEach(({ nombreSec, anchoNombre, anchoNombreSolo, sx, carril, encendida, color, notaSec }) => {
    if(!nombreSec) return;
    ctxDraw.font = encendida ? 'bold 14px monospace' : 'bold 13px monospace';
    const labelX = sx + 1;
    const labelY = ondaH + carril * WAVEFORM_LANE_H + 3;
    ctxDraw.fillStyle = colorFondoTick;
    ctxDraw.fillRect(labelX, labelY, anchoNombre + 6, 16);
    ctxDraw.fillStyle = encendida ? colorMezclarBlanco(color, 0.55) : color;
    ctxDraw.fillText(nombreSec, labelX + 3, labelY + 12);
    // v3.105: nota de sección pegada al lado del nombre, mismo renglón
    // (como en el PDF) — itálica, chica y en colorFaint (tenue a
    // propósito, dato secundario) para que el ojo vaya primero al
    // nombre. El fondo ya se dibujó de una sola vez arriba, con el ancho
    // combinado (anchoNombre incluye la nota), así no hace falta un
    // segundo fillRect pegado.
    if(notaSec){
      ctxDraw.font = 'italic 11px monospace';
      ctxDraw.fillStyle = colorFaint;
      ctxDraw.fillText(notaSec, labelX + 3 + anchoNombreSolo + 6, labelY + 11);
    }
  });

  // v3.139: (a pedido) línea de "comienzo de canción" (offsetEfectivo)
  // — existía antes de v3.137 mezclada con el CUE; al separar los
  // conceptos en v3.138 se había perdido sin querer. Vuelve acá como
  // marca independiente (celeste, distinta del rosa del CUE y del
  // dorado de los ticks de compás) — es el punto que calibran los
  // botones 🎯 de Configuración, siempre visible mientras
  // offsetLocalDelta ≠ 0.
  if(est.offsetLocalDelta && offsetEfectivo > 0 && offsetEfectivo < dur){
    const xOffset = (offsetEfectivo / dur) * W;
    const colorOffsetLinea = '#6fd6ff';
    ctxDraw.shadowBlur = 0;
    ctxDraw.strokeStyle = colorOffsetLinea;
    ctxDraw.lineWidth = 2;
    ctxDraw.beginPath();
    ctxDraw.moveTo(xOffset, 14);
    ctxDraw.lineTo(xOffset, H);
    ctxDraw.stroke();
    ctxDraw.fillStyle = colorOffsetLinea;
    ctxDraw.beginPath();
    ctxDraw.moveTo(xOffset, 14);
    ctxDraw.lineTo(xOffset - 8, 19);
    ctxDraw.lineTo(xOffset, 24);
    ctxDraw.closePath();
    ctxDraw.fill();
  }

  // v3.138: (a pedido) marca de CUE — punto donde arranca la
  // reproducción al tocar play (ver togglePlayPractica), marcado con
  // los botones del reproductor (marcarCuePractica /
  // toggleArmarCueWaveform). Totalmente independiente del offset (línea
  // ELIMINADA en v3.138: la de v3.137 usaba offsetLocalDelta, que es
  // solo para click/conteo — mezclaba los dos conceptos). Color propio
  // (rosa/magenta) para no confundirse con los ticks de compás (dorado)
  // ni las líneas de sección. Desaparece sola con "✕ Quitar CUE"
  // (quitarCuePractica, pone cuePlayback en null).
  if(est.cuePlayback != null && est.cuePlayback >= 0 && est.cuePlayback < dur){
    const xCue = (est.cuePlayback / dur) * W;
    const colorCue = '#ff5da2';
    ctxDraw.shadowBlur = 0;
    ctxDraw.strokeStyle = colorCue;
    ctxDraw.lineWidth = 2;
    ctxDraw.beginPath();
    ctxDraw.moveTo(xCue, 14);
    ctxDraw.lineTo(xCue, H);
    ctxDraw.stroke();
    ctxDraw.fillStyle = colorCue;
    ctxDraw.beginPath();
    ctxDraw.moveTo(xCue, 14);
    ctxDraw.lineTo(xCue + 8, 19);
    ctxDraw.lineTo(xCue, 24);
    ctxDraw.closePath();
    ctxDraw.fill();
  }

  // v3.219: (a pedido) banderitas de inicio (▶) y fin (◀) del loop
  // marcado, en verde (mismo colorOk que su franja). Van en una fila propia
  // (y 26-36), debajo de las de offset/CUE (14-24) y de la fila de números
  // de compás (0-14), y el mástil termina antes de la regla de tiempo
  // (ondaH-14), para no pisar ninguna. Con el loop a medio marcar (ya hay
  // inicio, falta el fin) se ve solo la de inicio.
  if(est.loopInicio != null || est.loopFin != null){
    const yMastilA = 14, yMastilB = Math.max(yMastilA + 14, ondaH - 14), yBandera = 26;
    ctxDraw.shadowBlur = 0;
    ctxDraw.strokeStyle = colorOk;
    ctxDraw.fillStyle = colorOk;
    ctxDraw.lineWidth = 2;
    if(est.loopInicio != null && est.loopInicio >= 0 && est.loopInicio <= dur){
      const xLoopIni = (est.loopInicio / dur) * W;
      ctxDraw.beginPath();
      ctxDraw.moveTo(xLoopIni, yMastilA);
      ctxDraw.lineTo(xLoopIni, yMastilB);
      ctxDraw.stroke();
      ctxDraw.beginPath();
      ctxDraw.moveTo(xLoopIni, yBandera);
      ctxDraw.lineTo(xLoopIni + 9, yBandera + 5);
      ctxDraw.lineTo(xLoopIni, yBandera + 10);
      ctxDraw.closePath();
      ctxDraw.fill();
    }
    if(est.loopFin != null && est.loopFin >= 0 && est.loopFin <= dur){
      const xLoopFin = (est.loopFin / dur) * W;
      ctxDraw.beginPath();
      ctxDraw.moveTo(xLoopFin, yMastilA);
      ctxDraw.lineTo(xLoopFin, yMastilB);
      ctxDraw.stroke();
      ctxDraw.beginPath();
      ctxDraw.moveTo(xLoopFin, yBandera);
      ctxDraw.lineTo(xLoopFin - 9, yBandera + 5);
      ctxDraw.lineTo(xLoopFin, yBandera + 10);
      ctxDraw.closePath();
      ctxDraw.fill();
    }
  }

  // v3.206: redibujado diferido de los números de compás (ver el
  // array numerosCompas más arriba) — se dibujan ACÁ, después de
  // todas las líneas (secciones, offset, CUE), para que ninguna quede
  // por encima y los tape.
  ctxDraw.textAlign = 'center';
  numerosCompas.forEach(n => {
    ctxDraw.font = n.font;
    ctxDraw.fillStyle = colorFondoTick;
    ctxDraw.fillRect(n.tx - n.ancho / 2 - 3, 0, n.ancho + 6, 14);
    ctxDraw.fillStyle = n.encendido ? '#fff4d6' : colorGold;
    ctxDraw.fillText(n.texto, n.tx, 11);
  });
  // v3.219: (a pedido) "algunas líneas/marcadores/banderitas están pisando
  // los números de la regla de tiempo" — la hora de cada tick se dibujaba
  // ANTES que las líneas de sección, offset y CUE, que la cruzaban. Ahora se
  // dibuja acá, al final (mismo criterio que los números de compás de
  // arriba): con su caja de fondo la principal, sin caja y tenue la
  // intermedia (como se pidió en v3.145). El playhead blanco sigue encima.
  tiemposRegla.forEach(n => {
    ctxDraw.font = n.font;
    if(n.caja){
      ctxDraw.fillStyle = colorFondoTick;
      ctxDraw.fillRect(n.tx - n.ancho / 2 - 2, n.y - 9, n.ancho + 4, 11);
    }
    ctxDraw.globalAlpha = n.alpha;
    ctxDraw.fillStyle = n.encendido ? '#fff4d6' : colorGold;
    ctxDraw.fillText(n.texto, n.tx, n.y);
    ctxDraw.globalAlpha = 1;
  });

  // v3.37: (a pedido) autoscroll — solo aplica si hay zoom (si no, el
  // canvas entero ya es visible y no hay nada que scrollear) y si el
  // checkbox "Seguir reproducción" está tildado. Se corrige el scroll
  // del wrap SOLO cuando el playhead se sale del área visible (no en
  // cada frame, para no pelearse con el dedo del músico si está
  // scrolleando manualmente el waveform). Si el músico scrolleó a mano
  // hace poco (est.waveformUltimoScrollManual), se respeta ese gesto
  // y no se fuerza el autoscroll hasta pasado ese margen de tiempo.
  if(wrapEl && zoom > 1 && est.waveformAutoScroll){
    const scrollManualReciente = est.waveformUltimoScrollManual && (ahora - est.waveformUltimoScrollManual) < 1500;
    if(!scrollManualReciente){
      const visibleIzq = wrapEl.scrollLeft;
      const visibleDer = visibleIzq + wrapEl.clientWidth;
      const margen = wrapEl.clientWidth * 0.15;
      if(progressX < visibleIzq + margen || progressX > visibleDer - margen){
        est.waveformScrollProgramatico = true;
        wrapEl.scrollLeft = Math.max(0, progressX - wrapEl.clientWidth / 2);
        clearTimeout(est.waveformScrollProgTimeout);
        est.waveformScrollProgTimeout = setTimeout(() => { est.waveformScrollProgramatico = false; }, 100);
      }
    }
  }

  // v3.203: (a pedido, "que no compita con las de sección") antes el
  // playhead era una línea completa de arriba a abajo, mismo lenguaje
  // visual que las líneas de sección (que sí cruzan todo el alto) —
  // competían por atención. Ahora es una bandera/triángulo SOLO
  // arriba (no cruza el alto completo, así el ojo asocia "línea
  // completa = sección" vs "marca arriba = dónde estoy") + un pulso
  // sutil de opacidad (t/500, seno) — como es el único elemento que
  // "respira", se encuentra solo sin competir en contraste. El pulso
  // se nota mientras suena (llamado por frame); en pausa queda fijo
  // en la fase del instante en que se pausó, sin rAF propio agregado
  // a propósito (no vale la pena un loop solo por esto en pausa).
  // v3.204: (a pedido) "no me gusta [la bandera], dejalo como estaba
  // [línea completa v3.202] pero más opaca [tenue/muted, para que no
  // compita con las líneas de sección], más delgada, y que respire".
  // Vuelve a cruzar todo el alto (H), pero: sin sombra/glow (eso era
  // lo que más competía visualmente con el flash de las secciones),
  // 1px en vez de 2px, y alpha baja pulsando suave (0.35-0.55) en vez
  // de sólida — se nota que "respira" sin ser el elemento más
  // llamativo del canvas (las líneas de sección, con su flash dorado/
  // de color, siguen siendo las protagonistas).
  // v3.205: (a pedido) "que respire más intensamente y también cuando
  // está detenido" — amplitud subida (0.5±0.35, antes 0.45±0.1) y se
  // agrega iniciarRespiroWaveform (ver más abajo) para que siga
  // pulsando incluso en pausa, no solo mientras suena.
  // v3.206: (a pedido) "más rapidita, como un palpito" + "probemos
  // blanca, como luz". Período bajado de 500ms a 180ms (late mucho
  // más parecido a un pulso cardíaco que a una respiración lenta) y
  // color cambiado de colorProgreso (lila) a blanco puro — se probó
  // como pidió, a ver si funciona mejor que el lila tenue de v3.204.
  if(progressX >= 0 && progressX <= W){
    const pulso = 0.5 + Math.sin(ahora / 180) * 0.35;
    ctxDraw.save();
    ctxDraw.globalAlpha = pulso;
    ctxDraw.strokeStyle = '#ffffff';
    ctxDraw.lineWidth = 1;
    ctxDraw.beginPath();
    ctxDraw.moveTo(progressX, 0);
    ctxDraw.lineTo(progressX, H);
    ctxDraw.stroke();
    ctxDraw.restore();
  }

  // v3.202: (a pedido) flash breve al hacer click para saltar en la
  // onda (seekWaveformClick) — antes el único feedback era el salto
  // del playhead, fácil de no notar si el salto es corto. Un círculo
  // que se desvanece en ~300ms marca exactamente dónde se tocó.
  if(est.waveformFlashClick != null && est.waveformFlashClickHasta && ahora < est.waveformFlashClickHasta){
    const restante = (est.waveformFlashClickHasta - ahora) / 300;
    const xFlash = (est.waveformFlashClick / dur) * W;
    ctxDraw.save();
    ctxDraw.globalAlpha = Math.max(0, Math.min(1, restante));
    ctxDraw.strokeStyle = colorProgreso;
    ctxDraw.lineWidth = 2;
    ctxDraw.beginPath();
    ctxDraw.arc(xFlash, ondaH / 2, 6 + (1 - restante) * 10, 0, Math.PI * 2);
    ctxDraw.stroke();
    ctxDraw.restore();
  }

  est.waveformTiempoPrevio = tiempoActual;
}

// v3.37: (a pedido) zoom horizontal del waveform. delta +1/-1 desde
// los botones +/-. Tope 1x-8x. Al cambiar el zoom se redibuja ya
// mismo (cambia W, y por lo tanto el ancho del canvas) y se actualiza
// la etiqueta numérica de al lado de los botones.
const WAVEFORM_ZOOM_MIN = 1;
const WAVEFORM_ZOOM_MAX = 8;
function zoomWaveform(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  const actual = est.waveformZoom || 1;
  const nuevo = Math.max(WAVEFORM_ZOOM_MIN, Math.min(WAVEFORM_ZOOM_MAX, actual + delta));
  if(nuevo === actual) return;
  est.waveformZoom = nuevo;
  const label = document.getElementById('waveformzoomlabel-' + uid);
  if(label) label.textContent = nuevo + '×';
  dibujarWaveform(uid, est.getTiempoActual ? est.getTiempoActual() : 0);
}
// v3.193: (a pedido, portado de ensayo.html v3.210.6) botón cuadrado
// 🤿 — ajusta el zoom a la sección que está sonando AHORA (mismo
// criterio de "sección actual" que ya usa el resaltado del mapa/chip).
// Zoom entero (mismo rango 1×-8× que +/-), redondeado HACIA ABAJO para
// garantizar que la sección completa entre en el ancho visible sin
// cortarse, y hace scroll para dejar el inicio de la sección pegado al
// borde izquierdo — mismo patrón que ya usa el autoscroll
// (wrapEl.scrollLeft/waveformScrollProgramatico).
function ajustarZoomASeccionPractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.waveformDuracion) return;
  const dur = est.waveformDuracion;
  const tiempoActual = est.getTiempoActual ? est.getTiempoActual() : 0;
  const secciones = seccionesRuntimeDe(est).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  if(!secciones.length){ mostrarToast('Este tema no tiene secciones marcadas.', 'info'); return; }
  let actual = null, siguiente = null;
  secciones.forEach((sec, i) => {
    if(tiempoActual >= (sec.desdeSegundos || 0)){ actual = sec; siguiente = secciones[i+1] || null; }
  });
  if(!actual){ mostrarToast('No hay una sección activa en este punto del audio.', 'info'); return; }
  const inicio = actual.desdeSegundos || 0;
  const finCandidato = siguiente ? (siguiente.desdeSegundos || 0) : actual.hastaSegundos;
  const fin = (finCandidato != null) ? finCandidato : dur;
  const duracionSeccion = Math.max(0.5, fin - inicio);
  const zoomIdeal = dur / duracionSeccion;
  const nuevoZoom = Math.max(WAVEFORM_ZOOM_MIN, Math.min(WAVEFORM_ZOOM_MAX, Math.floor(zoomIdeal)));
  est.waveformZoom = nuevoZoom;
  const label2 = document.getElementById('waveformzoomlabel-' + uid);
  if(label2) label2.textContent = nuevoZoom + '×';
  dibujarWaveform(uid, tiempoActual);
  const wrapEl = document.getElementById('waveformwrap-' + uid);
  if(wrapEl){
    const wrapWidth = wrapEl.clientWidth || 700;
    const W = Math.round(wrapWidth * nuevoZoom);
    est.waveformScrollProgramatico = true;
    wrapEl.scrollLeft = Math.max(0, (inicio / dur) * W);
    clearTimeout(est.waveformScrollProgTimeout);
    est.waveformScrollProgTimeout = setTimeout(() => { est.waveformScrollProgramatico = false; }, 100);
  }
}

// v3.37: prende/apaga el autoscroll (checkbox "Seguir reproducción").
// v3.178: (a pedido) pasa de checkbox a botón cuadrado icon-only —
// ya no recibe el "checked" de un <input>, alterna el estado
// internamente y refleja la clase .activo en el propio botón (mismo
// patrón que toggleLoopSeccionPractica, arriba).
function toggleAutoScrollWaveformBtn(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.waveformAutoScroll = !est.waveformAutoScroll;
  const btn = document.getElementById('waveformautoscroll-' + uid);
  if(btn) btn.classList.toggle('activo', est.waveformAutoScroll);
}

// v3.163: función toggleOcultarEtiquetasEstructura (v3.135) eliminada
// — quedó sin efecto real desde que seccionesRuntimeDe(est) vacía las
// secciones automáticamente con archivo local (ver más arriba), que
// era el único caso para el que existía. El checkbox y el wrap
// asociado también se sacaron de bloquePracticaHtml.

// v3.37: si el músico scrollea el waveform a mano (arrastra con el
// dedo/mouse mientras está zoomeado), el autoscroll no debe pelearse
// con ese gesto ni "tirarlo" de vuelta al playhead. Se distingue
// scroll manual de scroll programático (el que hace la propia función
// de autoscroll) con la bandera est.waveformScrollProgramatico, que
// dibujarWaveform prende justo antes de mover el scroll y apaga un
// instante después. Cualquier evento de scroll que NO tenga esa
// bandera prendida se toma como gesto del músico, y pausa el
// autoscroll por 1.5s (ver waveformUltimoScrollManual en
// dibujarWaveform) — tiempo suficiente para que termine de acomodar
// la vista antes de que el autoscroll vuelva a tomar el control.
// Delegado en document (los canvas/wraps se crean dinámicamente por
// uid), filtrando por la clase del wrap.
document.addEventListener('scroll', (ev) => {
  const wrapEl = ev.target;
  if(!wrapEl || !wrapEl.classList || !wrapEl.classList.contains('practica-waveform-wrap')) return;
  const uid = (wrapEl.id || '').replace('waveformwrap-', '');
  const est = estadoPractica[uid];
  if(!est || est.waveformScrollProgramatico) return;
  est.waveformUltimoScrollManual = performance.now();
}, true);

// v3.19: elige cada cuántos compases poner un tick para que siempre
// queden entre ~4 y ~10 marcas visibles, sin importar tempo/duración
// del tema — mismo criterio que se probó en el boceto.
function intervaloCompasesWaveform(duracionSeg, secPerBar){
  const totalCompases = duracionSeg / secPerBar;
  const candidatos = [4, 8, 16, 32, 64, 128, 256];
  for(let i = 0; i < candidatos.length; i++){
    if(totalCompases / candidatos[i] <= 10) return candidatos[i];
  }
  return candidatos[candidatos.length - 1];
}

// v3.19: click/tap en el waveform salta a ese punto — usa est.seek(),
// el mismo hook que ya usan los demás controles, así que funciona
// igual sin importar si detrás hay <audio> local (el único caso real
// hoy, ya que el waveform solo existe para archivo local).
function seekWaveformClick(evento, uid){
  const est = estadoPractica[uid];
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(!est || !canvas || !est.waveformDuracion) return;
  const rect = canvas.getBoundingClientRect();
  const frac = (evento.clientX - rect.left) / rect.width;
  const t = Math.max(0, Math.min(est.waveformDuracion, frac * est.waveformDuracion));
  // v3.135: (a pedido) "ajustar el comienzo con click en la onda" — si
  // el modo está armado (toggleArmarMarcarInicioWaveform), este click
  // marca el tiempo 1 ACÁ en vez de hacer seek/cerrar loop, y se
  // desarma solo. Mismo cálculo que marcarOffsetLocalPractica, pero
  // con el tiempo clickeado en vez de est.getTiempoActual().
  if(est.marcandoInicioClick){
    // v3.207: (a pedido) "si clickeo cerca [de un transitorio] hago
    // snap" — si hay un transitorio detectado (calcularTransientesDesdeBuffer)
    // a menos de TOLERANCIA_SNAP_INICIO del punto clickeado, se usa el
    // tiempo EXACTO de ese transitorio en vez del pixel crudo del
    // click (mucho más preciso que acertar a mano el pixel exacto del
    // golpe, sobre todo con poco zoom).
    const TOLERANCIA_SNAP_INICIO = 0.08; // 80ms
    let tFinal = t;
    let snapeo = false;
    if(est.waveformTransientes && est.waveformTransientes.length){
      let masCercano = null, distMin = Infinity;
      for(const tt of est.waveformTransientes){
        const d = Math.abs(tt - t);
        if(d < distMin){ distMin = d; masCercano = tt; }
      }
      if(masCercano != null && distMin <= TOLERANCIA_SNAP_INICIO){ tFinal = masCercano; snapeo = true; }
    }
    fijarOffsetLocalDeltaPractica(uid, tFinal - (est.offset || 0));
    est.marcandoInicioClick = false;
    canvas.classList.remove('practica-waveform-armado');
    const btnArmado = document.getElementById('marcarinicioclick-' + uid);
    if(btnArmado) btnArmado.classList.remove('activo');
    actualizarUIOffsetLocalPractica(uid);
    actualizarContadorPractica(uid, est.getTiempoActual());
    dibujarWaveform(uid, est.getTiempoActual());
    guardarOffsetLocalEnStorage(uid);
    const infoSnap = document.getElementById('offsetlocalauto-' + uid);
    if(infoSnap) infoSnap.textContent = snapeo
      ? `Ajustado al golpe detectado en ${tFinal.toFixed(2)}s.`
      : `Marcado en ${tFinal.toFixed(2)}s (sin golpe detectado cerca).`;
    return;
  }
  // v3.138: (a pedido) "CUE con click en la onda" — mismo patrón que el
  // armado de offset de arriba, pero para el CUE de reproducción
  // (variable independiente, ver toggleArmarCueWaveform). Se revisa
  // DESPUÉS del armado de offset para que nunca puedan quedar los dos
  // modos activos a la vez con resultados ambiguos (en la práctica solo
  // se arma uno por vez, ya que cada botón desarma implícitamente con
  // su propio toggle).
  if(est.marcandoCueClick){
    let tFinal = t;
    const modoCue = est.modoSnapClick || 'rejilla';
    if(modoCue === 'transitorio'){
      const cercano = transienteMasCercanoPractica(est, t);
      if(cercano != null) tFinal = cercano;
      // sin transitorio cerca: el CUE nunca tuvo snap antes de esta
      // versión, así que en ese caso cae al click crudo (no a rejilla).
    }else{
      const bpmCue = est.bpmEfectivo || est.bpm;
      if(bpmCue){
        const offsetCue = (est.offset || 0) + (est.offsetLocalDelta || 0);
        const unidadCompasesCue = est.clave ? 2 : 1;
        const tramosCue = recorrerTramosMusico(seccionesRuntimeDe(est), offsetCue, bpmCue, compasEfectivoDe(est), !!est.compasesOverride);
        const tramoDeTCue = tramoMusicoEnSegundo(tramosCue, t);
        tFinal = snapACompasPractica(t, bpmCue, tramoDeTCue.beats * unidadCompasesCue, tramoDeTCue.inicioSeg);
      }
    }
    est.cuePlayback = tFinal;
    est.marcandoCueClick = false;
    canvas.classList.remove('practica-waveform-armado-cue');
    const btnCueArmado = document.getElementById('cueclickbtn-' + uid);
    if(btnCueArmado) btnCueArmado.classList.remove('activo');
    dibujarWaveform(uid, est.getTiempoActual());
    return;
  }
  // v3.28: (a pedido) si hay un loop a medio marcar (ya se tocó
  // "Marcar loop aquí" una vez y está esperando el fin), tocar el
  // waveform también sirve para cerrarlo ahí — no hace falta esperar
  // a que la reproducción llegue sola a ese punto.
  if(est.loopInicio != null && !est.loopActivo){
    marcarLoopPractica(uid, t);
    return;
  }
  est.seek(t);
  // v3.202: flash de feedback en el punto tocado (ver dibujo en
  // dibujarWaveform) — se programa un redibujado a los 320ms para que
  // el flash desaparezca solo aunque esté en pausa (sin eso, con el
  // audio detenido nada vuelve a llamar a dibujarWaveform y el círculo
  // quedaría dibujado para siempre en vez de desvanecerse).
  est.waveformFlashClick = t;
  est.waveformFlashClickHasta = performance.now() + 300;
  clearTimeout(est.waveformFlashClickTimeout);
  est.waveformFlashClickTimeout = setTimeout(() => {
    dibujarWaveform(uid, est.getTiempoActual ? est.getTiempoActual() : t);
  }, 320);
  dibujarWaveform(uid, t);
}
// v3.135: arma/desarma el modo "marcar tiempo 1 con el próximo click en
// la onda" — separado del click normal (seek) para no volver
// ambiguo el gesto de tocar la onda, que ya se usa para saltar y para
// cerrar un loop a medio marcar.
function toggleArmarMarcarInicioWaveform(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.marcandoInicioClick = !est.marcandoInicioClick;
  const btn = document.getElementById('marcarinicioclick-' + uid);
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(btn) btn.classList.toggle('activo', est.marcandoInicioClick);
  if(canvas) canvas.classList.toggle('practica-waveform-armado', est.marcandoInicioClick);
}

// v3.138: (a pedido) CUE de reproducción — independiente del offset de
// arriba. "📍 Marcar CUE aquí" marca en el segundo donde está la
// reproducción AHORA MISMO (mismo patrón que marcarOffsetLocalPractica,
// pero sobre cuePlayback en vez de offsetLocalDelta).
function marcarCuePractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.cuePlayback = est.getTiempoActual();
  dibujarWaveform(uid, est.getTiempoActual());
}
// v3.138: "📍 CUE con click en la onda" — arma/desarma el modo (mismo
// patrón que toggleArmarMarcarInicioWaveform), y el próximo click en la
// onda (ver seekWaveformClick) fija el CUE exactamente ahí.
function toggleArmarCueWaveform(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.marcandoCueClick = !est.marcandoCueClick;
  const btn = document.getElementById('cueclickbtn-' + uid);
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(btn) btn.classList.toggle('activo', est.marcandoCueClick);
  if(canvas) canvas.classList.toggle('practica-waveform-armado-cue', est.marcandoCueClick);
}
// v3.138: "✕ Quitar CUE" — vuelve a null; el play arranca de nuevo
// desde el offset efectivo normal (ver togglePlayPractica) y la línea
// rosa desaparece del waveform.
function quitarCuePractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.cuePlayback = null;
  dibujarWaveform(uid, est.getTiempoActual());
}

// (a pedido) "cuadrar el comienzo" del archivo local: en vez de solo
// tantear con ± manuales, se puede tocar el archivo, esperar a
// escuchar el primer golpe real, y tocar este botón justo ahí — el
// tiempo de reproducción actual pasa a ser el nuevo punto cero
// (offsetLocalDelta se calcula para que ese instante caiga exacto en
// offset efectivo = tiempo actual). Después se puede afinar con los
// botones ± de 0.05s si quedó un poco corrido.
// (a pedido) detección automática del primer transiente — YA NO se
// dispara sola al cargar el archivo (se probó así y costaba más
// cuadrar el resultado que a mano); ahora es un botón aparte que el
// músico toca cuando quiere. Decodifica el archivo con la Web Audio
// API (sin reproducirlo) para leer las muestras crudas, y busca la
// primera ventana de ~15ms cuya energía (RMS) supera un umbral relativo
// al pico de volumen real de la canción — ese salto es el primer golpe.
// Con intros de ataque nítido (percusión, kick) esto puede ser más
// preciso que el tap manual, porque no depende del tiempo de reacción
// humano — pero con fade-ins o pads sin ataque puede fallar, por eso
// NUNCA reemplaza el tap/± manual: solo los deja pre-cargados como
// punto de partida, y el músico corrige si hace falta.
// `file` es opcional — si no se pasa (caso normal, botón del panel),
// usa el File guardado en onArchivoLocalElegido (est.archivoLocalFile).
// `limiteSegundos` acota cuánto del archivo se analiza — 45s por
// defecto (cubre casi cualquier intro real sin recorrer la canción
// entera); null = sin límite, usado por "Buscar más allá".
async function detectarOffsetAutomaticoPractica(uid, file, limiteSegundos = 45){
  const info = document.getElementById('offsetlocalauto-' + uid);
  const btnBuscarMas = document.getElementById('offsetlocalbuscarmas-' + uid);
  const est0 = estadoPractica[uid];
  const archivo = file || (est0 && est0.archivoLocalFile);
  if(!archivo){
    if(info) info.textContent = 'No hay archivo cargado todavía.';
    return;
  }
  if(info) info.textContent = 'Analizando el audio para detectar el primer golpe…';
  try{
    const arrayBuffer = await archivo.arrayBuffer();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) throw new Error('sin Web Audio API');
    const ctx = new Ctx();
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    const data = audioBuffer.getChannelData(0);
    const sampleRate = audioBuffer.sampleRate;
    const maxSamples = limiteSegundos ? Math.min(data.length, sampleRate * limiteSegundos) : data.length;
    // (corregido) el umbral original asumía silencio real en los
    // primeros ~150ms para medir un "piso de ruido" — si el beat entra
    // justo en el segundo 0 (como reportado), esa ventana mide el beat
    // mismo, no ruido, y el umbral quedaba tan alto que nada lo cruzaba
    // nunca. Ahora se compara contra el PICO real de la canción (dentro
    // del rango analizado), que funciona igual haya o no silencio
    // antes del golpe.
    let pico = 0;
    for(let i = 0; i < maxSamples; i++){
      const a = Math.abs(data[i]);
      if(a > pico) pico = a;
    }
    const umbral = Math.max(pico * 0.3, 0.01);
    const ventanaSamples = Math.max(1, Math.floor(sampleRate * 0.015));
    let transienteSample = -1;
    for(let i = 0; i < maxSamples; i += ventanaSamples){
      const fin = Math.min(i + ventanaSamples, maxSamples);
      let sum = 0;
      for(let j = i; j < fin; j++) sum += data[j] * data[j];
      const rms = Math.sqrt(sum / (fin - i));
      if(rms > umbral){ transienteSample = i; break; }
    }
    if(ctx.close) ctx.close();
    const est = estadoPractica[uid];
    if(!est){ return; }
    if(transienteSample < 0){
      if(info){
        info.textContent = limiteSegundos
          ? `No se detectó un golpe claro en los primeros ${limiteSegundos}s — puede ser una intro más larga, o sin ataque nítido. Marcá el tiempo 1 a mano abajo, o probá "Buscar más allá".`
          : 'No se detectó un golpe claro en todo el archivo — es una intro sin ataque nítido (fade-in, pad). Marcá el tiempo 1 a mano abajo.';
      }
      // (a pedido) solo se ofrece "buscar más allá" si esta pasada
      // tenía límite — si ya buscó sin límite y no encontró nada, no
      // hay "más allá" a donde ir.
      if(btnBuscarMas) btnBuscarMas.style.display = limiteSegundos ? 'block' : 'none';
      return;
    }
    if(btnBuscarMas) btnBuscarMas.style.display = 'none';
    const segundos = transienteSample / sampleRate;
    fijarOffsetLocalDeltaPractica(uid, segundos - (est.offset || 0));
    actualizarUIOffsetLocalPractica(uid);
    // v3.222: esta ruta no repintaba — ahora que también mueve secciones, sí
    if(est.getTiempoActual){
      actualizarContadorPractica(uid, est.getTiempoActual());
      dibujarWaveform(uid, est.getTiempoActual());
    }
    if(info) info.textContent = `Golpe inicial detectado en ${segundos.toFixed(2)}s — ajustalo abajo si no quedó exacto.`;
    guardarOffsetLocalEnStorage(uid); // v3.28
  }catch(e){
    if(info) info.textContent = 'No se pudo analizar el audio automáticamente — marcá el tiempo 1 a mano abajo.';
    if(btnBuscarMas) btnBuscarMas.style.display = 'none';
  }
}

// (a pedido) reintenta la detección SIN límite de tiempo (todo el
// archivo), reutilizando el File guardado en onArchivoLocalElegido —
// así el músico no tiene que volver a elegir el archivo del dispositivo.
function buscarMasAllaOffsetPractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.archivoLocalFile) return;
  const info = document.getElementById('offsetlocalauto-' + uid);
  if(info) info.textContent = 'Analizando todo el archivo… puede tardar un poco más.';
  detectarOffsetAutomaticoPractica(uid, est.archivoLocalFile, null);
}

// (a pedido) "por si la intro es suave": deja escuchar desde antes del
// punto detectado (o desde el principio absoluto) SIN perder el offset
// ya calculado — actualizarContadorPractica ya deja el contador
// congelado en "compás 1" mientras tiempoActual < offset (tRel se
// clampea a 0), así que no hace falta lógica extra: simplemente
// rebobina, y el conteo arranca solo, exacto, cuando el playback llega
// al punto marcado como tiempo 1.
function reproducirDesdeInicioPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.seek(0);
}

// (a pedido) el offset resuelve el desfase inicial — este botón lo usa
// como punto de referencia: al tocarlo justo en el tiempo 1 real,
// offsetLocalDelta se calcula para que ESE instante caiga exacto en el
// offset efectivo. Después se puede afinar con los botones ± de 0.05s
// si quedó un poco corrido.
function marcarOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const actual = est.getTiempoActual();
  fijarOffsetLocalDeltaPractica(uid, actual - (est.offset || 0));
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, actual);
  dibujarWaveform(uid, actual);
  guardarOffsetLocalEnStorage(uid); // v3.28
}

// v3.222: (a pedido, portado de ensayo.html v3.244) "offset de audio detectado"
// (‹ ›) y en general cualquier cambio de offset: las secciones no se
// reajustaban. Con archivo local cargado las secciones que se ven son las
// LOCALES (est.seccionesLocales), y esas no las movía el desplazamiento de
// seccionesRuntimeDe (que solo aplica a las del TEMA sin archivo local).
// Ahora TODOS los cambios de offset pasan por acá: se asigna offsetLocalDelta
// y las secciones locales se mueven el mismo paso (desde/hasta), quedando
// siempre en las coordenadas del offset vigente — así las funciones que las
// leen o editan (mapa, waveform, contador, ✏ por compás/tiempo) no cambian.
// Cada sección conserva su distancia al offset (su posición en compases).
// Se guardan enseguida (guardarSeccionesLocalEnStorage, localStorage por
// archivo). Es reversible: ↺ o el paso contrario las devuelve. Redondeo a
// 0.1 ms para no arrastrar ruido de coma flotante; sin recorte en 0 para que
// el movimiento siga siendo simétrico.
function fijarOffsetLocalDeltaPractica(uid, nuevoDelta){
  const est = estadoPractica[uid];
  if(!est) return;
  const anterior = est.offsetLocalDelta || 0;
  const paso = nuevoDelta - anterior;
  est.offsetLocalDelta = nuevoDelta;
  const locales = est.seccionesLocales;
  if(!paso || !est.archivoLocalUrl || !Array.isArray(locales) || !locales.length) return;
  const r4 = x => Math.round(x * 10000) / 10000;
  locales.forEach(s => {
    if(typeof s.desdeSegundos === 'number') s.desdeSegundos = r4(s.desdeSegundos + paso);
    if(typeof s.hastaSegundos === 'number') s.hastaSegundos = r4(s.hastaSegundos + paso);
  });
  if(typeof est.seccionDesactivadaSegundos === 'number') est.seccionDesactivadaSegundos = r4(est.seccionDesactivadaSegundos + paso);
  // los ids del DOM (chip-/mapabloque-) llevan el desde de cada sección: al
  // moverse hay que rearmar el mapa y la lista, y soltar la clave activa
  // vieja para que el próximo tick vuelva a marcar la etiqueta.
  est.ultimaSeccionChip = null;
  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  guardarSeccionesLocalEnStorage(uid);
}

function ajustarOffsetLocalPractica(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  fijarOffsetLocalDeltaPractica(uid, (est.offsetLocalDelta || 0) + delta);
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, est.getTiempoActual());
  dibujarWaveform(uid, est.getTiempoActual());
  guardarOffsetLocalEnStorage(uid); // v3.28
}

function restablecerOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  fijarOffsetLocalDeltaPractica(uid, 0);
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, est.getTiempoActual());
  dibujarWaveform(uid, est.getTiempoActual());
  guardarOffsetLocalEnStorage(uid); // v3.28 — guarda el 0, pisando el ajuste anterior
}

// (a pedido) fijar el offset por valor exacto en vez de solo a los
// empujones con ±  — toma el número tal cual del input y lo aplica como
// offsetLocalDelta absoluto (no sumado al que había).
function fijarOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  const input = document.getElementById('offsetlocalinput-' + uid);
  if(!est || !input) return;
  const valor = parseFloat(input.value);
  if(isNaN(valor)) return;
  fijarOffsetLocalDeltaPractica(uid, valor);
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, est.getTiempoActual());
  dibujarWaveform(uid, est.getTiempoActual());
  guardarOffsetLocalEnStorage(uid); // v3.28
}

function actualizarUIOffsetLocalPractica(uid){
  const est = estadoPractica[uid];
  const el = document.getElementById('offsetlocalval-' + uid);
  if(!est || !el) return;
  const d = est.offsetLocalDelta || 0;
  el.textContent = (d >= 0 ? '+' : '') + d.toFixed(2) + 's';
  // v3.208: (a pedido, "poner las flechitas al mismo nivel que los
  // botones de seguir reproducción") habilita/deshabilita ◀▶ según si
  // hay un transitorio detectado en esa dirección desde el offset
  // actual. Se hace acá porque actualizarUIOffsetLocalPractica ya se
  // llama desde TODOS los caminos que cambian el offset (🔍
  // automático, 🖱 click, botones numéricos, y ahora también ◀▶) —
  // así queda sincronizado sin duplicar esta lógica en cada uno.
  const btnPrev = document.getElementById('offsetprevtrans-' + uid);
  const btnNext = document.getElementById('offsetnexttrans-' + uid);
  if(btnPrev || btnNext){
    const trans = est.waveformTransientes;
    const actual = (est.offset || 0) + d;
    const hayPrev = !!(trans && trans.some(t => t < actual - 0.005));
    const hayNext = !!(trans && trans.some(t => t > actual + 0.005));
    if(btnPrev) btnPrev.disabled = !hayPrev;
    if(btnNext) btnNext.disabled = !hayNext;
  }
}

// v3.208: (a pedido) "poner unas flechitas para mover la banderita del
// 1er tiempo de snap en snap" — recorre est.waveformTransientes (ver
// calcularTransientesDesdeBuffer, v3.207) en orden, moviendo el offset
// EXACTO al golpe anterior/siguiente respecto al offset actual. No da
// la vuelta al otro extremo (si ya está en el primero/último detectado
// hacia ese lado, no hace nada — el botón queda deshabilitado en ese
// caso, ver actualizarUIOffsetLocalPractica de arriba).
function navegarTransienteOffsetPractica(uid, direccion){
  const est = estadoPractica[uid];
  if(!est || !est.waveformTransientes || !est.waveformTransientes.length) return;
  const actual = (est.offset || 0) + (est.offsetLocalDelta || 0);
  const trans = est.waveformTransientes;
  let candidato = null;
  if(direccion > 0){
    candidato = trans.find(t => t > actual + 0.005);
  }else{
    for(let i = trans.length - 1; i >= 0; i--){
      if(trans[i] < actual - 0.005){ candidato = trans[i]; break; }
    }
  }
  if(candidato == null) return;
  fijarOffsetLocalDeltaPractica(uid, candidato - (est.offset || 0));
  actualizarUIOffsetLocalPractica(uid);
  actualizarContadorPractica(uid, est.getTiempoActual());
  dibujarWaveform(uid, est.getTiempoActual());
  guardarOffsetLocalEnStorage(uid);
  const infoSnap = document.getElementById('offsetlocalauto-' + uid);
  if(infoSnap) infoSnap.textContent = `Offset movido al golpe en ${candidato.toFixed(2)}s.`;
}

// v3.28: (a pedido) recordar el offset local por archivo, SOLO en este
// navegador (localStorage) — no toca Firebase ni el offset oficial del
// tema. Sirve para no tener que recalibrar cada vez que se vuelve a
// cargar el MISMO archivo de práctica del dispositivo. Se identifica
// el archivo por nombre + tamaño en bytes (no por contenido real) —
// suficiente para no confundir dos archivos distintos, sin el costo de
// calcular un hash.
function claveOffsetLocalStorage(archivo){
  if(!archivo) return null;
  return 'offsetLocal:' + archivo.name + ':' + archivo.size;
}
function guardarOffsetLocalEnStorage(uid){
  const est = estadoPractica[uid];
  if(!est || !est.archivoLocalFile) return;
  const clave = claveOffsetLocalStorage(est.archivoLocalFile);
  if(!clave) return;
  try{ localStorage.setItem(clave, String(est.offsetLocalDelta || 0)); }
  catch(e){ /* localStorage puede fallar (privado/lleno) — no es crítico, se ignora */ }
}
function cargarOffsetLocalDeStorage(archivo){
  const clave = claveOffsetLocalStorage(archivo);
  if(!clave) return null;
  try{
    const guardado = localStorage.getItem(clave);
    if(guardado === null) return null;
    const valor = parseFloat(guardado);
    return isNaN(valor) ? null : valor;
  }catch(e){ return null; }
}

// v3.174: (a pedido) "secciones locales propias" — pendiente que quedó
// anotado desde v3.163: con archivo local cargado, las secciones del
// TEMA (Firebase) se ignoran porque están calibradas en segundos
// contra la maqueta oficial y casi nunca calzan con un archivo
// distinto (ver seccionesRuntimeDe). Esto NO reemplaza esa decisión —
// le da al músico su propio set de marcadores para el archivo local,
// anclados al reloj de ESE archivo. Mismo patrón de persistencia que
// el offset (claveOffsetLocalStorage): identificado por nombre+tamaño
// del archivo, solo en este navegador, nunca toca Firebase/Firestore.
// Estructura de cada sección: {nombre, desdeSegundos, hastaSegundos}
// — hastaSegundos es opcional (undefined = termina donde arranca la
// siguiente, mismo criterio que ya usan mapaSeccionesHtml/
// recorrerTramosMusico con las secciones del tema).
function claveSeccionesLocalStorage(archivo){
  if(!archivo) return null;
  return 'seccionesLocal:' + archivo.name + ':' + archivo.size;
}
function guardarSeccionesLocalEnStorage(uid){
  const est = estadoPractica[uid];
  if(!est || !est.archivoLocalFile) return;
  const clave = claveSeccionesLocalStorage(est.archivoLocalFile);
  if(!clave) return;
  try{ localStorage.setItem(clave, JSON.stringify(est.seccionesLocales || [])); }
  catch(e){ /* localStorage puede fallar (privado/lleno) — no es crítico, se ignora */ }
}
function cargarSeccionesLocalDeStorage(archivo){
  const clave = claveSeccionesLocalStorage(archivo);
  if(!clave) return null;
  try{
    const guardado = localStorage.getItem(clave);
    if(guardado === null) return null;
    const lista = JSON.parse(guardado);
    return Array.isArray(lista) ? lista : null;
  }catch(e){ return null; }
}
// Refresca el mapa de estructura (mismo bloque visual que ya usan las
// secciones del tema, mapaSeccionesHtml) con las secciones vigentes
// (seccionesRuntimeDe ya devuelve las locales si hay archivo local).
function actualizarMapaEstructuraPractica(uid){
  const est = estadoPractica[uid];
  const wrap = document.getElementById('mapaestructurawrap-' + uid);
  if(!est || !wrap) return;
  const secciones = seccionesRuntimeDe(est).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const bpm = est.bpmEfectivo || est.bpm; // v3.177: idem fix de secPerBarLocalPractica
  wrap.innerHTML = mapaSeccionesHtml(uid, secciones, bpm, compasEfectivoDe(est));
}
// v3.175: (a pedido) "lo más parecido posible" al módulo ⏱ Tiempo del
// editor de secciones del staff (guia-practica.html): Desde/Hasta
// editables tanto por Nº de compás como por minuto:segundo (se
// mantienen sincronizados entre sí), presets rápidos de duración
// (x1..x64) y un indicador de "→ N compases". A diferencia del staff
// (que tiene varios tramos con compás propio por sección,
// compasOverride, vamp/origen, etc.), acá es más simple: un solo
// BPM/compás efectivo para todo el archivo local (est.bpmOverride||
// est.bpm, compasEfectivoDe(est)) y offset = est.offsetLocalDelta —
// alcanza porque estas secciones son propias de UN archivo, no de un
// tema con varias maquetas.
// v3.177: FIX — usaba est.bpmOverride||est.bpm, pero el BPM real que
// usa la regla de compases del waveform (dibujarWaveform, bpmParaTicks)
// y el resto del motor (loop, metrónomo) es est.bpmEfectivo||est.bpm
// — bpmEfectivo ya incluye el ajuste fino/tap-tempo, no solo el
// override crudo. Por eso los presets (x4, etc.) no coincidían con
// los compases reales marcados sobre la onda.
function secPerBarLocalPractica(est){
  const bpm = est.bpmEfectivo || est.bpm;
  const compases = compasEfectivoDe(est);
  return (bpm && compases) ? (60 / bpm) * compases : 0;
}
// v3.176: FIX — usaba solo est.offsetLocalDelta como punto de compás 1,
// pero el offset real de "comienzo de canción" en TODO el resto del
// archivo (metrónomo, click, contador, ticks del waveform, loop —
// ver offsetEfectivo en dibujarWaveform/recorrerTramosMusico/etc.) es
// offset + offsetLocalDelta: offsetLocalDelta es solo el AJUSTE que
// se suma sobre est.offset (el offset oficial del tema), no un
// reemplazo. Por eso el compás 1 marcado acá no coincidía con el "Set
// de 1er tiempo manual" ya calibrado en el panel de arriba.
function compasDeSegundosLocalPractica(seg, est){
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return 1;
  const offsetEfectivo = (est.offset || 0) + (est.offsetLocalDelta || 0);
  return Math.max(1, Math.round(((seg || 0) - offsetEfectivo) / secPerBar) + 1);
}
function segundosDeCompasLocalPractica(compasNum, est){
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return 0;
  const offsetEfectivo = (est.offset || 0) + (est.offsetLocalDelta || 0);
  return Math.max(0, offsetEfectivo + (compasNum - 1) * secPerBar);
}
// Mismo criterio que textoIndicadorDuracionSeccion() del staff, pero
// sin vamp/origen (no aplica a secciones locales).
function textoIndicadorDuracionSeccionLocal(s, est){
  if(s.hastaSegundos == null) return '';
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return '';
  const d = compasDeSegundosLocalPractica(s.hastaSegundos, est) - compasDeSegundosLocalPractica(s.desdeSegundos || 0, est);
  return d > 0 ? `→ ${d} compás${d === 1 ? '' : 'es'}` : '';
}
function esPresetHastaActivoLocal(s, n, est){
  if(s.hastaSegundos == null) return false;
  const secPerBar = secPerBarLocalPractica(est);
  if(!secPerBar) return false;
  const esperado = (s.desdeSegundos || 0) + n * secPerBar;
  return Math.abs(s.hastaSegundos - esperado) < 0.01;
}
// Redibuja la lista editable (mismos campos que el sub-bloque ⏱ Tiempo
// del staff: Desde compás/tiempo, Hasta compás/tiempo opcional,
// presets, ↺, indicador de duración) del panel de Configuración. Se
// llama después de cualquier alta/baja/edición, y también refresca el
// mapa de arriba y el waveform (las líneas de sección del canvas leen
// seccionesRuntimeDe en cada redibujo, así que ya se actualizan solas
// al llamar dibujarWaveform).
function actualizarListaSeccionesLocalesPractica(uid){
  const est = estadoPractica[uid];
  const cont = document.getElementById('seccioneslocaleslista-' + uid);
  if(!est || !cont) return;
  const lista = (est.seccionesLocales || []);
  const ordenIdx = lista.map((s, i) => i).sort((a,b) => (lista[a].desdeSegundos||0) - (lista[b].desdeSegundos||0));
  // v3.180: (a pedido) "dejalas como header colapsables (igual que en
  // staff)" — mismo patrón que .seccion-card/.seccion-card-header de
  // guia-practica.html: punto de color + nombre + rango de tiempo +
  // 🗑 + flecha ▸/▾, clickeable, cuerpo oculto por defecto. El estado
  // colapsado/abierto es SOLO de UI (est.seccionesLocalesColapso,
  // nunca se guarda en localStorage junto con las secciones) — mismo
  // criterio que _colapsada en el staff, que tampoco viaja a Firebase.
  est.seccionesLocalesColapso = est.seccionesLocalesColapso || {};
  cont.innerHTML = ordenIdx.map(i => {
    const s = lista[i];
    const indicador = textoIndicadorDuracionSeccionLocal(s, est);
    const colapsada = est.seccionesLocalesColapso[i] !== false;
    const color = colorDeSeccionEnLista(lista, i);
    const rangoTxt = segundosATextoPractica(s.desdeSegundos || 0) + ' (c.' + compasDeSegundosLocalPractica(s.desdeSegundos || 0, est) + ')' +
      (s.hastaSegundos != null ? ' – ' + segundosATextoPractica(s.hastaSegundos) + ' (c.' + (compasDeSegundosLocalPractica(s.hastaSegundos, est) - 1) + ')' : '');
    return `<div class="practica-seccion-local-card">
      <div class="practica-seccion-local-header" onclick="toggleColapsoSeccionLocal('${uid}', ${i})">
        <span class="practica-seccion-local-header-color" style="background:${color}"></span>
        <span class="practica-seccion-local-header-nombre">${escapeHtml(s.nombre || 'Sin nombre')}</span>
        <span class="practica-seccion-local-header-tiempo">${rangoTxt}</span>
        <button class="practica-click-btn" onclick="event.stopPropagation(); eliminarSeccionLocalPractica('${uid}', ${i})" title="Eliminar sección">🗑</button>
        <span class="practica-seccion-local-header-flecha">${colapsada ? '▸' : '▾'}</span>
      </div>
      <div class="practica-seccion-local-body" style="${colapsada ? 'display:none;' : ''}">
        <div class="practica-seccion-local-fila">
          <input type="text" class="practica-offsetlocal-input" value="${escapeHtml(s.nombre || '')}" placeholder="Nombre de la sección" onchange="renombrarSeccionLocalPractica('${uid}', ${i}, this.value)">
        </div>
        <div class="practica-seccion-local-campos">
          <div class="practica-seccion-local-campo">
            <label>Desde (compás)</label>

// (a pedido) tap-tempo de varios golpes en vez de un solo click — un
// solo click contra un punto lejano ya daba buena precisión, pero
// depende de acertar exacto en UN instante; el tiempo de reacción
// humano (~50-150ms) pesa entero en ese único punto. Tocando un tap
// por cada tiempo 1 que se escucha, el ruido de reacción de cada tap
// es más o menos aleatorio e independiente del de los demás — al medir
// TODOS los compases entre el primer y el último tap de una sola vez
// (no promediando BPMs parciales, que arrastrarían el ruido de cada
// intervalo corto) el error de reacción se diluye entre el tiempo
// total, no entre cada tap individual. Cuenta de compases por
// intervalo: se redondea delta/secPerBarGuia (usando el BPM efectivo
// ANTES de esta calibración como guía) — funciona mientras el error de
// tempo real no sea tan grande como para desviar el redondeo a un
// compás equivocado, que es justo el caso típico (diferencias de
// decimales de BPM, no de BPMs enteros distintos).
function tapCalibracionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(!est.calibTaps) est.calibTaps = [];
  est.calibTaps.push(est.getTiempoActual());
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = `Taps: ${est.calibTaps.length}`;
}

function reiniciarTapCalibracionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.calibTaps = [];
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = 'Taps: 0';
  const info = document.getElementById('offsetlocalbpminfo-' + uid);
  if(info) info.textContent = '';
}

function calcularBpmTapsPractica(uid){
  const est = estadoPractica[uid];
  const info = document.getElementById('offsetlocalbpminfo-' + uid);
  if(!est) return;
  const taps = (est.calibTaps || []).slice().sort((a, b) => a - b);
  if(taps.length < 3){
    if(info) info.textContent = 'Necesitás al menos 3 taps (uno por cada tiempo 1 que escuches) — con más taps y más separados, más preciso.';
    return;
  }
  const secPerBarGuia = (60 / est.bpmEfectivo) * compasEfectivoDe(est);
  let totalBars = 0;
  for(let i = 1; i < taps.length; i++){
    const delta = taps[i] - taps[i - 1];
    const bars = Math.round(delta / secPerBarGuia);
    if(bars >= 1) totalBars += bars;
  }
  const totalTime = taps[taps.length - 1] - taps[0];
  if(totalBars < 1 || totalTime <= 0){
    if(info) info.textContent = 'No se pudo calcular — probá de nuevo, un tap por cada tiempo 1 (no cada tiempo suelto).';
    return;
  }
  const secPerBarReal = totalTime / totalBars;
  const bpmReal = Math.round(((60 * compasEfectivoDe(est)) / secPerBarReal) * 100) / 100;
  est.bpmOverride = Math.max(30, Math.min(300, bpmReal));
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  if(info) info.textContent = `BPM ajustado a ${est.bpmOverride.toFixed(2)} (${taps.length} taps, ${totalBars} compases medidos)`;
  est.calibTaps = [];
  const el = document.getElementById('taplabel-' + uid);
  if(el) el.textContent = 'Taps: 0';
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

// (a pedido) ajuste fino del BPM calculado por tap — el ± del panel
// general es de 5 en 5 (pensado para ajustes gruesos) y su slider
// redondea a enteros, así que tocarlos ahí borraría la precisión
// decimal que dio el tap. Este control opera directo sobre
// est.bpmOverride con pasos de 0.5/0.05, y sí actualiza el slider/badge
// del panel general (actualizarUIAjustesPractica) para que no queden
// desincronizados entre sí — solo que sin pasar por su redondeo.
function ajustarBpmFinoPractica(uid, delta){
  const est = estadoPractica[uid];
  if(!est) return;
  const base = est.bpmOverride || est.bpm;
  est.bpmOverride = Math.round(Math.max(30, Math.min(300, base + delta)) * 100) / 100;
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  actualizarUIBpmLocalPractica(uid);
  mostrarGuardadoBpmFino(uid);
}

// v3.16: feedback breve "✓ guardado" junto al valor de BPM — solo para

// (a pedido) entrenador de velocidad — solo aplica al <audio> local
// (audioLocal.playbackRate), no afecta el grid del metrónomo para
// nada: nuestro reloj lee audioLocal.currentTime, que siempre
// representa la posición REAL dentro del archivo sin importar a qué
// velocidad se reproduce, así que el semáforo/clave/click siguen
// exactos a cualquier velocidad sin tocar ni una línea de esa lógica.
// Rango 50%-120%, pasos de 5%. preservesPitch ya se activó al cargar
// el archivo (ver onArchivoLocalElegido) para que sonar más lento no
// suene grave, solo lento.
// v3.191: (a pedido, portado de ensayo.html v3.202.2) el control pasa
// de % a BPM objetivo — el usuario piensa en "quiero que suene a X
// BPM", no en porcentaje. bpmBase es el tempo real del tema
// (est.bpmEfectivo||est.bpm, el mismo valor que usa todo el resto del
// motor); la velocidad sigue siendo bpmObjetivo/bpmBase, mismo clamp
// 50%-120% de siempre. Reemplaza el control por %, no queda alterno.
function bpmBaseVelocidadPractica(est){
  return est.bpmEfectivo || est.bpm || 0;
}
function aplicarVelocidadBpmPractica(uid, bpmObjetivo){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmBase = bpmBaseVelocidadPractica(est);
  if(!bpmBase || !bpmObjetivo || bpmObjetivo <= 0) return;
  const nueva = Math.max(0.5, Math.min(1.2, Math.round((bpmObjetivo / bpmBase) * 100) / 100));
  cambiarVelocidadLocalPractica(uid, nueva);
}
function ajustarVelocidadBpmLocalPractica(uid, deltaBpm){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmBase = bpmBaseVelocidadPractica(est);
  if(!bpmBase) return;
  const bpmActual = bpmBase * (est.velocidadLocal || 1);
  aplicarVelocidadBpmPractica(uid, bpmActual + deltaBpm);
}
function aplicarVelocidadBpmInputPractica(uid){
  const input = document.getElementById('velocidadlocalbpm-' + uid);
  if(!input) return;
  aplicarVelocidadBpmPractica(uid, parseFloat(input.value));
}

function restablecerVelocidadLocalPractica(uid){

// v3.48: a diferencia de antes (que solo tocaba audioLocal.playbackRate),
// ahora la velocidad decide QUÉ MOTOR está sonando: a 100% usa Web Audio
// (loop exacto, pero sin preservesPitch — no lo soporta), a cualquier
// otra velocidad usa el <audio> nativo (preservesPitch real, tono
// correcto; el loop vuelve al mecanismo de vigilar-y-saltar de siempre).
// Si Web Audio no llegó a estar listo (todavía decodificando, o falló),
// est.webAudioPlayerLocal es null y esto simplemente se queda en el
// motor nativo sin romper nada.
function cambiarVelocidadLocalPractica(uid, nueva){
  const est = estadoPractica[uid];
  const audioLocal = document.getElementById('local-' + uid);
  if(!est || !audioLocal) return;
  const anterior = est.velocidadLocal || 1;
  est.velocidadLocal = nueva;
  const el = document.getElementById('velocidadlocalbpm-' + uid);
  if(el){
    const bpmBase = bpmBaseVelocidadPractica(est);
    el.value = bpmBase ? formatBpm(bpmBase * nueva) : '';
  }
  const usabaWebAudio = est.audioActivo === est.webAudioPlayerLocal && !!est.webAudioPlayerLocal;
  const debeUsarWebAudio = (nueva === 1) && !!est.webAudioPlayerLocal;
  if(usabaWebAudio === debeUsarWebAudio){
    // mismo motor de antes — si es el nativo, solo actualiza el rate.
    if(!debeUsarWebAudio) audioLocal.playbackRate = nueva;
    return;
  }
  const tActual = est.getTiempoActual ? est.getTiempoActual() : 0;
  const estabaSonando = est.audioActivo && !est.audioActivo.paused;
  if(est.pause) est.pause();
  if(debeUsarWebAudio){
    conectarMotorLocalPractica(uid, est.webAudioPlayerLocal);
    est.seek(tActual);
    aplicarLoopNativoPractica(uid);
  } else {
    audioLocal.playbackRate = nueva;
    conectarMotorLocalPractica(uid, audioLocal);
    est.seek(tActual);
  }
  if(estabaSonando) est.play();
}

// v3.188: (a pedido, portado de ensayo.html v3.199) limpieza
// centralizada de un estadoPractica[uid] completo — antes acá se
// limpiaban a mano solo 3 de los ~8 timeouts que fue juntando el
// estado con el tiempo (flashTimeoutId, claveNotaFlashTimeoutId,
// claveTickFlashTimeoutId), y NUNCA se cerraba webAudioPlayerLocal al
// reemplazar el estado (solo se cerraba al cambiar de archivo DENTRO
// de la misma sesión, ver onArchivoLocalElegido) — quedaba sonando/
// vivo en memoria si la sesión se re-renderizaba. Se preserva el
// caso especial de YouTube (ytPlayer.destroy()) que ensayo.html no
// tiene. Cualquier handle nuevo (timeout, observer, listener) que se
// agregue a futuro se suma a esta lista y listo.
function destruirEstadoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(est.ytPlayer && typeof est.ytPlayer.destroy === 'function'){
    try{ est.ytPlayer.destroy(); }catch(e){}
  }
  if(est.archivoLocalUrl) URL.revokeObjectURL(est.archivoLocalUrl);
  if(est.webAudioPlayerLocal && typeof est.webAudioPlayerLocal.cerrar === 'function'){
    try{ est.webAudioPlayerLocal.cerrar(); }catch(e){}
  }
  if(est.waveformResizeObserver) est.waveformResizeObserver.disconnect();
  est.waveformRespiroActivo = false;
  clearTimeout(est.waveformRespiroTimeout);
  if(est.filtroHighpass){ try{ est.filtroHighpass.disconnect(); }catch(e){} }
  if(est.filtroLowpass){ try{ est.filtroLowpass.disconnect(); }catch(e){} }
  clearTimeout(est.flashTimeoutId);
  clearTimeout(est.claveNotaFlashTimeoutId);
  clearTimeout(est.claveNotaVisualOnTimeoutId);
  clearTimeout(est.claveTickFlashTimeoutId);
  clearTimeout(est.clavePilotoFlashTimeoutId);
  clearTimeout(est.clavePilotoVisualOnTimeoutId);
  clearTimeout(est.seekManualObjetivoTimeout);
  clearTimeout(est.pendReboteTimeoutId);
  clearTimeout(est.waveformScrollProgTimeout);
  if(est.metroPrecontTimeouts) est.metroPrecontTimeouts.forEach(t => clearTimeout(t));
  delete estadoPractica[uid];
}
function inicializarReproductoresPractica(sesiones){
  sesiones.forEach(s => {
    const temaData = s.temaId ? temaCache[s.temaId] : null;
    if(!temaData || !temaData.practicaBpm || !temaData.practicaCompas) return;
    // v2.2: si no hay maqueta para este instrumento, el bloque igual se
    // renderizó (modo libre) — se arma el mismo estadoPractica[uid]
    // (bpm/compás/clave) pero sin conectar audio/YouTube; getTiempoActual
    // se queda en el default (0) porque toggleMetronomoLibre() alimenta
    // actualizarContadorPractica() directamente con su propio reloj.
    const versionesDeEstaSesion = obtenerMaquetasParaSesion(s);
    const maqueta = versionesDeEstaSesion[0] || null;
    const uid = 'practica-' + s.id;
    const compasesPorBarra = parseInt((temaData.practicaCompas || '4/4').split('/')[0], 10) || 4;

    // v1.8/v3.188: si esta sesión ya tenía estado de una carga anterior
    // (ej. se re-renderizó por un RSVP), se destruye TODO por completo
    // (YT.Player, ObjectURL local, webAudioPlayerLocal, timeouts) antes
    // de reemplazarlo — ver destruirEstadoPractica arriba.
    destruirEstadoPractica(uid);

    // v1.7: estado central de esta sesión — getTiempoActual/seek/pause
    // se conectan más abajo según el tipo de reproductor.
    const secPerBeatInicial = 60 / temaData.practicaBpm;
    const secPerBarInicial = secPerBeatInicial * compasesPorBarra;
    estadoPractica[uid] = {
      bpm: temaData.practicaBpm,
      compasesPorBarra,
      compasTexto: temaData.practicaCompas,
      tonalidad: temaData.practicaTonalidad || '',
      offset: temaData.practicaOffset || 0,
      // (a pedido) ajuste de offset SOLO para archivo cargado del
      // dispositivo — no toca est.offset (el offset real del tema,
      // calibrado para la maqueta oficial de audio/YouTube). Se suma
      // encima de est.offset al calcular tRel (ver actualizarContadorPractica),
      // y se resetea a 0 cada vez que se carga un archivo nuevo
      // (onArchivoLocalElegido) porque cada archivo puede tener su
      // propio silencio inicial. Nunca se persiste ni se manda a
      // Firestore — vive solo en memoria de esta sesión.
      offsetLocalDelta: 0,
      // v3.138: (a pedido) CUE de reproducción — punto donde arranca el
      // play (togglePlayPractica), totalmente independiente del offset
      // de arriba (que solo alinea click/conteo). null = sin CUE, el
      // play arranca desde el offset efectivo normal. Se marca con los
      // botones del reproductor (marcarCuePractica /
      // toggleArmarCueWaveform) y se resetea a null con cada archivo
      // nuevo (onArchivoLocalElegido) o con "✕ Quitar CUE"
      // (quitarCuePractica). Tampoco se persiste ni se manda a
      // Firestore — solo memoria de esta sesión.
      cuePlayback: null,

      anacrusa: !!temaData.practicaAnacrusa,
      loopInicio: null, loopFin: null, loopActivo: false,

      loopSeccionActivo: false,

      // v3.44: pre-conteo del metrónomo libre — activado por defecto,

      precontActivo: false, precontCompases: 1, metroPrecontEnCurso: false, metroPrecontTimeouts: [], precontOmitir: false,

      ultimoBeatVisual: -1,

      claveNotaFlashTimeoutId: null,

      clave: temaData.practicaClave || null,
      claveOnsets: temaData.practicaClave ? construirOnsetsClave(temaData.practicaClave, secPerBeatInicial, secPerBarInicial) : [],
      claveCicloSec: secPerBarInicial * 2,
      // v3.113: (a pedido) clave por sección — se precalcula una vez al

      tieneClaveSeccionAlguna: (temaData.practicaSecciones || []).some(s => (s.claveSeccion || '').trim()),

      ultimoCompasClave: -1,
      // v2.4: ajustes de metrónomo (BPM/clave override, sonido,

      // null y claveOverride undefined significan "usa el valor real

      bpmOverride: null,
      claveOverride: undefined,
      sonidoClick: 'clasico',
      sonidoClave: 'clasico',
      claveActiva: true,
      acentos: acentosPorDefecto(compasesPorBarra),
      // v3.8: acentos por golpe de clave — se inicializan siempre (5
      // golpes fijos, ver acentosClavePorDefecto), aunque este tema no
      // tenga clave; simplemente no se usan hasta que la haya.
      acentosClave: acentosClavePorDefecto(),
      // v2.5: volumen relativo (0-1) de golpe fuerte/normal, calibrable
      // con sliders — antes el acento solo cambiaba el tono (poco
      // audible). Mudo no usa volumen, directamente no suena.
      volFuerte: 1,
      volNormal: 0.55,
      getTiempoActual: () => 0,
      seek: () => {},
      pause: () => {},
      ytPlayer: null,
      archivoLocalUrl: null,
      // v3.56: (a pedido) versiones disponibles de maqueta para este
      // instrumento (ej. "Con bajo"/"Sin bajo") y cuál está activa —
      // ver cambiarVersionMaquetaPractica.
      maquetasVersion: versionesDeEstaSesion,
      maquetaVersionIdx: 0,
      // v3.12: refs de DOM que actualizarContadorPractica() escribe en
      // CADA tick de rAF (hasta 60 veces/segundo) — se resuelven una
      // sola vez acá, al construir el estado, en vez de getElementById
      // repetido por frame. El resto de refs (sección/chips/clave) se
      // tocan solo cuando cambian, no por frame, así que se quedan como

      el: {
        compas: document.getElementById('compas-' + uid),
        dots: Array.from({ length: compasesPorBarra }, (_, i) => document.getElementById('dot-' + uid + '-' + i))
      }
    };
    const est = estadoPractica[uid];
    cargarAjustesGuardados(uid);
    if(est.pendVelocidadOverride) actualizarFiguraPenduloPractica(uid, est.pendVelocidadOverride);
    // v3.150: si se restauró un compasesOverride guardado, el panel de

    if(est.compasesOverride){

  const compasesPorBarra = parseInt((temaData.practicaCompas || '4/4').split('/')[0], 10) || 4;
  // v3.93: (a pedido) organización del flujo — 1) nombre de canción,
  // 2) versiones (con bajo/sin bajo), 3) BPM·compás·clave (badge, ya
  // vive arriba de controlesPracticaHtml), 4) chips de estructura...
  // Antes el título solo mostraba el instrumento (temaData.nombre

  const tituloCancion = `<div class="practica-titulo-cancion">${escapeHtml(temaData.nombre || 'Tema')}</div><div class="practica-titulo-instrumento">${escapeHtml(s.miInstrumento)}</div>`;

  // "Con bajo" / "Sin bajo"), se muestran como chips arriba del
  // reproductor — ver cambiarVersionMaquetaPractica. Con una sola,
  // este bloque queda vacío y todo se comporta igual que siempre.
  const chipsVersiones = versiones.length > 1 ? `
    <div class="practica-version-chips" id="versionchips-${uid}">

  if(maqueta.tipo === 'youtube'){

    return `

      <div class="practica-yt" id="yt-${uid}" style="display:none;"></div>

}

// v1.7: estado por sesión (bpm, compás, offset, secciones, loop, click)
// — getTiempoActual()/seek() abstraen si el reproductor es <audio> o
// YouTube, para que el resto de estas funciones no necesite saberlo.
let estadoPractica = {};

// v3.36: (a pedido) si el celular rota o la ventana cambia de tamaño,
// el ancho real del canvas (canvas.clientWidth, usado por
// dibujarWaveform desde v3.36) cambia con él — sin este listener, el
// waveform quedaba con la resolución vieja hasta el próximo evento
// (play/seek/etc.). Se debounce con requestAnimationFrame para no
// redibujar de más mientras el usuario todavía está arrastrando el
// borde de la ventana o girando el teléfono.
let resizeWaveformsRAF = null;
window.addEventListener('resize', () => {
  if(resizeWaveformsRAF) cancelAnimationFrame(resizeWaveformsRAF);
  resizeWaveformsRAF = requestAnimationFrame(() => {
    Object.keys(estadoPractica).forEach(uid => {
      const est = estadoPractica[uid];
      if(est && est.waveformPeaks && est.getTiempoActual){
        dibujarWaveform(uid, est.getTiempoActual());
      }
    });
  });
});

function segundosATextoPractica(seg){
  seg = Math.max(0, seg || 0);
  const m = Math.floor(seg / 60);
  const s = Math.floor(seg % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// Duración de un compás completo y snap al borde más cercano — mismo
// criterio que segundosPorCompas()/snapASegundoDeCompas() en
// guia-practica.html v1.3, para que loop y secciones queden coherentes.
function snapACompasPractica(seg, bpm, compasesPorBarra, offset){
  offset = offset || 0;
  const secPerBar = (60 / bpm) * compasesPorBarra;
  if(!secPerBar) return seg;
  const n = Math.round((seg - offset) / secPerBar);
  return Math.max(0, offset + n * secPerBar);
}

let audioCtxPractica = null;

// v3.97: (a pedido, "el metrónomo en móvil no es constante") scheduler
// de audio independiente del rAF visual. Antes, cada beep se disparaba
// EN EL MISMO INSTANTE en que actualizarContadorPractica() (llamada
// desde requestAnimationFrame) detectaba el cambio de beat — y rAF no
// tiene garantía de timing: el sistema operativo puede retrasarlo o
// saltarse frames (batería, pantalla, etc.), sobre todo en móvil. En
// escritorio casi no se nota porque rAF es mucho más estable ahí.
// Solución (estándar para metrónomos web, técnica de Chris Wilson/
// Web Audio): un setInterval corto agenda los próximos beeps ~100ms
// hacia adelante usando el reloj de Web Audio (audioCtxPractica.
// currentTime, que corre en el hilo de audio con precisión de
// hardware) en vez de esperar a que rAF "note" que tocaba sonar.
// El rAF/actualizarContadorPractica() sigue intacto para lo VISUAL
// (dots, números, flash de clave) — el jitter ahí no se nota ni se
// oye. Ver bloques removidos en actualizarContadorPractica (click y
// clave) que antes disparaban el beep directamente.
const SCHED_LOOKAHEAD_SEC = 0.1;
const SCHED_INTERVAL_MS = 25;
function schedulerTickGlobalPractica(){
  for(const uid in estadoPractica){
    const est = estadoPractica[uid];
    if(!est) continue;
    const clickOn = !!est.clickActivo;
    const claveOn = est.claveActiva !== false && !!(est.claveEfectiva !== undefined ? est.claveEfectiva : est.clave);
    const libreOn = !!est.metroLibreActivo;
    if(!clickOn && !claveOn && !libreOn) continue;

    if(!audioCtxPractica) audioCtxPractica = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtxPractica.state === 'suspended') audioCtxPractica.resume();

    const bpmEf = est.bpmEfectivo || est.bpm;
    if(!bpmEf) continue;
    const secPerBeat = 60 / bpmEf;
    const offset = (est.offset || 0) + (est.offsetLocalDelta || 0);
    const tiempoActual = libreOn
      ? (performance.now() - est.metroLibreInicio) / 1000
      : (est.getTiempoActual ? est.getTiempoActual() : 0);
    const tRel = Math.max(0, tiempoActual - offset);
    const ahoraCtx = audioCtxPractica.currentTime;
    const ventanaHasta = tRel + SCHED_LOOKAHEAD_SEC;

    // --- pulso normal (click / metrónomo libre) ---
    if(clickOn || libreOn){
      if(est.schedNextBeatIdx == null ||
         Math.abs(est.schedNextBeatIdx * secPerBeat - tRel) > secPerBeat * 1.5){
        // primera vez, o desincronizado (seek/loop/cambio de bpm): resync
        est.schedNextBeatIdx = Math.ceil(tRel / secPerBeat);
      }
      while(est.schedNextBeatIdx * secPerBeat < ventanaHasta){
        const beatTime = est.schedNextBeatIdx * secPerBeat;
        const when = ahoraCtx + (beatTime - tRel);
        const beatEnBarra = ((est.schedNextBeatIdx % est.compasesPorBarra) + est.compasesPorBarra) % est.compasesPorBarra;
        const acento = (est.acentos && est.acentos[beatEnBarra]) || 'normal';
        if(acento !== 'mudo') beepPractica(acento === 'fuerte', est.sonidoClick, acento === 'fuerte' ? est.volFuerte : est.volNormal, false, when);
        est.schedNextBeatIdx++;
      }
    }

    // --- clave ---
    if(claveOn){
      const claveOnsetsEf = est.claveOnsetsEfectivo || est.claveOnsets;
      const claveCicloSecEf = est.claveCicloSecEfectivo || est.claveCicloSec;
      if(claveOnsetsEf && claveOnsetsEf.length && claveCicloSecEf){
        const n = claveOnsetsEf.length;
        const tiempoDeEvento = (g) => {
          const ciclo = Math.floor(g / n);
          const idxLocal = ((g % n) + n) % n;
          return ciclo * claveCicloSecEf + claveOnsetsEf[idxLocal];
        };
        if(est.schedNextClaveIdx == null ||
           Math.abs(tiempoDeEvento(est.schedNextClaveIdx) - tRel) > claveCicloSecEf * 1.5){
          // resync: primer evento con tiempo > tRel
          const cicloIndex = Math.floor(tRel / claveCicloSecEf);
          const tCiclo = tRel - cicloIndex * claveCicloSecEf;
          let nextLocal = claveOnsetsEf.findIndex(o => o > tCiclo);
          est.schedNextClaveIdx = nextLocal === -1 ? (cicloIndex + 1) * n : cicloIndex * n + nextLocal;
        }
        while(tiempoDeEvento(est.schedNextClaveIdx) < ventanaHasta){
          const idxLocal = ((est.schedNextClaveIdx % n) + n) % n;
          const acentoClave = (est.acentosClave && est.acentosClave[idxLocal]) || 'normal';
          if(acentoClave !== 'mudo'){
            const when = ahoraCtx + (tiempoDeEvento(est.schedNextClaveIdx) - tRel);
            beepPractica(acentoClave === 'fuerte', (est.sonidoClave || 'clasico'), acentoClave === 'fuerte' ? est.volFuerte : est.volNormal, false, when);
          }
          est.schedNextClaveIdx++;
        }
      }
    }
  }
}
setInterval(schedulerTickGlobalPractica, SCHED_INTERVAL_MS);
// v2.4: parámetro sonido ('clasico'|'grave'|'woodblock') — solo cambia
// waveform/frecuencias del beep, la lógica de timing no se toca.
// v2.5: parámetro volumen (0 a 1) — antes el "acento" solo cambiaba la
// frecuencia (poco perceptible); ahora también escala el gain real,
// que es lo que hace audible la diferencia entre golpe fuerte/normal.
// v3.72: (a pedido) ícono del botón de metrónomo — antes era texto
// plano (▮/▯), que se ve distinto según la fuente del dispositivo.
// Un SVG inline con currentColor se ve igual en todos lados y hereda
// el color (gris normal / dorado activo) que ya define .practica-click-btn.activo
// en CSS — no requiere archivo externo ni cambia el tamaño del botón.
const ICONO_METRONOMO_SVG = '📏';
// v3.77: (a pedido) contenido del botón de metrónomo con ícono + texto
// "Metro" — reutilizado en toggleClickPractica y actualizarUIAjustesPractica
// para no repetir el markup en dos lugares.
const HTML_BOTON_METRO = `<span class="practica-btn-icono">${ICONO_METRONOMO_SVG}</span><span class="practica-btn-texto">Metro</span>`;

const SONIDOS_CLICK = {
  clasico:   { tipo: 'sine',     fFuerte: 1300, fNormal: 900  },
  grave:     { tipo: 'triangle', fFuerte: 700,  fNormal: 500  },
  woodblock: { tipo: 'square',   fFuerte: 1800, fNormal: 1200 },
  // v3.71: (a pedido) sonido orgánico/real de clave — no es un
  // oscilador de tono puro (sine/triangle/square) como los de arriba,
  // sino ruido blanco filtrado en banda + envolvente corta, que se
  // acerca más al golpe percusivo de dos palos de madera que un tono
  // sostenido. Ver rama 'noise' en beepPractica().
  claveorganica: { tipo: 'noise', fFuerte: 2800, fNormal: 2100 }
};
function beepPractica(fuerte, sonido, volumen, precuenta, when){
  if(!audioCtxPractica) audioCtxPractica = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtxPractica.state === 'suspended') audioCtxPractica.resume();
  const cfg = SONIDOS_CLICK[sonido] || SONIDOS_CLICK.clasico;
  const vol = Math.max(0, Math.min(1, volumen == null ? 1 : volumen));
  if(vol <= 0) return;
  const ctx = audioCtxPractica;
  // v3.97: si viene un instante agendado (scheduler de audio), el beep
  // arranca AHÍ en vez de "ya" — así el timing no depende de cuándo
  // rAF llegó a llamar esta función. Sin `when` (pre-conteo, u otros
  // usos puntuales) se comporta exactamente igual que antes.
  const t0 = when != null ? when : ctx.currentTime;
  // v3.71: rama de síntesis por ruido filtrado (clave orgánica) — no
  // usa oscilador, sino un buffer de ruido blanco corto pasado por un
  // filtro pasa-banda centrado en la frecuencia del acento, con
  // envolvente rápida (ataque instantáneo, decaimiento ~45ms) para
  // imitar el golpe seco de una clave real.
  if(cfg.tipo === 'noise'){
    const dur = 0.045;
    const bufferSize = Math.max(1, Math.round(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.2);
    }
    const noiseSource = ctx.createBufferSource();
    noiseSource.buffer = buffer;
    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = (fuerte ? cfg.fFuerte : cfg.fNormal) * (precuenta ? 1.3 : 1);
    bandpass.Q.value = 7;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.6 * vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noiseSource.connect(bandpass).connect(gain).connect(ctx.destination);
    noiseSource.start(t0);
    noiseSource.stop(t0 + dur);
    return;
  }
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = cfg.tipo;
  // v3.45: (a pedido) el pre-conteo suena más agudo (x1.5) que el click
  // normal, para que se note claramente la diferencia entre "todavía es
  // el conteo" y "ya arrancó de verdad".
  osc.frequency.value = (fuerte ? cfg.fFuerte : cfg.fNormal) * (precuenta ? 1.5 : 1);
  gain.gain.setValueAtTime(0.22 * vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.08);
}

// v1.9: acceso rápido — salta directo al inicio de la sección tocada,
// en el reproductor que esté activo en ese momento (YouTube, audio
// original, o archivo local si ya se cargó uno).
function irASeccionPractica(uid, segundos){
  const est = estadoPractica[uid];
  if(!est) return;
  // v3.50: (a pedido) guia-practica.html calcula 'segundos' solo con el
  // offset OFICIAL (Firebase) — no conoce offsetLocalDelta (la
  // calibración fina por archivo/dispositivo, panel dorado). Si acá
  // hay un offsetLocalDelta distinto de 0, hay que sumarlo para que el
  // salto caiga en el mismo punto real que ya usa el resto de la app
  // (metrónomo, click, contador — todos restan offset+offsetLocalDelta).
  // Sin esto, el contador mostraba un compás distinto al configurado en
  // Secciones apenas se tocaba el chip.
  const segundosReal = segundos + (est.offsetLocalDelta || 0);
  est.seek(segundosReal);
  // v3.47: (a pedido) el margen de tolerancia de v3.42 (para el
  // desfasaje de precisión del seek en archivo local) se estaba
  // aplicando SIEMPRE, incluso durante reproducción normal en curso —
  // eso hacía que cualquier sección "encendiera" 0.25s antes de su
  // límite real. Ahora el margen solo se activa por un instante justo
  // después de un salto manual de sección (acá), cubriendo el evento
  // 'seeked' que llega con el tiempo real (posiblemente impreciso), y
  // se apaga solo después de 800ms — la reproducción normal ya no lo
  // usa, así que el límite vuelve a ser exacto.
  // (seekManualObjetivo sigue guardando el segundo CRUDO, sin sumar
  // offsetLocalDelta — es lo que compara actualizarContadorPractica
  // contra sec.desdeSegundos, también crudo, para saber qué sección fue
  // el objetivo del salto reciente.)
  est.seekManualObjetivo = segundos;
  clearTimeout(est.seekManualObjetivoTimeout);
  est.seekManualObjetivoTimeout = setTimeout(() => { est.seekManualObjetivo = null; }, 800);
  // v3.41: (a pedido) si está en pausa, nada dispara el refresco de UI
  // (chip encendido, barra de progreso, waveform) hasta que se le da
  // play — ahora se fuerza ese refresco acá mismo, así el chip prende
  // y el audio-bar se ubica de una vez, esté sonando o no.
  actualizarContadorPractica(uid, segundosReal);
  dibujarWaveform(uid, segundosReal);
}

// (a pedido) loop automático: mientras está activo, cada vez que el
// playback llega al final de la sección actual (mismo límite finSec que
// ya calcula el bloque de progreso más abajo) vuelve al inicio de ESA
// MISMA sección — si el músico avanza a otra sección (chip o seek
// manual), el loop sigue "la sección actual" en cada momento, no queda
// pegado a la que estaba activa cuando se prendió el botón. Se excluye
// con el loop manual (marcarLoopPractica): activar uno apaga el otro.
function toggleLoopSeccionPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  if(!est.loopSeccionActivo && est.loopActivo) marcarLoopPractica(uid);
  est.loopSeccionActivo = !est.loopSeccionActivo;
  const btn = document.getElementById('loopseccionbtn-' + uid);
  if(btn){
    btn.classList.toggle('activo', est.loopSeccionActivo);
    btn.textContent = est.loopSeccionActivo ? '✕ Cancelar repetición' : '🔁 Repetir sección actual';
  }
  // v3.29: al apagar, borra la franja del waveform que este loop venía
  // dibujando (loopInicio/loopFin se van seteando solo mientras está
  // activo, ver actualizarContadorPractica). Al encender no hace falta
  // nada acá — se setean solos en el próximo tick.
  if(!est.loopSeccionActivo){
    est.loopInicio = null; est.loopFin = null;
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
  }
}

// v3.84: (a pedido, Fase 3) muestra/oculta el panel de cifrado/letra de
// la sección activa — el botón solo aparece (display, ver
// actualizarContadorPractica) cuando la sección tiene datos de cifrado.
// El contenido del panel se arma/actualiza aparte, en
// actualizarLineaCifradoPractica(); acá solo se abre/cierra, sin
// recalcular nada.
// v3.85: (a pedido) exporta la estructura de ESTA sesión a PDF, mismo
// formato real/latin book (cajas de compás, 4 por línea) que ya arma
// guia-practica.html — mismo código adaptado para leer de `est` (bpm/
// compasesPorBarra/secciones/clave/temaNombre) en vez de los inputs del
// panel de staff. Los datos (acordesPorCompas/letraPorCompas,
// acordesCiclo/letraCiclo) son los mismos que ya carga el staff, sin
// duplicar nada. 100% en el navegador (jsPDF por CDN), sin backend.
function exportarEstructuraPracticaPDF(uid){
  const est = estadoPractica[uid];
  if(!est){ return; }
  if(!est.secciones || !est.secciones.length){ alert('Este tema no tiene secciones cargadas todavía.'); return; }

  // v3.100: mismo cálculo de duración que ya usaba este archivo (secPerBar
  // a partir de bpm/compasesPorBarra, fin = hastaSegundos manual o el
  // desdeSegundos de la próxima sección) — es lo único que de verdad
  // difiere de guia-practica.html (que usa duracionCompasesSeccion, basado
  // solo en hastaSegundos manual, sin caer a la próxima sección). El
  // dibujo (dibujarCajas/dibujarCajaBreak/letra de ensayo/D.C./coda/barra
  // de repetición) vive en pdf-estructura.js, compartido con el staff.
  const secPerBar = est.bpm ? (60 / est.bpm) * est.compasesPorBarra : 0;
  const claveTxt = est.clave ? (CLAVE_ETIQUETAS[est.clave] || est.clave) : null;

  const secciones = est.secciones.slice().sort((a, b) => (a.desdeSegundos || 0) - (b.desdeSegundos || 0));
  const seccionesParaPDF = secciones.map((s, i) => {
    let duracion = null;
    if(s.tipo !== 'vamp'){
      const siguiente = secciones[i+1] || null;
      const finSec = (s.hastaSegundos != null) ? s.hastaSegundos : (siguiente ? siguiente.desdeSegundos : null);
      duracion = (secPerBar > 0 && finSec != null) ? Math.max(1, Math.round((finSec - (s.desdeSegundos||0)) / secPerBar)) : null;
    }
    return Object.assign({}, s, {
      duracion: duracion,
      color: colorDeSeccionEnLista(secciones, i)
    });
  });

  generarEstructuraPDF({
    temaNombre: est.temaNombre || 'Tema',
    bpm: est.bpm || '—',
    compasTexto: est.compasTexto || '4/4',
    claveTxt: claveTxt,
    secciones: seccionesParaPDF
  });
}

// v3.84.1: (a pedido, Fase 3) sincroniza el panel de letra/acordes con
// el compás actual, reusando los datos que YA carga el staff en
// guia-practica.html (acordesPorCompas/letraPorCompas en secciones
// fijas, acordesCiclo/letraCiclo en vamps — v1.19) en vez de un campo
// nuevo: nada de esto se edita en musico.html, es solo lectura. Llamada
// desde actualizarContadorPractica() en cada frame, pero el trabajo
// pesado (reconstruir las líneas) solo corre cuando CAMBIA la sección
// activa (est.ultimaSeccionCifradoKey) — el resaltado de línea (lo que
// sí cambia seguido) solo toca clases, mismo criterio que ya usa el
// resto del archivo para no trabajar de más en cada frame (ver flash de
// compás/dots más arriba).
// `seccion` es la sección activa tal cual la calcula
// actualizarContadorPractica (o null si no hay ninguna sonando);
// `barIndexActual`/`barInicio` son el mismo número de compás global que
// ya se muestra en el contador grande y en "Compás X–Y" de la etiqueta
// de sección (v3.82) — así el índice de línea activa sale de restar
// ambos, sin numeración propia. `duracionCompases` es el mismo
// compasesSeccion que ya calcula el llamador para esa etiqueta (no
// aplica a vamps, que usan su propio cicloCompases cíclico).
function actualizarCifradoPractica(uid, est, seccion, barIndexActual, colorIdx, barInicio, duracionCompases, listaSecciones){
  const btn = document.getElementById('cifradotoggle-' + uid);
  const panel = document.getElementById('cifradopanel-' + uid);
  if(!btn || !panel) return;
  const esVamp = seccion && seccion.tipo === 'vamp';
  const acordes = seccion && (esVamp ? seccion.acordesCiclo : seccion.acordesPorCompas);
  const letra = seccion && (esVamp ? seccion.letraCiclo : seccion.letraPorCompas);
  const total = seccion ? (esVamp ? (seccion.cicloCompases || (acordes && acordes.length) || 0) : (duracionCompases || 0)) : 0;
  // v3.86: (a pedido) repetición con 1ra/2da vez (guia-practica.html
  // v1.22) — acordesPorCompas/letraPorCompas ahora representan UNA sola
  // pasada (basePase), no el total real de compases de la sección
  // (total, que ya incluye todas las pasadas si repeticiones>1). Este
  // mapa traduce "compás j de la sección" → "casilla de qué pasada",
  // y en la ÚLTIMA pasada, si cae dentro de los finalDistintoN compases
  // finales, lee de acordesFinal2/letraFinal2 en vez de la pasada base.
  // repeticiones=1 (default, sin cambios) hace basePase===total, o sea
  // se comporta exactamente igual que antes.
  const repeticiones = (!esVamp && seccion && seccion.repeticiones) || 1;
  const basePase = repeticiones > 1 ? Math.max(1, Math.round(total / repeticiones)) : total;
  const finalN = repeticiones > 1 ? Math.min(basePase, seccion.finalDistintoN || 1) : 0;
  const obtenerAcordeLetra = (j) => {
    if(repeticiones <= 1) return { ac: (acordes && acordes[j]) || '', le: (letra && letra[j]) || '' };
    const pasada = Math.floor(j / basePase);
    const pos = j % basePase;
    if(pasada === repeticiones - 1 && pos >= basePase - finalN){
      const k = pos - (basePase - finalN);
      return { ac: (seccion.acordesFinal2 && seccion.acordesFinal2[k]) || '', le: (seccion.letraFinal2 && seccion.letraFinal2[k]) || '' };
    }
    return { ac: (acordes && acordes[pos]) || '', le: (letra && letra[pos]) || '' };
  };
  const hayDato = total > 0 && ((acordes && acordes.some(a => (a || '').trim())) || (letra && letra.some(l => (l || '').trim())));
  if(!hayDato){
    btn.style.display = 'none';
    panel.style.display = 'none';
    btn.classList.remove('abierto');
    est.ultimaSeccionCifradoKey = null;
    est.ultimaLineaCifradoIdx = undefined;
    return;
  }
  btn.style.display = '';
  panel.style.setProperty('--sec-color', colorDeSeccionEnLista(listaSecciones || [], colorIdx));
  const seccionKey = seccion.desdeSegundos;
  if(est.ultimaSeccionCifradoKey !== seccionKey){
    est.ultimaSeccionCifradoKey = seccionKey;
    est.ultimaLineaCifradoIdx = undefined;
    est.cifradoTotal = total;
    est.cifradoEsVamp = esVamp;
    est.cifradoBarInicio = barInicio;
    const lineasHtml = [];
    for(let j = 0; j < total; j++){
      const { ac, le } = esVamp ? { ac: (acordes && acordes[j]) || '', le: (letra && letra[j]) || '' } : obtenerAcordeLetra(j);
      const texto = ac && le ? `${ac} — ${le}` : (ac || le || '·');
      const pasadaTxt = (!esVamp && repeticiones > 1) ? ` <span class="practica-cifrado-pasada">(${Math.floor(j / basePase) + 1}ª vez)</span>` : '';
      lineasHtml.push(`<div class="practica-cifrado-linea" id="cifradolinea-${uid}-${j}"><span class="practica-cifrado-num">c.${j + 1}</span> ${escapeHtml(texto)}${pasadaTxt}</div>`);
    }
    // v3.88: (a pedido) si la sección es una variación (guia-practica.html
    // v1.26/esVariacion), se muestra una línea de aviso arriba del
    // cifrado para que el músico sepa en vivo que este cuadro NO es
    // igual al de una aparición anterior de la misma sección.
    const notaVariacionHtml = seccion.esVariacion
      ? `<div class="practica-cifrado-nota-variacion">🔁 Variación${(seccion.notaVariacion || '').trim() ? ': ' + escapeHtml(seccion.notaVariacion.trim()) : ''}</div>`
      : '';
    panel.innerHTML = notaVariacionHtml + lineasHtml.join('');
  }
  let idxActiva = -1;
  if(total > 0){
    if(esVamp){
      idxActiva = ((barIndexActual - barInicio) % total + total) % total;
    } else {
      idxActiva = Math.min(total - 1, Math.max(-1, barIndexActual - barInicio));
    }
  }
  if(idxActiva !== est.ultimaLineaCifradoIdx){
    if(est.ultimaLineaCifradoIdx != null && est.ultimaLineaCifradoIdx >= 0){
      const prev = document.getElementById('cifradolinea-' + uid + '-' + est.ultimaLineaCifradoIdx);
      if(prev) prev.classList.remove('activa');
    }
    if(idxActiva >= 0){
      const cur = document.getElementById('cifradolinea-' + uid + '-' + idxActiva);
      if(cur){
        cur.classList.add('activa');
        if(panel.style.display !== 'none') cur.scrollIntoView({block: 'nearest', behavior: 'smooth'});
      }
    }
    est.ultimaLineaCifradoIdx = idxActiva;
  }
}

// v3.6: persistencia de ajustes de metrónomo en localStorage, por uid
// ('practica-'+id de sesión). Solo lo que ya vivía en memoria en
// estadoPractica[uid] — nunca toca Firestore ni el dato real del
// tema. Si localStorage falla (modo privado, cuota, etc.) se ignora
// en silencio, el metrónomo sigue funcionando solo que sin recordar.
function guardarAjustesPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  try{
    localStorage.setItem('audiolink-ajustes-' + uid, JSON.stringify({
      bpmOverride: est.bpmOverride,
      claveOverride: est.claveOverride,
      sonidoClick: est.sonidoClick,
      sonidoClave: est.sonidoClave,
      acentos: est.acentos,
      acentosClave: est.acentosClave,
      volFuerte: est.volFuerte,
      volNormal: est.volNormal,
      clickActivo: est.clickActivo,
      claveActiva: est.claveActiva
    }));
  }catch(e){}
}

// v3.6: se llama al inicializar, antes de recalcularEfectivoPractica,
// para que los overrides restaurados ya entren en el primer cálculo
// de bpm/clave efectivos. Si no hay nada guardado o el JSON es
// inválido, deja los valores por defecto que ya trae estadoPractica[uid]
// intactos.
function cargarAjustesGuardados(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  let guardado;
  try{
    const raw = localStorage.getItem('audiolink-ajustes-' + uid);
    if(!raw) return;
    guardado = JSON.parse(raw);
  }catch(e){ return; }
  if(!guardado || typeof guardado !== 'object') return;
  if(guardado.bpmOverride != null) est.bpmOverride = guardado.bpmOverride;
  if(guardado.claveOverride !== undefined) est.claveOverride = guardado.claveOverride;
  if(guardado.sonidoClick) est.sonidoClick = guardado.sonidoClick;
  if(guardado.sonidoClave) est.sonidoClave = guardado.sonidoClave;
  if(Array.isArray(guardado.acentos) && guardado.acentos.length === est.acentos.length) est.acentos = guardado.acentos;
  if(Array.isArray(guardado.acentosClave) && guardado.acentosClave.length === est.acentosClave.length) est.acentosClave = guardado.acentosClave;
  if(typeof guardado.volFuerte === 'number') est.volFuerte = guardado.volFuerte;
  if(typeof guardado.volNormal === 'number') est.volNormal = guardado.volNormal;
  if(typeof guardado.clickActivo === 'boolean') est.clickActivo = guardado.clickActivo;
  if(typeof guardado.claveActiva === 'boolean') est.claveActiva = guardado.claveActiva;
}

// v3.12: (a pedido) borra del localStorage los ajustes de metrónomo
// (audiolink-ajustes-practica-*) de sesiones que ya no vienen en la
// respuesta actual de Firestore — antes se acumulaban sin límite
// (sesión borrada, o el músico ya no asignado a ella). Solo toca claves
// con ese prefijo exacto, nunca otra cosa del localStorage. Si falla
// (modo privado, etc.) se ignora en silencio, igual que el resto de
// funciones de persistencia de este bloque.
// v3.48: (a pedido) persistencia del pre-conteo (activo + 1/2 compases)
// como preferencia GENERAL del navegador — a diferencia de
// cargarAjustesGuardados (arriba), que es por sesión/tema, esta usa una
// única clave fija en localStorage, así que aplica igual sin importar
// qué tema abras. Se lee al inicializar cada estadoPractica[uid] y se
// escribe cada vez que el músico toca el botón de pre-conteo o elige
// 1/2 compases (ver togglePreconteoPractica / elegirCompasesPreconteoPractica).
const PRECONT_GENERAL_KEY = 'audiolink-preconteo-general';
function cargarPreconteoGeneral(){
  try{
    const raw = localStorage.getItem(PRECONT_GENERAL_KEY);
    if(!raw) return null;
    const g = JSON.parse(raw);
    if(!g || typeof g !== 'object') return null;
    return g;
  }catch(e){ return null; }
}

}

function limpiarAjustesPracticaHuerfanos(sesionesVigentes){
  try{
    const prefijo = 'audiolink-ajustes-practica-';
    const idsVigentes = new Set(sesionesVigentes.map(s => prefijo + s.id));
    for(let i = localStorage.length - 1; i >= 0; i--){
      const key = localStorage.key(i);
      if(key && key.indexOf(prefijo) === 0 && !idsVigentes.has(key)){
        localStorage.removeItem(key);
      }
    }
  }catch(e){}
}

// v2.4: recalcula bpm/clave EFECTIVOS (con overrides) y sus onsets —
// se llama al inicializar el estado y cada vez que el músico cambia
// BPM o clave en el panel de ajustes. Nunca toca est.bpm/est.clave
// (los valores reales del tema), solo los campos "*Efectivo".
function recalcularEfectivoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmEf = est.bpmOverride || est.bpm;
  const claveEf = est.claveOverride !== undefined ? est.claveOverride : est.clave;
  const secPerBeatEf = 60 / bpmEf;
  const secPerBarEf = secPerBeatEf * est.compasesPorBarra;
  est.bpmEfectivo = bpmEf;
  est.claveEfectiva = claveEf;
  est.claveOnsetsEfectivo = claveEf ? construirOnsetsClave(claveEf, secPerBeatEf, secPerBarEf) : [];
  est.claveCicloSecEfectivo = secPerBarEf * 2;
  est.ultimoOnsetClave = -Infinity;
  est.ultimoCompasClave = -1;
}

// v2.4: sincroniza el panel (valor de BPM, select de clave, chip de
// sonido, botones de acento) con el estado actual — se llama al
// inicializar y desde restablecerAjustesPractica().
function actualizarUIAjustesPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmVal = document.getElementById('bpmval-' + uid);
  if(bpmVal) bpmVal.textContent = est.bpmEfectivo;
  const select = document.getElementById('claveselect-' + uid);
  if(select) select.value = est.claveEfectiva || '';
  const turno = document.getElementById('claveturno-' + uid);
  if(turno) turno.style.display = est.claveEfectiva ? '' : 'none';
  const figurasEl = document.getElementById('clavefiguras-' + uid);
  if(figurasEl){
    figurasEl.style.display = est.claveEfectiva ? '' : 'none';
    if(est.claveEfectiva && est.claveEfectiva !== est.ultimaClaveFigurasRenderizada){
      figurasEl.innerHTML = claveFigurasHtml(uid, est.claveEfectiva, est.compasesPorBarra);
      est.ultimaClaveFigurasRenderizada = est.claveEfectiva;
    }
  }
  const claveLabelEl = document.getElementById('clavelabel-' + uid);
  if(claveLabelEl) claveLabelEl.style.display = est.claveEfectiva ? '' : 'none';
  // v3.77: (a pedido) la etiqueta de la sección de Pulso ("Pulso ·
  // Clave (tipo)") solo se fijaba una vez, al armar el HTML inicial —
  // si la clave cambiaba después desde el select de Ajustes, el texto
  // quedaba desactualizado (o directamente ausente, si no había clave
  // al cargar la página). Ahora se recalcula acá cada vez.
  const pulsoLabelEl = document.getElementById('pulsolabel-' + uid);
  if(pulsoLabelEl){
    const tipoClave = est.claveEfectiva ? (CLAVE_ETIQUETAS[est.claveEfectiva] || '') : '';
    pulsoLabelEl.textContent = 'Pulso' + (tipoClave ? ' · Clave (' + tipoClave + ')' : '');
  }
  // v3.61: re-renderiza la tira unificada cuando cambia la clave
  // efectiva (mismo criterio de "solo si cambió" que figurasEl arriba,
  // con su propio flag para no interferir con ultimaClaveFigurasRenderizada).
  const pcuStripEl = document.getElementById('pcu-strip-' + uid);
  if(pcuStripEl && est.claveEfectiva !== est.ultimaClaveUnificadaRenderizada){
    pcuStripEl.outerHTML = pulsoClaveUnificadoHtml(uid, est.compasesPorBarra, est.claveEfectiva);
    est.ultimaClaveUnificadaRenderizada = est.claveEfectiva;
    est.ultimoTiempoPcu = undefined;
    // v3.69: la tira se acaba de reemplazar — sincronizamos marcadores.
    requestAnimationFrame(() => sincronizarNotasClavePulso(uid));
  }
  const clickBtn = document.getElementById('clickbtn-' + uid);
  if(clickBtn){
    clickBtn.innerHTML = HTML_BOTON_METRO;
    clickBtn.classList.toggle('activo', est.clickActivo);
  }
  const claveBtn = document.getElementById('clavebtn-' + uid);
  if(claveBtn){
    claveBtn.style.display = est.claveEfectiva ? '' : 'none';
    claveBtn.classList.toggle('activo', est.claveActiva !== false);
  }
  ['clasico', 'grave', 'woodblock', 'claveorganica'].forEach(s => {
    const chip = document.getElementById('sonido-' + uid + '-' + s);
    if(chip) chip.classList.toggle('activo', (est.sonidoClick || 'clasico') === s);
  });
  // v3.75: (a pedido) fila y chips del sonido de la clave, sonido
  // independiente del click — solo se muestra si hay clave configurada
  // (mismo criterio que claveturno/clavefiguras/claveBtn de arriba).
  const sonidoClaveFilaEl = document.getElementById('sonidoclavefila-' + uid);
  if(sonidoClaveFilaEl) sonidoClaveFilaEl.style.display = est.claveEfectiva ? '' : 'none';
  ['clasico', 'grave', 'woodblock', 'claveorganica'].forEach(s => {
    const chip = document.getElementById('sonidoclave-' + uid + '-' + s);
    if(chip) chip.classList.toggle('activo', (est.sonidoClave || 'clasico') === s);
  });
  (est.acentos || []).forEach((a, i) => {
    const btn = document.getElementById('acento-' + uid + '-' + i);
    // v3.9: el botón del tiempo 1 (i===0) conserva la clase "beat1"
    // siempre (juega con el verde del semáforo), sin importar si el
    // usuario lo cicló a normal/mudo — className se reescribe entero
    // acá así que hay que volver a agregarla cada vez.
    if(btn) btn.className = 'practica-acento-btn' + (i === 0 ? ' beat1' : '') + (a === 'fuerte' ? ' fuerte' : a === 'mudo' ? ' mudo' : '');
  });
  (est.acentosClave || []).forEach((a, i) => {
    const btn = document.getElementById('acentoclave-' + uid + '-' + i);
    if(btn) btn.className = 'practica-acento-btn' + (a === 'fuerte' ? ' fuerte' : a === 'mudo' ? ' mudo' : '');
  });
  const filaAcentosClave = document.getElementById('filaacentosclave-' + uid);
  if(filaAcentosClave) filaAcentosClave.style.display = est.claveEfectiva ? '' : 'none';
  const bpmRange = document.getElementById('bpmrange-' + uid);
  if(bpmRange) bpmRange.value = est.bpmEfectivo;
  const volFuerte = document.getElementById('volfuerte-' + uid);
  if(volFuerte) volFuerte.value = Math.round((est.volFuerte == null ? 1 : est.volFuerte) * 100);
  const volNormal = document.getElementById('volnormal-' + uid);

// Dos clicks mientras suena marcan inicio/fin real del loop (con snap
// al compás más cercano); un tercer click lo cancela. No depende de
// los tiempos guardados en Secciones — el músico lo marca a oído.
// v3.28: (a pedido) tOverride opcional — permite cerrar el loop en un
// punto tocado en el waveform en vez de forzosamente la posición
// actual de reproducción (ver seekWaveformClick). Sin tOverride se
// comporta exactamente igual que antes.
function marcarLoopPractica(uid, tOverride){
  const est = estadoPractica[uid];
  if(!est) return;
  // (a pedido) se excluye con el loop automático de sección — activar
  // este loop manual apaga el otro, para que no compitan por el seek.
  if(est.loopSeccionActivo) toggleLoopSeccionPractica(uid);
  const btn = document.getElementById('loopbtn-' + uid);
  const info = document.getElementById('loopinfo-' + uid);
  if(est.loopActivo){
    est.loopInicio = null; est.loopFin = null; est.loopActivo = false;
    if(btn) btn.textContent = '↻ Marcar loop aquí';
    if(info) info.textContent = '';
    limpiarPresetsLoopPractica(uid);
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
    return;
  }
  const t = tOverride != null ? tOverride : est.getTiempoActual();
  // v2.1: si hay clave activa, el snap redondea a bloques de 2
  // compases (el ciclo completo de la célula) en vez de 1, para que
  // el loop siempre arranque en el compás 1 de la clave — si no, cada
  // vuelta puede entrar a mitad de la célula y sonar cortada.
  const unidadCompases = est.clave ? 2 : 1;
  const snapped = snapACompasPractica(t, est.bpm, est.compasesPorBarra * unidadCompases, (est.offset || 0) + (est.offsetLocalDelta || 0));
  if(est.loopInicio == null){
    est.loopInicio = snapped;
    if(btn) btn.textContent = '↻ Marcar fin del loop';
    if(info) info.textContent = `Inicio: ${segundosATextoPractica(snapped)}`;
  } else {
    let fin = snapped;
    const minBar = (60 / est.bpm) * est.compasesPorBarra * unidadCompases;
    if(fin <= est.loopInicio) fin = est.loopInicio + minBar;
    est.loopFin = fin;
    est.loopActivo = true;
    if(btn) btn.textContent = '✕ Cancelar loop';
    const secPerBarInfo = (60 / est.bpm) * est.compasesPorBarra;
    const numCompases = Math.round((est.loopFin - est.loopInicio) / secPerBarInfo);
    if(info) info.textContent = `↻ Loop: ${segundosATextoPractica(est.loopInicio)} → ${segundosATextoPractica(est.loopFin)} (${numCompases} comp.)`;
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
  }
}

// v3.29: loop rápido de N compases desde la posición actual — mismo
// mecanismo del loop manual (est.loopInicio/est.loopFin/est.loopActivo,
// ver marcarLoopPractica), solo que calculado de una — sin el segundo
// click. Comparte info con el loop manual (loopinfo-), así que al
// activarse se ve y se cancela igual que un loop manual cualquiera;
// también se excluye con el loop de sección, igual que el loop manual.
// v3.30: (a pedido) resalta (clase activo) el botón xN elegido, y lo
// apaga si se vuelve a tocar el mismo (toggle, como el resto de los
// loops); limpiarPresetsLoopPractica() apaga los 5 cuando el loop se
// cancela por cualquier otro camino (manual, sección, etc.).
function loopRapidoCompasesPractica(uid, n){
  const est = estadoPractica[uid];
  if(!est) return;
  const btnPreset = document.getElementById('looppreset-' + uid + '-' + n);
  const yaActivoEsteMismo = btnPreset && btnPreset.classList.contains('activo');
  if(est.loopSeccionActivo) toggleLoopSeccionPractica(uid);
  const btn = document.getElementById('loopbtn-' + uid);
  const info = document.getElementById('loopinfo-' + uid);
  limpiarPresetsLoopPractica(uid);
  if(yaActivoEsteMismo){
    est.loopInicio = null; est.loopFin = null; est.loopActivo = false;
    if(btn) btn.textContent = '↻ Marcar loop aquí';
    if(info) info.textContent = '';
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
    return;
  }
  const t = est.getTiempoActual();
  // mismo criterio de snap que marcarLoopPractica: bloques de 2
  // compases si hay clave activa, para arrancar siempre en compás 1.
  const unidadCompases = est.clave ? 2 : 1;
  const snapped = snapACompasPractica(t, est.bpm, est.compasesPorBarra * unidadCompases, (est.offset || 0) + (est.offsetLocalDelta || 0));
  const secPerBarInfo = (60 / est.bpm) * est.compasesPorBarra;
  est.loopInicio = snapped;
  est.loopFin = snapped + secPerBarInfo * n;
  est.loopActivo = true;
  if(btn) btn.textContent = '✕ Cancelar loop';
  if(btnPreset) btnPreset.classList.add('activo');
  if(info) info.textContent = `↻ Loop: ${segundosATextoPractica(est.loopInicio)} → ${segundosATextoPractica(est.loopFin)} (${n} comp.)`;
  aplicarLoopNativoPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
function limpiarPresetsLoopPractica(uid){
  [4,8,16,32,64].forEach(n => {
    const b = document.getElementById('looppreset-' + uid + '-' + n);
    if(b) b.classList.remove('activo');
  });
}

// v2.2: metrónomo de práctica libre — sin reproductor real, usa un
// reloj propio (performance.now()) que alimenta exactamente el mismo
// actualizarContadorPractica() que ya usan audio/YouTube/archivo
// local, así que el contador, los dots, el click y la clave funcionan
// idéntico. Un segundo click detiene y resetea a 0 (no pausa/reanuda
// desde donde iba, para que cada práctica libre arranque siempre en
// el compás 1, como offset=0 en este modo no aplica).
// v2.3: se excluye mutuamente con la maqueta — al activarse, pausa el
// reproductor si estaba sonando (usa el mismo est.pause() que ya
// existe para audio/YouTube/local) y se registra en
// marcarReproduccionActiva(), para que si luego el músico le da play a
// la maqueta, este metrónomo se apague también. Así nunca hay dos
// relojes escribiendo el contador/dots/clave a la vez.
// v3.44: (a pedido) pre-conteo opcional (1 o 2 compases, configurable
// en ≡) antes de que arranque el metrónomo libre de verdad. Durante el
// pre-conteo solo suenan los beeps (con el mismo patrón de acentos ya
// configurado) vía setTimeout — no se toca actualizarContadorPractica
// todavía, así el contador/dots no arrancan hasta que el pre-conteo
// termina y el metrónomo real empieza en performance.now(), como antes.
function toggleMetronomoLibre(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const btn = document.getElementById('metrobtn-' + uid);
  if(est.metroLibreActivo || est.metroPrecontEnCurso){
    est.metroLibreActivo = false;
    cancelarPreconteoPractica(uid);
    if(btn){ btn.textContent = '▶ Metrónomo'; btn.classList.remove('activo'); }
    actualizarContadorPractica(uid, 0);
    return;
  }
  if(typeof est.pause === 'function'){
    try{ est.pause(); }catch(e){}
  }
  marcarReproduccionActiva(uid);

  const arrancarMetronomoReal = () => {
    est.metroLibreActivo = true;
    est.metroLibreInicio = performance.now();
    if(btn){ btn.textContent = '⏸ Detener'; btn.classList.add('activo'); }
    const tick = () => {
      if(!est.metroLibreActivo) return;
      const tSimulado = (performance.now() - est.metroLibreInicio) / 1000;
      actualizarContadorPractica(uid, tSimulado);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  if(est.precontActivo){
    if(btn){ btn.textContent = '⏳ Pre-conteo…'; btn.classList.add('activo'); }
    programarPreconteoPractica(uid, arrancarMetronomoReal);
  } else {
    arrancarMetronomoReal();
  }
}

// v3.45: (a pedido) lógica de pre-conteo extraída a funciones
// reutilizables, para que la pueda usar tanto el metrónomo libre como
// el play de la pista/maqueta (ver audioLocal/audio 'play' listeners).
// Solo agenda los beeps (con pitch de precuenta) vía setTimeout; no
// toca actualizarContadorPractica — quien la llama decide qué pasa
// cuando termina (alTerminar).
function programarPreconteoPractica(uid, alTerminar){
  const est = estadoPractica[uid];
  if(!est){ alTerminar(); return; }
  const bpmEf = est.bpmEfectivo || est.bpm;
  const secPerBeat = 60 / bpmEf;
  const totalBeats = est.compasesPorBarra * (est.precontCompases || 1);
  est.metroPrecontEnCurso = true;
  est.metroPrecontTimeouts = [];
  for(let i = 0; i < totalBeats; i++){
    const beatEnBarra = i % est.compasesPorBarra;
    const timeoutId = setTimeout(() => {
      const acento = (est.acentos && est.acentos[beatEnBarra]) || 'normal';
      if(acento !== 'mudo') beepPractica(acento === 'fuerte', est.sonidoClick, acento === 'fuerte' ? est.volFuerte : est.volNormal, true);
    }, i * secPerBeat * 1000);
    est.metroPrecontTimeouts.push(timeoutId);
  }
  est.metroPrecontTimeouts.push(setTimeout(() => {
    est.metroPrecontEnCurso = false;
    alTerminar();
  }, totalBeats * secPerBeat * 1000));
}
function cancelarPreconteoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.metroPrecontEnCurso = false;
  if(est.metroPrecontTimeouts){ est.metroPrecontTimeouts.forEach(t => clearTimeout(t)); est.metroPrecontTimeouts = []; }
}

// v3.46: (a pedido) playerbar custom para la pista/maqueta, en
// reemplazo de los controles nativos del <audio> — con nativos no
// había forma de correr el pre-conteo ANTES de que el audio empezara a
// sonar. Acá el pre-conteo corre completo primero y recién después se
// llama est.play(), así que nunca hay blip de audio.
function togglePlayPractica(uid){
  const est = estadoPractica[uid];
  if(!est || typeof est.play !== 'function') return;
  const btn = document.getElementById('playbtn-' + uid);
  if(est.audioActivo && !est.audioActivo.paused){
    est.pause();
    return;
  }
  if(est.metroPrecontEnCurso){
    cancelarPreconteoPractica(uid);
    if(btn) btn.textContent = '▶';
    return;
  }
  if(est.metroLibreActivo){
    apagarMetronomoLibreSiActivo(uid);
  }
  const arrancar = () => { est.play(); };
  if(est.precontActivo){
    if(btn) btn.textContent = '⏳';
    programarPreconteoPractica(uid, arrancar);
  } else {
    arrancar();
  }
}
function actualizarIconoPlayPractica(uid){
  const est = estadoPractica[uid];
  const btn = document.getElementById('playbtn-' + uid);
  if(!est || !btn || !est.audioActivo) return;

}
function seekBarInputPractica(uid, valorMil){

function toggleMutePractica(uid){

// v3.58: (a pedido) volver al segundo 0 de la pista — reusa est.seek(),
// el mismo que ya usan el chip de sección/waveform/loop, así que
// respeta cualquier motor conectado (nativo, Web Audio, o YouTube si
// algún día se habilita el botón ahí también).
function reiniciarPistaPractica(uid){
  const est = estadoPractica[uid];
  if(!est || typeof est.seek !== 'function') return;
  est.seek(0);
}
// v3.58: (a pedido) volumen real de la pista (0-100 en el slider, 0-1
// en el motor) — si el músico mueve el slider por encima de 0 estando
// silenciado, se des-silencia solo (mismo criterio esperado en
// cualquier reproductor: mover el volumen implica querer oírse).
function setVolumenPistaPractica(uid, valorCien){
  const est = estadoPractica[uid];
  if(!est || !est.audioActivo) return;
  const v = Math.max(0, Math.min(100, Number(valorCien) || 0)) / 100;
  est.audioActivo.volume = v;
  if(est.audioActivo.muted && v > 0) est.audioActivo.muted = false;
  const btn = document.getElementById('playervolbtn-' + uid);
  if(btn) btn.textContent = (est.audioActivo.muted || v === 0) ? '🔇' : '🔊';
}
// v3.46: refresca tiempo/posición del playerbar — se llama desde
// actualizarContadorPractica en cada frame mientras suena, igual que ya
// hace con el resto de los indicadores (chip, barra de sección, etc.).
function actualizarPlayerbarPractica(uid, tiempoActual){
  const est = estadoPractica[uid];
  if(!est || typeof est.getDuracion !== 'function') return;
  const dur = est.getDuracion();
  const txt = document.getElementById('playertiempo-' + uid);
  if(txt) txt.textContent = segundosATextoPractica(tiempoActual) + ' / ' + segundosATextoPractica(dur);
  const seek = document.getElementById('playerseek-' + uid);
  if(seek && document.activeElement !== seek && dur > 0){
    seek.value = Math.min(1000, Math.max(0, (tiempoActual / dur) * 1000));
  }
}

// v3.44: (a pedido) toggle + selección de compases (1 o 2) para el
// pre-conteo del metrónomo libre. Solo guarda estado en `est`; la
// lógica de reproducción vive en toggleMetronomoLibre.
// v3.45: el toggle ahora es el botón cuadrado junto a "▶ Metrónomo"
// (antes vivía como checkbox dentro de ≡, ver metrobtn-row en el HTML).
function togglePreconteoPractica(uid){

  guardarPreconteoGeneral(est.precontActivo, est.precontCompases || 1);
}
function elegirCompasesPreconteoPractica(uid, n){

  if(!est) return;
  est.precontCompases = n;
  sincronizarUIPreconteo(uid);

// v2.4: usa bpm/clave EFECTIVOS (con override si el músico ajustó algo
// en el panel de ajustes) para secPerBeat/secPerBar/onsets de clave —
// contador, dots y click suenan según el ajuste. El loop/snap de
// marcarLoopPractica() sigue usando el bpm/clave REAL del tema (no
// cambia con estos ajustes), porque ese sí debe coincidir con el audio
// real que está sonando.
function actualizarContadorPractica(uid, tiempoActual){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmEf = est.bpmEfectivo || est.bpm;
  const claveEf = est.claveEfectiva !== undefined ? est.claveEfectiva : est.clave;
  const claveOnsetsEf = est.claveOnsetsEfectivo || est.claveOnsets;
  const claveCicloSecEf = est.claveCicloSecEfectivo || est.claveCicloSec;
  const secPerBeat = 60 / bpmEf;
  const secPerBar = secPerBeat * est.compasesPorBarra;
  const offset = (est.offset || 0) + (est.offsetLocalDelta || 0);
  const tRel = Math.max(0, tiempoActual - offset);
  const barIndex = Math.floor(tRel / secPerBar) + 1;
  const beatEnBarra = Math.floor((tRel % secPerBar) / secPerBeat);

  // v3.13: (a pedido) el flash del número/semáforo ahora dura medio
  // tiempo (una corchea, si el pulso es negra) en vez de quedar
  // encendido todo el beat — antes se prendía/apagaba puramente en
  // función de beatEnBarra en cada frame, así que el "encendido" duraba
  // lo mismo que el tiempo completo. Ahora se detecta el INSTANTE en
  // que cambia el beat (est.ultimoBeatVisual !== beatEnBarra) para
  // encender, y un setTimeout propio apaga a los secPerBeat/2 segundos
  // — independiente de que el playback siga o no. Mismo criterio de
  // "flash tipo luz de semáforo" pedido en v3.11, solo que más corto.
  const elCompas = est.el && est.el.compas;
  const dots = est.el && est.el.dots;
  if(beatEnBarra !== est.ultimoBeatVisual){
    est.ultimoBeatVisual = beatEnBarra;
    clearTimeout(est.flashTimeoutId);
    if(elCompas) elCompas.classList.toggle('activo', beatEnBarra === 0);
    for(let i = 0; i < est.compasesPorBarra; i++){
      const dot = dots ? dots[i] : document.getElementById('dot-' + uid + '-' + i);
      if(dot) dot.classList.toggle('activo', i === beatEnBarra);
    }
    est.flashTimeoutId = setTimeout(() => {
      if(elCompas) elCompas.classList.remove('activo');
      const dotActivo = dots ? dots[beatEnBarra] : document.getElementById('dot-' + uid + '-' + beatEnBarra);
      if(dotActivo) dotActivo.classList.remove('activo');
    }, Math.max(60, (secPerBeat * 1000) / 2));
  }
  if(elCompas) elCompas.textContent = barIndex;
  const elBeat = document.getElementById('beat-' + uid);
  if(elBeat) elBeat.textContent = '· ' + (beatEnBarra + 1);

  const secciones = (est.secciones || []).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  let actual = null, siguiente = null, actualIdx = -1;
  // v3.42: (a pedido) con archivo local, el seek a veces cae unas
  // décimas ANTES del segundo pedido (el navegador ajusta al
  // fotograma de audio más cercano, no siempre exacto) — sin margen,
  // eso hacía que la sección detectada fuera la anterior a la que se
  // tocó.
  // v3.47: (a pedido) el margen SOLO se aplica a la sección que fue
  // objetivo de un salto manual reciente (est.seekManualObjetivo, ver
  // irASeccionPractica) — antes se aplicaba a TODAS las secciones
  // TODO el tiempo, lo que hacía que cualquier sección encendiera
  // 0.25s antes de su límite real durante reproducción normal.
  const MARGEN_SECCION = 0.25;
  secciones.forEach((sec, i) => {
    const esObjetivoReciente = est.seekManualObjetivo != null && Math.abs(est.seekManualObjetivo - (sec.desdeSegundos || 0)) < 0.001;
    const margen = esObjetivoReciente ? MARGEN_SECCION : 0;
    if(tiempoActual >= (sec.desdeSegundos || 0) - margen){ actual = sec; siguiente = secciones[i+1] || null; actualIdx = i; }
  });
  // v3.79: (a pedido) "el chip enciende cuando estoy fuera del rango
  // de reproducción de esa sección" — el forEach de arriba solo mira
  // CUÁNDO EMPIEZA cada sección (desdeSegundos), nunca su propio
  // final. Si una sección termina (hastaSegundos manual) antes de que
  // arranque la siguiente, quedaba un hueco donde "actual" seguía
  // siendo esa sección — chip y etiqueta encendidos aunque ya no se
  // esté reproduciendo ni cueando ese tramo. Acá se chequea el límite
  // real (mismo criterio que ya usa el loop automático de sección,
  // más abajo: solo cuenta como límite real si hay hastaSegundos
  // manual O una sección siguiente — la última sección sin fin manual
  // no tiene límite real, así que se deja encendida hasta que termine
  // el audio, como ya era el comportamiento esperado ahí).
  if(actual){
    const inicioSecChequeo = actual.desdeSegundos || 0;
    const finManualChequeo = actual.hastaSegundos;
    const finSecChequeo = (finManualChequeo != null) ? finManualChequeo : (siguiente ? (siguiente.desdeSegundos || 0) : null);
    if(finSecChequeo != null && tiempoActual >= finSecChequeo){
      actual = null;
      actualIdx = -1;
    }
  }
  const elSeccion = document.getElementById('seccion-' + uid);
  // v3.40: (a pedido) antes esto corría sin condición en cada frame,
  // reiniciando la transición del chip aunque siguiera siendo el mismo
  // — ahora solo se tocan las clases cuando la sección activa cambió.
  const nuevoChipKey = actual ? actual.desdeSegundos : null;
  if(nuevoChipKey !== est.ultimaSeccionChip){
    if(est.ultimaSeccionChip !== undefined && est.ultimaSeccionChip !== null){
      const chipAnterior = document.getElementById('chip-' + uid + '-' + est.ultimaSeccionChip);
      if(chipAnterior) chipAnterior.classList.remove('activo');
      const bloqueAnterior = document.getElementById('mapabloque-' + uid + '-' + est.ultimaSeccionChip);
      if(bloqueAnterior) bloqueAnterior.classList.remove('activo');
    }
    if(actual){
      const chipActual = document.getElementById('chip-' + uid + '-' + actual.desdeSegundos);
      if(chipActual) chipActual.classList.add('activo');
      const bloqueActual = document.getElementById('mapabloque-' + uid + '-' + actual.desdeSegundos);
      if(bloqueActual){
        bloqueActual.classList.add('activo');
        bloqueActual.scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'});
      }
    }
    est.ultimaSeccionChip = nuevoChipKey;
  }
  const elFill = document.getElementById('progfill-' + uid);
  actualizarPlayerbarPractica(uid, tiempoActual);
  const elTxt = document.getElementById('progtxt-' + uid);
  if(actual && elFill){
    // v3.35: (a pedido) la barra de progreso toma el color de la
    // sección que está sonando en este momento — mismo color e índice
    // (colorSeccionPorIndice) que ya usan el chip de arriba y el
    // waveform, así las 3 vistas quedan consistentes de un vistazo.
    elFill.style.background = colorDeSeccionEnLista(secciones, actualIdx);
    const inicioSec = actual.desdeSegundos || 0;
    // v3.29: fin manual (hastaSegundos, guia-practica.html v1.6) tiene
    // prioridad si la sección lo trae definido; si no, mismo criterio
    // de siempre (inicio de la siguiente, o +4 compases si es la última).
    const finManual = actual.hastaSegundos;
    const finSec = (finManual != null) ? finManual : (siguiente ? (siguiente.desdeSegundos || 0) : (inicioSec + secPerBar * 4));
    const pct = finSec > inicioSec ? Math.min(100, Math.max(0, ((tiempoActual - inicioSec) / (finSec - inicioSec)) * 100)) : 100;
    elFill.style.width = pct + '%';
    // v3.78/v3.81: (a pedido) etiqueta de sección junto al contador —
    // ya no dice "Sección:" (redundante, el nombre solo alcanza), y
    // ahora destaca la duración EN COMPASES (jerarquía visual mayor,
    // ver .practica-seccion-compases) por sobre el rango en minutos
    // (que queda en segundo plano, .practica-seccion-detalle). El
    // conteo de compases usa el mismo secPerBar/inicioSec/finSec que
    // ya calcula la barra de progreso, redondeado al compás más
    // cercano (una sección real casi siempre cae justo en compases;
    // el redondeo es solo por si el dato guardado no cae exacto).
    // v3.85.1: FIX — compasesSeccion/barInicio se calculaban adentro
    // del if(elSeccion){...} (const con scope de bloque) pero
    // actualizarCifradoPractica() los usaba AFUERA de ese bloque →
    // ReferenceError en cada frame con sección activa, que cortaba en
    // seco actualizarContadorPractica() antes de llegar al loop
    // automático / seguimiento del waveform más abajo (por eso
    // "no arrancaba" al elegir sección). Se sacan del if para que
    // vivan en el scope del bloque completo — mismo cálculo, mismo
    // resultado, sin cambiar nada del criterio de compás/waveform.
    const compasesSeccion = secPerBar > 0 ? Math.max(1, Math.round((finSec - inicioSec) / secPerBar)) : 0;
    // v3.82: (a pedido) rango de compás inicio-fin de la sección,
    // debajo del rango en minutos — misma fórmula del barIndex del
    // contador grande (offset+offsetLocalDelta, secPerBar), aplicada
    // a inicioSec/finSec en vez de a tiempoActual. barFin es el
    // último compás DENTRO de la sección (barInicio + duración - 1),
    // no el primero de la siguiente.
    const barInicio = secPerBar > 0 ? Math.floor(Math.max(0, inicioSec - offset) / secPerBar) + 1 : 0;
    if(elSeccion){
      const barFin = barInicio + compasesSeccion - 1;
      elSeccion.style.setProperty('--sec-color', colorDeSeccionEnLista(secciones, actualIdx));
      elSeccion.innerHTML = `<span class="practica-seccion-compases">${compasesSeccion} comp.</span>` +
        `<span class="practica-seccion-detalle"> · ${escapeHtml(actual.nombre)} · ${segundosATextoPractica(inicioSec)}–${segundosATextoPractica(finSec)}</span>` +
        `<span class="practica-seccion-compas-rango">Compás ${barInicio}–${barFin}</span>`;
      elSeccion.style.display = '';
    }
    // v3.84.1: panel de letra/acordes — reusa barIndex/barInicio/
    // compasesSeccion (mismos que ya arma la etiqueta de arriba) para
    // saber qué línea resaltar.
    actualizarCifradoPractica(uid, est, actual, barIndex, actualIdx, barInicio, compasesSeccion, secciones);
    actualizarLetraCompletaPractica(uid, actual);
    // v3.96: (a pedido) más visible (antes texto chico gris apagado) +
    // compases como jerarquía principal, minutos como dato secundario
    // entre paréntesis — para el músico, la distancia real es "en
    // cuántos compases", no en segundos. Mismo secPerBar/finSec que ya
    // calcula el resto de esta función.
    if(elTxt){
      if(siguiente){
        const compasesRestantes = secPerBar > 0 ? Math.max(0, Math.ceil((finSec - tiempoActual) / secPerBar)) : null;
        const distanciaTxt = compasesRestantes != null
          ? `${compasesRestantes} comp. (${segundosATextoPractica(finSec - tiempoActual)})`
          : segundosATextoPractica(finSec - tiempoActual);
        elTxt.textContent = `Siguiente: ${siguiente.nombre} en ${distanciaTxt}`;
      } else {
        elTxt.textContent = '';
      }
    }
    // v3.29: mientras el loop de sección está activo, la franja verde
    // del waveform sigue a la sección actual en cada momento (mismo
    // inicioSec/finSec de arriba) — igual que ya hace el loop manual.
    // v3.48: solo se reconfigura el loop nativo cuando el rango REALMENTE
    // cambió (cruce de sección) — no en cada frame, para no reiniciar el
    // nodo de audio 60 veces por segundo sin necesidad.
    // v3.48.2: (a pedido) inicioSec/finSec vienen del dato guardado tal
    // cual (desdeSegundos/hastaSegundos), que puede caer una fracción
    // de segundo antes/después del borde matemático del compás. Con el
    // mecanismo viejo de vigilar-y-saltar eso no se notaba (tenía
    // tolerancia); con el loop nativo sample-accurate (Web Audio) sí se
    // nota — el loop cerraba un poco antes del compás real ("muela").
    // Se snapea SOLO lo que se manda al loop nativo (mismo criterio que
    // ya usan marcarLoopPractica/loopRapidoCompasesPractica) — inicioSec/
    // finSec sin snapear siguen usándose tal cual para el % de la barra,
    // la franja del waveform y el texto "Siguiente en...".
    // v3.49: (a pedido) fix del fix — acá se estaba usando bpmEf (el
    // BPM EFECTIVO, que puede ser un tempo de práctica más lento solo
    // para el metrónomo visual) en vez de est.bpm (el BPM REAL del
    // audio). El propio criterio del archivo (ver comentario arriba de
    // actualizarContadorPractica) es que todo lo que deba coincidir con
    // el audio real — como marcarLoopPractica/loopRapidoCompasesPractica
    // ya hacían — usa SIEMPRE est.bpm, nunca bpmEf. Con bpmEf corriendo
    // a otro tempo, el snap caía en un punto de grilla que no
    // correspondía al compás real del audio, y la muela seguía.
    // v3.49 (fix 3, la causa real): la línea "CORO 1" que se ve en el
    // waveform NUNCA se dibujaba desde est.loopInicio — vive en un
    // bloque de código totalmente aparte (dibujarWaveform/infoSecciones)
    // que usaba sec.desdeSegundos crudo. Por eso nada de lo de arriba
    // cambiaba lo que se veía en pantalla, aunque el audio del loop sí
    // se hubiera corregido. Esa línea ahora se snapea a la misma grilla
    // que los ticks (ver dibujarWaveform, offsetEfectivo incluido) —
    // acá se usa exactamente el mismo criterio (bpm/offset) para que el
    // loop nativo (lo que se ESCUCHA) coincida siempre con la línea (lo
    // que se VE), sin importar el offset calibrado en cada momento.
    if(est.loopSeccionActivo){
      const bpmSnap = est.bpmEfectivo || est.bpm;
      const offsetSnap = (est.offset || 0) + (est.offsetLocalDelta || 0);
      const loopInicioSnap = snapACompasPractica(inicioSec, bpmSnap, est.compasesPorBarra, offsetSnap);
      const loopFinSnap = (finManual != null)
        ? finManual
        : snapACompasPractica(finSec, bpmSnap, est.compasesPorBarra, offsetSnap);
      if(est.loopInicio !== loopInicioSnap || est.loopFin !== loopFinSnap){
        est.loopInicio = loopInicioSnap;
        est.loopFin = loopFinSnap;
        aplicarLoopNativoPractica(uid);
      }
    }
    // (a pedido) loop automático de sección — usa el mismo inicioSec/
    // finSec de arriba, así que "el final de la sección" es idéntico
    // al que ya muestra la barra de progreso/el texto "Siguiente en...".
    // Actúa si hay una sección siguiente real, O si esta sección trae
    // un fin manual definido (hastaSegundos) — en ambos casos finSec es
    // un límite real. Con la última sección y sin fin manual, finSec es
    // el estimado de +4 compases que ya usa la barra de progreso — no
    // un límite real del audio, así que ahí NO se fuerza el loop para
    // no cortar el tema antes de que termine.
    // v3.48: si el motor actual maneja loop nativo (Web Audio), este
    // salto manual ya no hace falta — el propio audio nunca llega a
    // cruzar finSec, así que la condición de abajo prácticamente nunca
    // se cumple; se deja como respaldo para YouTube/<audio> nativo (a
    // otra velocidad), que siguen con el mecanismo de vigilar-y-saltar.
    const loopEsNativo = est.audioActivo && typeof est.audioActivo.setLoop === 'function';
    if(est.loopSeccionActivo && (siguiente || finManual != null) && tiempoActual >= finSec && !loopEsNativo){
      // v3.29: reinicio instantáneo del fill (sin la animación de
      // 0.15s) — se saca la transición un instante, se fuerza reflow,
      // y se restaura, solo para este salto de loop puntual.
      if(elFill){
        elFill.style.transition = 'none';
        elFill.style.width = '0%';
        elFill.offsetHeight; // fuerza reflow para que el 'none' tome efecto ya
        elFill.style.transition = '';
      }
      est.seek(inicioSec);
    }
  } else if(elFill){
    elFill.style.width = '0%';
    elFill.style.background = ''; // v3.35: sin sección activa, vuelve al dorado por defecto (CSS)
    if(elTxt) elTxt.textContent = '';
    if(elSeccion) elSeccion.style.display = 'none';
    actualizarCifradoPractica(uid, est, null, barIndex, -1);
    actualizarLetraCompletaPractica(uid, null);
  }

  // v2.0/v2.4: turno del ciclo de clave (compás 1 o 2 de la célula) —
  // usa claveEf/claveCicloSecEf (con override), y el div ahora siempre
  // existe en el DOM (se muestra/oculta desde cambiarClavePractica()).
  if(claveEf && claveCicloSecEf){
    const tCiclo = tRel % claveCicloSecEf;
    const compasClave = Math.floor(tCiclo / secPerBar); // 0 o 1
    if(compasClave !== est.ultimoCompasClave){
      const anterior = document.getElementById('clavebar-' + uid + '-' + est.ultimoCompasClave);
      if(anterior) anterior.classList.remove('activo');
      const actualClave = document.getElementById('clavebar-' + uid + '-' + compasClave);
      if(actualClave) actualClave.classList.add('activo');
      est.ultimoCompasClave = compasClave;

      // v3.14: (a pedido) flash verde + agrandamiento del tick de
      // comienzo de compás en la línea de clave correspondiente —
      // mismo criterio visual y misma duración (medio tiempo) que el
      // número grande de compás (v3.11/v3.13), pero sincronizado con
      // el inicio real del compás DE LA CLAVE (este bloque), no con el
      // pulso general — son dos relojes distintos (célula de 2
      // compases vs. compás simple).
      clearTimeout(est.claveTickFlashTimeoutId);
      const tickActual = document.getElementById('clavetick0-' + uid + '-' + compasClave);
      if(tickActual){
        tickActual.classList.add('activo');
        est.claveTickFlashTimeoutId = setTimeout(() => {
          tickActual.classList.remove('activo');
        }, Math.max(60, (secPerBeat * 1000) / 2));
      }
    }
  }

  // v2.8: enciende la × de la clave que corresponde al golpe actual —
  // corre siempre que hay clave (no solo con clickActivo), para que
  // el seguimiento visual funcione aunque el click esté mudo.
  if(claveEf && claveOnsetsEf && claveOnsetsEf.length && claveCicloSecEf){
    const n = claveOnsetsEf.length;
    const cicloIndex = Math.floor(tRel / claveCicloSecEf);
    const tCiclo = tRel - cicloIndex * claveCicloSecEf;
    let idxLocal = -1;
    for(let i = 0; i < n; i++){ if(tCiclo >= claveOnsetsEf[i]) idxLocal = i; }
    const eventoGlobal = idxLocal === -1 ? (cicloIndex * n - 1) : (cicloIndex * n + idxLocal);
    if(eventoGlobal !== est.ultimoOnsetClave){
      est.ultimoOnsetClave = eventoGlobal;
      // v3.74: (a pedido) antes el sonido de la clave necesitaba que
      // el metrónomo (clickActivo) también estuviera prendido, aunque
      // el botón 🪘 (claveActiva) estuviera activado — la clave no
      // podía sonar sola. Ahora depende solo de claveActiva: puede
      // sonar con el metrónomo apagado, prendido, o los dos juntos
      // (superposición ya resuelta en v3.73).
      // v3.97: el beep de la clave ya NO se dispara acá (dependía de
      // rAF, con jitter en móvil) — ahora lo agenda con anticipación
      // schedulerTickGlobalPractica() usando el reloj de Web Audio. Este
      // bloque queda solo para el flash VISUAL de la ×, que no necesita
      // precisión de muestra.
      if(est.ultimaNotaClaveEl) est.ultimaNotaClaveEl.classList.remove('activo');
      clearTimeout(est.claveNotaFlashTimeoutId);
      clearTimeout(est.claveNotaVisualOnTimeoutId);
      if(idxLocal >= 0){
        const patronEf = CLAVE_PATRONES[claveEf];
        const lado0Len = patronEf ? patronEf[0].length : 0;
        const barIdx = idxLocal < lado0Len ? 0 : 1;
        const posIdx = idxLocal < lado0Len ? idxLocal : idxLocal - lado0Len;
        const notaEl = document.getElementById('clavenota-' + uid + '-' + barIdx + '-' + posIdx);
        if(notaEl){
          // v3.71: (a pedido, "se ve adelantada la clave") el sonido
          // (beepPractica, arriba) sigue disparándose YA MISMO — el
          // oído es sensible a latencia de audio. Solo el flash VISUAL
          // se retrasa unos ms: es un ajuste perceptual (el ojo suele
          // pedir el evento visual un poco después del sonido para
          // sentirlos "juntos"), no una corrección de cálculo. Valor
          // de partida conservador (25ms) — si se sigue sintiendo
          // desfasado (para cualquier lado), este es el número a subir
          // o bajar.
          const DELAY_VISUAL_CLAVE_MS = 25;
          est.claveNotaVisualOnTimeoutId = setTimeout(() => {
            notaEl.classList.add('activo');
            // v3.14: (a pedido) el golpe de clave ahora es un flash corto
            // (medio tiempo, igual que el número/semáforo — v3.13) en vez
            // de quedar encendido hasta el próximo golpe, que podía tardar
            // mucho más de un tiempo según el patrón.
            est.claveNotaFlashTimeoutId = setTimeout(() => {
              notaEl.classList.remove('activo');
            }, Math.max(60, (secPerBeat * 1000) / 2));
          }, DELAY_VISUAL_CLAVE_MS);
        }
        est.ultimaNotaClaveEl = notaEl || null;
      } else {
        est.ultimaNotaClaveEl = null;
      }
    }
  }

  // v3.62/v3.61: actualización de los puntos de la tira unificada —
  // resolución de negras (un punto por tiempo, no por corchea). La ×
  // de clave YA la enciende el bloque de arriba (busca
  // clavenota-uid-barIdx-posIdx, que ahora sí existe en el DOM porque
  // pulsoClaveUnificadoHtml() reusa ese mismo id) — no hace falta
  // lógica nueva para eso acá.
  {
    const hayClave = !!(claveEf && claveCicloSecEf);
    const cicloDurPcu = hayClave ? claveCicloSecEf : secPerBar;
    const totalTiempos = hayClave ? est.compasesPorBarra * 2 : est.compasesPorBarra;
    const tCicloPcu = tRel % cicloDurPcu;
    const tiempoGlobal = Math.min(totalTiempos - 1, Math.floor(tCicloPcu / secPerBeat));
    if(tiempoGlobal !== est.ultimoTiempoPcu){
      const prevDot = document.getElementById('pcu-dot-' + uid + '-' + est.ultimoTiempoPcu);
      if(prevDot) prevDot.classList.remove('activo');
      const dotEl = document.getElementById('pcu-dot-' + uid + '-' + tiempoGlobal);
      if(dotEl) dotEl.classList.add('activo');
      est.ultimoTiempoPcu = tiempoGlobal;
      const stripEl = document.getElementById('pcu-strip-' + uid);
      if(stripEl){
        stripEl.classList.toggle('compas2', hayClave && tiempoGlobal >= est.compasesPorBarra);
      }
    }
  }

  // v3.97: el beep del pulso normal (est.clickActivo) ya NO se dispara
  // acá (dependía de rAF, con jitter/retraso notorio en móvil) — ahora
  // lo agenda con anticipación schedulerTickGlobalPractica() usando el
  // reloj de Web Audio (audioCtxPractica.currentTime). El pulso sigue
  // sonando siempre que clickActivo esté prendido, haya o no clave,
  // igual que antes (v3.73) — solo cambió el mecanismo de disparo, no
  // el criterio de cuándo suena.

  // v3.48: respaldo de vigilar-y-saltar para el loop MANUAL — solo
  // corre si el motor actual no maneja loop nativo (YouTube, o <audio>
  // nativo a otra velocidad); con Web Audio el propio motor ya lo hace
  // sample-accurate (ver aplicarLoopNativoPractica) y esto no llega a
  // dispararse en la práctica.
  if(est.loopActivo && est.loopFin != null && tiempoActual >= est.loopFin && !(est.audioActivo && typeof est.audioActivo.setLoop === 'function')){
    est.seek(est.loopInicio);
  }
}

let ytApiListo = false;
let colaInicializacionYt = [];
function onYouTubeIframeAPIReady(){
  ytApiListo = true;
  colaInicializacionYt.forEach(fn => fn());
  colaInicializacionYt = [];
}

// v1.8: solo una maqueta debe sonar/actualizar el contador a la vez —
// al arrancar una, pausa la que estuviera sonando antes (si la había).
// v2.3: esto ahora también cubre el metrónomo libre (toggleMetronomoLibre
// se registra igual que audio/YouTube/local). Dos casos: (a) arranca una
// maqueta de OTRA sesión con el metrónomo libre de esa sesión activo →
// se pausa esa sesión entera (ya cubierto abajo); (b) arranca la maqueta
// de ESTA MISMA sesión mientras su propio metrónomo libre está activo
// (mismo uid, por eso se chequea aparte) → se apaga el metrónomo libre
// de esa sesión para no pisar el contador con dos relojes.
let uidReproduciendoActual = null;
function marcarReproduccionActiva(uid){
  if(uidReproduciendoActual && uidReproduciendoActual !== uid){
    const anterior = estadoPractica[uidReproduciendoActual];
    if(anterior && typeof anterior.pause === 'function'){
      try{ anterior.pause(); }catch(e){}
    }
    apagarMetronomoLibreSiActivo(uidReproduciendoActual);
  }
  apagarMetronomoLibreSiActivo(uid);
  uidReproduciendoActual = uid;
}

function apagarMetronomoLibreSiActivo(uid){
  const est = estadoPractica[uid];
  if(est && est.metroLibreActivo){
    est.metroLibreActivo = false;
    const btn = document.getElementById('metrobtn-' + uid);
    if(btn){ btn.textContent = '▶ Metrónomo'; btn.classList.remove('activo'); }
  }
}

// v3.48: motor de reproducción con Web Audio API — envuelve un
// AudioBuffer decodificado completo en un AudioBufferSourceNode con
// loopStart/loopEnd NATIVOS (sample-accurate), a diferencia del
// <audio> normal donde "loopear" significa vigilar cuadro a cuadro y
// hacer currentTime = X (impreciso, ver v3.42: el seek de archivos
// locales cae casi siempre un poco antes de lo pedido — eso es lo que
// se oía como "cola del compás anterior" al cerrar el loop).
// Expone la MISMA interfaz mínima que ya usa el resto del código sobre
// un <audio> (paused/muted/currentTime/duration/play/pause/
// addEventListener con 'play'/'pause'/'ended'/'seeked'), para no tener
// que tocar togglePlayPractica/actualizarIconoPlayPractica/
// toggleMutePractica/etc. Como el nodo de Web Audio es de un solo uso,
// cada play()/seek()/setLoop() internamente para el nodo viejo (si
// había) y crea uno nuevo desde la posición correspondiente.
function crearWebAudioPlayer(){
  const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  const gainNode = ctxAudio.createGain();
  gainNode.connect(ctxAudio.destination);
  const p = {
    buffer: null,
    node: null,
    playing: false,
    pausedAt: 0,
    startedAtCtxTime: 0,
    startedAtOffset: 0,
    loopInicio: null,
    loopFin: null,
    _listeners: {},
    addEventListener(ev, fn){ (p._listeners[ev] = p._listeners[ev] || []).push(fn); },
    _emit(ev){ (p._listeners[ev] || []).forEach(fn => { try{ fn(); }catch(e){} }); },
    get duration(){ return p.buffer ? p.buffer.duration : 0; },
    get paused(){ return !p.playing; },
    // v3.58: (a pedido) volumen real (0-1), no solo mute on/off — misma
    // interfaz mínima que ya expone un <audio> nativo (.volume), así
    // el playerbar no necesita saber qué motor está conectado. muted
    // ahora respeta el volumen guardado (_vol) en vez de asumir 1 fijo,
    // para no perder el nivel elegido al des-silenciar.
    _vol: 1,
    get volume(){ return p._vol; },
    set volume(v){
      p._vol = Math.max(0, Math.min(1, v));
      if(gainNode.gain.value !== 0) gainNode.gain.value = p._vol;
    },
    get muted(){ return gainNode.gain.value === 0; },
    set muted(v){ gainNode.gain.value = v ? 0 : p._vol; },
    get currentTime(){
      if(!p.playing) return p.pausedAt;
      let t = p.startedAtOffset + (ctxAudio.currentTime - p.startedAtCtxTime);
      if(p.loopInicio != null && p.loopFin != null && p.loopFin > p.loopInicio && t >= p.loopFin){
        const dur = p.loopFin - p.loopInicio;
        t = p.loopInicio + ((t - p.loopInicio) % dur);
      }
      return t;
    },
    set currentTime(t){ p._seekTo(t); },
    _crearNodo(offset){
      const node = ctxAudio.createBufferSource();
      node.buffer = p.buffer;
      if(p.loopInicio != null && p.loopFin != null && p.loopFin > p.loopInicio){
        node.loop = true;
        node.loopStart = p.loopInicio;
        node.loopEnd = p.loopFin;
      }
      node.connect(gainNode);
      node.onended = () => {
        if(p.node === node && !node.loop){
          p.playing = false;
          p._emit('ended');
        }
      };
      return node;
    },
    cargarBuffer(buffer){ p.buffer = buffer; },
    play(){
      if(!p.buffer || p.playing) return;
      if(ctxAudio.state === 'suspended') ctxAudio.resume();
      const offset = p.pausedAt || 0;
      p.node = p._crearNodo(offset);
      p.node.start(0, offset);
      p.startedAtCtxTime = ctxAudio.currentTime;
      p.startedAtOffset = offset;
      p.playing = true;
      p._emit('play');
    },
    pause(){
      if(!p.playing) return;
      p.pausedAt = p.currentTime;
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      p.playing = false;
      p._emit('pause');
    },
    _seekTo(t){
      const estabaActivo = p.playing;
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      p.pausedAt = Math.max(0, t);
      if(estabaActivo){
        p.node = p._crearNodo(p.pausedAt);
        p.node.start(0, p.pausedAt);
        p.startedAtCtxTime = ctxAudio.currentTime;
        p.startedAtOffset = p.pausedAt;
        p.playing = true;
      }
      p._emit('seeked');
    },
    // (re)configura el loop nativo sin perder la posición actual —
    // usado por marcarLoopPractica/loopRapidoCompasesPractica/el loop
    // de sección en vez del mecanismo de "vigilar y saltar".
    setLoop(inicio, fin){
      p.loopInicio = inicio;
      p.loopFin = fin;
      if(p.playing) p._seekTo(p.currentTime);
    },
    clearLoop(){
      if(p.loopInicio == null && p.loopFin == null) return;
      p.loopInicio = null;
      p.loopFin = null;
      if(p.playing) p._seekTo(p.currentTime);
    },
    cerrar(){
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      try{ ctxAudio.close(); }catch(e){}
    }
  };
  return p;
}

// v3.48: aplica est.loopInicio/est.loopFin/est.loopActivo al motor de
// audio actual, SOLO si soporta loop nativo (Web Audio — YouTube y el
// modo libre sin audio siguen con el mecanismo de vigilar-y-saltar de
// siempre, sin cambios). Se llama desde marcarLoopPractica,
// loopRapidoCompasesPractica y el loop de sección cada vez que cambian
// los límites del loop.
function aplicarLoopNativoPractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.audioActivo || typeof est.audioActivo.setLoop !== 'function') return;
  // v3.48: el loop de sección (loopSeccionActivo) no toca loopActivo
  // (son mecanismos que se excluyen mutuamente, no el mismo flag) — acá
  // cualquiera de los dos cuenta como "hay un loop pedido".
  const hayLoopPedido = est.loopActivo || est.loopSeccionActivo;
  if(hayLoopPedido && est.loopInicio != null && est.loopFin != null){
    est.audioActivo.setLoop(est.loopInicio, est.loopFin);
  } else {
    est.audioActivo.clearLoop();
  }
}

// v1.8: reemplaza la fuente por un archivo elegido del dispositivo —
// el metrónomo/loop siguen funcionando igual, porque solo dependen de
// BPM/compás/offset (ya cargados), no de dónde viene el audio. Libera
// el ObjectURL anterior si ya había uno, para no acumular memoria.
function onArchivoLocalElegido(uid, files){
  const est = estadoPractica[uid];
  if(!est || !files || !files[0]) return;
  if(est.archivoLocalUrl) URL.revokeObjectURL(est.archivoLocalUrl);
  const url = URL.createObjectURL(files[0]);
  est.archivoLocalUrl = url;
  // (a pedido) cada archivo nuevo puede tener su propio silencio
  // inicial distinto — se resetea el ajuste del archivo anterior en
  // vez de arrastrarlo, y se muestra el panel de calibración.
  // v3.28: salvo que YA se haya calibrado antes este mismo archivo
  // (mismo nombre+tamaño) en este navegador — en ese caso se recupera
  // ese ajuste guardado en vez de arrancar en 0, para no tener que
  // recalibrar cada práctica.
  const offsetGuardado = cargarOffsetLocalDeStorage(files[0]);
  est.offsetLocalDelta = offsetGuardado != null ? offsetGuardado : 0;
  const panelOffset = document.getElementById('offsetlocal-' + uid);
  if(panelOffset) panelOffset.style.display = 'flex';
  actualizarUIOffsetLocalPractica(uid);
  actualizarUIBpmLocalPractica(uid);
  const infoBpm = document.getElementById('offsetlocalbpminfo-' + uid);
  if(infoBpm) infoBpm.textContent = '';
  // (a pedido) los taps de calibración de tempo son de UN archivo
  // específico — se limpian al cargar uno nuevo, igual que el offset.
  est.calibTaps = [];
  const taplabel = document.getElementById('taplabel-' + uid);
  if(taplabel) taplabel.textContent = 'Taps: 0';
  const btnBuscarMas = document.getElementById('offsetlocalbuscarmas-' + uid);
  if(btnBuscarMas) btnBuscarMas.style.display = 'none';
  // (a pedido) intenta ubicar el offset solo con el audio, sin que el
  // músico tenga que tocar nada — ver detectarOffsetAutomaticoPractica.
  // Es asíncrono (decodifica el archivo entero), así que no bloquea el
  // resto de esta función ni el resto de la carga.
  // (a pedido) se guarda el File (no solo la URL) para poder usar el
  // botón de detección automática y "Buscar más allá" sin pedirle al
  // músico que lo vuelva a elegir del dispositivo. Ya NO se dispara la
  // detección sola acá — ahora es el botón "🔍 Detectar comienzo
  // automáticamente" del panel el que la arranca.
  est.archivoLocalFile = files[0];

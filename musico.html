// v3.48: motor de reproducción con Web Audio API — envuelve un
// AudioBuffer decodificado completo en un AudioBufferSourceNode con
// loopStart/loopEnd NATIVOS (sample-accurate), a diferencia del
// <audio> normal donde "loopear" significa vigilar cuadro a cuadro y
// hacer currentTime = X (impreciso, ver v3.42: el seek de archivos
// locales cae casi siempre un poco antes de lo pedido — eso es lo que
// se oía como "cola del compás anterior" al cerrar el loop).
// Expone la MISMA interfaz mínima que ya usa el resto del código sobre
// un <audio> (paused/muted/currentTime/duration/play/pause/
// addEventListener con 'play'/'pause'/'ended'/'seeked'), para no tener
// que tocar togglePlayPractica/actualizarIconoPlayPractica/
// toggleMutePractica/etc. Como el nodo de Web Audio es de un solo uso,
// cada play()/seek()/setLoop() internamente para el nodo viejo (si
// había) y crea uno nuevo desde la posición correspondiente.
function crearWebAudioPlayer(){
  // v3.120: antes creaba su propio AudioContext acá — ver comentario
  // largo junto a obtenerAudioCtxPractica() más arriba. Ahora reusa el
  // mismo contexto que agenda el click/clave, así el reloj de
  // reproducción y el reloj de agendado son siempre el mismo.
  const ctxAudio = obtenerAudioCtxPractica();
  const gainNode = ctxAudio.createGain();
  gainNode.connect(ctxAudio.destination);
  const p = {
    // v3.183: por defecto la salida es gainNode->destination (como
    // siempre, usado por la maqueta oficial). Solo el archivo LOCAL la
    // reruteoa hacia sus filtros de tono con esto — no cambia nada
    // para quien no lo llame.
    conectarSalida(nodo){ gainNode.disconnect(); gainNode.connect(nodo); },
    buffer: null,
    node: null,
    playing: false,
    pausedAt: 0,
    startedAtCtxTime: 0,
    startedAtOffset: 0,
    loopInicio: null,
    loopFin: null,
    _listeners: {},
    addEventListener(ev, fn){ (p._listeners[ev] = p._listeners[ev] || []).push(fn); },
    _emit(ev){ (p._listeners[ev] || []).forEach(fn => { try{ fn(); }catch(e){} }); },
    get duration(){ return p.buffer ? p.buffer.duration : 0; },
    get paused(){ return !p.playing; },
    // v3.58: (a pedido) volumen real (0-1), no solo mute on/off — misma
    // interfaz mínima que ya expone un <audio> nativo (.volume), así
    // el playerbar no necesita saber qué motor está conectado. muted
    // ahora respeta el volumen guardado (_vol) en vez de asumir 1 fijo,
    // para no perder el nivel elegido al des-silenciar.
    _vol: 1,
    get volume(){ return p._vol; },
    set volume(v){
      p._vol = Math.max(0, Math.min(1, v));
      if(gainNode.gain.value !== 0) gainNode.gain.value = p._vol;
    },
    get muted(){ return gainNode.gain.value === 0; },
    set muted(v){ gainNode.gain.value = v ? 0 : p._vol; },
    get currentTime(){
      if(!p.playing) return p.pausedAt;
      let t = p.startedAtOffset + (ctxAudio.currentTime - p.startedAtCtxTime);
      if(p.loopInicio != null && p.loopFin != null && p.loopFin > p.loopInicio && t >= p.loopFin){
        const dur = p.loopFin - p.loopInicio;
        t = p.loopInicio + ((t - p.loopInicio) % dur);
      }
      return t;
    },
    set currentTime(t){ p._seekTo(t); },
    _crearNodo(offset){
      const node = ctxAudio.createBufferSource();
      node.buffer = p.buffer;
      if(p.loopInicio != null && p.loopFin != null && p.loopFin > p.loopInicio){
        node.loop = true;
        node.loopStart = p.loopInicio;
        node.loopEnd = p.loopFin;
      }
      node.connect(gainNode);
      node.onended = () => {
        if(p.node === node && !node.loop){
          p.playing = false;
          p._emit('ended');
        }
      };
      return node;
    },
    cargarBuffer(buffer){ p.buffer = buffer; },
    play(){
      if(!p.buffer || p.playing) return;
      if(ctxAudio.state === 'suspended') ctxAudio.resume();
      const offset = p.pausedAt || 0;
      p.node = p._crearNodo(offset);
      p.node.start(0, offset);
      p.startedAtCtxTime = ctxAudio.currentTime;
      p.startedAtOffset = offset;
      p.playing = true;
      p._emit('play');
    },
    pause(){
      if(!p.playing) return;
      p.pausedAt = p.currentTime;
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      p.playing = false;
      p._emit('pause');
    },
    _seekTo(t){
      const estabaActivo = p.playing;
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      p.pausedAt = Math.max(0, t);
      if(estabaActivo){
        p.node = p._crearNodo(p.pausedAt);
        p.node.start(0, p.pausedAt);
        p.startedAtCtxTime = ctxAudio.currentTime;
        p.startedAtOffset = p.pausedAt;
        p.playing = true;
      }
      p._emit('seeked');
    },
    // (re)configura el loop nativo sin perder la posición actual —
    // usado por marcarLoopPractica/loopRapidoCompasesPractica/el loop
    // de sección en vez del mecanismo de "vigilar y saltar".
    setLoop(inicio, fin){
      p.loopInicio = inicio;
      p.loopFin = fin;
      if(p.playing) p._seekTo(p.currentTime);
    },
    clearLoop(){
      if(p.loopInicio == null && p.loopFin == null) return;
      p.loopInicio = null;
      p.loopFin = null;
      if(p.playing) p._seekTo(p.currentTime);
    },
    cerrar(){
      // v3.120: ctxAudio ahora es el AudioContext COMPARTIDO
      // (obtenerAudioCtxPractica) — cerrarlo acá rompería el click/clave
      // y cualquier otro instrumento que lo esté usando. Solo se detiene
      // el nodo propio de este player.
      // v3.121: FIX — v3.120 dejaba el gainNode de este player conectado
      // PARA SIEMPRE al destino del contexto compartido (antes esto no
      // importaba: cerrar() mataba el contexto entero, gainNode incluido,
      // de un solo saque). Cada cambio de versión de maqueta o recarga de
      // archivo local creaba un player nuevo y dejaba el gainNode viejo
      // como nodo huérfano enganchado al grafo — con varios instrumentos
      // y varios cambios en la sesión, esos nodos se iban acumulando y
      // sobrecargaban de a poco el hilo de audio compartido, notándose
      // como un tironcito justo al reiniciar el loop. Ahora se
      // desconecta también el gainNode al cerrar.
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      try{ gainNode.disconnect(); }catch(e){}
    }
  };
  return p;
}

// v3.48: aplica est.loopInicio/est.loopFin/est.loopActivo al motor de
// audio actual, SOLO si soporta loop nativo (Web Audio — YouTube y el
// modo libre sin audio siguen con el mecanismo de vigilar-y-saltar de
// siempre, sin cambios). Se llama desde marcarLoopPractica,
// loopRapidoCompasesPractica y el loop de sección cada vez que cambian
// los límites del loop.
function aplicarLoopNativoPractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.audioActivo || typeof est.audioActivo.setLoop !== 'function') return;
  // v3.48: el loop de sección (loopSeccionActivo) no toca loopActivo
  // (son mecanismos que se excluyen mutuamente, no el mismo flag) — acá
  // cualquiera de los dos cuenta como "hay un loop pedido".
  const hayLoopPedido = est.loopActivo || est.loopSeccionActivo;
  if(hayLoopPedido && est.loopInicio != null && est.loopFin != null){
    est.audioActivo.setLoop(est.loopInicio, est.loopFin);
  } else {
    est.audioActivo.clearLoop();
  }
}

// v1.8: reemplaza la fuente por un archivo elegido del dispositivo —
// el metrónomo/loop siguen funcionando igual, porque solo dependen de
// BPM/compás/offset (ya cargados), no de dónde viene el audio. Libera
// el ObjectURL anterior si ya había uno, para no acumular memoria.
// v3.131: (a pedido) lector liviano de tags ID3v2 — mismo código que
// guia-practica.html (archivos HTML sueltos, sin JS compartido). NO
// analiza el audio, solo lee metadata que YA viene en el archivo
// (frames TBPM/TKEY o TXXX "BPM"/"Key", que Virtual DJ/Rekordbox/Serato
// escriben al analizar una pista). Traduce notación Camelot (ej. "8A")
// a tonalidad aproximada. Try/catch total: nunca rompe la carga del
// archivo real si algo no calza.
const CAMELOT_A_TONALIDAD = {
  '1a':'Abm','2a':'Ebm','3a':'Bbm','4a':'Fm','5a':'Cm','6a':'Gm','7a':'Dm',
  '8a':'Am','9a':'Em','10a':'Bm','11a':'F#m','12a':'Dbm',
  '1b':'B','2b':'F#','3b':'Db','4b':'Ab','5b':'Eb','6b':'Bb','7b':'F',
  '8b':'C','9b':'G','10b':'D','11b':'A','12b':'E',
};
// v3.141: (a pedido) formatea cualquier BPM mostrado en pantalla con 2
// decimales fijos (ej. 123 → "123.00"), para que combine visualmente
// con los valores medidos del archivo (ej. 145.23) y sea consistente
// si luego se usa en el staff. No afecta el valor numérico real
// guardado en est.bpm/est.bpmEfectivo/Firestore, solo el texto mostrado.
function formatBpm(v){
  const n = parseFloat(v);
  return isFinite(n) ? n.toFixed(2) : (v != null ? v : '—');
}
async function leerTagsAudioID3(file){
  const resultado = { bpm: null, key: null };
  try{
    if(!file || !file.slice) return resultado;
    const buf = await file.slice(0, 512 * 1024).arrayBuffer();
    const dv = new DataView(buf);
    const bytes = new Uint8Array(buf);
    if(bytes.length < 10 || String.fromCharCode(bytes[0],bytes[1],bytes[2]) !== 'ID3') return resultado;
    const version = bytes[3];
    const sizeSynchsafe = (bytes[6]<<21) | (bytes[7]<<14) | (bytes[8]<<7) | bytes[9];
    const tagEnd = Math.min(10 + sizeSynchsafe, bytes.length);
    const idLen = version === 2 ? 3 : 4;
    const sizeLen = version === 2 ? 3 : 4;
    let pos = 10;
    const leerTexto = (start, len) => {
      if(len <= 0) return '';
      const enc = bytes[start];
      const body = bytes.subarray(start + 1, start + len);
      try{
        if(enc === 1 || enc === 2) return new TextDecoder('utf-16' + (enc===2?'be':'')).decode(body).replace(/\u0000/g,'').trim();
        return new TextDecoder(enc === 3 ? 'utf-8' : 'iso-8859-1').decode(body).replace(/\u0000/g,'').trim();
      }catch(e){ return ''; }
    };
    while(pos + idLen + sizeLen < tagEnd){
      const id = String.fromCharCode(...bytes.subarray(pos, pos + idLen));
      if(!/^[A-Z0-9]+$/.test(id)) break;
      let frameSize;
      if(version === 4){
        frameSize = (bytes[pos+idLen]<<21)|(bytes[pos+idLen+1]<<14)|(bytes[pos+idLen+2]<<7)|bytes[pos+idLen+3];
      }else{
        frameSize = dv.getUint32(pos + idLen, false);
      }
      const headerLen = idLen + sizeLen + (version === 2 ? 0 : 2);
      const frameStart = pos + headerLen;
      if(frameSize <= 0 || frameStart + frameSize > tagEnd) break;
      if(id === 'TBPM' || id === 'TBP'){
        const v = leerTexto(frameStart, frameSize);
        if(v && !resultado.bpm) resultado.bpm = v.replace(/[^\d.]/g,'') || null;
      }else if(id === 'TKEY' || id === 'TKE'){
        const v = leerTexto(frameStart, frameSize);
        if(v && !resultado.key) resultado.key = v;
      }else if(id === 'TXXX' || id === 'TXX'){
        const enc = bytes[frameStart];
        const dobleNull = (enc === 1 || enc === 2);
        const body = bytes.subarray(frameStart + 1, frameStart + frameSize);
        let sepIdx = -1;
        for(let k=0; k<body.length-(dobleNull?1:0); k++){
          if(body[k] === 0 && (!dobleNull || body[k+1] === 0)){ sepIdx = k; break; }
        }
        if(sepIdx >= 0){
          const descBytes = body.subarray(0, sepIdx);
          const valBytes = body.subarray(sepIdx + (dobleNull?2:1));
          const decode = b => { try{ return new TextDecoder(enc>=1&&enc<=2?('utf-16'+(enc===2?'be':'')):(enc===3?'utf-8':'iso-8859-1')).decode(b).replace(/\u0000/g,'').trim(); }catch(e){ return ''; } };
          const desc = decode(descBytes).toLowerCase();
          const val = decode(valBytes);
          if(val && /bpm/.test(desc) && !resultado.bpm) resultado.bpm = val.replace(/[^\d.]/g,'') || null;
          if(val && /key|tono|tonalidad/.test(desc) && !resultado.key) resultado.key = val;
        }
      }
      pos = frameStart + frameSize;
    }
    if(resultado.key){
      const camelot = CAMELOT_A_TONALIDAD[resultado.key.trim().toLowerCase()];
      if(camelot) resultado.key = `${camelot} (Camelot ${resultado.key.trim().toUpperCase()})`;
    }
  }catch(e){ console.error('No se pudieron leer tags ID3:', e); }
  return resultado;
}
// v3.131: informativo — esta pantalla no guarda nada en el tema, así
// que solo se muestra para que el músico compare contra lo configurado
// (BPM del contador, clave, etc.), sin ningún botón de "usar valores".
async function mostrarTagsDetectadosLocal(uid, file){
  const el = document.getElementById('archivolocaltags-' + uid);
  // v3.141: (a pedido) la misma línea de tags ahora también se
  // duplica arriba, junto al nombre del archivo (archivonombretop) —
  // ver bloquePracticaHtml. Si ese span no existe (páginas viejas en
  // caché), simplemente no se actualiza y todo sigue igual que antes.
  const elTop = document.getElementById('archivolocaltagstop-' + uid);
  if(!el && !elTop) return;
  const setHtml = (html) => { if(el) el.innerHTML = html; if(elTop) elTop.innerHTML = html; };
  const tags = await leerTagsAudioID3(file);
  if(!tags.bpm && !tags.key){
    // v3.140: (a pedido) antes quedaba en blanco sin avisar nada; ahora
    // muestra un mensaje temporal para que quede claro que no hay tags
    // en el archivo (no que el sistema falló), y se borra solo a los
    // 4s. No toca nada si el archivo SÍ trae BPM/Tonalidad.
    setHtml('<span style="color:var(--muted)">Sin tags BPM/Tonalidad en este archivo</span>');
    setTimeout(() => {
      if(el && el.innerHTML.includes('Sin tags BPM/Tonalidad')) el.innerHTML = '';
      if(elTop && elTop.innerHTML.includes('Sin tags BPM/Tonalidad')) elTop.innerHTML = '';
    }, 4000);
    return;
  }
  const partes = [];
  if(tags.bpm) partes.push(`${formatBpm(tags.bpm)} BPM`);
  if(tags.key) partes.push(tags.key);
  let html = `🏷️ ${partes.join(' · ')}`;
  // v3.179: (a pedido) el BPM detectado del tag pasa a auto-aplicarse
  // igual que la tonalidad (ver comentario de tonalidadDetectada más
  // abajo, v3.149) — se quita el botón "Ajustar click a X (solo esta
  // sesión)" y su badge de confirmación "✓ Ajustado a X BPM" (v3.164),
  // que quedaban redundantes con esto. Sigue siendo SOLO de sesión
  // (bpmOverride, nunca toca practicaBpm en Firestore ni est.bpm), y
  // sigue mostrando la comparación informativa "— Tema en X BPM" para
  // que se sepa contra qué se comparó.
  const est = estadoPractica[uid];
  const detectado = tags.bpm ? parseFloat(tags.bpm) : null;
  if(detectado && est && est.bpm && Math.abs(detectado - est.bpm) >= 1){
    est.bpmOverride = Math.max(30, Math.min(300, detectado));
    recalcularEfectivoPractica(uid);
    actualizarBadgePractica(uid, est.compasTexto);
    actualizarUIAjustesPractica(uid);
    guardarAjustesPractica(uid);
    html += ` <span style="color:var(--muted)">— ${escapeHtml(est.temaNombre || 'Tema')} en ${formatBpm(est.bpm)}, click ajustado a ${formatBpm(est.bpmOverride)} (solo esta sesión)</span>`;
  }
  // v3.149: (a pedido) tonalidad ya NO pide confirmación con botón —
  // se aplica directo como tonalidadOverride apenas se detecta en el
  // tag, sin comparar contra la del tema (esa comparación/botón queda
  // para el BPM, que sí lo pidió así). Si el archivo no trae tag de
  // tonalidad, no se toca nada (tonalidadOverride queda como estaba,
  // ya reseteado a "sin override" por v3.146 al elegir el archivo).
  const tonalidadDetectada = tags.key ? tags.key.replace(/\s*\(Camelot[^)]*\)\s*$/i, '').trim() : null;
  if(tonalidadDetectada && est){
    est.tonalidadOverride = tonalidadDetectada;
    actualizarBadgePractica(uid, est.compasTexto);
    guardarAjustesPractica(uid);
  }
  setHtml(html);
}

  // (a pedido) se guarda el File (no solo la URL) para poder usar el

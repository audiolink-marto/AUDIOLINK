// v3.48: motor de reproducción con Web Audio API — envuelve un
// AudioBuffer decodificado completo en un AudioBufferSourceNode con
// loopStart/loopEnd NATIVOS (sample-accurate), a diferencia del
// <audio> normal donde "loopear" significa vigilar cuadro a cuadro y
// hacer currentTime = X (impreciso, ver v3.42: el seek de archivos
// locales cae casi siempre un poco antes de lo pedido — eso es lo que
// se oía como "cola del compás anterior" al cerrar el loop).
// Expone la MISMA interfaz mínima que ya usa el resto del código sobre
// un <audio> (paused/muted/currentTime/duration/play/pause/
// addEventListener con 'play'/'pause'/'ended'/'seeked'), para no tener
// que tocar togglePlayPractica/actualizarIconoPlayPractica/
// toggleMutePractica/etc. Como el nodo de Web Audio es de un solo uso,
// cada play()/seek()/setLoop() internamente para el nodo viejo (si
// había) y crea uno nuevo desde la posición correspondiente.
function crearWebAudioPlayer(){
  // v3.120: antes creaba su propio AudioContext acá — ver comentario
  // largo junto a obtenerAudioCtxPractica() más arriba. Ahora reusa el
  // mismo contexto que agenda el click/clave, así el reloj de
  // reproducción y el reloj de agendado son siempre el mismo.
  const ctxAudio = obtenerAudioCtxPractica();
  const gainNode = ctxAudio.createGain();
  gainNode.connect(ctxAudio.destination);
  const p = {
    // v3.183: por defecto la salida es gainNode->destination (como
    // siempre, usado por la maqueta oficial). Solo el archivo LOCAL la
    // reruteoa hacia sus filtros de tono con esto — no cambia nada
    // para quien no lo llame.
    conectarSalida(nodo){ gainNode.disconnect(); gainNode.connect(nodo); },
    buffer: null,
    node: null,
    playing: false,
    pausedAt: 0,
    startedAtCtxTime: 0,
    startedAtOffset: 0,
    loopInicio: null,
    loopFin: null,
    _listeners: {},
    addEventListener(ev, fn){ (p._listeners[ev] = p._listeners[ev] || []).push(fn); },
    _emit(ev){ (p._listeners[ev] || []).forEach(fn => { try{ fn(); }catch(e){} }); },
    get duration(){ return p.buffer ? p.buffer.duration : 0; },
    get paused(){ return !p.playing; },
    // v3.58: (a pedido) volumen real (0-1), no solo mute on/off — misma
    // interfaz mínima que ya expone un <audio> nativo (.volume), así
    // el playerbar no necesita saber qué motor está conectado. muted
    // ahora respeta el volumen guardado (_vol) en vez de asumir 1 fijo,
    // para no perder el nivel elegido al des-silenciar.
    _vol: 1,
    get volume(){ return p._vol; },
    set volume(v){
      p._vol = Math.max(0, Math.min(1, v));
      if(gainNode.gain.value !== 0) gainNode.gain.value = p._vol;
    },
    get muted(){ return gainNode.gain.value === 0; },
    set muted(v){ gainNode.gain.value = v ? 0 : p._vol; },
    get currentTime(){
      if(!p.playing) return p.pausedAt;
      let t = p.startedAtOffset + (ctxAudio.currentTime - p.startedAtCtxTime);
      if(p.loopInicio != null && p.loopFin != null && p.loopFin > p.loopInicio && t >= p.loopFin){
        const dur = p.loopFin - p.loopInicio;
        t = p.loopInicio + ((t - p.loopInicio) % dur);
      }
      return t;
    },
    set currentTime(t){ p._seekTo(t); },
    _crearNodo(offset){
      const node = ctxAudio.createBufferSource();
      node.buffer = p.buffer;
      if(p.loopInicio != null && p.loopFin != null && p.loopFin > p.loopInicio){
        node.loop = true;
        node.loopStart = p.loopInicio;
        node.loopEnd = p.loopFin;
      }
      node.connect(gainNode);
      node.onended = () => {
        if(p.node === node && !node.loop){
          p.playing = false;
          p._emit('ended');
        }
      };
      return node;
    },
    cargarBuffer(buffer){ p.buffer = buffer; },
    play(){
      if(!p.buffer || p.playing) return;
      if(ctxAudio.state === 'suspended') ctxAudio.resume();
      const offset = p.pausedAt || 0;
      p.node = p._crearNodo(offset);
      p.node.start(0, offset);
      p.startedAtCtxTime = ctxAudio.currentTime;
      p.startedAtOffset = offset;
      p.playing = true;
      p._emit('play');
    },
    pause(){
      if(!p.playing) return;
      p.pausedAt = p.currentTime;
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      p.playing = false;
      p._emit('pause');
    },
    _seekTo(t){
      const estabaActivo = p.playing;
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      p.pausedAt = Math.max(0, t);
      if(estabaActivo){
        p.node = p._crearNodo(p.pausedAt);
        p.node.start(0, p.pausedAt);
        p.startedAtCtxTime = ctxAudio.currentTime;
        p.startedAtOffset = p.pausedAt;
        p.playing = true;
      }
      p._emit('seeked');
    },
    // (re)configura el loop nativo sin perder la posición actual —
    // usado por marcarLoopPractica/loopRapidoCompasesPractica/el loop
    // de sección en vez del mecanismo de "vigilar y saltar".
    setLoop(inicio, fin){
      p.loopInicio = inicio;
      p.loopFin = fin;
      if(p.playing) p._seekTo(p.currentTime);
    },
    clearLoop(){
      if(p.loopInicio == null && p.loopFin == null) return;
      p.loopInicio = null;
      p.loopFin = null;
      if(p.playing) p._seekTo(p.currentTime);
    },
    cerrar(){
      // v3.120: ctxAudio ahora es el AudioContext COMPARTIDO
      // (obtenerAudioCtxPractica) — cerrarlo acá rompería el click/clave
      // y cualquier otro instrumento que lo esté usando. Solo se detiene
      // el nodo propio de este player.
      // v3.121: FIX — v3.120 dejaba el gainNode de este player conectado
      // PARA SIEMPRE al destino del contexto compartido (antes esto no
      // importaba: cerrar() mataba el contexto entero, gainNode incluido,
      // de un solo saque). Cada cambio de versión de maqueta o recarga de
      // archivo local creaba un player nuevo y dejaba el gainNode viejo
      // como nodo huérfano enganchado al grafo — con varios instrumentos
      // y varios cambios en la sesión, esos nodos se iban acumulando y
      // sobrecargaban de a poco el hilo de audio compartido, notándose
      // como un tironcito justo al reiniciar el loop. Ahora se
      // desconecta también el gainNode al cerrar.
      if(p.node){ try{ p.node.onended = null; p.node.stop(); }catch(e){} p.node = null; }
      try{ gainNode.disconnect(); }catch(e){}
    }
  };
  return p;
}

// v3.48: aplica est.loopInicio/est.loopFin/est.loopActivo al motor de
// audio actual, SOLO si soporta loop nativo (Web Audio — YouTube y el
// modo libre sin audio siguen con el mecanismo de vigilar-y-saltar de
// siempre, sin cambios). Se llama desde marcarLoopPractica,
// loopRapidoCompasesPractica y el loop de sección cada vez que cambian
// los límites del loop.
function aplicarLoopNativoPractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.audioActivo || typeof est.audioActivo.setLoop !== 'function') return;
  // v3.48: el loop de sección (loopSeccionActivo) no toca loopActivo
  // (son mecanismos que se excluyen mutuamente, no el mismo flag) — acá
  // cualquiera de los dos cuenta como "hay un loop pedido".
  const hayLoopPedido = est.loopActivo || est.loopSeccionActivo;
  if(hayLoopPedido && est.loopInicio != null && est.loopFin != null){
    est.audioActivo.setLoop(est.loopInicio, est.loopFin);
  } else {
    est.audioActivo.clearLoop();
  }
}

// v1.8: reemplaza la fuente por un archivo elegido del dispositivo —
// el metrónomo/loop siguen funcionando igual, porque solo dependen de
// BPM/compás/offset (ya cargados), no de dónde viene el audio. Libera
// el ObjectURL anterior si ya había uno, para no acumular memoria.
// v3.131: (a pedido) lector liviano de tags ID3v2 — mismo código que
// guia-practica.html (archivos HTML sueltos, sin JS compartido). NO
// analiza el audio, solo lee metadata que YA viene en el archivo
// (frames TBPM/TKEY o TXXX "BPM"/"Key", que Virtual DJ/Rekordbox/Serato
// escriben al analizar una pista). Traduce notación Camelot (ej. "8A")
// a tonalidad aproximada. Try/catch total: nunca rompe la carga del
// archivo real si algo no calza.
const CAMELOT_A_TONALIDAD = {
  '1a':'Abm','2a':'Ebm','3a':'Bbm','4a':'Fm','5a':'Cm','6a':'Gm','7a':'Dm',
  '8a':'Am','9a':'Em','10a':'Bm','11a':'F#m','12a':'Dbm',
  '1b':'B','2b':'F#','3b':'Db','4b':'Ab','5b':'Eb','6b':'Bb','7b':'F',
  '8b':'C','9b':'G','10b':'D','11b':'A','12b':'E',
};
// v3.141: (a pedido) formatea cualquier BPM mostrado en pantalla con 2
// decimales fijos (ej. 123 → "123.00"), para que combine visualmente
// con los valores medidos del archivo (ej. 145.23) y sea consistente
// si luego se usa en el staff. No afecta el valor numérico real
// guardado en est.bpm/est.bpmEfectivo/Firestore, solo el texto mostrado.
function formatBpm(v){
  const n = parseFloat(v);
  return isFinite(n) ? n.toFixed(2) : (v != null ? v : '—');
}

// v3.230: (a pedido, port de ensayo.html v3.281) lector de Vorbis
// Comments — el formato de tags que usan los .flac (y .ogg/.opus),
// totalmente distinto a ID3v2: no hay firma "ID3" al inicio, sino
// "fLaC" seguido de bloques de metadata; el bloque tipo 4
// (VORBIS_COMMENT) trae pares "CLAVE=valor" en texto plano (BPM=128,
// KEY=Am, etc — sin un estándar tan fijo como los frames TBPM/TKEY de
// ID3v2, así que se comparan varios alias case-insensitive). Se leen
// los bloques DE A UNO por su propio tamaño declarado (nunca un límite
// de bytes fijo), para no perderse el bloque de comentarios si antes
// viene una carátula (PICTURE) pesada. leerTagsAudioID3() no se tocó
// — esto es una función aparte.
async function leerTagsAudioVorbis(file){
  const resultado = { bpm: null, key: null };
  try{
    if(!file || !file.slice || file.size < 4) return resultado;
    const firma = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    if(String.fromCharCode(firma[0], firma[1], firma[2], firma[3]) !== 'fLaC') return resultado;
    let pos = 4;
    while(pos + 4 <= file.size){
      const hdr = new Uint8Array(await file.slice(pos, pos + 4).arrayBuffer());
      const esUltimo = (hdr[0] & 0x80) !== 0;
      const tipoBloque = hdr[0] & 0x7f;
      const largoBloque = (hdr[1] << 16) | (hdr[2] << 8) | hdr[3];
      pos += 4;
      if(tipoBloque === 4){ // VORBIS_COMMENT
        const buf = await file.slice(pos, pos + largoBloque).arrayBuffer();
        const bytes = new Uint8Array(buf);
        const dv = new DataView(buf);
        let p = 0;
        if(p + 4 > bytes.length) break;
        const largoVendor = dv.getUint32(p, true); p += 4 + largoVendor;
        if(p + 4 > bytes.length) break;
        const numComentarios = dv.getUint32(p, true); p += 4;
        for(let i = 0; i < numComentarios && p + 4 <= bytes.length; i++){
          const largo = dv.getUint32(p, true); p += 4;
          if(p + largo > bytes.length) break;
          const texto = new TextDecoder('utf-8').decode(bytes.subarray(p, p + largo));
          p += largo;
          const igual = texto.indexOf('=');
          if(igual < 0) continue;
          const clave = texto.slice(0, igual).trim().toUpperCase();
          const valor = texto.slice(igual + 1).trim();
          if(!valor) continue;
          if(!resultado.bpm && (clave === 'BPM' || clave === 'TBPM')) resultado.bpm = valor.replace(/[^\d.]/g, '') || null;
          if(!resultado.key && (clave === 'KEY' || clave === 'INITIALKEY' || clave === 'INITIAL KEY' || clave === 'TONALITY' || clave === 'TKEY')) resultado.key = valor;
        }
        break; // ya se encontró el único bloque que nos interesa
      }
      pos += largoBloque;
      if(esUltimo) break;
    }
    if(resultado.key){
      const camelot = CAMELOT_A_TONALIDAD[resultado.key.trim().toLowerCase()];
      if(camelot) resultado.key = `${camelot} (Camelot ${resultado.key.trim().toUpperCase()})`;
    }
  }catch(e){ console.error('No se pudieron leer tags Vorbis (FLAC):', e); }
  return resultado;
}
// v3.230: intenta ID3v2 (mp3) y, si no encontró nada, Vorbis Comments
// (flac/ogg) — un archivo solo trae uno de los dos formatos, así que
// esto no pisa nada; simplemente amplía qué formatos se reconocen.
async function leerTagsAudio(file){
  const porID3 = await leerTagsAudioID3(file);
  if(porID3.bpm || porID3.key) return porID3;
  return await leerTagsAudioVorbis(file);
}

async function leerTagsAudioID3(file){
  const resultado = { bpm: null, key: null };
  try{
    if(!file || !file.slice) return resultado;
    const buf = await file.slice(0, 512 * 1024).arrayBuffer();
    const dv = new DataView(buf);
    const bytes = new Uint8Array(buf);
    if(bytes.length < 10 || String.fromCharCode(bytes[0],bytes[1],bytes[2]) !== 'ID3') return resultado;
    const version = bytes[3];
    const sizeSynchsafe = (bytes[6]<<21) | (bytes[7]<<14) | (bytes[8]<<7) | bytes[9];
    const tagEnd = Math.min(10 + sizeSynchsafe, bytes.length);
    const idLen = version === 2 ? 3 : 4;
    const sizeLen = version === 2 ? 3 : 4;
    let pos = 10;
    const leerTexto = (start, len) => {
      if(len <= 0) return '';
      const enc = bytes[start];
      const body = bytes.subarray(start + 1, start + len);
      try{
        if(enc === 1 || enc === 2) return new TextDecoder('utf-16' + (enc===2?'be':'')).decode(body).replace(/\u0000/g,'').trim();
        return new TextDecoder(enc === 3 ? 'utf-8' : 'iso-8859-1').decode(body).replace(/\u0000/g,'').trim();
      }catch(e){ return ''; }
    };
    while(pos + idLen + sizeLen < tagEnd){
      const id = String.fromCharCode(...bytes.subarray(pos, pos + idLen));
      if(!/^[A-Z0-9]+$/.test(id)) break;
      let frameSize;
      if(version === 4){
        frameSize = (bytes[pos+idLen]<<21)|(bytes[pos+idLen+1]<<14)|(bytes[pos+idLen+2]<<7)|bytes[pos+idLen+3];
      }else{
        frameSize = dv.getUint32(pos + idLen, false);
      }
      const headerLen = idLen + sizeLen + (version === 2 ? 0 : 2);
      const frameStart = pos + headerLen;
      if(frameSize <= 0 || frameStart + frameSize > tagEnd) break;
      if(id === 'TBPM' || id === 'TBP'){
        const v = leerTexto(frameStart, frameSize);
        if(v && !resultado.bpm) resultado.bpm = v.replace(/[^\d.]/g,'') || null;
      }else if(id === 'TKEY' || id === 'TKE'){
        const v = leerTexto(frameStart, frameSize);
        if(v && !resultado.key) resultado.key = v;
      }else if(id === 'TXXX' || id === 'TXX'){
        const enc = bytes[frameStart];
        const dobleNull = (enc === 1 || enc === 2);
        const body = bytes.subarray(frameStart + 1, frameStart + frameSize);
        let sepIdx = -1;
        for(let k=0; k<body.length-(dobleNull?1:0); k++){
          if(body[k] === 0 && (!dobleNull || body[k+1] === 0)){ sepIdx = k; break; }
        }
        if(sepIdx >= 0){
          const descBytes = body.subarray(0, sepIdx);
          const valBytes = body.subarray(sepIdx + (dobleNull?2:1));
          const decode = b => { try{ return new TextDecoder(enc>=1&&enc<=2?('utf-16'+(enc===2?'be':'')):(enc===3?'utf-8':'iso-8859-1')).decode(b).replace(/\u0000/g,'').trim(); }catch(e){ return ''; } };
          const desc = decode(descBytes).toLowerCase();
          const val = decode(valBytes);
          if(val && /bpm/.test(desc) && !resultado.bpm) resultado.bpm = val.replace(/[^\d.]/g,'') || null;
          if(val && /key|tono|tonalidad/.test(desc) && !resultado.key) resultado.key = val;
        }
      }
      pos = frameStart + frameSize;
    }
    if(resultado.key){
      const camelot = CAMELOT_A_TONALIDAD[resultado.key.trim().toLowerCase()];
      if(camelot) resultado.key = `${camelot} (Camelot ${resultado.key.trim().toUpperCase()})`;
    }
  }catch(e){ console.error('No se pudieron leer tags ID3:', e); }
  return resultado;
}
// v3.131: informativo — esta pantalla no guarda nada en el tema, así
// que solo se muestra para que el músico compare contra lo configurado
// (BPM del contador, clave, etc.), sin ningún botón de "usar valores".
async function mostrarTagsDetectadosLocal(uid, file){
  const el = document.getElementById('archivolocaltags-' + uid);
  // v3.141: (a pedido) la misma línea de tags ahora también se
  // duplica arriba, junto al nombre del archivo (archivonombretop) —
  // ver bloquePracticaHtml. Si ese span no existe (páginas viejas en
  // caché), simplemente no se actualiza y todo sigue igual que antes.
  const elTop = document.getElementById('archivolocaltagstop-' + uid);
  if(!el && !elTop) return;
  const setHtml = (html) => { if(el) el.innerHTML = html; if(elTop) elTop.innerHTML = html; };
  const tags = await leerTagsAudio(file);
  if(!tags.bpm && !tags.key){
    // v3.140: (a pedido) antes quedaba en blanco sin avisar nada; ahora
    // muestra un mensaje temporal para que quede claro que no hay tags
    // en el archivo (no que el sistema falló), y se borra solo a los
    // 4s. No toca nada si el archivo SÍ trae BPM/Tonalidad.
    setHtml('<span style="color:var(--muted)">Sin tags BPM/Tonalidad en este archivo</span>');
    setTimeout(() => {
      if(el && el.innerHTML.includes('Sin tags BPM/Tonalidad')) el.innerHTML = '';
      if(elTop && elTop.innerHTML.includes('Sin tags BPM/Tonalidad')) elTop.innerHTML = '';
    }, 4000);
    return;
  }
  const partes = [];
  if(tags.bpm) partes.push(`${formatBpm(tags.bpm)} BPM`);
  if(tags.key) partes.push(tags.key);
  let html = `🏷️ ${partes.join(' · ')}`;
  // v3.179: (a pedido) el BPM detectado del tag pasa a auto-aplicarse
  // igual que la tonalidad (ver comentario de tonalidadDetectada más
  // abajo, v3.149) — se quita el botón "Ajustar click a X (solo esta
  // sesión)" y su badge de confirmación "✓ Ajustado a X BPM" (v3.164),
  // que quedaban redundantes con esto. Sigue siendo SOLO de sesión
  // (bpmOverride, nunca toca practicaBpm en Firestore ni est.bpm), y
  // sigue mostrando la comparación informativa "— Tema en X BPM" para
  // que se sepa contra qué se comparó.
  const est = estadoPractica[uid];
  const detectado = tags.bpm ? parseFloat(tags.bpm) : null;
  if(detectado && est && est.bpm && Math.abs(detectado - est.bpm) >= 1){
    est.bpmOverride = Math.max(30, Math.min(300, detectado));
    recalcularEfectivoPractica(uid);
    actualizarBadgePractica(uid, est.compasTexto);
    actualizarUIAjustesPractica(uid);
    guardarAjustesPractica(uid);
    html += ` <span style="color:var(--muted)">— ${escapeHtml(est.temaNombre || 'Tema')} en ${formatBpm(est.bpm)}, click ajustado a ${formatBpm(est.bpmOverride)} (solo esta sesión)</span>`;
  }
  // v3.149: (a pedido) tonalidad ya NO pide confirmación con botón —
  // se aplica directo como tonalidadOverride apenas se detecta en el
  // tag, sin comparar contra la del tema (esa comparación/botón queda
  // para el BPM, que sí lo pidió así). Si el archivo no trae tag de
  // tonalidad, no se toca nada (tonalidadOverride queda como estaba,
  // ya reseteado a "sin override" por v3.146 al elegir el archivo).
  const tonalidadDetectada = tags.key ? tags.key.replace(/\s*\(Camelot[^)]*\)\s*$/i, '').trim() : null;
  if(tonalidadDetectada && est){
    est.tonalidadOverride = tonalidadDetectada;
    actualizarBadgePractica(uid, est.compasTexto);
    guardarAjustesPractica(uid);
  }
  setHtml(html);
}
// v3.179: usarBpmDetectadoPractica() se elimina — el BPM detectado del

// (buscar "btn-usar-bpm-tag" en el historial si hace falta revertir)
// también se sacaron.

function onArchivoLocalElegido(uid, files){
  const est = estadoPractica[uid];
  if(!est || !files || !files[0]) return;
  if(est.archivoLocalUrl) URL.revokeObjectURL(est.archivoLocalUrl);
  const url = URL.createObjectURL(files[0]);
  est.archivoLocalUrl = url;
  // v3.163: el bloque v3.162 que ocultaba etiquetas de estructura al
  // cargar archivo local (toggleOcultarEtiquetasEstructura) se sacó —
  // ya no hace falta, seccionesRuntimeDe(est) ignora las secciones del

  // este archivo, ver más abajo) — se cargan de localStorage un poco
  // más abajo, junto con el offset.
  // (a pedido) cada archivo nuevo puede tener su propio silencio
  // inicial distinto — se resetea el ajuste del archivo anterior en

  // v3.28: salvo que YA se haya calibrado antes este mismo archivo
  // (mismo nombre+tamaño) en este navegador — en ese caso se recupera
  // ese ajuste guardado en vez de arrancar en 0, para no tener que

  const offsetGuardado = cargarOffsetLocalDeStorage(files[0]);
  est.offsetLocalDelta = offsetGuardado != null ? offsetGuardado : 0;
  // v3.174: (a pedido) secciones locales propias — mismo patrón que el

  est.seccionesLocales = cargarSeccionesLocalDeStorage(files[0]) || [];
  // v3.138: el CUE es de reproducción, no de calibración de tempo — un
  // archivo nuevo no tiene por qué compartir el punto de arranque del
  // anterior (podría caer en medio de una sección totalmente distinta).
  est.cuePlayback = null;
  // v3.146: (a pedido) "si cargo un [archivo] olvidemos el otro" — los
  // overrides de sesión que vienen del TAG del archivo anterior
  // (BPM ajustado por "Ajustar click a X", tonalidad ajustada por

  // distinto — se resetean acá, mismo criterio que offset/CUE/taps

  // ajustes (slider, no por tag) NO se tocan — esos son una decisión
  // del músico para la sesión, no algo que "vino" del archivo viejo.
  est.bpmOverride = null;
  est.tonalidadOverride = undefined;
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
  const panelOffset = document.getElementById('offsetlocal-' + uid);
  if(panelOffset) panelOffset.style.display = 'flex';
  const panelFiltros = document.getElementById('filtroslocal-' + uid);

  actualizarUIOffsetLocalPractica(uid);

  const infoBpm = document.getElementById('offsetlocalbpminfo-' + uid);

  // (a pedido) los taps de calibración de tempo son de UN archivo

  est.calibTaps = [];
  const taplabel = document.getElementById('taplabel-' + uid);
  if(taplabel) taplabel.textContent = 'Taps: 0';
  const btnBuscarMas = document.getElementById('offsetlocalbuscarmas-' + uid);
  if(btnBuscarMas) btnBuscarMas.style.display = 'none';
  // (a pedido) intenta ubicar el offset solo con el audio, sin que el
  // músico tenga que tocar nada — ver detectarOffsetAutomaticoPractica.
  // Es asíncrono (decodifica el archivo entero), así que no bloquea el
  // resto de esta función ni el resto de la carga.
  // (a pedido) se guarda el File (no solo la URL) para poder usar el
  // botón de detección automática y "Buscar más allá" sin pedirle al
  // músico que lo vuelva a elegir del dispositivo. Ya NO se dispara la
  // detección sola acá — ahora es el botón "🔍 Detectar comienzo
  // automáticamente" del panel el que la arranca.
  est.archivoLocalFile = files[0];
  // v3.174: refresca la lista editable y el mapa de estructura de
  // arriba (mismo bloque visual que ya usan las secciones del tema)
  // con las secciones locales recién cargadas (o vacío si es la

  actualizarListaSeccionesLocalesPractica(uid);
  actualizarMapaEstructuraPractica(uid);
  const nombreSpan = document.getElementById('archivolocalnombre-' + uid);
  if(nombreSpan) nombreSpan.textContent = '🎵 ' + est.archivoLocalFile.name;
  // v3.53: (a pedido) el mismo nombre también arriba, junto al título
  // (nuevo span archivonombretop-${uid}, ver bloquePracticaHtml) — para

  const nombreSpanTop = document.getElementById('archivonombretop-' + uid);
  if(nombreSpanTop) nombreSpanTop.textContent = '🎵 ' + est.archivoLocalFile.name;
  // v3.131: (a pedido) info de tags ID3 del archivo elegido — puramente
  // informativo (esta pantalla no guarda nada en el tema), para que el
  // músico compare BPM/Tonalidad detectados contra lo ya configurado.
  mostrarTagsDetectadosLocal(uid, est.archivoLocalFile);
  // v3.28: avisa si se recuperó un offset guardado de una calibración

  if(offsetGuardado != null){
    const info = document.getElementById('offsetlocalauto-' + uid);
    if(info) info.textContent = `Se recuperó el ajuste guardado de la vez anterior con este archivo (${(offsetGuardado >= 0 ? '+' : '') + offsetGuardado.toFixed(2)}s).`;
  }

  const yt = document.getElementById('yt-' + uid);
  const audioOriginal = document.getElementById('audio-' + uid);
  if(yt) yt.style.display = 'none';
  if(audioOriginal) audioOriginal.style.display = 'none';
  if(est.ytPlayer && typeof est.ytPlayer.pauseVideo === 'function'){
    try{ est.ytPlayer.pauseVideo(); }catch(e){}
  }

  const audioLocal = document.getElementById('local-' + uid);
  audioLocal.style.display = 'block';
  audioLocal.src = url;
  // (a pedido) entrenador de velocidad — cada archivo nuevo arranca a
  // 100%, y se activa preservesPitch para que bajar la velocidad no
  // suene "grave/chipmunk", solo más lento (soportado en navegadores
  // modernos; si no existe la propiedad, se ignora sin romper nada).
  // v3.48: preservesPitch solo existe en el <audio> nativo (Web Audio
  // no lo soporta) — por eso a 100% se usa el motor Web Audio (loop
  // exacto) y en cuanto se cambia la velocidad se pasa a este <audio>
  // nativo (tono correcto, loop con el mecanismo de vigilar-y-saltar de
  // siempre). Ver cambiarMotorLocalPractica/ajustarVelocidadLocalPractica.
  est.velocidadLocal = 1;
  audioLocal.playbackRate = 1;
  audioLocal.preservesPitch = true;
  audioLocal.mozPreservesPitch = true;
  audioLocal.webkitPreservesPitch = true;
  const velInput = document.getElementById('velocidadlocalbpm-' + uid);
  if(velInput){
    const bpmBaseReset = est.bpmEfectivo || est.bpm;
    velInput.value = bpmBaseReset ? formatBpm(bpmBaseReset) : '';
  }
  est.audioLocalEl = audioLocal;

  // v3.183: filtros de tono — el <audio> nativo se conecta a Web Audio
  // UNA SOLA VEZ en la vida del elemento (createMediaElementSource no
  // se puede llamar 2 veces sobre el mismo <audio>), se reusa en cada
  // archivo nuevo que se cargue con este mismo uid. A partir de acá,
  // este <audio> deja de sonar directo — su salida real es siempre a
  // través de esta cadena (en neutro, no filtra nada audible).
  if(!est.audioLocalSourceLocal){
    obtenerFiltrosPractica(uid);
    est.audioLocalSourceLocal = obtenerAudioCtxPractica().createMediaElementSource(audioLocal);
    est.audioLocalSourceLocal.connect(est.filtroHighpass);
  }
  // cada archivo nuevo arranca sin filtrar (mismo criterio que la
  // velocidad) — los NODOS no se recrean, solo vuelven a su neutro.
  if(est.filtroHighpass) est.filtroHighpass.frequency.value = 20;
  if(est.filtroLowpass) est.filtroLowpass.frequency.value = 20000;
  ['highpass', 'lowpass'].forEach(tipo => {
    const btn = document.getElementById('filtro' + tipo + 'btn-' + uid);
    const range = document.getElementById('filtro' + tipo + 'range-' + uid);
    const val = document.getElementById('filtro' + tipo + 'val-' + uid);
    if(btn) btn.classList.remove('activo');
    if(range){ range.value = tipo === 'highpass' ? 0 : 100; range.disabled = true; }
    if(val) val.textContent = 'Apagado';
  });

  const barraLocal = document.getElementById('playerbar-' + uid);
  if(barraLocal) barraLocal.style.display = 'flex';
  // v3.19: waveform — se decodifica el archivo una sola vez acá (no
  // por frame); el redibujado del playhead viaja en el mismo tick()
  // de abajo, que ya corre a 60fps mientras suena.
  est.waveformPeaks = null;
  est.waveformDuracion = 0;
  // v3.37: estado del zoom horizontal — 1x por defecto, autoscroll
  // prendido por defecto (coincide con el checkbox tildado en el HTML).
  est.waveformZoom = 1;
  est.waveformAutoScroll = true;
  const waveWrap = document.getElementById('waveformwrap-' + uid);
  const waveToolbar = document.getElementById('waveformtoolbar-' + uid);
  const cueRow = document.getElementById('cuerow-' + uid);
  if(waveWrap) waveWrap.style.display = 'none';
  if(waveToolbar) waveToolbar.style.display = 'none';
  if(cueRow) cueRow.style.display = 'none';
  // v3.95: nuevo archivo/versión — se limpia el aviso de fallback del
  // anterior hasta saber si este nuevo waveform carga o no.
  mostrarSeekFallbackPractica(uid, false);

  // v3.48: motor nativo (<audio>) — SIEMPRE se deja listo, sea el que
  // se use de entrada (si Web Audio falla) o el que entre al cambiar de
  // velocidad. Comparte tick/listeners genéricos con el motor Web Audio
  // (ver conectarMotorLocalPractica) para no duplicar esa lógica.
  conectarListenersMotorLocalPractica(uid, audioLocal);

  if(est.webAudioPlayerLocal){ est.webAudioPlayerLocal.cerrar(); est.webAudioPlayerLocal = null; }
  const cargandoEl = document.getElementById('playercargando-' + uid);
  const playBtn = document.getElementById('playbtn-' + uid);
  if(cargandoEl) cargandoEl.style.display = 'inline';
  if(playBtn) playBtn.disabled = true;
  // v3.48: por defecto arranca en el motor nativo mientras decodifica —
  // así el waveform/duración ya tienen algo con qué mostrar UI básica,
  // y si la decodificación falla, el músico igual puede reproducir de
  // una (ver comentario "nunca sin poder reproducir" en el catch de abajo).
  conectarMotorLocalPractica(uid, audioLocal);

  decodificarArchivoAudio(files[0]).then(audioBuffer => {
    // si el músico ya cambió de archivo mientras esto corría, este
    // resultado quedó viejo — no lo pisamos sobre el nuevo (mismo
    // criterio que ya usaba prepararWaveformLocal desde v3.19).
    if(est.archivoLocalFile !== files[0]) return;
    prepararWaveformDesdeBuffer(uid, audioBuffer);
    const player = crearWebAudioPlayer();
    player.cargarBuffer(audioBuffer);
    // v3.183: reruteo de salida hacia los filtros de tono del archivo
    // local (no afecta al player de la maqueta oficial, que sigue
    // yendo directo a destino — ver crearWebAudioPlayer/conectarSalida).
    obtenerFiltrosPractica(uid);
    player.conectarSalida(est.filtroHighpass);
    conectarListenersMotorLocalPractica(uid, player);
    est.webAudioPlayerLocal = player;
    // v3.48: si el músico ya había cambiado la velocidad (poco probable
    // en el instante que tarda en decodificar, pero por las dudas) no
    // se pisa el motor nativo que ya esté usando a otra velocidad.
    if((est.velocidadLocal || 1) === 1){
      conectarMotorLocalPractica(uid, player);
    }
  }).catch(err => {
    console.error('No se pudo decodificar el audio para loop exacto/waveform:', err);
    // v3.48/v3.19: si falla (formato no soportado, etc.), el músico
    // sigue teniendo el <audio> nativo de siempre — el loop exacto y el
    // waveform son un plus, nunca un requisito para reproducir.
    mostrarSeekFallbackPractica(uid, true);
  }).finally(() => {
    if(cargandoEl) cargandoEl.style.display = 'none';
    if(playBtn) playBtn.disabled = false;
  });
  // v3.46: ya no son los controles nativos del <audio> — ahora el
  // músico le da play desde el playerbar custom cuando quiera.
}

// v3.48: decodifica un File/Blob completo a AudioBuffer — extraído de
// lo que antes hacía prepararWaveformLocal en soledad, ahora se
// reusa también para armar el motor Web Audio del loop (un solo
// decode, no dos). Cierra el AudioContext temporal usado para decodificar
// apenas termina (no el del player, que vive mientras suena).
async function decodificarArchivoAudio(fileOrBlob){
  const arrayBuffer = await fileOrBlob.arrayBuffer();
  const ctxTmp = new (window.AudioContext || window.webkitAudioContext)();
  try{
    return await ctxTmp.decodeAudioData(arrayBuffer);
  } finally {
    try{ ctxTmp.close(); }catch(e){}
  }
}

// v3.48: conecta est.getTiempoActual/getDuracion/seek/pause/play/
// audioActivo a un motor dado (el <audio> nativo o un
// crearWebAudioPlayer()) — ambos exponen la misma interfaz mínima, así
// que cambiar de uno a otro (ver ajustarVelocidadLocalPractica) es solo
// reasignar estas referencias, sin tocar el resto del código que las usa.
// v3.183/v3.186: filtros de tono (pasa-altos/pasa-bajos) — se crean
// una única vez por uid y quedan siempre conectados (highpass->
// lowpass->destino compartido). v3.186: dejaron de ser solo del
// archivo local — TODOS los motores de audio de este uid (archivo
// local nativo + Web Audio, maqueta remota nativa + Web Audio) se
// enchufan a esta MISMA cadena, así el filtro se mantiene sin importar
// qué esté sonando o a qué velocidad. YouTube queda afuera (no expone
// acceso a Web Audio vía iframe API — sin filtro posible ahí).
// Encendido/apagado de cada filtro es solo mover su frequency a un
// valor neutro (20Hz / 20000Hz) — nunca se desconectan del grafo.
function obtenerFiltrosPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return null;
  if(est.filtroHighpass && est.filtroLowpass) return est;
  const ctx = obtenerAudioCtxPractica();
  const highpass = ctx.createBiquadFilter();
  highpass.type = 'highpass';
  highpass.frequency.value = 20;
  const lowpass = ctx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 20000;
  highpass.connect(lowpass);
  lowpass.connect(ctx.destination);
  est.filtroHighpass = highpass;
  est.filtroLowpass = lowpass;
  return est;
}

// v3.184: rangos Hz de cada filtro + mapeo de posición de slider (0-100,
// lineal en pantalla) a Hz en escala LOGARÍTMICA — estándar en audio,
// porque el oído percibe frecuencia de forma logarítmica (misma
// distancia visual entre 20-200Hz que entre 2000-20000Hz).
const FILTRO_RANGOS_HZ = { highpass: [20, 2000], lowpass: [200, 20000] };
function posAFrecuenciaLog(pos, tipo){
  const [min, max] = FILTRO_RANGOS_HZ[tipo];
  const p = Math.max(0, Math.min(100, Number(pos))) / 100;
  return min * Math.pow(max / min, p);
}

function toggleFiltroLocalPractica(uid, tipo){
  const est = obtenerFiltrosPractica(uid);
  if(!est) return;
  const btn = document.getElementById('filtro' + tipo + 'btn-' + uid);
  const range = document.getElementById('filtro' + tipo + 'range-' + uid);
  const val = document.getElementById('filtro' + tipo + 'val-' + uid);
  const nodo = tipo === 'highpass' ? est.filtroHighpass : est.filtroLowpass;
  const neutro = tipo === 'highpass' ? 20 : 20000;
  const activo = btn ? btn.classList.toggle('activo') : false;
  if(range) range.disabled = !activo;
  const hz = activo ? posAFrecuenciaLog(range ? range.value : 0, tipo) : neutro;
  nodo.frequency.value = hz;
  if(val) val.textContent = activo ? Math.round(hz) + ' Hz' : 'Apagado';
}

function ajustarFiltroLocalPractica(uid, tipo, posSlider){
  const est = obtenerFiltrosPractica(uid);
  if(!est) return;
  const nodo = tipo === 'highpass' ? est.filtroHighpass : est.filtroLowpass;
  const hz = posAFrecuenciaLog(posSlider, tipo);
  nodo.frequency.value = hz;
  const val = document.getElementById('filtro' + tipo + 'val-' + uid);
  if(val) val.textContent = Math.round(hz) + ' Hz';
}

function conectarMotorLocalPractica(uid, motor){
  const est = estadoPractica[uid];
  if(!est) return;
  // v3.58: (a pedido) si ya había un motor conectado antes (cambio de
  // velocidad, paso a loop exacto, cambio de versión de maqueta), se
  // traspasa el volumen/mute que el músico haya dejado en el
  // playerbar — sin esto, cada reconexión interna volvía a 100% y
  // sin silenciar, aunque el slider en pantalla siguiera mostrando
  // otro valor.
  if(est.audioActivo && motor !== est.audioActivo){
    try{
      if(typeof est.audioActivo.volume === 'number') motor.volume = est.audioActivo.volume;
      motor.muted = !!est.audioActivo.muted;
    }catch(e){}
  }
  est.getTiempoActual = () => motor.currentTime;
  est.getDuracion = () => motor.duration || 0;
  est.seek = (t) => { motor.currentTime = t; };
  est.pause = () => motor.pause();
  est.play = () => motor.play();
  est.audioActivo = motor;
}

// v3.48: listeners genéricos (play/pause/ended/seeked) — se enganchan
// una vez por motor (nativo y Web Audio comparten la misma interfaz de
// addEventListener). El tick de rAF lee est.audioActivo/est.getTiempoActual
// de forma DINÁMICA (no captura el motor por closure), así que si el
// motor activo cambia a mitad de una reproducción (cambio de velocidad)
// el tick sigue funcionando sin reiniciar nada.
// v3.210: (a pedido) "es posible alternar entre snap de transitorio y
// snap de rejilla?" — un solo interruptor por tema (est.modoSnapClick,
// 'rejilla' por defecto para no cambiar el comportamiento de siempre
// del loop) que decide cómo hacen snap el CUE (📍) y el loop (↻/click)
// marcados con click en la onda. 'rejilla' usa el snap a compás que ya
// existía (snapACompasPractica, respeta clave/bpm/tramos); 'transitorio'
// usa el golpe detectado más cercano (calcularTransientesDesdeBuffer,
// v3.207) si hay uno a menos de 80ms, y si no hay ninguno cerca, cae a
// rejilla igual (el loop nunca queda "suelto" sin snap) — la única
// excepción es el CUE en modo transitorio sin golpe cerca, que cae al
// click crudo (el CUE nunca tuvo snap antes de esta versión, así que
// no tiene un "default seguro" al que caer más que el punto tocado).
function toggleModoSnapPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.modoSnapClick = (est.modoSnapClick === 'transitorio') ? 'rejilla' : 'transitorio';
  actualizarBotonModoSnapPractica(uid);
}
function actualizarBotonModoSnapPractica(uid){
  const est = estadoPractica[uid];
  const btn = document.getElementById('snapmodo-' + uid);
  if(!est || !btn) return;
  const modo = est.modoSnapClick || 'rejilla';
  btn.textContent = modo === 'transitorio' ? '🧲 Golpe' : '🧲 Compás';
  btn.title = modo === 'transitorio'
    ? 'CUE y loop marcados con click hacen snap al GOLPE detectado más cercano. Tocar para cambiar a snap por compás.'
    : 'CUE y loop marcados con click hacen snap al COMPÁS/beat más cercano. Tocar para cambiar a snap por golpe detectado.';
}
// Busca el transitorio detectado más cercano a t, dentro de la
// tolerancia; null si no hay ninguno o no hay transitorios calculados.
function transienteMasCercanoPractica(est, t, tolerancia = 0.08){
  if(!est.waveformTransientes || !est.waveformTransientes.length) return null;
  let masCercano = null, distMin = Infinity;
  for(const tt of est.waveformTransientes){
    const d = Math.abs(tt - t);
    if(d < distMin){ distMin = d; masCercano = tt; }
  }
  return (masCercano != null && distMin <= tolerancia) ? masCercano : null;
}

function conectarListenersMotorLocalPractica(uid, motor){
  const est = estadoPractica[uid];
  if(!est) return;
  const tick = () => {
    const e = estadoPractica[uid];
    if(!e || !e.audioActivo || e.audioActivo.paused) return;
    actualizarContadorPractica(uid, e.getTiempoActual());
    dibujarWaveform(uid, e.getTiempoActual());
    requestAnimationFrame(tick);
  };
  motor.addEventListener('play', () => { marcarReproduccionActiva(uid); actualizarIconoPlayPractica(uid); detenerRespiroWaveform(uid); requestAnimationFrame(tick); });
  motor.addEventListener('pause', () => { actualizarIconoPlayPractica(uid); iniciarRespiroWaveform(uid); });
  motor.addEventListener('ended', () => { actualizarIconoPlayPractica(uid); iniciarRespiroWaveform(uid); });
  motor.addEventListener('seeked', () => {
    const e = estadoPractica[uid];
    if(!e) return;
    actualizarContadorPractica(uid, e.getTiempoActual());
    dibujarWaveform(uid, e.getTiempoActual());
  });
}

// v3.205: (a pedido) el pulso del playhead (dibujarWaveform) solo se
// veía animar mientras sonaba (redibujado por el tick de rAF de
// arriba) — en pausa quedaba fijo en la fase del instante en que se
// pausó. Este loop, mucho más liviano (setTimeout cada 100ms, ~10fps,
// de sobra para una respiración lenta — no hace falta 60fps para
// esto) redibuja SOLO mientras está pausado; se apaga solo apenas
// detecta que volvió a sonar (el tick de rAF ya se encarga a partir
// de ahí) y también explícitamente al tocar play (ver 'play' arriba)
// y al destruir el estado (destruirEstadoPractica).
function iniciarRespiroWaveform(uid){
  const est = estadoPractica[uid];
  if(!est || est.waveformRespiroActivo || !est.waveformPeaks) return;
  est.waveformRespiroActivo = true;
  const loop = () => {
    const e = estadoPractica[uid];
    if(!e || !e.waveformRespiroActivo) return;
    if(e.audioActivo && !e.audioActivo.paused){ e.waveformRespiroActivo = false; return; }
    if(e.getTiempoActual) dibujarWaveform(uid, e.getTiempoActual());
    e.waveformRespiroTimeout = setTimeout(loop, 40);
  };
  loop();
}
function detenerRespiroWaveform(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.waveformRespiroActivo = false;
  clearTimeout(est.waveformRespiroTimeout);
}

// v3.19/v3.48: extrae los picos de amplitud del waveform desde un
// AudioBuffer ya decodificado (antes decodificaba el archivo de nuevo
// acá mismo; ahora recibe el buffer ya listo, sea del flujo normal o
// de una decodificación de respaldo, para no decodificar dos veces).
// v3.55: (a pedido) extrae el public_id de una URL de Cloudinary para
// mostrarlo como "nombre" del archivo — toma el último segmento de la
// ruta (después de la última "/"), le saca la extensión, y cambia
// guiones bajos/medios por espacios para que se lea más natural. Si
// el preset no usa el nombre real como public_id, esto va a mostrar
// el código aleatorio de siempre (no hay forma de distinguirlo desde
// acá) — es una limitación conocida, no un bug.
function nombrePublicIdDesdeUrl(url){
  if(!url) return '';
  try{
    const sinQuery = url.split('?')[0];
    const partes = sinQuery.split('/');
    let ultimo = partes[partes.length - 1] || '';
    ultimo = ultimo.replace(/\.[a-zA-Z0-9]{2,5}$/, ''); // saca extensión
    ultimo = ultimo.replace(/[_-]+/g, ' ').trim();
    return ultimo;
  }catch(e){ return ''; }
}

// v3.95: (a pedido) el slider playerseek queda oculto por defecto (el
// waveform ya tiene click-to-seek) — esta función lo muestra solo
// cuando el waveform no está disponible (decode falló), como red de
// seguridad para no dejar al músico sin forma de saltar en la pista.
function mostrarSeekFallbackPractica(uid, mostrar){
  const seek = document.getElementById('playerseek-' + uid);
  const aviso = document.getElementById('seekfallbackaviso-' + uid);
  if(seek) seek.style.display = mostrar ? '' : 'none';
  if(aviso) aviso.style.display = mostrar ? '' : 'none';

// v3.207: (a pedido) detector de MÚLTIPLES transitorios (a diferencia
// de detectarOffsetAutomaticoPractica, que solo busca el primero para
// fijar el offset automáticamente). Divide la señal en ventanas de
// 20ms, mide energía RMS por ventana, y marca un transitorio donde la
// energía sube abruptamente (factorSalto) respecto al promedio de las
// ventanas previas — así detecta golpes en cualquier punto del tema,
// no solo diferencias contra silencio. pisoAbsoluto descarta subidas
// débiles (ruido/hiss) y refractarioVentanas evita marcar el mismo
// golpe dos veces (mínimo ~90ms entre transitorios detectados). No
// pretende ser un detector "profesional" (no separa por banda de
// frecuencia, por ejemplo), pero alcanza de sobra para el uso acá:
// dar puntos de referencia para hacer snap al clickear a mano.
function calcularTransientesDesdeBuffer(datos, sampleRate){
  const ventanaSamples = Math.max(1, Math.floor(sampleRate * 0.02));
  const numVentanas = Math.floor(datos.length / ventanaSamples);
  if(numVentanas < 10) return [];
  const rms = new Float32Array(numVentanas);
  for(let i = 0; i < numVentanas; i++){
    let suma = 0;
    const inicio = i * ventanaSamples;
    for(let j = 0; j < ventanaSamples; j++){
      const v = datos[inicio + j] || 0;
      suma += v * v;
    }
    rms[i] = Math.sqrt(suma / ventanaSamples);
  }
  let picoGlobalRms = 0;
  for(let i = 0; i < numVentanas; i++) if(rms[i] > picoGlobalRms) picoGlobalRms = rms[i];
  if(picoGlobalRms <= 0) return [];
  const PROMEDIO_VENTANAS = 8; // ~160ms de historial reciente
  const FACTOR_SALTO = 1.6;
  const pisoAbsoluto = picoGlobalRms * 0.08;
  const refractarioVentanas = Math.round(0.09 / 0.02); // ~90ms mínimo entre golpes
  const transientes = [];
  let ultimaVentana = -refractarioVentanas;
  for(let i = PROMEDIO_VENTANAS; i < numVentanas; i++){
    if(rms[i] < pisoAbsoluto) continue;
    let sumaPrevia = 0;
    for(let k = i - PROMEDIO_VENTANAS; k < i; k++) sumaPrevia += rms[k];
    const promedioPrevio = sumaPrevia / PROMEDIO_VENTANAS;
    if(rms[i] > promedioPrevio * FACTOR_SALTO && (i - ultimaVentana) >= refractarioVentanas){
      transientes.push((i * ventanaSamples) / sampleRate);
      ultimaVentana = i;
    }
  }
  return transientes;
}

function prepararWaveformDesdeBuffer(uid, audioBuffer){
  const est = estadoPractica[uid];
  if(!est) return;
  const datos = audioBuffer.getChannelData(0);
  // v3.38: (a pedido) más picos (antes 140) para que el waveform se
  // vea nítido incluso zoomeado (v3.37 agregó zoom hasta 8x, y con
  // pocos picos las barras se veían anchas/cuadradas al acercarse).
  // El costo es solo un array de floats en memoria (unos pocos KB);
  // el trabajo pesado (decodificar el archivo entero) ya se hace sí
  // o sí para tener est.waveformDuracion, así que esto no agrega
  // peso de descarga ni tiempo de carga perceptible.
  const NUM_PICOS = 1000;
  const tam = Math.floor(datos.length / NUM_PICOS);
  const picos = [];
  for(let i = 0; i < NUM_PICOS; i++){
    let max = 0;
    const inicio = i * tam;
    for(let j = 0; j < tam; j++){
      const v = Math.abs(datos[inicio + j] || 0);
      if(v > max) max = v;
    }
    picos.push(max);
  }
  const picoGlobal = Math.max(...picos) || 1;
  for(let i = 0; i < picos.length; i++){
    picos[i] = picos[i] / picoGlobal;
  }
  est.waveformPeaks = picos;
  est.waveformDuracion = audioBuffer.duration;
  // v3.207: (a pedido) "a veces el automático no define el transitorio
  // que quiero, entonces si clickeo cerca hago snap" — se calculan
  // TODOS los transitorios del archivo (no solo el primero, que es lo
  // único que usa detectarOffsetAutomaticoPractica) reutilizando el
  // mismo buffer ya decodificado acá, sin volver a decodificar el
  // archivo. Se usan luego en el click de "marcar inicio" (ver más
  // abajo, en el handler de click de la onda) para ajustar el click
  // del músico al golpe más cercano si cae cerca, en vez de forzarlo a
  // acertar el pixel exacto a mano.
  est.waveformTransientes = calcularTransientesDesdeBuffer(datos, audioBuffer.sampleRate);
  actualizarUIOffsetLocalPractica(uid);
  actualizarBotonModoSnapPractica(uid);
  mostrarSeekFallbackPractica(uid, false);
  const waveWrap = document.getElementById('waveformwrap-' + uid);
  const waveToolbar = document.getElementById('waveformtoolbar-' + uid);
  const cueRow = document.getElementById('cuerow-' + uid);
  if(waveWrap) waveWrap.style.display = 'block';
  if(waveToolbar) waveToolbar.style.display = 'flex';
  if(cueRow) cueRow.style.display = 'flex';
  dibujarWaveform(uid, est.getTiempoActual());
  iniciarRespiroWaveform(uid);
  // v3.188: (a pedido, portado de ensayo.html v3.193) "el waveform no
  // ocupa el ancho completo en mobile" — dibujarWaveform mide
  // wrapEl.clientWidth UNA vez y fija canvas.style.width a ese valor
  // en px. Si esa primera medición ocurre antes de que el layout final
  // del contenedor esté asentado (layout tardío, rotación sin evento
  // de resize de ventana), el canvas queda pegado a un ancho viejo. El
  // ResizeObserver detecta cualquier cambio real de tamaño del
  // contenedor y dispara incluso en el primer layout — un solo
  // observer por uid (se guarda en est.waveformResizeObserver, y se
  // desconecta en destruirEstadoPractica) para no ir acumulando
  // observers cada vez que se vuelve a cargar un archivo local/versión
  // del mismo uid.
  if(waveWrap && typeof ResizeObserver !== 'undefined'){
    if(est.waveformResizeObserver) est.waveformResizeObserver.disconnect();
    est.waveformResizeObserver = new ResizeObserver(() => {
      if(est.getTiempoActual) dibujarWaveform(uid, est.getTiempoActual());
    });
    est.waveformResizeObserver.observe(waveWrap);
  }
}

// v3.19: (compatibilidad) misma firma de siempre por si algo la sigue
// llamando con un File en vez de un AudioBuffer — decodifica y delega
// en prepararWaveformDesdeBuffer.
async function prepararWaveformLocal(uid, file){
  const est = estadoPractica[uid];
  if(!est) return;
  try{
    const audioBuffer = await decodificarArchivoAudio(file);
    if(est.archivoLocalFile !== file) return;
    prepararWaveformDesdeBuffer(uid, audioBuffer);
  }catch(err){
    console.error('No se pudo generar el waveform:', err);
  }
}

// v3.20: dibuja barras (tocado=lila, resto=gris), ticks de
// compás cada N (N se elige para no saturar ni dejar el waveform
// pelado, ver intervaloCompasesWaveform) y la franja del loop manual
// si hay uno activo. Se llama por frame mientras suena (liviano: ~140
// rects + unas pocas líneas) y también cada vez que cambia offset o
// loop, para que los ticks/la franja queden alineados al instante.
// v3.34: alto de la zona de barras+ticks (fijo) y alto de cada
// carril de etiquetas (se suman abajo, tantos como hagan falta).
const WAVEFORM_ONDA_MIN_H = 64;
const WAVEFORM_ONDA_MAX_H = 130;
const WAVEFORM_LANE_H = 20;
const WAVEFORM_MAX_CARRILES = 6;

function dibujarWaveform(uid, tiempoActual){
  const est = estadoPractica[uid];
  const canvas = document.getElementById('waveformcanvas-' + uid);
  if(!est || !canvas || !est.waveformPeaks) return;
  const ctxDraw = canvas.getContext('2d');
  // v3.36: (a pedido) antes el canvas dibujaba siempre en una
  // resolución interna fija (700 de ancho) y el navegador la
  // "achicaba" con CSS al ancho real de pantalla (width:100%). En un
  // celular angosto eso comprime todo horizontalmente pero el alto
  // quedaba exacto en px → texto y líneas se veían aplastados/
  // alargados, no uniformes. Ahora se mide el ancho real en pantalla
  // (canvas.clientWidth, en "px CSS") y se usa ESE como sistema de
  // coordenadas para dibujar — más devicePixelRatio, para que el
  // texto salga nítido en pantallas de alta densidad (la mayoría de
  // celulares) en vez de verse borroso.
  const dpr = window.devicePixelRatio || 1;
  // v3.37: (a pedido) zoom horizontal — W ya no es "el ancho visible
  // del canvas" (eso cambia todo el tiempo si el canvas es más ancho
  // que la pantalla y hay scroll), sino el ancho del WRAP (lo que se
  // ve en pantalla, sin scrollear) multiplicado por el nivel de zoom.
  // A zoom 1x esto es exactamente lo mismo que v3.36 (wrap y canvas
  // miden lo mismo). A zoom 2x, 3x, etc. el canvas se dibuja más
  // ancho que la pantalla y el wrap (que tiene overflow-x:auto) deja
  // scrollearlo.
  const wrapEl = document.getElementById('waveformwrap-' + uid);
  const wrapWidth = (wrapEl && wrapEl.clientWidth) || canvas.clientWidth || 700;
  const zoom = est.waveformZoom || 1;
  const W = Math.round(wrapWidth * zoom);
  // v3.202: (a pedido, "escala la altura dentro del rango razonable",
  // mobile first) antes WAVEFORM_ONDA_H era fijo en 90px siempre. Ahora
  // escala con el ancho REAL disponible (wrapWidth, no afectado por
  // zoom — el alto de la onda no debe crecer solo porque el músico
  // acercó horizontalmente), acotado entre 64px (celular angosto, para
  // no comerse pantalla) y 130px (tablet/desktop, para aprovechar el
  // espacio de sobra sin exagerar). 0.22 da ~90px en un ancho típico de
  // celular (~370-400px, el caso ya validado en v3.34-v3.192), así el
  // caso más común no cambia perceptiblemente.
  const ondaH = Math.round(Math.min(WAVEFORM_ONDA_MAX_H, Math.max(WAVEFORM_ONDA_MIN_H, wrapWidth * 0.22)));
  const dur = est.waveformDuracion || 1;
  const estilos = getComputedStyle(document.documentElement);
  const colorOk = estilos.getPropertyValue('--ok').trim() || '#4caf7d';
  const colorProgreso = '#a78bd6';
  const colorFaint = estilos.getPropertyValue('--faint').trim() || '#5c5a55';
  const colorGold = estilos.getPropertyValue('--gold').trim() || '#c9a24b';
  // v3.228: (port de ensayo.html v3.278) la línea de la regla de compás
  // (principal y secundaria, marca el primer tiempo de cada compás
  // visible) pasa de dorado a rojo — solo la LÍNEA, el número/hora
  // arriba sigue dorado (fillStyle, sin tocar).
  const colorPrimerTiempo = estilos.getPropertyValue('--err').trim() || '#d4574a';
  const colorVeloSinSeccion = estilos.getPropertyValue('--velo-sin-seccion').trim() || 'rgba(0,0,0,0.45)';

  // v3.27: (a pedido) fx de "encendido" al pasar por un tick/sección —
  // se detecta el cruce comparando el tiempo de este frame contra el
  // del frame anterior (est.waveformTiempoPrevio). Si el salto es
  // grande (seek manual) no se dispara nada, solo en avance normal de
  // reproducción, para no generar flashes falsos al saltar de punto.
  const tPrevFrame = (est.waveformTiempoPrevio != null) ? est.waveformTiempoPrevio : tiempoActual;
  const avanceNormal = tiempoActual > tPrevFrame && (tiempoActual - tPrevFrame) < 1.5;
  const ahora = performance.now();
  const FLASH_MS = 280;

  // v3.34: las secciones (y cuántos carriles de etiquetas hacen
  // falta) se calculan ACÁ, antes de dibujar nada, porque el alto
  // final del canvas depende de eso. La asignación de carril de cada
  // etiqueta se guarda en infoSecciones y se reusa más abajo al
  // dibujar, para no recalcular dos veces con resultados distintos.
  // v3.136: (a pedido) "ocultar etiquetas de estructura" también en el
  // waveform — tratamos las secciones como vacías para TODO lo que se
  // dibuja acá (líneas de inicio/fin de sección, etiquetas de nombre,
  // Y el resaltado dorado de sección activa, que también depende de
  // infoSecciones/idxSeccionActiva más abajo). La franja verde de LOOP
  // y la barra de progreso/playhead son independientes de esto (no
  // usan secciones) y siguen dibujándose igual, como corresponde.
  const secciones = seccionesRuntimeDe(est).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  const infoSecciones = []; // {sec, tSec, sx, color, nombreSec, anchoNombre, carril}
  ctxDraw.font = 'bold 14px monospace'; // tamaño más grande (con flash) para medir con margen de sobra
  // v3.49: (a pedido) offsetEfectivo/bpmParaTicks/secPerBar se movieron
  // acá arriba (antes se calculaban más abajo, junto a los ticks) para
  // poder snapear también la línea de cada sección a la MISMA grilla de
  // los ticks — antes la línea usaba desdeSegundos crudo, así que con
  // cualquier imprecisión de origen (o un offset distinto al que había
  // cuando se autoró la sección en guia-practica.html) se veía corrida
  // del tick real, aunque el loop nativo (est.loopInicio, ver
  // actualizarContadorPractica) ya cerrara bien. Ahora tick y línea de
  // sección usan el mismo cálculo — siempre van a coincidir.
  const offsetEfectivo = (est.offset || 0) + (est.offsetLocalDelta || 0);
  // v3.147: (a pedido, revierte v3.146) bpmParaTicks vuelve a usar
  // bpmEfectivo (con override) — el músico quiere que la regla/loop
  // sigan el BPM REAL del archivo local cargado (detectado por tag),
  // no el guardado en el tema de staff, cuando hay un override activo
  // (botón "Ajustar click a X"). Antes de tocar ese botón, bpmEfectivo
  // === est.bpm, así que no cambia nada hasta que el músico decide
  // aplicar el detectado.
  const bpmParaTicks = est.bpmEfectivo || est.bpm;
  const secPerBar = (60 / bpmParaTicks) * compasEfectivoDe(est);
  secciones.forEach((sec, i) => {
    const tSecCrudo = sec.desdeSegundos || 0;
    // v3.111: FIX — v3.109 anclaba este snap contra offsetEfectivo (el
    // offset GLOBAL del tema); pero tSecCrudo YA ES el borde real de
    // ESTE tramo (es el propio desdeSegundos de la sección), así que
    // el ancla correcta es él mismo — snapear contra su propio inicio
    // siempre da el mismo valor (sin drift de tramos anteriores con
    // compás distinto). Se deja tSec = tSecCrudo directo: matemáticamente
    // es el mismo resultado que llamar a snapACompasPractica con ese
    // ancla, sin la llamada de más.
    const tSec = tSecCrudo;
    // v3.188: FIX — antes era `tSec <= 0`, así que cualquier sección que
    // arranca justo en el segundo 0 se saltaba entera (sin línea, sin
    // etiqueta, sin resaltado de "sección activa"). Detectado primero en
    // ensayo.html (mismo motor portado sin tocar su lógica), donde es
    // habitual marcar la primera sección justo al arrancar la pista —
    // acá el mismo bug estaba latente aunque se note menos (una maqueta
    // autorada rara vez arranca justo en 0:00). `tSec < 0` deja pasar
    // ese caso; labelX = sx+1 nunca queda negativo, sin riesgo de
    // desborde visual.
    if(tSec < 0 || tSec >= dur) return;
    const sx = (tSec / dur) * W;
    const color = colorDeSeccionEnLista(secciones, i);
    const nombreCrudo = String(sec.nombre || '');
    // v3.124: (a pedido) antepone la letra de ensayo (A/B/C…) al nombre
    // en la etiqueta del waveform — mismo dato que ya se ve en el PDF
    // (exportarEstructuraPDF de guia-practica.html), calculado con la
    // función portada arriba. Se resuelve contra est.secciones (orden
    // ORIGINAL, no `secciones` que es la copia de acá ordenada por
    // tiempo — ver comentario largo junto a letraEnsayoSugerida). Si el
    // nombre está vacío, se sigue sin dibujar nada (mismo criterio de
    // siempre, más abajo) — una sección sin nombre no muestra ni letra
    // ni etiqueta.
    const letraSec = nombreCrudo ? letraEnsayoDeSeccion(est.secciones || [], sec) : '';
    const nombreCompleto = nombreCrudo ? (letraSec ? `${letraSec} · ${nombreCrudo}` : nombreCrudo) : '';
    // v3.202: (a pedido, "ajusta las etiquetas", mobile first) a zoom
    // bajo (1x-2x, la vista por defecto en celular) mostrar el nombre
    // completo de cada sección amontona texto sobre la onda angosta.
    // Con letra de ensayo disponible (A/B/C…) se muestra SOLO la letra
    // a ese nivel de zoom — el nombre completo sigue disponible al
    // acercar (zoom 3x+, más espacio real en pantalla). Sin letra
    // (sección sin nombre reconocido en la letra de ensayo), no hay
    // nada más corto que mostrar, así que se deja el nombre completo
    // igual que siempre.
    const nombreSec = (zoom <= 2 && letraSec) ? letraSec : nombreCompleto;
    const anchoNombreSolo = nombreSec ? ctxDraw.measureText(nombreSec).width : 0;
    // v3.105: (a pedido) la nota de sección va PEGADA al lado del
    // nombre, mismo renglón (como en el PDF) — se dejó de usar un
    // carril propio por debajo (v3.104). Truncada corta (16 car. + "…",
    // contra los 70 del PDF) y con fuente más chica/tenue para que siga
    // siendo claramente secundaria frente al nombre. anchoNombre pasa a
    // ser el ancho TOTAL (nombre + separador + nota) — así el cálculo de
    // carril de más abajo (que no cambió) sigue evitando choques sin
    // agregar lógica nueva: una sección vecina larga se corre sola igual
    // que antes, ahora contemplando también el espacio que ocupa la nota.
    const notaCruda = (sec.notaSeccion || '').trim();
    const notaSec = notaCruda.length > 16 ? notaCruda.slice(0, 16) + '…' : notaCruda;
    ctxDraw.font = 'italic 11px monospace';
    const anchoNota = notaSec ? ctxDraw.measureText(notaSec).width : 0;
    ctxDraw.font = 'bold 14px monospace'; // vuelve al tamaño de medición del nombre
    const SEP_NOTA = 6;
    const anchoNombre = anchoNombreSolo + (notaSec ? SEP_NOTA + anchoNota : 0);
    infoSecciones.push({ sec, tSec, sx, color, nombreSec, anchoNombre, anchoNombreSolo, notaSec });
  });
  // asigna carril (0 = pegado a la onda, va creciendo hacia abajo):
  // primer carril libre donde la etiqueta no choca con la anterior de
  // ese carril; si los WAVEFORM_MAX_CARRILES están ocupados, usa el
  // que deje pasar antes (el que menos se superpone), para no perder
  // etiquetas aunque queden encimadas en un caso extremo.
  const GAP_ETIQUETAS = 4;
  const carrilesFinX = new Array(WAVEFORM_MAX_CARRILES).fill(-Infinity);
  let carrilMaxUsado = 0;
  infoSecciones.forEach(info => {
    if(!info.nombreSec){ info.carril = 0; return; }
    const labelX = info.sx + 1;
    let elegido = -1;
    for(let c = 0; c < WAVEFORM_MAX_CARRILES; c++){
      if(labelX >= carrilesFinX[c] + GAP_ETIQUETAS){ elegido = c; break; }
    }
    if(elegido === -1){
      // ninguno libre: el que menos se superpone (fin más lejano hacia atrás)
      elegido = 0;
      for(let c = 1; c < WAVEFORM_MAX_CARRILES; c++){
        if(carrilesFinX[c] < carrilesFinX[elegido]) elegido = c;
      }
    }
    carrilesFinX[elegido] = labelX + info.anchoNombre + 6;
    info.carril = elegido;
    if(elegido > carrilMaxUsado) carrilMaxUsado = elegido;
  });
  const nCarriles = infoSecciones.some(i => i.nombreSec) ? (carrilMaxUsado + 1) : 0;
  const H = ondaH + nCarriles * WAVEFORM_LANE_H;
  // v3.36: la resolución física del canvas es (ancho real × dpr) por
  // (alto × dpr) — solo se toca cuando cambió algo (ancho de pantalla,
  // cantidad de carriles, o dpr), para no forzar un reset en cada
  // frame mientras suena. setTransform deja el resto del código de
  // dibujo intacto: sigue trabajando en píxeles "CSS" (W, H) de
  // siempre, sin tener que multiplicar cada coordenada por dpr.
  if(canvas.dataset.cssW != W || canvas.dataset.cssH != H || canvas.dataset.dpr != dpr){
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; // v3.37: explícito (antes width:100% del CSS alcanzaba porque nunca era más ancho que el wrap)
    canvas.style.height = H + 'px';
    canvas.dataset.cssW = W;
    canvas.dataset.cssH = H;
    canvas.dataset.dpr = dpr;
  }
  ctxDraw.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctxDraw.clearRect(0, 0, W, H);

  // v3.218: (a pedido) "que el velo afecte el waveform como en el
  // tema claro" — el cálculo de rangos se mantiene acá (no depende de
  // las barras), pero el DIBUJO del velo (antes acá mismo, "detrás de
  // todo") se movió a después de dibujar las barras (ver más abajo,
  // junto al loop de picos) — dibujado ANTES, un fillRect semitrans-
  // parente detrás de barras 100% opacas no las oscurece en absoluto,
  // solo se nota en los huecos entre barras y en el carril de
  // etiquetas; por eso en tema oscuro (barras grises sobre fondo casi
  // negro) prácticamente no se sentía aunque se subiera la opacidad.
  // Dibujado DESPUÉS, sí tiñe los píxeles reales de la onda.
  const rangosConSeccion = infoSecciones.map((info, i) => {
    const finManual = info.sec.hastaSegundos;
    let fin;
    if(finManual != null){
      const beatsSec = beatsPorBarraDeSeccionMusico(info.sec, compasEfectivoDe(est));
      fin = snapACompasPractica(finManual, bpmParaTicks, beatsSec, info.tSec);
    } else if(infoSecciones[i + 1]){
      fin = infoSecciones[i + 1].tSec;
    } else {
      fin = dur;
    }
    return { inicio: info.tSec, fin: Math.min(Math.max(fin, info.tSec), dur) };
  });

  // v3.51: (a pedido) franja de fondo para la SECCIÓN seleccionada
  // (chip activo) — distinta de la franja del loop de abajo (esa es
  // colorOk/verde; esta es dorada) para poder distinguir "estoy en
  // esta sección" de "el loop está marcado acá", aunque coincidan.
  // Usa el mismo tSec snapeado que ya calcula infoSecciones (misma
  // grilla que ticks y líneas, ver nota v3.49 más arriba) para que el
  // borde de la franja coincida exacto con la línea de la sección.
  let idxSeccionActiva = -1;
  for(let i = 0; i < infoSecciones.length; i++){
    if(tiempoActual >= infoSecciones[i].tSec) idxSeccionActiva = i;
  }
  // v3.193: (a pedido, portado de ensayo.html v3.212) si el músico
  // deseleccionó a mano esta sección (desactivarSeccionResaltada), no
  // se pinta la franja dorada aunque tiempoActual siga cayendo
  // adentro — se vuelve a pintar sola apenas el playback realmente
  // cruza a otra sección (ver reset de est.seccionDesactivadaSegundos
  // en actualizarContadorPractica).
  const estaDesactivadaManual = idxSeccionActiva !== -1
    && est.seccionDesactivadaSegundos != null
    && Math.abs(desdeRawSeccion(infoSecciones[idxSeccionActiva].sec) - est.seccionDesactivadaSegundos) < 0.001;
  if(idxSeccionActiva !== -1 && !estaDesactivadaManual){
    const infoAct = infoSecciones[idxSeccionActiva];
    const finManual = infoAct.sec.hastaSegundos;
    let tFinActiva;
    if(finManual != null){
      // v3.109: beats de la propia sección activa (compasOverride).
      const beatsActiva = beatsPorBarraDeSeccionMusico(infoAct.sec, compasEfectivoDe(est));
      // v3.111: FIX — ancla contra infoAct.tSec (el inicio real de ESTE
      // tramo, ya resuelto arriba) en vez de offsetEfectivo (global).
      // Mismo criterio de "reinicio en el borde": finManual snapea a la
      // grilla propia de esta sección, no a la del tema completo.
      tFinActiva = snapACompasPractica(finManual, bpmParaTicks, beatsActiva, infoAct.tSec);
    } else if(infoSecciones[idxSeccionActiva + 1]){
      tFinActiva = infoSecciones[idxSeccionActiva + 1].tSec;
    } else {
      tFinActiva = dur;
    }
    const xA = (infoAct.tSec / dur) * W;
    const xB = (Math.min(tFinActiva, dur) / dur) * W;
    ctxDraw.fillStyle = colorGold + '29';
    ctxDraw.fillRect(xA, 0, Math.max(1, xB - xA), H);
  }

  // franja de loop (si hay uno marcado), detrás de todo lo demás
  if(est.loopInicio != null && est.loopFin != null){
    const x1 = (est.loopInicio / dur) * W;
    const x2 = (est.loopFin / dur) * W;
    ctxDraw.fillStyle = colorOk + '33';
    ctxDraw.fillRect(x1, 0, Math.max(1, x2 - x1), H);
  }

  const picos = est.waveformPeaks;
  // v3.38: (a pedido junto con subir NUM_PICOS a 1000) el gap fijo de
  // 2px entre barras funcionaba con 140 picos, pero con 1000 picos en
  // una pantalla angosta sin zoom el espacio por pico puede ser menor
  // a 2px — daba barras de ancho negativo (no se dibujaban, waveform
  // "vacío"). Ahora el gap es proporcional al espacio disponible por
  // pico (slot), nunca más grande que ese espacio, así bw siempre da
  // positivo. A zoom alto (más espacio por pico) el gap vuelve a
  // acercarse a 2px, como siempre.
  const slot = W / picos.length;
  const gap = Math.min(2, slot * 0.25);
  const bw = Math.max(0.4, slot - gap);
  const progressX = (tiempoActual / dur) * W;
  const ALTO_BARRAS = 0.68; // proporción DENTRO de la zona fija de la onda (ondaH)
  for(let i = 0; i < picos.length; i++){
    const x = i * slot;
    const h = Math.max(2, picos[i] * ondaH * ALTO_BARRAS);
    const y = (ondaH - h) / 2; // centradas dentro de la zona de la onda, nunca invade la zona de etiquetas
    ctxDraw.fillStyle = (x < progressX) ? colorProgreso : colorFaint;
    ctxDraw.fillRect(x, y, bw, h);
  }

  // v3.218: velo de zonas sin sección (rangosConSeccion, calculado
  // arriba) dibujado ACÁ, encima de las barras recién pintadas — así
  // sí tiñe sus píxeles (antes iba detrás de las barras, ver v3.214,
  // y al ser estas 100% opacas el velo no se notaba salvo en los
  // huecos entre barras). Franjas de sección activa/loop (dorada/
  // verde, dibujadas más arriba) quedan debajo de las barras a
  // propósito — son fondos de "contexto", no un tinte sobre la onda.
  ctxDraw.fillStyle = colorVeloSinSeccion;
  let cursorSinSeccion = 0;
  rangosConSeccion.forEach(r => {
    if(r.inicio > cursorSinSeccion){
      const xA = (cursorSinSeccion / dur) * W;
      const xB = (r.inicio / dur) * W;
      ctxDraw.fillRect(xA, 0, Math.max(0, xB - xA), H);
    }
    cursorSinSeccion = Math.max(cursorSinSeccion, r.fin);
  });
  if(cursorSinSeccion < dur){
    const xA = (cursorSinSeccion / dur) * W;
    ctxDraw.fillRect(xA, 0, Math.max(0, W - xA), H);
  }

  // ticks de compás — usan el mismo offset efectivo que ya calcula el
  // metrónomo (est.offset + est.offsetLocalDelta), así el primer tick
  // cae exacto donde el metrónomo marca el tiempo 1.
  // v3.25 (histórico, superado por v3.192 abajo): pasó de dinámica
  // (intervaloCompasesWaveform, por duración/tempo) a FIJA cada 16
  // siempre. (offsetEfectivo/bpmParaTicks/secPerBar se calculan arriba,
  // junto a infoSecciones — ver nota v3.49 ahí.)
  // v3.192: (a pedido, portado de ensayo.html v3.204, mobile first)
  // resolución ADAPTATIVA según el espacio real en pantalla — antes
  // era fija (cada=16 siempre, ver historial v3.25). Mismo principio
  // que ya usa v3.38 para el gap del waveform: pixels disponibles
  // (W/dur, afectado por zoom), no duración total del tema. Así una
  // sección corta o una vista con zoom muestra sus propios ticks en
  // vez de saltar directo al próximo múltiplo de 16 — resuelve el
  // caso real detectado (sección de 2 compases sin tick propio del
  // compás 2). Candidatos en escalera (ladder), de más fino a más
  // grueso — se elige el más fino que todavía deje
  // MIN_PX_TICK_PRINCIPAL de separación entre ticks, para que 2-3
  // dígitos + su caja de fondo no se amontonen en pantallas angostas.
  // En una vista típica de celular sin zoom con un tema completo, esto
  // da el mismo cada=16 de siempre (no cambia el caso ya validado) —
  // solo se achica cuando hay espacio real de sobra (sección corta,
  // zoom, pantalla ancha).
  const pxPorCompas = dur > 0 ? (secPerBar / dur) * W : 0;
  const CANDIDATOS_CADA_TICK = [1, 2, 4, 8, 16, 32, 64, 128, 256];
  const MIN_PX_TICK_PRINCIPAL = 56;
  const MIN_PX_TICK_SECUNDARIO = 32;
  function elegirCadaTick(minPx){
    for(let i = 0; i < CANDIDATOS_CADA_TICK.length; i++){
      if(CANDIDATOS_CADA_TICK[i] * pxPorCompas >= minPx) return CANDIDATOS_CADA_TICK[i];
    }
    return CANDIDATOS_CADA_TICK[CANDIDATOS_CADA_TICK.length - 1];
  }
  const cada = elegirCadaTick(MIN_PX_TICK_PRINCIPAL);
  const compasDur = secPerBar * cada;
  const colorFondoTick = estilos.getPropertyValue('--bg').trim() || '#0b0b0d';
  // v3.206: (a pedido, "no me gusta que las líneas de sección pisan
  // los números de la regla") el número+caja de cada tick de compás
  // se dibujaba en el momento (antes de las líneas de sección/offset/
  // CUE, que se dibujan más abajo en la función) — cualquiera de esas
  // líneas podía terminar tapándolo visualmente al dibujarse encima.
  // En vez de dibujar el número ahí mismo, se guarda en este array y
  // se redibuja TODO junto al final de la función (ver más abajo,
  // después de líneas de sección/offset/CUE), así el número de compás
  // queda siempre arriba de cualquier línea, sin excepción.
  const numerosCompas = [];
  const tiemposRegla = []; // v3.219: regla de tiempo diferida (se dibuja al final, encima de líneas/banderitas)
  ctxDraw.textAlign = 'center';
  let compasNum = cada + 1;
  // v3.190: (a pedido, portado de ensayo.html v3.202.1) el compás 1
  // (offsetEfectivo, arranque real del tema) no tenía tick/número/hora
  // — el bucle de abajo arranca recién en offsetEfectivo+compasDur. Se
  // agrega acá el mismo dibujo (tick, número, mm:ss), mismo estilo y
  // mismo criterio de "encendido" que el resto de esta regla, sin
  // tocar el bucle existente.
  if(offsetEfectivo >= 0 && offsetEfectivo < dur){
    const t0 = offsetEfectivo;
    const tx0 = (t0 / dur) * W;
    if(avanceNormal && tPrevFrame < t0 && tiempoActual >= t0){
      est.waveformFlashTick = t0;
      est.waveformFlashTickHasta = ahora + FLASH_MS;
    }
    const encendido0 = est.waveformFlashTick != null && Math.abs(est.waveformFlashTick - t0) < 0.001
      && est.waveformFlashTickHasta && ahora < est.waveformFlashTickHasta;
    if(encendido0){
      ctxDraw.shadowColor = colorGold;
      ctxDraw.shadowBlur = 10;
      ctxDraw.strokeStyle = '#fff4d6';
      ctxDraw.lineWidth = 2.5;
    }else{
      ctxDraw.shadowBlur = 0;
      ctxDraw.strokeStyle = colorPrimerTiempo;
      ctxDraw.lineWidth = 1;
    }
    ctxDraw.beginPath();
    ctxDraw.moveTo(tx0, 14);
    ctxDraw.lineTo(tx0, H);
    ctxDraw.stroke();
    ctxDraw.shadowBlur = 0;
    ctxDraw.font = encendido0 ? 'bold 14px monospace' : 'bold 13px monospace';
    const textoNum0 = '1';
    const anchoTexto0 = ctxDraw.measureText(textoNum0).width;
    numerosCompas.push({ tx: tx0, texto: textoNum0, ancho: anchoTexto0, encendido: encendido0, font: ctxDraw.font });
    const mmP0 = Math.floor(t0 / 60);
    const ssP0 = String(Math.floor(t0 % 60)).padStart(2, '0');
    const textoTiempoP0 = `${mmP0}:${ssP0}`;
    ctxDraw.font = encendido0 ? 'bold 12px monospace' : '11px monospace';
    const anchoTiempoP0 = ctxDraw.measureText(textoTiempoP0).width;
    const yTiempoP0 = ondaH - 4;
    tiemposRegla.push({ tx: tx0, texto: textoTiempoP0, ancho: anchoTiempoP0, y: yTiempoP0, encendido: encendido0, font: ctxDraw.font, caja: true, alpha: 1 });
  }
  for(let t = offsetEfectivo + compasDur; t < dur; t += compasDur){
    const tx = (t / dur) * W;
    // ¿este tick se acaba de cruzar en este frame?
    if(avanceNormal && tPrevFrame < t && tiempoActual >= t){
      est.waveformFlashTick = t;
      est.waveformFlashTickHasta = ahora + FLASH_MS;
    }
    const encendido = est.waveformFlashTick != null && Math.abs(est.waveformFlashTick - t) < 0.001
      && est.waveformFlashTickHasta && ahora < est.waveformFlashTickHasta;
    if(encendido){
      ctxDraw.shadowColor = colorGold;
      ctxDraw.shadowBlur = 10;
      ctxDraw.strokeStyle = '#fff4d6';
      ctxDraw.lineWidth = 2.5;
    }else{
      ctxDraw.shadowBlur = 0;
      ctxDraw.strokeStyle = colorPrimerTiempo;
      ctxDraw.lineWidth = 1;
    }
    ctxDraw.beginPath();
    ctxDraw.moveTo(tx, 14);
    ctxDraw.lineTo(tx, H);
    ctxDraw.stroke();
    ctxDraw.shadowBlur = 0;
    ctxDraw.font = encendido ? 'bold 14px monospace' : 'bold 13px monospace';
    const textoNum = String(compasNum);
    const anchoTexto = ctxDraw.measureText(textoNum).width;
    numerosCompas.push({ tx, texto: textoNum, ancho: anchoTexto, encendido, font: ctxDraw.font });
    // v3.145: (a pedido) la regla de tiempo se movió de "debajo del
    // número de compás" (arriba) a la parte inferior DEL WAVEFORM (el
    // borde de abajo de la zona de la onda, WAVEFORM_ONDA_H) — antes
    // quedaba pegada al compás, ahora es una franja propia abajo,
    // separada. Sigue usando el mismo t del tick, así ambas reglas
    // (compás arriba, tiempo abajo) siguen coincidiendo en X.
    const mmP = Math.floor(t / 60);
    const ssP = String(Math.floor(t % 60)).padStart(2, '0');
    const textoTiempoP = `${mmP}:${ssP}`;
    ctxDraw.font = encendido ? 'bold 12px monospace' : '11px monospace';
    const anchoTiempoP = ctxDraw.measureText(textoTiempoP).width;
    const yTiempoP = ondaH - 4;
    tiemposRegla.push({ tx: tx, texto: textoTiempoP, ancho: anchoTiempoP, y: yTiempoP, encendido: encendido, font: ctxDraw.font, caja: true, alpha: 1 });
    compasNum += cada;
  }

  // v3.143: (a pedido) resolución subida de cada 8 a cada 4 compases —
  // y ahora se ve MÁS tenue que antes (menos alpha, línea más fina,
  // sin caja de fondo detrás del número) a propósito, para que se
  // distinga claramente del principal de 16 aunque haya el doble de
  // ticks que antes. Sigue saltando los múltiplos de 16 (ya dibujados
  // arriba, más marcados) para no superponer líneas.
  // v3.58 (histórico, ya no aplica el "cada 8"): regla secundaria cada
  // 8 compases — menor jerarquía que la principal de 16 (línea fina y
  // tenue, sin el destello dorado de "encendido"). Usa el mismo
  // offsetEfectivo/secPerBar que la de 16, así que ambas grillas
  // siempre coinciden.
  // v3.59 (histórico): el número de estos ticks se veía muy poco
  // (colorFaint, sin caja de fondo, encima de las barras de la onda) —
  // subió a la misma franja superior que los números de 16, con caja
  // de fondo. v3.143 vuelve a sacarle la caja de fondo a propósito
  // (ahora hay el doble de ticks, la caja se sentía muy cargada) pero
  // mantiene el color dorado tenue para que siga siendo legible.
  // v3.192: (a pedido, portado de ensayo.html v3.204) cadaSec ahora se
  // deriva del `cada` principal (adaptativo) en vez de un 4 fijo —
  // sigue siendo 1/4 del principal (mismo criterio visual: secundaria
  // = 1 nivel más fino), pero solo se dibuja si esa subdivisión
  // (cada>=4) todavía deja aire real en pantalla
  // (MIN_PX_TICK_SECUNDARIO); si no hay espacio ni para eso, se salta
  // la secundaria entera (cadaSec=0) en vez de amontonar números
  // chicos ilegibles.
  const cadaSec = (cada >= 4 && (cada / 4) * pxPorCompas >= MIN_PX_TICK_SECUNDARIO) ? cada / 4 : 0;
  const compasDurSec = secPerBar * cadaSec;
  if(compasDurSec > 0){
    ctxDraw.shadowBlur = 0;
    ctxDraw.font = '9px monospace';
    ctxDraw.textAlign = 'center';
    let nSec = cadaSec;
    for(let t = offsetEfectivo + compasDurSec; t < dur; t += compasDurSec){
      if(nSec % cada !== 0){
        const tx = (t / dur) * W;
        // v3.70: el de 16 (arriba) ya detectaba el cruce y hacía
        // destello; este secundario nunca lo tuvo — se agrega el mismo
        // criterio, con su propio flag (waveformFlashTickSec) para no
        // pisar el estado del de 16.
        if(avanceNormal && tPrevFrame < t && tiempoActual >= t){
          est.waveformFlashTickSec = t;
          est.waveformFlashTickSecHasta = ahora + FLASH_MS;
        }
        const encendidoSec = est.waveformFlashTickSec != null && Math.abs(est.waveformFlashTickSec - t) < 0.001
          && est.waveformFlashTickSecHasta && ahora < est.waveformFlashTickSecHasta;
        if(encendidoSec){
          ctxDraw.shadowColor = colorGold;
          ctxDraw.shadowBlur = 8;
          ctxDraw.globalAlpha = 1;
          ctxDraw.strokeStyle = '#fff4d6';
          ctxDraw.lineWidth = 2;
        }else{
          ctxDraw.shadowBlur = 0;
          ctxDraw.globalAlpha = 0.22;
          ctxDraw.strokeStyle = colorPrimerTiempo;
          ctxDraw.lineWidth = 1;
        }
        ctxDraw.beginPath();
        ctxDraw.moveTo(tx, 20);
        ctxDraw.lineTo(tx, H);
        ctxDraw.stroke();
        ctxDraw.shadowBlur = 0;
        const textoSec = String(nSec + 1);
        ctxDraw.globalAlpha = encendidoSec ? 1 : 0.5;
        ctxDraw.fillStyle = encendidoSec ? '#fff4d6' : colorGold;
        ctxDraw.font = encendidoSec ? 'bold 10px monospace' : '9px monospace';
        ctxDraw.fillText(textoSec, tx, 11);
        // v3.145: (a pedido) misma reubicación que la principal — la
        // hora ya no va debajo del número, va en la parte inferior del
        // waveform (borde de WAVEFORM_ONDA_H), sin caja de fondo (se
        // mantiene igual de tenue que se pidió).
        const mmS = Math.floor(t / 60);
        const ssS = String(Math.floor(t % 60)).padStart(2, '0');
        ctxDraw.font = '9px monospace';
        tiemposRegla.push({ tx, texto: `${mmS}:${ssS}`, ancho: 0, y: ondaH - 4, encendido: encendidoSec, font: ctxDraw.font, caja: false, alpha: encendidoSec ? 1 : 0.5 });
        ctxDraw.globalAlpha = 1;
        ctxDraw.font = '9px monospace';
      }
      nSec += cadaSec;
    }
  }

  // v3.25/v3.31/v3.32/v3.33 (resumen de lo que ya traía esto, sigue
  // igual): marcadores de las secciones de la sesión, con color propio
  // por sección (colorSeccionPorIndice, mismo índice que los chips de
  // arriba del waveform) y detección de "encendido" al cruzar cada una.
  // v3.34: (a pedido) la etiqueta de cada sección YA NO pisa la forma
  // de onda. Antes se apretaban en 2 carriles pegados al fondo del
  // mismo canvas de las barras. Ahora viven en una franja propia,
  // debajo de la zona de la onda (WAVEFORM_ONDA_H), con tantos
  // carriles como hicieron falta (calculados arriba, en infoSecciones,
  // antes de fijar el alto del canvas). La línea vertical de cada
  // sección cruza TODA la altura (onda + franja de etiquetas) para
  // que quede clarísimo a qué línea corresponde cada nombre, sin
  // importar en qué carril terminó cayendo. Sigue en 2 pasadas
  // (líneas primero, etiquetas encima) para que ninguna línea tape un
  // texto, igual que en v3.32.
  ctxDraw.textAlign = 'left';

  // -- pasada 1: líneas (inicio sólida + fin punteada), toda la altura --
  infoSecciones.forEach(info => {
    const { sec, tSec, sx, color } = info;
    if(avanceNormal && tPrevFrame < tSec && tiempoActual >= tSec){
      est.waveformFlashSeccion = tSec;
      est.waveformFlashSeccionHasta = ahora + FLASH_MS;
    }

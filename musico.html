// v2.4: vuelve todo (BPM, clave, sonido, acentos) a los valores reales
// del tema — nunca hubo nada guardado, solo se limpian los overrides
// en memoria.
// v3.150: aplica un compás override de sesión (2-12, límite músical
// razonable — cubre simples, compuestos e impares comunes) — mismo
// patrón que usarBpmDetectadoPractica, pero acá SIEMPRE es manual (no
// hay forma de detectar el compás de un tag de audio). Regenera
// acentos (se resetea el patrón, no tiene sentido conservarlo si
// cambia la cantidad de tiempos) y fuerza el re-render de la tira de
// pulso/clave y de las figuras, invalidando los flags de "ya
// renderizado" que usa actualizarUIAjustesPractica — mismo mecanismo
// que ya dispara un cambio de clave, solo que forzado acá también por
// compás.
function cambiarCompasOverridePractica(uid, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  const parsed = Math.round(parseFloat(valor));
  const n = Math.max(2, Math.min(12, isFinite(parsed) ? parsed : est.compasesPorBarra));
  est.compasesOverride = (n === est.compasesPorBarra) ? null : n;
  // v3.153: FIX — faltaba este recálculo acá (Restablecer sí lo hacía,
  // este cambio no). Sin él, est.claveCicloSecEfectivo/claveOnsetsEfectivo
  // quedaban con la duración de compás VIEJA hasta la próxima recarga
  // de página, así que el contador grande (que lee tramoActualContador
  // en cada frame) ya mostraba el compás/pulso correcto, pero la tira
  // de puntos de Pulso·Clave (que ancla su ciclo a claveCicloSecEfectivo
  // cuando hay clave activa) seguía reiniciando con el largo de compás
  // anterior — de ahí el punto encendido "adelantado" pese a que el
  // número de arriba ya decía el pulso correcto.
  recalcularEfectivoPractica(uid);
  const efectivo = compasEfectivoDe(est);
  est.acentos = acentosPorDefecto(efectivo);
  const acentosRow = document.getElementById('acentosrow-' + uid);
  if(acentosRow) acentosRow.innerHTML = acentosBtnsHtml(uid, efectivo);
  est.ultimaClaveFigurasRenderizada = undefined;
  est.ultimaClaveUnificadaRenderizada = undefined;
  [2,3,4,5,6,7,8,9,12].forEach(b => {
    const btn = document.getElementById('compaspreset-' + uid + '-' + b);
    if(btn) btn.classList.toggle('activo', b === efectivo);
  });
  const libre = document.getElementById('compaslibre-' + uid);
  if(libre) libre.value = efectivo;
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  if(est.getTiempoActual) dibujarWaveform(uid, est.getTiempoActual());
  guardarAjustesPractica(uid);
}
// v3.152: texto informativo junto a los presets/campo libre de compás
// ("6 ×2 = 12 clicks/compás") — oculto si no hay subdivisión activa
// (×1), para no agregar ruido visual a quien no usa esta función
// nueva. No participa de ningún cálculo, es solo lectura.
function actualizarResumenCompasSubdivPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const el = document.getElementById('resumencompas-' + uid);
  if(!el) return;
  const efectivo = compasEfectivoDe(est);
  const subdiv = subdivisionDe(est);
  if(subdiv === 1){
    el.style.display = 'none';
    el.textContent = '';
  } else {
    el.style.display = '';
    el.textContent = `(${efectivo} ×${subdiv} = ${efectivo * subdiv} clicks/compás)`;
  }
}
// v3.152: (a pedido) subdivisión del click — multiplicador de sesión
// (1/2/4, nunca toca Firestore). A propósito NO toca compasEfectivoDe
// ni est.acentos (que siguen representando los pulsos PRINCIPALES,
// tal cual antes de esta versión) — solo agrega clicks de RELLENO en
// el scheduler de audio (ver bloque nuevo en schedulerTickGlobalPractica)
// entre esos mismos pulsos, sin alterar la duración real del compás
// ni ninguno de los 29 sitios que ya leen compasEfectivoDe(est)
// (waveform, loop, secciones, clave, PDF). Con ×1 (default) el
// comportamiento es idéntico a como era antes de v3.152.
function cambiarSubdivisionPractica(uid, valor){
  const est = estadoPractica[uid];
  if(!est) return;
  const n = [1, 2, 4].includes(valor) ? valor : 1;
  est.subdivisionOverride = (n === 1) ? null : n;
  est.schedNextSubIdx = null; // fuerza resync del scheduler de relleno
  [1, 2, 4].forEach(s => {
    const btn = document.getElementById('subdivpreset-' + uid + '-' + s);
    if(btn) btn.classList.toggle('activo', s === n);
  });
  actualizarResumenCompasSubdivPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  guardarAjustesPractica(uid);
}
function restablecerAjustesPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.bpmOverride = null;
  est.claveOverride = undefined;
  est.tonalidadOverride = undefined;
  est.compasesOverride = null;
  est.subdivisionOverride = null;
  est.schedNextSubIdx = null;
  [1, 2, 4].forEach(s => {
    const btnSubdiv = document.getElementById('subdivpreset-' + uid + '-' + s);
    if(btnSubdiv) btnSubdiv.classList.toggle('activo', s === 1);
  });
  est.sonidoClick = 'clasico';
  est.sonidoClave = 'clasico';
  est.acentos = acentosPorDefecto(compasEfectivoDe(est));
  est.acentosClave = acentosClavePorDefecto();
  est.pendVelocidadOverride = null;
  actualizarFiguraPenduloPractica(uid, 2);
  est.volFuerte = 1;
  est.volNormal = 0.55;
  const acentosRowReset = document.getElementById('acentosrow-' + uid);
  if(acentosRowReset) acentosRowReset.innerHTML = acentosBtnsHtml(uid, compasEfectivoDe(est));
  [2,3,4,5,6,7,8,9,12].forEach(b => {
    const btn = document.getElementById('compaspreset-' + uid + '-' + b);
    if(btn) btn.classList.toggle('activo', b === compasEfectivoDe(est));
  });
  const libreReset = document.getElementById('compaslibre-' + uid);
  if(libreReset) libreReset.value = compasEfectivoDe(est);
  est.ultimaClaveFigurasRenderizada = undefined;
  est.ultimaClaveUnificadaRenderizada = undefined;
  recalcularEfectivoPractica(uid);
  actualizarBadgePractica(uid, est.compasTexto);
  actualizarUIAjustesPractica(uid);
  guardarAjustesPractica(uid);
}

// Dos clicks mientras suena marcan inicio/fin real del loop (con snap
// al compás más cercano); un tercer click lo cancela. No depende de
// los tiempos guardados en Secciones — el músico lo marca a oído.
// v3.28: (a pedido) tOverride opcional — permite cerrar el loop en un
// punto tocado en el waveform en vez de forzosamente la posición
// actual de reproducción (ver seekWaveformClick). Sin tOverride se
// comporta exactamente igual que antes.
function marcarLoopPractica(uid, tOverride){
  const est = estadoPractica[uid];
  if(!est) return;
  // (a pedido) se excluye con el loop automático de sección — activar
  // este loop manual apaga el otro, para que no compitan por el seek.
  if(est.loopSeccionActivo) toggleLoopSeccionPractica(uid);
  const btn = document.getElementById('loopbtn-' + uid);
  const info = document.getElementById('loopinfo-' + uid);
  if(est.loopActivo){
    est.loopInicio = null; est.loopFin = null; est.loopActivo = false;
    if(btn){ btn.textContent = '↻'; btn.title = 'Marca el inicio del loop en el segundo actual'; btn.style.display = 'none'; }
    if(info) info.textContent = '';
    limpiarPresetsLoopPractica(uid);
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
    return;
  }
  const t = tOverride != null ? tOverride : est.getTiempoActual();
  // v2.1: si hay clave activa, el snap redondea a bloques de 2
  // compases (el ciclo completo de la célula) en vez de 1, para que
  // el loop siempre arranque en el compás 1 de la clave — si no, cada
  // vuelta puede entrar a mitad de la célula y sonar cortada.
  const unidadCompases = est.clave ? 2 : 1;
  // v3.111: (a pedido) FIX — v3.109 corregía beatsDeT (compasOverride)
  // pero seguía anclando el snap contra el offset GLOBAL del tema, no
  // contra el inicio real del tramo. Con tramos anteriores de compás
  // distinto, esa cuenta se corre (el loop cerraba en un punto que no
  // era el borde real de la sección). Ahora se ancla contra
  // tramoDeT.inicioSeg — mismo criterio de "reinicio en el borde" que
  // recorrerTramos()/el click (v3.110). Sin compasOverride, mismo
  // resultado de siempre (un solo tramo, inicioSeg = offset).
  const offsetLoop = (est.offset || 0) + (est.offsetLocalDelta || 0);
  // v3.147: (a pedido) usa bpmEfectivo (con override del tag del
  // archivo local) en vez de est.bpm crudo, para que el loop siempre
  // coincida con la regla del waveform (que también usa bpmEfectivo).
  const bpmLoop = est.bpmEfectivo || est.bpm;
  const tramosLoop = recorrerTramosMusico(seccionesRuntimeDe(est), offsetLoop, bpmLoop, compasEfectivoDe(est), !!est.compasesOverride);
  const tramoDeT = tramoMusicoEnSegundo(tramosLoop, t);
  const beatsDeT = tramoDeT.beats;
  // v3.210: (a pedido) respeta est.modoSnapClick — en modo 'transitorio'
  // usa el golpe detectado más cercano si hay uno a menos de 80ms; si
  // no hay ninguno cerca, cae al snap a compás de siempre (el loop
  // nunca queda sin snap, a diferencia del CUE).
  let snapped;
  if((est.modoSnapClick || 'rejilla') === 'transitorio'){
    const cercano = transienteMasCercanoPractica(est, t);
    snapped = cercano != null ? cercano : snapACompasPractica(t, bpmLoop, beatsDeT * unidadCompases, tramoDeT.inicioSeg);
  }else{
    snapped = snapACompasPractica(t, bpmLoop, beatsDeT * unidadCompases, tramoDeT.inicioSeg);
  }
  if(est.loopInicio == null){
    est.loopInicio = snapped;
    if(btn){ btn.textContent = '⏹'; btn.title = 'Marca el fin del loop aquí'; btn.style.display = ''; }
    if(info) info.textContent = `Inicio: ${segundosATextoPractica(snapped)}`;
  } else {
    let fin = snapped;
    const minBar = (60 / bpmLoop) * beatsDeT * unidadCompases;
    if(fin <= est.loopInicio) fin = est.loopInicio + minBar;
    est.loopFin = fin;
    est.loopActivo = true;
    if(btn){ btn.textContent = '✕'; btn.title = 'Cancela el loop activo'; btn.style.display = ''; }
    const secPerBarInfo = (60 / bpmLoop) * beatsDeT;
    const numCompases = Math.round((est.loopFin - est.loopInicio) / secPerBarInfo);
    if(info) info.textContent = `↻ Loop: ${segundosATextoPractica(est.loopInicio)} → ${segundosATextoPractica(est.loopFin)} (${numCompases} comp.)`;
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
  }
}

// v3.29: loop rápido de N compases desde la posición actual — mismo
// mecanismo del loop manual (est.loopInicio/est.loopFin/est.loopActivo,
// ver marcarLoopPractica), solo que calculado de una — sin el segundo
// click. Comparte info con el loop manual (loopinfo-), así que al
// activarse se ve y se cancela igual que un loop manual cualquiera;
// también se excluye con el loop de sección, igual que el loop manual.
// v3.30: (a pedido) resalta (clase activo) el botón xN elegido, y lo
// apaga si se vuelve a tocar el mismo (toggle, como el resto de los
// loops); limpiarPresetsLoopPractica() apaga los 5 cuando el loop se
// cancela por cualquier otro camino (manual, sección, etc.).
function loopRapidoCompasesPractica(uid, n){
  const est = estadoPractica[uid];
  if(!est) return;
  const btnPreset = document.getElementById('looppreset-' + uid + '-' + n);
  const yaActivoEsteMismo = btnPreset && btnPreset.classList.contains('activo');
  if(est.loopSeccionActivo) toggleLoopSeccionPractica(uid);
  const btn = document.getElementById('loopbtn-' + uid);
  const info = document.getElementById('loopinfo-' + uid);
  limpiarPresetsLoopPractica(uid);
  if(yaActivoEsteMismo){
    est.loopInicio = null; est.loopFin = null; est.loopActivo = false;
    if(btn){ btn.textContent = '↻'; btn.title = 'Marca el inicio del loop en el segundo actual'; btn.style.display = 'none'; }
    if(info) info.textContent = '';
    aplicarLoopNativoPractica(uid);
    dibujarWaveform(uid, est.getTiempoActual());
    return;
  }
  const t = est.getTiempoActual();
  // mismo criterio de snap que marcarLoopPractica: bloques de 2
  // compases si hay clave activa, para arrancar siempre en compás 1.
  const unidadCompases = est.clave ? 2 : 1;
  // v3.111: FIX de anclaje — mismo criterio que marcarLoopPractica
  // (ver comentario ahí): ancla contra el inicio real del tramo, no
  // contra el offset global.
  const offsetLoopN = (est.offset || 0) + (est.offsetLocalDelta || 0);
  // v3.147: (a pedido) mismo criterio que marcarLoopPractica — usa
  // bpmEfectivo (con override del tag) en vez de est.bpm crudo.
  const bpmLoopN = est.bpmEfectivo || est.bpm;
  const tramosLoopN = recorrerTramosMusico(seccionesRuntimeDe(est), offsetLoopN, bpmLoopN, compasEfectivoDe(est), !!est.compasesOverride);
  const tramoDeTN = tramoMusicoEnSegundo(tramosLoopN, t);
  const beatsDeTN = tramoDeTN.beats;
  const snapped = snapACompasPractica(t, bpmLoopN, beatsDeTN * unidadCompases, tramoDeTN.inicioSeg);
  const secPerBarInfo = (60 / bpmLoopN) * beatsDeTN;
  est.loopInicio = snapped;
  est.loopFin = snapped + secPerBarInfo * n;
  est.loopActivo = true;
  if(btn){ btn.textContent = '✕'; btn.title = 'Cancela el loop activo'; btn.style.display = ''; }
  if(btnPreset) btnPreset.classList.add('activo');
  if(info) info.textContent = `↻ Loop: ${segundosATextoPractica(est.loopInicio)} → ${segundosATextoPractica(est.loopFin)} (${n} comp.)`;
  aplicarLoopNativoPractica(uid);
  dibujarWaveform(uid, est.getTiempoActual());
}
// v3.228: (port de ensayo.html v3.260) campo "N°"+"Ir" del loop rápido
// — mismo motor que los presets xN, solo que con el N tipeado a mano.
function aplicarLoopCustomPractica(uid){
  const input = document.getElementById('loopcustomn-' + uid);
  if(!input) return;
  const n = parseInt(input.value, 10);
  if(!n || n < 1){
    input.focus();
    return;
  }
  loopRapidoCompasesPractica(uid, n);
}
function limpiarPresetsLoopPractica(uid){
  // v3.190: (a pedido, portado de ensayo.html v3.210.3) FIX — faltaban
  // 1 y 2 en este array, así que esos dos presets quedaban "pegados"
  // en .activo para siempre (nunca se les sacaba la clase al elegir
  // otro loop rápido).
  [1,2,4,8,16,32,64].forEach(n => {
    const b = document.getElementById('looppreset-' + uid + '-' + n);
    if(b) b.classList.remove('activo');
  });
}

// v2.2: metrónomo de práctica libre — sin reproductor real, usa un
// reloj propio (performance.now()) que alimenta exactamente el mismo
// actualizarContadorPractica() que ya usan audio/YouTube/archivo
// local, así que el contador, los dots, el click y la clave funcionan
// idéntico. Un segundo click detiene y resetea a 0 (no pausa/reanuda
// desde donde iba, para que cada práctica libre arranque siempre en
// el compás 1, como offset=0 en este modo no aplica).
// v2.3: se excluye mutuamente con la maqueta — al activarse, pausa el
// reproductor si estaba sonando (usa el mismo est.pause() que ya
// existe para audio/YouTube/local) y se registra en
// marcarReproduccionActiva(), para que si luego el músico le da play a
// la maqueta, este metrónomo se apague también. Así nunca hay dos
// relojes escribiendo el contador/dots/clave a la vez.
// v3.44: (a pedido) pre-conteo opcional (1 o 2 compases, configurable
// en ≡) antes de que arranque el metrónomo libre de verdad. Durante el
// pre-conteo solo suenan los beeps (con el mismo patrón de acentos ya
// configurado) vía setTimeout — no se toca actualizarContadorPractica
// todavía, así el contador/dots no arrancan hasta que el pre-conteo
// termina y el metrónomo real empieza en performance.now(), como antes.
function toggleMetronomoLibre(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  const btn = document.getElementById('metrobtn-' + uid);
  if(est.metroLibreActivo || est.metroPrecontEnCurso){
    est.metroLibreActivo = false;
    cancelarPreconteoPractica(uid);
    if(btn){ btn.textContent = '▶'; btn.title = 'Metrónomo libre (sin pista) — tocar para arrancar'; btn.classList.remove('activo'); }
    actualizarContadorPractica(uid, 0);
    return;
  }
  if(typeof est.pause === 'function'){
    try{ est.pause(); }catch(e){}
  }
  marcarReproduccionActiva(uid);

  const arrancarMetronomoReal = () => {
    est.metroLibreActivo = true;
    est.metroLibreInicio = performance.now();
    // v3.229: (port de ensayo.html v3.274) ancla en el reloj de audio,
    // que usa el scheduler del click (ver el tiempoActual de arriba);
    // est.metroLibreInicio (performance.now()) sigue existiendo SOLO
    // para el tick visual (requestAnimationFrame, un poco más abajo).
    obtenerAudioCtxPractica();
    est.metroLibreInicioAudio = audioCtxPractica.currentTime;
    if(btn){ btn.textContent = '⏸'; btn.title = 'Metrónomo sonando — tocar para detener'; btn.classList.add('activo'); }
    const tick = () => {
      if(!est.metroLibreActivo) return;
      const tSimulado = (performance.now() - est.metroLibreInicio) / 1000;
      actualizarContadorPractica(uid, tSimulado);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  if(est.precontActivo){
    if(btn){ btn.textContent = '⏳'; btn.title = 'Pre-conteo antes de arrancar…'; btn.classList.add('activo'); }
    programarPreconteoPractica(uid, arrancarMetronomoReal);
  } else {
    arrancarMetronomoReal();
  }
}

// v3.45: (a pedido) lógica de pre-conteo extraída a funciones
// reutilizables, para que la pueda usar tanto el metrónomo libre como
// el play de la pista/maqueta (ver audioLocal/audio 'play' listeners).
// Solo agenda los beeps (con pitch de precuenta) vía setTimeout; no
// toca actualizarContadorPractica — quien la llama decide qué pasa
// cuando termina (alTerminar).
function programarPreconteoPractica(uid, alTerminar){
  const est = estadoPractica[uid];
  if(!est){ alTerminar(); return; }
  const bpmEf = est.bpmEfectivo || est.bpm;
  const secPerBeat = 60 / bpmEf;
  const totalBeats = compasEfectivoDe(est) * (est.precontCompases || 1);
  est.metroPrecontEnCurso = true;
  est.metroPrecontTimeouts = [];
  for(let i = 0; i < totalBeats; i++){
    const beatEnBarra = i % compasEfectivoDe(est);
    const timeoutId = setTimeout(() => {
      const acento = (est.acentos && est.acentos[beatEnBarra]) || 'normal';
      if(acento !== 'mudo') beepPractica(acento === 'fuerte', est.sonidoClick, acento === 'fuerte' ? est.volFuerte : est.volNormal, true);
    }, i * secPerBeat * 1000);
    est.metroPrecontTimeouts.push(timeoutId);
  }
  est.metroPrecontTimeouts.push(setTimeout(() => {
    est.metroPrecontEnCurso = false;
    alTerminar();
  }, totalBeats * secPerBeat * 1000));
}
function cancelarPreconteoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.metroPrecontEnCurso = false;
  if(est.metroPrecontTimeouts){ est.metroPrecontTimeouts.forEach(t => clearTimeout(t)); est.metroPrecontTimeouts = []; }
}

// v3.46: (a pedido) playerbar custom para la pista/maqueta, en
// reemplazo de los controles nativos del <audio> — con nativos no
// había forma de correr el pre-conteo ANTES de que el audio empezara a
// sonar. Acá el pre-conteo corre completo primero y recién después se
// llama est.play(), así que nunca hay blip de audio.
function togglePlayPractica(uid){
  const est = estadoPractica[uid];
  if(!est || typeof est.play !== 'function') return;
  const btn = document.getElementById('playbtn-' + uid);
  if(est.audioActivo && !est.audioActivo.paused){
    est.pause();
    return;
  }
  if(est.metroPrecontEnCurso){
    cancelarPreconteoPractica(uid);
    if(btn) btn.textContent = '▶';
    return;
  }
  if(est.metroLibreActivo){
    apagarMetronomoLibreSiActivo(uid);
  }
  const arrancar = () => {
    // v3.138: (a pedido) CUE de comienzo — variable independiente del
    // offset (est.cuePlayback, ver marcarCuePractica/
    // toggleArmarCueWaveform). Si hay uno marcado y la reproducción
    // sigue en el segundo 0 (no se movió a mano todavía), arranca
    // directo ahí — igual que el CUE de un reproductor DJ. Si el
    // músico ya movió la reproducción a otro lado, se respeta eso y no
    // se salta solo.
    if(est.cuePlayback != null && est.getTiempoActual && est.getTiempoActual() < 0.05){
      if(est.seek){
        est.seek(est.cuePlayback);
        dibujarWaveform(uid, est.cuePlayback);
      }
    }
    est.play();
  };
  if(est.precontActivo){
    if(btn) btn.textContent = '⏳';
    programarPreconteoPractica(uid, arrancar);
  } else {
    arrancar();
  }
}
function actualizarIconoPlayPractica(uid){
  const est = estadoPractica[uid];
  const btn = document.getElementById('playbtn-' + uid);
  if(!est || !btn || !est.audioActivo) return;
  const sonando = !est.audioActivo.paused;
  btn.textContent = sonando ? '⏸' : '▶';
  btn.classList.toggle('activo', sonando);
}
function seekBarInputPractica(uid, valorMil){
  const est = estadoPractica[uid];
  if(!est || typeof est.getDuracion !== 'function') return;
  const dur = est.getDuracion();
  if(!dur) return;
  est.seek((valorMil / 1000) * dur);
}
function toggleMutePractica(uid){
  const est = estadoPractica[uid];
  if(!est || !est.audioActivo) return;
  est.audioActivo.muted = !est.audioActivo.muted;
  const btn = document.getElementById('playervolbtn-' + uid);
  if(btn) btn.textContent = est.audioActivo.muted ? '🔇' : '🔊';
}
// v3.58: (a pedido) volver al segundo 0 de la pista — reusa est.seek(),
// el mismo que ya usan el chip de sección/waveform/loop, así que
// respeta cualquier motor conectado (nativo, Web Audio, o YouTube si
// algún día se habilita el botón ahí también).
// v3.138: (a pedido) antes iba siempre al segundo 0 real del archivo —
// ahora va al offset efectivo (offset + offsetLocalDelta), que es
// donde el metrónomo/contador consideran el "tiempo 1". Si el offset
// está en 0 (nunca calibrado, o restablecido con "↺ Restablecer
// comienzo"), esto sigue siendo exactamente el segundo 0, igual que
// antes. Nada que ver con el CUE (cuePlayback) — ese es el punto de
// reproducción, este botón es "volver al comienzo real de la música".
// v3.139: (a pedido) prioriza el CUE (cuePlayback) si hay uno marcado
// — es literalmente "el punto de arranque elegido". Si no hay CUE,
// cae al offset efectivo (offset + offsetLocalDelta), que es donde el
// metrónomo/contador consideran el "tiempo 1". Si tampoco hay offset
// calibrado, esto sigue siendo el segundo 0 real, igual que siempre.
function reiniciarPistaPractica(uid){
  const est = estadoPractica[uid];
  if(!est || typeof est.seek !== 'function') return;
  // v3.170: (a pedido) flash breve del botón (clase .activo, mismo
  // dorado que ya usan playbtn/metrobtn) como feedback de que la
  // acción se ejecutó — es un botón momentáneo (no un toggle de
  // estado), así que se apaga solo a los 250ms en vez de quedar
  // prendido.
  const btn = document.getElementById('playerrestartbtn-' + uid);
  if(btn){
    btn.classList.add('activo');
    setTimeout(() => btn.classList.remove('activo'), 250);
  }
  if(est.cuePlayback != null){
    est.seek(Math.max(0, est.cuePlayback));
    return;
  }
  const offsetEfectivo = (est.offset || 0) + (est.offsetLocalDelta || 0);
  est.seek(Math.max(0, offsetEfectivo));
}
// v3.58: (a pedido) volumen real de la pista (0-100 en el slider, 0-1
// en el motor) — si el músico mueve el slider por encima de 0 estando
// silenciado, se des-silencia solo (mismo criterio esperado en
// cualquier reproductor: mover el volumen implica querer oírse).
function setVolumenPistaPractica(uid, valorCien){
  const est = estadoPractica[uid];
  if(!est || !est.audioActivo) return;
  const v = Math.max(0, Math.min(100, Number(valorCien) || 0)) / 100;
  est.audioActivo.volume = v;
  if(est.audioActivo.muted && v > 0) est.audioActivo.muted = false;
  const btn = document.getElementById('playervolbtn-' + uid);
  if(btn) btn.textContent = (est.audioActivo.muted || v === 0) ? '🔇' : '🔊';
}
// v3.46: refresca tiempo/posición del playerbar — se llama desde
// actualizarContadorPractica en cada frame mientras suena, igual que ya
// hace con el resto de los indicadores (chip, barra de sección, etc.).
function actualizarPlayerbarPractica(uid, tiempoActual){
  const est = estadoPractica[uid];
  if(!est || typeof est.getDuracion !== 'function') return;
  const dur = est.getDuracion();
  const txt = document.getElementById('playertiempo-' + uid);
  if(txt) txt.textContent = segundosATextoPractica(tiempoActual) + ' / ' + segundosATextoPractica(dur);
  const seek = document.getElementById('playerseek-' + uid);
  if(seek && document.activeElement !== seek && dur > 0){
    seek.value = Math.min(1000, Math.max(0, (tiempoActual / dur) * 1000));
  }
}

// v3.44: (a pedido) toggle + selección de compases (1 o 2) para el
// pre-conteo del metrónomo libre. Solo guarda estado en `est`; la
// lógica de reproducción vive en toggleMetronomoLibre.
// v3.45: el toggle ahora es el botón cuadrado junto a "▶ Metrónomo"
// (antes vivía como checkbox dentro de ≡, ver metrobtn-row en el HTML).
function togglePreconteoPractica(uid){
  const est = estadoPractica[uid];
  if(!est) return;
  est.precontActivo = !est.precontActivo;
  sincronizarUIPreconteo(uid);
  guardarPreconteoGeneral(est.precontActivo, est.precontCompases || 1);
}
function elegirCompasesPreconteoPractica(uid, n){
  const est = estadoPractica[uid];
  if(!est) return;
  est.precontCompases = n;
  sincronizarUIPreconteo(uid);
  guardarPreconteoGeneral(est.precontActivo, n);
}

// v2.4: usa bpm/clave EFECTIVOS (con override si el músico ajustó algo
// en el panel de ajustes) para secPerBeat/secPerBar/onsets de clave —
// contador, dots y click suenan según el ajuste. El loop/snap de
// marcarLoopPractica() sigue usando el bpm/clave REAL del tema (no
// cambia con estos ajustes), porque ese sí debe coincidir con el audio
// real que está sonando.
function actualizarContadorPractica(uid, tiempoActual){
  const est = estadoPractica[uid];
  if(!est) return;
  const bpmEf = est.bpmEfectivo || est.bpm;
  const claveEf = est.claveEfectiva !== undefined ? est.claveEfectiva : est.clave;
  const secPerBeat = 60 / bpmEf;
  const secPerBar = secPerBeat * compasEfectivoDe(est);
  const offset = (est.offset || 0) + (est.offsetLocalDelta || 0);
  const tRel = Math.max(0, tiempoActual - offset);
  // v3.111: (a pedido) FIX raíz — barIndex/beatEnBarra pasan a resolver
  // por TRAMO real (compasOverride), no por el compás general fijo de
  // arriba. secPerBar/tRel de arriba se DEJAN intactos a propósito:
  // los sigue usando la cuenta regresiva de "restantes" y el camino de
  // clave más abajo, que siguen razonando en el compás general (la
  // clave asume compás constante — caso de borde ya conversado, fuera
  // de alcance). Solo el contador grande, el flash de los puntos (sin
  // clave) y el rango "Compás X-Y" de la etiqueta pasan a usar el tramo.
  const tramosContador = recorrerTramosMusico(seccionesRuntimeDe(est), offset, bpmEf, compasEfectivoDe(est), !!est.compasesOverride);
  const tramoActualContador = tramoMusicoEnSegundo(tramosContador, tiempoActual);
  const secPerBarTramo = tramoActualContador.secPerBar || secPerBar;
  const tRelTramo = Math.max(0, tiempoActual - tramoActualContador.inicioSeg);
  // v3.112: (a pedido) clave por sección — mismo criterio que el
  // scheduler (resolverClaveDeTramo): override activo => global de
  // siempre; si no, el tramo actual (ya resuelto arriba, no se vuelve
  // a calcular) con claveSeccion propia usa su patrón; sin ella, cae
  // al efectivo general, como hasta ahora.
  // v3.116: (a pedido) mismo criterio que resolverClaveDeTramo — el
  // override a "Sin clave" (null) ya no cuenta como "hay override"
  // para efectos de pisar la claveSeccion propia de la sección; solo
  // un override a una clave ESPECÍFICA (valor truthy) sigue ganando.
  const claveTieneOverride = est.claveOverride !== undefined && est.claveOverride !== null;
  const claveOnsetsEf = (!claveTieneOverride && tramoActualContador.claveSeccion && tramoActualContador.secPerBar)
    ? construirOnsetsDesdePatron(tramoActualContador.claveSeccion, tramoActualContador.secPerBar / tramoActualContador.beats, tramoActualContador.secPerBar)
    : (est.claveOnsetsEfectivo || est.claveOnsets);
  const claveCicloSecEf = (!claveTieneOverride && tramoActualContador.claveSeccion && tramoActualContador.secPerBar)
    ? tramoActualContador.secPerBar * 2
    : (est.claveCicloSecEfectivo || est.claveCicloSec);
  // v3.125: (a pedido) FIX raíz — mismo criterio que resolverClaveDeTramo
  // (scheduler): cuando el tramo actual declara su PROPIA claveSeccion,
  // el ciclo de la clave (turno de compás, flash de la ×, y puntos
  // "Pulso" con clave) se ancla al INICIO REAL DEL TRAMO (tRelTramo,
  // igual que ya usa barIndex/beatEnBarra) en vez del reloj global del
  // tema (tRel) — así arranca limpio en el primer compás de la sección,
  // sin importar qué pasó antes. Sin claveSeccion propia (clave general
  // del tema, fallback), sigue anclado a tRel — sin cambio ahí.
  const tRelClaveAncla = (!claveTieneOverride && tramoActualContador.claveSeccion && tramoActualContador.secPerBar)
    ? tRelTramo
    : tRel;
  // v3.113: (a pedido) gate visual — antes "hayClave"/el flash del ×
  // dependían solo de claveEf (clave GENERAL del tema). Un tema sin
  // clave general pero con claveSeccion en el tramo actual ahora
  // también cuenta como "hay clave" para la tira pcu y el intento de
  // flash — mismo criterio que el claveOn del scheduler (v3.113).
  const claveActivaEf = !!claveEf || !!tramoActualContador.claveSeccion;
  // v3.127: (a pedido) bombillito piloto de la clave — visible solo
  // mientras hay clave activa (mismo criterio que el resto de la UI de
  // clave, claveActivaEf), oculto por completo si no. El parpadeo en
  // cada golpe se hace más abajo, junto al flash de la × (mismo evento,
  // mismo timing).
  const clavePilotoEl = document.getElementById('clavepiloto-' + uid);
  if(clavePilotoEl) clavePilotoEl.style.display = claveActivaEf ? '' : 'none';
  const beatsEnTramo = secPerBarTramo ? Math.floor(tRelTramo / secPerBarTramo) : 0;
  const barIndex = tramoActualContador.compasInicio + beatsEnTramo;
  const beatEnBarra = secPerBeat ? Math.floor((tRelTramo - beatsEnTramo * secPerBarTramo) / secPerBeat) : 0;

  // v3.13: (a pedido) el flash del número/semáforo ahora dura medio
  // tiempo (una corchea, si el pulso es negra) en vez de quedar
  // encendido todo el beat — antes se prendía/apagaba puramente en
  // función de beatEnBarra en cada frame, así que el "encendido" duraba
  // lo mismo que el tiempo completo. Ahora se detecta el INSTANTE en
  // que cambia el beat (est.ultimoBeatVisual !== beatEnBarra) para
  // encender, y un setTimeout propio apaga a los secPerBeat/2 segundos
  // — independiente de que el playback siga o no. Mismo criterio de
  // "flash tipo luz de semáforo" pedido en v3.11, solo que más corto.
  const elCompas = est.el && est.el.compas;
  const dots = est.el && est.el.dots;
  const elPendulo = document.getElementById('pendulopunto-' + uid);
  if(beatEnBarra !== est.ultimoBeatVisual){
    est.ultimoBeatVisual = beatEnBarra;
    clearTimeout(est.flashTimeoutId);
    if(elCompas) elCompas.classList.toggle('activo', beatEnBarra === 0);
    if(elPendulo) elPendulo.classList.toggle('beat1', beatEnBarra === 0);
    for(let i = 0; i < compasEfectivoDe(est); i++){
      const dot = dots ? dots[i] : document.getElementById('dot-' + uid + '-' + i);
      if(dot) dot.classList.toggle('activo', i === beatEnBarra);
    }
    est.flashTimeoutId = setTimeout(() => {
      if(elCompas) elCompas.classList.remove('activo');
      if(elPendulo) elPendulo.classList.remove('beat1');
      const dotActivo = dots ? dots[beatEnBarra] : document.getElementById('dot-' + uid + '-' + beatEnBarra);
      if(dotActivo) dotActivo.classList.remove('activo');
    }, Math.max(60, (secPerBeat * 1000) / 2));
  }
  if(elCompas) elCompas.textContent = barIndex;
  const elBeat = document.getElementById('beat-' + uid);
  if(elBeat) elBeat.textContent = '· ' + (beatEnBarra + 1);

  // v3.223: (port de ensayo.html v3.257/v3.259/v3.261/v3.263/v3.270)
  // brazo de péndulo — misma base (tRelTramo/secPerBarTramo/barIndex)
  // que ya calcula el contador un poco más arriba, sin recalcular nada.
  if(elPendulo){
    const tRelBarra = tRelTramo - beatsEnTramo * secPerBarTramo;
    const fracBar = secPerBarTramo ? Math.min(1, Math.max(0, tRelBarra / secPerBarTramo)) : 0;
    const velocidadPendulo = est.pendVelocidadOverride || 2;
    const absCiclo = (barIndex + fracBar) * velocidadPendulo;
    const ciclo = Math.floor(absCiclo);
    const fracCiclo = absCiclo - ciclo;
    const pos = (ciclo % 2 === 0) ? (-1 + 2 * fracCiclo) : (1 - 2 * fracCiclo);
    const panelPendulo = elPendulo.parentElement;
    const anchoRiel = panelPendulo ? panelPendulo.clientWidth : 140;
    const RECORRIDO_PX = Math.max(0, (anchoRiel - 4) / 2);
    elPendulo.style.transform = 'translateX(' + (pos * RECORRIDO_PX) + 'px)';
    if(ciclo !== est.pendUltimoCiclo){
      est.pendUltimoCiclo = ciclo;
      clearTimeout(est.pendReboteTimeoutId);
      elPendulo.classList.remove('pendulo-rebote');
      void elPendulo.offsetWidth;
      elPendulo.classList.add('pendulo-rebote');
      est.pendReboteTimeoutId = setTimeout(() => elPendulo.classList.remove('pendulo-rebote'), 120);
    }
  }

  // v3.148: (a pedido) mismo criterio que ya usa dibujarWaveform
  // (línea con este mismo comentario, v3.136) — si el músico tildó
  // "Ocultar etiquetas de estructura" (ej. cargó un archivo local que
  // es OTRO tema, sin relación con las secciones de staff), el badge
  // "6 comp. · Solo · 0:00-0:09 · Compás 1-6" tampoco debe mostrarse.
  // Antes solo se ocultaba en el waveform; acá seguía viéndose el
  // mismo dato del tema viejo.
  const secciones = seccionesRuntimeDe(est).slice().sort((a,b) => (a.desdeSegundos||0) - (b.desdeSegundos||0));
  let actual = null, siguiente = null, actualIdx = -1;
  // v3.42: (a pedido) con archivo local, el seek a veces cae unas
  // décimas ANTES del segundo pedido (el navegador ajusta al
  // fotograma de audio más cercano, no siempre exacto) — sin margen,
  // eso hacía que la sección detectada fuera la anterior a la que se
  // tocó.
  // v3.47: (a pedido) el margen SOLO se aplica a la sección que fue
  // objetivo de un salto manual reciente (est.seekManualObjetivo, ver
  // irASeccionPractica) — antes se aplicaba a TODAS las secciones
  // TODO el tiempo, lo que hacía que cualquier sección encendiera
  // 0.25s antes de su límite real durante reproducción normal.
  const MARGEN_SECCION = 0.25;
  secciones.forEach((sec, i) => {
    const esObjetivoReciente = est.seekManualObjetivo != null && Math.abs(est.seekManualObjetivo - desdeRawSeccion(sec)) < 0.001;
    const margen = esObjetivoReciente ? MARGEN_SECCION : 0;
    if(tiempoActual >= (sec.desdeSegundos || 0) - margen){ actual = sec; siguiente = secciones[i+1] || null; actualIdx = i; }
  });
  // v3.79/v3.157: (a pedido) "el chip enciende cuando estoy fuera del
  // rango de reproducción de esa sección" — el forEach de arriba solo
  // mira CUÁNDO EMPIEZA cada sección (desdeSegundos), nunca su propio
  // final. Se chequea el límite real de "actual" para apagar el
  // chip/etiqueta cuando corresponde. v3.157: decisión de diseño del
  // usuario tras el bug del "hueco" — "Hasta" (hastaSegundos) es SOLO
  // una meta visual (ver barra de progreso más abajo, que sí la usa);
  // el límite real que manda acá es el mismo que ya usa el motor de
  // audio/conteo (recorrerTramosMusico): si hay sección siguiente, el
  // límite real es su inicio, sin importar "Hasta". Solo se usa
  // hastaSegundos como límite real cuando NO hay siguiente sección
  // (ahí no hay de dónde más sacar un fin). La última sección sin fin
  // manual ni siguiente no tiene límite real, así que se deja
  // encendida hasta que termine el audio, como ya era el comportamiento
  // esperado ahí.
  if(actual){
    const finSecChequeo = siguiente ? (siguiente.desdeSegundos || 0) : actual.hastaSegundos;
    if(finSecChequeo != null && tiempoActual >= finSecChequeo){
      actual = null;
      actualIdx = -1;
    }
  }
  const elSeccion = document.getElementById('seccion-' + uid);
  // v3.40: (a pedido) antes esto corría sin condición en cada frame,
  // reiniciando la transición del chip aunque siguiera siendo el mismo
  // — ahora solo se tocan las clases cuando la sección activa cambió.
  const nuevoChipKey = actual ? desdeRawSeccion(actual) : null;
  if(nuevoChipKey !== est.ultimaSeccionChip){
    if(est.ultimaSeccionChip !== undefined && est.ultimaSeccionChip !== null){
      const chipAnterior = document.getElementById('chip-' + uid + '-' + est.ultimaSeccionChip);
      if(chipAnterior) chipAnterior.classList.remove('activo');
      const bloqueAnterior = document.getElementById('mapabloque-' + uid + '-' + est.ultimaSeccionChip);
      if(bloqueAnterior) bloqueAnterior.classList.remove('activo');
    }
    if(actual){
      const chipActual = document.getElementById('chip-' + uid + '-' + desdeRawSeccion(actual));
      if(chipActual) chipActual.classList.add('activo');
      const bloqueActual = document.getElementById('mapabloque-' + uid + '-' + desdeRawSeccion(actual));
      if(bloqueActual){
        bloqueActual.classList.add('activo');
      }
    }
    est.ultimaSeccionChip = nuevoChipKey;
    // v3.193: (a pedido, portado de ensayo.html v3.212) la sección
    // realmente cambió — si había una marcada como "desactivada
    // manualmente" (deseleccionar), ya no aplica: esa sección quedó
    // atrás. Sin esto, si el músico deselecciona y el playback vuelve
    // más tarde a pasar por esa MISMA sección (loop del tema,
    // repetición), el waveform la seguiría salteando para siempre.
    est.seccionDesactivadaSegundos = null;
  }
  const elFill = document.getElementById('progfill-' + uid);
  actualizarPlayerbarPractica(uid, tiempoActual);
  const elTxt = document.getElementById('progtxt-' + uid);
  if(actual && elFill){
    // v3.35: (a pedido) la barra de progreso toma el color de la
    // sección que está sonando en este momento — mismo color e índice
    // (colorSeccionPorIndice) que ya usan el chip de arriba y el
    // waveform, así las 3 vistas quedan consistentes de un vistazo.
    elFill.style.background = colorDeSeccionEnLista(secciones, actualIdx);
    const inicioSec = actual.desdeSegundos || 0;
    // v3.111: (a pedido) tramo real de ESTA sección (compasOverride) —
    // reusa tramosContador ya construido arriba. secPerBarTramoActual
    // reemplaza al secPerBar general en el fallback de fin/duración/
    // rango de compás de la etiqueta (compasesSeccion/barInicio), que
    // antes asumían el compás general para TODO el tema.
    const tramoDeActual = tramoMusicoEnSegundo(tramosContador, inicioSec);
    const secPerBarTramoActual = tramoDeActual.secPerBar || secPerBar;
    // v3.29: fin manual (hastaSegundos, guia-practica.html v1.6) tiene
    // prioridad si la sección lo trae definido; si no, mismo criterio
    // de siempre (inicio de la siguiente, o +4 compases si es la última).
    const finManual = actual.hastaSegundos;
    const finSec = (finManual != null) ? finManual : (siguiente ? (siguiente.desdeSegundos || 0) : (inicioSec + secPerBarTramoActual * 4));
    const pct = finSec > inicioSec ? Math.min(100, Math.max(0, ((tiempoActual - inicioSec) / (finSec - inicioSec)) * 100)) : 100;
    // v3.219: (a pedido) "la barrita de progreso aún no identifica los loops
    // fuera de sección" — con varias secciones, pasado el "Hasta" de la
    // activa (hueco antes de la siguiente) la barra seguía en modo sección
    // (100%, "Siguiente: X en 0 comp.") y recortaba el loop, así que no se
    // veía. Respeta la decisión de v3.157 (el límite REAL de sección sigue
    // siendo el inicio de la siguiente — chip, cifrado y motor no cambian):
    // SOLO la barra usa el loop marcado como referencia, igual que el bloque
    // else de más abajo. Sin loop marcado, o con el loop de sección activo
    // (que ya cubre la sección), queda exactamente como antes.
    const refLoopHueco = (finManual != null && tiempoActual >= finManual && !est.loopSeccionActivo
      && est.loopInicio != null && est.loopFin != null && est.loopFin > est.loopInicio)
      ? { ini: est.loopInicio, fin: est.loopFin } : null;
    let compasesLoopHueco = 0;
    if(refLoopHueco){
      const tramoLoopHueco = tramoMusicoEnSegundo(tramosContador, refLoopHueco.ini);
      const secPerBarLoopHueco = tramoLoopHueco.secPerBar || secPerBar;
      compasesLoopHueco = secPerBarLoopHueco > 0 ? Math.max(1, Math.round((refLoopHueco.fin - refLoopHueco.ini) / secPerBarLoopHueco)) : 0;
      const pctLoopHueco = Math.min(100, Math.max(0, ((tiempoActual - refLoopHueco.ini) / (refLoopHueco.fin - refLoopHueco.ini)) * 100));
      elFill.style.width = pctLoopHueco + '%';
      elFill.style.background = '';
    }else{
      elFill.style.width = pct + '%';
    }
    // v3.78/v3.81: (a pedido) etiqueta de sección junto al contador —
    // ya no dice "Sección:" (redundante, el nombre solo alcanza), y
    // ahora destaca la duración EN COMPASES (jerarquía visual mayor,
    // ver .practica-seccion-compases) por sobre el rango en minutos
    // (que queda en segundo plano, .practica-seccion-detalle). El
    // conteo de compases usa el mismo secPerBar/inicioSec/finSec que
    // ya calcula la barra de progreso, redondeado al compás más
    // cercano (una sección real casi siempre cae justo en compases;
    // el redondeo es solo por si el dato guardado no cae exacto).
    // v3.85.1: FIX — compasesSeccion/barInicio se calculaban adentro
    // del if(elSeccion){...} (const con scope de bloque) pero
    // actualizarCifradoPractica() los usaba AFUERA de ese bloque →
    // ReferenceError en cada frame con sección activa, que cortaba en
    // seco actualizarContadorPractica() antes de llegar al loop
    // automático / seguimiento del waveform más abajo (por eso
    // "no arrancaba" al elegir sección). Se sacan del if para que
    // vivan en el scope del bloque completo — mismo cálculo, mismo
    // resultado, sin cambiar nada del criterio de compás/waveform.
    // v3.111: FIX — compasesSeccion ahora usa secPerBarTramoActual (el
    // compás real de ESTA sección) en vez del general fijo.
    const compasesSeccion = secPerBarTramoActual > 0 ? Math.max(1, Math.round((finSec - inicioSec) / secPerBarTramoActual)) : 0;
    actualizarTicksProgresoPractica(uid, est, refLoopHueco ? compasesLoopHueco : compasesSeccion);
    if(refLoopHueco) actualizarLoopRangeProgresoPractica(uid, est, refLoopHueco.ini, refLoopHueco.fin);
    else actualizarLoopRangeProgresoPractica(uid, est, inicioSec, finSec);
    // v3.82: (a pedido) rango de compás inicio-fin de la sección,
    // debajo del rango en minutos — misma fórmula del barIndex del
    // contador grande (offset+offsetLocalDelta, secPerBar), aplicada
    // a inicioSec/finSec en vez de a tiempoActual. barFin es el
    // último compás DENTRO de la sección (barInicio + duración - 1),
    // no el primero de la siguiente.
    // v3.111: FIX — barInicio pasa a ser el número de compás ABSOLUTO
    // acumulado por tramos (mismo criterio que barIndex del contador
    // grande), no el cálculo plano contra el compás general. Sin
    // compasOverride cargado, mismo resultado de siempre.
    const barInicio = compasDeSegundosMusico(tramosContador, inicioSec);
    // v3.228: (port de ensayo.html v3.279) chip "compás actual/último"
    // pegado a la barra — mismo criterio de numeración absoluta que
    // ya usa el rango "Compás X–Y" de la etiqueta de sección de abajo.
    const elCompas = document.getElementById('progcompas-' + uid);
    if(elCompas && !refLoopHueco){
      const barFinChip = barInicio + compasesSeccion - 1;
      const compasActualChip = Math.min(barFinChip, barInicio + Math.floor((tiempoActual - inicioSec) / secPerBarTramoActual));
      elCompas.textContent = `${compasActualChip}/${barFinChip}`;
    }
    if(elSeccion){
      const barFin = barInicio + compasesSeccion - 1;
      elSeccion.style.setProperty('--sec-color', colorDeSeccionEnLista(secciones, actualIdx));
      // v3.118: (a pedido) el compasOverride de la sección (3/4, 5/4,
      // etc.) no se veía en ningún lado del panel de práctica — solo
      // era editable en guia-practica.html. Se agrega como badge chico
      // junto al nombre, SOLO cuando la sección tiene un compás propio
      // distinto del general (tramoDeActual.beats, ya resuelto arriba)
      // — sin override, no se muestra nada nuevo.
      const compasBadge = (tramoDeActual.beats && tramoDeActual.beats !== compasEfectivoDe(est))
        ? `<span class="practica-seccion-compas-badge">${escapeHtml((actual.compasOverride || '').trim() || (tramoDeActual.beats + '/4'))}</span>`
        : '';
      elSeccion.innerHTML = `<span class="practica-seccion-compases">${compasesSeccion} comp.</span>` +
        `<span class="practica-seccion-detalle"> · ${escapeHtml(actual.nombre)} · ${segundosATextoPractica(inicioSec)}–${segundosATextoPractica(finSec)}</span>` +
        compasBadge +
        `<span class="practica-seccion-compas-rango">Compás ${barInicio}–${barFin}</span>`;
      elSeccion.style.display = '';
    }
    // v3.84.1: panel de letra/acordes — reusa barIndex/barInicio/
    // compasesSeccion (mismos que ya arma la etiqueta de arriba) para
    // saber qué línea resaltar.
    actualizarCifradoPractica(uid, est, actual, barIndex, actualIdx, barInicio, compasesSeccion, secciones);
    actualizarLetraCompletaPractica(uid, actual);
    // v3.96: (a pedido) más visible (antes texto chico gris apagado) +
    // compases como jerarquía principal, minutos como dato secundario
    // entre paréntesis — para el músico, la distancia real es "en
    // cuántos compases", no en segundos. Mismo secPerBar/finSec que ya
    // calcula el resto de esta función.
    if(elTxt){
      if(refLoopHueco){
        elTxt.textContent = 'En loop (fuera de sección)';
      }else if(siguiente){
        const compasesRestantes = secPerBar > 0 ? Math.max(0, Math.ceil((finSec - tiempoActual) / secPerBar)) : null;
        const distanciaTxt = compasesRestantes != null
          ? `${compasesRestantes} comp. (${segundosATextoPractica(finSec - tiempoActual)})`
          : segundosATextoPractica(finSec - tiempoActual);
        elTxt.textContent = `Siguiente: ${siguiente.nombre} en ${distanciaTxt}`;
      } else {
        elTxt.textContent = '';
      }
    }
    // v3.29: mientras el loop de sección está activo, la franja verde
    // del waveform sigue a la sección actual en cada momento (mismo
    // inicioSec/finSec de arriba) — igual que ya hace el loop manual.
    // v3.48: solo se reconfigura el loop nativo cuando el rango REALMENTE
    // cambió (cruce de sección) — no en cada frame, para no reiniciar el
    // nodo de audio 60 veces por segundo sin necesidad.
    // v3.48.2: (a pedido) inicioSec/finSec vienen del dato guardado tal
    // cual (desdeSegundos/hastaSegundos), que puede caer una fracción
    // de segundo antes/después del borde matemático del compás. Con el
    // mecanismo viejo de vigilar-y-saltar eso no se notaba (tenía
    // tolerancia); con el loop nativo sample-accurate (Web Audio) sí se
    // nota — el loop cerraba un poco antes del compás real ("muela").
    // Se snapea SOLO lo que se manda al loop nativo (mismo criterio que
    // ya usan marcarLoopPractica/loopRapidoCompasesPractica) — inicioSec/
    // finSec sin snapear siguen usándose tal cual para el % de la barra,
    // la franja del waveform y el texto "Siguiente en...".
    // v3.49: (a pedido) fix del fix — acá se estaba usando bpmEf (el
    // BPM EFECTIVO, que puede ser un tempo de práctica más lento solo
    // para el metrónomo visual) en vez de est.bpm (el BPM REAL del
    // audio). El propio criterio del archivo (ver comentario arriba de
    // actualizarContadorPractica) es que todo lo que deba coincidir con
    // el audio real — como marcarLoopPractica/loopRapidoCompasesPractica
    // ya hacían — usa SIEMPRE est.bpm, nunca bpmEf. Con bpmEf corriendo
    // a otro tempo, el snap caía en un punto de grilla que no
    // correspondía al compás real del audio, y la muela seguía.
    // v3.49 (fix 3, la causa real): la línea "CORO 1" que se ve en el
    // waveform NUNCA se dibujaba desde est.loopInicio — vive en un
    // bloque de código totalmente aparte (dibujarWaveform/infoSecciones)
    // que usaba sec.desdeSegundos crudo. Por eso nada de lo de arriba
    // cambiaba lo que se veía en pantalla, aunque el audio del loop sí
    // se hubiera corregido. Esa línea ahora se snapea a la misma grilla
    // que los ticks (ver dibujarWaveform, offsetEfectivo incluido) —
    // acá se usa exactamente el mismo criterio (bpm/offset) para que el
    // loop nativo (lo que se ESCUCHA) coincida siempre con la línea (lo
    // que se VE), sin importar el offset calibrado en cada momento.
    if(est.loopSeccionActivo){
      const bpmSnap = est.bpmEfectivo || est.bpm;
      // v3.109: beats de la sección activa (compasOverride) en vez del
      // general fijo — mismo criterio que el resto de los snaps de loop.
      const beatsSeccionActiva = beatsPorBarraDeSeccionMusico(actual || {}, compasEfectivoDe(est));
      // v3.111: FIX — v3.109 seguía anclando contra offsetSnap (offset
      // GLOBAL del tema); acá el ancla correcta es inicioSec mismo (el
      // borde real de ESTA sección, ya resuelto arriba) — mismo criterio
      // de "reinicio en el borde" que el resto de los snaps. Con anclaje
      // en inicioSec, loopInicioSnap siempre da exactamente inicioSec
      // (sin drift), y loopFinSnap snapea finSec contra la grilla propia
      // de este tramo, no la del tema completo.
      const loopInicioSnap = snapACompasPractica(inicioSec, bpmSnap, beatsSeccionActiva, inicioSec);
      const loopFinSnap = (finManual != null)
        ? finManual
        : snapACompasPractica(finSec, bpmSnap, beatsSeccionActiva, inicioSec);
      if(est.loopInicio !== loopInicioSnap || est.loopFin !== loopFinSnap){
        est.loopInicio = loopInicioSnap;
        est.loopFin = loopFinSnap;
        aplicarLoopNativoPractica(uid);
      }
    }
    // (a pedido) loop automático de sección — usa el mismo inicioSec/
    // finSec de arriba, así que "el final de la sección" es idéntico
    // al que ya muestra la barra de progreso/el texto "Siguiente en...".
    // Actúa si hay una sección siguiente real, O si esta sección trae
    // un fin manual definido (hastaSegundos) — en ambos casos finSec es
    // un límite real. Con la última sección y sin fin manual, finSec es
    // el estimado de +4 compases que ya usa la barra de progreso — no
    // un límite real del audio, así que ahí NO se fuerza el loop para
    // no cortar el tema antes de que termine.
    // v3.48: si el motor actual maneja loop nativo (Web Audio), este
    // salto manual ya no hace falta — el propio audio nunca llega a
    // cruzar finSec, así que la condición de abajo prácticamente nunca
    // se cumple; se deja como respaldo para YouTube/<audio> nativo (a
    // otra velocidad), que siguen con el mecanismo de vigilar-y-saltar.
    const loopEsNativo = est.audioActivo && typeof est.audioActivo.setLoop === 'function';
    if(est.loopSeccionActivo && (siguiente || finManual != null) && tiempoActual >= finSec && !loopEsNativo){
      // v3.29: reinicio instantáneo del fill (sin la animación de
      // 0.15s) — se saca la transición un instante, se fuerza reflow,
      // y se restaura, solo para este salto de loop puntual.
      if(elFill){
        elFill.style.transition = 'none';
        elFill.style.width = '0%';
        elFill.offsetHeight; // fuerza reflow para que el 'none' tome efecto ya
        elFill.style.transition = '';
      }
      est.seek(inicioSec);
    }
  } else if(elFill){
    // v3.214: (a pedido) "la barrita de progreso aún no identifica
    // loops que están fuera de sección definida" — antes, sin una
    // sección activa (huecos entre secciones, intro/outro sin
    // etiquetar) la barra quedaba en blanco (0%, sin ticks, sin
    // franja) aunque hubiera un loop marcado sonando justo ahí. Ahora,
    // si hay un loop marcado (est.loopInicio/est.loopFin) se usa el
    // loop mismo como referencia de la barra — progreso dentro del
    // loop, ticks de compás del tramo en ese punto (tramosContador ya
    // calculado arriba), franja verde cubriendo el 100% (todo lo
    // visible ES el loop) — mismo criterio visual que una sección,
    // sin depender de que haya una etiquetada ahí. Sin loop marcado,
    // sigue el comportamiento de siempre (barra en blanco).
    if(est.loopInicio != null && est.loopFin != null && est.loopFin > est.loopInicio){
      const inicioLoopBar = est.loopInicio, finLoopBar = est.loopFin;
      const pctLoop = Math.min(100, Math.max(0, ((tiempoActual - inicioLoopBar) / (finLoopBar - inicioLoopBar)) * 100));
      elFill.style.width = pctLoop + '%';
      elFill.style.background = '';
      const tramoDeLoop = tramoMusicoEnSegundo(tramosContador, inicioLoopBar);
      const secPerBarLoop = tramoDeLoop.secPerBar || secPerBar;
      const compasesLoop = secPerBarLoop > 0 ? Math.max(1, Math.round((finLoopBar - inicioLoopBar) / secPerBarLoop)) : 0;
      actualizarTicksProgresoPractica(uid, est, compasesLoop);
      actualizarLoopRangeProgresoPractica(uid, est, inicioLoopBar, finLoopBar);
      if(elTxt) elTxt.textContent = 'En loop (fuera de sección)';
      if(elSeccion) elSeccion.style.display = 'none';
      const elCompasLoop = document.getElementById('progcompas-' + uid);
      if(elCompasLoop) elCompasLoop.textContent = '';
    } else {
      elFill.style.width = '0%';
      elFill.style.background = ''; // v3.35: sin sección activa, vuelve al dorado por defecto (CSS)
      if(elTxt) elTxt.textContent = '';
      if(elSeccion) elSeccion.style.display = 'none';
      const elCompasVacio = document.getElementById('progcompas-' + uid);
      if(elCompasVacio) elCompasVacio.textContent = '';
      est.progresoTicksCompases = null;
      const contTicksVacio = document.getElementById('progticks-' + uid);
      if(contTicksVacio) contTicksVacio.innerHTML = '';
      const elLoopVacio = document.getElementById('progloop-' + uid);
      if(elLoopVacio) elLoopVacio.style.display = 'none';
    }
    actualizarCifradoPractica(uid, est, null, barIndex, -1);
    actualizarLetraCompletaPractica(uid, null);
  }

  // v2.0/v2.4: turno del ciclo de clave (compás 1 o 2 de la célula) —
  // usa claveEf/claveCicloSecEf (con override), y el div ahora siempre
  // existe en el DOM (se muestra/oculta desde cambiarClavePractica()).
  if(claveActivaEf && claveCicloSecEf){
    const tCiclo = tRelClaveAncla % claveCicloSecEf;
    const compasClave = Math.floor(tCiclo / secPerBar); // 0 o 1
    if(compasClave !== est.ultimoCompasClave){
      const anterior = document.getElementById('clavebar-' + uid + '-' + est.ultimoCompasClave);
      if(anterior) anterior.classList.remove('activo');
      const actualClave = document.getElementById('clavebar-' + uid + '-' + compasClave);
      if(actualClave) actualClave.classList.add('activo');
      est.ultimoCompasClave = compasClave;

      // v3.14: (a pedido) flash verde + agrandamiento del tick de
      // comienzo de compás en la línea de clave correspondiente —
      // mismo criterio visual y misma duración (medio tiempo) que el
      // número grande de compás (v3.11/v3.13), pero sincronizado con
      // el inicio real del compás DE LA CLAVE (este bloque), no con el
      // pulso general — son dos relojes distintos (célula de 2
      // compases vs. compás simple).
      clearTimeout(est.claveTickFlashTimeoutId);
      const tickActual = document.getElementById('clavetick0-' + uid + '-' + compasClave);
      if(tickActual){
        tickActual.classList.add('activo');
        est.claveTickFlashTimeoutId = setTimeout(() => {
          tickActual.classList.remove('activo');
        }, Math.max(60, (secPerBeat * 1000) / 2));
      }
    }
  }

  // v2.8: enciende la × de la clave que corresponde al golpe actual —
  // corre siempre que hay clave (no solo con clickActivo), para que
  // el seguimiento visual funcione aunque el click esté mudo.
  if(claveActivaEf && claveOnsetsEf && claveOnsetsEf.length && claveCicloSecEf){
    const n = claveOnsetsEf.length;
    const cicloIndex = Math.floor(tRelClaveAncla / claveCicloSecEf);
    const tCiclo = tRelClaveAncla - cicloIndex * claveCicloSecEf;
    let idxLocal = -1;
    for(let i = 0; i < n; i++){ if(tCiclo >= claveOnsetsEf[i]) idxLocal = i; }
    const eventoGlobal = idxLocal === -1 ? (cicloIndex * n - 1) : (cicloIndex * n + idxLocal);
    if(eventoGlobal !== est.ultimoOnsetClave){
      est.ultimoOnsetClave = eventoGlobal;
      // v3.74: (a pedido) antes el sonido de la clave necesitaba que
      // el metrónomo (clickActivo) también estuviera prendido, aunque
      // el botón 🪘 (claveActiva) estuviera activado — la clave no
      // podía sonar sola. Ahora depende solo de claveActiva: puede
      // sonar con el metrónomo apagado, prendido, o los dos juntos
      // (superposición ya resuelta en v3.73).
      // v3.97: el beep de la clave ya NO se dispara acá (dependía de
      // rAF, con jitter en móvil) — ahora lo agenda con anticipación
      // schedulerTickGlobalPractica() usando el reloj de Web Audio. Este
      // bloque queda solo para el flash VISUAL de la ×, que no necesita
      // precisión de muestra.
      if(est.ultimaNotaClaveEl) est.ultimaNotaClaveEl.classList.remove('activo');
      clearTimeout(est.claveNotaFlashTimeoutId);
      clearTimeout(est.claveNotaVisualOnTimeoutId);
      if(idxLocal >= 0){
        // v3.71: (a pedido, "se ve adelantada la clave") el sonido
        // (beepPractica, arriba) sigue disparándose YA MISMO — el oído
        // es sensible a latencia de audio. Solo el flash VISUAL se
        // retrasa unos ms: es un ajuste perceptual (el ojo suele pedir
        // el evento visual un poco después del sonido para sentirlos
        // "juntos"), no una corrección de cálculo. Valor de partida
        // conservador (25ms) — si se sigue sintiendo desfasado (para
        // cualquier lado), este es el número a subir o bajar. Se movió
        // arriba del bloque (antes vivía solo dentro de "if(notaEl)")
        // porque ahora el bombillito piloto (v3.127) también la usa,
        // independiente de si hay un marcador notaEl en el DOM.
        const DELAY_VISUAL_CLAVE_MS = 25;
        // v3.127: (a pedido) bombillito piloto — parpadea en TODO golpe
        // real de la clave, exista o no un marcador notaEl para él (a
        // diferencia de la ×, que se omite en la degradación segura de
        // v3.113 cuando no hay marcador correspondiente). Mismo delay y
        // duración que la ×, para que se sientan "juntos".
        if(clavePilotoEl){
          clearTimeout(est.clavePilotoFlashTimeoutId);
          clearTimeout(est.clavePilotoVisualOnTimeoutId);
          est.clavePilotoVisualOnTimeoutId = setTimeout(() => {
            clavePilotoEl.classList.add('activo');
            est.clavePilotoFlashTimeoutId = setTimeout(() => {
              clavePilotoEl.classList.remove('activo');
            }, Math.max(60, (secPerBeat * 1000) / 2));
          }, DELAY_VISUAL_CLAVE_MS);
        }
        const patronEf = CLAVE_PATRONES[claveEf];
        const lado0Len = patronEf ? patronEf[0].length : 0;
        const lado1Len = patronEf ? patronEf[1].length : 0;
        // v3.113: (a pedido) degradación segura — los marcadores
        // clavenota-uid-barIdx-posIdx del DOM se generaron una sola
        // vez con la forma de la clave GENERAL del tema (patronEf).
        // Si el tramo actual usa una claveSeccion propia con una
        // cantidad de golpes distinta (n) a la de patronEf, no hay
        // marcador que le corresponda con certeza — se omite el flash
        // visual en vez de arriesgar encender el × equivocado. El
        // sonido y el ciclo de la tira pcu siguen funcionando igual;
        // solo se pierde este detalle fino en esas secciones.
        // v3.115: (a pedido) si el tramo declara su PROPIA claveSeccion,
        // la × que corresponde es la generada al vuelo
        // (actualizarNotasClaveDinamicasTira, id clavenota-uid-t-idxLocal)
        // en vez de la estática de la plantilla home (que asume la
        // clave GENERAL, patronEf) — mismo idxLocal ya resuelto arriba
        // contra claveOnsetsEf, que para estos tramos YA es su patrón
        // propio (ver líneas ~4172).
        const tieneClaveSeccionPropia = !!tramoActualContador.claveSeccion;
        const patronCoincide = !tieneClaveSeccionPropia && patronEf && (lado0Len + lado1Len) === n;
        const barIdx = idxLocal < lado0Len ? 0 : 1;
        const posIdx = idxLocal < lado0Len ? idxLocal : idxLocal - lado0Len;
        const notaEl = tieneClaveSeccionPropia
          ? document.getElementById('clavenota-' + uid + '-t-' + idxLocal)
          : (patronCoincide ? document.getElementById('clavenota-' + uid + '-' + barIdx + '-' + posIdx) : null);
        if(notaEl){
          est.claveNotaVisualOnTimeoutId = setTimeout(() => {
            notaEl.classList.add('activo');
            // v3.14: (a pedido) el golpe de clave ahora es un flash corto
            // (medio tiempo, igual que el número/semáforo — v3.13) en vez
            // de quedar encendido hasta el próximo golpe, que podía tardar
            // mucho más de un tiempo según el patrón.
            est.claveNotaFlashTimeoutId = setTimeout(() => {
              notaEl.classList.remove('activo');
            }, Math.max(60, (secPerBeat * 1000) / 2));
          }, DELAY_VISUAL_CLAVE_MS);
        }
        est.ultimaNotaClaveEl = notaEl || null;
      } else {
        est.ultimaNotaClaveEl = null;
      }
    }
  }

  // v3.62/v3.61: actualización de los puntos de la tira unificada —
  // resolución de negras (un punto por tiempo, no por corchea). La ×
  // de clave YA la enciende el bloque de arriba (busca
  // clavenota-uid-barIdx-posIdx, que ahora sí existe en el DOM porque
  // pulsoClaveUnificadoHtml() reusa ese mismo id) — no hace falta
  // lógica nueva para eso acá.
  {
    const hayClave = !!(claveActivaEf && claveCicloSecEf);
    // v3.115: (a pedido) FIX — con clave activa esto forzaba SIEMPRE
    // el compás GENERAL (hayClave ? est.compasesPorBarra : ...), así
    // que un tramo con compasOverride Y clave activa (ej. coro en 3/4
    // con clave sonando) nunca mostraba su propia plantilla. Ahora la
    // plantilla deseada es SIEMPRE el compás real del tramo
    // (tramoActualContador.beats, ya calculado arriba), tenga o no
    // clave activa.
    const beatsTramoPcuDeseado = tramoActualContador.beats || compasEfectivoDe(est);
    // v3.114: si la plantilla deseada no existe en el DOM (compás
    // fuera del vocabulario básico y distinto del general), se cae al
    // compás general — misma degradación segura que la clave. Se
    // resuelve ACÁ (no solo al cambiar de tira) para que
    // totalTiempos/tiempoGlobal siempre calculen con el compás que
    // realmente se va a mostrar, no con el deseado si no existe.
    const beatsTramoPcu = document.getElementById('pcu-tira-' + uid + '-' + beatsTramoPcuDeseado)
      ? beatsTramoPcuDeseado
      : compasEfectivoDe(est);
    const esHomeTramoPcu = beatsTramoPcu === compasEfectivoDe(est);
    // v3.157: (a pedido, tras diagnóstico v3.154-156) FIX — el ciclo
    // de los PUNTOS se separa del reloj de la clave. Antes (v3.119),
    // con clave activa sin claveSeccion propia, los puntos se anclaban
    // a tRelClaveAncla (reloj GLOBAL continuo, igual que el sonido/×
    // de la clave) — correcto para que la clave no se "corte" en cada
    // sección, pero producía un salto visible en la tira de puntos
    // justo al cruzar a un tramo nuevo (el número de compás sí se
    // reinicia en tRelTramo, los puntos no, y quedaban desfasados un
    // tiempo entre sí). A pedido, los puntos ahora SIEMPRE se anclan
    // en tRelTramo/secPerBarTramo (igual que sin clave) — el sonido y
    // el flash de la × de la clave (más arriba, tRelClaveAncla) NO se
    // tocan, siguen con su propio reloj continuo como hasta ahora.
    const cicloDurPcu = hayClave ? secPerBarTramo * 2 : secPerBarTramo;
    const totalTiempos = hayClave ? beatsTramoPcu * 2 : beatsTramoPcu;
    const tCicloPcu = tRelTramo % cicloDurPcu;
    const tiempoGlobal = Math.min(totalTiempos - 1, Math.floor(tCicloPcu / secPerBeat));
    // v3.123: (a pedido) número de compás REAL del tramo (par/impar),
    // independiente de si hay clave activa — antes, el fondo dorado de
    // la card (.compas2) solo alternaba cuando había clave (porque solo
    // ahí el ciclo de puntos cubre 2 compases). Este cálculo aparte usa
    // siempre secPerBarTramo/tRelTramo (el compás real del tramo, haya
    // o no clave) SOLO para decidir el fondo de la card — no toca en
    // nada el ciclo/timing de los puntos en sí (tCicloPcu/tiempoGlobal
    // arriba, sin cambios).
    const numeroCompasPcu = secPerBarTramo > 0 ? Math.floor(tRelTramo / secPerBarTramo) : 0;
    const esSegundoCompasPcu = (numeroCompasPcu % 2) === 1;
    // v3.114: si cambió el compás del tramo, activa la plantilla
    // correspondiente (pcu-tira-uid-N) — si esa plantilla no existe en
    // el DOM (compás fuera del vocabulario básico y distinto del
    // general), se cae al compás general, mismo criterio de
    // degradación segura que ya usamos para la clave.
    if(beatsTramoPcu !== est.ultimoBeatsPcu){
      const nuevaTira = document.getElementById('pcu-tira-' + uid + '-' + beatsTramoPcu);
      if(nuevaTira){
        const stripDeUid = document.getElementById('pcu-strip-' + uid);
        const tiraPrevia = stripDeUid ? stripDeUid.querySelector('.pcu-tira-activa') : null;
        if(tiraPrevia && tiraPrevia !== nuevaTira) tiraPrevia.classList.remove('pcu-tira-activa');
        nuevaTira.classList.add('pcu-tira-activa');
        requestAnimationFrame(() => sincronizarNotasClavePulso(uid));
      }
      est.ultimoBeatsPcu = beatsTramoPcu;
      est.ultimoTiempoPcu = -1; // fuerza re-encender el punto en la tira nueva
      est.ultimaClaveSeccionPcuKey = undefined; // fuerza re-evaluar clave dinámica en la tira nueva
    }
    // v3.115: (a pedido) muestra/oculta el 2do compás de puntos
    // (.pcu-cell-bar2, siempre pre-generado — ver
    // pulsoClaveUnificadoHtml) según haya clave activa en ESTE tramo —
    // sin crear/borrar nodos, solo la clase .pcu-tira-1compas. Si el
    // tramo declara su PROPIA claveSeccion, además genera/actualiza las
    // × dinámicas con su patrón real (claveOnsetsEf/claveCicloSecEf, ya
    // resueltos arriba) — la × estática de la plantilla home usa la
    // clave GENERAL y no sirve para un patrón distinto por sección.
    const claveSeccionActual = tramoActualContador.claveSeccion || '';
    const claveDinamicaKey = beatsTramoPcu + '|' + hayClave + '|' + claveSeccionActual;
    if(claveDinamicaKey !== est.ultimaClaveSeccionPcuKey){
      const tiraActivaPcu = document.getElementById('pcu-tira-' + uid + '-' + beatsTramoPcu);
      if(tiraActivaPcu){
        tiraActivaPcu.classList.toggle('pcu-tira-1compas', !hayClave);
        actualizarNotasClaveDinamicasTira(
          tiraActivaPcu, uid,
          hayClave ? claveOnsetsEf : null,
          hayClave ? claveCicloSecEf : null
        );
        requestAnimationFrame(() => sincronizarNotasClavePulso(uid));
      }
      est.ultimaClaveSeccionPcuKey = claveDinamicaKey;
    }
    if(tiempoGlobal !== est.ultimoTiempoPcu){
      const prevDot = document.getElementById('pcu-dot-' + uid + '-' + beatsTramoPcu + '-' + est.ultimoTiempoPcu);
      if(prevDot) prevDot.classList.remove('activo');
      const dotEl = document.getElementById('pcu-dot-' + uid + '-' + beatsTramoPcu + '-' + tiempoGlobal);
      if(dotEl) dotEl.classList.add('activo');
      est.ultimoTiempoPcu = tiempoGlobal;
      const stripEl = document.getElementById('pcu-strip-' + uid);
      if(stripEl){
        // v3.123: (a pedido) antes esto solo se prendía con clave
        // activa Y en la plantilla home (hayClave && esHomeTramoPcu) —
        // ahora se prende SIEMPRE que el tramo esté en su 2do compás
        // (esSegundoCompasPcu, ver cálculo arriba), tenga o no clave, y
        // sea o no la plantilla home. Además, si el compás real del
        // tramo NO es 4/4 (beatsTramoPcu !== 4), se usa .compas-otro
        // (lila) en vez del dorado de siempre — mismo criterio de "4/4
        // es el caso por defecto" que ya se dejó en v3.122 para los
        // puntos, acá aplicado al fondo de la card.
        stripEl.classList.toggle('compas2', esSegundoCompasPcu);
        stripEl.classList.toggle('compas-otro', beatsTramoPcu !== 4);
      }
    }
  }

  // v3.97: el beep del pulso normal (est.clickActivo) ya NO se dispara
  // acá (dependía de rAF, con jitter/retraso notorio en móvil) — ahora
  // lo agenda con anticipación schedulerTickGlobalPractica() usando el
  // reloj de Web Audio (audioCtxPractica.currentTime). El pulso sigue
  // sonando siempre que clickActivo esté prendido, haya o no clave,
  // igual que antes (v3.73) — solo cambió el mecanismo de disparo, no
  // el criterio de cuándo suena.

  // v3.48: respaldo de vigilar-y-saltar para el loop MANUAL — solo
  // corre si el motor actual no maneja loop nativo (YouTube, o <audio>
  // nativo a otra velocidad); con Web Audio el propio motor ya lo hace
  // sample-accurate (ver aplicarLoopNativoPractica) y esto no llega a
  // dispararse en la práctica.
  if(est.loopActivo && est.loopFin != null && tiempoActual >= est.loopFin && !(est.audioActivo && typeof est.audioActivo.setLoop === 'function')){
    est.seek(est.loopInicio);
  }
}

<!-- Audiolink horizontal claro ANIMADO v1 · basado en audiolink-horizontal-claro.svg + hoja fondo animado v1 (pulso/luz 2.4 s, parpadeo 3.6 s, bucle 7.2 s). Sin JS: funciona con <img>. Geometría del cable fija. No respeta prefers-reduced-motion (a pedido). ESTIMADO: sin brillo (text-shadow) en la luz; en tema claro los colores de la luz/pico se tomaron de las variables claras de la hoja. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24.00 -24.00 1095.39 292.59" role="img" aria-label="Audiolink"><style>
.al-halo,.al-punto,.al-brote{transform-box:fill-box;transform-origin:center}
.al-halo{animation:al-pulso 2.4s ease-in-out infinite}
.al-punto{animation:al-latido 2.4s ease-in-out infinite}
.al-nucleo{animation:al-latido-n 2.4s ease-in-out infinite}
.al-brote{animation:al-brote 2.4s ease-in-out infinite}
@keyframes al-pulso{0%{opacity:1;transform:scale(1)}14%{opacity:.8;transform:scale(1.15)}28%{opacity:1;transform:scale(1)}42%{opacity:.9;transform:scale(1.1)}70%,100%{opacity:1;transform:scale(1)}}
@keyframes al-brote{0%{opacity:0;transform:scale(.8)}14%{opacity:.75;transform:scale(1.05)}28%{opacity:0;transform:scale(1.25)}42%{opacity:.5;transform:scale(1.1)}56%,100%{opacity:0;transform:scale(.8)}}
@keyframes al-latido{0%{transform:scale(1);fill:#E08A00}14%{transform:scale(1.3);fill:#F5A00F}28%{transform:scale(1);fill:#E08A00}42%{transform:scale(1.2);fill:#F5A00F}70%,100%{transform:scale(1);fill:#E08A00}}
@keyframes al-latido-n{0%{transform:scale(1);fill:#F5B84A}14%{transform:scale(1.3);fill:#FFD27A}28%{transform:scale(1);fill:#F5B84A}42%{transform:scale(1.2);fill:#FFD27A}70%,100%{transform:scale(1);fill:#F5B84A}}
.al-pulso-cable{stroke-dasharray:143.49 1000;stroke-dashoffset:143.49;opacity:0;animation:al-viaja 2.4s ease-in-out infinite}
@keyframes al-viaja{0%,13%{opacity:0;stroke-dashoffset:143.49}16%{opacity:1;stroke-dashoffset:100.45}38%{opacity:1;stroke-dashoffset:-856.51}42%,100%{opacity:0;stroke-dashoffset:-1000}}
.al-l{animation:al-letra-l 2.4s ease-in-out infinite}
@keyframes al-letra-l{0%,30%{fill:#A85F00}38%{fill:#FFD27A}46%{fill:#A85F00}54%{fill:#FFD27A}72%,100%{fill:#A85F00}}
.al-luz{opacity:0;animation:al-luz 2.4s linear infinite}
.al-luzbanda{animation:al-luzbanda 2.4s linear infinite}
@keyframes al-luz{0%{opacity:0}14%{opacity:0}18%{opacity:.9}46%{opacity:.9}54%{opacity:0}100%{opacity:0}}
@keyframes al-luzbanda{0%,14%{transform:translateX(0)}54%,100%{transform:translateX(630px)}}
.al-parpado{transform-box:fill-box;transform-origin:50% 0;animation:al-parpadeo 3.6s ease-in-out infinite}
@keyframes al-parpadeo{0%,87%{transform:scaleY(1)}90%{transform:scaleY(2)}93%,100%{transform:scaleY(1)}}

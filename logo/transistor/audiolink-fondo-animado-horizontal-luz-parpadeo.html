<script>
  /* alCable(el): cable que sale de la pata derecha (nunca del ojo), rodea el ojo por fuera y llega a la "l" de link. Horizontal: corre bajo "audio" y sube a la base de la l. Vertical: baja junto al ojo y entra por arriba de la l. El pulso nace en la base de la pata, baja por ella y recorre el cable. */
  (function(){
    var NS='http://www.w3.org/2000/svg';
    function alCable(w){
      var s=w.querySelector('.al-sim'), l=w.querySelector('.al-l'), bl=w.querySelector('.al-bl');

      var G=(s.getAttribute('data-geo')||'86.5 79.67 83 152.33 146 140 204 163.5').split(' ').map(Number);
      G.splice(3,1);
      var fs=parseFloat(getComputedStyle(w).fontSize), u=S.width/G[2];
      var ox=S.left-W.left, oy=S.top-W.top;
      var gx=ox+(G[3]-G[0])*u, g0=oy+(G[4]-G[1])*u, g1=oy+(G[5]-G[1])*u, xs=ox+(G[6]-G[0])*u;
      var sw=Math.max(1.25,5.5*u), lx=L.left-W.left+L.width*0.5, by=B.top-W.top;
      var r=Math.min(0.09*fs,(xs-gx)/2), rest, y1;
      if(w.classList.contains('al-v')){
        y1=S.bottom-W.top+0.03*fs;
        var ty=by-0.72*fs-0.06*fs, y2=y1+(ty-y1)*0.45, k=(y2-y1)*0.6;
        rest=' H'+(xs-r)+' Q'+xs+' '+g1+' '+xs+' '+(g1+r)+' V'+y1+' C'+xs+' '+(y1+k)+' '+lx+' '+(y2-k)+' '+lx+' '+y2+' V'+ty;
      }else{
        var yr=by+0.14*fs, r1=Math.min(r,(yr-g1)/2.2), r3=Math.min(0.09*fs,(yr-by)/1.8);
        rest=' H'+(xs-r1)+' Q'+xs+' '+g1+' '+xs+' '+(g1+r1)+' V'+(yr-r1)+' Q'+xs+' '+yr+' '+(xs+r1)+' '+yr+' H'+(lx-r3)+' Q'+lx+' '+yr+' '+lx+' '+(yr-r3)+' V'+(by+sw*0.4);

      var p=svg.querySelectorAll('path');
      p[0].setAttribute('d',base); var bw=Math.max(0.8,sw*0.55); p[0].setAttribute('stroke-width',bw);
      p[1].setAttribute('d',pulso); p[1].setAttribute('stroke-width',bw);
      var len=p[1].getTotalLength();
      p[1].style.setProperty('--len',len+'px'); p[1].style.setProperty('--dash',(0.55*fs)+'px');
      if(w.classList.contains('al-onda')){
        var og=svg.querySelector('.al-onda-g');
        if(!og){ og=document.createElementNS(NS,'g'); og.setAttribute('class','al-onda-g'); og.innerHTML='<path class="al-onda-linea"/>'; svg.appendChild(og); }
        var NB=w.querySelector('.al-nombre').getBoundingClientRect(), op=og.querySelector('path');
        var Lp=1.1*fs, lam=0.3*fs, Am=0.15*fs, yc=by-0.249*fs, x0=NB.left-W.left-0.1*fs, x1=(L.left-W.left)-0.3*fs, M=90, d='';
        for(var i=0;i<=M;i++){ var u=i/M, x=(u-0.5)*Lp, env=Math.pow(Math.sin(Math.PI*u),2), y=-Am*env*Math.sin(2*Math.PI*x/lam); d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2); }
        og.setAttribute('transform','translate('+x0+' '+yc+')');
        op.setAttribute('d',d); op.setAttribute('stroke-width',Math.max(1.2,0.04*fs));
        op.style.setProperty('--onda-dx',(x1-x0)+'px');
      }
      if(w.classList.contains('al-luz')){
        var NL=w.querySelector('.al-nombre'), NR=NL.getBoundingClientRect(), lz=w.querySelector('.al-luz-capa');
        if(!lz){ lz=NL.cloneNode(true); lz.className='al-nombre al-luz-capa'; lz.setAttribute('aria-hidden','true'); w.appendChild(lz); }
        var dl=L.left-NR.left, bw=1.0*fs;
        lz.style.left=(NR.left-W.left)+'px'; lz.style.top=(NR.top-W.top)+'px'; lz.style.width=NR.width+'px'; lz.style.height=NR.height+'px';
        lz.style.clipPath='inset(0 '+(NR.width-dl)+'px 0 0)';
        lz.style.setProperty('--luz-w',bw+'px'); lz.style.setProperty('--luz-x0',(-bw)+'px'); lz.style.setProperty('--luz-x1',(dl-bw*0.5)+'px');
      }
    }
    function todos(){ var n=document.querySelectorAll('.al-cable'); for(var i=0;i<n.length;i++) alCable(n[i]); }
    window.alCable=alCable;
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){ todos(); setTimeout(todos,120); });
    window.addEventListener('load',todos);
    window.addEventListener('resize',todos);
  })();
</script>
<script>
/* Ajuste al tamaño de pantalla. Parámetros: fracción de alto/ancho que ocupa el logo y desplazamiento vertical (vh) */
(function(){
  var P={fh:0.5,fw:0.627,dy:0};
  function fit(){
    var w=document.querySelector('.fondo > *'); if(!w||!w.classList.contains('al-cable')) return;
    w.style.fontSize='100px'; var r=w.getBoundingClientRect();
    var k=Math.min(innerHeight*P.fh/r.height, innerWidth*P.fw/r.width);
    w.style.fontSize=(100*k)+'px'; w.parentNode.style.transform='translateY('+P.dy+'vh)';
    if(window.alCable) window.alCable(w);
  }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){ fit(); setTimeout(fit,160); });
  window.addEventListener('load',fit); window.addEventListener('resize',fit);
})();
</script>

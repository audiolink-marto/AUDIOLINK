<!DOCTYPE html>
<html lang="es" data-tema="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacas · AUDIOLINK</title>
  <link rel="stylesheet" href="nav.css" />
  <style>
    /* ===== RESET / BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --bg2:      #181c26;
      --bg3:      #1e2333;
      --border:   #2a2f42;
      --text:     #e8eaf0;
      --text2:    #8b90a0;
      --accent:   #4f8ef7;
      --green:    #3ecf8e;
      --red:      #f76f6f;
      --yellow:   #f5c842;
      --radius:   10px;
      --shadow:   0 2px 12px rgba(0,0,0,.4);
    }
    [data-tema="light"] {
      --bg:     #f0f2f7;
      --bg2:    #ffffff;
      --bg3:    #e4e8f0;
      --border: #cdd2df;
      --text:   #1a1d2e;
      --text2:  #5a6070;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
    }

    #mainWrap {
      flex: 1;
      margin-left: 220px;
      transition: margin-left .25s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #mainWrap.expanded { margin-left: 64px; }

    .main-content {
      padding: 28px 24px 80px;
      max-width: 960px;
      width: 100%;
    }

    /* ===== HEADER ===== */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
    }
    .page-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== BOTONES ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { opacity: .85; }
    .btn-green { background: var(--green); color: #111; }
    .btn-green:hover { opacity: .85; }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 8px 16px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ===== VACAS GRID ===== */
    .vacas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .vaca-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .vaca-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }

    .vaca-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .vaca-nombre {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .badge-activa  { background: rgba(62,207,142,.15); color: var(--green); }
    .badge-cerrada { background: rgba(139,144,160,.15); color: var(--text2); }

    .vaca-desc {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .vaca-stats {
      display: flex;
      gap: 16px;
    }
    .vaca-stat label {
      display: block;
      font-size: 10px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 2px;
    }
    .vaca-stat span {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* progreso */
    .progreso-bar {
      margin-top: 14px;
      height: 5px;
      background: var(--bg3);
      border-radius: 99px;
      overflow: hidden;
    }
    .progreso-fill {
      height: 100%;
      background: var(--green);
      border-radius: 99px;
      transition: width .4s;
    }

    /* ===== ESTADO VACÍO ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }
    .empty-state .ico { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ===== VISTA DETALLE ===== */
    #vistaDetalle { display: none; }
    #vistaDetalle.show { display: block; }
    #vistaLista.hidden { display: none; }

    .detalle-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .detalle-header h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .detalle-meta {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }

    /* tabla participantes */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text2);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg3); }

    .estado-chip {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .chip-pagado   { background: rgba(62,207,142,.15); color: var(--green); }
    .chip-parcial  { background: rgba(245,200,66,.15); color: var(--yellow); }
    .chip-pendiente{ background: rgba(247,111,111,.15); color: var(--red); }

    .acciones-td { display: flex; gap: 6px; align-items: center; }

    /* ===== MODALES ===== */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.show { display: flex; }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      animation: modalIn .18s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(-12px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    .modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h4 { font-size: 1rem; font-weight: 700; }
    .modal-close {
      background: none; border: none;
      color: var(--text2); font-size: 1.2rem;
      cursor: pointer; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--accent); }

    /* toast */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      z-index: 2000;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: none; }

    /* loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text2);
      font-size: 13px;
      gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      #mainWrap { margin-left: 0; padding-top: 56px; }
      .main-content { padding: 20px 16px 80px; }
      .acciones-td { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div id="nav-mount"></div>

<div id="mainWrap">
  <div class="main-content">

    <!-- ===== VISTA LISTA ===== -->
    <div id="vistaLista">
      <div class="page-header">
        <h2>🐄 Vacas</h2>
        <button class="btn btn-primary" onclick="abrirModalNuevaVaca()">+ Nueva Vaca</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabActivas" onclick="cambiarTab('activas')">Activas</button>
        <button class="tab-btn" id="tabCerradas" onclick="cambiarTab('cerradas')">Cerradas</button>
      </div>

      <div id="contenedorVacas">
        <div class="loading"><div class="spinner"></div> Cargando vacas…</div>
      </div>
    </div>

    <!-- ===== VISTA DETALLE ===== -->
    <div id="vistaDetalle">
      <div class="detalle-header">
        <button class="btn btn-ghost btn-sm" onclick="volverALista()">← Volver</button>
        <div>
          <h3 id="detalleNombre"></h3>
          <div class="detalle-meta" id="detalleMeta"></div>
        </div>
        <button class="btn btn-green btn-sm" onclick="abrirModalNuevoParticipante()" style="margin-left:auto">+ Participante</button>
      </div>

      <div id="contenedorParticipantes">
        <div class="loading"><div class="spinner"></div> Cargando…</div>
      </div>
    </div>

  </div>
</div>

<!-- ===== MODAL NUEVA VACA ===== -->
<div class="modal-backdrop" id="modalNuevaVaca">
  <div class="modal">
    <div class="modal-header">
      <h4>🐄 Nueva Vaca</h4>
      <button class="modal-close" onclick="cerrarModal('modalNuevaVaca')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="nvNombre" placeholder="Ej: Vaca paseo fin de año" />
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="nvDescripcion" rows="3" placeholder="Opcional — para qué es esta vaca"></textarea>
      </div>
      <div class="form-group">
        <label>Cuota fija por persona ($)</label>
        <input type="number" id="nvCuota" placeholder="Ej: 50000" min="0" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modalNuevaVaca')">Cancelar</button>
      <button class="btn btn-primary" onclick="crearVaca()">Crear vaca</button>
    </div>
  </div>
</div>

<!-- ===== MODAL NUEVO PARTICIPANTE ===== -->
<div class="modal-backdrop" id="modalNuevoParticipante">
  <div class="modal">
    <div class="modal-header">
      <h4>➕ Agregar participante</h4>
      <button class="modal-close" onclick="cerrarModal('modalNuevoParticipante')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="npNombre" placeholder="Nombre del participante" />
      </div>
      <div class="form-group">
        <label>Contacto (Nequi / WhatsApp)</label>
        <input type="text" id="npContacto" placeholder="Ej: 300 123 4567" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modalNuevoParticipante')">Cancelar</button>
      <button class="btn btn-primary" onclick="crearParticipante()">Agregar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL REGISTRAR ABONO ===== -->
<div class="modal-backdrop" id="modalAbono">
  <div class="modal">
    <div class="modal-header">
      <h4>💰 Registrar abono</h4>
      <button class="modal-close" onclick="cerrarModal('modalAbono')">✕</button>
    </div>
    <div class="modal-body">
      <p id="abonoParticipanteNombre" style="font-weight:700; margin-bottom:16px; color:var(--accent)"></p>
      <div class="form-group">
        <label>Monto ($)</label>
        <input type="number" id="abonoMonto" placeholder="Ej: 25000" min="0" />
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="abonoFecha" />
      </div>
      <div class="form-group">
        <label>Nota (opcional)</label>
        <input type="text" id="abonoNota" placeholder="Ej: Primera cuota" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modalAbono')">Cancelar</button>
      <button class="btn btn-green" onclick="guardarAbono()">Guardar abono</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="utils.js"></script>

window.NAV_CONFIG = { activo: 'vacas' };
</script>
<script src="nav.js"></script>

<script>
// ============================================================
// AUDIOLINK · vacas.html · v1.0
// Panel admin — gestión de vacas colectivas
// ============================================================

const db = firebase.firestore();
const { FieldValue } = firebase.firestore;

let tabActual = 'activas';
let vacaActualId = null;
let vacaActualData = null;
let participanteAbonoId = null;
let unsubParticipantes = null;

// ===== AUTH GUARD =====
auth.onAuthStateChanged(usuario => {
  if (!usuario) { window.location.href = 'login.html'; return; }
  const tema = localStorage.getItem('audiolink_tema') || 'dark';
  document.documentElement.setAttribute('data-tema', tema);
  cargarVacas();
});

// ===== TABS =====
function cambiarTab(tab) {
  tabActual = tab;
  document.getElementById('tabActivas').classList.toggle('active', tab === 'activas');
  document.getElementById('tabCerradas').classList.toggle('active', tab === 'cerradas');
  cargarVacas();
}

// ===== CARGAR VACAS =====
function cargarVacas() {
  const cont = document.getElementById('contenedorVacas');
  cont.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando vacas…</div>';
  db.collection('vacas')
    .where('estado', '==', tabActual === 'activas' ? 'activa' : 'cerrada')
    .orderBy('fecha', 'desc')
    .get()
    .then(snap => {
      if (snap.empty) {
        cont.innerHTML = `<div class="empty-state">
          <div class="ico">🐄</div>
          <p>No hay vacas ${tabActual === 'activas' ? 'activas' : 'cerradas'} todavía.</p>
        </div>`;
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'vacas-grid';
      snap.forEach(doc => {
        const d = doc.data();
        grid.appendChild(renderVacaCard(doc.id, d));
      });
      cont.innerHTML = '';
      cont.appendChild(grid);
    })
    .catch(err => {
      cont.innerHTML = `<div class="empty-state"><p>Error al cargar: ${err.message}</p></div>`;
    });
}

function renderVacaCard(id, d) {
  const cuota = d.cuota_fija || 0;
  const num   = d.numParticipantes || 0;
  const total = cuota * num;
  const card  = document.createElement('div');
  card.className = 'vaca-card';
  card.onclick = () => abrirDetalle(id, d);
  card.innerHTML = `
    <div class="vaca-card-header">
      <div class="vaca-nombre">🐄 ${escapeHtml(d.nombre || '—')}</div>
      <span class="badge ${d.estado === 'activa' ? 'badge-activa' : 'badge-cerrada'}">${d.estado || 'activa'}</span>
    </div>
    ${d.descripcion ? `<p class="vaca-desc">${escapeHtml(d.descripcion)}</p>` : ''}
    <div class="vaca-stats">
      <div class="vaca-stat">
        <label>Cuota</label>
        <span>${formatCOP(cuota)}</span>
      </div>
      <div class="vaca-stat">
        <label>Participantes</label>
        <span>${num}</span>
      </div>
      <div class="vaca-stat">
        <label>Meta total</label>
        <span>${formatCOP(total)}</span>
      </div>
    </div>
  `;
  return card;
}

// ===== DETALLE =====
function abrirDetalle(id, data) {
  vacaActualId  = id;
  vacaActualData = data;

  document.getElementById('vistaLista').classList.add('hidden');
  document.getElementById('vistaDetalle').classList.add('show');

  document.getElementById('detalleNombre').textContent = '🐄 ' + (data.nombre || '—');
  document.getElementById('detalleMeta').textContent =
    `Cuota: ${formatCOP(data.cuota_fija || 0)} · ${data.numParticipantes || 0} participante(s)`;

  cargarParticipantes(id);
}

function volverALista() {
  if (unsubParticipantes) { unsubParticipantes(); unsubParticipantes = null; }
  vacaActualId = null;
  vacaActualData = null;
  document.getElementById('vistaDetalle').classList.remove('show');
  document.getElementById('vistaLista').classList.remove('hidden');
  cargarVacas();
}

function cargarParticipantes(vacaId) {
  const cont = document.getElementById('contenedorParticipantes');
  cont.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando participantes…</div>';

  if (unsubParticipantes) unsubParticipantes();
  unsubParticipantes = db.collection('vacas').doc(vacaId)
    .collection('participantes')
    .orderBy('fechaRegistro', 'asc')
    .onSnapshot(snap => {
      if (snap.empty) {
        cont.innerHTML = `<div class="empty-state"><div class="ico">👤</div><p>Sin participantes aún. Agrega el primero.</p></div>`;
        return;
      }
      const cuota = (vacaActualData && vacaActualData.cuota_fija) || 0;
      let html = `<div class="table-wrap"><table>
        <thead><tr>
          <th>Nombre</th><th>Contacto</th><th>Abonado</th><th>Estado</th><th>Acciones</th>
        </tr></thead><tbody>`;

      snap.forEach(doc => {
        const p = doc.data();
        const abonado = p.totalAbonado || 0;
        const pct = cuota > 0 ? Math.min(100, Math.round(abonado / cuota * 100)) : 0;
        const estadoClass = abonado >= cuota ? 'chip-pagado'
                          : abonado > 0      ? 'chip-parcial'
                          :                    'chip-pendiente';
        const estadoLabel = abonado >= cuota ? '✓ Pagado'
                          : abonado > 0      ? `${pct}% abonado`
                          :                    'Pendiente';
        html += `<tr>
          <td style="font-weight:600">${escapeHtml(p.nombre || '—')}</td>
          <td style="color:var(--text2)">${escapeHtml(p.contacto || '—')}</td>
          <td>${formatCOP(abonado)}${cuota > 0 ? ` <span style="color:var(--text2);font-size:11px">/ ${formatCOP(cuota)}</span>` : ''}</td>
          <td><span class="estado-chip ${estadoClass}">${estadoLabel}</span></td>
          <td>
            <div class="acciones-td">
              <button class="btn btn-ghost btn-sm" onclick='abrirModalAbono("${doc.id}", "${escapeHtml(p.nombre || '')}")'>💰 Abono</button>
              <button class="btn btn-ghost btn-sm" onclick='copiarLink("${vacaActualId}", "${doc.id}")'>🔗 Link</button>
            </div>
          </td>
        </tr>`;
      });

      html += '</tbody></table></div>';
      cont.innerHTML = html;
    }, err => {
      cont.innerHTML = `<div class="empty-state"><p>Error: ${err.message}</p></div>`;
    });
}

// ===== NUEVA VACA =====
function abrirModalNuevaVaca() {
  document.getElementById('nvNombre').value = '';
  document.getElementById('nvDescripcion').value = '';
  document.getElementById('nvCuota').value = '';
  abrirModal('modalNuevaVaca');
}

function crearVaca() {
  const nombre = document.getElementById('nvNombre').value.trim();
  const desc   = document.getElementById('nvDescripcion').value.trim();
  const cuota  = parseFloat(document.getElementById('nvCuota').value) || 0;

  if (!nombre) { mostrarToast('⚠️ El nombre es obligatorio'); return; }
  if (cuota <= 0) { mostrarToast('⚠️ Ingresa una cuota válida'); return; }

  db.collection('vacas').add({
    nombre,
    descripcion: desc,
    cuota_fija: cuota,
    creadoPor: auth.currentUser.email,
    fecha: firebase.firestore.FieldValue.serverTimestamp(),
    estado: 'activa',
    numParticipantes: 0
  }).then(() => {
    cerrarModal('modalNuevaVaca');
    mostrarToast('🐄 Vaca creada');
    cargarVacas();
  }).catch(err => mostrarToast('Error: ' + err.message));
}

// ===== NUEVO PARTICIPANTE =====
function abrirModalNuevoParticipante() {
  document.getElementById('npNombre').value = '';
  document.getElementById('npContacto').value = '';
  abrirModal('modalNuevoParticipante');
}

function crearParticipante() {
  const nombre   = document.getElementById('npNombre').value.trim();
  const contacto = document.getElementById('npContacto').value.trim();
  if (!nombre) { mostrarToast('⚠️ El nombre es obligatorio'); return; }
  if (!vacaActualId) return;

  const token = Math.random().toString(36).substring(2, 10) + Date.now().toString(36);

  const batch = db.batch();

  const partRef = db.collection('vacas').doc(vacaActualId).collection('participantes').doc();
  batch.set(partRef, {
    nombre,
    contacto,
    fechaRegistro: firebase.firestore.FieldValue.serverTimestamp(),
    totalAbonado: 0,
    linkToken: token
  });

  const vacaRef = db.collection('vacas').doc(vacaActualId);
  batch.update(vacaRef, {
    numParticipantes: firebase.firestore.FieldValue.increment(1)
  });

  batch.commit()
    .then(() => {
      cerrarModal('modalNuevoParticipante');
      mostrarToast('✅ Participante agregado');
      if (vacaActualData) vacaActualData.numParticipantes = (vacaActualData.numParticipantes || 0) + 1;
      document.getElementById('detalleMeta').textContent =
        `Cuota: ${formatCOP(vacaActualData.cuota_fija || 0)} · ${vacaActualData.numParticipantes} participante(s)`;
    })
    .catch(err => mostrarToast('Error: ' + err.message));
}

// ===== ABONOS =====
function abrirModalAbono(participanteId, nombre) {
  participanteAbonoId = participanteId;
  document.getElementById('abonoParticipanteNombre').textContent = '👤 ' + nombre;
  document.getElementById('abonoMonto').value = '';
  document.getElementById('abonoFecha').value = new Date().toISOString().split('T')[0];
  document.getElementById('abonoNota').value = '';
  abrirModal('modalAbono');
}

function guardarAbono() {
  const monto = parseFloat(document.getElementById('abonoMonto').value) || 0;
  const fecha = document.getElementById('abonoFecha').value;
  const nota  = document.getElementById('abonoNota').value.trim();

  if (monto <= 0) { mostrarToast('⚠️ Ingresa un monto válido'); return; }
  if (!fecha) { mostrarToast('⚠️ Selecciona la fecha'); return; }
  if (!vacaActualId || !participanteAbonoId) return;

  const partRef = db.collection('vacas').doc(vacaActualId)
                    .collection('participantes').doc(participanteAbonoId);

  const batch = db.batch();

  const abonoRef = partRef.collection('abonos').doc();
  batch.set(abonoRef, {
    monto,
    fecha,
    nota,
    registradoPor: auth.currentUser.email,
    creadoEn: firebase.firestore.FieldValue.serverTimestamp()
  });

  batch.update(partRef, {
    totalAbonado: firebase.firestore.FieldValue.increment(monto)
  });

  batch.commit()
    .then(() => {
      cerrarModal('modalAbono');
      mostrarToast('💰 Abono registrado');
      participanteAbonoId = null;
    })
    .catch(err => mostrarToast('Error: ' + err.message));
}

// ===== COPIAR LINK =====
function copiarLink(vacaId, participanteId) {
  const base = window.location.origin + window.location.pathname.replace('vacas.html', '');
  const url  = `${base}vaca.html?id=${vacaId}&p=${participanteId}`;
  navigator.clipboard.writeText(url)
    .then(() => mostrarToast('🔗 Link copiado'))
    .catch(() => mostrarToast('No se pudo copiar el link'));
}

// ===== UTILIDADES UI =====
function abrirModal(id) {
  document.getElementById(id).classList.add('show');
}
function cerrarModal(id) {
  document.getElementById(id).classList.remove('show');
}

let toastTimer;
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Cerrar modales con click fuera
document.addEventListener('click', e => {
  ['modalNuevaVaca', 'modalNuevoParticipante', 'modalAbono'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.classList.contains('show') && e.target === el) cerrarModal(id);
  });
});
</script>

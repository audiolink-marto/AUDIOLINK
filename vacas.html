<!DOCTYPE html>
<html lang="es" data-tema="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacas · AUDIOLINK</title>
  <link rel="stylesheet" href="nav.css" />
  <style>
    /* ===== RESET / BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --bg2:      #181c26;
      --bg3:      #1e2333;
      --border:   #2a2f42;
      --text:     #e8eaf0;
      --text2:    #8b90a0;
      --accent:   #2dd4bf; /* v1.8: turquesa — antes #4f8ef7 (azul genérico), decisión de marca a pedido del usuario para diferenciar "Vacas" del resto del ecosistema sin chocar con el verde/rojo semántico de estado */
      --green:    #3ecf8e;
      --red:      #f76f6f;
      --yellow:   #f5c842;
      --radius:   10px;
      --shadow:   0 2px 12px rgba(0,0,0,.4);
      /* v1.5: variables que nav.css requiere para pintar el sidebar/topbar
         compartido (ver cabecera de nav.css) — vacas.html nunca las
         definía, así que el sidebar se veía sin estilo (colores/fuente
         por defecto del navegador). Se copian tal cual de index.html
         para mantener 100% consistencia visual con el resto del
         ecosistema. No reemplazan ni se mezclan con --bg/--border/etc.
         propias de este archivo — son un set aparte, con otro nombre. */
      --surf:       #151517;
      --surf-light: #1d1d20;
      --brd:        #2a2a2e;
      --gold:       #c9a24b;
      --gold-bg:    rgba(201,162,75,0.12);
      --txt:        #f0ede6;
      --muted:      #9a978f;
      --faint:      #5c5a55;
      --T:          'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    [data-tema="light"] {
      --bg:     #f0f2f7;
      --bg2:    #ffffff;
      --bg3:    #e4e8f0;
      --border: #cdd2df;
      --text:   #1a1d2e;
      --text2:  #5a6070;
      /* v1.5: contraparte clara de las variables de nav.css, también
         copiadas de index.html (:root[data-tema="light"]). */
      --surf:       #ffffff;
      --surf-light: #f3f0e8;
      --brd:        #e2ddd0;
      --gold:       #a8823a;
      --gold-bg:    rgba(168,130,58,0.10);
      --txt:        #2a2620;
      --muted:      #7a756a;
      --faint:      #a39d8f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      /* v1.9: se quita display:flex — nav.css asume que el body es de
         flujo normal (sidebar con position:fixed flotando encima,
         contenido acomodado con margin-left). Ninguna otra página del
         ecosistema pone display:flex acá; en vacas.html causaba que en
         Safari de iPhone el sidebar y la barra inferior mobile se
         mostraran los dos a la vez (bug conocido de Safari con
         elementos position:fixed inyectados dinámicamente dentro de un
         contenedor flex). No se tocó ninguna otra propiedad del body. */
    }

    #mainWrap {
      /* v1.9: ya no depende de flex:1 (el padre, body, dejó de ser
         flex) — ahora es un bloque normal que ocupa el ancho disponible
         y se corre con margin-left, igual que el resto del ecosistema.
         display:flex/flex-direction:column se mantienen: siguen siendo
         necesarios para acomodar verticalmente .main-content dentro de
         ESTE contenedor, que es un asunto aparte de cómo se posiciona
         #mainWrap respecto al body. */
      width: auto;
      margin-left: 220px;
      transition: margin-left .25s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #mainWrap.expanded { margin-left: 64px; }

    .main-content {
      padding: 28px 24px 80px;
      max-width: 960px;
      width: 100%;
    }

    /* ===== HEADER ===== */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
    }
    .page-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== BOTONES ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { opacity: .85; }
    .btn-green { background: var(--green); color: #111; }
    .btn-green:hover { opacity: .85; }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 8px 16px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ===== VACAS GRID ===== */
    .vacas-grid {
      display: grid;
      /* v1.8: mínimo bajado de 280px a 240px — con el padding mobile
         (16px por lado) 280px quedaba muy justo en pantallas angostas
         (~320px) y podía forzar scroll horizontal leve. */
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .vaca-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .vaca-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }

    .vaca-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .vaca-nombre {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .badge-activa  { background: rgba(62,207,142,.15); color: var(--green); }
    .badge-cerrada { background: rgba(139,144,160,.15); color: var(--text2); }

    /* v1.3: acciones editar/eliminar en la card */
    .vaca-card-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .vaca-card-actions button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      color: var(--text2);
      transition: background .15s, color .15s;
    }
    .vaca-card-actions button:hover { background: var(--bg3); color: var(--text); }
    .vaca-card-actions button.danger:hover { color: var(--red); border-color: var(--red); }

    .vaca-desc {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .vaca-stats {
      display: flex;
      gap: 16px;
    }
    .vaca-stat label {
      display: block;
      font-size: 10px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 2px;
    }
    .vaca-stat span {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* progreso */
    .progreso-bar {
      margin-top: 14px;
      height: 5px;
      background: var(--bg3);
      border-radius: 99px;
      overflow: hidden;
    }
    .progreso-fill {
      height: 100%;
      background: var(--green);
      border-radius: 99px;
      transition: width .4s;
    }

    /* ===== ESTADO VACÍO ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }
    .empty-state .ico { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ===== VISTA DETALLE ===== */
    #vistaDetalle { display: none; }
    #vistaDetalle.show { display: block; }
    #vistaLista.hidden { display: none; }

    .detalle-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    /* v1.8: en mobile, el grupo de botones (Link de invitación +
       Participante) pasa a ocupar toda la línea de abajo en vez de
       apretarse contra el título — mismo elemento, ya no necesita
       margin-left:auto porque con flex-wrap ya baja de línea solo. */
    @media (max-width: 560px) {
      .detalle-header > div[style*="margin-left:auto"] {
        margin-left: 0 !important;
        width: 100%;
      }
    }
    .detalle-header h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .detalle-meta {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }

    /* tabla participantes */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text2);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg3); }

    .estado-chip {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .chip-pagado   { background: rgba(62,207,142,.15); color: var(--green); }
    .chip-parcial  { background: rgba(245,200,66,.15); color: var(--yellow); }
    .chip-pendiente{ background: rgba(247,111,111,.15); color: var(--red); }

    .acciones-td { display: flex; gap: 6px; align-items: center; }

    /* v1.10: historial de abonos (modal) */
    .abonos-admin-lista { display: flex; flex-direction: column; gap: 8px; }
    .abono-admin-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      gap: 10px;
    }

    /* ===== MODALES ===== */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.show { display: flex; }

    /* v1.16: miniatura de comprobante en el historial de abonos (admin) */
    .comprobante-thumb {
      width: 36px; height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      display: block;
    }

    /* v1.16: lightbox simple, reutiliza el z-index por encima de los modales */
    .lightbox-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox-overlay.show { display: flex; }
    .lightbox-overlay img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
    .lightbox-close {
      position: absolute;
      top: 16px; right: 20px;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      animation: modalIn .18s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(-12px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    .modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h4 { font-size: 1rem; font-weight: 700; }
    .modal-close {
      background: none; border: none;
      color: var(--text2); font-size: 1.2rem;
      cursor: pointer; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); }

    /* v1.11: fila país + número */
    .form-group-contacto { display: flex; gap: 8px; }
    .form-group-contacto select { flex: 0 0 84px; }
    .form-group-contacto input { flex: 1; }

    /* toast */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      z-index: 2000;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: none; }

    /* loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text2);
      font-size: 13px;
      gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      #mainWrap { margin-left: 0; padding-top: 56px; }
      .main-content { padding: 20px 16px 80px; }
      .acciones-td { flex-wrap: wrap; }

      /* v1.8: tabla de participantes → lista de mini-cards apiladas.
         Antes dependía solo de overflow-x:auto (scroll horizontal para
         ver "Acciones"). Técnica estándar: la tabla se "desarma" a
         bloques, cada <tr> se convierte en una card, y cada <td> muestra
         su etiqueta (data-label, agregado en el JS) antes del valor. No
         se tocó el HTML/JS fuera de agregar esos data-label — la misma
         tabla sigue funcionando igual en desktop (≥769px). */
      .table-wrap { overflow-x: visible; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tbody tr {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 4px 14px;
        margin-bottom: 10px;
      }
      tbody tr:hover td { background: transparent; }
      tbody td {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        text-align: right;
      }
      tbody tr td:last-child { border-bottom: none; }
      tbody td::before {
        content: attr(data-label);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .5px;
        color: var(--text2);
        text-align: left;
        flex-shrink: 0;
      }
      .acciones-td { justify-content: flex-end; width: 100%; }
    }
  </style>
</head>
<body>

<div id="nav-mount"></div>

<div id="mainWrap">
  <div class="main-content">

    <!-- ===== VISTA LISTA ===== -->
    <div id="vistaLista">
      <div class="page-header">
        <h2>🐄 Vacas</h2>
        <button class="btn btn-primary" onclick="abrirModalNuevaVaca()">+ Nueva Vaca</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabActivas" onclick="cambiarTab('activas')">Activas</button>
        <button class="tab-btn" id="tabCerradas" onclick="cambiarTab('cerradas')">Cerradas</button>
      </div>

      <div id="contenedorVacas">
        <div class="loading"><div class="spinner"></div> Cargando vacas…</div>
      </div>
    </div>

    <!-- ===== VISTA DETALLE ===== -->
    <div id="vistaDetalle">
      <div class="detalle-header">
        <button class="btn btn-ghost btn-sm" onclick="volverALista()">← Volver</button>
        <div>
          <h3 id="detalleNombre"></h3>
          <div class="detalle-meta" id="detalleMeta"></div>
        </div>
        <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" id="btnEstadoVaca" onclick="toggleEstadoVaca()">🔒 Cerrar vaca</button>
          <button class="btn btn-ghost btn-sm" id="btnLinkInvitacion" onclick="copiarLinkInvitacion()">🔗 Link de invitación</button>
          <button class="btn btn-green btn-sm" id="btnNuevoParticipante" onclick="abrirModalNuevoParticipante()">+ Participante</button>
        </div>
      </div>

      <div id="contenedorParticipantes">
        <div class="loading"><div class="spinner"></div> Cargando…</div>
      </div>
    </div>

  </div>
</div>

<!-- ===== MODAL NUEVA VACA ===== -->
<div class="modal-backdrop" id="modalNuevaVaca">
  <div class="modal">
    <div class="modal-header">
      <h4 id="nvTitulo">🐄 Nueva Vaca</h4>
      <button class="modal-close" onclick="cerrarModal('modalNuevaVaca')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="nvEditId" value="" />
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="nvNombre" placeholder="Ej: Vaca paseo fin de año" />
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="nvDescripcion" rows="3" placeholder="Opcional — para qué es esta vaca"></textarea>
      </div>
      <div class="form-group">
        <label>Meta total de recaudo ($)</label>
        <input type="number" id="nvCuota" placeholder="Ej: 500000" min="0" />
        <p style="font-size:11px;color:var(--text2);margin-top:5px">La cuota por persona se calcula sola: meta ÷ participantes confirmados. Baja automáticamente si entra más gente.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modalNuevaVaca')">Cancelar</button>
      <button class="btn btn-primary" id="nvBtnGuardar" onclick="guardarVaca()">Crear vaca</button>
    </div>
  </div>
</div>

<!-- ===== MODAL NUEVO PARTICIPANTE ===== -->
<div class="modal-backdrop" id="modalNuevoParticipante">
  <div class="modal">
    <div class="modal-header">
      <h4>➕ Agregar participante</h4>
      <button class="modal-close" onclick="cerrarModal('modalNuevoParticipante')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="npNombre" placeholder="Nombre del participante" />
      </div>
      <div class="form-group">
        <label>Contacto (Nequi / WhatsApp)</label>
        <div class="form-group-contacto">
          <select id="npPais" onchange="document.getElementById('npPaisOtro').style.display = this.value === 'otro' ? '' : 'none'">
            <option value="57" selected>🇨🇴 +57</option>
            <option value="1">🇺🇸🇨🇦 +1</option>
            <option value="34">🇪🇸 +34</option>
            <option value="44">🇬🇧 +44</option>
            <option value="33">🇫🇷 +33</option>
            <option value="49">🇩🇪 +49</option>
            <option value="39">🇮🇹 +39</option>
            <option value="351">🇵🇹 +351</option>
            <option value="otro">Otro…</option>
          </select>
          <input type="text" id="npContacto" placeholder="Ej: 300 123 4567" />
        </div>
        <input type="text" id="npPaisOtro" placeholder="Código de país (ej: 31)" style="display:none; margin-top:8px" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modalNuevoParticipante')">Cancelar</button>
      <button class="btn btn-primary" id="btnAgregarParticipante" onclick="crearParticipante()">Agregar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL REGISTRAR ABONO ===== -->

const db = firebase.firestore();
const auth = firebase.auth();
const { FieldValue } = firebase.firestore;

let vacaActualId = null;
let vacaActualData = null;

let abonoEditParticipanteId = null;

// ===== AUTH GUARD =====
auth.onAuthStateChanged(usuario => {
  if (!usuario) { window.location.href = 'login.html'; return; }
  const tema = localStorage.getItem('audiolink_tema') || 'dark';
  document.documentElement.setAttribute('data-tema', tema);
  cargarVacas();
});

// ===== TABS =====
function cambiarTab(tab) {
  tabActual = tab;
  document.getElementById('tabActivas').classList.toggle('active', tab === 'activas');
  document.getElementById('tabCerradas').classList.toggle('active', tab === 'cerradas');
  cargarVacas();
}

// ===== CARGAR VACAS =====
function cargarVacas() {
  const cont = document.getElementById('contenedorVacas');
  cont.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando vacas…</div>';
  db.collection('vacas')
    .where('estado', '==', tabActual === 'activas' ? 'activa' : 'cerrada')
    .orderBy('fecha', 'desc')
    .get()
    .then(snap => {
      if (snap.empty) {
        cont.innerHTML = `<div class="empty-state">
          <div class="ico">🐄</div>
          <p>No hay vacas ${tabActual === 'activas' ? 'activas' : 'cerradas'} todavía.</p>
        </div>`;
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'vacas-grid';
      snap.forEach(doc => {
        const d = doc.data();
        vacasCache[doc.id] = d;
        grid.appendChild(renderVacaCard(doc.id, d));
      });
      cont.innerHTML = '';
      cont.appendChild(grid);
    })
    .catch(err => {
      cont.innerHTML = `<div class="empty-state"><p>Error al cargar: ${err.message}</p></div>`;
    });
}

function renderVacaCard(id, d) {
  const cuota = d.cuota_fija || 0;
  const num   = d.numParticipantes || 0;
  const meta  = d.meta_total || 0;
  const card  = document.createElement('div');
  card.className = 'vaca-card';
  card.onclick = () => abrirDetalle(id, d);
  card.innerHTML = `
    <div class="vaca-card-header">
      <div class="vaca-nombre">🐄 ${escapeHtml(d.nombre || '—')}</div>
      <div class="vaca-card-actions">
        <span class="badge ${d.estado === 'activa' ? 'badge-activa' : 'badge-cerrada'}">${d.estado || 'activa'}</span>
        <button title="Editar" onclick="event.stopPropagation(); abrirModalEditarVaca('${id}')">✏️</button>
        <button title="Eliminar" class="danger" onclick="event.stopPropagation(); eliminarVaca('${id}')">🗑️</button>
      </div>
    </div>
    ${d.descripcion ? `<p class="vaca-desc">${escapeHtml(d.descripcion)}</p>` : ''}
    <div class="vaca-stats">
      <div class="vaca-stat">
        <label>Cuota vigente</label>
        <span>${formatCOP(cuota)}</span>
      </div>
      <div class="vaca-stat">
        <label>Participantes</label>
        <span>${num}</span>
      </div>
      <div class="vaca-stat">
        <label>Meta total</label>
        <span>${formatCOP(meta)}</span>
      </div>
    </div>
  `;
  return card;
}

// ===== DETALLE =====
function abrirDetalle(id, data) {
  vacaActualId  = id;
  vacaActualData = data;

  document.getElementById('vistaLista').classList.add('hidden');
  document.getElementById('vistaDetalle').classList.add('show');

  document.getElementById('detalleNombre').textContent = '🐄 ' + (data.nombre || '—');
  document.getElementById('detalleMeta').textContent =
    `Meta: ${formatCOP(data.meta_total || 0)} · Cuota vigente: ${formatCOP(data.cuota_fija || 0)} · ${data.numParticipantes || 0} participante(s)`;

  actualizarUIEstadoDetalle();
  cargarParticipantes(id);
}

// ===== CERRAR / REABRIR VACA (v1.10) =====
// Una vaca "cerrada" pasa a modo solo-lectura: se ocultan los botones de
// agregar participante, link de invitación y registrar abono (tanto en
// el header como en cada fila de la tabla). No borra ni bloquea nada a
// nivel de Firestore Rules (el admin sigue teniendo acceso total si
// necesita corregir algo puntual desde el historial de abonos) — es un
// candado de UI + el campo `estado` que vaca.html v1.5 también respeta
// para bloquear el registro público. No dispara ningún cálculo ni
// resumen automático.
function toggleEstadoVaca() {
  if (!vacaActualId || !vacaActualData) return;
  const nuevoEstado = vacaActualData.estado === 'cerrada' ? 'activa' : 'cerrada';
  const accion = nuevoEstado === 'cerrada' ? 'cerrar' : 'reabrir';
  if (!confirm(`¿Seguro que quieres ${accion} esta vaca?`)) return;

  db.collection('vacas').doc(vacaActualId).update({ estado: nuevoEstado })
    .then(() => {
      vacaActualData.estado = nuevoEstado;
      vacasCache[vacaActualId] = vacaActualData;
      mostrarToast(nuevoEstado === 'cerrada' ? '🔒 Vaca cerrada' : '🔓 Vaca reabierta');
      actualizarUIEstadoDetalle();
    })
    .catch(err => mostrarToast('Error: ' + err.message));
}

  const cerrada = !!(vacaActualData && vacaActualData.estado === 'cerrada');
  document.getElementById('btnEstadoVaca').textContent = cerrada ? '🔓 Reabrir vaca' : '🔒 Cerrar vaca';
  document.getElementById('btnNuevoParticipante').style.display = cerrada ? 'none' : '';

}

function volverALista() {
  if (unsubParticipantes) { unsubParticipantes(); unsubParticipantes = null; }
  vacaActualId = null;
  vacaActualData = null;
  document.getElementById('vistaDetalle').classList.remove('show');
  document.getElementById('vistaLista').classList.remove('hidden');

function cargarParticipantes(vacaId) {
  const cont = document.getElementById('contenedorParticipantes');
  cont.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando participantes…</div>';

  if (unsubParticipantes) unsubParticipantes();
  unsubParticipantes = db.collection('vacas').doc(vacaId)
    .collection('participantes')
    .orderBy('fechaRegistro', 'asc')
    .onSnapshot(snap => {
      if (snap.empty) {
        cont.innerHTML = `<div class="empty-state"><div class="ico">👤</div><p>Sin participantes aún. Agrega el primero.</p></div>`;
        if (vacaActualData && (vacaActualData.totalRecaudado || 0) !== 0) {
          vacaActualData.totalRecaudado = 0;
          db.collection('vacas').doc(vacaId).update({ totalRecaudado: 0 }).catch(() => {});
        }
        return;
      }
      const cuota = (vacaActualData && vacaActualData.cuota_fija) || 0;
      const cerrada = !!(vacaActualData && vacaActualData.estado === 'cerrada');
      let html = `<div class="table-wrap"><table>
        <thead><tr>
          <th>Nombre</th><th>Contacto</th><th>Abonado</th><th>Estado</th><th>Acciones</th>
        </tr></thead><tbody>`;

      let sumaAbonado = 0;
      snap.forEach(doc => {
        const p = doc.data();
        const abonado = p.totalAbonado || 0;
        sumaAbonado += abonado;
        const pct = cuota > 0 ? Math.min(100, Math.round(abonado / cuota * 100)) : 0;
        const estadoClass = abonado >= cuota ? 'chip-pagado'
                          : abonado > 0      ? 'chip-parcial'
                          :                    'chip-pendiente';
        const estadoLabel = abonado >= cuota ? '✓ Pagado'
                          : abonado > 0      ? `${pct}% abonado`
                          :                    'Pendiente';
        html += `<tr>
          <td data-label="Nombre" style="font-weight:600">${escapeHtml(p.nombre || '—')}</td>
          <td data-label="Contacto" style="color:var(--text2)">${escapeHtml(p.contacto || '—')}</td>
          <td data-label="Abonado">${formatCOP(abonado)}${cuota > 0 ? ` <span style="color:var(--text2);font-size:11px">/ ${formatCOP(cuota)}</span>` : ''}</td>
          <td data-label="Estado"><span class="estado-chip ${estadoClass}">${estadoLabel}</span></td>
          <td data-label="Acciones">
            <div class="acciones-td">
              <button class="btn btn-ghost btn-sm btn-abono-row" style="${cerrada ? 'display:none' : ''}" onclick='abrirModalAbono("${doc.id}", "${escapeHtml(p.nombre || '')}")'>💰 Abono</button>
              <button class="btn btn-ghost btn-sm" onclick='abrirModalAbonosList("${doc.id}", "${escapeHtml(p.nombre || '')}")'>📋 Historial</button>
              <button class="btn btn-ghost btn-sm" onclick='copiarLink("${vacaActualId}", "${doc.id}")'>🔗 Copiar</button>
              <button class="btn btn-ghost btn-sm" onclick='abrirLinkParticipante("${vacaActualId}", "${doc.id}")'>↗ Abrir</button>
              <button class="btn btn-ghost btn-sm" onclick='notificarWhatsApp("${vacaActualId}", "${doc.id}", "${escapeHtml(p.nombre || '')}", "${escapeHtml(p.contacto || '')}", "${escapeHtml(p.paisCodigo || '')}")'>📲 Avisar</button>
              <button class="btn btn-danger btn-sm btn-abono-row" style="${cerrada ? 'display:none' : ''}" onclick='eliminarParticipante("${doc.id}", "${escapeHtml(p.nombre || '')}", this)'>🗑️</button>
            </div>
          </td>
        </tr>`;
      });

      html += '</tbody></table></div>';
      cont.innerHTML = html;

      // v1.6: auto-sanación de totalRecaudado. Vacas creadas antes de
      // v1.4 (o cualquiera que por lo que sea quede desincronizada) no
      // tenían este campo denormalizado, y vaca.html v1.2 depende de él
      // para mostrar el progreso global sin necesitar `list` (bloqueado
      // sin login). Aquí, con el mismo listener que YA lee todos los
      // participantes (staff, lectura total permitida), se recalcula la
      // suma real y se corrige el doc de la vaca SOLO si quedó
      // desactualizado — no reemplaza el increment() normal de
      // guardarAbono(), es una red de seguridad adicional.
      if (vacaActualData && sumaAbonado !== (vacaActualData.totalRecaudado || 0)) {
        vacaActualData.totalRecaudado = sumaAbonado;
        db.collection('vacas').doc(vacaId).update({ totalRecaudado: sumaAbonado })
          .catch(() => {}); // silencioso: no bloquea el uso normal del panel
      }
    }, err => {
      cont.innerHTML = `<div class="empty-state"><p>Error: ${err.message}</p></div>`;
    });
}

// ===== EDITAR VACA (v1.3) =====
// Reutiliza el mismo modal de Nueva Vaca, precargado con los datos del
// caché en memoria (vacasCache). No permite editar estado/numParticipantes
// desde aquí — eso lo maneja el flujo normal (cerrar vaca / agregar

function abrirModalEditarVaca(id) {

  document.getElementById('nvEditId').value = id;

}

// guardarVaca(): crea o edita según si nvEditId trae un id.
// v1.7: cambio de modelo. Antes el admin fijaba `cuota_fija` (fija por
// persona) y la meta crecía sola (cuota × n). Ahora el admin fija
// `meta_total` (fija) y `cuota_fija` se recalcula sola = meta_total /
// numParticipantes — baja a medida que se confirma gente nueva (ver
// confirmarParticipacion() en vaca.html, que hace ese recálculo en cada
// confirmación). Aquí, al crear o editar la meta, se recalcula la
// cuota_fija vigente con el numParticipantes actual (0 al crear, el que
// ya tenga si se edita) para que la card/detalle no muestren un valor
// desactualizado hasta el próximo ingreso.
function guardarVaca() {
  const editId = document.getElementById('nvEditId').value;
  const nombre = document.getElementById('nvNombre').value.trim();
  const desc   = document.getElementById('nvDescripcion').value.trim();
  const meta   = parseFloat(document.getElementById('nvCuota').value) || 0;

  if (!nombre) { mostrarToast('⚠️ El nombre es obligatorio'); return; }
  if (meta <= 0) { mostrarToast('⚠️ Ingresa una meta válida'); return; }

  if (editId) {
    const numActual = (vacasCache[editId] && vacasCache[editId].numParticipantes) || 0;
    const cuotaRecalc = numActual > 0 ? meta / numActual : meta;
    db.collection('vacas').doc(editId).update({
      nombre,
      descripcion: desc,
      meta_total: meta,
      cuota_fija: cuotaRecalc
    }).then(() => {
      cerrarModal('modalNuevaVaca');
      mostrarToast('✅ Vaca actualizada');
      cargarVacas();
    }).catch(err => mostrarToast('Error: ' + err.message));
    return;
  }

  db.collection('vacas').add({
    nombre,
    descripcion: desc,
    meta_total: meta,
    cuota_fija: meta, // con 0 participantes, la cuota vigente equivale a la meta completa
    creadoPor: auth.currentUser.email,
    fecha: firebase.firestore.FieldValue.serverTimestamp(),
    estado: 'activa',
    numParticipantes: 0,
    totalRecaudado: 0
  }).then(() => {
    cerrarModal('modalNuevaVaca');
    mostrarToast('🐄 Vaca creada');
    cargarVacas();
  }).catch(err => mostrarToast('Error: ' + err.message));
}

// ===== ELIMINAR VACA (v1.3) =====
// Borra la vaca y en cascada sus subcolecciones (participantes → abonos),
// ya que Firestore NO borra subcolecciones automáticamente al borrar el
// doc padre. Se lee la lista de participantes, por cada uno se leen y
// borran sus abonos, y al final se borra el participante y la vaca — todo
// en un solo batch final para minimizar el riesgo de quedar a medias.
function eliminarVaca(id) {
  const d = vacasCache[id];
  const nombre = d ? (d.nombre || 'esta vaca') : 'esta vaca';
  if (!confirm(`¿Eliminar "${nombre}"? Se borrarán también todos sus participantes y abonos. Esta acción no se puede deshacer.`)) return;

  const vacaRef = db.collection('vacas').doc(id);
  vacaRef.collection('participantes').get()
    .then(partSnap => {
      const abonosPromises = partSnap.docs.map(pDoc =>
        pDoc.ref.collection('abonos').get().then(abonosSnap => ({ pDoc, abonosSnap }))
      );
      return Promise.all(abonosPromises);
    })
    .then(pares => {
      const batch = db.batch();
      pares.forEach(({ pDoc, abonosSnap }) => {
        abonosSnap.forEach(aDoc => batch.delete(aDoc.ref));
        batch.delete(pDoc.ref);
      });
      batch.delete(vacaRef);
      return batch.commit();
    })
    .then(() => {
      mostrarToast('🗑️ Vaca eliminada');
      delete vacasCache[id];
      cargarVacas();
    })
    .catch(err => mostrarToast('Error al eliminar: ' + err.message));
}

function abrirModalNuevoParticipante() {
  const btn = document.getElementById('btnAgregarParticipante');
  btn.disabled = false;
  btn.textContent = 'Agregar';
  document.getElementById('npNombre').value = '';
  document.getElementById('npContacto').value = '';
  document.getElementById('npPais').value = '57';
  document.getElementById('npPaisOtro').value = '';
  document.getElementById('npPaisOtro').style.display = 'none';
  abrirModal('modalNuevoParticipante');
}

async function crearParticipante() {
  const nombre   = document.getElementById('npNombre').value.trim();
  const contacto = document.getElementById('npContacto').value.trim();
  const paisSel  = document.getElementById('npPais').value;
  const paisCodigo = paisSel === 'otro'
    ? document.getElementById('npPaisOtro').value.trim().replace(/\D/g, '')
    : paisSel;
  if (!nombre) { mostrarToast('⚠️ El nombre es obligatorio'); return; }
  if (paisSel === 'otro' && !paisCodigo) { mostrarToast('⚠️ Ingresa el código de país'); return; }
  if (!vacaActualId || !vacaActualData) return;

  const btn = document.getElementById('btnAgregarParticipante');
  const vacaRef = db.collection('vacas').doc(vacaActualId);

  // v1.14: mismo aviso de posible duplicado agregado en vaca.html v1.10
  // (no bloqueante). Si ya existe alguien con ese nombre exacto en la
  // vaca, se pregunta con confirm(); si el admin cancela, no se escribe
  // nada. Si la consulta falla, no bloquea — sigue de largo.
  try {
    const dupSnap = await vacaRef.collection('participantes')
      .where('nombre', '==', nombre).limit(1).get();
    if (!dupSnap.empty) {
      const seguir = confirm(`Ya hay alguien registrado como "${nombre}" en esta vaca. ¿Confirmas que quieres agregarlo también?`);
      if (!seguir) return;
    }
  } catch (err) {
    // silencioso: no bloquea el alta si la consulta de duplicado falla
  }

  btn.disabled = true;
  btn.textContent = 'Agregando…';

  const token = Math.random().toString(36).substring(2, 10) + Date.now().toString(36);

  try {
    // v1.13: se cambia de batch() a runTransaction() — mismo fix aplicado
    // en vaca.html v1.9 a registrarse(). Con batch(), nuevoNum se calculaba
    // a partir de vacaActualData en memoria (caché del panel); si dos
    // admins agregaban participantes casi al mismo tiempo (o un admin
    // agregaba mientras alguien se autoconfirmaba desde vaca.html), ambas
    // escrituras podían pisarse y dejar numParticipantes desincronizado
    // del número real de documentos. La transacción lee numParticipantes
    // FRESCO desde Firestore justo antes de escribir, y Firestore reintenta
    // solo si detecta que otro cliente escribió de por medio.
    const resultado = await db.runTransaction(async (tx) => {
      const vacaSnap = await tx.get(vacaRef);
      if (!vacaSnap.exists) throw new Error('Esta vaca ya no existe.');
      const freshData = vacaSnap.data();

      const partRef = vacaRef.collection('participantes').doc();
      const nuevoNum = (freshData.numParticipantes || 0) + 1;
      const meta = freshData.meta_total || 0;
      const cuotaRecalc = nuevoNum > 0 ? meta / nuevoNum : meta;

      tx.set(partRef, {
        nombre,
        contacto,
        paisCodigo,
        fechaRegistro: firebase.firestore.FieldValue.serverTimestamp(),
        totalAbonado: 0,
        linkToken: token
      });
      tx.update(vacaRef, {
        numParticipantes: nuevoNum,
        cuota_fija: cuotaRecalc
      });

      return { nuevoNum, cuotaRecalc };
    });

    cerrarModal('modalNuevoParticipante');
    mostrarToast('✅ Participante agregado — cuota recalculada');
    vacaActualData.numParticipantes = resultado.nuevoNum;
    vacaActualData.cuota_fija = resultado.cuotaRecalc;
    document.getElementById('detalleMeta').textContent =
      `Meta: ${formatCOP(vacaActualData.meta_total || 0)} · Cuota vigente: ${formatCOP(resultado.cuotaRecalc)} · ${resultado.nuevoNum} participante(s)`;
  } catch (err) {
    mostrarToast('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Agregar';
  }
}

// ===== ELIMINAR PARTICIPANTE (v1.10) =====
// Mismo patrón cascada de eliminarVaca(): borra primero los abonos del
// participante y luego el participante, en un solo batch. Recalcula
// numParticipantes y cuota_fija (meta_total / nuevo num) igual que
// crearParticipante(), con valores explícitos en la misma escritura.
// totalRecaudado NO se ajusta aquí de forma explícita — la auto-sanación
// que ya existe en cargarParticipantes() (onSnapshot) lo recalcula solo
// apenas se refresque la lista, sumando lo que quede de los demás.
// v1.13: el borrado de abonos se mantiene como get() previo (son
// documentos hijos del participante que de todas formas va a
// desaparecer, no hay condición de carrera posible ahí). Lo que sí pasa
// a runTransaction() es el delete del participante + el recálculo de
// numParticipantes/cuota_fija en el doc de la vaca, para que dos admins
// eliminando participantes casi al mismo tiempo (o una eliminación
// cruzándose con un alta desde crearParticipante()/registrarse()) no se
// pisen entre sí — mismo motivo que el fix de crearParticipante() arriba.
async function eliminarParticipante(participanteId, nombre, btnEl) {
  if (!vacaActualId || !vacaActualData) return;
  if (!confirm(`¿Eliminar a "${nombre}" de esta vaca? Se borrarán también sus abonos registrados. Esta acción no se puede deshacer.`)) return;

  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '…'; }

  const vacaRef = db.collection('vacas').doc(vacaActualId);
  const partRef = vacaRef.collection('participantes').doc(participanteId);

  try {
    const abonosSnap = await partRef.collection('abonos').get();

    const resultado = await db.runTransaction(async (tx) => {
      const vacaSnap = await tx.get(vacaRef);
      if (!vacaSnap.exists) throw new Error('Esta vaca ya no existe.');
      const freshData = vacaSnap.data();

      const nuevoNum = Math.max(0, (freshData.numParticipantes || 0) - 1);
      const meta = freshData.meta_total || 0;
      const cuotaRecalc = nuevoNum > 0 ? meta / nuevoNum : meta;

      abonosSnap.forEach(aDoc => tx.delete(aDoc.ref));
      tx.delete(partRef);
      tx.update(vacaRef, { numParticipantes: nuevoNum, cuota_fija: cuotaRecalc });

      return { nuevoNum, cuotaRecalc };
    });

    vacaActualData.numParticipantes = resultado.nuevoNum;
    vacaActualData.cuota_fija = resultado.cuotaRecalc;
    document.getElementById('detalleMeta').textContent =
      `Meta: ${formatCOP(vacaActualData.meta_total || 0)} · Cuota vigente: ${formatCOP(resultado.cuotaRecalc)} · ${resultado.nuevoNum} participante(s)`;
    mostrarToast('🗑️ Participante eliminado — cuota recalculada');
  } catch (err) {
    mostrarToast('Error al eliminar: ' + err.message);
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '🗑️'; }
  }
}

// v1.15: sube un archivo a Cloudinary (unsigned) y devuelve la secure_url.
// Si Cloudinary responde con error (ej. preset mal escrito, tipo de
// archivo no permitido), se propaga el mensaje real de su API en vez de
// uno genérico, para poder diagnosticar rápido si algo falla.
// v1.16: miniatura + lightbox de comprobantes. cloudinaryThumb() no pide
// nada nuevo a Cloudinary — solo inserta parámetros de transformación en
// la misma URL que ya se guardó (Cloudinary la genera al vuelo, no
// consume espacio de almacenamiento extra). Si por algo la URL no tiene
// el patrón esperado (ej. viene de otro origen en el futuro), devuelve
// la URL tal cual, sin miniatura.
function cloudinaryThumb(url, size) {
  if (!url) return url;
  const marcador = '/upload/';
  const i = url.indexOf(marcador);
  if (i === -1) return url;
  const inicio = i + marcador.length;
  return url.slice(0, inicio) + `w_${size},h_${size},c_fill,q_auto,f_auto/` + url.slice(inicio);
}

function abrirLightbox(url) {
  if (!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxComprobante').classList.add('show');
}

function cerrarLightbox() {
  document.getElementById('lightboxComprobante').classList.remove('show');
  document.getElementById('lightboxImg').src = '';
}

async function subirComprobante(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

  const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  });
  const data = await resp.json();
  if (!resp.ok) {
    throw new Error(data?.error?.message || 'No se pudo subir el comprobante');
  }
  return data.secure_url;
}

async function guardarAbono() {
  const monto = parseFloat(document.getElementById('abonoMonto').value) || 0;
  const fecha = document.getElementById('abonoFecha').value;
  const nota  = document.getElementById('abonoNota').value.trim();
  const archivo = document.getElementById('abonoComprobante').files[0] || null;

  if (monto <= 0) { mostrarToast('⚠️ Ingresa un monto válido'); return; }
  if (!fecha) { mostrarToast('⚠️ Selecciona la fecha'); return; }
  if (!vacaActualId) return;

  const btn = document.getElementById('abonoBtnGuardar');
  const textoOriginalBtn = btn.textContent;
  btn.disabled = true;

  // v1.15: si el admin eligió un archivo, se sube primero a Cloudinary
  // (unsigned) y se usa esa URL. Si NO eligió archivo, comprobanteUrl
  // conserva lo que ya había (abonoEditComprobanteUrl, seteado por
  // editarAbono()) — en modo creación queda simplemente null. Si la
  // subida falla, se corta acá y no se escribe nada en Firestore, para
  // no dejar un abono guardado sin su comprobante sin que el admin se
  // entere.
  let comprobanteUrl = abonoEditComprobanteUrl;
  if (archivo) {
    btn.textContent = 'Subiendo comprobante…';
    try {
      comprobanteUrl = await subirComprobante(archivo);
    } catch (err) {
      mostrarToast('Error al subir comprobante: ' + err.message);
      btn.disabled = false;
      btn.textContent = textoOriginalBtn;
      return;
    }
  }
  btn.textContent = 'Guardando…';

  // v1.10: MODO EDICIÓN — el modal de abono se reutiliza también para
  // editar un abono existente desde el historial (editarAbono() marca
  // abonoEditId antes de abrir este mismo modal). Se ajusta totalAbonado
  // y totalRecaudado por el DELTA (nuevo monto - monto anterior), no por
  // el monto completo, para no duplicar el efecto del abono ya contado.
  if (abonoEditId) {
    if (!abonoEditParticipanteId) return;
    const partRef = db.collection('vacas').doc(vacaActualId).collection('participantes').doc(abonoEditParticipanteId);
    const abonoRef = partRef.collection('abonos').doc(abonoEditId);
    const vacaRef  = db.collection('vacas').doc(vacaActualId);

    abonoRef.get()
      .then(snap => {
        const anterior = snap.exists ? (snap.data().monto || 0) : 0;
        const delta = monto - anterior;
        const batch = db.batch();
        batch.update(abonoRef, { monto, fecha, nota, comprobanteUrl: comprobanteUrl || null });
        if (delta !== 0) {
          batch.update(partRef, { totalAbonado: firebase.firestore.FieldValue.increment(delta) });
          batch.update(vacaRef, { totalRecaudado: firebase.firestore.FieldValue.increment(delta) });
        }
        return batch.commit();
      })
      .then(() => {
        cerrarModal('modalAbono');
        mostrarToast('✅ Abono actualizado');
        const partId = abonoEditParticipanteId;
        const nombre = document.getElementById('abonosListNombre').textContent.replace('👤 ', '');
        abonoEditId = null;
        abonoEditParticipanteId = null;
        abonoEditComprobanteUrl = null;
        abrirModalAbonosList(partId, nombre);
      })
      .catch(err => mostrarToast('Error: ' + err.message))
      .finally(() => { btn.disabled = false; btn.textContent = textoOriginalBtn; });
    return;
  }

  // MODO CREACIÓN (igual que antes)
  if (!participanteAbonoId) { btn.disabled = false; btn.textContent = textoOriginalBtn; return; }

  const partRef = db.collection('vacas').doc(vacaActualId)
                    .collection('participantes').doc(participanteAbonoId);
  const vacaRef = db.collection('vacas').doc(vacaActualId);

  const batch = db.batch();

  const abonoRef = partRef.collection('abonos').doc();
  batch.set(abonoRef, {
    monto,
    fecha,
    nota,
    comprobanteUrl: comprobanteUrl || null,
    registradoPor: auth.currentUser.email,
    creadoEn: firebase.firestore.FieldValue.serverTimestamp()
  });

  batch.update(partRef, {
    totalAbonado: firebase.firestore.FieldValue.increment(monto)
  });

  // v1.4: se denormaliza el total recaudado en el doc raíz de la vaca
  // (mismo patrón que numParticipantes) para que vaca.html pueda mostrar
  // el progreso global con un simple get() del doc de la vaca, sin
  // necesitar `list` sobre participantes (que las Rules bloquean a
  // propósito sin login, para no exponer nombres/contactos de terceros).
  batch.update(vacaRef, {
    totalRecaudado: firebase.firestore.FieldValue.increment(monto)
  });

  batch.commit()
    .then(() => {
      cerrarModal('modalAbono');
      mostrarToast('💰 Abono registrado');
      participanteAbonoId = null;
    })
    .catch(err => mostrarToast('Error: ' + err.message))
    .finally(() => { btn.disabled = false; btn.textContent = textoOriginalBtn; });
}

// ===== HISTORIAL DE ABONOS / EDITAR / ELIMINAR (v1.10) =====
function abrirModalAbonosList(participanteId, nombre) {
  abonosListParticipanteId = participanteId;
  document.getElementById('abonosListNombre').textContent = '👤 ' + nombre;
  document.getElementById('abonosListCont').innerHTML = '<div class="loading"><div class="spinner"></div> Cargando…</div>';
  abrirModal('modalAbonosList');

  db.collection('vacas').doc(vacaActualId)
    .collection('participantes').doc(participanteId)
    .collection('abonos')
    .orderBy('creadoEn', 'desc')
    .get()
    .then(snap => {
      const cont = document.getElementById('abonosListCont');
      if (snap.empty) {
        cont.innerHTML = '<div class="empty-state"><p>Sin abonos registrados.</p></div>';
        return;
      }
      let html = '<div class="abonos-admin-lista">';
      snap.forEach(doc => {
        const a = doc.data();
        const notaAttr = escapeHtml((a.nota || '')).replace(/'/g, '&#39;');
        const comprobanteAttr = (a.comprobanteUrl || '').replace(/'/g, '&#39;');
        html += `<div class="abono-admin-item">
          ${a.comprobanteUrl ? `<img class="comprobante-thumb" src="${cloudinaryThumb(a.comprobanteUrl, 100)}" alt="Comprobante" onclick="abrirLightbox('${comprobanteAttr}')" />` : ''}
          <div>
            <div style="font-weight:700">${formatCOP(a.monto)}</div>
            <div style="font-size:11px;color:var(--text2)">${a.fecha || '—'}${a.nota ? ' · ' + escapeHtml(a.nota) : ''}</div>
          </div>
          <div class="acciones-td">
            <button class="btn btn-ghost btn-sm" onclick='editarAbono("${doc.id}", ${a.monto || 0}, "${a.fecha || ''}", "${notaAttr}", "${comprobanteAttr}")'>✏️</button>
            <button class="btn btn-danger btn-sm" onclick='eliminarAbono("${doc.id}", ${a.monto || 0})'>🗑️</button>
          </div>
        </div>`;
      });
      html += '</div>';
      cont.innerHTML = html;
    })
    .catch(err => {
      document.getElementById('abonosListCont').innerHTML = `<div class="empty-state"><p>Error: ${err.message}</p></div>`;
    });
}

function editarAbono(abonoId, monto, fecha, nota, comprobanteUrl) {
  abonoEditId = abonoId;
  abonoEditParticipanteId = abonosListParticipanteId;
  abonoEditComprobanteUrl = comprobanteUrl || null; // v1.15: se conserva si no se sube uno nuevo
  document.getElementById('abonoParticipanteNombre').textContent = '✏️ Editar abono — ' + document.getElementById('abonosListNombre').textContent.replace('👤 ', '');
  document.getElementById('abonoBtnGuardar').textContent = 'Guardar cambios';
  document.getElementById('abonoMonto').value = monto;
  document.getElementById('abonoFecha').value = fecha;
  document.getElementById('abonoNota').value = nota;
  document.getElementById('abonoComprobante').value = '';
  document.getElementById('abonoComprobanteActual').innerHTML = comprobanteUrl
    ? `📎 Ya tiene comprobante — <a href="${comprobanteUrl}" target="_blank" style="color:var(--accent)">verlo</a>. Sube uno nuevo solo si quieres reemplazarlo.`
    : '';
  abrirModal('modalAbono');
}

function eliminarAbono(abonoId, monto) {
  if (!vacaActualId || !abonosListParticipanteId) return;
  if (!confirm('¿Eliminar este abono? Esta acción no se puede deshacer.')) return;

  const partRef  = db.collection('vacas').doc(vacaActualId).collection('participantes').doc(abonosListParticipanteId);
  const abonoRef = partRef.collection('abonos').doc(abonoId);
  const vacaRef  = db.collection('vacas').doc(vacaActualId);

  const batch = db.batch();
  batch.delete(abonoRef);
  batch.update(partRef, { totalAbonado: firebase.firestore.FieldValue.increment(-monto) });
  batch.update(vacaRef, { totalRecaudado: firebase.firestore.FieldValue.increment(-monto) });

  batch.commit()
    .then(() => {
      mostrarToast('🗑️ Abono eliminado');
      const nombre = document.getElementById('abonosListNombre').textContent.replace('👤 ', '');
      abrirModalAbonosList(abonosListParticipanteId, nombre);
    })
    .catch(err => mostrarToast('Error: ' + err.message));
}

// ===== NOTIFICAR POR WHATSAPP (v1.10, país explícito desde v1.11) =====
// Abre WhatsApp Web/app con un mensaje prellenado que incluye el link
// personal del participante (mismo link que genera copiarLink()). No
// hay envío automático — el admin revisa el mensaje y lo manda desde su
// propio WhatsApp.
// v1.11: usa paisCodigo guardado en el doc del participante (elegido en
// el registro público o en el modal Nuevo Participante) en vez de
// adivinar por cantidad de dígitos — eso fallaba con números de 10
// dígitos de países que no son Colombia (ej. EE.UU./Canadá). Para
// participantes creados ANTES de este cambio (sin paisCodigo guardado)
// se mantiene el fallback viejo: si el número tiene 10 dígitos exactos
// se asume Colombia (+57); si no, se usa tal cual (se asume que ya
// incluye código de país).
function notificarWhatsApp(vacaId, participanteId, nombre, contacto, paisCodigo) {
  const soloNumeros = (contacto || '').replace(/\D/g, '');
  if (!soloNumeros) { mostrarToast('⚠️ Este participante no tiene contacto válido'); return; }

  const base = window.location.origin + window.location.pathname.replace('vacas.html', '');
  const url  = `${base}vaca.html?id=${vacaId}&p=${participanteId}`;
  const nombreVaca = (vacaActualData && vacaActualData.nombre) || 'la vaca';
  const msg = `Hola ${nombre}! Te comparto tu link personal para ver tu saldo en "${nombreVaca}": ${url}`;

  const numeroWa = paisCodigo
    ? paisCodigo + soloNumeros
    : (soloNumeros.length === 10 ? '57' + soloNumeros : soloNumeros);

  window.open(`https://wa.me/${numeroWa}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ===== COPIAR LINK =====
function copiarLink(vacaId, participanteId) {
  const base = window.location.origin + window.location.pathname.replace('vacas.html', '');
  const url  = `${base}vaca.html?id=${vacaId}&p=${participanteId}`;
  navigator.clipboard.writeText(url)
    .then(() => mostrarToast('🔗 Link copiado'))
    .catch(() => mostrarToast('No se pudo copiar el link'));
}

// v1.12: abre directo el portal del participante en pestaña nueva, sin
// pasar por copiar/pegar — útil para que el admin verifique cómo se ve
// el saldo de alguien sin salir del panel. Mismo cálculo de URL que
// copiarLink(), no se tocó esa función.
function abrirLinkParticipante(vacaId, participanteId) {
  const base = window.location.origin + window.location.pathname.replace('vacas.html', '');
  const url  = `${base}vaca.html?id=${vacaId}&p=${participanteId}`;
  window.open(url, '_blank');
}

// v1.7: link de invitación general (sin &p=) — se manda a todo el grupo
// por WhatsApp/correo, cada quien lo abre y confirma si quiere unirse
// desde vaca.html (ver confirmarParticipacion()).
function copiarLinkInvitacion() {
  if (!vacaActualId) return;
  const base = window.location.origin + window.location.pathname.replace('vacas.html', '');
  const url  = `${base}vaca.html?id=${vacaActualId}`;
  navigator.clipboard.writeText(url)
    .then(() => mostrarToast('🔗 Link de invitación copiado'))
    .catch(() => mostrarToast('No se pudo copiar el link'));
}

// ===== UTILIDADES UI =====
function abrirModal(id) {
  document.getElementById(id).classList.add('show');
}
function cerrarModal(id) {
  document.getElementById(id).classList.remove('show');
}

let toastTimer;
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Cerrar modales con click fuera
document.addEventListener('click', e => {
  ['modalNuevaVaca', 'modalNuevoParticipante', 'modalAbono'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.classList.contains('show') && e.target === el) cerrarModal(id);
  });
});
</script>
